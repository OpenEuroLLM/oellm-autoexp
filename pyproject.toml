[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "oellm-autoexp"
version = "0.2.1"
description = "Unified orchestration for OELLM training sweeps and monitoring."
readme = "README.md"
authors = [
  { name = "OpenEuroLLM" }
]
license = { text = "Apache-2.0" }
requires-python = ">=3.10"
dependencies = [
  "compoconf>=0.3.1",
  # Hydra-compatible composition (~100x faster sweeps, no ANTLR); it serves
  # `import hydra` / `import omegaconf` through its shim (oellm_autoexp/__init__.py).
  "hydra-fast>=0.1.0",
  "pydantic>=2.0",
  "jsonschema>=4.17",
  "networkx>=3.0",
  "tyro>=1.0.8",
  "tqdm>=4.65.0",
]

[project.optional-dependencies]
# Upstream Hydra / OmegaConf instead of hydra-fast (set OELLM_HYDRA_FAST=0).
hydra-upstream = [
  "hydra-core>=1.3",
  "omegaconf>=2.3",
]
megatron = [
  "torch",
  "transformers",
  "six"
]

titan = [
  "torch",
]

dev = [
  "pytest>=7.4",
  "pytest-asyncio>=0.21",
  "pytest-mock>=3.10",
  "pytest-cov>=4.1",
  "ruff>=0.1",
  "mypy>=1.7",
  "pre-commit>=3.7",
]

[tool.hatch.metadata]
allow-direct-references = true

[tool.hatch.build.targets.wheel]
packages = ["oellm_autoexp"]

[tool.ruff]
line-length = 100
target-version = "py310"
exclude = ["submodules"]
ignore = ["E203"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--cov=oellm_autoexp --cov-report=term-missing -q"
norecursedirs = ["tests/monitor/tests", "tests/monitor/src"]

[tool.flake8]
ignore = "E203,W503"
