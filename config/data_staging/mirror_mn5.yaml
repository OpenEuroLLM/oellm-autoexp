# @package _global_
# OPTIONAL node-local data prefetch for Megatron HybridModel runs on MareNostrum 5 (not on by
# default anywhere). Add to a run with:  +data_staging=mirror_mn5
#
# What it does (oellm_autoexp/data_staging/, docs/todo.md, branch data_prefetch_shuffle):
# - pretrain_hybrid runs through scripts/pretrain_hybrid_prefetch.py, which patches Megatron's
#   IndexedDataset to read through a node-local sparse mirror (/scratch, filled in the
#   background) -- byte-identical at any fill state, GPFS for blocks not staged yet;
# - the global shuffle becomes a K-lane windowed shuffle (locality: the prefetcher reads big
#   sequential chunks), and the cyclic sampler reads that order sequentially, repeating at the
#   end (Megatron's cyclic randperm would undo the locality);
# - local rank 0 of each node starts scripts/prefetch_warm.py (lanes mode) inside the container,
#   paced by a consumption cursor (bounded disk: lookahead / retain rounds).
# The data order differs from the stock run (same data, windowed shuffle): compare runs with the
# same setting only. Sets a per-run backend.megatron.data_cache_path (the bases share one): the
# prefetcher discovers the index hashes there. Expected to matter for many concurrent
# small runs on GPFS more than for one large run.
backend:
  launcher_script: ./scripts/pretrain_hybrid_prefetch.py
  megatron:
    # per run: the prefetcher discovers the run's index hashes in its cache (the bases use the
    # shared cache)
    data_cache_path: ${job.base_output_dir}/data_cache
  env:
    OELLM_PREFETCH_AUTOSTART: "1"
    OELLM_PREFETCH_CLEAN_SCRATCH: "1"
    OELLM_MIRROR_DIR: "/scratch/tmp/$SLURM_JOB_ID/oellm_mirror"
    OELLM_CURSOR_FILE: "/scratch/tmp/$SLURM_JOB_ID/oellm_mirror/cursor"
    OELLM_SHUFFLE_LANES: "256"
    OELLM_SHUFFLE_BLOCK: "8192"
    OELLM_LOOKAHEAD_BLOCKS: "3"
    OELLM_RETAIN_BLOCKS: "1"
    OELLM_PREFETCH_BARRIER: "1"
    OELLM_PREFETCH_BARRIER_TIMEOUT: "300"
    # per-split data (datamix4 / flag): every document of a train prefix is train data
    OELLM_TRAIN_DOC_FRAC: "1.0"
    PREFETCH_MODE: lanes
    PREFETCH_THREADS: "8"
    PREFETCH_LANE_BLOCK: "32768"
    PREFETCH_BUDGET_GB: "300"
    PREFETCH_PASSES: "1"

container:
  bind: ["/gpfs", "/scratch"]
