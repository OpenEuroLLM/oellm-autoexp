# @package _global_

# 50M dense model — LR × GBSZ hyperparameter sweep with pull-based autocooldown
# Outer product: (3 lr × 3 gbsz) × (stable + decay) = 18 total jobs

defaults:
  - /backend: megatron_torchrun
  - /container: leonardo
  - /slurm: leonardo
  - /job: default
  - /sweep: none
  - /backend/megatron: base
  - _self_

stage: ""

job:
  name: "dense_50M_lr${backend.megatron.lr}_gbsz${backend.megatron.global_batch_size}_${stage}"
  base_output_dir: "results/sweeps/lr_gbsz/${job.name}"

backend:
  megatron:
    wandb_exp_name: "${job.name}"
    wandb_project: lr-gbsz-sweep
    wandb_entity: openeurollm-project
    wandb_save_dir: "${job.base_output_dir}"
    tensorboard_dir: "${job.base_output_dir}/tensorboard"

    # DATA
    data_path: [
      /leonardo_work/OELLM_prod2026/preprocessed/gpt-neox-20b/nemotron-cc/1.0/high-actual,
      /leonardo_work/OELLM_prod2026/preprocessed/gpt-neox-20b/nemotron-cc/1.0/high-synthetic-distill,
      /leonardo_work/OELLM_prod2026/preprocessed/gpt-neox-20b/nemotron-cc/1.0/high-synthetic-diverse_qa_pairs,
      /leonardo_work/OELLM_prod2026/preprocessed/gpt-neox-20b/nemotron-cc/1.0/high-synthetic-extract_knowledge,
      /leonardo_work/OELLM_prod2026/preprocessed/gpt-neox-20b/nemotron-cc/1.0/high-synthetic-knowledge_list,
      /leonardo_work/OELLM_prod2026/preprocessed/gpt-neox-20b/nemotron-cc/1.0/high-synthetic-wrap_medium
    ]
    data_cache_path: /leonardo_scratch/large/userexternal/donutu00/MEGATRON_CACHEDIR
    seq_length: 4096
    max_position_embeddings: 4096
    vocab_file: /leonardo_work/OELLM_prod2026/models/EleutherAI/gpt-neox-20b/vocab.json
    merge_file: /leonardo_work/OELLM_prod2026/models/EleutherAI/gpt-neox-20b/merges.txt
    num_workers: 8
    split: '99,1,0'
    legacy_tokenizer: True

    # MODEL: 50M
    num_layers: 12
    hidden_size: 384
    ffn_hidden_size: 1536
    num_attention_heads: 6
    num_query_groups: ${.num_attention_heads}
    init_method_std: 0.02
    position_embedding_type: "rope"
    rotary_base: 10000
    rotary_percent: 1.0
    attention_dropout: 0.0
    hidden_dropout: 0.0
    normalization: RMSNorm
    norm_epsilon: 1.e-5
    qk_layernorm: True
    bf16: True
    swiglu: True
    untie_embeddings_and_output_weights: False
    use_flash_attn: True
    attention_softmax_in_fp32: False

    # TRAINING, PARALLELISM
    recompute_activations: False
    use_torch_fsdp2: False
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: True

    distributed_backend: nccl
    distributed_timeout_minutes: 10

    # DISTRIBUTED OPTIM
    use_distributed_optimizer: True

    # OPTIMIZER
    optimizer: adam
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.e-8
    clip_grad: 1.0
    weight_decay: 0.1

    # SCHEDULER
    min_lr: 1.e-05
    lr_decay_style: WSD
    lr_wsd_decay_style: linear
    lr_warmup_iters: 200

    # PROFILE
    profile: False
    use_pytorch_profiler: False
    profile_ranks: [0]
    profile_step_start: 5
    profile_step_end: 12

    # EVALS
    eval_interval: 1100
    eval_iters: 100

    # LOGGING
    log_interval: 10
    log_progress: True
    log_throughput: True
    tensorboard_queue_size: 5
    log_timers_to_tensorboard: True

    # CHECKPOINT FORMAT
    ckpt_format: "torch_dist"
    save_interval: 500
    save: ${job.base_output_dir}/checkpoints

    # Base values — overridden by the sweep below
    micro_batch_size: 8
    global_batch_size: 256   # placeholder; overridden by sweep
    lr: 3.0e-4               # placeholder; overridden by sweep

    aux:
      tokens: 200_000_000
      decay_fraction: 0.0
      start_iter: 0
      start_iter_round: 0

slurm:
  sbatch:
    nodes: "${oc.eval:'int(${backend.megatron.global_batch_size}//(${backend.megatron.micro_batch_size}*${slurm.sbatch.gpus_per_node}))'}"

# ─────────────────────────────────────────────────────────
# SWEEP: product of (LR × GBSZ) × stages
# 3 lr × 3 gbsz = 9 hp configs
# each hp config gets: 1 stable + 1 decay = 2 stages
# total: 9 × 2 = 18 jobs
# ─────────────────────────────────────────────────────────
sweep:
  type: product

  groups:
    # ── Group 0: job name (must be escaped so it resolves after hp values are set) ──
    - type: list
      configs:
        - job.name: "dense_50M_lr\\${backend.megatron.lr}_gbsz\\${backend.megatron.global_batch_size}_\\${stage}"
          backend.megatron.wandb_exp_name: "\\${job.name}"

    # ── Group 1: LR × GBSZ grid ─────────────────────────────────────────────────
    - type: product
      params:
        backend.megatron.lr: [1.0e-4, 3.0e-4, 6.0e-4]
        backend.megatron.global_batch_size: [128,    256,    512   ]

    # ── Group 2: stages (stable + decay) ────────────────────────────────────────
    - type: list
      configs:
        # STABLE PHASE
        - stage: stable
          backend.megatron.aux.tokens: 200_000_000_000
          ... 

        # DECAY PHASE(S)
        - type: list
          defaults:
            backend.megatron.aux.decay_fraction: 0.2
            ...

          configs:
            - stage: decay100BT
              backend.megatron.aux.tokens: 100_000_000_000
