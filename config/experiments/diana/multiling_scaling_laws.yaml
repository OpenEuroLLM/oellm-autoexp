    data_cache_path: /flash/project_465002530/users/dianaonutu/multiling_mix_cache
    split: "99,1,0"
    tokenizer_type: HuggingFaceTokenizer
    tokenizer_model: openeurollm/tokenizer-256k
    make_vocab_size_divisible_by: 128
    num_workers: 7
    num_dataset_builder_threads: 7
    trust_remote_code: true

    # Qwen3 dense-like 1.4B model
    num_layers: 28
    hidden_size: 2048
    ffn_hidden_size: 6144
    num_attention_heads: 16
    group_query_attention: true
    num_query_groups: 8
    untie_embeddings_and_output_weights: false
    init_method_std: 0.02
    seq_length: 4096
    max_position_embeddings: 4096
    position_embedding_type: rope
    rotary_base: 10000
    kv_channels: 128
    add_bias_linear: false
    attention_dropout: 0.0
    hidden_dropout: 0.0
    normalization: RMSNorm
    qk_layernorm: true
    bf16: true
    swiglu: true
    attention_softmax_in_fp32: false
    masked_softmax_fusion: false
    gradient_accumulation_fusion: false

    # Parallelism and batches
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    sequence_parallel: true
    use_distributed_optimizer: true
    micro_batch_size: 2
    global_batch_size: 2048
    distributed_timeout_minutes: 10

    # Optimizer and 300B-token WSD schedule
    optimizer: adam
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1.0e-8
    lr: 0.0019
    min_lr: 0.0
    lr_decay_style: WSD
    lr_wsd_decay_style: linear
    lr_warmup_iters: 2000
    train_iters: "${oc.eval:'(${aux.train_tokens}+${.seq_length}*${.global_batch_size}-1)//(${.seq_length}*${.global_batch_size})'}"
    lr_decay_iters: ${.train_iters}
    lr_wsd_decay_iters: "${oc.eval:'${.train_iters}//5'}"
    clip_grad: 1.0
    weight_decay: 0.1
    dataloader_type: single

    # Saving, evaluation, and logging
    ckpt_format: torch_dist
    save: ${job.base_output_dir}
    load: null
    save_interval: 2000
    eval_interval: 2000
    eval_iters: 100
    log_interval: 1
    log_throughput: true
    log_progress: true
    log_timers_to_tensorboard: true
    tensorboard_queue_size: 1000
    tensorboard_dir: ${job.base_output_dir}/tensorboard
    wandb_project: multilingual-prediction
    wandb_exp_name: 1.4B-autoexp-openeurollm-256k
    wandb_save_dir: ${job.base_output_dir}

  env:
    TOKENIZERS_PARALLELISM: "false"
    HF_HUB_OFFLINE: "1"
    TRITON_HOME: /tmp/triton_cache

