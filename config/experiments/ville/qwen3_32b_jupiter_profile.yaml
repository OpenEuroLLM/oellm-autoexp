# @package _global_

defaults:
  - /experiments/base
  - /backend: megatron_torchrun_localaddr
  - /container: jupiter
  - /slurm: jupiter
  - /backend/megatron: [base, qwen3_32B]
  - /sweep: none
  - _self_

aux:
  experiment_group: "qwen3-32b"

backend:
  megatron:
    train_iters: 10
    log_interval: 1
    eval_interval: 999
    eval_iters: 0
    save: null
    load: null
    log_timers_to_tensorboard: true
    log_throughput: true
    timing_log_level: 2
    timing_log_option: minmax
    log_straggler: true
    straggler_minmax_count: 4
    log_progress: false

    # Pytorch profiler
    profile: true
    profile_ranks: [0, 1, 2, 3]
    profile_step_start: 8
    profile_step_end: 10
    use_pytorch_profiler: true

    # DATA
    dataloader_type: single
    padded_vocab_size: 262144
    global_batch_size: 256
    micro_batch_size: 2

    pipeline_model_parallel_size: 2
    tensor_model_parallel_size: 4
    num_layers_per_virtual_pipeline_stage: 2
    sequence_parallel: true
    recompute_activations: false

    attention_softmax_in_fp32: false
    use_distributed_optimizer: true
    overlap_grad_reduce: true
    overlap_param_gather: true
    tp_comm_overlap: true

    cross_entropy_loss_fusion: true
    cross_entropy_fusion_impl: te

    wandb_project: qwen3-32B-dense-scaling-jupiter
    wandb_entity: openeurollm-project

    data_path:
      - /e/project1/e-sta-openeurollm/harmsen1/datasets/FineWeb/fineweb-10BT_text_document
    data_cache_path: /e/scratch/e-sta-openeurollm/${oc.env:USER}/data
    tokenizer_model: /e/scratch/e-sta-openeurollm/harmsen1/hf_home/hub/models--openai-community--gpt2/snapshots/607a30d783dfa663caf39e06633721c8d4cfcd7e

  env:
    TOKENIZERS_PARALLELISM: "false"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    PYTHONWARNINGS: "ignore::UserWarning"
    NCCL_NET_GDR_LEVEL: "0"
    CUDA_DEVICE_MAX_CONNECTIONS: "1"
    TRITON_LIBCUDA_PATH: "/usr/local/cuda/compat/lib.real"
    UB_SKIPMC: "1"
    NCCL_DEBUG: INFO
    NCCL_DEBUG_SUBSYS: ALL
    NCCL_DEBUG_FILE: ${job.base_output_dir}/nccl-%h.%p.log

container:
  image: /e/project1/e-sta-openeurollm/container/nemo_26.04.sif
job:
  name: profile_qwen3_32b_n${slurm.sbatch.nodes}_pp${backend.megatron.pipeline_model_parallel_size}_tp${backend.megatron.tensor_model_parallel_size}_mbs${backend.megatron.micro_batch_size}_gbs${backend.megatron.global_batch_size}_vp${backend.megatron.num_layers_per_virtual_pipeline_stage}_recompute-${backend.megatron.recompute_activations}
  base_output_dir: "${oc.env:OUTPUT_DIR,'./output'}/${aux.experiment_group}/${job.name}"

slurm:
  sbatch:
    nodes: 4
    time: "00:30:00"
sweep:
  type: list
  store_sweep_json: true
  groups:
    - type: list
      configs:
        - slurm.sbatch.nodes: 4
          backend.megatron.global_batch_size: 256
        - slurm.sbatch.nodes: 16
          backend.megatron.global_batch_size: 1024
        - slurm.sbatch.nodes: 32
          backend.megatron.global_batch_size: 2048
