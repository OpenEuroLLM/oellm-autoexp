# @package _global_

defaults:
  - /experiments/base
  - /backend: megatron_torchrun_localaddr
  - /container: jupiter
  - /slurm: jupiter
  - /backend/megatron: [base, qwen3_32B]
  - /sweep: none
  - _self_

aux:
  experiment_group: "profile-qwen3-32b"

backend:
  megatron:
    train_iters: 50
    log_interval: 1
    eval_interval: 999
    eval_iters: 0
    save: null
    load: null
    log_throughput: true
    log_timers_to_tensorboard: true
    timing_log_level: 2
    timing_log_option: minmax
    log_progress: false

    # Pytorch profiler
    profile: true
    profile_ranks: [0, 1, 2, 3]
    profile_step_start: 10
    profile_step_end: 12
    use_pytorch_profiler: true

    # DATA
    dataloader_type: single
    padded_vocab_size: 262144
    global_batch_size: 1024
    micro_batch_size: 2

    pipeline_model_parallel_size: 2
    tensor_model_parallel_size: 4
    num_layers_per_virtual_pipeline_stage: 2
    sequence_parallel: true
    recompute_activations: false

    attention_softmax_in_fp32: false
    use_distributed_optimizer: true
    overlap_grad_reduce: true
    overlap_param_gather: true
    tp_comm_overlap: true
    use_sharp: true
    cross_entropy_loss_fusion: true
    cross_entropy_fusion_impl: te

    wandb_project: qwen3-32B-dense-scaling-jupiter
    wandb_entity: openeurollm-project

    data_path:
      - /e/project1/e-sta-openeurollm/harmsen1/datasets/FineWeb/fineweb-10BT_text_document
    data_cache_path: /e/fscratch/e-sta-openeurollm/komulainen1/cache/${job.name}/
    tokenizer_model: /e/project1/e-sta-openeurollm/komulainen1_jupiter/hf_cache/hub/models--openeurollm--tokenizer-256k/snapshots/ac1ce776f8a78fc7aa96dfc91ffc1ae6966b2fa1

  env:
    TOKENIZERS_PARALLELISM: "false"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    PYTHONWARNINGS: "ignore::UserWarning"
    NCCL_NET_GDR_LEVEL: "0"  # disable GDRDMA — required for PP=2 inter-node P2P
    CUDA_DEVICE_MAX_CONNECTIONS: "1"  # only for TP
    TRITON_LIBCUDA_PATH: "/usr/local/cuda/compat/lib.real"
    UB_SKIPMC: "1"
    NCCL_DEBUG: INFO
    NCCL_DEBUG_SUBSYS: ALL
    NCCL_DEBUG_FILE: ${job.base_output_dir}/nccl-%h.%p.log

container:
  image: /e/project1/e-sta-openeurollm/container/nemo_26.04.sif
job:
  name: profile_qwen3_32b_n${slurm.sbatch.nodes}_mbs${backend.megatron.micro_batch_size}_gbs${backend.megatron.global_batch_size}
  base_output_dir: "${oc.env:OUTPUT_DIR,'./output'}/${aux.experiment_group}/${job.name}"

slurm:
  sbatch:
    nodes: 16
    time: "00:30:00"
    comment: "NVIDIA_GPU_CLOCKS=1980"
    network: 'sharp'

sweep:
  type: list
  store_sweep_json: true
  groups:
    - type: list
      configs:
        - slurm.sbatch.nodes: 8
          backend.megatron.global_batch_size: 256
        - slurm.sbatch.nodes: 16
          backend.megatron.global_batch_size: 1024
        - slurm.sbatch.nodes: 64
          backend.megatron.global_batch_size: 4096
        - slurm.sbatch.nodes: 256
          backend.megatron.global_batch_size: 4096
