# @package _global_
defaults:
  - /experiments/base
  - /backend: megatron_torchrun_localaddr
  - /container: jupiter
  - /slurm: jupiter
  - /backend/megatron: [base, qwen3_32B]
  - /sweep: none
  - _self_

aux:
  experiment_group: "qwen3-32b-strong-scaling-test"

backend:
  megatron:
    train_iters: 50
    log_interval: 1
    eval_interval: 999
    eval_iters: 0
    save: null
    load: null
    lr_warmup_iters: 0

    # LOGGING
    log_throughput: true
    wandb_project: qwen3-32B-dense-scaling-jupiter
    wandb_entity: openeurollm-project

    # Manual garbage collection
    manual_gc_interval: 50  # 50 is default
    manual_gc: true

    # DATA
    dataloader_type: single
    padded_vocab_size: 262144
    global_batch_size: 4096
    micro_batch_size: 2

    pipeline_model_parallel_size: 2
    pipeline_model_parallel_layout: "Et\\*9\\|t\\*8\\|t\\*8\\|t\\*8\\|t\\*8\\|t\\*8\\|t\\*8\\|t\\*7L"
    tensor_model_parallel_size: 4
    sequence_parallel: true

    use_distributed_optimizer: true
    num_distributed_optimizer_instances: 1

    overlap_grad_reduce: true
    overlap_param_gather: true
    tp_comm_overlap: true

    cross_entropy_loss_fusion: true
    cross_entropy_fusion_impl: te

    data_path:
      - /e/project1/e-sta-openeurollm/harmsen1/datasets/FineWeb/fineweb-10BT_text_document
    data_cache_path: /e/fscratch/e-sta-openeurollm/komulainen1/cache/${job.name}/
    tokenizer_model: /e/fscratch/e-sta-openeurollm/komulainen1/hf_cache/hub/models--openeurollm--tokenizer-256k/snapshots/ac1ce776f8a78fc7aa96dfc91ffc1ae6966b2fa1

  env:
    TOKENIZERS_PARALLELISM: "false"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    PYTHONWARNINGS: "ignore::UserWarning"
    CUDA_DEVICE_MAX_CONNECTIONS: "1"  # only for TP
    TRITON_LIBCUDA_PATH: "/usr/local/cuda/compat/lib.real"
    SHARP_SMX_SOCK_ADDR_FAMILY: ipv4
    UB_SKIPMC: "1"
    NCCL_DEBUG: WARN
    NCCL_DEBUG_SUBSYS: ALL
    NCCL_DEBUG_FILE: ${job.base_output_dir}/nccl-%h.log
    TORCH_CPP_LOG_LEVEL: ERROR
    TORCH_NCCL_SHOW_EAGER_INIT_P2P_SERIALIZATION_WARNING: FALSE
    NCCL_NVLS_ENABLE: 0
    TORCH_AVOID_RECORD_STREAMS: 1


container:
  image: /e/project1/e-sta-openeurollm/container/nemo_26.04.sif
job:
  name: strong_scaling_qwen3_32b_n${slurm.sbatch.nodes}_mbs${backend.megatron.micro_batch_size}_gbs${backend.megatron.global_batch_size}
  base_output_dir: "${oc.env:OUTPUT_DIR,'./output'}/${aux.experiment_group}/${job.name}"

slurm:
  sbatch:
    nodes: 4
    time: "01:00:00"
    account: e-sta-openeurollm
    comment: "NVIDIA_GPU_CLOCKS=1980"

sweep:
  type: list
  store_sweep_json: true
  groups:
    - type: list
      configs:
        - slurm.sbatch.nodes: 8
        - slurm.sbatch.nodes: 16
        - slurm.sbatch.nodes: 32
        - slurm.sbatch.nodes: 64
        - slurm.sbatch.nodes: 128
        #- slurm.sbatch.nodes: 256
        #- slurm.sbatch.nodes: 512
        #  slurm.sbatch.begin: now+30minutes
        #- slurm.sbatch.nodes: 1024
        #  slurm.sbatch.begin: now+1hour
