# @package _global_
defaults:
  - /experiments/base
  - /backend: megatron_torchrun_localaddr
  - /container: jupiter
  - /slurm: jupiter
  - /backend/megatron: [base, qwen3_32B]
  - /sweep: none
  - _self_

aux:
  experiment_group: "qwen3-32b-sweep7"
  variant: ""

backend:
  megatron:
    train_iters: 20
    lr_decay_iters: ${.train_iters}
    log_interval: 1
    eval_interval: 999
    eval_iters: 0
    save: null
    load: null
    log_throughput: true
    lr_warmup_iters: 0

    # DATA
    dataloader_type: single
    padded_vocab_size: 262144
    global_batch_size: 1024
    micro_batch_size: 2

    pipeline_model_parallel_size: 2
    tensor_model_parallel_size: 4
    num_layers_per_virtual_pipeline_stage: 2
    sequence_parallel: true

    attention_softmax_in_fp32: false
    use_distributed_optimizer: true
    overlap_grad_reduce: true
    overlap_param_gather: true
    tp_comm_overlap: true
    cross_entropy_loss_fusion: true
    cross_entropy_fusion_impl: te

    wandb_project: qwen3-32B-dense-scaling-jupiter
    wandb_entity: openeurollm-project

    data_path:
      - /e/project1/e-sta-openeurollm/harmsen1/datasets/FineWeb/fineweb-10BT_text_document
    data_cache_path: /e/scratch/e-sta-openeurollm/${oc.env:USER}/data
    tokenizer_model: /e/project1/e-sta-openeurollm/komulainen1_jupiter/hf_cache/hub/models--openeurollm--tokenizer-256k/snapshots/ac1ce776f8a78fc7aa96dfc91ffc1ae6966b2fa1

  env:
    TOKENIZERS_PARALLELISM: "false"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    PYTHONWARNINGS: "ignore::UserWarning"
    #NCCL_NET_GDR_LEVEL: "0"  # disable GDRDMA — required for PP=2 inter-node P2P
    CUDA_DEVICE_MAX_CONNECTIONS: "1"  # only for TP
    TRITON_LIBCUDA_PATH: "/usr/local/cuda/compat/lib.real"
    SHARP_SMX_SOCK_ADDR_FAMILY: ipv4
    UB_SKIPMC: "1"
    NCCL_DEBUG: WARN
    NCCL_DEBUG_SUBSYS: INIT
    NCCL_DEBUG_FILE: ${job.base_output_dir}/nccl-%h.%p.log

container:
  image: /e/project1/e-sta-openeurollm/container/nemo_26.04.sif
job:
  name: qwen3_32b_n${slurm.sbatch.nodes}_mbs${backend.megatron.micro_batch_size}_gbs${backend.megatron.global_batch_size}_${aux.variant}
  base_output_dir: "${oc.env:OUTPUT_DIR,'./output'}/${aux.experiment_group}/${job.name}"

slurm:
  sbatch:
    nodes: 16
    time: "00:45:00"
    comment: "NVIDIA_GPU_CLOCKS=1980"

sweep:
  type: list
  store_sweep_json: true
  groups:
    - type: list
      configs:
      - slurm.sbatch.nodes: 1024
        backend.megatron.global_batch_size: 8192

      - slurm.sbatch.nodes: 1024
        slurm.sbatch.begin: "now+1hour"
        backend.megatron.global_batch_size: 4096

      - backend.megatron.ddp_bucket_size: 1024000000
        backend.megatron.global_batch_size: 8192
        slurm.sbatch.nodes: 1024
        slurm.sbatch.begin: "now+2hour"
        aux.variant: "ddp_bucket2x"
