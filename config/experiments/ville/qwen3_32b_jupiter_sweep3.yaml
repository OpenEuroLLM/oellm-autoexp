# @package _global_
# Real-data 4-node qwen3-32B throughput sweep for JUPITER GH200.
defaults:
  - /experiments/base
  - /backend: megatron_torchrun_localaddr
  - /container: jupiter
  - /slurm: jupiter
  - /backend/megatron: [base, qwen3_32B]
  - /sweep: none
  - _self_

aux:
  experiment_group: "qwen3-32b"

backend:
  megatron:
    train_iters: 10
    log_interval: 1
    eval_interval: 999
    eval_iters: 0
    save: null
    load: null
    log_throughput: true
    lr_warmup_iters: 0

    # DATA
    dataloader_type: single
    padded_vocab_size: 262144
    global_batch_size: 256
    micro_batch_size: 2

    pipeline_model_parallel_size: 2
    tensor_model_parallel_size: 4
    num_layers_per_virtual_pipeline_stage: 2
    recompute_activations: false

    attention_softmax_in_fp32: false
    use_distributed_optimizer: true

    wandb_project: qwen3-32B-dense-scaling-jupiter
    wandb_entity: openeurollm-project

    data_path:
      - /e/project1/e-sta-openeurollm/harmsen1/datasets/FineWeb/fineweb-10BT_text_document
    data_cache_path: /e/scratch/e-sta-openeurollm/${oc.env:USER}/data
    tokenizer_model: /e/scratch/e-sta-openeurollm/harmsen1/hf_home/hub/models--openai-community--gpt2/snapshots/607a30d783dfa663caf39e06633721c8d4cfcd7e

  env:
    TOKENIZERS_PARALLELISM: "false"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    PYTHONWARNINGS: "ignore::UserWarning"
    NCCL_NET_GDR_LEVEL: "0"  # disable GDRDMA — required for PP=2 inter-node P2P
    CUDA_DEVICE_MAX_CONNECTIONS: "1"  # only for TP
    TRITON_LIBCUDA_PATH: "/usr/local/cuda/compat/lib.real"
    NCCL_DEBUG: INFO
    NCCL_DEBUG_SUBSYS: ALL
    NCCL_DEBUG_FILE: ${job.base_output_dir}/nccl-%h.%p.log

container:
  image: /e/project1/e-sta-openeurollm/container/nemo_26.04.sif
job:
  name: qwen3_32b_n${slurm.sbatch.nodes}_pp${backend.megatron.pipeline_model_parallel_size}_tp${backend.megatron.tensor_model_parallel_size}_mbs${backend.megatron.micro_batch_size}_gbs${backend.megatron.global_batch_size}_vp${backend.megatron.num_layers_per_virtual_pipeline_stage}_${aux.variant}
  base_output_dir: "${oc.env:OUTPUT_DIR,'./output'}/${aux.experiment_group}/${job.name}"

slurm:
  sbatch:
    nodes: 4
    time: "00:45:00"
    account: e-sta-openeurollm

sweep:
  type: list
  store_sweep_json: true
  groups:
    - type: list
      configs:
        # Baseline and memory-fit branch.
        - aux.variant: A0_mbs2_baseline
          backend.megatron.micro_batch_size: 2

        - aux.variant: A1_mbs4_no_recompute
          backend.megatron.micro_batch_size: 4

        - aux.variant: A2_mbs4_selective_recompute
          backend.megatron.micro_batch_size: 4
          backend.megatron.recompute_activations: true

        - aux.variant: A3_mbs4_full_uniform1
          backend.megatron.micro_batch_size: 4
          backend.megatron.recompute_granularity: full
          backend.megatron.recompute_method: uniform
          backend.megatron.recompute_num_layers: 1

        - aux.variant: A4_mbs4_full_uniform2
          backend.megatron.micro_batch_size: 4
          backend.megatron.recompute_granularity: full
          backend.megatron.recompute_method: uniform
          backend.megatron.recompute_num_layers: 2


        - aux.variant: A5_mbs4_offload_core_attn
          backend.megatron.micro_batch_size: 4
          backend.megatron.recompute_granularity: full
          backend.megatron.recompute_method: uniform
          backend.megatron.recompute_num_layers: 1
          backend.megatron.fine_grained_activation_offloading: true
          backend.megatron.offload_modules: [core_attn]

        # Communication/overlap branch. These assume the full-uniform MBS=4 candidate fits.
        - aux.variant: B1_mbs4_tp_overlap
          backend.megatron.micro_batch_size: 4
          backend.megatron.recompute_granularity: full
          backend.megatron.recompute_method: uniform
          backend.megatron.recompute_num_layers: 1
          backend.megatron.tp_comm_overlap: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: "1"
          backend.env.UB_SKIPMC: "1"

        - aux.variant: B2_mbs4_tp_overlap_bucket80m
          backend.megatron.micro_batch_size: 4
          backend.megatron.recompute_granularity: full
          backend.megatron.recompute_method: uniform
          backend.megatron.recompute_num_layers: 1
          backend.megatron.tp_comm_overlap: true
          backend.megatron.ddp_bucket_size: 80000000
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: "1"
          backend.env.UB_SKIPMC: "1"

        - aux.variant: B3_mbs4_overlap_opt_step
          backend.megatron.micro_batch_size: 4
          backend.megatron.recompute_granularity: full
          backend.megatron.recompute_method: uniform
          backend.megatron.recompute_num_layers: 1
          backend.megatron.overlap_param_gather_with_optimizer_step: true

        # Precision/fusion branch. Keep separate from the BF16 acceptance path.
        - aux.variant: C1_mbs4_fp8
          backend.megatron.micro_batch_size: 4
          backend.megatron.recompute_granularity: full
          backend.megatron.recompute_method: uniform
          backend.megatron.recompute_num_layers: 1
          backend.megatron.fp8: hybrid
          backend.megatron.fp8_recipe: blockwise
          backend.megatron.fp8_param_gather: true

        - aux.variant: C2_mbs4_fused_ce
          backend.megatron.micro_batch_size: 4
          backend.megatron.recompute_granularity: full
          backend.megatron.recompute_method: uniform
          backend.megatron.recompute_num_layers: 1
          backend.megatron.cross_entropy_loss_fusion: true
          backend.megatron.cross_entropy_fusion_impl: te

        # Megatron FSDP branch. FSDP requires CUDA_DEVICE_MAX_CONNECTIONS != "1".
        - aux.variant: F1_mfsdp_plain
          backend.megatron.micro_batch_size: 4
          backend.megatron.use_megatron_fsdp: true
          backend.megatron.data_parallel_sharding_strategy: optim_grads_params
          backend.megatron.gradient_accumulation_fusion: false
          backend.megatron.calculate_per_token_loss: true
          backend.megatron.ckpt_format: fsdp_dtensor
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: "32"

        - aux.variant: F2_mfsdp_nccl_ub
          backend.megatron.micro_batch_size: 4
          backend.megatron.use_megatron_fsdp: true
          backend.megatron.data_parallel_sharding_strategy: optim_grads_params
          backend.megatron.gradient_accumulation_fusion: false
          backend.megatron.calculate_per_token_loss: true
          backend.megatron.ckpt_format: fsdp_dtensor
          backend.megatron.nccl_ub: true
          backend.megatron.fsdp_double_buffer: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: "32"
