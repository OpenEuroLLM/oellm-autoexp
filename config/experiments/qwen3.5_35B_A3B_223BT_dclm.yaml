      - 0.0000684474
      - /shared_silo/scratch/datasets/tokenized/qwen3.5/megatron/regmix_trainval_2026-09/stack-edu-full/stack-edu-Ruby-s5_text_document.train
      - 0.0011641942
      - /shared_silo/scratch/datasets/tokenized/qwen3.5/megatron/regmix_trainval_2026-09/stack-edu-full/stack-edu-Ruby-s4_text_document.train
      - 0.0053435824
      - /shared_silo/scratch/datasets/tokenized/qwen3.5/megatron/regmix_trainval_2026-09/stack-edu-full/stack-edu-Ruby-s3_text_document.train

    data_cache_path: /shared_silo/scratch/avirtane/data_cache
    split: "1000,0,0"
    eval_iters: 0
    # 43 cold components: index build is ~19 min, well past the
    # inherited 10-minute default. This is a slow build, not the non-terminating
    # test-split hang -- here the timeout genuinely is the fix.
    distributed_timeout_minutes: 60
    num_workers: 7

    # Validated by probe 46339 at exactly these values.
    global_batch_size: 512
    micro_batch_size: 2
    expert_model_parallel_size: 8
    pipeline_model_parallel_size: 1
    use_distributed_optimizer: true
    # MUST be false while the wandb shim is bound. Megatron's track_moe_metrics
    # calls wandb.Histogram for per-layer expert counts (moe_utils.py:1240) and
    # NO shim copy implements it -- rank 63 (the wandb writer rank, world_size-1)
    # dies with AttributeError ~16 min in, before iteration 1. This killed 52992.
    # Audited: Histogram is the ONLY wandb attribute Megatron uses that the shim
    # lacks (Api/init/run/Run are all present). Every prior dashboard-logged run
    # was DENSE 0.8B, which never reaches this code path.
    # Cost is per-layer granularity only: the aggregates are appended before the
    # guard, so moe/expert_dead_count, expert_cv_pct, expert_max_frac and
    # expert_min_entropy_pct (the worst-layer canary) are all still logged.
    moe_per_layer_logging: false
    create_attention_mask_in_dataloader: false
    moe_grouped_gemm: false
    moe_token_dispatcher_type: "alltoall"
    moe_permute_fusion: true
    moe_shared_expert_overlap: true
    overlap_moe_expert_parallel_comm: false
    overlap_param_gather: true
    overlap_grad_reduce: true

    recompute_activations: true
    recompute_granularity: full

    adam_beta2: 0.95
    weight_decay: 0.1

    # 223B tokens at gbs 512: 223e9 / (512*8192) = 53166.5 -> 53167.
    train_iters: 53167
    lr_decay_iters: 53167
    lr_warmup_iters: 100
    lr_decay_style: WSD
    # int(53167 * 0.20) = 10633. Anneal begins at 53167 - 10633 = 42534.
    lr_wsd_decay_iters: 10633
    lr_wsd_decay_style: linear

    moe_aux_loss_coeff: 0.0001
    override_opt_param_scheduler: true
    seed: 1234

    # 42533 = last plateau step (continue from this one). 53167 = final annealed.
    ckpt_format: torch_dist
    save_interval: 1000000
    save_extra_steps:
      - 2384
      - 4768
      - 7153
      - 9537
      - 11921
      - 14305
      - 16689
      - 19073
      - 21458
      - 23842
      - 26226
      - 28610
      - 30994
      - 33379
      - 35763
      - 38147
      - 40531
      - 42533
      - 42915
      - 45300
      - 47684
      - 50068
      - 52452
      - 53167
    save: ${job.base_output_dir}/checkpoints

    load: /shared_silo/scratch/rluukkon/oellm/Megatron-Bridge/megatron_ckpt/Qwen3.5-35B-A3B-Base
    finetune: true
    no_load_optim: true
    no_load_rng: true

    tensorboard_dir: ${job.base_output_dir}/tensorboard
    wandb_save_dir: ${job.base_output_dir}/wandb
    wandb_project: "poro3-cpt"
    wandb_exp_name: "qwen3_5_35B_A3B_223BT_${stage}"

job:
  name: qwen3_5_35B_A3B_223BT_${stage}_${slurm.env.MACHINE_NAME}

# 2x2. The two fwe_ arms inherit the shared blend above (fineweb-edu English).
# The two dclm_ arms override data_path wholesale: identical 43 components with
# the fineweb-edu path swapped for dclm-baseline at the SAME 0.3 weight.
sweep:
  type: list
  groups:
    - type: list
      configs:
        - stage: dclm_lr3e5
          backend.megatron.lr: 3.0e-5
          backend.megatron.min_lr: 3.0e-7
          backend.megatron.router_lr_spec: "1.0e-5"
