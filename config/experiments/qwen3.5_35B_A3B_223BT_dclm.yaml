# @package _global_
# PRODUCTION 223BT CPT: Qwen3.5-35B-A3B-Base, dclm-baseline English, lr 3e-5.
#
# 53,167 iters x gbs 512 x 8192 = 223.0BT on 8 nodes. ~132h (5.5 days) at the
# measured 212M tok/node-hour, i.e. ~1052 node-hours -- more than a typical
# month's budget on its own. This is the expensive one; read the rest of this
# header before submitting. (The 150.0BT / 708 node-hour figures that used to
# be here were from the 35,763-iter draft and were never re-derived.)
#
# SETTINGS CHOSEN FROM THE 10BT MATRIX (6 arms, 3 English sources x 2 LRs):
#   lr 3e-5 -- downstream evals favour it over 5e-5 on English retention
#     (mmlu +0.90pp averaged over 3 mixes, 2.76x its borrowed floor) and on
#     code/math (+1.01pp), while Finnish multiple-choice is FLAT (-0.0004).
#     5e-5 won only flores en->fi (+0.52 BLEU) and post-anneal train loss.
#     Caveat kept in the open: no 10BT arm had a seed replicate, so every floor
#     quoted is borrowed from the 4BT sweep at a different token budget.
#   gbs 512 -- matches every measurement we have (4BT sweep and all six 10BT
#     arms), so the LR evidence transfers directly. The cost is 53,167 iterations
#     rather than 17,882; see the host-RAM note below.
#   dclm-baseline English -- weak lean from the 10BT evals (only cross-source
#     wins were mmlu and multiblimp, ~1.1-1.5x floor). Genuinely unresolved; the
#     three English sources were statistically indistinguishable on everything
#     else. This is a choice, not a finding.
#
# HOST RAM IS THE LIVE RISK. The ROCm 7.1 signal-pool leak is fixed (binds are
# inherited from container.bind below, verified by jobs 52457/52458), but the
# residual 6.2 MB/iter/rank was measured over only 150 iterations. Extrapolated
# over 53,167 iterations that is ~322 GB/rank, ~2575 GB/node of 3023 GB --
# that is 85%, NOT the 65% previously stated here (which was 35,763 iters).
# 85% on an unvalidated linear extrapolation from 150 iterations is not
# headroom. WATCH IT: at iter 5000 ssh the node and check `free -g`
# shared/swap and RssShmem on a rank -- treat this as a HARD GATE, not a
# suggestion. If the trend projects past ~2600 GB/node, stop at the next save
# point and resume in a fresh process (which resets host RSS to baseline),
# dropping finetune/no_load_optim/no_load_rng per the RESUMING note.
# RssShmem should be FLAT (it was 2.9 GB in the verification run). If swap is
# non-zero the leak is back and the run should be stopped and resumed from the
# latest checkpoint in a fresh process, which resets host RSS to baseline.
#
# CHECKPOINTS -- save_retain_interval is deliberately NOT used. Megatron's
# retain logic deletes the PREVIOUS checkpoint on each save unless that
# iteration is a multiple of save_retain_interval (checkpointing.py:808-821),
# which makes every save point depend on arithmetic staying true; one edit to
# train_iters and the pre-anneal checkpoint is silently deleted. Instead:
#   save_interval     1000000   effectively disabled, so nothing is auto-deleted
#   save_extra_steps  [24 pts]  every ~10BT (2384 iters = 10.0BT at gbs 512 x
#                               8192), plus 42533 = the last full-plateau step,
#                               plus 53167 = the final annealed checkpoint.
#   lr_wsd_decay_iters = int(53167*0.20) = 10633, so the anneal begins at 42534
#   and 42533 is the pre-anneal save. 42915 is kept as an early-anneal probe.
# NOTHING is ever deleted by Megatron here, so disk is the real constraint:
# 24 x ~453GB = ~10.9TB if all are kept. Check `df -h /shared_silo` first -- it
# has sat at 92-96% all week -- and plan to export+prune older checkpoints as
# the run proceeds rather than assuming they all fit.
#
# RESUMING. If this job dies, resume by pointing load at this run's own
# checkpoints dir and DROPPING finetune / no_load_optim / no_load_rng -- any of
# them zeroes the iteration counter and silently retrains from scratch. See
# qwen3.5_35B_A3B_lr_10BT_resume.yaml for the exact shape, and verify from the
# log ("successfully loaded checkpoint ... at iteration N"), never from the loss.
#
# SPLIT "1000,0,0" + eval_iters 0 REMAIN LOAD-BEARING: 43 components, two under
# 1000 docs (stack-edu-Rust-s5 at 273, PHP-s5 at 754). Under "989,10,1" the 0.1%
# test slice rounds to ZERO documents and the test-index build NEVER TERMINATES.
#
# COLD INDEX BUILD: num_samples = 53167*512 = 27,221,504 matches no existing
# cache, so expect ~19 min before iteration 1. Single job, so no cache race.
#
# At 8 nodes DP=64, so gbs 512 / (64*2) = 4 gradient-accumulation steps, and the
# distributed optimizer shards over 4x more ranks than the 2-node runs -- per-GPU
# memory is strictly easier than the 197GB/256GB measured there.
defaults:
  - base
  - /backend: megatron
  - /container: mi325x
  - /slurm: mi325x
  - /sweep: none
  - /backend/megatron: [qwen3_5_moe_35BA3B]
  - _self_

slurm:
  sbatch:
    partition: amd-tw-verification
    nodes: 8
    # 53167 iters on 8 nodes. The 34 s/iter figure from the 10BT arms is a
    # TWO-node number; at 8 nodes expect ~9-11 s/iter (the 212M tok/node-hour
    # constant implies 8.9). Budget at 11 s/iter = 162h + 4.0h for 24 ckpt
    # writes + 0.3h cold index = ~167h, which OVERRUNS a 156h request and
    # would be killed past the pre-anneal save at 42533 but before the final
    # annealed checkpoint at 53167 -- full cost, no annealed model.
    # The partition TIMELIMIT is infinite, so there is no cost to asking for
    # more. 216h is ~30% margin at 11 s/iter.
    time: 9-00:00:00
    open_mode: append
    qos: normal

  # The cluster sets JobRequeue=1. Combined with --finetune (which zeroes the
  # iteration counter and reloads --load, i.e. the BASE model) an automatic
  # requeue would silently restart this run from scratch on any node failure
  # or admin drain, with no loud error. Never requeue this job; resume it by
  # hand per the RESUMING note above.
  sbatch_extra_directives:
    - "--no-requeue"

  launcher_cmd: "${oc.join:' ',${oc.maptmpl:'export %=\\'$%\\' ; \\\n',${oc.dict.keys:.env}}} \
    export LOCAL_ADDR=$(nslookup $(hostname) | grep \"Address: \" | sed \"s/Address: //\" | tail) ; \\\n\
    export RANK=$SLURM_PROCID ; export LOCAL_RANK=$SLURM_LOCALID ; export AITER_JIT_DIR=/tmp/$USER/aiter_jit_dir ; \\\n\
    ${oc.select:container.runtime,apptainer} exec --rocm --overlay /shared_silo/scratch/containers/fla-overla-for-primus-v26.1.img:ro ${oc.join:' ',${oc.maptmpl:'--bind % \\\n',${container.bind}}} \
    ${oc.select:container.image,container.sif}"

  env:
    USE_ROCM_AITER_ROPE_BACKEND: "0"
    # Live logging to the internal TW dashboard. "online" is what the shim
    # wants: it has NO offline path (it warns "offline synchronization" and
    # logs live anyway), and no ingest for a replayed .wandb log either.
    # Safe for a multi-day run: if FastTrackML is unreachable, wandb_shim
    # __init__.py:944 catches it, logs "metrics will be lost" and nulls the
    # run -- training is never aborted by a logging failure.
    WANDB_MODE: "online"
    WANDB_API_KEY: "local"
    FASTTRACKML_URL: "http://tus1-vm-amd-k8s-001:5000"
    FASTTRACKML_EXPERIMENT: "poro3-cpt"
    DASHBOARD_URL: "http://tus1-vm-amd-k8s-001:8080"
    TW_GROUP: "qwen3_5_35B_A3B_223BT"
    OUTPUT_DIR: "${oc.env:OUTPUT_DIR,./output}"
    APPTAINER_BIND: '"/usr/local/lib/libbnxt_re-rdmav34.so:/usr/lib/x86_64-linux-gnu/libibverbs/libbnxt_re-rdmav34.so,${oc.env:SCRATCH},${oc.env:PWD}"'
    SINGULARITY_BIND: '"/usr/local/lib/libbnxt_re-rdmav34.so:/usr/lib/x86_64-linux-gnu/libibverbs/libbnxt_re-rdmav34.so,${oc.env:SCRATCH},${oc.env:PWD}"'

container:
  image: /shared_silo/scratch/containers/primus_v26.1.sif
  # ROCm 7.1 signal-pool leak fix (backport of upstream clr 3ad064d, in 7.2.0).
  # ROCclr ActiveSignal grew its completion-signal pool for every signal whose
  # timestamp bookkeeping was unharvested -- ~all of them in MoE training -- so
  # host anon RAM climbed ~70MB/iter/rank, evicted the mmap'd dataset page cache
  # and collapsed throughput 6x from ~iter 1400. Killed 52244/52246 by timeout.
  # This list REPLACES the default from config/container/mi325x.yaml, so the
  # original two entries are repeated here on purpose. Both .so and .so.7 are
  # needed: torch dlopens the versioned name.
  bind:
    - "/shared_silo/scratch"
    - "${oc.env:PWD}"
    - "/shared_silo/scratch/dzautner/rocm71_signalpool_fix/libamdhip64.so.7.1-3ad064d:/opt/venv/lib/python3.10/site-packages/torch/lib/libamdhip64.so"
    - "/shared_silo/scratch/dzautner/rocm71_signalpool_fix/libamdhip64.so.7.1-3ad064d:/opt/venv/lib/python3.10/site-packages/torch/lib/libamdhip64.so.7"
    # TW dashboard wandb shim: a drop-in replacement for the wandb package
    # that posts MLflow REST to FastTrackML. Stdlib-only (urllib/json/
    # threading), verified to import under this container's python3.10.
    # The eval sbatch binds it at python3.12/dist-packages; the training
    # container is python3.10/site-packages, hence the different target.
    - "/shared_silo/scratch/shared/tw-dashboard/wandb_shim/wandb:/opt/venv/lib/python3.10/site-packages/wandb"

backend:
  megatron:
    log_throughput: true
    log_interval: 10
    log_progress: true

