# @package _global_
#
# MoE post-hoc metrics for the multilingual sparse-scaling runs
#   /leonardo_work/OELLM_prod2026/experiments/sparse_multilingual_scaling
# evaluated on the *multilingual* held-out val corpus (openeurollm-256k-val),
# sampled in the same proportions as the training data-mix (1TT-option-4.sh).
#
# One sbatch job per completed run. Checkpoints are torch_dist, so they load
# resharded to TP1/PP1 on a single GPU regardless of training TP/PP (the 0.9B
# runs trained with PP=2). Tokenizer + arch come from the checkpoint args;
# the pre-tokenized val blend needs no tokenizer at read time, only the eod id
# (openeurollm-256k <eos> = 2).
#
# Submit:
#   export SLURM_ACCOUNT=OELLM_prod2026
#   export SLURM_PARTITION=boost_usr_prod
#   export OELLM_CONTAINERS_DIR=/leonardo_work/OELLM_prod2026/container_images
#   export HF_HOME=/tmp
#   # validate one run first:
#   python scripts/run_autoexp.py --config-name=experiments/abhash/moe_metrics_multilingual --array-subset 0
#   # then the rest:
#   python scripts/run_autoexp.py --config-name=experiments/abhash/moe_metrics_multilingual --array-subset 1-7
#
defaults:
  - /backend: 'null'
  - /container: leonardo
  - /slurm: leonardo
  - /job: default
  - /sweep: none
  - _self_

index: 0
stage: ""

metadata:
  # Per-run sweep variables (overridden by the explicit sweep points below).
  size_dir: 0.1B_ne_sparse_experts_8_topk_4
  run_tag: qwen3_sparse_0.1B_ne_nexp8_lr0.001_gbsz32_stable12BT

  # Constants.
  exp_root: /leonardo_work/OELLM_prod2026/experiments/sparse_multilingual_scaling
  tokenizer_model: /leonardo_work/OELLM_prod2026/users/shaldar0/tokenizers/openeurollm-tokenizer-256k
  blend_file: scripts/moe/blends/multilingual_val_1TT_option4.sh
  analysis_root: results/moe_analysis_multilingual

  # Derived.
  load_path: ${metadata.exp_root}/${metadata.size_dir}/training/${metadata.run_tag}/checkpoints
  out_dir: ${metadata.analysis_root}/${metadata.run_tag}

job:
  base_output_dir: ${metadata.out_dir}
  name: moe_ml_${metadata.run_tag}

# NullBackend just runs the python command.
backend:
  base_command:
    - python
    - scripts/moe/compute_moe_metrics.py
    - --tensor-model-parallel-size
    - "1"
    - --pipeline-model-parallel-size
    - "1"
    - --load
    - ${metadata.load_path}
    - --use-checkpoint-args
    - --ckpt-format
    - torch_dist
    - --tokenizer-type
    - HuggingFaceTokenizer
    - --tokenizer-model
    - ${metadata.tokenizer_model}
    - --no-bias-dropout-fusion
    - --moe-data-type
    - megatron_indexed
    - --moe-megatron-blend-file
    - ${metadata.blend_file}
    - --moe-eod-token
    - "2"
    - --moe-batch-size
    - "1"
    - --moe-seq-length
    - "4096"
    - --moe-num-batches
    - "200"
    - --moe-compare-ckpts-every
    - "1000"
    - --moe-output-json
    - ${metadata.out_dir}/saturation.json
    - --moe-coactivation-output
    - ${metadata.out_dir}/coactivation.json
    - --moe-token-count-output
    - ${metadata.out_dir}/token_counts.json
    - --moe-activation-norm-output
    - ${metadata.out_dir}/expert_activation_norms.json
    - --moe-routing-gif
    - ${metadata.out_dir}/expert_routing.gif
    - --moe-routing-gif-layers
    - "first,mid,last"
    - --moe-routing-gif-frame-ms
    - "250"
    - --moe-plot
    - --moe-plot-dir
    - ${metadata.out_dir}

container:
  image: /leonardo_work/OELLM_prod2026/container_images/OELLM_autoexp_MegatronTrainingNoRoot_base_2510_x86_64_202603060943.sif
  env:
    WANDB_MODE: offline
    MACHINE_NAME: LEONARDO
    PYTHONPATH: "."
    TMPDIR: ${oc.env:TMPDIR,/tmp}
    HF_HOME: ${oc.env:HF_HOME,/tmp}
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"

slurm:
  sbatch:
    # AIAFC (AI Factory) grant — pinned so these jobs never bill OELLM_prod2026.
    account: aifac_5c0_092
    partition: boost_usr_prod
    nodes: 1
    ntasks_per_node: 1
    gpus_per_node: 1
    gres: "gpu:1"
    cpus_per_task: 8
    time: "02:00:00"
    job_name: null
  srun:
    cpus_per_task: 8
  env:
    SLURM_CPUS_PER_TASK: "8"
    MASTER_PORT: "$((20000 + SLURM_JOB_ID % 10000))"

# One job per completed multilingual run (index order matters for --array-subset).
#   0-4: 0.1B nexp8   5-7: 0.9B nexp64 (decay)   8: 0.9B nexp64 stable300BT   9: 0.9B nexp64 decay120BT
sweep:
  type: list
  groups:
    - type: list
      configs:
        - metadata.size_dir: 0.1B_ne_sparse_experts_8_topk_4
          metadata.run_tag: qwen3_sparse_0.1B_ne_nexp8_lr0.001_gbsz32_stable12BT
        - metadata.size_dir: 0.1B_ne_sparse_experts_8_topk_4
          metadata.run_tag: qwen3_sparse_0.1B_ne_nexp8_lr0.001_gbsz64_stable50BT
        - metadata.size_dir: 0.1B_ne_sparse_experts_8_topk_4
          metadata.run_tag: qwen3_sparse_0.1B_ne_nexp8_lr0.002_gbsz128_decay50BT
        - metadata.size_dir: 0.1B_ne_sparse_experts_8_topk_4
          metadata.run_tag: qwen3_sparse_0.1B_ne_nexp8_lr0.002_gbsz256_decay120BT
        - metadata.size_dir: 0.1B_ne_sparse_experts_8_topk_4
          metadata.run_tag: qwen3_sparse_0.1B_ne_nexp8_lr0.002_gbsz256_decay200BT
        - metadata.size_dir: 0.9B_ne_sparse_experts_64_topk_4_PP_2
          metadata.run_tag: qwen3_sparse_0.9B_ne_nexp64_lr0.0005_gbsz128_decay20BT
        - metadata.size_dir: 0.9B_ne_sparse_experts_64_topk_4_PP_2
          metadata.run_tag: qwen3_sparse_0.9B_ne_nexp64_lr0.0005_gbsz64_decay12BT
        - metadata.size_dir: 0.9B_ne_sparse_experts_64_topk_4_PP_2
          metadata.run_tag: qwen3_sparse_0.9B_ne_nexp64_lr0.0005_gbsz64_decay6BT
        - metadata.size_dir: 0.9B_ne_sparse_experts_64_topk_4_PP_2
          metadata.run_tag: qwen3_sparse_0.9B_ne_nexp64_lr0.002_gbsz512_stable300BT
        - metadata.size_dir: 0.9B_ne_sparse_experts_64_topk_4_PP_2
          metadata.run_tag: qwen3_sparse_0.9B_ne_nexp64_lr0.002_gbsz512_decay120BT
