# @package _global_
# A run of the post-training repository (https://github.com/OpenEuroLLM/post-training, TRL
# backend) on MareNostrum 5: a new one, or the continuation of one that already has checkpoints.
#
# The post-training YAML describes the experiment (model, data, hyperparameters, run name,
# output directory). This file describes only where and how it runs: the Slurm settings and the
# restart rules. The backend (config/backend/post_training.yaml) prepares the run directory
# itself on enqueue; no post-training command is necessary first.
#
# Into a pool (docs/sub_slurm_jobs.md); account and qos must be the pool host's:
#   python scripts/run_autoexp.py --no-monitor --pool <pool_dir> \
#       --config-name experiments/post_training/launch_mn5 \
#       backend.repo_dir=<your post-training checkout> backend.config=configs/trl/<run>.yaml \
#       slurm.sbatch.account=<host account> slurm.sbatch.qos=<host qos>
# As a job of its own:
#   python scripts/run_autoexp.py --config-name experiments/post_training/launch_mn5 \
#       backend.repo_dir=<your post-training checkout> backend.config=configs/trl/<run>.yaml
# The README (post-training runs) explains every value.
# Add --dry-run first: it does all checks of the prepare step and writes nothing into the run
# directory.
#
# The shell needs the modules that `backend.python` was built with (`module load python`).
#
# THE SLURM SETTINGS COME FROM AUTOEXP, NOT FROM POST-TRAINING. The `slurm:` block of the
# post-training YAML is for post-training's own submit.py. In a run that autoexp starts:
#   * account, qos, partition, wall_time, cpus_per_task, mem, exclude, max_failures,
#     signal_time_seconds and job_name of that block are NOT used. The values of this config
#     apply (`slurm.sbatch.*` below and in config/slurm/marenostrum_post_training.yaml, and
#     `job.state_events` for the restarts);
#   * num_nodes and gpus_per_node must be equal to `slurm.sbatch.nodes` and
#     `slurm.sbatch.gpus_per_node`, or the enqueue stops. The same applies to a continued run
#     and its frozen config;
#   * modules and module_purge are used: the launch script loads the modules.
#
# In a pool the run executes as the HOST OWNER's unix user: the run directory, the HF cache, the
# container, the model and the datasets must be readable (the run directory writable) for it.
# A stop (handover, the host's wall clock, pool_ctl preempt) ends the run without a save: the
# trainer has no exit signal handler, and `accelerate launch` is not matched by the pool's
# rank_pattern. The next run continues from the last periodic checkpoint.
defaults:
  - ../base
  - /backend: post_training
  - /container: none
  - /slurm: marenostrum_post_training
  - /sweep: none
  - _self_

backend:
  # repo_dir: YOUR post-training checkout, on the command line (backend.repo_dir=...). No default:
  #           the run uses the code of that checkout.
  # config:   the post-training YAML of the experiment, on the command line (backend.config=...)
  # The shared post-training environment of ehpc533; override it if you use a different one.
  python: /gpfs/projects/ehpc533/environments/post-training-venv/bin/python

job:
  # the same name = the same job; the name is the run name of the post-training YAML
  name: ${post_training.run_name:${backend.repo_dir},${backend.config}}
  # logs (slurm-<run id>.log) and resolved configs next to the run's own output
  base_output_dir: ${backend.run_dir}/autoexp
  log_events: []
  # A run that fails after it was seen RUNNING is started again, at most 3 times
  # (MaxActionFiresCondition: per event, so the pool's own requeues do not use it up). A run
  # that fails before the monitor saw it RUNNING (a wrong path, a wrong node count) is final.
  state_events:
    - name: failed
      transition: ["RUNNING", "FAILED"]
      condition:
        class_name: MaxActionFiresCondition
        max_fires: 3
      action:
        class_name: RestartAction
        reason: "post-training run failed"

slurm:
  sbatch:
    # must equal slurm.num_nodes of the post-training YAML (see above)
    nodes: 8

stage: post_training
