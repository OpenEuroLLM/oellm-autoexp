# @package _global_
# 10BT ENGLISH-SOURCE x LR MATRIX: Qwen3.5-35B-A3B-Base CPT, 4 arms.
#
# 2x2: peak LR {3e-5, 5e-5} x English source {fineweb-edu, dclm-baseline}.
# Everything else is identical across all four -- same Finnish (30% hplt4.0-fi),
# same code (30%, 40 stack-edu components), same math (10% Nemotron-CC-Math),
# same seed 1234, same gbs 512, same schedule shape. So the matrix is a clean
# two-variable comparison and the English swap is the only mixture change.
#
# WHY THESE LRs. The 12-arm 4BT sweep put the acquisition/retention crossing
# between 5e-5 and 1e-4, and 1e-4 was dropped from this round. 3e-5 and 5e-5
# bracket the low side: at 4BT they were indistinguishable on every downstream
# benchmark (all sub-floor), while held-out Finnish loss preferred 5e-5 by 92x
# its seed gap. 10BT tests whether that held-out gap turns into a benchmark gap.
#
# WHY SWAP fineweb-edu FOR dclm. fineweb-edu is the EDUCATIONAL-QUALITY filtered
# subset of FineWeb, a narrower English register than the base model was
# pretrained on. Retention is currently measured only against that register, so
# a broader web-crawl English (dclm-baseline) tests whether the measured
# forgetting is a property of the CPT or of the yardstick.
#
# DCLM SIZING. dclm-baseline here is merge_sample_0.03 = 14.3BT, vs fineweb-edu
# at 351.4BT. At 30% of 10BT the run draws 3.0BT, i.e. 21% of one epoch -- no
# component is seen twice. A .val sibling exists, so these arms stay scorable on
# the same per-source held-out pass as the 4BT sweep.
#
# PRE-ANNEAL CHECKPOINT AT 1907. lr_wsd_decay_iters = int(2385*0.20) = 477, so
# the anneal begins at 2385-477 = 1908. Iteration 1907 is the last step still at
# the full plateau LR; saving there gives a checkpoint that can be CONTINUED
# without re-warming out of a near-zero LR (Gupta 2308.04014 shows that is the
# worst case; Singh 2503.02844 states the positive rule). The 4BT sweep has no
# pre-anneal saves and none of those 12 arms can be extended -- that is the gap
# this closes.
#
# DISK. 4 arms x 2 saves x 453GB = 3.6TB. /shared_silo has been at 95-96% all
# week; check `df -h /shared_silo` before submitting. A full filesystem takes
# down every user's jobs.
#
# COLD INDEX BUILD -- STAGGER SUBMISSIONS. num_samples = 2385*512 = 1,221,120,
# which matches no existing cache, so the index rebuilds (~19 min). The two
# fineweb-edu arms share IDENTICAL cache keys, and the two dclm arms share
# another identical pair. Launching a pair together races two writers into the
# same files in /shared_silo/scratch/avirtane/data_cache.
# Submit ONE fineweb-edu arm and ONE dclm arm, wait for
# "[after dataloaders are built]" in both (~20 min), THEN submit the other two.
#
# NODES. 2 each so all four run concurrently on 8 of the 12-node partition,
# leaving 4 free. 4 nodes each would need 16 and could only fit 3 at a time, for
# the same total wall-clock while blocking everyone else. gbs stays 512 either
# way -- node count is the throughput knob, gbs is the result-affecting one.
# At 2 nodes DP=16, so 512/(16*2) = 16 accumulation steps.
#
# WALLTIME. Measured 954 iters = 9h03m-9h16m on 2 nodes, so 2385 iters is
# ~23h, plus ~19 min cold build and two 453GB writes. 36h leaves margin.
#
# SPLIT "1000,0,0" + eval_iters 0 IS LOAD-BEARING: 43 components, two under 1000
# docs (stack-edu-Rust-s5 at 273, PHP-s5 at 754). Under "989,10,1" the 0.1% test
# slice rounds to ZERO documents and the test-index build is NON-TERMINATING.


defaults:
  - base
  - /backend: megatron
  - /container: mi325x
  - /slurm: mi325x
  - /sweep: none
  - /backend/megatron: [qwen3_5_moe_35BA3B]
  - _self_

slurm:
  sbatch:
    partition: amd-tw-verification
    nodes: 2
    # ~9.5h expected; 20h leaves room for a slow start and node variation.
    # The partition itself has no time limit.
    time: 1-12:00:00
    open_mode: append
    qos: normal
    nice: 5000

  launcher_cmd: "${oc.join:' ',${oc.maptmpl:'export %=\\'$%\\' ; \\\n',${oc.dict.keys:.env}}} \
    export LOCAL_ADDR=$(nslookup $(hostname) | grep \"Address: \" | sed \"s/Address: //\" | tail) ; \\\n\
    export RANK=$SLURM_PROCID ; export LOCAL_RANK=$SLURM_LOCALID ; export AITER_JIT_DIR=/tmp/$USER/aiter_jit_dir ; \\\n\
    ${oc.select:container.runtime,apptainer} exec --rocm --overlay /shared_silo/scratch/containers/fla-overla-for-primus-v26.1.img:ro ${oc.join:' ',${oc.maptmpl:'--bind % \\\n',${container.bind}}} \
    ${oc.select:container.image,container.sif}"

  env:
    USE_ROCM_AITER_ROPE_BACKEND: "0"
    WANDB_MODE: "offline"
    OUTPUT_DIR: "${oc.env:OUTPUT_DIR,./output}"
    APPTAINER_BIND: '"/usr/local/lib/libbnxt_re-rdmav34.so:/usr/lib/x86_64-linux-gnu/libibverbs/libbnxt_re-rdmav34.so,${oc.env:SCRATCH},${oc.env:PWD}"'
    SINGULARITY_BIND: '"/usr/local/lib/libbnxt_re-rdmav34.so:/usr/lib/x86_64-linux-gnu/libibverbs/libbnxt_re-rdmav34.so,${oc.env:SCRATCH},${oc.env:PWD}"'

container:
  image: /shared_silo/scratch/containers/primus_v26.1.sif
  # ROCm 7.1 signal-pool leak fix (backport of upstream clr 3ad064d, in 7.2.0).
  # ROCclr ActiveSignal grew its completion-signal pool for every signal whose
  # timestamp bookkeeping was unharvested -- ~all of them in MoE training -- so
  # host anon RAM climbed ~70MB/iter/rank, evicted the mmap'd dataset page cache
  # and collapsed throughput 6x from ~iter 1400. Killed 52244/52246 by timeout.
  # This list REPLACES the default from config/container/mi325x.yaml, so the
  # original two entries are repeated here on purpose. Both .so and .so.7 are
  # needed: torch dlopens the versioned name.
  bind:
    - "/shared_silo/scratch"
    - "${oc.env:PWD}"
    - "/shared_silo/scratch/dzautner/rocm71_signalpool_fix/libamdhip64.so.7.1-3ad064d:/opt/venv/lib/python3.10/site-packages/torch/lib/libamdhip64.so"
    - "/shared_silo/scratch/dzautner/rocm71_signalpool_fix/libamdhip64.so.7.1-3ad064d:/opt/venv/lib/python3.10/site-packages/torch/lib/libamdhip64.so.7"

backend:
  megatron:
    log_throughput: true
    log_interval: 10
    log_progress: true

