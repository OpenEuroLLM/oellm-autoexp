# @package _global_
# 10BT, FILTERED HPLT4-ENG AS THE ENGLISH PORTION: 2 arms (lr 3e-5, 5e-5).
#
# Third English source in the series, alongside
# qwen3.5_35B_A3B_lr_10BT_english.yaml (fineweb-edu and dclm-baseline).
# Everything else is identical to those four arms -- same Finnish (30%
# hplt4.0-fi), same code (30%), same math (10%), seed 1234, gbs 512, 2385 iters,
# same WSD shape, same pre-anneal save at 1907. Only the English changes.
#
# TOKEN-PROPORTIONAL WEIGHTING, measured not assumed. Token counts summed from
# each .idx sequence-length array:
#   ia-bsc-edu-2p751    10.481 BT  ( 21.840% of the pair)  -> weight 0.0655226307
#   ccc-bsc-edu-2p751   37.507 BT  ( 78.160% of the pair)  -> weight 0.2344773693
#   combined            47.988 BT                          -> sums to 0.30
# So the larger file contributes proportionally more, i.e. the pair is sampled
# as if it were one concatenated corpus. 30% of 10BT draws 3.0BT = 6.3% of one
# epoch, so nothing repeats.
#
# THIS BLEND HAS 44 COMPONENTS, not 43: the single fineweb-edu entry is replaced
# by two. The sub-1000-doc hazard is unchanged (stack-edu-Rust-s5 at 273 docs,
# PHP-s5 at 754), so split "1000,0,0" + eval_iters 0 remain LOAD-BEARING --
# under "989,10,1" the test-index build is NON-TERMINATING.
#
# NO .val SIBLINGS. Unlike the regmix_trainval_2026-09 tree, these CPT-tree
# prefixes have no train/val split, so these arms cannot be scored on their OWN
# held-out English. That is not a blocker but it does change the eval plan: the
# right comparison across English sources is a COMMON yardstick anyway (all arms
# scored on the same fixed English .val), since fineweb-edu.val and dclm.val are
# different data and are not comparable to each other either.
#
# COLD INDEX BUILD -- STAGGER. New blend, so new cache keys (~19 min build), and
# the two arms share identical keys. Submit one, wait for
# "[after dataloaders are built]", then submit the other.
#
# DISK. 2 arms x 2 saves x 453GB = 1.81TB, on top of the 3.6TB the four
# fineweb-edu/dclm arms are already committed to. Check df before submitting.
defaults:
  - base
  - /backend: megatron
  - /container: mi325x
  - /slurm: mi325x
  - /sweep: none
  - /backend/megatron: [qwen3_5_moe_35BA3B]
  - _self_

slurm:
  sbatch:
    partition: amd-tw-verification
    nodes: 2
    # ~9.5h expected; 20h leaves room for a slow start and node variation.
    # The partition itself has no time limit.
    time: 1-12:00:00
    open_mode: append
    qos: normal
    nice: 5000

  launcher_cmd: "${oc.join:' ',${oc.maptmpl:'export %=\\'$%\\' ; \\\n',${oc.dict.keys:.env}}} \
    export LOCAL_ADDR=$(nslookup $(hostname) | grep \"Address: \" | sed \"s/Address: //\" | tail) ; \\\n\
    export RANK=$SLURM_PROCID ; export LOCAL_RANK=$SLURM_LOCALID ; export AITER_JIT_DIR=/tmp/$USER/aiter_jit_dir ; \\\n\
    ${oc.select:container.runtime,apptainer} exec --rocm --overlay /shared_silo/scratch/containers/fla-overla-for-primus-v26.1.img:ro ${oc.join:' ',${oc.maptmpl:'--bind % \\\n',${container.bind}}} \
    ${oc.select:container.image,container.sif}"

  env:
    USE_ROCM_AITER_ROPE_BACKEND: "0"
    WANDB_MODE: "offline"
    OUTPUT_DIR: "${oc.env:OUTPUT_DIR,./output}"
    APPTAINER_BIND: '"/usr/local/lib/libbnxt_re-rdmav34.so:/usr/lib/x86_64-linux-gnu/libibverbs/libbnxt_re-rdmav34.so,${oc.env:SCRATCH},${oc.env:PWD}"'
    SINGULARITY_BIND: '"/usr/local/lib/libbnxt_re-rdmav34.so:/usr/lib/x86_64-linux-gnu/libibverbs/libbnxt_re-rdmav34.so,${oc.env:SCRATCH},${oc.env:PWD}"'

container:
  image: /shared_silo/scratch/containers/primus_v26.1.sif
  # ROCm 7.1 signal-pool leak fix (backport of upstream clr 3ad064d, in 7.2.0).
  # ROCclr ActiveSignal grew its completion-signal pool for every signal whose
  # timestamp bookkeeping was unharvested -- ~all of them in MoE training -- so
  # host anon RAM climbed ~70MB/iter/rank, evicted the mmap'd dataset page cache
  # and collapsed throughput 6x from ~iter 1400. Killed 52244/52246 by timeout.
  # This list REPLACES the default from config/container/mi325x.yaml, so the
  # original two entries are repeated here on purpose. Both .so and .so.7 are
  # needed: torch dlopens the versioned name.
  bind:
    - "/shared_silo/scratch"
    - "${oc.env:PWD}"
    - "/shared_silo/scratch/dzautner/rocm71_signalpool_fix/libamdhip64.so.7.1-3ad064d:/opt/venv/lib/python3.10/site-packages/torch/lib/libamdhip64.so"
    - "/shared_silo/scratch/dzautner/rocm71_signalpool_fix/libamdhip64.so.7.1-3ad064d:/opt/venv/lib/python3.10/site-packages/torch/lib/libamdhip64.so.7"

backend:
  megatron:
    log_throughput: true
    log_interval: 10
    log_progress: true

    # handpicked (== poro2-orig): 30 fi / 30 en / 30 code / 10 math, 43 components.
    # Lifted verbatim from qwen3.5_35B_A3B_baselines_4BT.yaml:293-378 (weights sum 1.0).
    # Shared, NOT per-stage, so every arm provably sees the same blend.
    data_path:
      - 0.3
