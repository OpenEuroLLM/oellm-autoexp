    data_cache_path: /shared_silo/scratch/avirtane/data_cache
    split: "1000,0,0"
    eval_iters: 0
    # 54 cold components x 488,448 samples: index build is ~19 min, well past the
    # inherited 10-minute default. This is a slow build, not the non-terminating
    # test-split hang -- here the timeout genuinely is the fix.
    distributed_timeout_minutes: 60
    num_workers: 7

    # Validated by probe 46339 at exactly these values.
    global_batch_size: 512
    micro_batch_size: 2
    expert_model_parallel_size: 8
    pipeline_model_parallel_size: 1
    use_distributed_optimizer: true
    moe_per_layer_logging: true
    create_attention_mask_in_dataloader: false
    moe_grouped_gemm: false
    moe_token_dispatcher_type: "alltoall"
    moe_permute_fusion: true
    moe_shared_expert_overlap: true
    overlap_moe_expert_parallel_comm: false
    overlap_param_gather: true
    overlap_grad_reduce: true

    recompute_activations: true
    recompute_granularity: full

    adam_beta2: 0.95
    weight_decay: 0.1

    # 10B tokens at gbs 512: 10e9 / (512*8192) = 2384.2 -> 2385.
    train_iters: 2385
    lr_decay_iters: 2385
    lr_warmup_iters: 100
    lr_decay_style: WSD
    # int(2385 * 0.20) = 477. Anneal begins at 2385 - 477 = 1908.
    lr_wsd_decay_iters: 477
    lr_wsd_decay_style: linear

    moe_aux_loss_coeff: 0.0001
    override_opt_param_scheduler: true
    seed: 1234

    # 1907 = last plateau step (continue from this one). 2385 = final annealed.
    ckpt_format: torch_dist
    save_interval: 1000000
    save_extra_steps:
      - 1907
      - 2385
    save: ${job.base_output_dir}/checkpoints

    load: /shared_silo/scratch/rluukkon/oellm/Megatron-Bridge/megatron_ckpt/Qwen3.5-35B-A3B-Base
    finetune: true
    no_load_optim: true
    no_load_rng: true

    tensorboard_dir: ${job.base_output_dir}/tensorboard
    wandb_save_dir: ${job.base_output_dir}/wandb
    wandb_project: "moe-exploration"
    wandb_exp_name: "qwen3_5_35B_A3B_10BTh4e_${stage}_${oc.env:SLURM_JOB_ID,local}"

job:
  name: qwen3_5_35B_A3B_10BTh4e_${stage}_${slurm.env.MACHINE_NAME}

# 2x2. The two fwe_ arms inherit the shared blend above (fineweb-edu English).
# The two dclm_ arms override data_path wholesale: identical 43 components with
# the fineweb-edu path swapped for dclm-baseline at the SAME 0.3 weight.
sweep:
  type: list
  groups:
    - type: list
      configs:
        - stage: h4e_lr3e5
          backend.megatron.lr: 3.0e-5
          backend.megatron.min_lr: 3.0e-7
          backend.megatron.router_lr_spec: "1.0e-5"

        - stage: h4e_lr5e5
          backend.megatron.lr: 5.0e-5
          backend.megatron.min_lr: 5.0e-7
          backend.megatron.router_lr_spec: "1.6667e-5"
