# @package _global_
#
# Training + conversion of *every* saved checkpoint to HF:
#
#   train      -> <output_root>/<job.name>/                      checkpoints/iter_N (every save_interval + final)
#   convert_N  -> <output_root>/<job.name>/convert/iter_N/       Megatron-Bridge: checkpoints/iter_N -> hf/iter_N
#
# One convert job per checkpoint iteration N in aux.ckpt_iters. Each one starts as
# soon as checkpoint N is fully saved, i.e. latest_checkpointed_iteration.txt holds
# a value >= N (Megatron updates it only after a save finishes), so conversions run
# while training continues. A successful conversion writes hf/iter_N.done, which
# the separate eval config (_chain-ckpt-eval.yaml) waits for.
#
# Usage: add `- _chain-ckpt-convert` after the datamix-*-ne entry in a defaults list,
# followed by `- _chain-datamix`, see chain-train-and-convert-datamix-*.yaml. Keep
# run_autoexp.py running (tmux) until the last conversion is submitted. Eval is a
# separate session (_chain-ckpt-eval.yaml).
#
# Re-running the config (e.g. to resume training) skips checkpoints whose
# hf/iter_N.done already exists (aux.ckpt_skip_done).

aux:
  # Training run dir. Everything in `sweep` below that isn't escaped (\\$) is
  # resolved once against the training config, so this is the train stage's dir.
  train_dir: ${job.base_output_dir}
  # All checkpoint iterations the run will save: every save_interval, plus the
  # final iteration (Megatron always saves at the end). Override with an explicit
  # list to convert only some of them, e.g. aux.ckpt_iters='[2000,10000]'.
  ckpt_iters: "${oc.eval:'list(range(${backend.megatron.save_interval}, ${backend.megatron.train_iters}, ${backend.megatron.save_interval})) + [${backend.megatron.train_iters}]'}"
  ckpt_skip_done: true
  # ckpt_iters minus the already converted ones (hf/iter_N.done exists)
  convert_iters: >-
    ${oc.eval:'[i for i in ${aux.ckpt_iters} if not (${aux.ckpt_skip_done} and Path("${aux.train_dir}/hf/iter_%07d.done" % i).exists())]'}
  convert_time: "01:00:00"
  convert_partition: small-g        # not dev-g: max 2 jobs per user there
  # container of the convert jobs; must have nvidia-modelopt + pulp (the bridge sif).
  # Defaults to the training container; _chain-datamix.yaml sets the bridge sif.
  convert_container: ${container.image}
  # extra shell check a convert/eval job must pass before it is submitted (on top of
  # waiting for its checkpoint); `true` = none. _chain-toy.yaml uses it to stay within
  # the dev-g job limit, because autoexp drops a job whose sbatch is rejected.
  submit_guard: "true"

sweep:
  type: list
  filter: true
  groups:
    - type: list
      configs:
        - stage: train

        # one convert point per entry of aux.convert_iters
        - type: product
          defaults:
            backend: megatron_bridge
            slurm: lumi_bridge
            container.image: "${aux.convert_container}"
            job.name: "${job.name}_convert_\\${aux.ckpt_iter}"   # SLURM job name
            job.base_output_dir: "${aux.train_dir}/convert/\\${oc.pad_iter:\\${aux.ckpt_iter}}"
            job.start_condition:
              # checkpoint N is complete once the tracker file holds N or a later iteration
              class_name: ShellCommandCondition
              command: "[ \"$(cat ${aux.train_dir}/checkpoints/latest_checkpointed_iteration.txt 2>/dev/null || echo 0)\" -ge \\${aux.ckpt_iter} ] && ${aux.submit_guard}"
            backend.derive_hf_arch: qwen3
            # reference tokenizer for the temporary dummy model; an absolute path works because
            # run_export only checks that resources/<kind>/<hf_model> exists (Path join keeps it as is)
            backend.hf_model: "${aux.tokenizer_dir}"
            backend.tokenizer: "${aux.tokenizer_dir}"   # same as training; copied verbatim into the HF export
            backend.megatron_config_path: "${aux.train_dir}/current.yaml"
            backend.megatron_path: "${aux.train_dir}/checkpoints/\\${oc.pad_iter:\\${aux.ckpt_iter}}"
            backend.hf_path: "${aux.train_dir}/hf/\\${oc.pad_iter:\\${aux.ckpt_iter}}"
            backend.bridge_root: "${oc.env:PWD}/submodules/Megatron-Bridge"
            backend.resources: "${oc.env:PWD}/oellm_autoexp/postprocess/resources/megatron_bridge"
            # marker for the eval config: written only if the whole export (incl. tokenizer copy) succeeded
            backend.extra_cli_args:
              - "&&"
              - touch
              - "${aux.train_dir}/hf/\\${oc.pad_iter:\\${aux.ckpt_iter}}.done"
            # only slurm.env reaches the container, and the container replaces a host
            # PYTHONPATH, so it must go in as SINGULARITYENV_PYTHONPATH. Without it megatron.core
            # isn't found and run_export falls back to Bridge's vendored Megatron-LM, which
            # can't read v0.19 checkpoints ("common.pt does not exist").
            slurm.env.SINGULARITYENV_PYTHONPATH: "${oc.env:PWD}/submodules/Megatron-LM:${oc.env:PWD}:${oc.env:PWD}/submodules/Megatron-Bridge/src:/opt/venv/lib/python3.12/site-packages"
            # conversion is single-process on CPU (gloo); one GCD slice is enough
            slurm.srun_opts: ""
            slurm.sbatch.partition: "${aux.convert_partition}"
            slurm.sbatch.nodes: 1
            slurm.sbatch.ntasks_per_node: 1
            slurm.sbatch.gpus_per_node: 1
            slurm.sbatch.gres: "gpu:1"
            slurm.sbatch.cpus_per_task: 7
            slurm.sbatch.mem: "120G"
            slurm.sbatch.exclusive: null
            slurm.sbatch.time: "${aux.convert_time}"
          params:
            stage: [convert]
            aux.ckpt_iter: ${aux.convert_iters}
