# @package _global_
#
# lm-eval on every checkpoint of chain-train-and-convert-datamix-1.4B-ne.yaml
# (_chain-ckpt-eval.yaml). Run it as its own session, next to (or after) the
# training, with the same OUTPUT_DIR; keep it running (tmux).

defaults:
  - chain-train-and-convert-datamix-1.4B-ne   # the run to evaluate; don't change job.name here
  - _chain-ckpt-eval
  - _self_

aux:
  eval_task_groups: [open-sci-0.01]   # required
  eval_limit: null                    # samples per task; null = full tasks
