# @package _global_
#
# Toy-run settings for testing the chains: 1 node, 100 iterations (~26M tokens),
# checkpoints at 50 and 100, short convert/eval jobs - everything on dev-g.
#
# dev-g allows 2 jobs per user (MaxJobs=MaxSubmit=2, `sacctmgr show assoc user=$USER`)
# and autoexp drops a job whose sbatch is rejected instead of retrying it. So a
# convert/eval job is submitted only while fewer than 2 of your jobs are on dev-g
# (aux.submit_guard); they run one after another next to the training.
# Don't keep other dev-g jobs around during a toy run: the training itself has no guard.
# Include it after _chain-ckpt-convert/_chain-datamix and again after _chain-ckpt-eval
# (later entries win), see chain-*-datamix-0.1B-ne-toy.yaml.

aux:
  # 100 iters x 64 seqs x 4096 tokens -> train_iters=100, WSD cooldown=20
  train_tokens: 26214400
  convert_time: "00:30:00"
  convert_partition: dev-g
  eval_time: "01:00:00"
  eval_partition: dev-g
  submit_guard: '[ "$(squeue -h -u $USER -p dev-g | wc -l)" -lt 2 ]'
  eval_limit: 50              # samples per task

job:
  name: train-0.1B-ne-toy
  base_output_dir: output/train-0.1B-ne-toy   # never the real run dir (ignores OUTPUT_DIR)

slurm:
  sbatch:
    nodes: 1
    partition: dev-g
    time: "00:30:00"

backend:
  megatron:
    global_batch_size: 64     # 8 GPUs x micro batch 4 x 2 accumulation steps
    lr_warmup_iters: 10       # must be < train_iters - cooldown
    eval_interval: 50
    eval_iters: 5
    save_interval: 50         # writes iter_0000050/ and iter_0000100/ into checkpoints/
    log_interval: 10
    wandb_exp_name: 0.1B-nemo-ha-toy
  env:
    WANDB_MODE: offline       # keep toy runs out of the W&B project
