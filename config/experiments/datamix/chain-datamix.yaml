# @package _global_
#
# DataMix chain: training + HF conversion + lm-eval of every checkpoint, for the
# selected scales and stages, in one run_autoexp.py session (_chain-datamix.yaml).
# Run dir per scale: <output_root>/<name>/<scale>. Keep run_autoexp.py running (tmux).
# See chain_guide.md.

defaults:
  - _chain-datamix
  - _self_

aux:
  name: ???                           # your experiment, e.g. fin-bin00: names run dirs, SLURM jobs, W&B runs
  output_root: ${oc.env:OUTPUT_ROOT,output}   # relative to the repo root
  scales: [0.1B, 0.4B, 1.4B]          # any subset
  stages: [train, convert, eval]      # any subset, e.g. [convert, eval] for an existing training
  # Training data (required): one list item per word of Megatron's --data-path. A single
  # dataset is just its prefix; a mix alternates weight and prefix items ("0.3", prefix_a,
  # "0.7", prefix_b, ...). prefix = path without .bin/.idx; weights quoted. E.g.
  #   data_path:
  #     - /scratch/<project>/users/<you>/data/bin_00_text_document
  # or on the command line: 'aux.data_path=[/scratch/<project>/.../bin_00_text_document]'
  data_path: ???
  # Eval task groups (required for the eval stage), e.g. [open-sci-0.01]; all groups are in
  # submodules/oellm_evals/oellm/resources/task-groups.yaml. Use the same for every mix you
  # want to compare.
  eval_task_groups: ???
  eval_limit: null                    # samples per task; null = full tasks
