# @package _global_
#
# Evaluation of every converted checkpoint, as its own run_autoexp.py session.
# Pairs with _chain-ckpt-convert.yaml, which writes hf/iter_N + hf/iter_N.done:
#
#   eval_N -> <output_root>/<job.name>/eval/iter_N/      oellm-eval (lm-eval-harness) on hf/iter_N
#
# One eval job per iteration N in aux.ckpt_iters, each starting once
# hf/iter_N.done exists, so you can start this session together with training or
# any time later. A successful eval writes eval/iter_N.done; re-running the
# config skips those (aux.ckpt_skip_done) and only evaluates the rest.
#
# Usage: put it after the chain-train-and-convert-datamix-* experiment in a defaults
# list, see chain-eval-datamix-*.yaml. Don't change job.name there: it locates the training
# run dir. It replaces the sweep, so no training or conversion is submitted.
# One-time setup (eval env, into ~/eval_local, + eval datasets into $HF_HOME):
#   EVAL_LOCAL_DIR=/scratch/<project>/users/$USER/eval_local OELLM_EVAL_SIF=<aux.eval_container> \
#       bash scripts/install_eval_env.sh --cluster lumi --prefetch

aux:
  # ROCm eval container (laif, has vllm + transformers); lm-eval + oellm-eval are
  # installed on top into $HOME/eval_local (scripts/install_eval_env.sh)
  eval_container: ${.project_dir}/containers/laif-rocm-6.4.4-pytorch-2.9.1-te-2.4.0-fa-2.8.0-triton-3.2.0.sif
  eval_task_groups: ???             # required: set in the experiment file, e.g. [open-sci-0.01]
  eval_limit: null                  # samples per task; null = full tasks
  eval_time: "04:00:00"
  eval_partition: small-g
  # ckpt_iters minus the already evaluated ones (eval/iter_N.done exists);
  # [0] if none are left (an empty sweep would fall back to the training config),
  # which sweep.filter then drops
  eval_iters: >-
    ${oc.eval:'[i for i in ${aux.ckpt_iters} if not (${aux.ckpt_skip_done} and Path("${aux.train_dir}/eval/iter_%07d.done" % i).exists())] or [0]'}

sweep:
  type: list
  # drops the placeholder iteration 0 (nothing left to evaluate); escaped, so it
  # is evaluated per sweep point
  filter: "\\${oc.eval:'\\${aux.ckpt_iter} > 0'}"
  groups:
    - type: product
      defaults:
        backend: oellm_eval
        container: lumi_eval
        slurm: lumi_eval
        job.name: "${job.name}_eval_\\${aux.ckpt_iter}"   # SLURM job name
        job.base_output_dir: "${aux.train_dir}/eval/\\${oc.pad_iter:\\${aux.ckpt_iter}}"
        job.start_condition:
          # the conversion of checkpoint N finished (+ aux.submit_guard, see _chain-ckpt-convert.yaml)
          class_name: ShellCommandCondition
          command: "[ -e ${aux.train_dir}/hf/\\${oc.pad_iter:\\${aux.ckpt_iter}}.done ] && ${aux.submit_guard}"
        container.image: "${aux.eval_container}"
        container.bind:
          - "/pfs/"
          - "/scratch/"
          - "/flash/"
          - "${oc.env:HOME}"
          - "${oc.env:PWD}"
        backend.models:
          - "${aux.train_dir}/hf/\\${oc.pad_iter:\\${aux.ckpt_iter}}"
        backend.task_groups: "${aux.eval_task_groups}"
        backend.limit: "${aux.eval_limit}"
        backend.venv_path: "${oc.env:HOME}/eval_venv_stub"   # empty stub; the container is the env
        backend.local: true
        backend.skip_checks: true
        backend.verbose: true
        backend.env.EVAL_BASE_DIR: "${aux.train_dir}/eval/\\${oc.pad_iter:\\${aux.ckpt_iter}}"
        backend.env.EVAL_OUTPUT_DIR: "${aux.train_dir}/eval/\\${oc.pad_iter:\\${aux.ckpt_iter}}"
        # marker for skipping on re-runs: written only if oellm-eval succeeded
        backend.extra_cli_args:
          - "&&"
          - touch
          - "${aux.train_dir}/eval/\\${oc.pad_iter:\\${aux.ckpt_iter}}.done"
        slurm.srun_opts: ""
        slurm.sbatch.partition: "${aux.eval_partition}"
        slurm.sbatch.nodes: 1
        slurm.sbatch.ntasks_per_node: 1
        slurm.sbatch.gpus_per_node: 1
        slurm.sbatch.gres: "gpu:1"
        slurm.sbatch.cpus_per_task: 7
        slurm.sbatch.mem: "60G"
        slurm.sbatch.exclusive: null
        slurm.sbatch.time: "${aux.eval_time}"
      params:
        stage: [eval]
        aux.ckpt_iter: ${aux.eval_iters}
