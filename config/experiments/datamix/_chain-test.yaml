# @package _global_
#
# Test-run settings for the chain: per scale 1 node, 100 iterations (~26M tokens),
# checkpoints at 50 and 100, short convert/eval jobs - everything on dev-g.
#
# dev-g allows ONE job per project (QoS dev_g: MaxSubmitPA=MaxJobsPA=1, see
# `sacctmgr show qos dev_g format=Name,MaxSubmitPA,MaxSubmitPU`), shared by everyone in
# the billed project, and autoexp drops a job whose sbatch is rejected instead of
# retrying it. So every job (training, convert, eval) is submitted only while the project
# has no job on dev-g (aux.submit_guard); they run one at a time and wait while a
# colleague uses dev-g. (small-g/standard-g have no such limit but queue for days.)
# Include it after chain-datamix, see chain-datamix-test.yaml.

aux:
  # 100 iters x 64 seqs x 4096 tokens -> train_iters=100, WSD cooldown=20
  train_tokens: 26214400
  output_root: output/test     # never the real run dirs (ignores OUTPUT_ROOT)
  convert_time: "00:30:00"
  convert_partition: dev-g
  eval_time: "01:00:00"
  eval_partition: dev-g
  submit_guard: '[ "$(squeue -h -A ${aux.account} -p dev-g | wc -l)" -lt 1 ]'
  # small group (3 tasks, ~5 min per eval): oellm-eval starts one lm_eval process per task,
  # and the very first eval after installing ~/eval_local is much slower (cold start)
  eval_task_groups: [generic-multilingual]
  eval_limit: 50              # samples per task

slurm:
  sbatch:
    nodes: 1
    partition: dev-g
    time: "00:30:00"

backend:
  megatron:
    global_batch_size: 64     # 8 GPUs x micro batch x accumulation steps
    lr_warmup_iters: 10       # must be < train_iters - cooldown
    eval_interval: 50
    eval_iters: 5
    save_interval: 50         # writes iter_0000050/ and iter_0000100/ into checkpoints/
    log_interval: 10
  env:
    WANDB_MODE: offline       # keep test runs out of the W&B project
