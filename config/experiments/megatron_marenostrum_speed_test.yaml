# @package _global_
defaults:
  - base
  - /backend: megatron_torchrun
  - /container: marenostrum_msc
  - /slurm: marenostrum_msc
  - /sweep: none
  - /backend/megatron: [llama1_8b_qkln,megatron_fsdp,speed_test_marenostrum_msc]
  - _self_

backend:
  data_integrity_check: false
  megatron:
    train_iters: 500
    eval_interval: 1000

job:
  name: megatron_marenostrum_speed_test
