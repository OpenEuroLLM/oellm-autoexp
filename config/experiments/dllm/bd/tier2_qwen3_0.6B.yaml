# @package _global_
# Tier 2 (.claude/dllm/ABLATIONS.md) for Qwen3-0.6B-Base: 10B tokens = 9537 iterations of 256 sequences
# x L = 4096 (seq_length 4097) on 1 node(s), TP 1, micro batch 2, learning rate 1e-4 (the tier 2
# LR of the tier 0 rule, D-066; half of it for 4B and 8B). The combined winner of tier 1 is
# --bd-objective bd3 --bd-block-size 8 --bd-block-schedule none --bd-token-shift 0 --bd-complementary-mask 0 --bd-loss-weighting elbo --bd-t-min 0.0 --bd-t-max 1.0 --bd-doc-mask 1 --bd-val-seed 1234.
# Time limits: 1.25 x the training time at the probed throughput, plus 1 h for the evaluation in the job
# (M1 on 1000 held-out windows of 2048 tokens, as tiers 0 and 1; GSM8K static and dynamic@0.9).
# Render: PYTHONPATH=. python scripts/run_autoexp.py --config-name experiments/dllm/bd/tier2_qwen3_0.6B --dry-run
# Submit: PYTHONPATH=. python scripts/run_autoexp.py --config-name experiments/dllm/bd/tier2_qwen3_0.6B \
#   --submit-and-exit --array-subset <index>  (0: T2-1 combined winner, 1: T2-1 AR control, 2: T2-6 LLaDA2.0 WSD arm)

defaults:
  - /backend: megadlm_bd_torchrun
  - /container: snellius_megadlm_native
  - /slurm: snellius_megadlm_native
  - /job: default
  - override /backend/megatron: dllm/bd/qwen3_0.6B_base
  - _self_

job:
  name: "bd3-q3_0.6B-B8-sh0-cm0-welbo-t0_1-dm1-scnone-lr1e-4-T10B"
  base_output_dir: "${oc.env:OUTPUT_DIR}/dllm-ablations/runs/${job.name}"
  log_path: ${.base_output_dir}/slurm-%j.log
  log_path_current: ${.base_output_dir}/current.log
  config_path: ${.base_output_dir}/config-%j.yaml
  config_path_current: ${.base_output_dir}/current.yaml

backend:
  aux:
    difflm_args: "--mask-token ${backend.megatron.aux.mask_token_id} --base-model vanilla --model-running-mode difflm-noshift --attention-mask-type no_mask --difflm-varilen-prob 0"
    bd_args: "--bd-objective bd3 --bd-block-size 8 --bd-block-schedule none --bd-token-shift 0 --bd-complementary-mask 0 --bd-loss-weighting elbo --bd-t-min 0.0 --bd-t-max 1.0 --bd-doc-mask 1 --bd-val-seed 1234"
    # Train, reading the data from GPFS (D-061), then evaluate in the same job after the last iteration.
    dist_prefix: "./oellm_autoexp/dllm/train_then_eval.sh "
  env:
    EVAL_RUN: ${job.name}
    EVAL_DIR: "${oc.env:OUTPUT_DIR}/dllm-ablations/eval"
    EVAL_HF_BASE: ${backend.megatron.aux.hf_repo}
    EVAL_DATA_PREFIX: "${oc.env:DATA_DIR}/qwen3_tokenized/fineweb_edu_10BT/shard_15_text_document"
    EVAL_MODES: static,dynamic
    EVAL_PARALLEL: "1"
  megatron:
    seq_length: 4097
    train_iters: 9537
    lr: 1.0e-04
    lr_warmup_iters: 96  # max(50, 1 percent of train_iters)
    tensor_model_parallel_size: 1
    micro_batch_size: 2
    # One index cache per run: runs that start together never write the same cache files.
    data_cache_path: ${job.base_output_dir}/data_cache
    aux:
      walltime_s: 122400
    # Save and stop 60 min before the time limit (time for the evaluation); resubmit to resume.
    exit_duration_in_mins: ${oc.subi:${oc.divi:${.aux.walltime_s},60},60}

slurm:
  sbatch:
    _non_strict: true
    nodes: 1
    partition: gpu_h100
    time: "${oc.slurmtime:${backend.megatron.aux.walltime_s}}"

sweep:
  type: list
  groups:
    - type: list
      configs:
        # T2-1 combined winner
        - job.name: "bd3-q3_0.6B-B8-sh0-cm0-welbo-t0_1-dm1-scnone-lr1e-4-T10B"
          backend.aux.bd_args: "--bd-objective bd3 --bd-block-size 8 --bd-block-schedule none --bd-token-shift 0 --bd-complementary-mask 0 --bd-loss-weighting elbo --bd-t-min 0.0 --bd-t-max 1.0 --bd-doc-mask 1 --bd-val-seed 1234"
          backend.megatron.aux.walltime_s: 122400
        # T2-1 AR control
        - job.name: "ar-q3_0.6B-lr1e-4-T10B"
          backend.aux.bd_args: "--bd-objective ar --bd-block-size 8 --bd-block-schedule none --bd-token-shift 0 --bd-complementary-mask 0 --bd-loss-weighting elbo --bd-t-min 0.0 --bd-t-max 1.0 --bd-doc-mask 1 --bd-val-seed 1234"
          backend.megatron.aux.walltime_s: 75600
        # T2-6 LLaDA2.0 WSD arm: B grows to L = 4096, then decays to the winner B
        - job.name: "bd3-q3_0.6B-B8-sh0-cm1-welbo-t0_1-dm1-sc0-2_0.02-4_0.04-16_0.06-64_0.08-256_0.1-4096_0.8-8-lr1e-4-T10B"
          backend.aux.bd_args: "--bd-objective bd3 --bd-block-size 8 --bd-block-schedule 0:2,0.02:4,0.04:16,0.06:64,0.08:256,0.1:4096,0.8:8 --bd-token-shift 0 --bd-complementary-mask 1 --bd-loss-weighting elbo --bd-t-min 0.0 --bd-t-max 1.0 --bd-doc-mask 1 --bd-val-seed 1234"
          backend.megatron.aux.walltime_s: 122400
          # FLOP-matched (spec section 3, D-020): half global and micro batch
          backend.megatron.global_batch_size: 128
          backend.megatron.micro_batch_size: 1
