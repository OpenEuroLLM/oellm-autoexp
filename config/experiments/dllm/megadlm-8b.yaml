# @package _global_

defaults:
  - /experiments/base
  - /backend: megadlm_torchrun
  - /container: snellius_megadlm
  - /slurm: snellius_megadlm
  - /backend/megatron: [base, dllm/megadlm-8b]
  - /sweep: none
  - _self_

aux:
  experiment_group: "megadlm-8b"

backend:
  # The MegaDLMs settings live in backend.megatron.aux (see the backend config); the
  # megadlm_torchrun full_cmd only appends backend.aux.difflm_args, so pass them through.
  aux:
    difflm_args: "--model-running-mode ${backend.megatron.aux.model_running_mode} --base-model ${backend.megatron.aux.base_model} --attention-mask-type ${backend.megatron.aux.attention_mask_type} --mask-token ${backend.megatron.aux.mask_token}"
  megatron:
    # ── 10k-step stability run ──────────────────────────────────────────────
    train_iters: 10000
    lr_warmup_iters: 2000            # linear warmup 0 → lr over the first 2000 steps
    lr_wsd_decay_iters: 0            # no decay: lr held at peak after warmup, so any
                                     # instability shows up at the constant target lr
    log_interval: 10
    eval_interval: 1000
    distributed_timeout_minutes: 60  # avoid NCCL watchdog timeouts on a long run

    # Checkpoint so the run survives wall-time limits: resubmit the same job and
    # it resumes from the latest checkpoint (load == save). save_interval=1000
    # → ≤1000 steps lost on preemption. NOTE: each 8B torch_dist ckpt (with
    # optimizer state) is large — watch scratch usage over 10 checkpoints.
    save: "${job.base_output_dir}/checkpoints"
    load: "${job.base_output_dir}/checkpoints"
    save_interval: 1000
    log_throughput: true

    # NOTE: do NOT set padded_vocab_size — MegaDLMs' pretrain_difflm.py has no
    # --padded-vocab-size arg and computes padding from vocab_size (50289, set
    # in backend/megatron/dllm/megadlm-8b.yaml) + make_vocab_size_divisible_by.
    global_batch_size: 128
    micro_batch_size: 2
    tensor_model_parallel_size: 4

    data_path:
      - /projects/2/managed_datasets/FineWeb/10BT/fineweb-10BT_text_document
    data_cache_path: /scratch-shared/${oc.env:USER}/cache

    tokenizer_model: EleutherAI/gpt-neox-20b

  env:
    TOKENIZERS_PARALLELISM: "false"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    PYTHONWARNINGS: "ignore::UserWarning"
    NCCL_NET_GDR_LEVEL: "0"  # disable GDRDMA — required for PP=2 inter-node P2P
    CUDA_DEVICE_MAX_CONNECTIONS: "1"  # required for TP>1 (tensor_model_parallel_size=4)

job:
  name: megadlm-8b_n${slurm.sbatch.nodes}_tp${backend.megatron.tensor_model_parallel_size}_pp${backend.megatron.pipeline_model_parallel_size}_cp${backend.megatron.context_parallel_size}_mbs${backend.megatron.micro_batch_size}_gbs${backend.megatron.global_batch_size}_seq${backend.megatron.seq_length}
  base_output_dir: "${oc.env:OUTPUT_DIR,'./output'}/${aux.experiment_group}/${job.name}"

slurm:
  sbatch:
    # At ~9.7 s/iter on 2 nodes (8×H100), 10000 steps ≈ 27 h and warmup alone
    # (2000 steps) ≈ 5.4 h. 24 h reaches ~8900 steps; the run resumes from its
    # last checkpoint on resubmit. To finish in one job, raise nodes (4 → ~14 h,
    # 8 → ~7 h) — DP scales with nodes since TP/PP/CP are fixed.
    nodes: 2
    time: "24:00:00"
