# @package _global_
#
# GDN delta-rule beta probe on the "standard candle": ~130M params, 6B tokens.
#
# Basis: scaling_130M_jupiter.yaml from the oellm-autoexp-residual checkout
# (branch oellm-ngpt-muown), which defines the reference cell used to decide
# major architecture questions before committing to a full scaling law:
#   niccolo-130M geometry (18L, 576h, 2304ffn, 9 heads), gbs 128, mbs 32,
#   lr 2e-3 WSD (warmup 2000, decay last 20%), adam_beta2 0.99, seq 4096,
#   nemotron_downsampled_5p_valid data, gpt-neox-20b tokenizer, vocab 50304,
#   train_iters = 6e9 / (4096*128) = 11445.
# Every one of those is reproduced here EXACTLY so these runs are directly
# comparable to the existing transformer arms (resid_baseline, resid_ngpt_*,
# resid_muown, ...) already in the residual_scaling_variants group.
#
# Question under test: does letting the delta-rule step size beta exceed 1 --
# so the state transition (I - beta k k^T) gains NEGATIVE eigenvalues -- help,
# and does a flat "stable regime" around the pure-erase point help further?
#
#   beta = linear_beta_max * g(x);   transition eigenvalue = 1 - beta.
#
#   gdn_beta1       max 1.0, g = sigmoid(x)
#                   beta in (0,1) -> eigenvalues (0,1]   [standard GDN control]
#   gdn_beta2       max 2.0, g = sigmoid(x)
#                   beta in (0,2) -> eigenvalues (-1,1), slope 0.50 at x=0
#   gdn_beta2_plat  max 2.0, g = (sigmoid(4(x-1)) + sigmoid(4(x+1)))/2
#                   beta in (0,2) -> eigenvalues (-1,1), beta(0)=1 EXACTLY,
#                   slope 0.071 at x=0 (3.5x flatter): a stable plateau at
#                   eigenvalue 0 (pure delta-rule erase), with contraction and
#                   reflection still reachable in the tails.
#
# gdn_beta1 is the control: this group has no GDN arm yet (all existing arms are
# residual/optimizer variants of a dense transformer), so without it the two
# beta variants would have nothing to isolate the beta effect against.
#
# NOTE vs the transformer arms: GDN uses NoPE (position_embedding_type: none),
# matching the established gdn7_nope recipe from the multilingual sweep. So
# GDN-vs-transformer differs in two ways (linear attention + NoPE); the
# beta comparison (the actual question) is clean, since the three GDN arms
# differ ONLY in the beta squash.
#
# Container: jupiter_liger_mamba, NOT the residual group's /container: jupiter.
# GDN needs flash-linear-attention (fla.ops.gated_delta_rule), which only the
# linattn image carries.
defaults:
  - ../base
  - /backend: megatron_torchrun_localaddr
  - /container: jupiter_liger_mamba
  - /slurm: jupiter
  - /backend/megatron: [base, data_nemonicco_jupiter]
  - /sweep: none
  - override /job: default
  - _self_

aux:
  experiment_group: "residual_scaling_variants"
  total_tokens: "${oc.eval:'${aux.seq_len}*${aux.gbs}*${backend.megatron.train_iters}'}"
  gbs: 128
  tokens: 6_000_000_000
  decay_fraction: 0.2
  seq_len: 4096
  start_iter: 0
  additional_tag: ""
  variant: "gdn_beta1"
  hf_home: "/e/project1/e-sta-openeurollm/poeppel1/cache"

backend:
  megatron:
    # ---- geometry: niccolo 130M (identical to the transformer arms) ----
    num_layers: 18
    hidden_size: 576
    ffn_hidden_size: 2304
    num_attention_heads: 9
    num_query_groups: 9
    kv_channels: 64
    seq_length: ${aux.seq_len}
    max_position_embeddings: ${aux.seq_len}
    padded_vocab_size: 50304
    normalization: RMSNorm
    swiglu: true
    add_bias_linear: false
    add_qkv_bias: false
    create_attention_mask_in_dataloader: false
    qk_layernorm: true
    rotary_percent: 1
    untie_embeddings_and_output_weights: false

    # ---- GDN 7:1 hybrid, NoPE. Overridden per variant only for beta. ----
    position_embedding_type: none
    rotary_base: 100000          # unused under NoPE; kept for arg parity
    window_size: null
    window_attn_skip_freq: null
    experimental_attention_variant: gated_delta_net
    linear_attention_freq: 8     # (N-1):1 -> 7 linear : 1 attention
    linear_conv_kernel_dim: 4
    linear_key_head_dim: 128
    linear_value_head_dim: 128
    linear_num_key_heads: ${backend.megatron.num_query_groups}
    linear_num_value_heads: ${backend.megatron.num_attention_heads}

    # ---- schedule: identical to the transformer arms ----
    train_iters: ${oc.eval:'(${aux.tokens}+${aux.seq_len}*${aux.gbs}-1)//(${aux.seq_len}*${aux.gbs})'}
    global_batch_size: ${aux.gbs}
    # 16, not the transformer arms' 32: GDN's input projection is
    # qk*2 + v*2 + heads*2 = 4626 wide at hidden 576 (~8x hidden, vs ~3x for a
    # dense attention block), plus the recurrent state, so mbs 32 OOMs on the
    # 95 GiB GH200s (observed: "tried to allocate 576 MiB, 81 MiB free").
    # mbs must divide gbs/DP = 128/4 = 32, so 16 -> 2 accumulation steps.
    # This changes throughput only: gbs, token order and optimizer steps are
    # unchanged, so these arms stay comparable to the transformer ones.
    micro_batch_size: 16
    lr: 0.002
    min_lr: 1.0e-05
    lr_decay_style: WSD
    lr_warmup_iters: 2000
    lr_wsd_decay_iters: ${oc.eval:'int(0.2 * ${.train_iters})'}
    lr_wsd_decay_style: linear
    lr_warmup_init: 0
    adam_beta2: 0.99
    clip_grad: 1

    # ---- parallelism ----
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    expert_model_parallel_size: 1
    expert_tensor_parallel_size: 1
    sequence_parallel: false

    # ---- precision / perf ----
    bf16: true
    accumulate_allreduce_grads_in_fp32: true
    grad_reduce_in_bf16: false
    use_distributed_optimizer: true
    use_flash_attn: true
    gradient_accumulation_fusion: true
    bias_dropout_fusion: true
    bias_gelu_fusion: true
    bias_swiglu_fusion: true
    cross_entropy_loss_fusion: true
    liger_fused_linear_cross_entropy: true
    liger_fused_linear_cross_entropy_chunk_size: 8192
    # CUDA graphs are OFF for GDN: the FLA gated-delta-rule kernels are not
    # capture-safe in the same way the dense transformer layer is, and a capture
    # failure here would be an obscure crash rather than a clean error. The
    # transformer arms keep cuda_graph_impl: local; this costs GDN some
    # launch-bound throughput but changes no numerics.
    cuda_graph_impl: none
    cuda_graph_warmup_steps: 3
    check_for_nan_in_loss_and_grad: false
    overlap_grad_reduce: false
    overlap_param_gather: false
    attention_dropout: 0
    hidden_dropout: 0
    dataloader_type: cyclic
    num_workers: 7
    num_dataset_builder_threads: 6
    rerun_mode: disabled

    # ---- data / tokenizer: identical to the transformer arms ----
    train_data_path:
      - /e/project1/e-sta-openeurollm/poeppel1/datasets/nemotron_downsampled_5p_valid/high-all
    valid_data_path:
      - /e/project1/e-sta-openeurollm/poeppel1/datasets/nemotron_downsampled_5p_valid/high-all
    # Private index cache per job: the arms start together on the same dataset
    # and would otherwise race to build the same index files.
    data_cache_path: ${job.base_output_dir}/data_cache
    tokenizer_type: HuggingFaceTokenizer
    tokenizer_model: EleutherAI/gpt-neox-20b

    log_interval: 50

# Container env. Composing the residual-style defaults (../base + /backend:
# megatron_torchrun_localaddr) drops the env block that config/container/
# jupiter_liger_mamba.yaml defines, so TRITON_LIBCUDA_PATH went missing and
# Inductor died during Megatron's _warmup_jit_function() with
# "AssertionError: libcuda.so cannot found!" -- before the model was even built.
# The image's bind list (rendered correctly) maps the host libcuda to
# /opt/nvidia/lib, so point Triton there. HF_HOME is pinned to the same cache
# the transformer arms use; both caches hold the gpt-neox-20b tokenizer, this
# just keeps the arms byte-identical in environment too.
# Set via slurm.env (renders an `export` in the sbatch), NOT container.env:
# composing the residual-style defaults drops the container's own env block, and
# a top-level `container: env:` override does not take effect here.
slurm:
  env:
    TRITON_LIBCUDA_PATH: "/opt/nvidia/lib"

# Same naming convention as the transformer arms (resid_baseline, resid_ngpt_*,
# resid_muown, ...), so the GDN arms land beside them in the same group dir.
# Without this block every sweep point renders to the default output/demo/ and
# the three arms collide in one directory.
job:
  name: resid_${aux.variant}${aux.additional_tag}
  base_output_dir: "${oc.env:OUTPUT_DIR,'./output'}/${aux.experiment_group}/${job.name}"

sweep:
  type: product
  store_sweep_json: true
  groups:
    - type: list
      configs:
        - aux.variant: gdn_beta1
          backend.megatron.linear_beta_max: 1.0
          backend.megatron.linear_beta_activation: sigmoid

        - aux.variant: gdn_beta2
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_beta_activation: sigmoid

        - aux.variant: gdn_beta2_plat
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_beta_activation: double_sigmoid
