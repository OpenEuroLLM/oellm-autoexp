# @package _global_

# 0.9B NE dense Qwen3-like model throughput test on LUMI (dense counterpart to the sparse MoE sweep)
# Configuration from: https://docs.google.com/spreadsheets/d/17LXPs6O9_6cL7P2KVEJF8LTy5zhy0qLNXEVGRCYOzhY/edit?gid=0#gid=0

defaults:
  - /backend: megatron
  - /container: lumi
  - /slurm: lumi
  - /job: default
  #- /sweep/anni@sweep: mbs_sweep
  - /backend/megatron: base
  - /backend/megatron/multilingual_scaling/models: qwen3_dense_0.9B_ne # model configs
  - /backend/megatron/multilingual_scaling/data: oellm_256k_lumi # full datamix (data_args_path, tokenizer)
  - _self_

index: 0
stage: "" # Will be overridden by sweep

job:
  name: "qwen3_0.9B_ne_dense_autoexp_container" # Will be overridden by sweep with stage and hyperparameter info
  base_output_dir: "/scratch/project_465002530/users/amoisala/oellm-autoexp/config/experiments/anni/0.9B_ne_dense_PP_${backend.megatron.pipeline_model_parallel_size}_mbs_${backend.megatron.micro_batch_size}_nodes_${slurm.sbatch.nodes}/${job.name}"
  log_path: ${slurm.sbatch.error}

backend:
  megatron:
    train_iters: 500
    log_interval: 10
    eval_interval: 200
    eval_iters: 10
    save_interval: 10000000
    save: null
    load: null
    wandb_exp_name: ${job.name}
    wandb_project: "container_check"
    wandb_entity: openeurollm-project
    wandb_save_dir: "${job.base_output_dir}"
    tensorboard_dir: "${job.base_output_dir}/tensorboard"

    # DATA
    data_cache_path: "/scratch/project_465002530/users/$USER/megatron_cache/0.9B_ne_dense_PP_${backend.megatron.pipeline_model_parallel_size}_mbs_${backend.megatron.micro_batch_size}_nodes_${slurm.sbatch.nodes}" # unique per run: avoids concurrent-job cache races

    # need to be set on lumi for ROCm based models to work
    add_bias_linear: false
    gradient_accumulation_fusion: false
    masked_softmax_fusion: false

    # For quick testing
    #train_iters: 5
    lr_warmup_iters: 50 # model default (2000) would exceed 30% of train_iters for a short test run
    lr_wsd_decay_iters: 1
    #micro_batch_size: 1    # overridden by sweep
    #global_batch_size:  64 # overridden by sweep
    #eval_interval: 1000000000
    #save_interval: 1000000000

    # Base training configuration (for stable phase)
    num_workers: 6 # Ville's suggestion since otherwise all of the 7 available CPUs per tasks would have a dataloader
    num_dataset_builder_threads: 6
    micro_batch_size: 2 # Will be overridden by sweep
    global_batch_size: 64  # Will be overridden by sweep
    lr: 5.e-4  # Will be overridden by sweep

    # eval_interval: 200
    # save_interval: 500


slurm:
  sbatch:
    #nodes: "${oc.eval:'min(64, max(1, int(${backend.megatron.global_batch_size}//(${backend.megatron.micro_batch_size}*${slurm.sbatch.gpus_per_node}))))'}"
    nodes: 1
    account: "project_462001516"
    time: "01:00:00"
    partition: standard-g
    output: "${job.base_output_dir}/logs/stdout-%j.log"
    error: "${job.base_output_dir}/logs/stderr-%j.log"
  srun:
    kill_on_bad_exit: "1 "
