# @package _global_
#
# Residual-architecture throughput sweep at 1.3B (hidden 2048).
#
# The 130M sweep showed every arm capped well below 200 TFLOP/s -- including the
# unmodified baseline at ~160. A ceiling probe with the same code at hidden=2048
# reached 329 TFLOP/s, proving the wall was model width (576-wide GEMMs cannot
# saturate a GH200), not the residual schemes. This sweep therefore runs the same
# nine arms at 1.3B, where >200 TFLOP/s is reachable.
#
# Per-arm micro-batches are sized from the memory measured at 130M (relative to
# baseline: nGPT ~1.67x, mHC n=2 ~1.52x, AttnRes ~0.57-0.92x), since baseline
# already sat at 0.60 of GH200 memory at mbs=4 here.
#
# Schemes (all PP=1, which mHC and Block AttnRes currently require):
#   baseline      standard pre-norm transformer, AdamW
#   ngpt_approx   nGPT LERP residual, nGPT's orthogonality approximation
#   ngpt_analytic nGPT LERP residual, exact cos(theta) factor
#   ngpt_wnorm    nGPT + post-step weight normalizer (the full nGPT recipe)
#   muown         Muown optimizer (row-magnitude/direction split)
#   mhc4          mHC with 4 streams
#   mhc2_lerp     mHC with 2 streams composed with the nGPT LERP
#   attnres8      Block AttnRes with 8 blocks
#   attnres4_lerp Block AttnRes with 4 blocks composed with the nGPT LERP
defaults:
  - ../base
  - /backend: megatron_torchrun_localaddr
  - /container: jupiter
  - /slurm: jupiter
  - /backend/megatron: [base, data_nemonicco_jupiter]
  - /sweep: none
  - override /job: default
  - _self_

aux:
  experiment_group: "residual_arch_perf1p3b"
  total_tokens: "${oc.eval:'${aux.seq_len}*${aux.gbs}*${backend.megatron.train_iters}'}"
  gbs: 64
  seq_len: 4096
  start_iter: 0
  additional_tag: ""
  variant: "baseline"
  # HF cache under the same project as the SLURM account these jobs run in.
  hf_home: "/e/project1/e-sta-openeurollm/poeppel1/cache"

backend:
  megatron:
    # ---- geometry: niccolo 130M ----
    num_layers: 24
    hidden_size: 2048
    ffn_hidden_size: 8192
    num_attention_heads: 16
    num_query_groups: 16
    kv_channels: 128
    seq_length: ${aux.seq_len}
    max_position_embeddings: ${aux.seq_len}
    padded_vocab_size: 50304
    normalization: RMSNorm
    swiglu: true
    add_qkv_bias: true
    qk_layernorm: true
    position_embedding_type: rope
    rotary_base: 100000
    rotary_percent: 1
    untie_embeddings_and_output_weights: false

    # ---- short smoke schedule ----
    train_iters: 60
    global_batch_size: ${aux.gbs}
    # 130M at seq 4096 is arithmetic-intensity starved; the dominant throughput
    # lever is a bigger micro-batch. Baseline used only 21% of GH200 memory at
    # mbs=4. Per-arm overrides below keep the memory-heavier schemes in range.
    micro_batch_size: 4
    lr: 0.002
    min_lr: 1.0e-05
    lr_decay_style: WSD
    lr_warmup_iters: 10
    lr_wsd_decay_iters: 10
    lr_wsd_decay_style: linear
    lr_warmup_init: 0
    adam_beta2: 0.99
    weight_decay: 0.1
    clip_grad: 1

    # ---- parallelism: PP=1 is required by mHC / Block AttnRes ----
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    expert_model_parallel_size: 1
    expert_tensor_parallel_size: 1
    sequence_parallel: false

    # ---- precision / perf ----
    bf16: true
    accumulate_allreduce_grads_in_fp32: true
    grad_reduce_in_bf16: false
    use_distributed_optimizer: true
    use_flash_attn: true
    # Fusions: all were off (inherited from the niccolo smoke config). At 130M
    # the model is launch-bound, so fusing the bias/dropout/activation chains and
    # the grad-accum matmul is a large, free win.
    gradient_accumulation_fusion: true
    bias_dropout_fusion: true
    bias_gelu_fusion: false
    bias_swiglu_fusion: true
    cross_entropy_loss_fusion: true
    attention_dropout: 0
    hidden_dropout: 0
    dataloader_type: cyclic
    num_workers: 7
    num_dataset_builder_threads: 6
    rerun_mode: disabled

    # ---- data ----
    # data_nemonicco_jupiter points at /e/project1/jureap59/.../
    # copy_nemotron_downsampled_15p, which no longer exists (the e-sta copy of
    # that directory is empty). Use the surviving nemotron_downsampled_5p_valid
    # shard: 212 GB / ~106B tokens, uint16 so gpt-neox-compatible, and far more
    # than the ~16M tokens this 60-iteration smoke consumes.
    train_data_path:
      - /e/project1/e-sta-openeurollm/poeppel1/datasets/nemotron_downsampled_5p_valid/high-all
    valid_data_path:
      - /e/project1/e-sta-openeurollm/poeppel1/datasets/nemotron_downsampled_5p_valid/high-all
    # Per-job index cache. All nine arms start simultaneously on the same
    # dataset; with a shared cache they race to build the same index files and
    # the losers mmap a partially-written file ("mmap length is greater than
    # file size"). A private directory per job removes the race entirely.
    data_cache_path: ${job.base_output_dir}/data_cache

    # ---- tokenizer ----
    tokenizer_type: HuggingFaceTokenizer
    tokenizer_model: EleutherAI/gpt-neox-20b

    # ---- logging; no checkpointing for a smoke run ----
    log_interval: 5
    log_throughput: true
    log_progress: true
    eval_interval: 100000
    eval_iters: 0
    save: null
    load: null
    wandb_project: residual_arch
    wandb_exp_name: ${job.name}
    wandb_save_dir: ${job.base_output_dir}/wandb
    tensorboard_dir: ${job.base_output_dir}/tensorboard

  env:
    TOKENIZERS_PARALLELISM: "false"
    # The login-node HF_HOME points into /e/project1/jureap59, which the jobs
    # cannot read while running under the e-sta-openeurollm account. Use the
    # equivalent cache inside the account's own project directory; it already
    # holds the gpt-neox-20b tokenizer, and the nodes are offline so the cache
    # is the only source.
    HF_HOME: ${aux.hf_home}
    # NOTE: deliberately no TRANSFORMERS_CACHE. transformers>=4.5x honours it as
    # the hub cache, and the `<cache>/transformers` directory it conventionally
    # points at is empty here -- setting it overrides the populated `<cache>/hub`
    # and turns every offline tokenizer lookup into a cache miss. Verified inside
    # the container: HF_HOME alone resolves gpt-neox-20b, adding TRANSFORMERS_CACHE
    # makes it fail.
    HUGGINGFACE_HUB_CACHE: ${aux.hf_home}/hub
    HF_DATASETS_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    TORCHDYNAMO_DISABLE: "1"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

# Newer container than the jupiter default: Megatron 0.18.2 requires
# nvidia-resiliency-ext >= 0.6.0, which the 0.16-era default image predates.
# Overridden here rather than in config/container/jupiter.yaml so the other
# in-flight experiment sweeps keep the image they were launched against.
container:
  image: ${oc.env:CONTAINER_CACHE_DIR,.}/MegatronTraining-JUPITER-linattn-mamba_aarch64_202608010917.sif
  env:
    # container/jupiter.yaml passes the login-node HF_HOME (jureap59) into the
    # container; override it to the account-matched cache.
    HF_HOME: ${aux.hf_home}

slurm:
  # slurm.env is what actually lands as `export ...` in the generated sbatch, so
  # it is the binding value for the job -- overriding backend.env/container.env
  # alone is not enough. config/slurm/jupiter.yaml resolves HF_HOME from the
  # login-node environment, which points into /e/project1/jureap59; the compute
  # nodes cannot read that project while running under the e-sta-openeurollm
  # account, and they are offline, so the tokenizer lookup fails.
  env:
    HF_HOME: ${aux.hf_home}
  sbatch:
    nodes: 1
    time: "00:20:00"

stage: smoke

job:
  name: resid_${aux.variant}${aux.additional_tag}
  base_output_dir: "${oc.env:OUTPUT_DIR,'./output'}/${aux.experiment_group}/${job.name}"

sweep:
  type: product
  groups:
   - type: list
     configs:
      # 1. Control arm: unmodified pre-norm transformer.
      - aux.variant: baseline

      # 2-3. nGPT LERP residual; approx is the paper's form, analytic the exact
      #      cos(theta) factor that keeps a full-rank Jacobian.
      - aux.variant: ngpt_approx
        backend.megatron.micro_batch_size: 2
        backend.megatron.ngpt: true
        backend.megatron.ngpt_lerp_normalization: approx
      - aux.variant: ngpt_analytic
        backend.megatron.micro_batch_size: 2
        backend.megatron.ngpt: true
        backend.megatron.ngpt_lerp_normalization: analytic

      # 4. Full nGPT recipe: LERP residual + post-step weight normalization, no
      #    weight decay on the normalized body (the normalizer controls magnitude).
      - aux.variant: ngpt_wnorm
        backend.megatron.micro_batch_size: 2
        backend.megatron.ngpt: true
        backend.megatron.ngpt_lerp_normalization: analytic
        backend.megatron.weight_normalizer: true
        backend.megatron.weight_normalizer_out_norm_dim_0: true
        backend.megatron.weight_normalizer_head_unconstrained: true
        backend.megatron.weight_decay: 0.0

      # 5. Muown: Muon on the row directions, l-infinity sign step on the row
      #    magnitudes. 1-D params fall back to Adam automatically.
      - aux.variant: muown
        backend.megatron.optimizer: muown
        backend.megatron.muown_momentum: 0.95
        backend.megatron.muown_num_ns_steps: 5

      # 6-7. mHC: n-stream residual with doubly stochastic mixing. The LERP variant
      #      mixes first, then takes an nGPT step per stream.
      - aux.variant: mhc4
        backend.megatron.micro_batch_size: 2
        backend.megatron.mhc: true
        backend.megatron.mhc_expansion_rate: 4
      - aux.variant: mhc2_lerp
        backend.megatron.micro_batch_size: 1
        backend.megatron.mhc: true
        backend.megatron.mhc_expansion_rate: 2
        backend.megatron.mhc_lerp: true
        backend.megatron.ngpt: true
        backend.megatron.ngpt_lerp_normalization: analytic

      # 8-9. Block AttnRes: softmax attention over depth across block summaries.
      - aux.variant: attnres8
        backend.megatron.micro_batch_size: 2
        backend.megatron.attn_res: true
        backend.megatron.attn_res_num_blocks: 8
      - aux.variant: attnres4_lerp
        backend.megatron.micro_batch_size: 2
        backend.megatron.attn_res: true
        backend.megatron.attn_res_num_blocks: 4
        backend.megatron.attn_res_lerp: true
        backend.megatron.ngpt: true
        backend.megatron.ngpt_lerp_normalization: analytic
