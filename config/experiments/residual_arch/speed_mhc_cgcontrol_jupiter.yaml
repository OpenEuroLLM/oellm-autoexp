# @package _global_
#
# The missing control for the CUDA-graph A/B on mhc4.
#
# Graph capture OOMs at mbs=32 (memory was already at 0.993 occupancy without
# graphs), so the graphed arm had to drop to mbs=24. Comparing it against the
# mbs=32 control confounds two variables, and the only mbs=24 no-graph number on
# record (190.2) comes from an earlier session -- today's mbs=32 control came in
# at 193.8 against 195.8 previously, so session drift is ~1%, the same size as
# the effect being measured. This runs mbs=24 without graphs alongside, so the
# comparison is within-session.
defaults:
  - speed_mhc_jupiter
  - _self_

sweep:
  type: product
  groups:
   - type: list
     configs:
      - aux.variant: speed_mhc4_nocg_mbs24
        backend.megatron.mhc: true
        backend.megatron.mhc_expansion_rate: 4
        backend.megatron.mhc_sinkhorn_iters: 8
        backend.megatron.cuda_graph_impl: none
        backend.megatron.global_batch_size: 384
        backend.megatron.micro_batch_size: 24
