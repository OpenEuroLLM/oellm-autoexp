# @package _global_
#
# Short Qwen3.5-35B-A3B GDN/MoE bring-up on LUMI.
# This exercises the 3x Gated DeltaNet + 1x full-attention layer pattern
# from the HF architecture without committing to a long training run.
#
# Submit:
#   uv run --python 3.12 python scripts/run_autoexp.py \
#     --config-name experiments/risto/qwen3.5_moe_35B_A3B_gdn_smoke \
#     --submit-and-exit

defaults:
  - /backend: megatron
  - /container: lumi
  - /slurm: lumi
  - /job: default
  - /sweep: none
  - /backend/megatron: [base, qwen3.5_moe_35B_A3B]
  - _self_

container:
  env:
    WANDB_TAGS: "lumi,qwen3.5,35B-A3B,GDN,MoE,smoke"

index: 0
stage: "" 

job:
  name: "qwen3.5_moe_35B_A3B_${stage}_TP${backend.megatron.tensor_model_parallel_size}_PP${backend.megatron.pipeline_model_parallel_size}_EP${backend.megatron.expert_model_parallel_size}_moe_comm_overlap_${backend.megatron.overlap_moe_expert_parallel_comm}"
  base_output_dir: "/scratch/project_462001516/experiments/${backend.megatron.wandb_project}/${job.name}"
  log_path: ${slurm.sbatch.error}

backend:
  megatron:
    # LUMI/ROCm compatibility.
    masked_softmax_fusion: false
    gradient_accumulation_fusion: false
    bias_dropout_fusion: false
    bias_swiglu_fusion: false
    apply_rope_fusion: false
    tp_comm_overlap: false
    log_progress: true
    log_throughput: true
    num_workers: 6
    num_dataset_builder_threads: 6
    trust_remote_code: true

    # Short, mock-data run: no checkpoint or validation I/O.
    mock_data: true
    train_iters: 20
    exit_interval: 20
    eval_iters: 1
    eval_interval: 100000
    save_interval: 1000000000
    save: null
    load: null
    no_save_optim: true
    no_save_rng: true
    log_interval: 1

    # tokenizer_type: HuggingFaceTokenizer
    # tokenizer_model: openeurollm/tokenizer-256k
    seq_length: 4096
    micro_batch_size: 1
    global_batch_size: 64
    lr: 1.0e-4

    # 8 nodes × 8 GCD = 64 ranks; TP=2, PP=2, EP=8 → DP=2.
    # Configs that work: 
    # TP=1 , PP=2 , EP=8, no recompute, 4 nodes.
    # TP=2 , PP=1 , EP=8, no recompute, 4 nodes.
    num_layers: 8
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 8
    sequence_parallel: true
    use_distributed_optimizer: true
    moe_permute_fusion: true
    # moe_shared_expert_overlap: false
    overlap_moe_expert_parallel_comm: false
    # recompute_granularity: selective
    # recompute_num_layers: 1

    # Change the output head to a tiny linear layer.
    tokenizer_type: NullTokenizer
    tokenizer_model: null
    vocab_size: 8191
    null_tokenizer_eod_id: 8191
    null_tokenizer_pad_id: -1
    make_vocab_size_divisible_by: 128



    wandb_exp_name: "${job.name}"
    wandb_project: "qwen3.5_moe_35B_A3B_gdn"
    wandb_entity: openeurollm-project
    wandb_save_dir: "${job.base_output_dir}"
    tensorboard_dir: "${job.base_output_dir}/tensorboard"

