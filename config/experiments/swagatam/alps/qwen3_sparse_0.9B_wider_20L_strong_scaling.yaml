# @package _global_
#
# Strong-scaling sweep on Clariden for the 10B-A0.9B wider 20L Qwen3 MoE
# (model, parallelism and optimizer from qwen3_sparse_0.9B_wider_20L_smoke).
# Fixed GBS=2048, MBS=1, EP4 node-local, mock data; nodes 1, 2, 4, 8, 16, 32 (4..128 GPUs).
# Gradient accumulation per rank = 2048 / (4 * nodes): 512 at 1 node down to 16 at 32 nodes.
#
# Cost: one step on 1 node is ~150 s (9.5 s at GBS 128 x 16), so every point costs about
# train_iters * 150 s of node time (~8.5 node-h at 200 iters, ~50 node-h for the sweep).
# Wall time and the GPU-h gate scale with train_iters; for throughput alone, 30 iters is enough:
#   ... backend.megatron.train_iters=30
#
#   uv run python scripts/run_autoexp.py --config-name experiments/swagatam/alps/qwen3_sparse_0.9B_wider_20L_strong_scaling --dry-run
#   --array-subset 3-5 to run only the 8/16/32-node points.

defaults:
  - /experiments/swagatam/alps/qwen3_sparse_0.9B_wider_20L_smoke
  - _self_

stage: strong_scaling

aux:
  # Measured: 9.5 s/step at GBS 128 on 1 node; assumed scaling efficiency for the estimate.
  step_time_1node_s: 152
  scaling_efficiency: 0.85

job:
  name: "qwen3_sparse_10B_A0.9B_L${backend.megatron.num_layers}_E${backend.megatron.num_experts}_K${backend.megatron.moe_router_topk}_${stage}_GBS${backend.megatron.global_batch_size}_MBS${backend.megatron.micro_batch_size}_EP${backend.megatron.expert_model_parallel_size}_N${slurm.sbatch.nodes}_it${backend.megatron.train_iters}_clariden"
  est_step_time_s: ${oc.eval:'${aux.step_time_1node_s} / ${slurm.sbatch.nodes} / (1 if ${slurm.sbatch.nodes} == 1 else ${aux.scaling_efficiency})'}
  est_startup_min: 5

backend:
  megatron:
    micro_batch_size: 1
    global_batch_size: 2048
    train_iters: 200
    exit_interval: ${.train_iters}
    lr_decay_iters: ${.train_iters}
    log_interval: 1
    wandb_project: qwen3_sparse_10B_A0.9B_clariden_scaling
  env:
    WANDB_TAGS: "clariden,qwen3,10B,0.9B-active,sparse,E64,K4,L20,H2048,strong-scaling,mock"

slurm:
  sbatch:
    partition: normal
    # 15 min startup buffer + steps at 75% scaling efficiency (normal partition max is 12 h).
    time: ${oc.slurmtime:${oc.eval:'int(900 + ${backend.megatron.train_iters} * ${aux.step_time_1node_s} / ${slurm.sbatch.nodes} / 0.75)'}}

sweep:
  type: product
  groups:
    - type: list
      configs:
        - { slurm.sbatch.nodes: 1 }
        - { slurm.sbatch.nodes: 2 }
        - { slurm.sbatch.nodes: 4 }
        - { slurm.sbatch.nodes: 8 }
        - { slurm.sbatch.nodes: 16 }
        - { slurm.sbatch.nodes: 32 }
        - { slurm.sbatch.nodes: 64 }
        - { slurm.sbatch.nodes: 128 }
