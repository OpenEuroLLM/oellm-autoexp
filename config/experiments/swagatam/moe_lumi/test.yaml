# @package _global_

# 0.9B NE sparse Qwen3-like model training with pull-based multi-stage cooldown on Marenostrum
# Configuration from: https://docs.google.com/spreadsheets/d/17LXPs6O9_6cL7P2KVEJF8LTy5zhy0qLNXEVGRCYOzhY/edit?gid=0#gid=0

defaults:
  - /backend: megatron
  - /container: lumi
  - /slurm: lumi
  - /job: default
  - /sweep: none
  - /backend/megatron: base
  - /backend/megatron/multilingual_scaling/sparse_models: qwen3_sparse_0.4B_ne_experts_32 # model configs
  # - /backend/megatron/: speed_test_lumi # data + rocm stuff for lumi
  - _self_

container:
  env:
    WANDB_TAGS: "lumi"

index: 0
stage: "" # Will be overridden by sweep

job:
  name: "${backend.megatron.aux.model_name}_experts${backend.megatron.num_experts}_topk${backend.megatron.moe_router_topk}_PP${backend.megatron.pipeline_model_parallel_size}"
  base_output_dir: "/scratch/project_462001516/experiments/${backend.megatron.wandb_project}/${job.name}"
  log_path: ${slurm.sbatch.error}

backend:
  megatron:

    ### lumi specific configs
    masked_softmax_fusion: False
    gradient_accumulation_fusion: False
    # ROCm/LUMI: these fused kernels segfault on ROCm, must be disabled (see speed_test_lumi / megatron_sanity_check)
    bias_dropout_fusion: False
    bias_swiglu_fusion: False
    apply_rope_fusion: False
    # log_progress writes <save>/progress.txt at job START, before Megatron creates
    # the checkpoints/ dir (only made at first save) -> FileNotFoundError on a fresh
    # output dir. The orchestrator doesn't use progress.txt, so disable it.
    log_progress: False
    num_workers: 6 # Ville's suggestion since otherwise all of the 7 available CPUs per tasks would have a dataloader
    num_dataset_builder_threads: 6
    trust_remote_code: True
    ### lumi specific configs end

    # train_iters / lr_wsd_decay_iters are set per-stage by the inline sweep below.
    # eval_iters: 1
    # eval_interval: 1000
    # save_interval: 10000000
    # save: null
    # load: null
    wandb_exp_name: "${job.name}" # Will be overridden by sweep with stage and hyperparameter info
    wandb_project: "moe_router_stability" # Disabled
    wandb_entity: openeurollm-project
    wandb_save_dir: "${job.base_output_dir}"
    tensorboard_dir: "${job.base_output_dir}/tensorboard"

    # Data-related configs (LUMI)
    data_args_path: /scratch/project_462000963/users/vitiugin/datamix-tools/datamix4-lumi.txt
    split: "99,1,0"
    tokenizer_type: HuggingFaceTokenizer
    tokenizer_model: openeurollm/tokenizer-256k
    data_cache_path: /scratch/project_462001516/users/swagatam/cache/MEGATRON_262k # Adjust it to your own directory

    # LUMI hipBLASLt workarounds: "Unable to find any suitable algorithms" in these GEMM shapes
    # moe_router_dtype: null
    # moe_grouped_gemm: False
    
    # For quick testing
    seq_length: 4096
    max_position_embeddings: 4096
    #train_iters: 5
    # lr_warmup_iters: 50
    # lr_wsd_decay_iters set per-stage by the inline sweep below.
    
    #eval_interval: 1000000000
    #save_interval: 1000000000

    # Base training configuration (for stable phase)
    micro_batch_size: 2 # Will be overridden by sweep
    global_batch_size: 128  # Will be overridden by sweep
    lr: 5.e-3  # Will be overridden by sweep

  env:
    TOKENIZERS_PARALLELISM: "false"
    HF_HUB_OFFLINE: "1"
    TRITON_HOME: /tmp/triton_cache


slurm:
  env:
    MASTER_PORT: "9999"
    # ROCm/LUMI: disable AITER rope backend (see megatron_sanity_check). Must live under
    # slurm.env because the LUMI launcher only exports slurm.env, not backend.env.
    USE_ROCM_AITER_ROPE_BACKEND: "0"
  srun_opts: "--label --cpu-bind=mask_cpu:0xfe000000000000,0xfe00000000000000,0xfe0000,0xfe000000,0xfe,0xfe00,0xfe00000000,0xfe0000000000 "
  sbatch:
    # nodes: "${oc.eval:'min(64, max(1, int(${backend.megatron.global_batch_size}//(${backend.megatron.micro_batch_size}*${slurm.sbatch.gpus_per_node}))))'}"
    nodes: 4
    # qos: "boost_qos_dbg"
    account: "project_462001516"
    partition: standard-g
    time: "00:30:00"
    output: "${job.base_output_dir}/logs/stdout-%j.log"
    error: "${job.base_output_dir}/logs/stderr-%j.log"
  srun:
    kill_on_bad_exit: "1 "


# ==============================================================================
# INLINE SWEEP: a single HP point + single load-balancing/routing combo, with a
# pull-based stable -> decay(50BT) cooldown. This is the z-loss sweep
# (sweep/multilingual_scaling/sparse_scaling/qwen3_sparse_0.4B_ne_z_loss_sweep.yaml)
# trimmed to ONE combo and ONE decay -- no expanded grid, no intermediate decays.
#
#   * GROUP 1  : one lr / global_batch_size / micro_batch_size / tokens
#   * GROUP 1b : one load-balancing type / z-loss coeff / topk / shared-expert
#   * GROUP 2  : token budget = 50BT -> {stable, decay50BT} (decay branches at 80% = 40BT)
#
# => 2 sweep points total. Escaped "\${...}" defers interpolation to per-point
# resolution (unescaped during sweep expansion), same as the reference sweeps.
# NOTE: 50BT is a placeholder budget; it will not finish in the 30-min slurm slot.
# Lower backend.megatron.aux.tokens (both places) for a quick smoke test.
# ==============================================================================
sweep:
  type: product

  groups:
    # GROUP 0: dynamic job name + wandb name, unique per stage/combo (so the
    # stable and decay get distinct base_output_dir / no checkpoint collisions).
    - type: list
      configs:
        - job.name: "\\${backend.megatron.aux.model_name}_experts\\${backend.megatron.num_experts}_lr\\${backend.megatron.lr}_gbsz\\${backend.megatron.global_batch_size}_topk\\${backend.megatron.moe_router_topk}_lbt\\${backend.megatron.moe_router_load_balancing_type}_aux\\${backend.megatron.moe_aux_loss_coeff}_zloss\\${backend.megatron.moe_z_loss_coeff}_\\${stage}\\${backend.megatron.aux.job_horizon_suffix}"
          backend.megatron.wandb_exp_name: "\\${job.name}"

    # GROUP 1: single hyperparameter combo (lr / gbsz / micro bsz / tokens=50BT).
    - type: list
      configs:
        - backend.megatron.lr: 1.e-2  # very high lr
          backend.megatron.global_batch_size: 128
          backend.megatron.micro_batch_size: 2
          backend.megatron.aux.tokens: 50_000_000_000

    # GROUP 1b: single load-balancing / routing combo. Swap these to change the
    # ablation. topk4 = 4 routed experts, no shared expert (size nulled).
    - type: list
      configs:
        - backend.megatron.moe_router_load_balancing_type: aux_loss
          backend.megatron.moe_aux_loss_coeff: 1.e-2
          backend.megatron.moe_z_loss_coeff: 1.e-3
          backend.megatron.moe_router_topk: 4
          backend.megatron.moe_shared_expert_intermediate_size: null

    # GROUP 2: pull-based multi-stage -> 1 stable + 1 decay(50BT).
    - type: list
      configs:
        # STABLE PHASE: train to aux.tokens (=50BT), no LR decay. Saves a branching
        # checkpoint at 80% (=40BT) via save_extra_steps (save_step_br_4 is the 50B
        # slot), which the decay below branches from.
        - stage: stable
          backend.megatron.train_iters: "\\${oc.eval:'(\\${backend.megatron.aux.tokens}+\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size}-1)//(\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size})'}"
          backend.megatron.lr_wsd_decay_iters: 0
          backend.megatron.aux.start_iter: "\\${oc.eval:'int(((\\${backend.megatron.aux.tokens}+\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size}-1)//(\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size}))*(1-\\${backend.megatron.aux.decay_fraction}))'}"
          # Horizon suffix for job.name: "<tokens_in_BT>BT" (here "50BT").
          backend.megatron.aux.job_horizon_suffix: "\\${oc.eval:'str(\\${backend.megatron.aux.tokens}//1_000_000_000)+\"BT\"'}"
          # Branching checkpoint at 80% of 50BT (the only branch point we need).
          backend.megatron.aux.save_step_br_4: "\\${oc.eval:'int(((50_000_000_000 + \\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size} - 1) // (\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size})) * (1 - \\${backend.megatron.aux.cooldown_decay_fraction}))'}"

        # NESTED GROUP: the single cooldown/decay stage. Loads the stable sibling's
        # 40BT branching checkpoint and decays LR over the last 20% of its iters.
        - type: list
          defaults:
            backend.megatron.aux.decay_fraction: "\\${backend.megatron.aux.cooldown_decay_fraction}"
            backend.megatron.train_iters: "\\${oc.eval:'(\\${backend.megatron.aux.tokens}+\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size}-1)//(\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size})'}"
            backend.megatron.lr_wsd_decay_iters: "\\${oc.eval:'int(((\\${backend.megatron.aux.tokens}+\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size}-1)//(\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size}))*\\${backend.megatron.aux.decay_fraction})'}"
            backend.megatron.aux.start_iter: "\\${oc.eval:'int(((\\${backend.megatron.aux.tokens}+\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size}-1)//(\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size}))*(1-\\${backend.megatron.aux.decay_fraction}))'}"

            # Checkpoint loading: pick up the stable sibling's checkpoint at the
            # branch iter (start_iter == 80% == save_step_br_4).
            backend.megatron.load: "\\${sibling.stable.job.base_output_dir}/checkpoints"
            backend.megatron.ckpt_step: "\\${backend.megatron.aux.start_iter}"
            backend.megatron.override_opt_param_scheduler: true

            # Start when the stable's branching checkpoint exists.
            job.start_condition:
              class_name: FileExistsCondition
              path: "\\${sibling.stable.job.base_output_dir}/checkpoints/iter_\\${oc.eval:'str(\\${backend.megatron.aux.start_iter}).zfill(7)'}"

            # Cancel the decay if the stable sibling crashed.
            job.cancel_condition:
              class_name: LogPatternCondition
              log_path: "\\${sibling.stable.job.log_path_current}"
              pattern: "FATAL ERROR|OutOfMemoryError|Traceback"

          configs:
            - stage: decay50BT
              backend.megatron.aux.tokens: 50_000_000_000
