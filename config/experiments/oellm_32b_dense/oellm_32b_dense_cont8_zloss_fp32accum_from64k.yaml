# @package _global_
#
# ============================================================================
# _cont8: TURN THE LM-HEAD z-LOSS ON. It has never been on.
# ============================================================================
# The name says "fp32 grad accumulation", which undersells it. Measurement says
# the flagship's output z-loss has contributed EXACTLY NOTHING to the weights
# for its entire life, and this arm is the first run in which it exists.
#
# ---------------------------------------------------------------------------
# THE MECHANISM, AND WHY IT IS EXACT RATHER THAN APPROXIMATE
# ---------------------------------------------------------------------------
# Production runs `cross_entropy_loss_fusion: true` with
# `cross_entropy_fusion_impl: native`, i.e. megatron/core/fusions/
# fused_cross_entropy.py. That kernel rounds the cross-entropy logit gradient
# to bf16 BEFORE the z-loss gradient is added to it:
#
#   calculate_gradients(...)  ->  grad_input = grad_input.to(torch.bfloat16)
#   backward(...)             ->  grad_input = grad_input + logsumexp_grad.to(bf16)
#
# For any non-target vocabulary entry both terms are proportional to the SAME
# softmax probability:
#
#   d(CE)/d(logit_v)     = w * softmax_v
#   d(z_loss)/d(logit_v) = w * 2 * coeff * logZ * softmax_v
#
# so their ratio is a constant, r = 2 * coeff * logZ, identical for every token
# and every vocabulary entry. bf16 carries 8 significant bits, so a value that
# is ALREADY on the bf16 grid -- which is exactly what the first line produces
# -- cannot move unless perturbed by more than half an ulp, i.e. by more than
# 2**-9 = 1.95e-3 relative in the best case.
#
# The flagship runs coeff = 1e-4 at logZ ~ 8 (the logged `output_z_loss` metric
# is mean(logZ**2) and sits at 59-67), so
#
#   r = 2 * 1e-4 * 8 = 1.6e-3  <  1.95e-3
#
# and the addition is a no-op on every element. Measured, not argued:
# scripts/korbi/zloss_bf16_probe.py at the production vocabulary of 256000 over
# 512 tokens reports
#
#   coeff     r         elements moved (of 131,072,000)   z-grad delivered
#   1.00e-4   1.60e-3                     0                    0.0000
#   1.22e-4   1.95e-3                     0                    0.0000
#   1.30e-4   2.08e-3            11,439,340                    ~0.9
#
# a CLIFF at r = 2**-9, not a gradual loss. With fp32 accumulation the same
# coeff = 1e-4 moves 29.5% of elements and delivers 0.78 of the intended
# gradient (the rest goes in the one unavoidable rounding of the total).
#
# ---------------------------------------------------------------------------
# WHAT THIS MEANS FOR EVERYTHING MEASURED SO FAR
# ---------------------------------------------------------------------------
#   * `output_z_loss` sitting flat at 59-67 for the whole run was read as "the
#     regularizer is holding". It is the opposite: a regularizer that is
#     working pulls logZ DOWN. Flat is what an inert term looks like.
#   * Every arm in this investigation -- the flagship, cont2, cont3, cont4,
#     cont5, cont6 -- carried a z-loss that did nothing, so none of them
#     distinguishes "z-loss does not help" from "z-loss was never applied".
#   * This is ALSO a latent nonstationarity in the control. The cliff is at
#     logZ = 2**-9 / (2 * coeff) = 9.77. If logZ ever drifts past ~9.8 the
#     bf16 path spontaneously starts working mid-run, with no config change.
#
# ---------------------------------------------------------------------------
# WHY THIS IS THE RIGHT FIX AND NOT "JUST RAISE THE COEFFICIENT"
# ---------------------------------------------------------------------------
# Raising coeff above 1.22e-4 would also get past the cliff, but it conflates
# two changes: it makes the regularizer real AND alters its strength, and it
# leaves the run one logZ drift away from the same silent switch. The flag
# fixes the arithmetic at the intended coefficient and behaves identically at
# every coefficient and every logZ.
#
# ---------------------------------------------------------------------------
# WHY THE LM HEAD IS THE RIGHT PLACE TO LOOK
# ---------------------------------------------------------------------------
# Two independent observations from the parallel continuations point here:
# most of the degradation sits in the loss on RARE tokens, and lowering the LM
# head's learning rate helped at first and then merely postponed the problem.
# Both are what an uncontrolled log-normalizer produces. A token's predicted
# log-probability is logit - logZ; if logZ drifts up, every token the model
# rarely sees loses probability mass, and a smaller head learning rate slows
# the drift without bounding it -- which is precisely "postponed, not fixed".
#
# Controlling logZ is the z-loss's entire job. It has not been doing it.
#
# ---------------------------------------------------------------------------
# READ-OFF
# ---------------------------------------------------------------------------
# The primary signal is NOT the loss, it is `output_z_loss` = mean(logZ**2):
#
#   REGULARIZER IS LIVE   it moves off 59-67 within a few hundred iterations.
#                         If it does not, the flag did not take effect and
#                         nothing else here is interpretable -- check the arg
#                         dump for --output-z-loss-fp32-grad-accum first.
#   HYPOTHESIS SUPPORTED  logZ comes down AND the train-loss slope flattens
#                         against the control below.
#   HYPOTHESIS DEAD       logZ comes down and the loss rises anyway at
#                         ~+0.003/1000, which would say logit-norm growth is a
#                         symptom rather than the cause.
#
# EXPECT A TRANSIENT AT THE FORK. Switching on a regularizer that has been
# inert for 64000 iterations is a real objective change; the first few hundred
# iterations will show the head reorganising. Fit the slope over >= 4000
# iterations of 2000-iteration bins, as everywhere in this investigation.
#
# The control is the flagship's own recorded curve from the same checkpoint:
#   bin      64000    66000    68000    70000    72000    74000
#   loss   1.544005 1.548968 1.556254 1.560867 1.573184 1.579815
#
# ---------------------------------------------------------------------------
# COST
# ---------------------------------------------------------------------------
# One fp32 logits shard is kept alive a little longer in the loss backward
# instead of being narrowed to bf16 immediately -- 2.1 GB at [4096, 2,
# 256000/4]. The sum is done in place on the kernel's own softmax scratch
# buffer, so there is no second allocation. Compute cost is one extra
# full-width add, ~1 ms against a 4.2 s step.
#
#   scripts/oellm_32b.sh --config-name experiments/oellm_32b_dense/oellm_32b_dense_cont8_zloss_fp32accum_from64k
#
# RUN WITH THE MONITOR -- the seed stage is a local job whose tracker the train
# stage gates on via FileExistsCondition, evaluated once under
# `--submit-and-exit`. Keep chain_repeat at 1; chain mode bypasses the gate.
#
# The /e/fscratch dataset index cache must already exist -- see cont6's header.
defaults:
  - oellm_32b_dense_cont6_diag_from64k
  - _self_

aux:
  # Same fork point, same parent tree, same data order as cont6. Inherited:
  # parent_ckpts, fork_iter 64000, fork_iter_dir iter_0064000.
  variant_tag: "prod_dataopt5_cont8_zlossfp32_seed1234"

backend:
  megatron:
    # ---- THE VARIABLE, and the only one --------------------------------------
    # output_z_loss_coeff stays at production's 1e-4 (inherited). This does not
    # change the regularizer's strength; it makes the strength it already had
    # reach the weights.
    output_z_loss_fp32_grad_accum: true

    # Everything else -- fp8 hybrid, masking, FA3, te218-fa3, lr 3e-4, GBS 4096,
    # TP4 x PP4 x VPP4, seed 1234 -- and the full cont6 diagnostics package are
    # inherited unchanged, so cont6 and this arm differ in one flag.
