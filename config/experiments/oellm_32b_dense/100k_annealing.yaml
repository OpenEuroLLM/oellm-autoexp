# @package _global_
#
# ============================================================================
# B1_reborn: SWITCH AT 92k, STABILIZE TO 100k, COOLDOWN 100000 -> 120000 1-sqrt
# ============================================================================
# Base: b1_reborn_base = the B1 recipe as it ran at 100k, on the B1 release
# Megatron 799ff4e (deferred head-wgrad FIXED; defer stays on).
#
# WHY THE SWITCH. B1 ran 82k-156k on 3fc1452 with the deferred-wgrad BUG
# (median grad norm ~0.38 vs ~0.07 once correct). Leaving the bug is itself a
# transient: at B1's own switch (~156.6k, bug -> defer off) the loss dropped
# 0.08 within 0.4k steps, rose +0.045 to a peak at +4.4k, was back at the drop
# level by +9k and still falling ~0.013 per 1k at +8k. The later switch at 192k
# (defer off -> FIXED defer) showed no transient at all, so fixed defer == off.
# Annealing straight from the buggy 100k would anneal through that bump;
# switching at 96k would start the anneal AT its peak. 92k gives 8k steps
# (one 12 h segment at ~4.35 s/step) -- past the peak, still settling: check
# the stabilize curve at 96k-100k before the anneal is released.
# (dump/b1_reborn/b1_loss_gradnorm.txt: B1 loss/grad norm, 82k-267k.)
#
# FOUR STAGES, ONE COMMAND:
#   seed      (local, login node) symlink tree of B1's iter_0092000 in this
#             run's own checkpoint directory + tracker 92000. Symlinks: the B1
#             checkpoints are jitsev1's and JUPITER refuses to hardlink other
#             users' files. B1's iter_* entries are themselves symlinks into
#             the /e/data1 mirror, so the source is readlink -f'd first (cp -a
#             on the link would copy the link, not the tree).
#   stabilize (512 nodes) 92000 -> 100000 with EXACTLY B1's data and schedule
#             (option5 mix, 894k WSD-linear, lr 3e-4 plateau), exit_interval
#             100000. Identical dataset settings -> B1's index cache
#             jj1/data_cache_link is a pure hit; it is read-only for us, so a
#             miss fails fast instead of rebuilding.
#   cache     (1 node, 1 rank, runs in parallel) builds the index for the
#             anneal mix + 120k schedule with a 2-layer stand-in model, into
#             prod_v2's anneal cache (mostly hits -> fast). Kept as a stage so
#             any missing file is built by 1 rank, not by the 512-node job.
#   anneal    (512 nodes) 100000 -> 120000 from our own iter_0100000, gated on
#             the stabilize run having exited at 100000 AND the cache log.
#
# ANNEAL CHANGES (cache + anneal stages only, from backend.aux.anneal_*):
#   data_args_path   datamix_jupiter_multilingual1_dominant3_complete.txt
#   data_cache_path  prod_v2's anneal cache (oellm_32b_dense_v2/cache_multilingual1_dominant3)
#   train_samples          120000 * GBS   schedule ends at 120k
#   lr_decay_samples       120000 * GBS
#   lr_wsd_decay_samples    20000 * GBS   window = 100000 -> 120000
#   lr_wsd_decay_style     minus_sqrt     lr = max_lr * (1 - sqrt(t / 20000))
# Consumed samples = iteration * 4096 (B1 log at 100k: 409600000), so the
# sample-based window starts exactly at 100k. override_opt_param_scheduler is
# set by the base (the checkpoint stores the 894k schedule).
#
#   PYTHONPATH=. python scripts/run_autoexp.py \
#       --config-name experiments/oellm_32b_dense/100k_annealing --dry-run
#
# DIRECTORIES: checkpoints per VARIANT (seed, stabilize and anneal share one
# tree: the anneal continues from stabilize's 100k); logs per STAGE job.name.
#
# CAVEAT: until stabilize writes its first own checkpoint (94000), a restart
# reads B1's files through the links.
#
# A KILLED CACHE BUILD POISONS THE CACHE (hit test is file presence only,
# 0-byte files read as hits -> "EOFError: No data left in file"). If the cache
# stage dies, before re-running it:
#   find <anneal cache path> -maxdepth 1 -type f -size 0 -delete
defaults:
  - b1_reborn_base
  - _self_

aux:
  b1_root: /e/fscratch/e-sta-openeurollm/oellm_32b_dense_b1
  # checkpoints (load/save/rolling) -- per variant, identical in all stages
  run_root: ${aux.b1_root}/${backend.aux.variant}

job:
  name: "oellm_32b_dense_${backend.aux.variant}"
  # logs/tensorboard/wandb -- per stage
  base_output_dir: ${aux.b1_root}/${job.name}

backend:
  aux:
    variant: "b1_reborn_92kswitch_100kcooldown120k"
    fork_iter: 92000
    fork_iter_dir: iter_0092000
    anneal_start_iter: 100000
    anneal_end_iter: 120000
    parent_ckpts: /e/fscratch/e-sta-openeurollm/jj1/reanimation_64k_20260911/B1-reborn-production/training_ckpts/checkpoints
    # The _complete mix is the plain one with every prefix moved from
    # training/collection/flag/ to flag_training_complete/. That tree holds a
    # symlink per dataset in flag/ plus the 16 mixture-vitae-1.0-nuggets
    # subsets that were missing on JUPITER, copied from LUMI (2026-09-24,
    # scripts/korbi/transfer_lumi_to_jupiter.sh).
    anneal_data: /e/data1/datasets/playground/mmlaion/oellm/datamix_jupiter_multilingual1_dominant3_complete.txt
    # SHARED with prod_v2's 100k anneal (same mix, 120k*GBS, seed, split, seq
    # length, tokenizer), so its index files are hits; anything that differs
    # is built next to them (writable; owned by poeppel1).
    anneal_cache: /e/fscratch/e-sta-openeurollm/oellm_32b_dense_v2/cache_multilingual1_dominant3
    anneal_train_samples: ${oc.muli:${backend.aux.anneal_end_iter},${backend.megatron.global_batch_size}}
    anneal_wsd_samples: ${oc.muli:${oc.subi:${backend.aux.anneal_end_iter},${backend.aux.anneal_start_iter}},${backend.megatron.global_batch_size}}

sweep:
  type: list
  store_sweep_json: true
  groups:
    - type: list
      configs:
        # ====== stage 0: symlink the fork checkpoint (login node) =============
        # No single quotes (template wraps it in bash -c '...') and no shell
        # ${VAR} (OmegaConf); plain $VAR is fine. Idempotent: the tracker is
        # the marker. A leftover .partial means an interrupted seed -- remove
        # it by hand (it only holds links, the parent is unaffected) and re-run.
        # No start_condition: B1 is far past the fork; the command re-checks.
        - stage: seed
          backend: bash
          job: auto_cancel
          job.name: "oellm_32b_dense_seed_${backend.aux.variant}"
          job.est_steps: 1
          job.est_step_time_s: 120
          job.est_startup_min: 1
          job.local: true
          # Any non-zero exit leaves SEED_FAILED in this job's output dir, which
          # the later stages' cancel_condition watches.
          backend.command: |
            set -eu
            SEED_DIR="${aux.b1_root}/oellm_32b_dense_seed_${backend.aux.variant}"
            MARKER="$SEED_DIR/SEED_FAILED"
            mkdir -p "$SEED_DIR"
            rm -f "$MARKER"
            on_exit() { rc=$?; if [ $rc -ne 0 ]; then touch "$MARKER"; fi; }
            trap on_exit EXIT
            SRC=$(readlink -f "${backend.aux.parent_ckpts}/${backend.aux.fork_iter_dir}")
            DST="${backend.megatron.save}"
            TRACKER="$DST/latest_checkpointed_iteration.txt"
            if [ -e "$TRACKER" ]; then
              echo "[seed] $TRACKER exists -- already seeded, skipping"
              exit 0
            fi
            PARENT_ITER=$(cat "${backend.aux.parent_ckpts}/latest_checkpointed_iteration.txt")
            if [ "$PARENT_ITER" -lt ${backend.aux.fork_iter} ] || [ ! -d "$SRC" ] || [ ! -f "$SRC/.metadata" ]; then
              echo "[seed] FATAL: parent tracker at $PARENT_ITER, or $SRC is no checkpoint (.metadata) -- refusing to seed"
              exit 1
            fi
            if [ -e "$DST/${backend.aux.fork_iter_dir}.partial" ]; then
              echo "[seed] FATAL: $DST/${backend.aux.fork_iter_dir}.partial left over from an interrupted seed"
              exit 1
            fi
            mkdir -p "$DST"
            cp -as "$SRC" "$DST/${backend.aux.fork_iter_dir}.partial"
            N_SRC=$(find "$SRC" -type f | wc -l)
            N_DST=$(find "$DST/${backend.aux.fork_iter_dir}.partial" -type l | wc -l)
            if [ "$N_SRC" -eq 0 ] || [ "$N_SRC" -ne "$N_DST" ]; then
              echo "[seed] FATAL: $N_SRC files in $SRC but $N_DST links in the seed"
              exit 1
            fi
            mv "$DST/${backend.aux.fork_iter_dir}.partial" "$DST/${backend.aux.fork_iter_dir}"
            echo "${backend.aux.fork_iter}" > "$TRACKER"
            echo "[seed] symlinked $N_DST files of $SRC into $DST/${backend.aux.fork_iter_dir}"
            echo "[seed] wrote $TRACKER = ${backend.aux.fork_iter}"

        # ====== stage 1: stabilize 92k -> 100k on B1's own data/schedule ======
        # Everything from b1_reborn_base (B1 data, B1 cache, 894k schedule);
        # only the stop changes. exit_interval's 'exiting program at iteration
        # N' is deliberately NOT restarted by the job policy.
        - stage: stabilize
          job.name: "oellm_32b_dense_stabilize_${backend.aux.variant}"
          job.est_steps: ${oc.subi:${backend.aux.anneal_start_iter},${backend.aux.fork_iter}}
          backend.megatron.exit_interval: ${backend.aux.anneal_start_iter}
          job.start_condition:
            class_name: FileExistsCondition
            path: "${backend.megatron.save}/latest_checkpointed_iteration.txt"
          job.cancel_condition:
            class_name: FileExistsCondition
            path: "${aux.b1_root}/oellm_32b_dense_seed_${backend.aux.variant}/SEED_FAILED"

        # ====== stage 2: build the anneal dataset index (1 node, 1 rank) ======
        # ONE rank: index building runs on rank 0 while the others wait in a
        # barrier, and that barrier's NCCL watchdog killed an earlier 4-rank
        # prebuild (job 1354000). The data/schedule keys must stay identical to
        # the anneal stage's -- both read them from backend.aux.anneal_*.
        - stage: cache
          job: auto_cancel
          job.name: "oellm_32b_dense_datacache_${backend.aux.variant}"
          job.est_steps: 1
          job.est_step_time_s: 7200
          job.est_startup_min: 5
          backend.megatron.data_args_path: ${backend.aux.anneal_data}
          backend.megatron.data_cache_path: ${backend.aux.anneal_cache}
          backend.megatron.train_samples: ${backend.aux.anneal_train_samples}
          backend.megatron.lr_decay_style: WSD
          backend.megatron.lr_wsd_decay_style: minus_sqrt
          backend.megatron.lr_decay_samples: ${backend.aux.anneal_train_samples}
          backend.megatron.lr_wsd_decay_samples: ${backend.aux.anneal_wsd_samples}
          # slurm.sbatch.nodes is the real knob; torchrun's nnodes is tied to
          # an aux value in base.yaml, so it is pinned here as well.
          backend.torchrun_args.nnodes: 1
          backend.torchrun_args.nproc_per_node: 1
          slurm.sbatch.nodes: 1
          slurm.sbatch.time: "04:00:00"
          backend.megatron.skip_train: true
          backend.megatron.distributed_timeout_minutes: 720
          # no checkpoint in or out, no logging artefacts
          backend.megatron.load: null
          backend.megatron.save: null
          backend.megatron.exit_on_missing_checkpoint: false
          backend.megatron.non_persistent_ckpt_type: null
          backend.megatron.non_persistent_global_ckpt_dir: null
          backend.megatron.non_persistent_save_interval: null
          backend.megatron.wandb_project: null
          backend.megatron.tensorboard_dir: null
          # stand-in model: irrelevant to the cache key
          backend.megatron.num_layers: 2
          backend.megatron.hidden_size: 256
          backend.megatron.ffn_hidden_size: 512
          backend.megatron.num_attention_heads: 4
          backend.megatron.num_query_groups: 4
          backend.megatron.kv_channels: 64
          backend.megatron.tensor_model_parallel_size: 1
          backend.megatron.pipeline_model_parallel_size: 1
          backend.megatron.pipeline_model_parallel_layout: null
          backend.megatron.sequence_parallel: false
          backend.megatron.tp_comm_overlap: false
          backend.megatron.overlap_grad_reduce: false
          backend.megatron.overlap_param_gather: false
          backend.megatron.defer_embedding_wgrad_compute: false
          backend.megatron.fp8: null
          backend.megatron.micro_batch_size: 1
          backend.megatron.num_dataset_builder_threads: 64

        # ====== stage 3: the cooldown 100k -> 120k ============================
        - stage: anneal
          job.name: "oellm_32b_dense_${backend.aux.variant}"
          job.est_steps: ${oc.subi:${backend.aux.anneal_end_iter},${backend.aux.anneal_start_iter}}
          backend.megatron.data_args_path: ${backend.aux.anneal_data}
          backend.megatron.data_cache_path: ${backend.aux.anneal_cache}
          backend.megatron.train_samples: ${backend.aux.anneal_train_samples}
          backend.megatron.lr_decay_style: WSD
          backend.megatron.lr_wsd_decay_style: minus_sqrt
          backend.megatron.lr_decay_samples: ${backend.aux.anneal_train_samples}
          backend.megatron.lr_wsd_decay_samples: ${backend.aux.anneal_wsd_samples}
          backend.megatron.exit_interval: ${backend.aux.anneal_end_iter}
          job.start_condition:
            class_name: AndCondition
            conditions:
              # stabilize's 100k checkpoint is complete (tracker is written
              # after the async save is finalized) ...
              - class_name: FileContentCondition
                path: "${backend.megatron.save}/latest_checkpointed_iteration.txt"
                mode: regex
                pattern: "^\\s*${backend.aux.anneal_start_iter}\\s*$"
              # ... and the stabilize job has actually exited there
              - class_name: FileContentCondition
                path: "${aux.b1_root}/oellm_32b_dense_stabilize_${backend.aux.variant}/logs/current.log"
                pattern: "exiting program at iteration ${backend.aux.anneal_start_iter}"
              - class_name: FileContentCondition
                path: "${aux.b1_root}/oellm_32b_dense_datacache_${backend.aux.variant}/logs/current.log"
                pattern: "skipping training (--skip-train is on)"
          # Drop the anneal (never submitted) if a prerequisite fails, instead
          # of waiting forever. Checked every poll while it is pending.
          job.cancel_condition:
            class_name: OrCondition
            conditions:
              - class_name: FileExistsCondition
                path: "${aux.b1_root}/oellm_32b_dense_seed_${backend.aux.variant}/SEED_FAILED"
              - class_name: FileContentCondition
                path: "${aux.b1_root}/oellm_32b_dense_datacache_${backend.aux.variant}/logs/current.log"
                mode: regex
                pattern: "Traceback|DUE TO TIME LIMIT|CANCELLED AT|srun: error"
