# @package _global_
#
# ============================================================================
# DOES THE SOFTCAP'S TRAIN-LOSS WIN SHOW UP DOWNSTREAM?
# ============================================================================
# cont9 (final_logit_softcapping 30.0, z-loss off) looks good on train loss.
# Train loss is not the claim anyone cares about, so this scores it on the eval
# suite against the flagship -- on the same tasks, and through the same exports,
# the existing production series was measured with.
#
#   --array-subset 0   eval  production @ 64000   shared origin + PIPELINE CHECK
#   --array-subset 1   eval  production @ 68000   the baseline
#   --array-subset 2   convert cont9  @ 68000     the only conversion needed
#   --array-subset 3   eval  cont9     @ 68000    uncapped
#   --array-subset 4   build capped views         local, seconds
#   --array-subset 5   eval  production @ 68000   CAPPED
#   --array-subset 6   eval  cont9     @ 68000    CAPPED
#
# ============================================================================
# WHAT WE ARE MEASURING AGAINST
# ============================================================================
# jitsev1's eval workspace already holds 42 HF conversions and a results
# database at /e/fscratch/e-sta-openeurollm/jj1/eval/eval_browser/eval_browser.sqlite
# (queryable read-only; arms production / revival1 / head2e-4 / head1.5e-4 /
# bf16). Its production arm covers 21 iterations from 4000 to 75126, including
# both of ours:
#
#   task_group            64000     68000     delta
#   global-mmlu-eu        0.5613    0.5526    -0.0088   (1116 tasks)
#   open-sci-0.01         0.6505    0.6428    -0.0078   (73 tasks)
#   belebele-eu-5-shot    0.8107    0.7892    -0.0215   (24 tasks)
#
# So the degradation IS already visible downstream on every group. That is the
# effect cont9 has to beat, and a far better baseline than this config could
# produce on its own. Two consequences, and they are why it looks like this:
#
#   * NO BASELINE CONVERSIONS. production_64000 and production_68000 are already
#     exported. Re-converting would cost two 32B conversions and make the
#     comparison depend on whether our bridge run matches theirs. Subsets 0 and
#     1 evaluate THEIR exports directly.
#   * TASK GROUPS ARE PINNED to the three above -- not the `oellm-multilingual`
#     super-group, which pulls in flores, mgsm, include and generic-multilingual,
#     tasks their production series has no numbers for.
#
# SUBSET 0 IS A PIPELINE CHECK, not a data point. It runs their production_64000
# export through OUR eval and should reproduce 0.5613 / 0.6505 / 0.8107. If it
# does, every cont9 number here is comparable to their whole series -- revival1
# and the head-LR arms included -- not just to subset 1. If it does not, the
# harnesses differ and only within-this-config comparisons hold.
#
# It doubles as the shared origin: cont9's iter_0064000 is a SYMLINK to the
# flagship's, so production_64000 IS cont9 at its fork point. There is no fourth
# model to convert.
#
# ============================================================================
# THE EXPORT DOES NOT CARRY THE SOFTCAP. READ BEFORE INTERPRETING.
# ============================================================================
# `final_logit_softcapping` exists in Megatron-Bridge only for Gemma 2 and
# Gemma-VL, and the Qwen3 HF config has no such field, so an exported cont9 runs
# UNCAPPED unless something puts the cap back.
#
#   ARGMAX / ACCURACY tasks are unaffected: c*tanh(x/c) is strictly monotone, so
#   logit order within a token is preserved exactly (verified).
#   LIKELIHOOD tasks are not. Measured on a realistic logit distribution, capped
#   and uncapped log-probabilities differ by up to 6.6 nats, and multiple-choice
#   options can reorder.
#
# The bias is not neutral: cont9's weights were shaped WITH the cap compressing
# them, so scoring uncapped can make it look overconfident -- against the arm
# under test, on exactly the metrics the question is about. Hence the 2x2:
#
#                        eval uncapped     eval CAPPED
#     production @ 68k   subset 1          subset 5
#     cont9      @ 68k   subset 3          subset 6
#
#     6 vs 3   what the cap is worth at inference on cont9's own weights
#     6 vs 5   what TRAINING with the cap did, both scored under one objective
#     5 vs 1   the null: does capping help a model never trained with it
#
# cont9's headline number is SUBSET 6 -- the model as trained and as it would be
# deployed. Subset 3 measures it off its own objective.
#
# ============================================================================
# THE TOKENIZER IS NOT INTERCHANGEABLE
# ============================================================================
# The first three conversions (jobs 1735753/54/55) died in the bridge's tokenizer
# probe, before touching a weight:
#
#   ValueError: Error parsing line b'\x0e' in .../oellm_tokenizer_256k/tokenizer.model
#
# The flagship tokenizer is a slow LlamaTokenizer -- SentencePiece, no
# tokenizer.json -- and the bridge container's transformers routes it through the
# TIKTOKEN converter. A directory that already has tokenizer.json avoids that.
#
# But not just any such directory. run_export.py's `_vocab_size_of` returns
# len(tokenizer), and this model's padded_vocab_size is 262144. jitsev1's
# tokenizer_256k_hf gives len 262144. Rebuilding one from the SentencePiece
# source with save_pretrained keeps the extra added token and gives 262145,
# which would write vocab_size 262145 into config.json and mis-size the output
# layer -- silently, in an export that otherwise looks fine.
# scripts/korbi/make_fast_tokenizer.py rebuilds an equivalent and refuses if
# len(tok) is not 262144.
#
#   scripts/oellm_32b.sh --config-name experiments/oellm_32b_dense/softcap_downstream_eval --array-subset 0
#   ... through 6. Subset 2 must finish before 3; subset 4 before 5 and 6. Each
#   gates on its own input via FileExistsCondition, so under the monitor this is
#   one command.
#
# ============================================================================
# REVIEW POINTS
# ============================================================================
#   1. Resources are still guesses -- 4 GPUs, 2 h for the one conversion, 4 h per
#      eval. global-mmlu-eu is 1116 tasks and is the long pole; adjust after the
#      first eval reports.
#   2. Only 68000 exists for cont9. 72000 would turn a two-point difference into
#      a trend, and their production series already has 72000 to compare against.
#   3. dclm-core-rest is in their database too (3.538 -> 3.4713) but its metric is
#      not an accuracy, so it is left out rather than mixed into the table above.
defaults:
  - /backend: megatron_bridge
  - /container: jupiter
  - /slurm: jupiter
  - /job: default
  - /sweep: none
  - _self_

index: 0
stage: "convert"

aux:
  # ---- READ ONLY: jitsev1's exports and tokenizer --------------------------
  jj1_hf: /e/fscratch/e-sta-openeurollm/jj1/eval/hf
  tokenizer: /e/fscratch/e-sta-openeurollm/jj1/eval/tokenizer_256k_hf

  # ---- OURS: everything this comparison writes -----------------------------
  eval_root: /e/fscratch/e-sta-openeurollm/poeppel1/eval/softcap_downstream

  # ---- the one thing not already converted ---------------------------------
  cont9_ckpts: /e/scratch/e-sta-openeurollm/production_training/oellm_32b_dense_prod_dataopt5_cont9_softcap30_seed1234/checkpoints
  cont9_cfg: /e/project1/e-sta-openeurollm/production_training/oellm_32b_dense_prod_dataopt5_cont9_softcap30_seed1234_gbs4096_lr3e-4/logs/current.yaml

  bridge_image: /e/project1/e-sta-openeurollm/container/MegatronTraining-JUPITER-bridge-bridge_aarch64_202605191331.sif
  eval_venv: ${oc.env:OELLM_EVAL_VENV,"${oc.env:HOME}/work/venv"}

job:
  name: "softcap_downstream_eval"
  base_output_dir: ${aux.eval_root}/logs/${index}_${stage}

backend:
  hf_model: "Qwen/Qwen3-32B"
  tokenizer: ${aux.tokenizer}
  derive_hf_arch: "qwen3"
  bridge_root: "/workspace/oellm-autoexp/submodules/Megatron-Bridge"
  resources: "/workspace/oellm-autoexp/oellm_autoexp/postprocess/resources/megatron_bridge"

# NOTE: the bridge container is set on the CONVERT stage only, not here. A body
# assignment beats a defaults-group override, so `container.image` in this block
# would merge on top of the eval stages' `container: jupiter_venv` and fail
# schema validation -- VenvConfig has no `image` or `bind`.

slurm:
  # Same workaround as the training arms: since the 2026-09-03 Slurm upgrade, srun
  # intermittently cannot create its process reservation on booster
  # (PSI_spawnRsrvtn), and at one node it failed roughly half the time. These stages
  # are one task running plain python -- no MPI -- so --mpi=none costs nothing and
  # avoids it. Remove once the site confirms the spawn regression is fixed.
  srun_opts: "--mpi=none"
  sbatch:
    job_name: null
    nodes: 1
    gpus_per_node: 4
    time: "02:00:00"

sweep:
  type: list
  store_sweep_json: true
  groups:
    - type: list
      # Applied to every stage below. Pinned to exactly the groups jitsev1's
      # production series has numbers for, so results are comparable rather than
      # merely adjacent. Ignored by the convert and patch stages.
      defaults:
        backend.task_groups:
          - open-sci-0.01
          - global-mmlu-eu
          - belebele-eu-5-shot
        # PINNED, not inherited from the submitting shell. Compute nodes have no
        # internet, so every dataset must already be in this cache; resolving
        # HF_HOME from the environment means a submission from the wrong shell
        # fails deep inside lm-eval rather than at submit time.
        #
        # Coverage was checked against the three groups above, not assumed:
        # open-sci-0.01's 12 tasks resolve to datasets already present (boolq and
        # copa come from aps___super_glue), and the two that were MISSING --
        # CohereForAI___global-mmlu and facebook___belebele -- were copied from
        # jitsev1's hf_home and verified byte-identical (188,771,022 and
        # 19,509,228 bytes, 2106 and 72 files, no dangling symlinks). Using their
        # copies rather than re-downloading also means we score on the same bytes
        # they did, which is part of why the numbers are comparable.
        backend.env.HF_HOME: /e/project1/jureap59/poeppel1/cache
        backend.env.HF_HUB_OFFLINE: "1"
        backend.env.HF_DATASETS_OFFLINE: "1"
      configs:
        # ===== 0: THEIR production_64000 through OUR eval -- pipeline check ===
        # Expect 0.5613 / 0.6505 / 0.8107. Also the shared origin: cont9's
        # iter_0064000 is a symlink to the flagship's, so this IS cont9 at fork.
        - stage: eval_base64k
          backend: oellm_eval
          container: jupiter_venv
          slurm: jupiter_venv
          backend.models:
            - ${aux.jj1_hf}/production_64000
          backend.venv_path: ${aux.eval_venv}
          backend.local: true
          backend.skip_checks: true
          backend.verbose: true
          backend.env.EVAL_BASE_DIR: ${aux.eval_root}/results
          backend.env.EVAL_OUTPUT_DIR: ${aux.eval_root}/results
          slurm.sbatch.time: "06:00:00"

        # ===== 1: the baseline at 68000, their export ========================
        - stage: eval_base68k
          backend: oellm_eval
          container: jupiter_venv
          slurm: jupiter_venv
          backend.models:
            - ${aux.jj1_hf}/production_68000
          backend.venv_path: ${aux.eval_venv}
          backend.local: true
          backend.skip_checks: true
          backend.verbose: true
          backend.env.EVAL_BASE_DIR: ${aux.eval_root}/results
          backend.env.EVAL_OUTPUT_DIR: ${aux.eval_root}/results
          slurm.sbatch.time: "06:00:00"

        # ===== 2: the ONLY conversion -- cont9 @ 68000 =======================
        - stage: convert_cont9_68k
          backend.megatron_path: ${aux.cont9_ckpts}/iter_0068000
          backend.megatron_config_path: ${aux.cont9_cfg}
          backend.hf_path: ${aux.eval_root}/hf/cont9_68000
          container.image: ${aux.bridge_image}
          container.bind:
            - "/e"
            - "/dev/shm"
            - "${oc.env:HOME}/work/Projects/oellm-autoexp:/workspace/oellm-autoexp"

        # ===== 3: make that export SOFTCAPPED, in place ======================
        # The bridge cannot write final_logit_softcapping for Qwen3, so the export
        # lands uncapped. This rewrites its config.json to the softcap subclass and
        # drops the module beside it -- seconds, no weights touched, no second copy.
        # IN PLACE on purpose: we do not want an uncapped variant lying around to be
        # evaluated by mistake. The raw export is reproducible from the checkpoint.
        - stage: cap_cont9_68k
          backend: bash
          job: auto_cancel
          job.name: "softcap_cap_export"
          job.local: true
          job.est_steps: 1
          job.est_step_time_s: 30
          job.est_startup_min: 1
          slurm.launcher_cmd: ""
          slurm.sbatch.nodes: 1
          slurm.sbatch.time: "00:15:00"
          slurm.sbatch.job_name: null
          job.start_condition:
            class_name: FileExistsCondition
            path: ${aux.eval_root}/hf/cont9_68000/model.safetensors.index.json
          backend.command: |
            set -eu
            REPO="${oc.env:HOME}/work/Projects/oellm-autoexp"
            D="${aux.eval_root}/hf/cont9_68000"
            python3 "$REPO/scripts/korbi/make_capped_hf_view.py" "$D" "$D" --cap 30.0 \
              --template "$REPO/oellm_autoexp/postprocess/resources/megatron_bridge/templates/modeling_qwen3_softcap.py"

        # ===== 4: cont9 @ 68000, softcapped -- the headline number ===========
        - stage: eval_cont9_68k
          backend: oellm_eval
          container: jupiter_venv
          slurm: jupiter_venv
          backend.models:
            - ${aux.eval_root}/hf/cont9_68000
          backend.venv_path: ${aux.eval_venv}
          backend.local: true
          backend.skip_checks: true
          backend.verbose: true
          backend.trust_remote_code: true
          backend.env.EVAL_BASE_DIR: ${aux.eval_root}/results
          backend.env.EVAL_OUTPUT_DIR: ${aux.eval_root}/results
          # Gates on the softcap module, so it cannot start before stage 3 has
          # capped the export -- which is what makes "uncapped never runs" true.
          job.start_condition:
            class_name: FileExistsCondition
            path: ${aux.eval_root}/hf/cont9_68000/modeling_qwen3_softcap.py
          slurm.sbatch.time: "06:00:00"

        # ===== 5: build our results DB, in their schema ======================
        # Same `aggregates` schema as their eval_browser.sqlite, so the same tooling
        # reads both and they can be joined task-for-task. The ingest parser was
        # validated by re-parsing THEIR tree: 2486 of 2486 rows reproduced exactly,
        # max abs diff 0.0.
        - stage: build_db
          backend: bash
          job: auto_cancel
          job.name: "softcap_eval_db"
          job.local: true
          job.est_steps: 1
          job.est_step_time_s: 60
          job.est_startup_min: 1
          slurm.launcher_cmd: ""
          slurm.sbatch.nodes: 1
          slurm.sbatch.time: "00:30:00"
          slurm.sbatch.job_name: null
          job.start_condition:
            class_name: FileExistsCondition
            path: ${aux.eval_root}/results
          backend.command: |
            set -eu
            REPO="${oc.env:HOME}/work/Projects/oellm-autoexp"
            DB="${aux.eval_root}/eval_results.sqlite"
            REF=/e/fscratch/e-sta-openeurollm/jj1/eval/eval_browser/eval_browser.sqlite
            python3 "$REPO/scripts/korbi/eval_results_db.py" ingest \
              --root "${aux.eval_root}/results" --db "$DB" --label poeppel1 --replace
            echo "--- our cont9_68000 vs their production_68000 ---"
            python3 "$REPO/scripts/korbi/eval_results_db.py" compare \
              --db "$DB" --ours cont9_68000 --ref-db "$REF" --theirs production_68000 || true
            echo "--- pipeline check: our production_64000 vs theirs ---"
            python3 "$REPO/scripts/korbi/eval_results_db.py" compare \
              --db "$DB" --ours production_64000 --ref-db "$REF" --theirs production_64000 || true
