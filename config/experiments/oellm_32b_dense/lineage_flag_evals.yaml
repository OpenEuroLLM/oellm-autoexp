# @package _global_
#
# ============================================================================
# FULL FLAG SUITE (438) FOR THE PRE-ANNEAL LINEAGE CHECKPOINTS (60k - 100k)
# ============================================================================
# The whole job in one config: aux.lineage_ckpts (every checkpoint) x the stage chain of
# b1_reborn_evals.yaml, every allocation a job of this config:
#
#   convert   1 node     only for checkpoints whose HF export does not exist yet (exists: false;
#                        the sweep filter drops the others): eval_checkpoints.sh convert-here ->
#                        downstream_eval_32b/hf/<name>, .convert_done written last
#   prepare   login node eval_checkpoints.sh flag-prepare: views + launchers, NOT submitted;
#                        waits on config.json (existing export) or .convert_done (new one)
#   eval      ONE SLURM array per checkpoint, one task per eval (438); a failed task is
#                        resubmitted once, alone; a row that already succeeded is skipped
#   collect   login node eval_checkpoints.sh flag-collect -> $FLAG_WORK/results/<name>.flag-evals-438.tasks.csv
#
# Lineages (2026-10-07; symlink seeds checked). Shared checkpoints are evaluated once:
#   step   v1            v1C           v1T           v2
#   60k    oldprod_60k   v2_60k        (= v1C)       v2_60k
#   70k    b1prod_70k    b1cons_70k    (= v1C)       v2zloss_70k
#   80k    b1prod_80k    b1cons_80k    b1cons_80k    v2zloss_80k
#   90k    b1prod_90k    b1cons_90k    tweo_90k      v2zloss_90k
#   100k   v1anneal_100k v1annealC_100k v1annealT_100k v2anneal_100k
# v1C started from v2's 60k; v1T (TWEO) branched from B1-conservative's 80k. The 100k anneal
# starts of v1 / v1C / v2 already have the full suite (listed for completeness, not selected by default).
#
# Selecting (re-runs): aux.ckpt_select (export names; default: the 13 without the full suite;
# null = all 16) and
# aux.flag_select (eval names half/task/n_shot; null = all 438), e.g.
#   PYTHONPATH=. python scripts/run_autoexp.py --config-name experiments/oellm_32b_dense/lineage_flag_evals \
#       'aux.ckpt_select=[b1prod_70k]' 'aux.flag_select=[vllm/AIME24/0]'
#
# Exports owned by another user (v2_60k, v2zloss_80k: vanosch1): the lighteval "plain" view
# (`cp -al <export>`) fails on their read-only tokenizer files and leaves no view; build those
# views per file first (dump/lineage_evals/plain_copies.sh: link the shards, copy the rest).
#
#   PYTHONPATH=. python scripts/run_autoexp.py --config-name experiments/oellm_32b_dense/lineage_flag_evals
# Keep the session running until every `collect` has finished.
# Cost (b1_266k, measured 2026-10-05): 438 tasks = 42 node-hours per checkpoint.
# ============================================================================
defaults:
  - b1_reborn_base
  - /eval_tasks@aux.flag_suite: flag_evals
  - _self_

aux:
  repo: ${oc.env:OELLM_AUTOEXP_ROOT,${oc.env:PWD}}   # launch from the repo root
  v2z_ckpts: /e/scratch/e-sta-openeurollm/production_training/oellm_32b_v2_zloss_unfused_i60k_gbs4096_lr1.76e-4/checkpoints
  # Every checkpoint of the lineages. exists: the HF export is already in export_root (no
  # conversion); ckpt: the Megatron checkpoint (only read when exists is false).
  lineage_ckpts:
    - {name: oldprod_60k,    lines: [v1],          step: 60000,  exists: true,  ckpt: ""}
    - {name: v2_60k,         lines: [v1C, v2],     step: 60000,  exists: true,  ckpt: ""}
    - {name: b1prod_70k,     lines: [v1],          step: 70000,  exists: true,  ckpt: ""}
    - {name: b1cons_70k,     lines: [v1C],         step: 70000,  exists: true,  ckpt: ""}
    - {name: v2zloss_70k,    lines: [v2],          step: 70000,  exists: false, ckpt: "${aux.v2z_ckpts}/iter_0070000"}
    - {name: b1prod_80k,     lines: [v1],          step: 80000,  exists: true,  ckpt: ""}
    - {name: b1cons_80k,     lines: [v1C, v1T],    step: 80000,  exists: true,  ckpt: ""}
    - {name: v2zloss_80k,    lines: [v2],          step: 80000,  exists: true,  ckpt: ""}
    - {name: b1prod_90k,     lines: [v1],          step: 90000,  exists: true,  ckpt: ""}
    - {name: b1cons_90k,     lines: [v1C],         step: 90000,  exists: true,  ckpt: ""}
    - {name: tweo_90k,       lines: [v1T],         step: 90000,  exists: true,  ckpt: ""}
    - {name: v2zloss_90k,    lines: [v2],          step: 90000,  exists: false, ckpt: "${aux.v2z_ckpts}/iter_0090000"}
    - {name: v1anneal_100k,  lines: [v1],          step: 100000, exists: true,  ckpt: ""}
    - {name: v1annealC_100k, lines: [v1C],         step: 100000, exists: true,  ckpt: ""}
    - {name: v1annealT_100k, lines: [v1T],         step: 100000, exists: true,  ckpt: ""}
    - {name: v2anneal_100k,  lines: [v2],          step: 100000, exists: true,  ckpt: ""}
  # The checkpoints to run, by name; null = all of lineage_ckpts. Default: all but the three
  # 100k anneal starts that already have the full suite (v1anneal_100k, v1annealC_100k, v2anneal_100k).
  ckpt_select: [oldprod_60k, v2_60k, b1prod_70k, b1cons_70k, v2zloss_70k, b1prod_80k, b1cons_80k,
                v2zloss_80k, b1prod_90k, b1cons_90k, tweo_90k, v2zloss_90k, v1annealT_100k]
  ckpt_indices: ${oc.select_indices:${aux.lineage_ckpts},name,${aux.ckpt_select}}
  # One checkpoint, for the point that sets ck_i (a position in lineage_ckpts). Outside the sweep
  # because only the base config is re-resolved per point; the stages reference these escaped.
  ck_i: 0
  export_name: ${oc.index:${aux.lineage_ckpts},${aux.ck_i},name}
  export_exists: ${oc.index:${aux.lineage_ckpts},${aux.ck_i},exists}
  eval_ckpt: ${oc.index:${aux.lineage_ckpts},${aux.ck_i},ckpt}
  export_root: /e/scratch/e-sta-openeurollm/production_training/downstream_eval_32b/hf
  export_ready: "${aux.export_root}/${aux.export_name}/${oc.if:${aux.export_exists},config.json,.convert_done}"
  flag_work: /e/scratch/e-sta-openeurollm/${oc.env:USER}/flag-evals
  oellm_eval: ${aux.repo}/submodules/oellm-eval
  # The evals to run, by name (half/task/n_shot); null = all 438.
  flag_select: null
  flag_indices: ${oc.select_indices:${aux.flag_suite.tasks},name,${aux.flag_select}}
  # One eval, for the eval-stage point that sets flag_i (a position in flag_suite.tasks).
  flag_i: 0
  flag_half: ${oc.index:${aux.flag_suite.tasks},${aux.flag_i},half}
  flag_row: ${oc.index:${aux.flag_suite.tasks},${aux.flag_i},row}
  flag_task: ${oc.index:${aux.flag_suite.tasks},${aux.flag_i},task}
  flag_done: ${aux.flag_work}/runs/${aux.export_name}/${aux.flag_half}/done/${aux.flag_row}.ok
  flag_run_one: "${aux.oellm_eval}/scripts/jupiter_flag_evals.sh run-one ${aux.export_name} ${aux.flag_half} ${aux.flag_row} \"${aux.flag_task}\""

sweep:
  type: product
  store_sweep_json: true
  # No conversion for checkpoints whose export already exists.
  filter: "\\${oc.eval:'not (\"\\${stage}\" == \"convert\" and \\${aux.export_exists})'}"
  groups:
    # ====== the checkpoints ======
    - type: product
      params:
        aux.ck_i: ${aux.ckpt_indices}

    # ====== the stage chain, per checkpoint. Every per-checkpoint value is escaped (\${...}):
    # sweep values resolve at the root, only aux is re-resolved per point.
    - type: list
      configs:
        # ====== convert (Megatron -> HF, in this stage's allocation) ======
        # Bash stages: no single quotes, no shell ${VAR} (OmegaConf); $VAR is fine.
        - stage: convert
          backend: bash
          slurm: jupiter_driver
          job: default
          job.name: "lineage_convert_\\${aux.export_name}"
          job.est_steps: 1
          job.est_step_time_s: 1500
          job.est_startup_min: 2
          backend.env:
            MODEL: "32b_dense"
          backend.command: |
            set -eu
            ${aux.repo}/scripts/downstream_eval/eval_checkpoints.sh convert-here \${aux.export_name} \${aux.eval_ckpt}
          slurm.sbatch.account: e-sta-openeurollm
          slurm.sbatch.nodes: 1
          slurm.sbatch.time: "01:00:00"
          # inherited from the 512-node training job: its USR1 would end this batch shell
          slurm.sbatch.signal: null
          slurm.sbatch.comment: null

        # ====== FLAG launchers for the export (login node: views + render, no submission)
        - stage: prepare
          backend: bash
          job: default
          job.local: true
          job.name: "lineage_prepare_\\${aux.export_name}"
          job.est_steps: 1
          job.est_step_time_s: 120
          job.est_startup_min: 0
          job.start_condition:
            class_name: FileExistsCondition
            path: "\\${aux.export_ready}"
          backend.env:
            MODEL: "32b_dense"
            FLAG_WORK: ${aux.flag_work}
            FLAG_ACCOUNT: "e-sta-openeurollm"
            FLAG_SUBSET: ${oc.if:${oc.eq:${oc.len:${aux.flag_indices}},${aux.flag_suite.count}},"","1"}
            # A checkout without git metadata (an rsynced test clone) cannot prove the
            # oellm-eval pin; launch with ALLOW_EVAL_REV_MISMATCH=1 there.
            ALLOW_EVAL_REV_MISMATCH: ${oc.env:ALLOW_EVAL_REV_MISMATCH,"0"}
          backend.command: |
            set -eu
            ${aux.repo}/scripts/downstream_eval/eval_checkpoints.sh flag-prepare \${aux.export_name}

        # ====== FLAG evals: ONE SLURM array per checkpoint, one task (and monitor record) per eval
        # A `params` leaf whose `defaults` carry the stage settings: one point per eval.
        - params:
            aux.flag_i: ${aux.flag_indices}
          defaults:
            stage: eval
            backend: bash
            slurm: jupiter_driver
            job: array_task
            job.name: "lineage_eval_\\${aux.export_name}"
            job.array_group: "lineage_eval_\\${aux.export_name}"
            job.est_steps: 1
            # 32B: b1_266k's 438 evals took 42 node-hours, ~6 min per task
            job.est_step_time_s: 345
            job.est_startup_min: 0
            job.start_condition:
              class_name: FileExistsCondition
              path: "${aux.flag_work}/state/\\${aux.export_name}.env"
            job.finish_condition:
              class_name: FileExistsCondition
              path: "\\${aux.flag_done}"
            backend.env:
              FLAG_WORK: ${aux.flag_work}
            backend.command: "\\${aux.flag_run_one}"
            slurm.array_concurrency: 40
            slurm.sbatch.account: e-sta-openeurollm
            slurm.sbatch.nodes: 1
            slurm.sbatch.time: "01:30:00"
            slurm.sbatch.signal: null
            slurm.sbatch.comment: null

        # ====== collect (login node), once every eval task of the checkpoint finished or was given up
        - stage: collect
          backend: bash
          job: default
          job.local: true
          job.name: "lineage_collect_\\${aux.export_name}"
          job.est_steps: 1
          job.est_step_time_s: 120
          job.est_startup_min: 0
          job.start_condition:
            class_name: JobsFinishedCondition
            array_groups: ["lineage_eval_\\${aux.export_name}"]
          backend.env:
            MODEL: "32b_dense"
            FLAG_WORK: ${aux.flag_work}
          backend.command: |
            set -eu
            ${aux.repo}/scripts/downstream_eval/eval_checkpoints.sh flag-collect \${aux.export_name}
