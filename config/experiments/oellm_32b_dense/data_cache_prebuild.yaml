# @package _global_
#
# STEP 0 of the flagship rollout: build the Megatron dataset index/shuffle cache
# ONCE on a single node, so no 514-node job ever pays for it.
#
# WHY THIS WORKS
# --------------
# The cache key is a hash of the dataset identity only — class, dataset path,
# num_samples, index_split, and the GPTDatasetConfig fields (blend, split,
# sequence_length, random_seed ...) — see megatron_dataset.py:57-70. The MODEL is
# not part of it. So a 2-layer stand-in model on 1 node produces byte-identical
# caches to the 32B run, as long as the DATA and SCHEDULE groups match. Both are
# pulled in from the same config groups the production experiment uses, which is
# the whole point of factoring `schedule/prod_15TT.yaml` out.
#
# `skip_train: true` builds the model, the optimizer and the train/valid/test
# data iterators (training.py:726) and then skips the training loop
# (training.py:757) — i.e. exactly the dataset construction we want, nothing else.
#
# WHAT IT DOES *NOT* PREBUILD
# ---------------------------
# The VALID split's num_samples is (train_iters/eval_interval + 1) * eval_iters *
# GBS, and train_iters is DERIVED from train_samples — which a GBS rampup
# changes (more iterations for the same samples, training.py:864). So the rampup
# variant will rebuild its valid index. That is cheap; the expensive 15 T TRAIN
# index is keyed on train_samples alone and is shared by every variant.
#
# RUN THIS FIRST, and check the cache directory is populated before submitting
# anything at 514 nodes.
#
# !! A KILLED PREBUILD POISONS THE CACHE — CHECK FOR 0-BYTE FILES !!
# Megatron's cache-hit test is PRESENCE ONLY (gpt_dataset.py:333):
#     cache_hit = all(map(os.path.isfile, [description, document_index,
#                                          sample_index, shuffle_index]))
# There is no size or checksum check. So a run that is SIGKILLed mid-write (the
# watchdog timeouts of jobs 1354000 / 1354605) leaves 0-byte index files, and
# every later run treats them as a HIT, skips the rebuild, and dies in
# numpy.load with "EOFError: No data left in file" (job 1355485). The failure
# surfaces at dataset-build time, so at 514 nodes it would burn a full-size
# allocation. Before trusting the cache:
#
#   find <data_cache_path> -maxdepth 1 -type f -size 0 -delete
#
# and re-run this job to rebuild what was removed. Also: never run two prebuilds
# against the same data_cache_path CONCURRENTLY — 1354605 and 1354684 overlapped
# on the same directory, which is how the corruption arose in the first place.
defaults:
  # plain torchrun: no ft_launcher, no hot spare — this is a 1-node utility job.
  # (Deliberately NOT inheriting the production experiment: its torchrun_args
  # carry --ft-restart-policy, which plain torchrun would reject, and hydra
  # merges dicts rather than replacing them.)
  - /backend: megatron_torchrun_localaddr
  - /container: jupiter
  - /slurm: jupiter
  - /job: auto_cancel
  - /sweep: none
  - /backend/megatron: base
  - /backend/megatron/oellm_32b_dense/models: qwen3_dense_32b
  - /backend/megatron/oellm_32b_dense/data: oellm_256k_15TT_jupiter_train
  # MUST be the same schedule group as the production experiment, or the caches
  # this job writes will not be the ones the training jobs look for.
  - /backend/megatron/oellm_32b_dense/schedule: prod_15TT
  - _self_

job:
  name: "oellm_32b_dense_data_cache_prebuild"
  base_output_dir: /e/project1/e-sta-openeurollm/pre_production_training/${job.name}
  log_path: ${.base_output_dir}/logs/slurm-%j.log
  log_path_current: ${.base_output_dir}/logs/current.log
  config_path: ${.base_output_dir}/logs/config-%j.yaml
  config_path_current: ${.base_output_dir}/logs/current.yaml
  chain_repeat: 1

backend:
  # ONE rank, not 4. Index building happens on a single rank while the others
  # just wait in a barrier — and that barrier is what killed job 1354000: rank 0
  # was still in _threading_helper after 30 min, ranks 1-3 timed out the NCCL
  # watchdog (ALLREDUCE SeqNum=12) and the whole job aborted. With world=1 there
  # is no peer to time out.
  torchrun_args:
    nproc_per_node: 1

  megatron:
    # build datasets, then stop before the training loop
    skip_train: true

    # Belt and braces on top of world=1: this job's ENTIRE purpose is a long
    # blocking build, so the watchdog must not be the thing that ends it.
    distributed_timeout_minutes: 720

    # --- stand-in model: irrelevant to the cache, small enough for 4 GPUs ------
    num_layers: 2
    hidden_size: 256
    ffn_hidden_size: 512
    num_attention_heads: 4
    num_query_groups: 4
    kv_channels: 64
    # vocab still comes from the real 256k tokenizer (it is part of the data
    # config, and the tokenizer must be the production one)
    padded_vocab_size: 262144

    # --- single node, no fancy parallelism -----------------------------------
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    pipeline_model_parallel_layout: null
    context_parallel_size: 1
    sequence_parallel: false
    tp_comm_overlap: false
    overlap_grad_reduce: false
    overlap_param_gather: false
    micro_batch_size: 1

    # --- no artefacts --------------------------------------------------------
    save: null
    non_persistent_ckpt_type: null
    non_persistent_global_ckpt_dir: null
    non_persistent_save_interval: null
    # null, not "": 0.19 changed this arg's default from "" to None, so an
    # empty string now DIFFERS from the default and renders as a valueless
    # `--wandb-project`, which argparse rejects ("expected one argument").
    wandb_project: null
    tensorboard_dir: null

    # index building is CPU + IO bound; give it the whole node
    num_workers: 16
    num_dataset_builder_threads: 64

    log_interval: 1

container:
  image: /e/project1/e-sta-openeurollm/container/nemo_26.04.sif

slurm:
  env:
    HF_HOME: /e/scratch/e-sta-openeurollm/hf_cache/${oc.env:USER}
  sbatch:
    nodes: 1
    # scanning + shuffling the index for a 15 T blend is slow; give it room
    time: "12:00:00"
    account: e-sta-openeurollm
  name: "job_${oc.timestring:}"
