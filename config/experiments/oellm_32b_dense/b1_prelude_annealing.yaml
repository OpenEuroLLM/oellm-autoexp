# @package _global_
# Tensorwise B1 model and optimizer recipe with a standalone data phase.
# Compose via annealing/b1_prelude/prepare.py to bind run-specific fields.
defaults:
  - b1_reborn_base
  - _self_

job:
  checkpoint_hook_command: ""
  restart_pre_command: ""
  chain_repeat: 1

backend:
  megatron:
    fp8_recipe: tensorwise
    first_last_layers_bf16: true
    num_layers_at_start_in_bf16: 1
    num_layers_at_end_in_bf16: 1
    stream_ckpt_dequant: false
    timing_log_level: 0
    log_params_norm_and_zeros_interval: 100
    lr_decay_style: WSD
    lr_wsd_decay_style: minus_sqrt
    lr_warmup_iters: 0
    lr_warmup_samples: 0
    lr_decay_iters: null
    lr_wsd_decay_iters: null
    train_iters: null
    use_checkpoint_opt_param_scheduler: false
    override_opt_param_scheduler: true
    allow_new_param_groups_on_load: false
    no_load_optim: false
    no_load_rng: false
    exit_duration_in_mins: null
    non_persistent_save_interval: 125

slurm:
  env:
    WANDB_MODE: offline
