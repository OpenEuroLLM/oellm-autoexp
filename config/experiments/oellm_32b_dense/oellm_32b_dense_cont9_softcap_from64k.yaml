# @package _global_
#
# ============================================================================
# _cont9: BOUND THE LOGITS DIRECTLY -- softcapping instead of the z-loss
# ============================================================================
# The mirror of cont8. Both attack the same target -- growth of the LM head's
# output logits and of the log-normalizer logZ -- by opposite means:
#
#   cont8   keep the z-loss, make its gradient actually reach the weights.
#           A soft PENALTY on logZ, applied through the gradient.
#   cont9   drop the z-loss, bound the logits by construction with
#           logits <- c * tanh(logits / c)  (Gemma 2).
#           A hard CONSTRAINT on the forward pass, no auxiliary gradient.
#
# ---------------------------------------------------------------------------
# THIS IS A ONE-VARIABLE EXPERIMENT, WHICH IS NOT OBVIOUS
# ---------------------------------------------------------------------------
# "Remove the z-loss and replace it with softcapping" sounds like two changes.
# It is one, because the z-loss being removed was never doing anything: at
# coeff = 1e-4 and logZ ~ 8 its gradient is 1.6e-3 times the cross-entropy
# gradient, below bf16's 2**-9 half-ulp, and the fused `native` kernel rounds
# the CE gradient to bf16 before adding it -- so the addition moves exactly 0
# of 131,072,000 elements. See cont8's header and
# scripts/korbi/zloss_bf16_probe.py for the measurement.
#
# So setting output_z_loss_coeff to null removes nothing that was running, and
# the control -- the flagship, and cont6 -- is already an unregularised head.
# The single variable here is the softcap.
#
# ---------------------------------------------------------------------------
# WHY THE LM HEAD
# ---------------------------------------------------------------------------
# The parallel continuations found that most of the degradation lives in the
# loss on RARE tokens, and that lowering the LM head's learning rate helped
# initially and then only postponed the problem. Both fit an uncontrolled
# log-normalizer: predicted log-probability is logit - logZ, so a drifting logZ
# drains probability from every rarely-seen token, and a smaller head learning
# rate slows that drift without bounding it. Softcapping bounds it.
#
# ---------------------------------------------------------------------------
# ⚠ THE LOSS LEVEL WILL STEP AT THE FORK. COMPARE SLOPES, NOT VALUES.
# ---------------------------------------------------------------------------
# tanh compresses the logits non-uniformly, which shrinks the GAPS between
# them, which flattens the output distribution and RAISES the cross-entropy for
# a head that was trained without the cap. At c = 30 and logits of order 8 the
# compression is a few percent, so expect a step of roughly +0.02 to +0.05
# nats -- comparable to the entire degradation under investigation.
#
# That step is an artefact of the objective change and says nothing about the
# hypothesis. Exactly as with cont3's masking revert:
#
#   THE QUESTION IS ONLY: does the loss still RISE?
#
#   HYPOTHESIS SUPPORTED   the slope flattens or turns negative against the
#                          control, and logZ stops growing.
#   HYPOTHESIS DEAD        it keeps climbing at ~+0.003 per 1000 iterations
#                          despite the cap, i.e. logit growth is a symptom.
#
# Fit over >= 4000 iterations of 2000-iteration bins. Do not compare this run's
# absolute loss against the control table.
#
#   bin      64000    66000    68000    70000    72000    74000
#   loss   1.544005 1.548968 1.556254 1.560867 1.573184 1.579815
#
# ---------------------------------------------------------------------------
# CHOOSING c -- AND WHY 30.0 IS A GENTLE FIRST DOSE
# ---------------------------------------------------------------------------
# 30.0 is the Gemma 2 final-logit value and is the setting already smoke-tested
# in config/experiments/korbi/megatron_zloss_softcap_test_jupiter.yaml (100
# iterations, <1% throughput cost).
#
# But note what it does at OUR scale. The cap binds in proportion to logit / c,
# and this model's logits are of order logZ ~ 8, so tanh(8/30) = 0.261 against
# 8/30 = 0.267 -- about a 2.4% squash. It is a real constraint on the tail
# (a logit of 20 is pulled to 16.5) and a light touch on the bulk.
#
# If the run shows no effect on logZ at all, c is too loose rather than the
# hypothesis being wrong; 15.0 roughly doubles the pressure on the bulk. Do not
# go below ~10: the cap must stay comfortably above the logit range the model
# needs to express its confident predictions, or it stops being a regulariser
# and starts being a ceiling on accuracy.
#
# ---------------------------------------------------------------------------
# KEEPING logZ OBSERVABLE
# ---------------------------------------------------------------------------
# mean(logZ**2) is normally logged only as a by-product of the z-loss, so
# switching the z-loss off would remove the single most important read-off of
# this experiment. `log_output_logsumexp: true` keeps the metric and adds no
# gradient: the log-normalizer is detached, and both cross-entropy Functions
# call ctx.set_materialize_grads(False), so their backward sees
# grad_logsumexp=None and skips the term entirely rather than adding a
# zero-filled fp32 tensor the size of the logits shard.
#
# The metric keeps the wandb/tensorboard name `output_z_loss`. It is
# coefficient-independent -- mean(logZ**2), not coeff * mean(logZ**2) -- so it
# is directly comparable against the control's 59-67 and against cont8.
#
#   scripts/oellm_32b.sh --config-name experiments/oellm_32b_dense/oellm_32b_dense_cont9_softcap_from64k
#
# RUN WITH THE MONITOR -- the seed stage is a local job whose tracker the train
# stage gates on via FileExistsCondition, evaluated once under
# `--submit-and-exit`. Keep chain_repeat at 1; chain mode bypasses the gate.
#
# The /e/fscratch dataset index cache must already exist -- see cont6's header.
defaults:
  - oellm_32b_dense_cont6_diag_from64k
  - _self_

aux:
  # Same fork point, same parent tree, same data order as cont6 and cont8.
  variant_tag: "prod_dataopt5_cont9_softcap30_seed1234"

backend:
  megatron:
    # ---- THE VARIABLE --------------------------------------------------------
    # Applied on the local tensor-parallel logit shard (tanh is elementwise, so
    # no communication) after MuP scaling and before the loss, so it bounds the
    # logits that actually reach the cross-entropy.
    final_logit_softcapping: 30.0

    # Off. Inert in the control anyway (see the header), so this is a
    # bookkeeping change that makes the intent explicit rather than a second
    # experimental variable.
    output_z_loss_coeff: null

    # Keep mean(logZ**2) in the logs now that the z-loss no longer provides it.
    log_output_logsumexp: true

    # Everything else -- fp8 hybrid, masking, FA3, te218-fa3, lr 3e-4, GBS 4096,
    # TP4 x PP4 x VPP4, seed 1234 -- and the full cont6 diagnostics package are
    # inherited unchanged.
