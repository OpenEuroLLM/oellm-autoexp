# @package _global_
# Qwen3.5-35B-A3B (text only) throughput on MareNostrum 5 (H100 64 GB), BF16: activation recompute variants at 8 nodes
# Same setup as megatron_moe_qwen35_35BA3B_marenostrum_hybridep_nemo260801_bf16_tuning.yaml
# (TP1 / PP4 with a balanced layout / EP4 / HybridEP / TE CE / full recompute unless noted), 10 iterations.
# Benchmark only: forced load balancing, no checkpoints.
#
# Baseline (full recompute, MBS 4, 8 nodes): 133.2 TFLOP/s/GPU, 6,971 tok/s/GPU, stage-0 peak 43.7 GB reserved.
# Selective with the `moe` module is left out: it hangs at the first pipeline send (NCCL timeout) with this setup.
# realrouting: learned routing (global_aux_loss 1e-3 from the model config) instead of forced balancing.
# Block recompute: the first N layers of each pipeline chunk are recomputed (chunks have 6, 6, 6, 3, 6, 6, 6, 1 layers).

defaults:
  - ../base
  - /backend: megatron_torchrun
  - /container: marenostrum_nemo260801
  - /slurm: marenostrum
  - /backend/megatron: [base,qwen3_5_moe_35BA3B_v019,data_mn5_256k]
  - /sweep: none
  - _self_

aux:
  variant: recompute

sweep:
  type: product
  groups:
    - type: list
      configs:
        # selective, standard modules
        - { aux.variant: sel_std, backend.megatron.micro_batch_size: 4,
            backend.megatron.recompute_granularity: selective,
            backend.megatron.recompute_modules: [core_attn, moe_act, layernorm],
            backend.megatron.recompute_method: null, backend.megatron.recompute_num_layers: null }
        - { aux.variant: sel_std, backend.megatron.micro_batch_size: 2,
            backend.megatron.recompute_granularity: selective,
            backend.megatron.recompute_modules: [core_attn, moe_act, layernorm],
            backend.megatron.recompute_method: null, backend.megatron.recompute_num_layers: null }
        # selective, adding the shared expert and the GDN output norm
        - { aux.variant: sel_ext, backend.megatron.micro_batch_size: 2,
            backend.megatron.recompute_granularity: selective,
            backend.megatron.recompute_modules: [core_attn, moe_act, layernorm, shared_experts, gdn_norm_out],
            backend.megatron.recompute_method: null, backend.megatron.recompute_num_layers: null }
        # partial full recompute: leave 1 or 2 layers per chunk without recompute
        - { aux.variant: block5, backend.megatron.micro_batch_size: 4,
            backend.megatron.recompute_granularity: full, backend.megatron.recompute_method: block,
            backend.megatron.recompute_num_layers: 5 }
        - { aux.variant: block4, backend.megatron.micro_batch_size: 4,
            backend.megatron.recompute_granularity: full, backend.megatron.recompute_method: block,
            backend.megatron.recompute_num_layers: 4 }
        # reference with real (learned) routing instead of forced balancing: full recompute, MBS 4.
        # More iterations to see the imbalance settle (router starts from random init).
        - { aux.variant: realrouting, backend.megatron.micro_batch_size: 4,
            backend.megatron.moe_router_force_load_balancing: false,
            backend.megatron.train_iters: 40, slurm.sbatch.time: "01:30:00" }

backend:
  megatron:
    # --- benchmark length / schedule (8 nodes) ---
    train_iters: 10
    global_batch_size: 4096
    micro_batch_size: 4
    seq_length: 4096
    max_position_embeddings: 4096
    lr: 3.0e-4
    min_lr: 3.0e-5
    lr_decay_style: cosine
    eval_iters: 0
    eval_interval: 1000
    save: null
    log_interval: 1
    timing_log_level: 1
    wandb_project: qwen3.5-35B-A3B-scaling-mn5

    # --- parallelism: TP1, PP4 with a balanced layout (8 chunks -> VPP2), EP4 within a node (64 experts per GPU) ---
    tensor_model_parallel_size: 1
    sequence_parallel: false
    pipeline_model_parallel_size: 4
    pipeline_model_parallel_layout: "Et\\*6\\|t\\*6\\|t\\*6\\|t\\*3\\|t\\*6\\|t\\*6\\|t\\*6\\|t\\*1L"   # 6+6+6+3+6+6+6+1 = 40 layers
    num_layers_per_virtual_pipeline_stage: null
    expert_model_parallel_size: 4
    expert_tensor_parallel_size: 1

    # --- MoE: flex dispatcher with HybridEP (intra-node, so EP x ETP <= 4) ---
    moe_token_dispatcher_type: "flex"
    moe_flex_dispatcher_backend: "hybridep"
    moe_hybridep_num_sms: 16          # deprecated name, but the base config sets it (0), so it must be overridden here
    moe_grouped_gemm: true
    moe_permute_fusion: true
    moe_router_fusion: true
    moe_router_dtype: fp32
#     moe_router_load_balancing_type: aux_loss
    moe_router_force_load_balancing: true    # benchmark only: perfect routing balance
    moe_shared_expert_overlap: false

    # --- distributed optimizer / overlap ---
    use_distributed_optimizer: true
    overlap_grad_reduce: true
    overlap_param_gather: true
    overlap_p2p_comm: true
    optimizer_cpu_offload: false
    use_precision_aware_optimizer: false

    # --- precision ---
    fp8: null                       # BF16 matmuls (bf16: true comes from the base config)
    fp8_param_gather: false

    # --- memory: full recompute (as in the best Qwen3-30B-A3B config) ---
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 1

    # --- fused cross-entropy ---
    cross_entropy_fusion_impl: te     # run apply_megatron_te_cross_entropy_patch.sh first

    # --- misc ---
    use_gloo_process_groups: false
    rerun_mode: disabled
    check_for_nan_in_loss_and_grad: false
    yarn_correction_range_round_to_int: false
    distributed_timeout_minutes: 10
    num_workers: 8
    create_attention_mask_in_dataloader: false
    mmap_bin_files: false
    manual_gc: true
    manual_gc_interval: 10
  env:
    TOKENIZERS_PARALLELISM: "false"
    TRANSFORMERS_CACHE: ${oc.env:HF_HOME}/transformers
    HUGGINGFACE_HUB_CACHE: ${oc.env:HF_HOME}/hub
    HF_HOME: ${oc.env:HF_HOME}
    CUDA_DEVICE_MAX_CONNECTIONS: "8"   # TP1; must be "1" with TP > 1
    TRITON_CACHE_DIR: "${oc.env:OUTPUT_DIR}/triton_cache"   # GDN (fla) kernels are Triton: compile/autotune once, reuse
    PYTHONPATH: ".:submodules/Megatron-LM:/opt/"
    TRITON_LIBCUDA_PATH: "/opt/nvidia/lib"
    PATH: "/opt/venv/bin:/usr/local/bin:/usr/bin:/bin"   # NeMo env (TE 2.18, fla 0.4.2), not the system python (TE 2.16)
    PYTHONUNBUFFERED: "1"
    OMP_NUM_THREADS: "1"
  torchrun_args:
    numa_binding: node

slurm:
  sbatch:
    nodes: 8
    time: "01:00:00"                # first iterations also compile/autotune the Triton GDN kernels
  env:
    TORCHINDUCTOR_CACHE_DIR: "${oc.env:TORCHINDUCTOR_CACHE_DIR,${oc.env:OUTPUT_DIR}/torch_inductor_cache}"   # torch.compile/Triton cache
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

job:
  name: qwen35_35BA3B_mn5_bf16_${aux.variant}_mbs${backend.megatron.micro_batch_size}_rec${backend.megatron.recompute_granularity}_gbs${backend.megatron.global_batch_size}_${slurm.sbatch.nodes}n_${now:%Y%m%d_%H%M%S}
