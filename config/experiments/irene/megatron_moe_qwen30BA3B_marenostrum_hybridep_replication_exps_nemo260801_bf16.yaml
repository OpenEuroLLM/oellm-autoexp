# @package _global_
# Qwen3-30B-A3B throughput benchmark on MareNostrum 5 (H100 64 GB), BF16, strong scaling on 8/16/32 nodes.
# Benchmark only (forced load balancing, 15 iterations, no checkpoints).
defaults:
  - ../base
  - /backend: megatron_torchrun
  - /container: marenostrum_nemo260801
  - /slurm: marenostrum
  - /backend/megatron: [base,qwen3_moe_30BA3B_v019,data_mn5_256k]
  - /sweep: none
  - _self_

sweep:
  type: product
  groups:
    - type: list
      configs:
        - { slurm.sbatch.nodes: 8 }
        - { slurm.sbatch.nodes: 16 }
        - { slurm.sbatch.nodes: 32 }

backend:
  megatron:
    # --- benchmark length / schedule ---
    train_iters: 15
    global_batch_size: 4096
    micro_batch_size: 4
    seq_length: 4096
    max_position_embeddings: 4096
    lr: 3.0e-4
    min_lr: 3.0e-5
    lr_decay_style: cosine
    eval_iters: 0
    eval_interval: 1000
    save: null
    log_interval: 1
    timing_log_level: 1

    # --- parallelism: TP1, PP4 with 6-layer virtual stages, EP4 within a node ---
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 4
    num_layers_per_virtual_pipeline_stage: 6
    overlap_p2p_comm: true
    sequence_parallel: false
    expert_model_parallel_size: 4
    expert_tensor_parallel_size: 1
    use_distributed_optimizer: true
    overlap_grad_reduce: true
    overlap_param_gather: true
    optimizer_cpu_offload: false
    use_precision_aware_optimizer: false

    # --- MoE: flex dispatcher with HybridEP (intra-node, so EP x ETP <= 4) ---
    moe_token_dispatcher_type: "flex"
    moe_flex_dispatcher_backend: "hybridep"
    moe_hybridep_num_sms: 16          # deprecated name, but the base config sets it (0), so it must be overridden here
    moe_grouped_gemm: true
    moe_permute_fusion: true
    moe_router_fusion: true
    moe_router_dtype: fp32
    moe_router_topk: 8
    moe_router_load_balancing_type: aux_loss
    moe_router_force_load_balancing: true    # benchmark only: perfect routing balance

    # --- precision ---
    fp8: null                       # BF16 matmuls (bf16: true comes from the base config)
    fp8_param_gather: false

    # --- memory ---
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 1
    cross_entropy_fusion_impl: te     # run apply_megatron_te_cross_entropy_patch.sh first

    # --- misc ---
    use_gloo_process_groups: false
    rerun_mode: disabled
    check_for_nan_in_loss_and_grad: false
    yarn_correction_range_round_to_int: false
    distributed_timeout_minutes: 10
    num_workers: 8
    create_attention_mask_in_dataloader: false
    mmap_bin_files: false
    manual_gc: true
    manual_gc_interval: 10
  env:
    TOKENIZERS_PARALLELISM: "false"
    TRANSFORMERS_CACHE: ${oc.env:HF_HOME}/transformers
    HUGGINGFACE_HUB_CACHE: ${oc.env:HF_HOME}/hub
    HF_HOME: ${oc.env:HF_HOME}
    CUDA_DEVICE_MAX_CONNECTIONS: "8"
    PYTHONPATH: ".:submodules/Megatron-LM:/opt/"
    TRITON_LIBCUDA_PATH: "/opt/nvidia/lib"
    PATH: "/opt/venv/bin:/usr/local/bin:/usr/bin:/bin"   # NeMo env (TE 2.18), not the system python (TE 2.16)
    PYTHONUNBUFFERED: "1"
    OMP_NUM_THREADS: "1"
  torchrun_args:
    numa_binding: node

slurm:
  sbatch:
    time: "01:00:00"
  env:
    TORCHINDUCTOR_CACHE_DIR: "${oc.env:TORCHINDUCTOR_CACHE_DIR,${oc.env:OUTPUT_DIR}/torch_inductor_cache}"   # torch.compile/Triton cache
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"

job:
  name: megatron_moe_qwen30BA3B_nemo260801_bf16_mbs${backend.megatron.micro_batch_size}_gbs${backend.megatron.global_batch_size}_${slurm.sbatch.nodes}n_vpp${backend.megatron.num_layers_per_virtual_pipeline_stage}_rec${backend.megatron.recompute_num_layers}_${now:%Y%m%d_%H%M%S}
