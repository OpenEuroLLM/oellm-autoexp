# @package _global_
#
# Scaling sweep on MN5 ({8, 16} nodes x GBS {512, 1024}) with the real data mix (1TT-option-4, = datamix4),
# built on qwen3_sparse_0.9B_ne_experts_64_wider_20L_mn5_opt.yaml. Changes from the smoke config are marked
# "# MN5 opt:" (throughput settings) and "# MN5 scaling:" (this sweep).
#
# MN5 test of experiments/risto/qwen3_sparse_0.9B_ne_experts_64_wider_20L_lumi_smoke.yaml
# (OpenEuroLLM/oellm-autoexp, branch risto/moe-router-lumi). Same file and values; every change
# is marked "# MN5:" with the LUMI value, and what does not apply on MN5 is commented out.
#
# Optimized LUMI smoke run for the wider 20-layer Qwen3-like MoE.
#
# Submit:
#   python scripts/run_autoexp.py \
#     --config-name experiments/irene/qwen3_sparse_0.9B_ne_experts_64_wider_20L_mn5_smoke \
#     --submit-and-exit
#
# Forced-balanced diagnostic:
#   backend.megatron.moe_router_force_load_balancing=true

defaults:
  - /backend: megatron_torchrun     # MN5: was megatron (MN5 runs 1 task per node and torchrun starts the 4 GPU processes)
  - /container: marenostrum_nemo260801   # MN5: was lumi
  - /slurm: marenostrum             # MN5: was lumi
  - /job: default
  - /sweep: none
  - /backend/megatron: base
  - /backend/megatron/multilingual_scaling/sparse_models: qwen3_sparse_0.9B_ne_experts_64_wider_20L
  - /backend/megatron/multilingual_scaling/data: oellm_256k
  - _self_

index: 0

# MN5 scaling: 8 and 16 nodes (as on LUMI) x GBS 512 and 1024 (what LUMI trains with)
sweep:
  type: product
  groups:
    - type: list
      configs:
        - { slurm.sbatch.nodes: 8 }
        - { slurm.sbatch.nodes: 16 }
    - type: list
      configs:
        - { backend.megatron.global_batch_size: 512 }
        - { backend.megatron.global_batch_size: 1024 }

stage: scaling_gbs${backend.megatron.global_batch_size}_mbs${backend.megatron.micro_batch_size}   # MN5 scaling: one output folder per point

job:
  name: "qwen3_sparse_10B_A0.9B_L${backend.megatron.num_layers}_H${backend.megatron.hidden_size}_E${backend.megatron.num_experts}_K${backend.megatron.moe_router_topk}_${stage}_${backend.megatron.moe_token_dispatcher_type}_TP${backend.megatron.tensor_model_parallel_size}_PP${backend.megatron.pipeline_model_parallel_size}_EP${backend.megatron.expert_model_parallel_size}_N${slurm.sbatch.nodes}"
  # MN5: LUMI path; the default under $OUTPUT_DIR is used
  # base_output_dir: "/scratch/project_462001516/experiments/${backend.megatron.wandb_project}/${job.name}"
  log_path: ${slurm.sbatch.error}

container:
  env:
    WANDB_TAGS: "mn5,qwen3,10B,0.9B-active,sparse,E64,K4,L20,H2048,smoke"   # MN5: was "lumi,..."

backend:
  # data_integrity_check: false     # MN5: not an option of the megatron_torchrun backend
  megatron:
    # Conservative LUMI/ROCm compatibility settings.
    # MN5: not needed on NVIDIA (the fusions stay on)
    # masked_softmax_fusion: false
    # gradient_accumulation_fusion: false
    # bias_dropout_fusion: false
    bias_swiglu_fusion: false        # MN5: needed here too
    tp_comm_overlap: false

    # Transformer Engine 2.18 compute fusions.   # MN5: was 2.15 on LUMI
    apply_rope_fusion: true
    use_te_activation_func: true
    moe_router_fusion: true
    moe_grouped_gemm: true
    moe_permute_fusion: true

    # Mock-data smoke run; remove these overrides for a real data run.
    mock_data: false
    data_args_path: null
    per_split_data_args_path: /gpfs/projects/ehpc533/users/bsc088649/oellm-autoexp/config/backend/megatron/multilingual_scaling/data/datamix4_mn5_per_split_v19.json   # MN5 scaling: train = 1TT-option-4-project.sh (= LUMI datamix4 train); valid = 200BT-option-4-val_without_high_actual.sh (= LUMI 1TT-option-4-val-fixed-lumi.sh; nemotron-cc/high-actual-merged.bin is truncated)
    data_path: null                   # MN5 scaling: the smoke run used only dclm-10p-sample
    train_data_path: null
    valid_data_path: null
    test_data_path: null
    split: null                       # MN5 scaling: separate train/valid sets (was 99,1,0)
    data_cache_path: "${oc.env:OUTPUT_DIR}/data_cache_1TT-option-4"   # MN5 scaling: shared by all points, built once
    tokenizer_type: HuggingFaceTokenizer
    tokenizer_model: /gpfs/projects/ehpc533/tokenizers/tokenizer-256k   # MN5: was openeurollm/tokenizer-256k (HF hub)
    num_workers: 6
    num_dataset_builder_threads: 6
    trust_remote_code: true
    encoder_seq_length: null

    micro_batch_size: 1               # MN5 scaling: MBS 2 runs out of memory at 2 nodes
    global_batch_size: 512            # MN5 scaling: overridden by the sweep (smoke: 128)

    # EP8 remains node-local; two nodes provide DP2.
    # MN5: 4 GPUs per node, so EP4 is node-local and two nodes give DP8 (expert DP2)
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    context_parallel_size: 1
    expert_tensor_parallel_size: 1
    expert_model_parallel_size: 4     # MN5: was 8
    sequence_parallel: true
    use_distributed_optimizer: true

    # Optimized MI250X communication schedule.
    moe_token_dispatcher_type: flex   # MN5 opt: was alltoall
    moe_flex_dispatcher_backend: hybridep   # MN5 opt: EP4 is node-local
    moe_hybridep_num_sms: 16          # MN5 opt: the base config sets 0
    overlap_moe_expert_parallel_comm: true
    delay_wgrad_compute: true
    high_priority_a2a_comm_stream: false
    overlap_grad_reduce: true
    overlap_param_gather: true

    # Learned routing for a training-valid smoke test. Forced load balancing
    # uses random logits and should only be enabled for throughput diagnostics.
    moe_router_force_load_balancing: false
    moe_router_load_balancing_type: aux_loss
    moe_aux_loss_coeff: 1.0e-2
    moe_per_layer_logging: true


    # MN5: not in this Megatron (oellm/v0.19@7f9b593)
    # moe_expert_viability_metrics: True
    # moe_masked_layer_validation: false
    # moe_masked_layer_eval_iters: 8

    train_iters: 2000                 # MN5 scaling: a cap never reached in 1 h (smoke: 200); keeps the data index small
    # exit_interval: 200              # MN5 scaling: run until the time limit instead (Swagatam: ~1 h per test)
    exit_duration_in_mins: 50         # MN5 scaling: stop cleanly and leave time for the final checkpoint before the 60 min limit
    eval_iters: 20                    # MN5 scaling: was 1
    eval_interval: 100                # MN5 scaling: was 100000 (never)
    save_interval: 1000000000
    save: ${job.base_output_dir}/checkpoints   # MN5 scaling: final weights-only checkpoint, to re-evaluate later with the exact LUMI val set
    load: null
    no_save_optim: true
    no_save_rng: true

    lr: 1.e-3
    muon_scalar_optimizer: adam
    adam_beta1: 0.9
    adam_beta2: 0.95
    adam_eps: 1e-8

    min_lr: 0.0
    lr_warmup_iters: 5
    lr_decay_iters: 20
    lr_decay_style: constant

    # add muon configs

    optimizer: muon
    muon_momentum: 0.95
    muon_nesterov: True
    muon_scale_mode: spectral
    muon_coefficient_type: polar_express #
    muon_fp32_matmul_prec: medium
    muon_num_ns_steps: 5
    muon_tp_mode: blockwise
    muon_split_qkv: True
    muon_extra_scale_factor: 0.2



    log_progress: false
    log_throughput: true
    log_interval: 1
    log_timers_to_tensorboard: true
    timing_log_level: 2

    wandb_project: qwen3_sparse_10B_A0.9B_mn5   # MN5: was qwen3_sparse_10B_A0.9B_lumi
    wandb_exp_name: ${job.name}
    wandb_entity: openeurollm-project
    wandb_save_dir: ${job.base_output_dir}
    tensorboard_dir: ${job.base_output_dir}/tensorboard

    # MN5 additions
    manual_gc: true                   # MN5 opt: avoids the ~0.7 s GC pauses seen in the smoke run
    manual_gc_interval: 10
    cross_entropy_loss_fusion: true   # MN5 opt: fused cross-entropy (the smoke run used the unfused one)
    cross_entropy_fusion_impl: te     # MN5 opt: TE kernel (needs TE >= 2.18 and apply_megatron_te_cross_entropy_patch.sh)
    yarn_correction_range_round_to_int: false   # the schema rejects its null default
  env:                                           # MN5 additions: NeMo 26.08.01 container environment
    TOKENIZERS_PARALLELISM: "false"
    HF_HOME: ${oc.env:HF_HOME}
    HF_HUB_OFFLINE: "1"
    PYTHONPATH: ".:submodules/Megatron-LM:/opt/"
    TRITON_LIBCUDA_PATH: "/opt/nvidia/lib"
    PATH: "/opt/venv/bin:/usr/local/bin:/usr/bin:/bin"
    PYTHONUNBUFFERED: "1"
    OMP_NUM_THREADS: "1"
  torchrun_args:                                 # MN5 addition
    numa_binding: node

slurm:
  # MN5: LUMI node exclusion
  # sbatch_extra_directives:
  #   - "--exclude=nid005019"
  env:
    NVTE_USE_CUTLASS_GROUPED_GEMM: "1"
    NVTE_CUTLASS_GROUPED_GEMM_WARN_FALLBACK: "1"
    MASTER_PORT: "9999"
    CUDA_DEVICE_MAX_CONNECTIONS: "32"
    # GPU_MAX_HW_QUEUES: "4"
    # USE_ROCM_AITER_ROPE_BACKEND: "0"
    TRITON_HOME: /tmp/triton_cache
    WANDB_MODE: offline
    TORCHINDUCTOR_CACHE_DIR: "${oc.env:TORCHINDUCTOR_CACHE_DIR,${oc.env:OUTPUT_DIR}/torch_inductor_cache}"   # MN5 addition
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"                                                       # MN5 addition
  # srun_opts: "--label --cpu-bind=mask_cpu:0xfe000000000000,0xfe00000000000000,0xfe0000,0xfe000000,0xfe,0xfe00,0xfe00000000,0xfe0000000000 "
  sbatch:
    nodes: 2
    # account: project_462001516   # MN5: from SLURM_ACCOUNT
    # partition: dev-g             # MN5: from SLURM_PARTITION / SLURM_QOS (e.g. acc_debug)
    time: "01:00:00"                # MN5 scaling: was 00:30:00
    output: "${job.base_output_dir}/logs/stdout-%j.log"
    error: "${job.base_output_dir}/logs/stderr-%j.log"
  srun:
    kill_on_bad_exit: "1 "
