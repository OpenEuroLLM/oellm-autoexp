# NOT a Hydra config. Input of scripts/korbi/gen_ckda_sweep.py, which writes the
# committed sweep files next to it (ckda_*.yaml, MODELS.md, BUDGET.md).
#
# Edit this, re-run the generator, commit both. The generated YAML is what gets
# submitted and reviewed; nothing is computed at submit time.
#
#   .venv/bin/python scripts/korbi/gen_ckda_sweep.py
#
# The sweep is  ARM  x  RECIPE (size|data|gbs|lr). An arm carries its
# parameter-matched width per size; a recipe is one WSD chain at one size: a
# stable trunk plus a cooldown per budget branching off it
# (stable -> firstcd -> contcd).

# ---------------------------------------------------------------------------
# Sizes: the dense ladder of Ajroldi et al., arXiv:2608.28308 Table 1, verbatim
# (their fitted b*/eta* laws only hold at their N). `ffn` is the DENSE arm's
# width and defines the parameter target every other arm is matched to.
# mbs_cap / min_nodes: largest micro-batch that fits and the smallest width,
# from the ComplexKDA torchtitan probes (submit_ladder.py MBS_CAP / MIN_NODES).
# ---------------------------------------------------------------------------
seq_len: 4096
vocab_size: 50304          # padded, GPT-NeoX-20B tokenizer
head_dim: 64
tie_embeddings: true
decay_fraction: 0.2
gpus_per_node: 4
ffn_multiple: 64           # matched widths snap to this grid

sizes:
  s47M:  {d_model: 384,  heads: 6,  layers: 12, ffn: 1536, mbs_cap: 16, min_nodes: 1}
  s124M: {d_model: 576,  heads: 9,  layers: 18, ffn: 2304, mbs_cap: 16, min_nodes: 1}
  s302M: {d_model: 896,  heads: 14, layers: 20, ffn: 3584, mbs_cap: 8,  min_nodes: 1}
  s588M: {d_model: 1280, heads: 20, layers: 20, ffn: 5120, mbs_cap: 4,  min_nodes: 2}
  s983M: {d_model: 1536, heads: 24, layers: 24, ffn: 6144, mbs_cap: 4,  min_nodes: 2}
  s1p7B: {d_model: 2048, heads: 32, layers: 24, ffn: 8192, mbs_cap: 2,  min_nodes: 4}

# ---------------------------------------------------------------------------
# Arms. `megatron` is copied verbatim into every model entry; the generator only
# adds the geometry and the matched ffn. `layout` tells the parameter counter
# what the stack is built from (must agree with `megatron`, see the generator):
#   mixer        attention | complex_kda | gated_delta_net
#   attn_every   hybrid: layer i is full attention iff (i+1) % attn_every == 0
#                (Megatron's linear_attention_freq); omit for a pure stack
#   hybrid_attn  standard (Megatron TE attention) | gated_nope (fla, +d^2 gate)
# `rate_as` names the throughput row in `rates` below.
#
# To add an arm: add an entry, re-run the generator. A new mixer type also
# needs a counter in gen_ckda_sweep.py (MIXER_PARAMS), checked once against the
# "number of parameters on (tensor, pipeline) model parallel rank (0, 0)" line
# of a smoke run -- the generated aux.params_by_size[size] is that number.
# ---------------------------------------------------------------------------
arms:
  attn:
    layout: {mixer: attention}
    rate_as: attn
    megatron: {qk_layernorm: false}
  attn_qknorm:
    layout: {mixer: attention}
    rate_as: attn
    megatron: {qk_layernorm: true}
  # The complex_kda family is ONE layer; the pairs differ only in the decay
  # gate (sigmoid: alpha in (0,1) / signed_sigmoid2: alpha in (-1,1)) and beta's
  # range. q/k/v SiLU dropped campaign-wide (measured: costs the unsigned arms
  # 0.015-0.021 nats, the signed arms nothing -- per-arm would bias the pair).
  kda_sig_lowrank:
    layout: {mixer: complex_kda}
    rate_as: kda-sig-lowrank
    megatron: &kda_sig
      qk_layernorm: false
      experimental_attention_variant: complex_kda
      linear_gate_activation: sigmoid
      linear_gate_init_style: shipped
      linear_gate_lower_bound: -5.0
      linear_output_gate: lowrank
      linear_beta_max: 1.0
      linear_drop_qkv_silu: true
  ckda_shipped_lowrank:
    layout: {mixer: complex_kda}
    rate_as: ckda-shipped-lowrank
    megatron: &ckda
      <<: *kda_sig
      linear_gate_activation: signed_sigmoid2
      linear_beta_max: 2.0
  # Kimi-Linear 3:1 stack; the full-attention layers are output-gated and NoPE
  # (gated_nope). The gate is d^2 params/attention layer, so `standard` would be
  # a smaller model under the same name.
  kda_sig_hybrid_lowrank:
    layout: {mixer: complex_kda, attn_every: 4, hybrid_attn: gated_nope}
    rate_as: kda-sig-hybrid-lowrank
    megatron:
      <<: *kda_sig
      linear_attention_freq: 4
      linear_hybrid_attention: gated_nope
  ckda_shipped_hybrid_lowrank:
    layout: {mixer: complex_kda, attn_every: 4, hybrid_attn: gated_nope}
    rate_as: ckda-shipped-hybrid-lowrank
    megatron:
      <<: *ckda
      linear_attention_freq: 4
      linear_hybrid_attention: gated_nope
  # Example of a further arm (Megatron's GatedDeltaNet at fla-equivalent dims).
  # gdn:
  #   layout: {mixer: gated_delta_net}
  #   rate_as: gdn
  #   megatron:
  #     qk_layernorm: false
  #     experimental_attention_variant: gated_delta_net
  #     linear_key_head_dim: 64
  #     linear_value_head_dim: 64
  #     linear_num_key_heads: HEADS      # generator substitutes the size's heads
  #     linear_num_value_heads: HEADS

# Arms that run by default (order = sweep order). Remove one to drop it
# everywhere; the models table (MODELS.md) always lists all of them.
run_arms: [attn, attn_qknorm, kda_sig_lowrank, ckda_shipped_lowrank,
           kda_sig_hybrid_lowrank, ckda_shipped_hybrid_lowrank]

# ---------------------------------------------------------------------------
# Recipes: one entry = one chain (shared stable trunk). A run cannot change
# gbs/lr mid-way, so budgets are grouped by the (gbs, lr) they share.
# gbs = b*(N,D) of arXiv:2608.28308 Table 2 snapped to its log2 grid; lr is held
# per size (their eta* snapped to their grid is constant across 6-50BT; the weak
# D-exponent 0.086 is not allowed to put an lr change on the D axis).
# Budgets in BT.
# ---------------------------------------------------------------------------
ladders:
  # arXiv budgets 6-50BT at the small sizes (ComplexKDA `ladder`, `ladder_beta`
  # and `ladder_302M_upper`, now all chained).
  ladder:
    - {size: s47M,  gbs: 32,  lr: 0.002, budgets: [6]}
    - {size: s47M,  gbs: 64,  lr: 0.002, budgets: [12, 20, 30]}
    - {size: s47M,  gbs: 128, lr: 0.002, budgets: [50]}
    - {size: s124M, gbs: 64,  lr: 0.001, budgets: [6, 12, 20]}
    - {size: s124M, gbs: 128, lr: 0.001, budgets: [30, 50]}
    - {size: s302M, gbs: 64,  lr: 0.001, budgets: [6, 12]}
    - {size: s302M, gbs: 128, lr: 0.001, budgets: [20, 30, 50]}
  # ComplexKDA `ladder_medium`, cell for cell.
  ladder_medium:
    - {size: s588M, gbs: 64,  lr: 0.0005, budgets: [6, 12]}
    - {size: s588M, gbs: 128, lr: 0.0005, budgets: [20, 30, 50]}
    - {size: s983M, gbs: 64,  lr: 0.0005, budgets: [6, 12]}
    - {size: s983M, gbs: 128, lr: 0.0005, budgets: [20, 30, 50]}
    - {size: s1p7B, gbs: 64,  lr: 0.0005, budgets: [6]}
    - {size: s1p7B, gbs: 128, lr: 0.0005, budgets: [12, 20, 30, 50]}
  # Small-D extension of the small sizes: 1, 1.5, 2, 4BT. b* from the same law:
  #   47M: 17.7/21.4 -> 16, 24.4/33.6 -> 32;  124M: 20.4 -> 16, 24.6-38.6 -> 32;
  #   302M: 23.2-43.9 -> 32.
  # Warmup stays at the reference's fixed 2000 iters; the shortest trunk
  # (302M, gbs 32, to 1BT: 6104 iters) spends a third of itself warming up.
  ladder_finegrained:
    - {size: s47M,  gbs: 16, lr: 0.002, budgets: [1, 1.5]}
    - {size: s47M,  gbs: 32, lr: 0.002, budgets: [2, 4]}
    - {size: s124M, gbs: 16, lr: 0.001, budgets: [1]}
    - {size: s124M, gbs: 32, lr: 0.001, budgets: [1.5, 2, 4]}
    - {size: s302M, gbs: 32, lr: 0.001, budgets: [1, 1.5, 2, 4]}

