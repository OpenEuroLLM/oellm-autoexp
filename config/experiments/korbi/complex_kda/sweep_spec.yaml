# ---------------------------------------------------------------------------
# Node sizing per chain (one width for its stable and all its cooldowns, so
# every checkpoint is read back at the width it was written). Cheapest width
# (GPU-h, slowest arm) with every cooldown <= cooldown_max_h and the trunk <=
# stable_max_h; the trunk may span several 12h windows under auto_restart.
# ---------------------------------------------------------------------------
sizing:
  max_nodes: 32
  cooldown_max_h: 10.0
  stable_max_h: 24.0
  # Persistent stable save cadence, in hours of trunk runtime (restart points;
  # torch-format checkpoints have no rolling non-persistent variant).
  stable_save_every_h: 3.0
