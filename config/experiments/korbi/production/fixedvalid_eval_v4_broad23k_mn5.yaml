# @package _global_
# Exactness checks of the 23300 broad session's surgeries (docs/recall_surgery_ambitious.md §10; v4_broad23k_surgery_mn5):
# eval-only on the sub64 v8ml set (64 x 4096) + the Winogrande / WSC273 requests (160 x 512), per-token losses
# (MEGATRON_EVAL_TOKEN_DUMP), each surgery output against the source checkpoint iter_0023300:
#   src       the main run's ckpt_eval/iter_0023300 (2 KV groups, no branch)
#   kv8       8 KV groups (num_query_groups)
#   kv8post4  8 KV groups + the post4 copies at 8 groups (additive, gamma 0)
#   cgqa      crossfade branches at 9/25/41/58/74/90, loaded with the cgqa_lr4 arm's schedule (start 23300, hold 0,
#             ramp 400, end 0): at the checkpoint's own iteration t = 0, alpha = 1 -> exactly complex_kda (the
#             branch is computed and weighted by (1 - alpha) = 0)
# Each must match `src` token by token to bf16 kernel noise (23400: kv8 mean 2e-4 / rms 3.7e-2 per token on sub64,
# bit-identical on mc; post4 bit-identical on both):
#   python scripts/korbi/production/duplicate_kv_groups.py compare-dumps \
#       /gpfs/scratch/ehpc533/hybrid_nucleus/fixedvalid_eval/v4_broad23k/src/token_dump \
#       /gpfs/scratch/ehpc533/hybrid_nucleus/fixedvalid_eval/v4_broad23k/<arm>/token_dump
# The model / env are fixedvalid_eval_kvdup_v4_mn5's (generated from the main run's 23300-era config
# config-mn5-pool-p264.0133.yaml, phase 1: the checkpoint is a phase-1 checkpoint, no eval-only phase patch needed).
# kv8 is the 23400 transform one checkpoint earlier (checked end to end there, §4.3); the new combinations are
# kv8post4 and cgqa (the first round's cgqa was never checked this way), so the minimal set is
# "aux.only=[src,kv8post4,cgqa]" (24 nodes); the arms' first step (identical batch in every arm) is the second,
# free check (vs ctrl's first-step loss).
# 8 nodes each (EP 8), priority 60 (below the arms' 80: the checks take spare nodes), gated on the surgery trackers.
#   cd $R/autoexp_v4b23k1 && scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py --no-monitor \
#       --monitor-state-dir $R/pool_state --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/mn5_pool_p264 \
#       --config-name experiments/korbi/production/fixedvalid_eval_v4_broad23k_mn5 --yes "aux.only=[src,kv8post4,cgqa]"
defaults:
  - fixedvalid_eval_kvdup_v4_mn5
  - _self_

aux:
  suite: v4_broad23k
  arm: src

backend:
  megatron:
    ckpt_step: 23300
    train_iters: 23300

job:
  metadata:
    pool_priority: 60

sweep:
  type: product
  store_sweep_json: true
  filter: \${oc.eval:'len(\${aux.only}) == 0 or "\${aux.arm}" in \${aux.only}'}
  groups:
  - type: list
    configs:
    # the source: the main run's frozen evaluation copy, 2 KV groups
    - aux.arm: src
      backend.megatron.load: /gpfs/scratch/ehpc533/hybrid_nucleus/production/main_mhc4/ambitious_e360_eng80_v4_2ph_hd256/ckpt_eval
    - aux.arm: kv8
      job.start_condition:
        class_name: FileContentCondition
        path: /gpfs/scratch/ehpc533/hybrid_nucleus/production/v4_broad23k/src/kv8/ckpt/latest_checkpointed_iteration.txt
        pattern: "^\\s*23300\\s*$"
        mode: regex
        persistent_pass: true
      backend.megatron.load: /gpfs/scratch/ehpc533/hybrid_nucleus/production/v4_broad23k/src/kv8/ckpt
      backend.megatron.num_query_groups: 8
    # 8 KV groups in the stack AND in the post4 copies (the branches copy kv8's 8-group layers)
    - aux.arm: kv8post4
      job.start_condition:
        class_name: FileContentCondition
        path: /gpfs/scratch/ehpc533/hybrid_nucleus/production/v4_broad23k/src/kv8post4/ckpt/latest_checkpointed_iteration.txt
        pattern: "^\\s*23300\\s*$"
        mode: regex
        persistent_pass: true
      backend.megatron.load: /gpfs/scratch/ehpc533/hybrid_nucleus/production/v4_broad23k/src/kv8post4/ckpt
      backend.megatron.num_query_groups: 8
      backend.megatron.ckda_branch: attention
      backend.megatron.ckda_branch_layers: [19, 35, 52, 68]
      backend.megatron.ckda_branch_num_query_groups: 8
      backend.megatron.ckda_branch_start_iteration: 23300
      backend.megatron.ckda_branch_crossfade: false
      backend.megatron.ckda_branch_alpha_hold: 100000
      backend.megatron.ckda_branch_alpha_ramp: 0
      backend.megatron.ckda_branch_alpha_end: 1.0
      backend.megatron.ckda_branch_m_start: 1.0
      backend.megatron.ckda_branch_m_ramp: 0
      backend.megatron.ckda_branch_calibrate: true
    # the first round's cgqa_cal surgery (crossfade), the cgqa_lr4 arm's schedule
    - aux.arm: cgqa
      job.start_condition:
        class_name: FileContentCondition
        path: /gpfs/scratch/ehpc533/hybrid_nucleus/production/v4_broad23k/src/cgqa/ckpt/latest_checkpointed_iteration.txt
        pattern: "^\\s*23300\\s*$"
        mode: regex
        persistent_pass: true
      backend.megatron.load: /gpfs/scratch/ehpc533/hybrid_nucleus/production/v4_broad23k/src/cgqa/ckpt
      backend.megatron.ckda_branch: attention
      backend.megatron.ckda_branch_layers: [9, 25, 41, 58, 74, 90]
      backend.megatron.ckda_branch_num_query_groups: 2
      backend.megatron.ckda_branch_start_iteration: 23300
      backend.megatron.ckda_branch_crossfade: true
      backend.megatron.ckda_branch_alpha_hold: 0
      backend.megatron.ckda_branch_alpha_ramp: 400
      backend.megatron.ckda_branch_alpha_end: 0.0
      backend.megatron.ckda_branch_m_start: 1.0
      backend.megatron.ckda_branch_m_ramp: 0
      backend.megatron.ckda_branch_gamma_scale: 1.0
      backend.megatron.ckda_branch_calibrate: true
