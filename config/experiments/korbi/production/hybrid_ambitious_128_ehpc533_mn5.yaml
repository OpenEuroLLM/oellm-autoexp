# @package _global_
# The 128-node ambitious segment, queued a second time on ehpc533 / acc_xehpc (user 2026-10-25: the
# cns144 job's priority is low; whichever of the two starts first takes over from the 32-node run,
# flip_32_to_128.sh then retires the other). Same run as hybrid_ambitious_128_mn5.yaml (experiment
# group / suite / arm = checkpoints, data cache); its own job name, so its rendered script and the
# monitor's current log / config do not overwrite the cns144 job's.
defaults:
  - hybrid_ambitious_128_mn5
  - _self_

job:
  name: ambitious_gqa_128n_e533

slurm:
  sbatch:
    account: ehpc533
    qos: acc_xehpc
