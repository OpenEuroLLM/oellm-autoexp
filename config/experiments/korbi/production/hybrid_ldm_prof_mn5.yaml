# @package _global_
# Profiles of LDM vs mHC-4 on the full production model at 32 nodes (user 2026-10-27), after
# hybrid_ldm_speed_mn5: there LDM (CuTe under recompute, mbs 2) reached 3,680 vs mHC-4's 5,243
# tok/s/GPU (70 %; mbs 4: 2,558, mem 0.98), vs 85-92 % on the 8-node 64-expert proxy. One profiled
# step (step 8, after the warm-up) on ranks 0 and 127, and the same two residuals under PP4
# (no FSDP; the LDM stream path with the state carried across stages: depth_memory_segments,
# since the unwind path has no pipeline support).
#
#   scripts/korbi/mn5_autoexp_bg.sh ldm_prof32 scripts/run_autoexp.py \
#       --config-name experiments/korbi/production/hybrid_ldm_prof_mn5 --yes [aux.only=[a,b]]
#
# Traces: <base_output_dir>/torch_profile/rank-{0,127}.json.gz
defaults:
  - hybrid_ldm_speed_mn5
  - _self_

aux:
  suite: ldm_prof
  arm: mhc4

backend:
  megatron:
    train_iters: 10
    profile: true
    use_pytorch_profiler: true
    profile_ranks: [0, 127]
    profile_step_start: 8
    profile_step_end: 9

job:
  # separate jobs: the PP arms' env (offload of the last chunk / receive buffers) differs
  array_group: null

slurm:
  sbatch:
    time: "01:00:00"

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        # production: mHC-4, FSDP ZeRO-3 + MoonEP, mbs 4
        - aux.arm: mhc4
        # LDM K 8 under recompute (CuTe unwind), FSDP, mbs 2, mixer lr x1
        - aux.arm: ldm_m2
          backend.megatron.mhc: false
          backend.megatron.mhc_routed_topk: 0
          backend.megatron.mhc_routed_reversible: false
          backend.megatron.depth_memory: true
          backend.megatron.depth_memory_impl: cute
          backend.megatron.depth_memory_unwind: true
          backend.megatron.depth_memory_groups: 16
          backend.megatron.depth_memory_key_dim: 8
          backend.megatron.depth_memory_hidden_dim: 32
          backend.megatron.residual_mixer_lr_mult: 1.0
          backend.megatron.micro_batch_size: 2
        # control: mHC-4 at LDM's mbs 2 (ZeRO-3 re-gathers the parameters every micro-batch:
        # twice the FSDP traffic per token of mbs 4)
        - aux.arm: mhc4_m2
          backend.megatron.micro_batch_size: 2
        # LDM at mbs 4 (memory 0.98 in the speed test: allocator pressure?)
        - aux.arm: ldm_m4
          backend.megatron.mhc: false
          backend.megatron.mhc_routed_topk: 0
          backend.megatron.mhc_routed_reversible: false
          backend.megatron.depth_memory: true
          backend.megatron.depth_memory_impl: cute
          backend.megatron.depth_memory_unwind: true
          backend.megatron.depth_memory_groups: 16
          backend.megatron.depth_memory_key_dim: 8
          backend.megatron.depth_memory_hidden_dim: 32
          backend.megatron.residual_mixer_lr_mult: 1.0
        # mHC-4 under PP4 (no interleaving: DP 32, 64 micro-batches of 2 per pipeline, bubble
        # 3/64), distributed optimizer, 13 / 12 / 12 / 11 blocks (the LM head on the last stage;
        # Engram before blocks 1 and 24 on stages 0 and 1); checkpoints, the last chunk and the
        # pipeline receive buffers in host RAM (as the PP production config before FSDP)
        - aux.arm: mhc4_pp4
          aux.pattern: "*ENLELELELELELELE*ELELELELE|LELELE*ELELELELELELELEN*E|LELELELELELELE*ELELELELE|LELELE*ELELELELELELELE"
          backend.megatron.use_megatron_fsdp: false
          backend.megatron.data_parallel_sharding_strategy: no_shard
          backend.megatron.fsdp_double_buffer: false
          backend.megatron.ckpt_format: torch_dist
          backend.megatron.use_distributed_optimizer: true
          backend.megatron.pipeline_model_parallel_size: 4
          backend.megatron.overlap_p2p_comm: false
          backend.megatron.micro_batch_size: 2
          backend.env.RECOMPUTE_OFFLOAD_LAST: "1"
          backend.env.RECOMPUTE_OFFLOAD_LEAF: "1"
        # LDM under PP4: the state (M, P) carried in the streams across recompute chunks and
        # stages (depth_memory_segments; ~10.5 hidden sizes per checkpoint, so 4 layers per chunk)
        - aux.arm: ldm_pp4
          aux.pattern: "*ENLELELELELELELE*ELELELELE|LELELE*ELELELELELELELEN*E|LELELELELELELE*ELELELELE|LELELE*ELELELELELELELE"
          backend.megatron.use_megatron_fsdp: false
          backend.megatron.data_parallel_sharding_strategy: no_shard
          backend.megatron.fsdp_double_buffer: false
          backend.megatron.ckpt_format: torch_dist
          backend.megatron.use_distributed_optimizer: true
          backend.megatron.pipeline_model_parallel_size: 4
          backend.megatron.overlap_p2p_comm: false
          backend.megatron.micro_batch_size: 2
          backend.megatron.recompute_num_layers: 4
          backend.env.RECOMPUTE_OFFLOAD_LAST: "1"
          backend.env.RECOMPUTE_OFFLOAD_LEAF: "1"
          backend.megatron.mhc: false
          backend.megatron.mhc_routed_topk: 0
          backend.megatron.mhc_routed_reversible: false
          backend.megatron.depth_memory: true
          backend.megatron.depth_memory_impl: cute
          backend.megatron.depth_memory_segments: true
          backend.megatron.depth_memory_groups: 16
          backend.megatron.depth_memory_key_dim: 8
          backend.megatron.depth_memory_hidden_dim: 32
          backend.megatron.residual_mixer_lr_mult: 1.0
