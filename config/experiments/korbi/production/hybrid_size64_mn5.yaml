# @package _global_
# How large can the ambitious model be on 64 nodes? (user 2026-10-29: maximize the model size --
# more routed experts, possibly more Engram -- on 64 nodes of the cns144 pool host.) Memory and
# speed at the production recipe (hybrid_main_mn5: LDM, 7:1 attention first, CKDA, muown_classical,
# Megatron-FSDP + MoonEP EP 4, mbs 4, gbs 4096 x 16k, full recompute with host offload), 12 steps,
# no saves, no eval (hybrid_ldm_speed_mn5).
#
# Expert width stays 768 and top-k 5 (whole experts only: narrower experts make the grouped GEMMs
# worse; widths must be multiples of 128 for the FSDP prefetch -- ldm_size_AB at 576 asserted).
# Expert counts are multiples of the EP size 4.
#
# Before (32 nodes, 2026-10-28, suites ldm_size_*): 144 x 768 fits (max allocated 44.7 GB, mem 0.93),
# 216 x 768 runs out of GPU memory. Production 64 nodes, 216 x 768: allocated 18.7 GB, max
# allocated 42.4 GB, reserved 46.1 GB, mem 0.89 (~12 GB outside the torch allocator). Fitted to
# these: ~23 MB per added routed expert per GPU at 64 nodes (12 MB sharded state, ~11 MB of the
# per-layer FSDP buffers of the local experts), Engram 40B -> 80B ~ +0.9 GB; the limit is ~430-450
# experts at mbs 4.
#
#   scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py --no-monitor --monitor-state-dir $R/pool_state \
#       --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/mn5_pool_p129 \
#       --config-name experiments/korbi/production/hybrid_size64_mn5 "aux.only=[e432]" --yes
defaults:
  - hybrid_ldm_speed_mn5
  - _self_

aux:
  suite: size64
  arm: e216
  nodes: 64
  only: []

backend:
  megatron:
    num_experts: 216

job:
  name: ${aux.suite}_${aux.arm}
  # pools: no array, and NOT the main run's singleton key (hybrid_ambitious_32_mn5 sets it)
  array_group: null
  metadata:
    pool_singleton: null
    pool_priority: 45
  # 64 nodes, 216 experts: ~48-50 s per step
  est_step_time_s: 60.0

slurm:
  sbatch:
    # the pool's host definition (p129: ehpc533 / acc_xehpc); the run executes inside whichever host
    # has 64 free nodes -- the adopted cns144 job (host002) -- whose own account is not checked
    account: ehpc533
    qos: acc_xehpc

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        # production (reference, same day)
        - aux.arm: e216
          backend.megatron.num_experts: 216
        - aux.arm: e288
          backend.megatron.num_experts: 288
        - aux.arm: e360
          backend.megatron.num_experts: 360
        # the predicted edge
        - aux.arm: e432
          backend.megatron.num_experts: 432
        # Engram 40B -> 80B (2 layers x 40B: twice the rows per (order, head)), paired with e360
        - aux.arm: e360_eng80
          backend.megatron.num_experts: 360
          backend.megatron.engram_table_size: 38960768
        # the restart's likely expert stabilization (user / stabilization session 2026-10-29:
        # routed-expert outputs grew ~100x in layers 55-73 of main_ldm): bounded post-act norm on
        # the routed + shared experts (Megatron >= b257e7af6; no parameters), its memory / speed cost
        - aux.arm: e360_pab
          backend.megatron.num_experts: 360
          backend.megatron.moe_expert_post_act_norm: true
          backend.megatron.mlp_post_act_norm: true
          backend.megatron.post_act_norm_floor: 1.0
        - aux.arm: e432_pab
          backend.megatron.num_experts: 432
          backend.megatron.moe_expert_post_act_norm: true
          backend.megatron.mlp_post_act_norm: true
          backend.megatron.post_act_norm_floor: 1.0
        # 2026-10-29 11:20: e288 fits at mem 0.977 (e360 + Engram 80B out of GPU memory in step 1):
        # the post-act norm's cost where it fits, against the same-day e216 / e288
        - aux.arm: e216_pab
          backend.megatron.num_experts: 216
          backend.megatron.moe_expert_post_act_norm: true
          backend.megatron.mlp_post_act_norm: true
          backend.megatron.post_act_norm_floor: 1.0
        - aux.arm: e288_pab
          backend.megatron.num_experts: 288
          backend.megatron.moe_expert_post_act_norm: true
          backend.megatron.mlp_post_act_norm: true
          backend.megatron.post_act_norm_floor: 1.0
        # 2026-10-29 11:40: the limit is the allocator cache, not the peak. e288: max allocated 43.5 GiB,
        # reserved 49.1 GiB, 13.4 GiB outside PyTorch (NCCL, MoonEP buffers / pools, context); e360_eng80
        # died in NCCL's own cuMemAlloc at step 1 while PyTorch held its cache. Capping PyTorch's share
        # (per_process_memory_fraction; at the cap it frees cached blocks and retries) leaves NCCL /
        # MoonEP their room: 360-384 experts should fit (~2 GiB margin), 432 not. MEM_BREAKDOWN logs
        # the non-PyTorch memory and every MoonEP allocation on ranks 0, 8, 16, 24.
        - aux.arm: e288_cap
          backend.megatron.num_experts: 288
          backend.env.PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True,per_process_memory_fraction:0.75"
          backend.env.MEM_BREAKDOWN: "1"
        - aux.arm: e360_cap
          backend.megatron.num_experts: 360
          backend.env.PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True,per_process_memory_fraction:0.75"
          backend.env.MEM_BREAKDOWN: "1"
        - aux.arm: e384_cap
          backend.megatron.num_experts: 384
          backend.env.PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True,per_process_memory_fraction:0.75"
          backend.env.MEM_BREAKDOWN: "1"
        # intermediate (user 2026-10-29): ~60B MoE (256 experts: 2.34B + 256 x 0.2265B = 60.3B) + 60B
        # Engram (tables x1.5); Engram's per-GPU cost is small (lean table optimizer, sharded over 256
        # GPUs) and its tables are not all-gathered per micro-batch
        - aux.arm: e256_eng60
          backend.megatron.num_experts: 256
          backend.megatron.engram_table_size: 29220576
          backend.env.MEM_BREAKDOWN: "1"
        # 2026-10-29 13:15: e360_cap fits (max allocated 45.3 GiB, mem 0.92) but at 3,273 tok/s/GPU: the
        # 0.75 cap (48 GiB) sits right above the peak, the allocator frees / re-maps every step. Measured
        # non-PyTorch memory is 11.5 GiB (MoonEP pools 2.4, buffer 1.6, context 0.5, NCCL < 1): cap 0.80
        # (51.2 GiB) leaves ~6 GiB slack above the peak and ~1.3 GiB for NCCL's lazy allocations
        - aux.arm: e288_cap80
          backend.megatron.num_experts: 288
          backend.env.PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True,per_process_memory_fraction:0.80"
          backend.env.MEM_BREAKDOWN: "1"
        - aux.arm: e360_cap80
          backend.megatron.num_experts: 360
          backend.env.PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True,per_process_memory_fraction:0.80"
          backend.env.MEM_BREAKDOWN: "1"
        - aux.arm: e384_cap80
          backend.megatron.num_experts: 384
          backend.env.PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True,per_process_memory_fraction:0.80"
          backend.env.MEM_BREAKDOWN: "1"
        # Engram 80B at the cap (user 2026-10-29): +40B of tables ~ +1 GiB peak, no non-PyTorch growth
        # (e256_eng60); e360_eng80 OOM'd uncapped in NCCL while PyTorch held its cache
        - aux.arm: e360_eng80_cap80
          backend.megatron.num_experts: 360
          backend.megatron.engram_table_size: 38960768
          backend.env.PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True,per_process_memory_fraction:0.80"
          backend.env.MEM_BREAKDOWN: "1"
        - aux.arm: e384_eng80_cap80
          backend.megatron.num_experts: 384
          backend.megatron.engram_table_size: 38960768
          backend.env.PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True,per_process_memory_fraction:0.80"
          backend.env.MEM_BREAKDOWN: "1"
