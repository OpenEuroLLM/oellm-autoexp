# @package _global_
# Recall surgery (docs/recall_surgery_ambitious.md §3.2): damp the Engram path of the ambitious v4 main run.
# Measured at inference on the 23500 export (no training): Engram output x0.5 -> CoQA F1 +3.0, Winogrande +2.6;
# x0 -> CoQA F1 +1.9, Winogrande +4.1, closer-mention pick rate 0.668 -> 0.613. The 1.7B models, q35c and the
# 32B (no Engram) show no closer-mention bias. These arms train the main run on its own batches from 23300 with
# the Engram layers' output ramped down (Megatron ea309b639 engram_output_scale*), so the rest of the network
# adapts: zero new parameters, every CKDA layer untouched.
#   eng0    Engram output 1 -> 0 over 50 steps (Engram off from 23350)
#   eng05   Engram output 1 -> 0.5 over 50 steps
# Same schedule as the other recall-surgery arms (hybrid_v4_addattn_mn5): 32 nodes, mbs 2, saves every 50.
#   cd $R/autoexp_<snapshot> && scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py --no-monitor \
#       --monitor-state-dir $R/pool_state --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/mn5_pool_o134c \
#       --config-name experiments/korbi/production/hybrid_v4_engram_damp_mn5 --yes "aux.only=[eng0]"
defaults:
  - hybrid_v4_addattn_mn5
  - _self_

aux:
  suite: engram_damp
  end: 23500

backend:
  megatron:
    load: ${aux.main_ckpt}
    ckpt_step: 23300
    ckda_branch: null
    save_interval: 50
    non_persistent_save_interval: null
    engram_output_scale_start: 23300
    engram_output_scale_ramp: 50

job:
  name: engram_damp_${aux.arm}
  est_steps: 200
  est_step_time_s: 254.0
  metadata:
    pool_priority: 60

slurm:
  sbatch:
    time: "16:00:00"

sweep:
  groups:
    - type: list
      configs:
        - aux.arm: eng0
          backend.megatron.engram_output_scale: 0.0
        - aux.arm: eng05
          backend.megatron.engram_output_scale: 0.5
