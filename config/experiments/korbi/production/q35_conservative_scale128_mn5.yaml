# @package _global_
# 128-node speed A/B for the conservative run, next to the production job (user 2026-10-25: keep
# it running, tests on the side). Production (job 48017121, HSDP 16 x 8-node groups, 1 micro-batch
# per GPU) steps in 8.14 s = 4,028 tok/s/GPU, ~3 s above its 32-node per-GPU rate (6,489 at HSDP
# 4 x 8n); 8-node emulations of the 128-node work gave FSDP 6,142 / PP 5,113 -- the cross-replica
# gradient all-reduce (fp32, 16 groups, nothing left to overlap) is the suspect. bf16 gradient
# communication is out (user). Arms (production data / batch, its data index; 40 steps, no saves):
#   hsdp16n  HSDP with 16-node groups (8 replicas): half the outer all-reduce bytes per GPU
#   pp       the colleague's PP4 x VPP2, mbs 2 (8 micro-batches per pipeline); torch_dist would
#            need a checkpoint conversion from the run's fsdp_dtensor
#   nccl16   the production layout (HSDP 16 x 8n) with 16 NCCL channels instead of the slurm
#            config's 4 (set for PP memory; may starve the cross-node all-reduce)
#   outer_optim  the production layout, optimizer state also sharded across the replicas
#            (outer_dp_sharding_strategy optim: reduce-scatter + all-gather across groups)
#   pp_gbs4096  PP with 16 micro-batches per pipeline (information only: a GBS change)
# One 128-node job at a time (acc_xehpc: 3 running per user, shared with production and the
# ambitious run), 45 minutes each for backfill.
#
#   scripts/korbi/mn5_autoexp_bg.sh q35s128 scripts/run_autoexp.py \
#       --config-name experiments/korbi/production/q35_conservative_scale128_mn5 --yes
defaults:
  - q35_conservative_scale32_mn5
  - _self_

aux:
  suite: s128x
  arm: hsdp16n
  nodes: 128
  only: []

backend:
  megatron:
    exit_interval: 40

job:
  est_step_time_s: 8.0
  est_startup_min: 20.0
  concurrency_group: q35_s128x
  max_active: 1

slurm:
  sbatch:
    account: cns144
    qos: acc_xehpc
    time: "00:45:00"

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.arm: hsdp16n
          backend.megatron.num_distributed_optimizer_instances: 8
          backend.megatron.outer_dp_sharding_strategy: no_shard
        - aux.arm: pp
          aux.pattern: "*ELELE*ELELE|LE*ELELELE*E|LELELE*ELELE|LE*ELE|LELE*ELELELE|*ELELELE*ELE|LELE*ELELELE|*E"
          backend.megatron.pipeline_model_parallel_size: 4
          backend.megatron.overlap_p2p_comm: true
          backend.megatron.use_megatron_fsdp: false
          backend.megatron.fsdp_double_buffer: false
          backend.megatron.moe_shared_expert_overlap: false
          backend.megatron.megatron_fsdp_main_grads_dtype: auto
          backend.megatron.megatron_fsdp_grad_comm_dtype: auto
          backend.megatron.ckpt_format: torch_dist
          backend.megatron.micro_batch_size: 2
          backend.megatron.recompute_num_layers: 1
          backend.megatron.num_distributed_optimizer_instances: 1
        - aux.arm: nccl16
          slurm.env.NCCL_MIN_NCHANNELS: "16"
          slurm.env.NCCL_NCHANNELS_PER_PEER: "16"
        - aux.arm: outer_optim
          backend.megatron.outer_dp_sharding_strategy: optim
        - aux.arm: pp_gbs4096
          aux.gbs: 4096
          # the same sample count, so the run's data index (train_iters x gbs)
          backend.megatron.train_iters: 403850
          aux.pattern: "*ELELE*ELELE|LE*ELELELE*E|LELELE*ELELE|LE*ELE|LELE*ELELELE|*ELELELE*ELE|LELE*ELELELE|*E"
          backend.megatron.pipeline_model_parallel_size: 4
          backend.megatron.overlap_p2p_comm: true
          backend.megatron.use_megatron_fsdp: false
          backend.megatron.fsdp_double_buffer: false
          backend.megatron.moe_shared_expert_overlap: false
          backend.megatron.megatron_fsdp_main_grads_dtype: auto
          backend.megatron.megatron_fsdp_grad_comm_dtype: auto
          backend.megatron.ckpt_format: torch_dist
          backend.megatron.micro_batch_size: 2
          backend.megatron.recompute_num_layers: 1
          backend.megatron.num_distributed_optimizer_instances: 1
