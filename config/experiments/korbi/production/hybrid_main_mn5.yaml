# @package _global_
# PRELIMINARY production config of the hybrid main run on MareNostrum 5 (2026-10-22).
#
# Parallelism (2026-10-24): Megatron-FSDP ZeRO-3 + MoonEP (EP4 in-node), double buffering,
# shared-expert overlap -- mHC-4 at 7,646 tok/s/GPU with muown_classical on 8 nodes
# (docs/pp_vs_fsdp.md; the 32-node full-model test e12 / g32_full pending) -- plus
# the training machinery of campaign_3b/base_train_mn5.yaml (rolling checkpoints, resume, wandb,
# divergence guards) and the production checklist (memory: production-settings-checklist).
# Items marked TODO are the campaign's to decide (schedule, U decay, token budget, data
# workers); the rest is the measured speed configuration.
#
#   scripts/korbi/mn5_autoexp_bg.sh main scripts/run_autoexp.py \
#       --config-name experiments/korbi/production/hybrid_main_mn5 --dry-run
#
# Scheduling: account ehpc533, QOS acc_xehpc (up to 512 nodes, 3-day wall time, 3 running jobs
# per user; acc_ehpc caps jobs at 100 nodes). A 3-day job resumes from the latest rolling checkpoint (load = save), the
# monitor restarts it on TIMEOUT. Bad-GPU nodes: slurm/marenostrum_autoexclude.yaml (via
# speed_base_mn5).
defaults:
  - ../hybrid_speed/speed_base_mn5
  # flag-decon-v1 (user 2026-10-24): the flag mix without the documents holding a benchmark item
  - /backend/megatron: [data_flag_decon_v1_mn5]
  - _self_

aux:
  # the main runs' root, pinned (user 2026-10-28): every segment / pool move must resolve the SAME
  # checkpoint directory, or Megatron does not find the latest checkpoint and starts over; never
  # from OUTPUT_DIR, which differs between launches
  main_root: /gpfs/scratch/ehpc533/hybrid_nucleus
  experiment_group: production
  # main_gqa (2026-10-26): grouped-query attention. The runs of suite main trained MHA (16 KV
  # heads: num_query_groups was set without group_query_attention, which Megatron then ignores) and
  # keep restarting from their own rendered scripts in production/main; a re-render there would
  # load MHA checkpoints into a GQA model.
  # main_ldm (user 2026-10-28): the residual is LDM (mixer lr x1) instead of mHC-4 (the rematch
  # screens: LDM ahead of mHC-4 at s2 and s3, nGPT / normalized streams behind); a fresh run --
  # mHC-4 checkpoints do not load into it
  suite: main_ldm
  family: hybrid
  arm: mhc4_eng40
  nodes: 128
  ep: 4
  # user 2026-10-24: 4096 x 16k = 64M tokens per step. FSDP: gbs = mbs 4 x 512 GPUs x 2
  # micro-batches at 128 nodes (8 at 32 nodes); no pipeline, no bubble
  gbs: 4096
  seq: 16384
  topk: 5
  expert_ffn: 768
  # TODO(campaign): the token budget. 600k GPU-h at ~7.5k tok/s/GPU is ~16T tokens.
  tokens: 12e12
  wandb_project: hybrid_main
  # 48 blocks, 7:1 attention first in every period (campaign decision), each mixer followed by a
  # MoE layer; Engram (N) before blocks 1 and 24; one stage (FSDP)
  pattern: "*ENLELELELELELELE*ELELELELELELELE*ELELELELELELELEN*ELELELELELELELE*ELELELELELELELE*ELELELELELELELE"

backend:
  env:
    PYTHONPATH: "${aux.hybrid_env}/pylibs_moonep2:.:submodules/Megatron-LM:flash-linear-attention:submodules/cute_kernels:${aux.images.${aux.image}.libs}"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
    CUDA_DEVICE_MAX_CONNECTIONS: "8"
    FLA_TENSOR_CACHE_SIZE: "64"
    MHC_FUSED_READ: "1"
    # recompute-chunk inputs in pinned host RAM (mHC-4's 4-stream checkpoints at mbs 4)
    RECOMPUTE_OFFLOAD: "1"
    # Engram: step lookup in groups of 8 micro-batches, touched-row table gradients
    ENGRAM_STEP_LOOKUP: "1"
    ENGRAM_STEP_GROUP: "8"
    ENGRAM_SPARSE_GRAD: "1"
    LIGER_WGRAD_ADDMM: "1"
    MEGATRON_LAZY_SINGLETON_GROUPS: "1"
    # one checkpoint format for the whole run (host RAM at saves)
    ANGULAR_MUOWN_COMPACT_CKPT: "1"
    WANDB_MODE: offline
    WANDB_RUN_GROUP: ${aux.suite}
  megatron:
    # ---- model (the campaign's 3B-active hybrid; recipe keys as in the speed suites) ----
    hidden_size: 2048
    ffn_hidden_size: 6144
    kv_channels: 128
    num_attention_heads: 16
    num_query_groups: 2
    # without it Megatron ignores num_query_groups (MHA, 16 KV heads: suite main)
    group_query_attention: true
    position_embedding_type: none
    attention_output_gate: true
    exclusive_self_attention: true
    untie_embeddings_and_output_weights: true
    padded_vocab_size: 262144
    seq_length: ${aux.seq}
    max_position_embeddings: ${aux.seq}
    experimental_attention_variant: complex_kda
    linear_key_head_dim: 128
    linear_value_head_dim: 128
    linear_num_key_heads: 16
    linear_num_value_heads: 16
    linear_beta_max: 2.0
    linear_drop_qkv_silu: true
    linear_gate_activation: signed_sigmoid2
    linear_gate_init_style: shipped
    linear_output_gate: lowrank
    # residual: LDM (K 8, 16 groups, hidden 32) under full recompute with the CuTe kernels (Megatron
    # a6ac93843 + cute_kernels c756eb0), as the speed-tested ldm_m4 arm (hybrid_ldm_speed_mn5.yaml:
    # 5,450 tok/s/GPU at 64 nodes, 4,749 at 128) -- user 2026-10-28, replacing mHC-4
    mhc: false
    mhc_routed_topk: 0
    mhc_routed_reversible: false
    depth_memory: true
    depth_memory_impl: cute
    depth_memory_unwind: true
    depth_memory_groups: 16
    depth_memory_key_dim: 8
    depth_memory_hidden_dim: 32
    num_experts: 112
    moe_ffn_hidden_size: ${aux.expert_ffn}
    # SwiGLU clamp (DeepSeek-V4.1 / gpt-oss, user 2026-10-24: adopt): honoured by the shared
    # experts' fused SwiGLU and MoonEP's experts (Megatron 370efd2cb)
    activation_func_clamp_value: 10.0
    moe_shared_expert_intermediate_size: 768
    moe_router_topk: ${aux.topk}
    # router in fp32, as every campaign run (user 2026-10-24)
    moe_router_dtype: fp32
    moe_router_score_function: sigmoid
    moe_router_enable_expert_bias: true
    moe_router_bias_update_rate: 0.001
    moe_router_fusion: true
    moe_aux_loss_coeff: 0.0001
    moe_token_dispatcher_type: flex
    moe_flex_dispatcher_backend: moonep
    moe_flex_dispatcher_num_sms: 64
    # Engram: 2 layers x 20B table parameters (40B), sharded over each stage's 128 GPUs
    engram_ngram_orders: [2, 3]
    engram_num_heads: 8
    engram_embed_dim: 64
    engram_table_size: 19480384
    engram_table_parallel: dp
    engram_token_map: ${aux.hybrid_env}/data/engram_token_map_256k.npy
    engram_gate_signed_sqrt: true
    engram_conv_prenorm: true
    engram_hash_per_layer: true
    engram_lr_mult: 5.0
    engram_table_rowwise_v: true
    engram_table_momentum_dtype: bf16
    # ---- parallelism / speed: Megatron-FSDP ZeRO-3 (+ the Muon family's row-sharded
    # Newton-Schulz), MoonEP, double buffering, shared expert under the dispatch ----
    use_megatron_fsdp: true
    data_parallel_sharding_strategy: optim_grads_params
    overlap_param_gather: true
    overlap_grad_reduce: true
    fsdp_double_buffer: true
    # fp32 gradient reduction (MoonEP's wgrad needs fp32 main grads; bf16 deliberately not used)
    megatron_fsdp_main_grads_dtype: fp32
    megatron_fsdp_grad_comm_dtype: fp32
    ckpt_format: fsdp_dtensor
    moe_shared_expert_overlap: true
    # as the measured 32-node runs (g32_fc): grouped expert GEMM + fused permute, no CUDA graphs
    # (document masking changes cu_seqlens every micro-batch: Megatron refuses graphs with it --
    # ambitious_32n failed 9 starts on the inherited cuda_graph_impl local, 2026-10-25)
    moe_grouped_gemm: true
    moe_permute_fusion: true
    cuda_graph_impl: none
    cuda_graph_modules: []
    pipeline_model_parallel_size: 1
    expert_model_parallel_size: ${aux.ep}
    tensor_model_parallel_size: 1
    overlap_p2p_comm: false
    micro_batch_size: 4
    global_batch_size: ${aux.gbs}
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 2
    liger_fused_linear_cross_entropy_chunk_size: 2048
    manual_gc: true
    # every 100 steps (2026-10-28): ~1.3 s per collection, measured +1.3 s on every 10th step at 64 nodes
    manual_gc_interval: 100
    mmap_bin_files: false
    # ---- optimizer / schedule ----
    # user 2026-10-24: classical Muown, no weight decay; lr 8.5e-4 (the campaign's N^-0.417
    # law at 3B active), constant (stable-only), no warmup; mixer x1 (LDM; it was x0.25 under
    # mHC-4), Engram x5, embedding / head at the shared lr (Sinkhorn x0.18 if screen5ds41 favours it)
    optimizer: muown_classical
    # head-wise Q / K / V orthogonalization (user 2026-10-24: adopt; screen5ds41 -0.005 at the
    # same speed; works on Megatron-FSDP: the owner splits the gathered matrix per head)
    muon_qkv_headwise: true
    lr: 8.5e-4
    min_lr: 8.5e-4
    # LDM's mixer at the shared lr, x1 (user 2026-10-28; GQA rematch screens: x1 vs x0.25 validation
    # loss 2.1193 vs 2.1209 at s3, 2.1281 vs 2.1740 at s2; long context no consistent lr effect --
    # 64-fact retrieval s3 0.61 vs 0.49, s2 0.39 vs 0.73)
    residual_mixer_lr_mult: 1.0
    lr_warmup_iters: 0
    lr_decay_style: constant
    train_iters: "${oc.eval:'int(${aux.tokens}) // (${aux.gbs} * ${aux.seq})'}"
    # ---- data (data_flag_mn5: the flag mix, OELLM 256k tokenizer, BOS per document, document
    # masking) ----
    eod_mask_loss: false
    # TODO(campaign): data workers vs host RAM -- 16 x 8 left no headroom at saves on s2 (host OOM),
    # 4 x 2 was data-bound; check tok/s against the speed runs at this layout
    num_workers: 8
    dataloader_prefetch_factor: 4
    # the shared index cache (one entry per data recipe, Megatron >= 11bd4aab1; the runs of
    # suite main keep their rendered per-run cache)
    data_cache_path: ${aux.main_root}/data_cache_shared
    # ---- logging / eval ----
    log_interval: 1                     # every step, as the conservative run
    eval_interval: 2000
    eval_iters: 10
    arch_metrics_interval: 100          # gates, residual streams (per layer with the flag below)
    moe_per_layer_logging: true         # per-layer router / load metrics (router health)
    # the sequence-level balancing loss as a metric only (user 2026-10-29: the conservative run
    # trains with seq_aux_loss and logs it; this run balances with aux_loss + the expert bias)
    moe_log_seq_aux_loss: true
    moe_expert_viability_metrics: true  # routed-expert viability (needs moe_per_layer_logging)
    wandb_project: ${aux.wandb_project}
    wandb_entity: openeurollm-project
    wandb_exp_name: ${job.name}
    wandb_save_dir: ${job.base_output_dir}/wandb
    # ---- checkpoints: rolling (latest only) every 1000 steps (~5 h at ~17.5 s / step), a
    # persistent one every 15000 (~3 days: about one per 3-day job); load = save resumes ----
    save: ${job.base_output_dir}/ckpt
    load: ${job.base_output_dir}/ckpt
    save_interval: 15000
    non_persistent_ckpt_type: global
    non_persistent_global_ckpt_dir: ${job.base_output_dir}/ckpt_rolling
    non_persistent_save_interval: 1000
    distributed_timeout_minutes: 45
    # SIGUSR2 -> save a checkpoint and exit (the 32 -> 128-node flip, flip_32_to_128.sh)
    exit_signal_handler: true
    exit_signal: SIGUSR2

job:
  name: ${aux.suite}_${aux.arm}
  base_output_dir: "${aux.main_root}/${aux.experiment_group}/${aux.suite}/${aux.arm}"
  # per job name: the 32- and 128-node configs share base_output_dir (one checkpoint directory),
  # but not the rendered script a RestartAction resubmits, nor the monitors' current log / config
  log_path_current: ${job.base_output_dir}/current_${job.name}.log
  config_path_current: ${job.base_output_dir}/current_${job.name}.yaml
  array_group: null
  # gbs 4096 x 16k at 128 nodes: 67M tokens / (512 GPUs x ~7.5k tok/s) ~ 17.5 s per step
  est_step_time_s: 17.5
  est_startup_min: 15.0
  # Monitor events (user 2026-10-24): those of campaign_3b/base_train_mn5.yaml with bounds for a
  # ~180k-step run over many 3-day jobs. MaxActionFiresCondition counts over the whole run (no
  # window), so the wall-time rollover restarts without a bound and node / transient failures with
  # generous ones; every failed node goes to the shared exclusion list.
  state_events:
    - name: timeout
      transition: ["RUNNING", "TIMEOUT"]
      action: {class_name: RestartAction, reason: "3-day wall time -- resume from the latest checkpoint", exclude_file: "${slurm.exclude_file}"}
    - name: timeout_completing
      transition: ["COMPLETING", "TIMEOUT"]
      action: {class_name: RestartAction, reason: "3-day wall time -- resume from the latest checkpoint", exclude_file: "${slurm.exclude_file}"}
    - name: retry_node_fail
      transition: [null, NODE_FAIL]
      condition: {class_name: MaxActionFiresCondition, max_fires: 20}
      action: {class_name: RestartAction, reason: "lost its node -- resuming", exclude_file: "${slurm.exclude_file}"}
    - name: retry_oom
      transition: [null, OUT_OF_MEMORY]
      condition: {class_name: MaxActionFiresCondition, max_fires: 3}
      action: {class_name: RestartAction, reason: "host out of memory -- resuming", exclude_file: "${slurm.exclude_file}"}
    - name: retry_failed
      transition: [null, FAILED]
      condition: {class_name: MaxActionFiresCondition, max_fires: 20}
      action: {class_name: RestartAction, reason: "failed -- resuming (transient GPFS / NCCL / node errors)", exclude_file: "${slurm.exclude_file}"}
    - name: give_up_node_fail
      transition: [null, NODE_FAIL]
      action: {class_name: CancelAction, reason: "lost its node again (20 restarts used)"}
    - name: give_up_oom
      transition: [null, OUT_OF_MEMORY]
      action: {class_name: CancelAction, reason: "out of host memory again"}
    - name: give_up_failed
      transition: [null, FAILED]
      action: {class_name: CancelAction, reason: "failed again (20 restarts used)"}
  log_events:
    - name: nonfinite_grad_norm
      pattern: "grad norm: (nan|inf)"
      pattern_type: regex
      match_once: true
      action: {class_name: CancelAction, reason: "non-finite grad norm -- the run diverged"}
    - name: exploding_grad_norm
      pattern: "grad norm: [0-9]{5,}\\."
      pattern_type: regex
      match_once: true
      action: {class_name: CancelAction, reason: "grad norm >= 1e4 -- the run diverged"}
    # checkpoint recovery: a save cut off by a lost node leaves short shards -> quarantine that
    # rolling checkpoint (renamed failed_iter_N, tracker rolled back, at most 2) and resume from
    # the last loadable one. fsdp_dtensor writes through torch DCP's FileSystemWriter: the same
    # iter_N/__R_S.distcp shard names as torch_dist.
    - name: ckpt_corrupt_quarantine
      pattern: "No such file or directory: '[^']*/iter_(\\d+)/__\\d+_\\d+\\.distcp'"
      pattern_type: regex
      extract_groups: {iteration: 1}
      match_once: true
      action:
        class_name: QuarantineCheckpointAction
        checkpoint_dir: ${backend.megatron.non_persistent_global_ckpt_dir}
        iteration: "{iteration}"
        quarantine_prefix: "failed_"
        max_rollbacks: 2
    - name: ckpt_corrupt_restart
      pattern: "No such file or directory: '[^']*/iter_(\\d+)/__\\d+_\\d+\\.distcp'"
      pattern_type: regex
      match_once: true
      condition: {class_name: MaxActionFiresCondition, max_fires: 5}
      action: {class_name: RestartAction, cancel_first: true, reason: "checkpoint quarantined; resuming from the last loadable one"}
    - name: err_ckpt_world_size_mismatch
      pattern: "Missing key in checkpoint state_dict: rerun_state_machine_state/shard_\\d+_(\\d+)"
      pattern_type: regex
      match_once: true
      action: {class_name: CancelAction, reason: "checkpoint written at a different world size"}
    - name: err_ckpt_unloadable
      pattern: "CheckpointingException: Checkpoint directory .* does not exist|CheckpointingException: .* is not a distributed checkpoint"
      pattern_type: regex
      match_once: true
      action: {class_name: CancelAction, reason: "checkpoint cannot be opened (interrupted save) -- needs a hand rollback"}
    - name: finished_training
      pattern: "[after training is done]"
      pattern_type: substring
      action: {class_name: FinishAction, reason: "Training finished"}

slurm:
  script_path: ${job.base_output_dir}/${job.name}.sbatch
  sbatch:
    nodes: ${aux.nodes}
    # account ehpc533 (user 2026-10-23: cns144's priority too low; QOS acc_xehpc for >100 nodes)
    account: ehpc533
    qos: acc_xehpc
    time: "3-00:00:00"
  env:
    # startup at 128 nodes (dataset index of the flag blend, compile)
    WATCHDOG_STARTUP_S: "3600"
