# @package _global_
# Speed of the v4 mHC production architecture (ambitious_v4_2ph, phase 1: 8k, gbs 8192) on 256 nodes
# (user 2026-11-04: continue v4_2ph on 128 nodes in o134c, speed tests at 256 nodes in o260c).
# The production 256-node config (hybrid_ambitious_v4_2ph_256_mn5: same model, optimizer, sampler,
# data index, rank-local DCP planning) as a test:
#   - fresh init, no checkpoint load (speed only; the 20-30 min load is not part of a step) and no saves
#   - its own suite directory and no singleton: never touches the production run or its key
#   - 40 steps, one attempt (no restart policy)
# Arms (1024 GPUs, gbs 8192 sequences):
#   mbs8   1 micro-batch per step (the 256-node production setting, ~20.2 s/step on 11-03)
#   mbs4   2 micro-batches per step (experiment/009: overlap of the per-micro-batch FSDP traffic)
#
#   cd $R/autoexp_v4move_20261103 && scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py --no-monitor \
#     --monitor-state-dir $R/pool_state --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/mn5_pool_o260c \
#     --config-name experiments/korbi/production/hybrid_v4mhc_speed256_mn5 --yes
defaults:
  - hybrid_ambitious_v4_2ph_256_mn5
  - _self_

aux:
  suite: v4mhc_speed256
  arm: mbs8
  only: []

backend:
  megatron:
    exit_on_missing_checkpoint: false
    exit_interval: 40
    log_interval: 1
    save: null
    save_interval: null
    non_persistent_save_interval: null
    async_save: false

job:
  name: v4mhc_speed256_${aux.arm}
  metadata:
    pool_singleton: null
    pool_priority: 50
  est_step_time_s: 25.0
  log_events: []
  state_events:
    - name: give_up_node_fail
      transition: [null, NODE_FAIL]
      action: {class_name: CancelAction, reason: "speed test: lost a node"}
    - name: give_up_failed
      transition: [null, FAILED]
      action: {class_name: CancelAction, reason: "failed (speed test: no retry)"}

slurm:
  sbatch:
    time: "02:00:00"

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.arm: mbs8
          aux.phase: 1
          aux.seq: 8192
          aux.gbs: 8192
          backend.megatron.micro_batch_size: 8
          aux.stage_datamix: /gpfs/projects/ehpc533/users/korbip/hybrid_v019/data/datamix_v8ml_opt81_8k64k_stage1_mn5.txt
        - aux.arm: mbs4
          aux.phase: 1
          aux.seq: 8192
          aux.gbs: 8192
          backend.megatron.micro_batch_size: 4
          aux.stage_datamix: /gpfs/projects/ehpc533/users/korbip/hybrid_v019/data/datamix_v8ml_opt81_8k64k_stage1_mn5.txt
