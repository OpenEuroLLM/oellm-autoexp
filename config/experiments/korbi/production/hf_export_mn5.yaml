# @package _global_
# HF export of a main-run checkpoint (ambitious v3 / conservative q35) on one MN5 node, with the
# conversion checks (check_export, score_on_flag on the fixed validation set): the convert
# stage of the export -> eval chain. scripts/korbi/hf_export/export_main_run.sh does the work.
#
#   scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py --no-monitor --monitor-state-dir $R/pool_state \
#       --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/<pool> \
#       --config-name experiments/korbi/production/hf_export_mn5 aux.model=ambitious_v4 aux.step=1000 aux.expert_dtype=fp8 --yes
defaults:
  - ../hybrid_speed/kernel_tests_mn5
  - hf_fast_prefill_env
  - _self_

aux:
  model: ambitious     # ambitious (v3) | ambitious_v4 (v4_2ph) | ambitious_v4_ldm | conservative
  step: ???
  expert_dtype: bf16   # bf16 | fp8 (the ambitious runs: the run's fsdp_fp8_param_gather tiles)
  name: hf_export_${aux.model}_${aux.step}_${aux.expert_dtype}
  bench: "EXPERT_DTYPE=${aux.expert_dtype} bash scripts/korbi/hf_export/export_main_run.sh ${aux.model} ${aux.step}"

backend:
  env:
    # score_on_flag's device maps need accelerate, which the ep image lacks (pylibs_hfx: accelerate only)
    PYTHONPATH: ".:submodules/Megatron-LM:flash-linear-attention:submodules/cute_kernels:${aux.images.${aux.image}.libs}:${aux.hybrid_env}/pylibs_hfx"

job:
  base_output_dir: "${oc.env:OUTPUT_DIR,'./output'}/hf_exports/logs/${aux.name}"
  # export ~1 h (84B: the 160 GB fp32 Engram tables), score ~0.5 h
  est_step_time_s: 10800
  array_group: null
  metadata:
    pool_priority: 30

slurm:
  sbatch:
    time: "04:00:00"
    qos: acc_xehpc
    account: ehpc533
