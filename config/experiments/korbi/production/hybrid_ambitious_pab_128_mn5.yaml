# @package _global_
# The NEW ambitious main run, v2 (user 2026-10-30: "start it under a v2 version and if it remains
# stable keep it"): quantile balancing at EMA 0.9 (hybrid_main_mn5's default since c09d8fd8; plain QB
# at EMA 0 blew up in ambrepro) + pab. Its first enqueue (p129.0243, rendered with QB at EMA 0) was
# replaced before it started.
# LDM residual + pab, the post-activation bound in every
# MLP (docs/ambitious_stabilization.md: the earlier run's single-expert spectral collapse from step
# ~400 on; pab keeps the largest expert output flat, s3 -0.005, ~-0.1 % speed). A FRESH start in
# its own directory (new arm): the old run's checkpoints (36 / 500 / 1038) carry, or lead into, the
# collapsed experts. 128 nodes in a 129-node ehpc533 host (one spare); data flag-decon-v2-agenttok
# (the hybrid_main_mn5 default). The singleton guard keeps one ambitious main run across pools.
#   python scripts/run_autoexp.py --no-monitor --monitor-state-dir $R/pool_state \
#       --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/mn5_pool_p129 \
#       --config-name experiments/korbi/production/hybrid_ambitious_pab_128_mn5 --yes
defaults:
  - hybrid_ambitious_128_mn5
  - _self_

aux:
  # the voted size (user 2026-10-31): 360 experts + Engram 80B = 84B-A2.9B-E80B (~164B); size128 at
  # 128 n: 28.9 s / step, 4,535 tok/s/GPU, memory 0.956 with cap 0.80 + 8 NCCL channels (16 OOM)
  # own arm (fresh start): the QB 64k start's checkpoints have no expert bias
  arm: ambitious_e360_eng80_v2b_64k
  # 64k context (user 2026-10-31), set before the run's first real steps: the sequence length
  # sets the data index and order, so it can never change later. Same 67M tokens per step and
  # per micro-batch (1 x 65536 = 4 x 16384: LDM kernel shapes, MoE dispatch, quantile balancing,
  # activation memory unchanged), still 2 micro-batches per step at 128 nodes (the per-micro-batch
  # FSDP expert gathers unchanged), train_iters unchanged. Cost: attention only (1 layer in 8,
  # document-masked via cu_seqlens: only documents > 32k cost more). v2speed128 at 4 channels:
  # 64k 31.7 vs 32k 30.9 s (+2.6 %); with 8 channels + ENGRAM_STEP_GROUP 1 expected ~30.7 s
  # (32k measured 29.9). Own arm: never resumes the 16k start (ambitious_e360_eng80_v2).
  seq: 65536
  gbs: 1024

backend:
  env:
    # cap PyTorch's share so NCCL's lazy allocations fit (ambitious_size64.md). 0.78, not 0.80
    # (2026-10-31): at 0.80 (50.9 of ~63.7 GiB) + 12.6 GiB outside PyTorch (MoonEP 4.0, NCCL with 8
    # channels, context) the device is full once PyTorch reaches its cap -- v2's first start died
    # in ncclCuMemAlloc after step 1 (a lazily created single-rank communicator, fixed in Megatron
    # 7ec909031). 0.78 leaves ~1.4 GiB for NCCL; size128 e360_eng80 peaked at 47.5 GiB reserved.
    # 0.80 again (2026-10-31): at 0.78 the 16k start (p132.0044) ran stably but ~10 % slow (32 vs
    # 28.9 s / step), PyTorch at ~48.9 of the cap's 49.7 GiB -- allocator thrash. v2speed128 at 32k
    # (20 steps, zero allocator retries): cap 0.80 + 8 channels + ENGRAM_STEP_GROUP 1 = 29.9 s,
    # 4,378 tok/s/GPU, 48.3 GiB reserved, 3.35 GiB free; 4 channels 30.9 s; async groups 31.8 s
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True,per_process_memory_fraction:0.80"
    # release the allocator cache after the forward-backward of the first 2 steps, so NCCL's
    # buffers for the optimizer step / grad norm / metric collectives are allocated while there
    # is room (no cost later)
    EMPTY_CACHE_FIRST_STEPS: "2"
    # memory outside PyTorch per group, printed at iterations < 3 on ranks 0, 8, 16, 24 only
    MEM_BREAKDOWN: "1"
    NCCL_MIN_NCHANNELS: "8"
    NCCL_NCHANNELS_PER_PEER: "8"
    # Engram lookups per micro-batch (v2speed128: as fast as 2, 0.7 GiB less PyTorch memory --
    # margin for the first save / validation); overrides hybrid_ambitious_128_mn5's 2. No
    # ENGRAM_ASYNC_GROUPS (-6 %)
    ENGRAM_STEP_GROUP: "1"
  megatron:
    micro_batch_size: 1
    # async rolling checkpoint every 100 steps (user 2026-10-31; inherited 125): ~52 min at 30.8 s
    # per step. A divisor of 500 and of save_interval 1000, so the equal-token eval marks at
    # 500 * 2^n still land on complete checkpoints
    non_persistent_save_interval: 100
    # pab (docs/ambitious_stabilization.md, section 6): nothing else changes
    moe_expert_post_act_norm: true
    mlp_post_act_norm: true
    post_act_norm_floor: 1.0
    # Engram 2- / 3- / 4-grams + sign hash (user 2026-10-30; scripts/korbi/campaign/ngram_coverage.py
    # on 4B tokens of this data mix: bigrams saturate -- the top 5M cover 92 %, 19.5M 97 % -- while
    # the top 19.5M 4-grams cover ~50 % of positions, the 19.5M-th seen 13x per 4B tokens). Same 40B
    # of tables: rows per head x 2/3 (19,480,384 -> 12,986,923; bigrams ~96 %, trigrams ~70 %,
    # 4-grams ~48 % covered). Sign hash: the count-sketch +-1 pattern per (n-gram, lookup)
    # (Megatron >= 97423b203). Not screened; HF export of sign-hash models is not ported yet.
    # at E80B: 38,960,768 x 2/3 = 25,973,845 rows per head
    num_experts: 360
    engram_ngram_orders: [2, 3, 4]
    engram_table_size: 25973845
    engram_sign_hash: true
    # load balancing: the expert bias (rate 1e-3) + global-batch aux loss 1e-4, as the first
    # ambitious run (user 2026-10-31; stable to 2.6k steps there: load entropy min 0.993, max_vio
    # ~1-2, router mean max prob 0.02-0.04). Not QB: in the 64k start (QB EMA 0.9 + global aux
    # 1e-5, p132.0059, to step 324) max_vio 35 / 1,811 near-dead slots at step 40, up to 616 ghost
    # slots (expert_mean_weight_ratio_min ~0.007), router mean max prob 0.17 -- the bias hid a
    # strongly unbalanced raw router. aux_loss (not seq_aux_loss: a batch-1 model)
    moe_router_load_balancing_type: aux_loss
    moe_aux_loss_coeff: 1.0e-4
    moe_router_enable_expert_bias: true
    moe_router_bias_update_rate: 0.001
    moe_router_fusion: true

job:
  name: ambitious_v2_128n
  # size128 e360_cap80_eng80_nccl8: 28.9 s (the [2, 3, 4] cost: arm e360_eng80_v2)
  est_step_time_s: 29.0

slurm:
  sbatch:
    account: ehpc533
    qos: acc_xehpc
  env:
    # a fresh run: no predecessor job to wait for
    WAIT_FOR_JOB_NAME: ""
    # 8 NCCL channels (v2speed128: 29.9 vs 30.9 s with 4, fits with cap 0.80), both levels as
    # hybrid_size128_mn5
    NCCL_MIN_NCHANNELS: "8"
    NCCL_NCHANNELS_PER_PEER: "8"
