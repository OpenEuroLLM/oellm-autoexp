# @package _global_
# The ambitious main run, v3 (2026-10-31): the restart after the v2 starts (QB, then expert bias with
# the per-sequence aux loss, then with the broken global aux loss; docs/ambitious_stabilization.md).
#   size       360 experts + Engram 80B ([2, 3, 4] + sign hash) = 84B-A2.9B-E80B (~164B)
#   context    64k, micro-batch 1, gbs 1024 (67M tokens per step)
#   balancing  expert bias 1e-3 + global_aux_loss 1e-4 (Megatron >= 24a814eba: as strong as aux_loss,
#              over the global batch; no sequence-level loss)
#   experts    pab, the bounded post-activation norm in every MLP
#   optimizer  muown_classical, lr 8.5e-4 constant, no warmup; CKDA beta on Adam (linear_beta_adam)
#   residual   LDM (address width 128) here; mHC-4: hybrid_ambitious_v3_mhc4_128_mn5 (the choice
#              after campaign_3b/ambresid)
# A FRESH start in its own directory (new arm). The singleton guard keeps one ambitious main run
# across pools. Speed / memory check of both residuals: hybrid_v3speed128_mn5.
#   python scripts/run_autoexp.py --no-monitor --monitor-state-dir $R/pool_state \
#       --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/mn5_pool_p132 \
#       --config-name experiments/korbi/production/hybrid_ambitious_pab_128_mn5 --yes
defaults:
  - hybrid_ambitious_128_mn5
  - _self_

aux:
  # the voted size (user 2026-10-31): 360 experts + Engram 80B = 84B-A2.9B-E80B (~164B); size128 at
  # 128 n: 28.9 s / step, 4,535 tok/s/GPU, memory 0.956 with cap 0.80 + 8 NCCL channels (16 OOM)
  # own arm (fresh start); the v2 starts (v2_64k QB, v2b_64k per-sequence aux, v2c_64k broken
  # global aux) are not resumed
  arm: ambitious_e360_eng80_v3
  # sequence-length curriculum (user 2026-10-31) at constant 67M tokens per step and per micro-batch
  # (64k tokens per GPU and micro-batch, 2 micro-batches per step at 128 nodes), on the v8 +
  # multilingual data split by document into three stages (scripts/datamix_v8/split_stages.py,
  # the same per-source ratios in every stage, no document in two stages; stages_report.tsv):
  #   phase 1   4k   gbs 16384  mbs 16   it      0 -  4,737     317.9B  (2.0 %)
  #   phase 2  16k   gbs  4096  mbs  4   it  4,737 - 23,691   1,272.1B  (8.0 %)
  #   phase 3  64k   gbs  1024  mbs  1   it 23,691 - 236,733  14,296.8B (90.0 %)   15.9T in total
  # Megatron --phase-transition-iterations + --phase-transition-variable-batch (6cec40be3, as
  # hybrid_ctxcurr_s3_mn5): a phase saves and exits at its last iteration; the next phase resumes
  # the same checkpoint dir with its own sequence length, batch size and stage data, its dataloader
  # at the phase's own sample 0 (the LR scheduler continues: constant lr). One job per phase, all
  # three enqueued together: phases 2 / 3 wait (start_condition) until the previous phase's last
  # checkpoint is written.
  phase: 3
  # enqueue a subset of the phases: 'aux.only=[p1]' (default: all three)
  only: []
  stage_datamix: ${oc.env:HYBRID_ENV,/gpfs/projects/ehpc533/users/korbip/hybrid_v019}/data/datamix_v8ml_stage${aux.phase}_mn5.txt
  seq: 65536
  gbs: 1024

backend:
  env:
    # cap PyTorch's share so NCCL's lazy allocations fit (ambitious_size64.md). 0.78, not 0.80
    # (2026-10-31): at 0.80 (50.9 of ~63.7 GiB) + 12.6 GiB outside PyTorch (MoonEP 4.0, NCCL with 8
    # channels, context) the device is full once PyTorch reaches its cap -- v2's first start died
    # in ncclCuMemAlloc after step 1 (a lazily created single-rank communicator, fixed in Megatron
    # 7ec909031). 0.78 leaves ~1.4 GiB for NCCL; size128 e360_eng80 peaked at 47.5 GiB reserved.
    # 0.80 again (2026-10-31): at 0.78 the 16k start (p132.0044) ran stably but ~10 % slow (32 vs
    # 28.9 s / step), PyTorch at ~48.9 of the cap's 49.7 GiB -- allocator thrash. v2speed128 at 32k
    # (20 steps, zero allocator retries): cap 0.80 + 8 channels + ENGRAM_STEP_GROUP 1 = 29.9 s,
    # 4,378 tok/s/GPU, 48.3 GiB reserved, 3.35 GiB free; 4 channels 30.9 s; async groups 31.8 s
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True,per_process_memory_fraction:0.80"
    # release the allocator cache after the forward-backward of the first 2 steps, so NCCL's
    # buffers for the optimizer step / grad norm / metric collectives are allocated while there
    # is room (no cost later)
    EMPTY_CACHE_FIRST_STEPS: "2"
    # memory outside PyTorch per group, printed at iterations < 3 on ranks 0, 8, 16, 24 only
    MEM_BREAKDOWN: "1"
    NCCL_MIN_NCHANNELS: "8"
    NCCL_NCHANNELS_PER_PEER: "8"
    # Engram lookups per micro-batch (v2speed128: as fast as 2, 0.7 GiB less PyTorch memory --
    # margin for the first save / validation); overrides hybrid_ambitious_128_mn5's 2. No
    # ENGRAM_ASYNC_GROUPS (-6 %)
    ENGRAM_STEP_GROUP: "1"
  megatron:
    micro_batch_size: 1
    # the curriculum (aux above): 15.9T tokens = 236,733 steps of 1024 x 65536
    data_args_path: ${aux.stage_datamix}
    train_iters: 236733
    phase_transition_iterations: "4737,23691"
    phase_transition_variable_batch: true
    # async rolling checkpoint every 100 steps (user 2026-10-31; inherited 125): ~52 min at 30.8 s
    # per step. A divisor of 500 and of save_interval 1000, so the equal-token eval marks at
    # 500 * 2^n still land on complete checkpoints
    non_persistent_save_interval: 100
    # pab (docs/ambitious_stabilization.md, section 6): nothing else changes
    moe_expert_post_act_norm: true
    mlp_post_act_norm: true
    post_act_norm_floor: 1.0
    # Engram 2- / 3- / 4-grams + sign hash (user 2026-10-30; scripts/korbi/campaign/ngram_coverage.py
    # on 4B tokens of this data mix: bigrams saturate -- the top 5M cover 92 %, 19.5M 97 % -- while
    # the top 19.5M 4-grams cover ~50 % of positions, the 19.5M-th seen 13x per 4B tokens). Same 40B
    # of tables: rows per head x 2/3 (19,480,384 -> 12,986,923; bigrams ~96 %, trigrams ~70 %,
    # 4-grams ~48 % covered). Sign hash: the count-sketch +-1 pattern per (n-gram, lookup)
    # (Megatron >= 97423b203). Not screened; HF export of sign-hash models is not ported yet.
    # at E80B: 38,960,768 x 2/3 = 25,973,845 rows per head
    num_experts: 360
    engram_ngram_orders: [2, 3, 4]
    engram_table_size: 25973845
    engram_sign_hash: true
    # load balancing: the expert bias (rate 1e-3) + global_aux_loss 1e-4, the first ambitious run's
    # coefficients (stable to 2.6k steps there). global_aux_loss, not aux_loss: at 1 x 65536 per
    # micro-batch aux_loss is the per-sequence loss (v2b: load_balancing_loss == seq_...). Needs
    # Megatron >= 24a814eba: before, global_aux_loss was 1 / DP as strong (v2c at DP 512 ran on the
    # bias alone and was the worst start). Not QB (v2_64k: early collapse, ghost experts).
    moe_router_load_balancing_type: global_aux_loss
    moe_aux_loss_coeff: 1.0e-4
    moe_router_enable_expert_bias: true
    moe_router_bias_update_rate: 0.001
    moe_router_fusion: true

job:
  # v3: a new name, so nothing that acts on the cancelled v2 copies by name touches it; one job
  # per curriculum phase
  name: ambitious_v3_128n_p${aux.phase}
  # size128 e360_cap80_eng80_nccl8: 28.9 s (the [2, 3, 4] cost: arm e360_eng80_v2)
  est_step_time_s: 29.0

slurm:
  sbatch:
    account: ehpc533
    qos: acc_xehpc
  env:
    # a fresh run: no predecessor job to wait for
    WAIT_FOR_JOB_NAME: ""
    # 8 NCCL channels (v2speed128: 29.9 vs 30.9 s with 4, fits with cap 0.80), both levels as
    # hybrid_size128_mn5
    NCCL_MIN_NCHANNELS: "8"
    NCCL_NCHANNELS_PER_PEER: "8"

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"p\\${aux.phase}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - {aux.phase: 1, aux.seq: 4096, aux.gbs: 16384, backend.megatron.micro_batch_size: 16}
        - aux.phase: 2
          aux.seq: 16384
          aux.gbs: 4096
          backend.megatron.micro_batch_size: 4
          # phase 1's last checkpoint (it saves and exits at 4,737)
          job.start_condition:
            class_name: FileContentCondition
            path: "\\${job.base_output_dir}/ckpt/latest_checkpointed_iteration.txt"
            pattern: "^\\s*4737\\s*$"
            mode: regex
            # passed once = passed: a restart in the phase (the file then holds a later iteration)
            # must not wait again
            persistent_pass: true
        - aux.phase: 3
          aux.seq: 65536
          aux.gbs: 1024
          backend.megatron.micro_batch_size: 1
          job.start_condition:
            class_name: FileContentCondition
            path: "\\${job.base_output_dir}/ckpt/latest_checkpointed_iteration.txt"
            pattern: "^\\s*23691\\s*$"
            mode: regex
            # passed once = passed: a restart in the phase (the file then holds a later iteration)
            # must not wait again
            persistent_pass: true
