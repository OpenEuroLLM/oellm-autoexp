# @package _global_
# GENERATED by scripts/korbi/flag_eval/gen_pipeline_config.py -- do not edit.
# 438 FLAG rows (config/eval_tasks/flag_evals.yaml) + the export stage.
#
# One knob per checkpoint (re-submit, no regeneration):
#   aux.step=7000            (default below)
#   aux.model=ambitious_v4   ambitious | ambitious_v4 | ambitious_v4_hd256 | ambitious_v4_ldm | conservative
#                            (the export dir stem follows aux.model: ..._v4_2ph vs ..._v4_2ph_hd256)
#   aux.expert_dtype=fp8     bf16 | fp8
#
# Stage 0 (sweep point 0) runs aux.export_bench: the fast parallel DCP reader with
# EXPORT_ONLY=1 (no equivalence checks -- the architecture is proven), then the
# identity chat-template view, refresh_code, and <export>/.downstream_ready.
# Stages 1..N are the eval rows of flag_eval_oellm_mn5; they wait for that marker
# (persistent_pass), so a re-submit of the same checkpoint is idempotent.
#
#   scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py --no-monitor \
#       --monitor-state-dir $R/pool_state --pool <pool> \
#       --config-name experiments/korbi/production/flag_eval_pipeline_mn5 \
#       aux.step=7000 --yes
defaults:
  - flag_eval_oellm_mn5
  - _self_

aux:
  step: 7000
  model: ambitious_v4
  expert_dtype: fp8
  export_root: /gpfs/scratch/ehpc533/hybrid_nucleus/hf_exports
  # export dir stem per model lineage; must match the `name` in export_main_run_v2.sh
  stems:
    ambitious_v4: ambitious_v4_2ph
    ambitious_v4_hd256: ambitious_v4_2ph_hd256
  export: ${aux.stems.${aux.model}}_fp8_${aux.step}
  export_dir: ${aux.export_root}/${aux.export}
  view_dir: /gpfs/scratch/ehpc533/hybrid_nucleus/views/identity/${aux.export}
  export_bench: "EXPORT_ONLY=1 EXPERT_DTYPE=${aux.expert_dtype} bash scripts/korbi/hf_export/export_main_run_v2.sh ${aux.model} ${aux.step} && [ -d ${aux.export_dir} ] && mkdir -p \"$(dirname ${aux.view_dir})\" && { [ -d ${aux.view_dir} ] || python submodules/oellm-eval/containers/prepare_base_model_view.py --source ${aux.export_dir} --out ${aux.view_dir} --template identity; } && { bash scripts/korbi/hf_export/refresh_code.sh ${aux.export_dir} ${aux.view_dir} || true; } && touch ${aux.export_dir}/.downstream_ready"
  # placeholders so the base config resolves; every sweep point overrides them
  name: pipeline_base
  task: ""
  n_shot: 0
  suite: pipeline

# Eval env: keep the batch/graph ceilings that fit 16 concurrent jobs; the
# full-decode CUDA-graph / UVA-Engram switches stay off (they OOMed the
# 16-node eval and need a TP4 validation of their own). Override per run.
backend:
  env:
    OELLM_HF_REFRESH_CODE: "1"
    OELLM_LIGHTEVAL_MAX_NUM_SEQS: "64"
    OELLM_LIGHTEVAL_GRAPH_MAX_ROWS: "64"
    OELLM_EVALCHEMY_MAX_NUM_SEQS: "64"
    OELLM_EVALCHEMY_GRAPH_MAX_ROWS: "64"

sweep:
  type: list
  store_sweep_json: true
  groups:
    # stage 0 = point 0 (export); stages 1..N = the eval rows, gated on the marker.
    # One list group: the sweep filter walker does not support sibling groups.
    - type: list
      configs:
        - aux.row: 0
          aux.name: "export_${aux.export}"
          aux.task: "export"
          aux.suite: "pipeline"
          aux.n_shot: 0
          aux.bench: ${aux.export_bench}
          job.est_step_time_s: 1800
          slurm.sbatch.time: "00:30:00"
          job.metadata.pool_priority: 50
          backend.env.PYTHONPATH: ".:submodules/Megatron-LM:flash-linear-attention:submodules/cute_kernels:${aux.images.${aux.image}.libs}:${aux.hybrid_env}/pylibs_hfx"
