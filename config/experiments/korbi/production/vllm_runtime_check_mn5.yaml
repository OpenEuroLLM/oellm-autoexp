# @package _global_
# One-node check of the shared vLLM runtime on GPFS (setup_vllm_shared.sh) and of node-local DP with
# unequal response caches (oellm-eval db648b5): scripts/korbi/vllm/check_vllm_runtime.sh.
#
#   scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py --no-monitor --monitor-state-dir $R/pool_state \
#       --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/mn5_pool_p264 \
#       --config-name experiments/korbi/production/vllm_runtime_check_mn5 --yes
defaults:
  - evals/eval_job_mn5
  - _self_

aux:
  job: vllm_runtime_check
  export: /gpfs/scratch/ehpc533/hybrid_nucleus/hf_exports/ambitious_v4_2ph_hd256_fp8_23000
  out_root: /gpfs/scratch/ehpc533/hybrid_nucleus/analysis/vllm_runtime_check
  log_root: ${aux.out_root}/logs
  bench: bash scripts/korbi/vllm/check_vllm_runtime.sh ${aux.export} ${aux.out_root}

job:
  est_step_time_s: 3600
  metadata:
    pool_priority: 60
    # not on excluded nodes: p264 host003 lists its shrink-removed nodes there
    pool_use_excluded_nodes: false

slurm:
  sbatch:
    time: "01:30:00"
    account: cns144
