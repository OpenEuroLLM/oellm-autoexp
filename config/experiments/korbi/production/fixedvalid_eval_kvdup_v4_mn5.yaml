# @package _global_
# Exactness check of the KV-group duplication surgery (docs/recall_surgery_ambitious.md §4.3): the main run's
# 23400 (2 KV groups) vs the same checkpoint with its 6 attention layers' K/V heads copied to 8 / 16 groups
# (scripts/korbi/production/duplicate_kv_groups.py, kv_dup_surgery_mn5) must give the same eval losses, token by
# token (MEGATRON_EVAL_TOKEN_DUMP; compare with `duplicate_kv_groups.py compare-dumps A B`).
# Copied from fixedvalid_eval_export_check_v4_mn5 (GENERATED by scripts/korbi/production/gen_fixedvalid_eval.py from
# the v4 hd256 run's resolved config-mn5-pool-p264.0133.yaml; eval-only: no optimizer / RNG load, bf16 main
# weights, no saves, train_iters = ckpt_step) with: suite kvdup_v4, the three arms below, pool o134c at priority 45
# (8 nodes, EP 8 as paired_amb4 -- 4 nodes OOM), the kv arms gated on the surgery's output.
#   cd $R/autoexp_<snapshot> && scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py --no-monitor \
#       --monitor-state-dir $R/pool_state --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/mn5_pool_o134c \
#       --config-name experiments/korbi/production/fixedvalid_eval_kvdup_v4_mn5 --yes "aux.only=[s23400,s23400kv8]"
