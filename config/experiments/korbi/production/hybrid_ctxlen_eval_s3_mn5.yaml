# @package _global_
# Same-length scoring of the ctxlen4n_s3 arms (user 2026-11-01): every step-1000 checkpoint on the
# SAME validation samples at 4k and at 64k. skip_train builds the validation loader at position 0
# (training.py), so all arms see identical samples per length; 50 batches = 52M tokens per length
# (eval_iters 50 x one eval: the validation sample count -- and the prebuilt index -- stay as in
# training). Eval only (no optimizer): one node per job, four at a time on p132's spare nodes.
# Result: "validation loss at iteration 1000 on validation set | lm loss value" in each log.
#
#   ... --config-name experiments/korbi/production/hybrid_ctxlen_eval_s3_mn5 ["aux.only=[...]"] --yes
defaults:
  - hybrid_ctxlen_s3_mn5
  - _self_

aux:
  suite: ctxlen4n_eval_s3
  ckpt_arm: s4k
  len: at4k
  arm: ${aux.ckpt_arm}_${aux.len}
  nodes: 1

backend:
  megatron:
    skip_train: true
    no_load_optim: true
    no_load_rng: true
    load: /gpfs/scratch/ehpc533/hybrid_nucleus/production/ctxlen4n_s3/${aux.ckpt_arm}/ckpt
    ckpt_step: 1000
    save: null
    save_interval: null
    eval_iters: 50
    eval_interval: 2000

job:
  metadata:
    pool_priority: 55
  est_step_time_s: 60.0

slurm:
  sbatch:
    time: "01:00:00"

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - {aux.ckpt_arm: s4k}
        - {aux.ckpt_arm: s8k}
        - {aux.ckpt_arm: s16k}
        - {aux.ckpt_arm: s64k}
        - {aux.ckpt_arm: b4k400_64k}
        - {aux.ckpt_arm: b16k400_64k}
    - type: list
      configs:
        - {aux.seq: 4096, aux.gbs: 256, backend.megatron.micro_batch_size: 16, aux.len: at4k}
        - {aux.seq: 65536, aux.gbs: 16, backend.megatron.micro_batch_size: 1, aux.len: at64k}
