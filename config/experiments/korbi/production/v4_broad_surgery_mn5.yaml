# @package _global_
# The phase-2 plan's surgeries (SUPERSEDED by the 23300 session, user 2026-11-12); still the base of
# v4_broad23k_surgery_mn5 (kv8 / kv8post4 / cgqa from 23300).
# Checkpoint surgeries of the broad session (docs/recall_surgery_ambitious.md §10), one 1-node pool job per
# surgery: scripts/korbi/production/v4_broad_surgery.sh <name> in the training image, from a synced snapshot.
# Source: the pre-empted main run's start checkpoint, hard-linked first into
#   main_mhc4/ambitious_e360_eng80_v4_2ph_hd256/ckpt_eval/iter_<IT>   (read only)
# Outputs: /gpfs/scratch/ehpc533/hybrid_nucleus/production/v4_broad/src/<name>/ckpt/iter_<IT> (hard links + the new
# tensors + manifest kv_dup_surgery.json / ckda_branch_surgery.json) and its latest_checkpointed_iteration.txt (= IT,
# written after `verify` re-derived every tensor); logs .../v4_broad/surgery_logs/<name>.
#   kv8 / kv16  6 attention layers 2 -> 8 / 16 KV groups (duplicate_kv_groups.py, moments split) + verify + gpucheck
#   post4       attention copies (17/33/50/66 -> CKDA 19/35/52/68), gamma 0, 2 KV groups, additive mode
#   kv8post4    post4 on kv8's output at 8 KV groups (waits for kv8's tracker = IT)
#   conv        attention copies 66 -> CKDA 74, 82 -> CKDA 90, gamma 0, 2 KV groups (crossfade arm conv_lr4)
# Deterministic; an output whose tracker holds IT is skipped (checks rerun), another IT in the tracker is an error.
# Measured on the 23400 surgeries (same model): kv8 read 284 s + write 345 s, kv16 ~ 223 s + write, post4 read
# 197 s + write 241 s; + verify (another read) and, for kv, gpucheck: ~15-25 min each, kv8post4 ~10-15 min after kv8.
# Launch (all five at once; priority 90 = before the arms, which wait for these trackers):
#   cd $R/autoexp_<snapshot> && scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py --no-monitor \
#       --monitor-state-dir $R/pool_state --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/mn5_pool_p264 \
#       --config-name experiments/korbi/production/v4_broad_surgery_mn5 --yes aux.it=<IT>
# (one surgery: "aux.only=[kv8]"; dry run: --dry-run --dry-run-root $D)
defaults:
  - ../hybrid_speed/kernel_tests_mn5
  - _self_

aux:
  name: v4_broad_surgery
  surgery: kv8
  only: []
  # the start iteration: mandatory at launch (the pre-empted main run's final save, hard-linked into ckpt_eval)
  it: ???
  root: /gpfs/scratch/ehpc533/hybrid_nucleus/production/v4_broad
  src: /gpfs/scratch/ehpc533/hybrid_nucleus/production/main_mhc4/ambitious_e360_eng80_v4_2ph_hd256/ckpt_eval
  tests: ""
  bench: ""

backend:
  command: bash scripts/korbi/production/v4_broad_surgery.sh ${aux.surgery}
  env:
    ROOT: ${aux.root}
    SRC: ${aux.src}
    IT: ${aux.it}

job:
  name: v4_broad_surgery_${aux.surgery}
  base_output_dir: ${aux.root}/surgery_logs/${aux.surgery}
  est_step_time_s: 1800
  metadata:
    # above the arms (64) and the readout evals: the arms wait for these outputs
    pool_priority: 90
    pool_use_excluded_nodes: false
    pool_singleton: null

slurm:
  sbatch:
    time: "02:00:00"
    account: cns144
    qos: acc_xehpc

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.surgery}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.surgery: kv8
        - aux.surgery: kv16
        - aux.surgery: post4
        # the branches copy kv8's 8-group stack layers: waits for kv8's tracker (written after its verify)
        - aux.surgery: kv8post4
          job.start_condition:
            class_name: FileContentCondition
            path: /gpfs/scratch/ehpc533/hybrid_nucleus/production/v4_broad/src/kv8/ckpt/latest_checkpointed_iteration.txt
            pattern: "^\\s*${aux.it}\\s*$"
            mode: regex
            persistent_pass: true
        - aux.surgery: conv
