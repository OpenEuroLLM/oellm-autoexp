# @package _global_
# Exactness checks of the broad session's surgeries (docs/recall_surgery_ambitious.md §10; v4_broad_surgery_mn5):
# eval-only on the sub64 v8ml set (64 x 4096) + the Winogrande / WSC273 requests (160 x 512), per-token losses
# (MEGATRON_EVAL_TOKEN_DUMP), each surgery output against the source checkpoint iter_<IT>:
#   src       the main run's ckpt_eval/iter_<IT> (2 KV groups, no branch)
#   kv8/kv16  8 / 16 KV groups (num_query_groups)
#   post4     additive attention copies on CKDA 19/35/52/68, gamma 0
#   kv8post4  8 KV groups + the post4 copies at 8 groups (ckda_branch_num_query_groups 8)
#   conv      crossfade branches on CKDA 74/90 (copies of 66/82), loaded with the conv_lr4 arm's schedule (hold 0,
#             ramp 400, end 0): at the checkpoint's own iteration t = 0, alpha = 1 -> exactly complex_kda
# Each must match `src` token by token to bf16 kernel noise (23400: kv8 mean 2e-4 / rms 3.7e-2 per token on sub64,
# bit-identical on mc; kv16 / post4 bit-identical on sub64):
#   python scripts/korbi/production/duplicate_kv_groups.py compare-dumps \
#       /gpfs/scratch/ehpc533/hybrid_nucleus/fixedvalid_eval/v4_broad_<IT>/src/token_dump \
#       /gpfs/scratch/ehpc533/hybrid_nucleus/fixedvalid_eval/v4_broad_<IT>/<arm>/token_dump
# kv8 / kv16 / post4 are the same deterministic transforms already checked end to end at 23400 (§4.3 / §4.4); the
# new ones are kv8post4 and conv, so the minimal set is "aux.only=[src,kv8post4,conv]" (24 nodes); the arms'
# first step (identical batch in every arm) is the second, free check (vs ctrl's first-step loss).
# The model / env are fixedvalid_eval_kvdup_v4_mn5's (generated from the hd256 run's resolved config; no
# forward-relevant key differs from the phase-2 main run's config-mn5-pool-p264.0737.yaml -- checked 2026-11-12) with
# phase-2 eval-only patches: no phase transitions (a phase-2 checkpoint at train_iters = ckpt_step would find no
# next phase boundary), the plain cyclic sampler and gbs 256 (only the unused training index depends on them), the
# Engram optimizer arguments of the main run (irrelevant without optimizer state; kept equal).
# 8 nodes each (EP 8), priority 60 (below the arms' 64: the checks take spare nodes), gated on the surgery trackers.
#   cd $R/autoexp_<snapshot> && scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py --no-monitor \
#       --monitor-state-dir $R/pool_state --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/mn5_pool_p264 \
#       --config-name experiments/korbi/production/fixedvalid_eval_v4_broad_mn5 --yes aux.it=<IT> \
#       "aux.only=[src,kv8post4,conv]"
defaults:
  - fixedvalid_eval_kvdup_v4_mn5
  - _self_

aux:
  # the start iteration: mandatory at launch
  it: ???
  suite: v4_broad_${aux.it}
  arm: src
  broad_root: /gpfs/scratch/ehpc533/hybrid_nucleus/production/v4_broad

backend:
  megatron:
    ckpt_step: ${aux.it}
    train_iters: ${aux.it}
    phase_transition_iterations: null
    phase_transition_variable_batch: false
    data_sampler_reference_dp_size: null
    data_sampler_reference_micro_batch_size: null
    global_batch_size: 256
    engram_lr_mult: 1.0
    engram_clip_grad: 1.0
    engram_clip_rownorm: 7.0
    engram_clip_rownorm_start: 13.0
    engram_clip_rownorm_ramp_start: 25000
    engram_clip_rownorm_ramp_steps: 1000

job:
  metadata:
    pool_priority: 60

sweep:
  type: product
  store_sweep_json: true
  filter: \${oc.eval:'len(\${aux.only}) == 0 or "\${aux.arm}" in \${aux.only}'}
  groups:
  - type: list
    configs:
    # the source: the main run's frozen evaluation copy, 2 KV groups
    - aux.arm: src
      backend.megatron.load: /gpfs/scratch/ehpc533/hybrid_nucleus/production/main_mhc4/ambitious_e360_eng80_v4_2ph_hd256/ckpt_eval
    - aux.arm: kv8
      job.start_condition:
        class_name: FileContentCondition
        path: /gpfs/scratch/ehpc533/hybrid_nucleus/production/v4_broad/src/kv8/ckpt/latest_checkpointed_iteration.txt
        pattern: "^\\s*${aux.it}\\s*$"
        mode: regex
        persistent_pass: true
      backend.megatron.load: /gpfs/scratch/ehpc533/hybrid_nucleus/production/v4_broad/src/kv8/ckpt
      backend.megatron.num_query_groups: 8
    - aux.arm: kv16
      job.start_condition:
        class_name: FileContentCondition
        path: /gpfs/scratch/ehpc533/hybrid_nucleus/production/v4_broad/src/kv16/ckpt/latest_checkpointed_iteration.txt
        pattern: "^\\s*${aux.it}\\s*$"
        mode: regex
        persistent_pass: true
      backend.megatron.load: /gpfs/scratch/ehpc533/hybrid_nucleus/production/v4_broad/src/kv16/ckpt
      backend.megatron.num_query_groups: 16
    # additive attention copies (gamma 0), 2 KV groups, the post4_lr4 arm's mode
    - aux.arm: post4
      job.start_condition:
        class_name: FileContentCondition
        path: /gpfs/scratch/ehpc533/hybrid_nucleus/production/v4_broad/src/post4/ckpt/latest_checkpointed_iteration.txt
        pattern: "^\\s*${aux.it}\\s*$"
        mode: regex
        persistent_pass: true
      backend.megatron.load: /gpfs/scratch/ehpc533/hybrid_nucleus/production/v4_broad/src/post4/ckpt
      backend.megatron.ckda_branch: attention
      backend.megatron.ckda_branch_layers: [19, 35, 52, 68]
      backend.megatron.ckda_branch_num_query_groups: 2
      backend.megatron.ckda_branch_start_iteration: ${aux.it}
      backend.megatron.ckda_branch_crossfade: false
      backend.megatron.ckda_branch_alpha_hold: 100000
      backend.megatron.ckda_branch_alpha_ramp: 0
      backend.megatron.ckda_branch_alpha_end: 1.0
      backend.megatron.ckda_branch_m_start: 1.0
      backend.megatron.ckda_branch_m_ramp: 0
      backend.megatron.ckda_branch_calibrate: true
    # 8 KV groups in the stack AND in the post4 copies (the branches copy kv8's 8-group layers)
    - aux.arm: kv8post4
      job.start_condition:
        class_name: FileContentCondition
        path: /gpfs/scratch/ehpc533/hybrid_nucleus/production/v4_broad/src/kv8post4/ckpt/latest_checkpointed_iteration.txt
        pattern: "^\\s*${aux.it}\\s*$"
        mode: regex
        persistent_pass: true
      backend.megatron.load: /gpfs/scratch/ehpc533/hybrid_nucleus/production/v4_broad/src/kv8post4/ckpt
      backend.megatron.num_query_groups: 8
      backend.megatron.ckda_branch: attention
      backend.megatron.ckda_branch_layers: [19, 35, 52, 68]
      backend.megatron.ckda_branch_num_query_groups: 8
      backend.megatron.ckda_branch_start_iteration: ${aux.it}
      backend.megatron.ckda_branch_crossfade: false
      backend.megatron.ckda_branch_alpha_hold: 100000
      backend.megatron.ckda_branch_alpha_ramp: 0
      backend.megatron.ckda_branch_alpha_end: 1.0
      backend.megatron.ckda_branch_m_start: 1.0
      backend.megatron.ckda_branch_m_ramp: 0
      backend.megatron.ckda_branch_calibrate: true
    # crossfade conversion of CKDA 74 / 90 (copies of attention 66 / 82), the conv_lr4 arm's schedule
    - aux.arm: conv
      job.start_condition:
        class_name: FileContentCondition
        path: /gpfs/scratch/ehpc533/hybrid_nucleus/production/v4_broad/src/conv/ckpt/latest_checkpointed_iteration.txt
        pattern: "^\\s*${aux.it}\\s*$"
        mode: regex
        persistent_pass: true
      backend.megatron.load: /gpfs/scratch/ehpc533/hybrid_nucleus/production/v4_broad/src/conv/ckpt
      backend.megatron.ckda_branch: attention
      backend.megatron.ckda_branch_layers: [74, 90]
      backend.megatron.ckda_branch_num_query_groups: 2
      backend.megatron.ckda_branch_start_iteration: ${aux.it}
      backend.megatron.ckda_branch_crossfade: true
      backend.megatron.ckda_branch_alpha_hold: 0
      backend.megatron.ckda_branch_alpha_ramp: 400
      backend.megatron.ckda_branch_alpha_end: 0.0
      backend.megatron.ckda_branch_m_start: 1.0
      backend.megatron.ckda_branch_m_ramp: 0
      backend.megatron.ckda_branch_gamma_scale: 1.0
      backend.megatron.ckda_branch_calibrate: true
