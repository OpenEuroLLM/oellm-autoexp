# @package _global_
# Engram gate fix surgery on v4b's 53000 checkpoint as a 1-node pool job (c136 host002's spare node).
# Adds gate_terms.logit_scale (init = the query's mean |h~|) to the single-gate checkpoint (fix) and to
# the per-stream-gate copies with the read / stream query (bg_read / bg_stream). The arms
# (nucleus_engram_branch_fix_mn5) wait for these checkpoints.
#
#   cd $R/autoexp_<snapshot> && scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py --no-monitor \
#       --monitor-state-dir $R/pool_state --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/mn5_pool_c136 \
#       --config-name experiments/korbi/production/engram_branch_fix_surgery_mn5 --yes
defaults:
  - /experiments/base
  - /backend: bash
  - /container: marenostrum_hybrid
  - /slurm: marenostrum_ehpc533
  - /sweep: none
  - _self_

aux:
  kv_root: /gpfs/scratch/ehpc533/hybrid_nucleus/production/kvshare_k_fresh35900_20261116
  src: ${aux.kv_root}/runs/v4b_learned/main/ckpt
  it: 53000
  out_root: /gpfs/scratch/ehpc533/hybrid_nucleus/production/engram_branch_fix/surgery
  hybrid_env: /gpfs/projects/ehpc533/users/korbip/hybrid_v019
  sif: ${aux.hybrid_env}/container/MegatronTraining-hybrid-ep_x86_64_202610161948.sif
  read_scale: "2:0.016,52:0.47"
  stream_scale: "2:0.033,52:0.033"

backend:
  command: bash scripts/korbi/production/engram_branch_fix_surgery.sh
  env:
    SRC: ${aux.src}
    IT: ${aux.it}
    OUT_ROOT: ${aux.out_root}
    READ_SCALE: ${aux.read_scale}
    STREAM_SCALE: ${aux.stream_scale}

container:
  image: ${aux.sif}

job:
  name: engram_branch_fix_surgery
  base_output_dir: ${aux.out_root}/logs
  est_steps: 1
  est_step_time_s: 1800
  metadata:
    pool_priority: 120
    pool_use_excluded_nodes: false
    pool_singleton: null
  state_events:
    - name: timeout
      transition: ["RUNNING", "TIMEOUT"]
      action: {class_name: FinishAction, reason: "Job timed out"}
    - name: timeout
      transition: ["COMPLETING", "TIMEOUT"]
      action: {class_name: FinishAction, reason: "Job timed out"}

slurm:
  sbatch:
    nodes: 1
    time: "01:00:00"
    account: cns143
    qos: acc_xlarge

stage: test
