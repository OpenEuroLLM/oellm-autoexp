# @package _global_
# 009: production continuation, one restart, MBS4 with unchanged global samples.
# Preserve full training sample count/index cache; profiler schedule is RELATIVE to resume.
# Keep running after the brief profile, so a successful test needs no second restart.
defaults:
  - hybrid_ambitious_v4_2ph_256_mn5
  - _self_
backend:
  env:
    ENGRAM_STEP_GROUP: '1'
  megatron:
    profile: true
    use_pytorch_profiler: true
    profile_ranks: [0, 512]
    profile_step_start: 12
    profile_step_end: 15
    pytorch_profiler_collect_shapes: false
    pytorch_profiler_collect_callstack: false
    tensorboard_dir: ${job.base_output_dir}/mbs4_profile/tensorboard
job:
  name: ambitious_v4_2ph_256n_mbs4_profile_p${aux.phase}
sweep:
  groups:
    - type: list
      configs:
        - aux.phase: 1
          aux.seq: 8192
          aux.gbs: 8192
          backend.megatron.micro_batch_size: 4
          aux.stage_datamix: /gpfs/projects/ehpc533/users/korbip/hybrid_v019/data/datamix_v8ml_opt81_8k64k_stage1_mn5.txt
          job.start_condition:
            class_name: FileExistsCondition
            path: "\\${job.base_output_dir}/v3speed_p1_ok"
            persistent_pass: true
