# @package _global_
# Per-token mHC coefficients and streams of one HF export as a 1-node job (p264 host011's spare nodes), the input
# of an LDM init that imitates mHC-4 (scripts/korbi/production/mhc_coeff_dump.py). Output <aux.out>/:
# layer_<l>.npz (sampled tokens: streams, delta, h_pre / h_post / H_res), stats.json (all-token statistics,
# cosine of the layer input with the stream mean and with the PR #82 collapsed input), meta.json.
#
#   cd $R/autoexp_<snapshot> && scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py --no-monitor \
#       --monitor-state-dir $R/pool_state --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/mn5_pool_p264 \
#       --config-name experiments/korbi/production/mhc_coeff_dump_mn5 --yes
defaults:
  - /experiments/base
  - /backend: bash
  - /container: marenostrum_hybrid
  - /slurm: marenostrum_ehpc533
  - /sweep: none
  - _self_

aux:
  export: ambitious_v4b_learned_fp8_64000
  hf_exports: /gpfs/scratch/ehpc533/hybrid_nucleus/hf_exports
  out: /gpfs/scratch/ehpc533/hybrid_nucleus/production/ldm_imitation/${aux.export}_coeffs
  hybrid_env: /gpfs/projects/ehpc533/users/korbip/hybrid_v019
  sif: ${aux.hybrid_env}/container/MegatronTraining-hybrid-ep_x86_64_202610161948.sif
  docs: 16
  seq_len: 4096
  samples: 32

backend:
  # shell variables, not OmegaConf: the bash backend runs this under bash -c '<command>'
  command: python3 scripts/korbi/production/mhc_coeff_dump.py --model-dir "$HF_EXPORTS/$EXPORT" --out "$OUT" --docs "$DOCS" --seq-len "$SEQ_LEN" --samples "$SAMPLES"
  env:
    HF_EXPORTS: ${aux.hf_exports}
    EXPORT: ${aux.export}
    OUT: ${aux.out}
    DOCS: ${aux.docs}
    SEQ_LEN: ${aux.seq_len}
    SAMPLES: ${aux.samples}
    PYTHONPATH: ".:submodules/Megatron-LM:flash-linear-attention:submodules/cute_kernels:${aux.hybrid_env}/retention:${aux.hybrid_env}/pylibs_ep:${aux.hybrid_env}/pylibs_hfx"
    OELLM_HF_IMPL: fast
    OELLM_HF_MOE: fused
    OELLM_HF_ENGRAM_UVA: "1"
    OELLM_HF_GRAD: "0"
    HF_DATASETS_OFFLINE: "1"
    HF_HUB_OFFLINE: "1"
    HOME: /tmp
    TRITON_CACHE_DIR: /tmp/triton
    TORCHINDUCTOR_CACHE_DIR: /tmp/inductor

container:
  image: ${aux.sif}

job:
  name: mhc_coeff_dump_${aux.export}
  base_output_dir: ${aux.out}/logs
  est_steps: 1
  est_step_time_s: 2400
  metadata:
    # above the eval agent's 1-node jobs (60), below the main run (150)
    pool_priority: 95
    pool_use_excluded_nodes: false
    pool_singleton: null
  state_events:
    - name: timeout
      transition: ["RUNNING", "TIMEOUT"]
      action: {class_name: FinishAction, reason: "Job timed out"}
    - name: timeout
      transition: ["COMPLETING", "TIMEOUT"]
      action: {class_name: FinishAction, reason: "Job timed out"}

slurm:
  sbatch:
    nodes: 1
    time: "01:30:00"
    # p264's hosts: account cns144, qos acc_xehpc
    account: cns144
    qos: acc_xehpc

stage: test
