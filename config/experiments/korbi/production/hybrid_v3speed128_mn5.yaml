# @package _global_
# Speed / memory of the ambitious v3 main run at 128 nodes, both residuals (LDM with address width
# 128 / mHC-4), at the production setting (64k, mbs 1, gbs 1024, cap 0.80, 8 NCCL channels,
# ENGRAM_STEP_GROUP 1). mHC-4 never ran at this size: 360 experts + Engram 80B + 64k context.
# - 20 steps (exit_interval), the main run's train_iters / split / eval (its data index), no saves.
# - MEM_BREAKDOWN_STEPS 20: device total, reserved, max reserved, allocator retries per step.
# - Not the main run: own suite (production/v3speed/<arm>), no singleton.
#   python scripts/run_autoexp.py --no-monitor --monitor-state-dir $R/pool_state \
#       --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/mn5_pool_p132 \
#       --config-name experiments/korbi/production/hybrid_v3speed128_mn5 --yes
defaults:
  - hybrid_ambitious_pab_128_mn5
  - _self_

aux:
  suite: v3speed
  arm: ldm
  only: []

backend:
  env:
    MEM_BREAKDOWN: "1"
    MEM_BREAKDOWN_STEPS: "20"
  megatron:
    exit_interval: 20
    log_interval: 1
    save: null
    save_interval: null
    non_persistent_save_interval: null
    async_save: false
    use_persistent_ckpt_worker: false

job:
  name: ${aux.suite}_${aux.arm}
  array_group: null
  metadata:
    pool_singleton: null
    # above the conservative run (90), below the ambitious main run (100)
    pool_priority: 95
  est_step_time_s: 32.0
  log_events: []
  state_events:
    - name: give_up_node_fail
      transition: [null, NODE_FAIL]
      action: {class_name: CancelAction, reason: "speed test: lost a node"}
    - name: give_up_failed
      transition: [null, FAILED]
      action: {class_name: CancelAction, reason: "failed (speed test: no retry)"}

slurm:
  sbatch:
    time: "01:00:00"

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.arm: ldm
        - aux.arm: mhc4
          backend.megatron.depth_memory: false
          backend.megatron.mhc: true
          backend.megatron.mhc_expansion_rate: 4
          backend.megatron.residual_mixer_lr_mult: 0.25
