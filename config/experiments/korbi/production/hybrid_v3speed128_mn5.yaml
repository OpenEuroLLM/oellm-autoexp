# @package _global_
# Speed / memory of the ambitious v3 main run at 128 nodes: LDM (address width 128) in the three
# curriculum phases (4k x mbs 16, 16k x mbs 4, 64k x mbs 1; each phase's stage data), and mHC-4 (the
# fallback) at 64k. Production setting otherwise (cap 0.80, 8 NCCL channels, ENGRAM_STEP_GROUP 1).
# mHC-4 never ran at this size: 360 experts + Engram 80B + 64k context.
# - 20 steps (exit_interval), the main run's train_iters / split / eval (its data index), no saves.
# - MEM_BREAKDOWN_STEPS 20: device total, reserved, max reserved, allocator retries per step.
# - Not the main run: own suite (production/v3speed/<arm>), no singleton.
#   python scripts/run_autoexp.py --no-monitor --monitor-state-dir $R/pool_state \
#       --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/mn5_pool_p132 \
#       --config-name experiments/korbi/production/hybrid_v3speed128_mn5 --yes
defaults:
  - hybrid_ambitious_pab_128_mn5
  - _self_

aux:
  suite: v3speed
  arm: ldm_p3
  only: []

backend:
  env:
    MEM_BREAKDOWN: "1"
    MEM_BREAKDOWN_STEPS: "20"
  megatron:
    exit_interval: 20
    log_interval: 1
    save: null
    save_interval: null
    non_persistent_save_interval: null
    async_save: false
    use_persistent_ckpt_worker: false

job:
  name: ${aux.suite}_${aux.arm}
  array_group: null
  metadata:
    pool_singleton: null
    # above the conservative run (90) and the ambitious main run (100): the check runs first
    pool_priority: 101
  est_step_time_s: 32.0
  log_events: []
  state_events:
    - name: give_up_node_fail
      transition: [null, NODE_FAIL]
      action: {class_name: CancelAction, reason: "speed test: lost a node"}
    - name: give_up_failed
      transition: [null, FAILED]
      action: {class_name: CancelAction, reason: "failed (speed test: no retry)"}

slurm:
  sbatch:
    time: "01:00:00"

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        # first: the main run's phase 1 waits for this arm (its marker v3speed_p1_ok)
        - {aux.arm: ldm_p1, aux.phase: 1, aux.seq: 4096, aux.gbs: 16384, backend.megatron.micro_batch_size: 16, job.metadata.pool_priority: 102}
        # p2 / p3 start at iteration 0 here: one transition at the phase's own length, as the
        # data-cache prebuild (data_cache_prebuild_v3_mn5), so the index is the prebuilt one
        - {aux.arm: ldm_p2, aux.phase: 2, aux.seq: 16384, aux.gbs: 4096, backend.megatron.micro_batch_size: 4, backend.megatron.phase_transition_iterations: "18954"}
        - {aux.arm: ldm_p3, aux.phase: 3, backend.megatron.phase_transition_iterations: "213042"}
        - aux.arm: mhc4
          aux.phase: 3
          backend.megatron.phase_transition_iterations: "213042"
          backend.megatron.depth_memory: false
          backend.megatron.mhc: true
          backend.megatron.mhc_expansion_rate: 4
          backend.megatron.residual_mixer_lr_mult: 0.25
