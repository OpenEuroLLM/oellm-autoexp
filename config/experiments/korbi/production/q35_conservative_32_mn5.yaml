# @package _global_
# The conservative run at 32 nodes on ehpc533 / acc_ehpc (3-day jobs, monitor restarts) until the
# 128-node job (q35_conservative_128_mn5.yaml) starts; then scripts/korbi/production/
# flip_q35_32_to_128.sh stops this run (SIGUSR2: save + exit) and the 128-node job resumes from
# its checkpoint, resharded. Both share experiment group / suite / arm, hence the output directory
# (save = load, rolling checkpoints, data cache), gbs, seq and train_iters (the data order
# continues); only the job names and the per-scale keys differ.
defaults:
  - q35_conservative_mn5
  - _self_

job:
  name: q35c_${aux.suite}_32n          # run_2: q35c_32n
