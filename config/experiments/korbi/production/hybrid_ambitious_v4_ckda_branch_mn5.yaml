# @package _global_
# The ckda_branch "post-fit" arms (user 2026-11-09): does re-introducing attention (or CKLSTM) next to
# complex_kda layers of the v4_2ph hd256 main run help reading / commonsense / math? From the main run's
# checkpoint 23300 (ckpt_eval), 200 steps on the main run's own batches (phase 1, the reference-layout
# sampler: dp 512 x mbs 8), read out at 23400 and 23500 against the main run's 23400 / 23500 (arm A).
#   bgqa  attention 16q / 2kv, head dim 256 (the stack's attention: gate, qk norm, XSA, NoPE) next to the
#         complex_kda mixers at positions 4 / 12 / 20 = layers 9, 25, 41 (lower half at 3:1)
#   b8    the same with 8 KV groups (complex_kda's 16 K / V heads merged in pairs: no GQA pooling)
#   cgqa  16q / 2kv at all six positions, layers 9, 25, 41, 58, 74, 90 (3:1 everywhere)
#   d     KronLSTM (normalized v; complex_kda's projections, convolution, gates) at layers 9, 25, 41
#   drop  the control: complex_kda faded out at 9, 25, 41, nothing in its place
# Budget (user 2026-11-10): 6k GPU-h for this experiment (~1k per arm).
# Per layer a linear crossfade (user 2026-11-09), the weights adding up to 1:
#   out = alpha(t) ckda + (1 - alpha(t)) (1 + gamma) branch,  alpha 1 -> 0 over 23300 -> 23450,
# gamma (0 at insertion, Adam) a learnt correction of the branch's scale; the model is unchanged at 23300,
# the branch alone from 23450 (50 steps), main lr, no warmup (megatron/core/ssm/ckda_branch.py,
# ckda_branch_crossfade). Readouts: 23400 (2/3 branch), 23500 (branch only). At alpha = 0 the attention
# arms are standard attention layers (the HF export folds them).
#
# Before a launch (none without the user's go):
#   1. the checkpoints: ckda_branch_surgery_mn5 aux.mode=prod aux.arms="bgqa_cal b8_cal cgqa_cal d_cal drop"
#      (1 node on host003) -> /gpfs/scratch/ehpc533/hybrid_nucleus/production/ckda_branch/<arm>_src/ckpt/iter_0023300
#   2. hybrid_v4_ckda_branch_test_mn5 passed (exact start, strict resume, crossfade arms bgqa_xf / d_xf)
# Disk: full saves (1.1 TB, with optimizer: an arm can be continued) at 23400 and 23500, ~8.8 TB for the
# four (user 2026-11-09: checkpoints move to /gpfs/projects, scratch is freed); model only for less:
# backend.megatron.no_save_optim=true (~0.34 TB, enough for the eval / HF export).
# Cost per arm at 64 nodes: ~62 s/step x 200 + load / node check ~0.6 h: ~4 h, ~1.0k GPU-h (4k for four;
# at 128 nodes about the same GPU-h in half the time per arm). Memory at 64 nodes: main run 0.84 at 128n,
# the size64 sweep fit 89B-A2.9B-E80B at cap 0.80 with ~1.4 GiB free: check the first arm's mem usages.
# Two arms per launch (aux.only lists both; one launch per pair, see aux-only relaunch race), into p264:
#   cd $R/autoexp_<snapshot> && scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py --no-monitor \
#       --monitor-state-dir $R/pool_state --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/mn5_pool_p264 \
#       --config-name experiments/korbi/production/hybrid_ambitious_v4_ckda_branch_mn5 --yes "aux.only=[bgqa,d]"
defaults:
  - hybrid_ambitious_v4_2ph_hd256_128_mn5
  - _self_

aux:
  suite: ckda_branch
  # 2 x 64 nodes side by side on the 128-node p264 host003 (user 2026-11-09); the reference-layout sampler
  # (dp 512 x mbs 8) keeps the main run's batches at dp 256 (4 micro-batches per rank). 128 also works.
  nodes: 64
  arm: bgqa
  only: []
  phase: 1
  seq: 8192
  gbs: 8192
  stage_datamix: /gpfs/projects/ehpc533/users/korbip/hybrid_v019/data/datamix_v8ml_opt81_8k64k_stage1_mn5.txt
  branch_root: ${aux.main_root}/production/ckda_branch
  start: 23300

backend:
  megatron:
    micro_batch_size: 8
    load: ${aux.branch_root}/${aux.arm}_cal_src/ckpt
    save: ${job.base_output_dir}/ckpt
    save_interval: 100
    no_save_optim: false
    save_retain_interval: null
    non_persistent_save_interval: null
    exit_interval: 23500
    ckda_branch_start_iteration: ${aux.start}
    ckda_branch_crossfade: true
    # the branch scaled to complex_kda's output RMS on the first step (user 2026-11-10; small-model test: the
    # attention branch starts at ~1/3 of complex_kda's RMS and faded out unscaled)
    ckda_branch_calibrate: true
    ckda_branch_alpha_hold: 0
    ckda_branch_alpha_ramp: 150
    ckda_branch_alpha_end: 0.0
    ckda_branch_gamma_scale: 1.0
    ckda_branch_log_interval: 5

job:
  name: ckda_branch_${aux.arm}
  # 200 steps (23300 -> 23500): ~62 s/step at 64 nodes (size64 sweep: 33 s + 0.081 s x 360 experts at the
  # same 64M tokens per step; the main run: 27.6 s at 128n, 15.1 s at 256n), the 1.1 TB load + thorough
  # node check before the first step
  est_steps: 200
  est_step_time_s: 62.0
  est_startup_min: 35.0
  metadata:
    # never the main run's singleton: these run next to it, never instead of it
    pool_singleton: null
    pool_priority: 50
    # not on excluded nodes: p264 host003 lists its shrink-removed nodes there
    pool_use_excluded_nodes: false
  start_condition: null

slurm:
  sbatch:
    time: "06:00:00"
    # the account of the pool's hosts (p264: cns144)
    account: cns144

sweep:
  type: product
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.arm: bgqa
          job.start_condition:  # its surgery checkpoint (ckda_branch_surgery_mn5 aux.mode=prod)
            class_name: FileExistsCondition
            path: /gpfs/scratch/ehpc533/hybrid_nucleus/production/ckda_branch/bgqa_cal_src/ckpt/latest_checkpointed_iteration.txt
            persistent_pass: true
          backend.megatron.ckda_branch: attention
          backend.megatron.ckda_branch_layers: [9, 25, 41]
          backend.megatron.ckda_branch_num_query_groups: 2
        - aux.arm: b8
          job.start_condition:  # its surgery checkpoint (ckda_branch_surgery_mn5 aux.mode=prod)
            class_name: FileExistsCondition
            path: /gpfs/scratch/ehpc533/hybrid_nucleus/production/ckda_branch/b8_cal_src/ckpt/latest_checkpointed_iteration.txt
            persistent_pass: true
          backend.megatron.ckda_branch: attention
          backend.megatron.ckda_branch_layers: [9, 25, 41]
          backend.megatron.ckda_branch_num_query_groups: 8
        - aux.arm: cgqa
          job.start_condition:  # its surgery checkpoint (ckda_branch_surgery_mn5 aux.mode=prod)
            class_name: FileExistsCondition
            path: /gpfs/scratch/ehpc533/hybrid_nucleus/production/ckda_branch/cgqa_cal_src/ckpt/latest_checkpointed_iteration.txt
            persistent_pass: true
          backend.megatron.ckda_branch: attention
          backend.megatron.ckda_branch_layers: [9, 25, 41, 58, 74, 90]
          backend.megatron.ckda_branch_num_query_groups: 2
        # the control (user 2026-11-10): complex_kda faded out on 9 / 25 / 41, nothing in its place (an attention
        # branch held at weight 0: 1 + gamma = 0); B-gqa vs drop = what attention contributes
        - aux.arm: drop
          job.start_condition:  # its surgery checkpoint (ckda_branch_surgery_mn5 aux.mode=prod)
            class_name: FileExistsCondition
            path: /gpfs/scratch/ehpc533/hybrid_nucleus/production/ckda_branch/drop_src/ckpt/latest_checkpointed_iteration.txt
            persistent_pass: true
          backend.megatron.load: /gpfs/scratch/ehpc533/hybrid_nucleus/production/ckda_branch/drop_src/ckpt
          backend.megatron.ckda_branch: attention
          backend.megatron.ckda_branch_layers: [9, 25, 41]
          backend.megatron.ckda_branch_num_query_groups: 2
          backend.megatron.ckda_branch_calibrate: false
        - aux.arm: d
          job.start_condition:  # its surgery checkpoint (ckda_branch_surgery_mn5 aux.mode=prod)
            class_name: FileExistsCondition
            path: /gpfs/scratch/ehpc533/hybrid_nucleus/production/ckda_branch/d_cal_src/ckpt/latest_checkpointed_iteration.txt
            persistent_pass: true
          backend.megatron.ckda_branch: kronlstm
          backend.megatron.ckda_branch_layers: [9, 25, 41]
          # complex_kda's gates: beta = 2 sigmoid(b) (as linear_beta_max 2), no erase bias, write in [0, 2]
          # (no unit_write) so c = beta is the delta rule; low-rank output gate
          backend.megatron.linear_kronlstm_output_gate: lowrank
          backend.megatron.linear_kronlstm_normalize_v: true
          backend.megatron.linear_kronlstm_target_gate: true
          backend.megatron.linear_kronlstm_decouple_erase: true
          backend.megatron.linear_kronlstm_neg_eigval_init_bias: false
          backend.megatron.linear_kronlstm_unit_write: false
          backend.megatron.linear_kronlstm_signed_write: false
