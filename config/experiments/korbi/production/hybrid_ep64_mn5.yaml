# @package _global_
# Wide expert parallelism across nodes with ncclep (user 2026-10-29): do tokens-move-not-weights
# layouts make more experts cheap at 64 nodes?
#
# Background (docs/ambitious_size64.md): with MoonEP at EP 4 (in-node NVLink) and Megatron-FSDP,
# every micro-batch all-gathers / reduce-scatters all local experts (experts / 4): step time
# ~ 33 s + 0.081 s x experts, and memory per local expert (FSDP buffers, MoonEP pools) forced the
# allocator cap above 288 experts. At EP 16 / 32 each GPU holds experts / 16 or / 32, its FSDP group
# shrinks to 256 / EP ranks, and tokens cross nodes instead (~8 GB per GPU and micro-batch vs ~98 GB
# of expert weights at 216 experts / EP 4).
#
# ncclep (TE NCCL-EP, NCCL device API) is the only EP backend that works across nodes on MN5
# (docs/ep_fp8_speed.md in the ep worktree: EP 8 over 2 nodes = 0.87x HybridEP EP 4; rank capacity
# 1.5 / 2.0 overflowed and trapped, 2.5 held). Never run before with Megatron-FSDP, muown_classical,
# document masking or the SwiGLU clamp: part of what this measures.
#
# Arms (64 nodes, production recipe, 12 steps; allocator cap 0.80 for the receive buffers):
#   nep4_e216   ncclep at EP 4, 216 experts: ncclep vs MoonEP (size64 e216: 5,200 tok/s/GPU)
#   nep16_e224  EP 16, 224 experts (216 does not divide by 16): the wide-EP gain near the production size
#   nep16_e384  EP 16, 384 experts (MoonEP EP 4 + cap: 3,871)
#   nep32_e384  EP 32, 384 experts
#
#   scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py --no-monitor --monitor-state-dir $R/pool_state \
#       --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/mn5_pool_p129 \
#       --config-name experiments/korbi/production/hybrid_ep64_mn5 --yes
defaults:
  - hybrid_size64_mn5
  - _self_

aux:
  suite: ep64
  arm: nep16_e384

backend:
  env:
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True,per_process_memory_fraction:0.80"
    MEM_BREAKDOWN: "1"
  megatron:
    moe_token_dispatcher_type: flex
    moe_flex_dispatcher_backend: ncclep
    # receive capacity per rank (x mean tokens): 1.5 / 2.0 overflowed (trap) in the ep worktree
    moe_expert_rank_capacity_factor: 2.5

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.arm: nep4_e216
          aux.ep: 4
          backend.megatron.num_experts: 216
        # 216 does not divide by 16: 224 (14 per rank, +3.7 % experts)
        - aux.arm: nep16_e224
          aux.ep: 16
          backend.megatron.num_experts: 224
        - aux.arm: nep16_e384
          aux.ep: 16
          backend.megatron.num_experts: 384
        - aux.arm: nep32_e384
          aux.ep: 32
          backend.megatron.num_experts: 384
