# @package _global_
# THE MERGED RESTART (2026-11-05, owner: the main-run session "Current edits review (2)"): head dim 256
# (session -53) on top of the z-loss + forward-measured expert spectral cap ramp (session "Marenostrum
# training run 1 debugging"), which this config inherits through hybrid_ambitious_v4_2ph_mn5 (Megatron
# >= 3d8071635). Do not enqueue without the user's go. It is gated on the two checks below, and on a
# checkpoint widened from the step the 128-dim run actually stops at (not 9789: that run continues).
#
# v4_2ph continued with attention head dim 256 instead of 128 (user 2026-11-05: the 6 softmax attention
# layers' head dim caps long-range retrieval; Qwen3.5 uses 256; our 128 came from the 2026-10-17 screen
# layout, never screened). Starts from the v4_2ph checkpoint 9789 widened function-preserving by
# scripts/korbi/production/widen_attention_head_dim.py (eps 1e-3 noise on the new channels):
#   main_mhc4/ambitious_e360_eng80_v4_2ph_hd256/ckpt/iter_0009789 (the source's shards hard-linked,
#   widen256_0__0_0.distcp + merged .metadata). Same data order (same sampler state), optimizer state
#   carried over (new rows / columns: zero moments).
# Checks before a start: fixedvalid_eval_hd256_v4_mn5 (s9789 vs s9789hd256 must agree) and
# hybrid_v4_hd256_test_mn5 (2-node save / widen / resume on the production stack).
# Cost: ~+3 % FLOPs at 8k (6 of 98 layers), ~+25-30 % in the 64k phase (attention scores x2).
defaults:
  - hybrid_ambitious_v4_2ph_256_mn5
  - _self_

aux:
  arm: ambitious_e360_eng80_v4_2ph_hd256

backend:
  env:
    MEGATRON_DIAG_WEIGHT_EVERY: "10"
  megatron:
    kv_channels: 256
    # a missing / unwidened checkpoint must be fatal, never a silent fresh start or a partial load
    exit_on_missing_checkpoint: true
    strict_fsdp_dtensor_load: true
    finetune: false
    no_load_optim: false
    no_load_rng: false
    # per-layer grad norms every step + clip events (user 2026-11-09: monitoring before the phase-2
    # extension, e.g. another stabilization; grad-norm p99 0.375 -> 1.894 over 14k -> 22k). Needs Megatron
    # with fb06ef75b (FSDP shard counting; run branch oellm/v4main-diag = 3d8071635 + that fix, b05851989);
    # validated by session -2f: total_check / grad-norm = 0.9997-0.9998 at 2n EP4 (hybrid_v4_diaggrad_test_mn5).
    # Logged as diag/grad_norm/layer_NN | embedding | output_layer | total_check | layer_max ...,
    # diag/clip/streak | fired_frac | coeff_min. diag_activations stays off (expensive).
    diagnostics_interval: 1
    diag_layer_grad_norms: true
    diag_clip_events: true
    # per-layer weight stats (router / experts / shared / attention / CKDA / Engram families + "all":
    # min / max / mean / std / rms / norm, row-norm max / mean / ratio) and norm gains, correct under
    # Megatron-FSDP since Megatron 706c88c9e / 166f570c2 (offline full-tensor check of the 2-node test,
    # hybrid_v4_diagweight_test_mn5); every 10th step (MEGATRON_DIAG_WEIGHT_EVERY below): at every
    # step they cost +6 % at 2 nodes.
    diag_weight_stats: true
    diag_norm_gains: true

job:
  name: ambitious_v4_2ph_hd256_256n_p${aux.phase}
  metadata:
    # the main run's singleton: never next to the 128-dim run (that one is cancelled with a final
    # save, then its checkpoint is widened, then this one starts)
    pool_singleton: ambitious_main_v4
