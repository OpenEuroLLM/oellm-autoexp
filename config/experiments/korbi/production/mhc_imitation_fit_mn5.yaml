# @package _global_
# The fit of mhc_coeff_dump's samples as a 1-node job (the 7 GB dump stays on GPFS): how well collapse, the
# write fold, the per-token mean stream and the best fixed LDM read reproduce mHC-4's layer inputs
# (scripts/korbi/production/mhc_imitation_fit.py). Output <aux.out>/fit.json and the job log.
#
#   cd $R/autoexp_<snapshot> && scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py --no-monitor \
#       --monitor-state-dir $R/pool_state --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/mn5_pool_p264 \
#       --config-name experiments/korbi/production/mhc_imitation_fit_mn5 --yes
defaults:
  - /experiments/base
  - /backend: bash
  - /container: marenostrum_hybrid
  - /slurm: marenostrum_ehpc533
  - /sweep: none
  - _self_

aux:
  export: ambitious_v4b_learned_fp8_64000
  hf_exports: /gpfs/scratch/ehpc533/hybrid_nucleus/hf_exports
  out: /gpfs/scratch/ehpc533/hybrid_nucleus/production/ldm_imitation/${aux.export}_coeffs
  hybrid_env: /gpfs/projects/ehpc533/users/korbip/hybrid_v019
  sif: ${aux.hybrid_env}/container/MegatronTraining-hybrid-ep_x86_64_202610161948.sif
  docs: 16
  seq_len: 4096
  samples: 32

backend:
  # literal values, not shell variables: the job's env variables arrived empty in the container
  # ("--docs: invalid int value: ''", 2026-11-27, as in engram_gate_fixed_query_mn5)
  command: python3 scripts/korbi/production/mhc_imitation_fit.py --dump ${aux.out} --out ${aux.out}/fit.json --device cuda
  env:
    PYTHONPATH: ".:submodules/Megatron-LM:flash-linear-attention:submodules/cute_kernels:${aux.hybrid_env}/retention:${aux.hybrid_env}/pylibs_ep:${aux.hybrid_env}/pylibs_hfx"
    OELLM_HF_IMPL: fast
    OELLM_HF_MOE: fused
    OELLM_HF_ENGRAM_UVA: "1"
    OELLM_HF_GRAD: "0"
    HF_DATASETS_OFFLINE: "1"
    HF_HUB_OFFLINE: "1"
    HOME: /tmp
    TRITON_CACHE_DIR: /tmp/triton
    TORCHINDUCTOR_CACHE_DIR: /tmp/inductor

container:
  image: ${aux.sif}

job:
  name: mhc_imitation_fit_${aux.export}
  base_output_dir: ${aux.out}/fit_logs
  est_steps: 1
  est_step_time_s: 900
  metadata:
    # above the eval agent's 1-node jobs (60), below the main run (150)
    pool_priority: 95
    pool_use_excluded_nodes: false
    pool_singleton: null
  state_events:
    - name: timeout
      transition: ["RUNNING", "TIMEOUT"]
      action: {class_name: FinishAction, reason: "Job timed out"}
    - name: timeout
      transition: ["COMPLETING", "TIMEOUT"]
      action: {class_name: FinishAction, reason: "Job timed out"}

slurm:
  sbatch:
    nodes: 1
    time: "00:45:00"
    # p264's hosts: account cns144, qos acc_xehpc
    account: cns144
    qos: acc_xehpc

stage: test
