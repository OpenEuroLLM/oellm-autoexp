# @package _global_
# The "ambitious" production run at 128 nodes on cns144 / acc_xehpc (3-day jobs): takes over from
# hybrid_ambitious_32_mn5.yaml (same experiment group / suite / arm: it loads that run's latest
# checkpoint, resharded to 512 GPUs). When this job starts, the 32-node run is stopped
# (scripts/korbi/production/flip_32_to_128.sh).
defaults:
  - hybrid_main_mn5
  - _self_

aux:
  arm: ambitious_e216_eng40
  nodes: 128

backend:
  env:
    # Engram step lookup: the 2 micro-batches per step (mbs 4 x 512 GPUs x 2 = 4096)
    ENGRAM_STEP_GROUP: "2"
  megatron:
    num_experts: 216
    # rolling checkpoints about hourly, as at 32 nodes (est. ~25 s / step at 128 nodes); a divisor of
    # 500: the equal-token eval marks at steps 500 * 2^n (scripts/korbi/eval_marks) are hard-linked
    # from complete checkpoints
    non_persistent_save_interval: 125
    # persistent (kept) checkpoints every 1000 steps (user 2026-10-25)
    save_interval: 1000
    # keep only every 10000th persistent checkpoint (+ the newest): ~0.61 TB each, ~179 over the run
    # would be ~110 TB of the 154 TB scratch; the eval marks are hard links and survive
    save_retain_interval: 10000
    # asynchronous checkpoint saves (user 2026-10-25): a synchronous rolling save took ~7.3 min at
    # 32 nodes (~9 % of a 50-step interval); the background worker writes while training runs
    async_save: true
    use_persistent_ckpt_worker: true
    # reuse the global save plan from the third save after a (re)start on (Megatron bdbda626a):
    # planning was ~89 s of every save at 32 nodes, then 0.4 s (blocking ~7 s per save)
    ckpt_assume_constant_structure: true

job:
  name: ambitious_gqa_128n
  # one ambitious main run at a time across the pools (singleton guard): a larger allocation's
  # enqueue of it preempts the smaller one and takes over (64 nodes now -> 128 later). Here, not
  # in hybrid_main_mn5.yaml: the speed / profile configs inherit that one
  metadata:
    pool_singleton: ambitious_main_ldm
  # estimate: ~1/4 of the 32-node step if the scale costs no more (to be measured)
  est_step_time_s: 25.0

slurm:
  sbatch:
    account: cns144
    qos: acc_xehpc
  env:
    # the flip (flip_32_to_128.sh) sends the 32-node job SIGUSR2 once this job runs: wait for its
    # final save to be written and the job to end before loading (templates/marenostrum.sbatch)
    WAIT_FOR_JOB_NAME: ambitious_gqa_32n
