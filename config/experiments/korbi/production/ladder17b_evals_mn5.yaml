# @package _global_
# The three retrieval/commonsense rows on the jupiter 1.7B ladder exports (stable phase ends, wsd50B), on one
# MN5 node each, plain HF lm-eval (docs/recall_surgery_ambitious.md §3/§6). Four arms, one row set each:
#   attn_1.7B_wsd50B              100 % attention, the transformer reference
#   kda-sig-hybrid-lowrank        25 % attention, bounded KDA
#   skda-shipped-hybrid-lowrank   25 % attention, signed CKDA  <- what the big run is a scaled version of
#   skda-shipped-lowrank           0 % attention, signed CKDA
# That is the smaller-scale axis which says whether the CoQA / SQuAD v2 deficit is an attention-fraction
# effect at all (Winogrande already says attention hurts: 63.1 % at 0 %, 60.1-60.9 at 25 %, 58.8-59.4 at 100 %).
#
#   cd $R/autoexp_<snapshot> && scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py --no-monitor \
#       --monitor-state-dir $R/pool_state --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/mn5_pool_o134c \
#       --config-name experiments/korbi/production/ladder17b_evals_mn5 --yes aux.tasks=coqa,winogrande
defaults:
  - ../hybrid_speed/kernel_tests_mn5
  - _self_

aux:
  root: /gpfs/projects/ehpc533/users/korbip/hybrid_v019/hf_models/ladder17b
  arm: skda-shipped-hybrid-lowrank_1.7B_wsd50B
  tasks: coqa,winogrande,squadv2   # comma separated; coqa+winogrande first (squadv2 generates 11,873 times)
  out: /gpfs/projects/ehpc533/users/korbip/hybrid_v019/ladder17b_evals
  name: ladder17b_${aux.arm}

backend:
  command: >-
    bash scripts/korbi/production/ladder17b_lm_eval.sh ${aux.root}/${aux.arm} ${aux.out}/${aux.arm}
    $(echo ${aux.tasks} | tr ',' ' ')

job:
  name: ladder17b_${aux.arm}
  base_output_dir: ${aux.out}/logs/${aux.arm}
  est_step_time_s: 14400
  metadata:
    pool_priority: 40
    pool_use_excluded_nodes: true   # one node, inference only

slurm:
  sbatch:
    time: "08:00:00"
    account: cns144
    qos: acc_xehpc

sweep:
  type: product
  groups:
    - type: list
      configs:
        - aux.arm: attn_1.7B_wsd50B
        - aux.arm: kda-sig-hybrid-lowrank_1.7B_wsd50B
        - aux.arm: skda-shipped-hybrid-lowrank_1.7B_wsd50B
        - aux.arm: skda-shipped-lowrank_1.7B_wsd50B
