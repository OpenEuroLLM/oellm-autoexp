# @package _global_
# Broad session (docs/recall_surgery_ambitious.md §10; PREPARED, NOT LAUNCHED -- needs the user's go, it pre-empts the
# main run): seven arms side by side, all from the main run's LATEST checkpoint (iteration aux.it, the final save of
# the pre-empted main run, hard-linked into ckpt_eval first), so a winner can continue as the main run.
#
# Geometry. The main run is in PHASE 2 (64k sequences, 1024 per step = 67M tokens, mbs 1, reference sampler 512 x 1,
# 256 nodes). The arms take 8x fewer tokens per update: 4 x nodes sequences of 64k (32 nodes -> dp 128, one 64k
# micro-batch per GPU, gbs 128 = 8.4M tokens, no accumulation), aux.steps = 102,400 / gbs = 800 steps = the samples
# of 100 main-run steps (6.7B tokens). The arms read the main run's data stream exactly: Megatron fe6615493
# --data-sampler-reference-global-batch-size 1024 (8 arm steps = one main-run step, same samples, same order; the
# training index is the main run's) and --phase-start-consumed-samples 23691 x 8192 (the position = consumed samples
# - phase start, not (iteration - 23691) x 128, which would replay the phase's first eighth). Every arm trains on
# the same batches -> the per-step training loss is a paired readout. A winner hands back to the main run at gbs 1024
# from its last save (iteration aux.it + 800 = 100 main-run steps of data; the main run then also needs
# phase_start_consumed_samples: 194076672 or it skips 700 steps of data).
#
# lr: 8.5e-4 x sqrt(gbs / 1024) = 3.0e-4 (square-root rule for normalized updates -- MuOwn's orthogonalized steps and
# Adam -- below the critical batch: same noise temperature and drift per token as the main run). Attention
# multipliers on top (attention_lr_mult, Megatron 31fcf98e0): x4 -> 1.2e-3, x8 -> 2.4e-3 on every SelfAttention
# parameter (+ branches + gamma). Expert-bias update rate per step scaled by gbs / 1024 (1.25e-4: the main run's
# balancing speed per token). Momenta / betas are per step and are NOT rescaled (Adam betas are not re-applied on
# load for muown_classical's groups): their horizon in tokens is 8x shorter than the main run's.
#
# Memory (the risk of this layout): 64k tokens per micro-batch at 32 nodes was never run. Main run 256n: 8.3 GB
# persistent + 37.7 GB transient = 46.0 GB max allocated (per_process_memory_fraction 0.80 = 52.4 GB cap); 32n
# persistent 18.6 GB (moe_topk/k6, mbs 2 x 8k: 47.5 GB max allocated at 16k tokens per micro-batch) -> ~56 GB
# if the transients add up, above the cap. Not reducible by a free knob: recompute_num_layers 1 doubles the
# pinned host copies of the mHC-4 chunk inputs (RECOMPUTE_OFFLOAD: ~1 GB per chunk and GPU at 64k -> ~420 GB per
# node, host OOM). Hence the memory probe at the start of the session (runbook §10.4); fallback: 64 nodes per arm
# (aux.nodes=64 -> gbs 256, 400 steps, lr 4.25e-4; persistent 13.2 GB -> ~51 GB, as bgqa at 64n), 4 arms.
#
# Arms (literals in the entries: interpolations inside a sweep entry resolve against the base config):
#   ctrl           nothing changed (paired baseline)
#   kv8_lr4        8 KV groups (exact duplication) + attention_lr_mult 4
#   post4_lr4      additive attention copies on CKDA 19/35/52/68 (from attention 17/33/50/66, gamma 0) + x4
#   kv8_post4_lr4  both: stack 8 KV groups, the four branches 8 KV groups too (kv8 first, then the copies)
#   conv_lr4       CKDA 74 and 90 -> attention (crossfade from copies of attention 66 / 82; alpha 1 -> 0 over the
#                  first half of the arm, then pure attention) + x4
#   kv16_lr8       16 KV groups (MHA) + attention_lr_mult 8
#   k6_L49         moe_router_topk 6 + the deep Engram (layer 49) off (engram_output_scale 0 on [49] over 50 steps)
# Sources: aux.root/src/<surgery>/ckpt (v4_broad_surgery_mn5) or the main run's ckpt_eval; each arm's own
# checkpoint directory is seeded with hard links (scripts/korbi/production/v4_broad_seed.sh) so load = save and a
# pool restart resumes from the arm's own latest save, never from the start.
#
#   IT=<the final save's iteration>; cd $R/autoexp_v4broad1 && scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py \
#       --no-monitor --monitor-state-dir $R/pool_state --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/mn5_pool_p264 \
#       --config-name experiments/korbi/production/hybrid_v4_broad_mn5 --yes aux.it=$IT
defaults:
  - hybrid_ambitious_v4_2ph_hd256_mn5
  - _self_

aux:
  suite: v4_broad
  arm: ctrl
  only: []
  # the start: the main run's final save (ckpt_eval/iter_<it>); mandatory on the command line
  it: ???
  start: ${aux.it}
  nodes: 32
  # phase 2 of the main run (no sweep over phases here)
  phase: 2
  seq: 65536
  stage_datamix: /gpfs/projects/ehpc533/users/korbip/hybrid_v019/data/datamix_v8ml_opt81_8k64k_stage2_mn5.txt
  gbs: "${oc.eval:'4 * ${aux.nodes}'}"
  # the main run's data stream: its phase-2 batch and the consumed samples at the phase-2 start (23691 x 8192)
  ref_gbs: 1024
  phase_start_consumed: 194076672
  # an arm = the samples of 100 main-run steps (800 steps at 32 nodes, 400 at 64)
  arm_steps: "${oc.eval:'102400 // ${aux.gbs}'}"
  steps: ${aux.arm_steps}
  end: "${oc.eval:'${aux.start} + ${aux.steps}'}"
  lr: "${oc.eval:'round(8.5e-4 * (${aux.gbs} / 1024) ** 0.5, 7)'}"
  bias_rate: "${oc.eval:'1e-3 * ${aux.gbs} / 1024'}"
  # conv_lr4's crossfade: alpha 1 -> 0 over the first half of the arm
  conv_ramp: "${oc.eval:'${aux.arm_steps} // 2'}"
  # the branch / Engram schedules start at the surgery's iteration (the dec copies keep it)
  branch_start: ${aux.it}
  root: ${aux.main_root}/production/v4_broad
  main_ckpt: ${aux.main_root}/production/main_mhc4/ambitious_e360_eng80_v4_2ph_hd256/ckpt_eval
  dir: ${aux.arm}
  # light node check before every (re)start: a bad node costs a 40-minute start-up otherwise
  node_check: light

backend:
  megatron:
    micro_batch_size: 1
    lr: ${aux.lr}
    min_lr: ${aux.lr}
    lr_decay_style: constant
    data_sampler_reference_global_batch_size: ${aux.ref_gbs}
    phase_start_consumed_samples: ${aux.phase_start_consumed}
    moe_router_bias_update_rate: ${aux.bias_rate}
    # each arm's own directory, seeded with hard links to the start (v4_broad_seed.sh): restarts resume from the
    # arm's own latest save
    load: ${job.base_output_dir}/ckpt
    save: ${job.base_output_dir}/ckpt
    ckpt_step: null
    exit_interval: ${aux.end}
    # readouts at +200 / +400 / +800 (32 nodes; +100 / +200 / +400 at 64) when aux.it is a multiple of the interval
    # (runbook); the exit saves too
    save_interval: "${oc.eval:'${aux.arm_steps} // 4'}"
    non_persistent_save_interval: null
    # no in-run validation: a full pass of the fixed sets takes ~25-30 min at 32 nodes (3.6 min at 256); the paired
    # loss readout is the training loss on identical batches, the task readout broad_readout.py
    eval_interval: 1000000
    # branch / Engram schedules (inert unless an entry turns them on)
    ckda_branch: null
    ckda_branch_start_iteration: ${aux.branch_start}
    engram_output_scale_start: ${aux.branch_start}
    # additive branch mode (post4 / kv8_post4; conv overrides): complex_kda at full weight, branch added with gamma
    ckda_branch_crossfade: false
    ckda_branch_alpha_hold: 100000
    ckda_branch_alpha_ramp: 0
    ckda_branch_alpha_end: 1.0
    ckda_branch_m_start: 1.0
    ckda_branch_m_ramp: 0
    ckda_branch_gamma_scale: 1.0
    ckda_branch_calibrate: true
    ckda_branch_log_interval: 10

job:
  name: v4broad_${aux.dir}
  base_output_dir: ${aux.root}/${aux.dir}
  log_path_current: ${job.base_output_dir}/current_${job.name}.log
  config_path_current: ${job.base_output_dir}/current_${job.name}.yaml
  est_steps: ${aux.steps}
  # one 64k micro-batch per GPU per step, as the main run's 16.8 s at 256 nodes; 64n bgqa: 13.5 s per 64k-token
  # micro-batch (phase 1)
  est_step_time_s: 18.0
  est_startup_min: 40.0
  # the seed script writes the tracker (v4_broad_seed.sh); a surgery arm is seeded only once its surgery is done
  start_condition:
    class_name: FileExistsCondition
    path: ${job.base_output_dir}/ckpt/latest_checkpointed_iteration.txt
    persistent_pass: true
  metadata:
    # NOT the main run's singleton (ambitious_main_v4): the arms run side by side
    pool_singleton: null
    # above the eval units (60) and exports (50), below the surgeries (90) and the main run (1000)
    pool_priority: 80
    pool_use_excluded_nodes: false

slurm:
  sbatch:
    account: cns144
    time: "12:00:00"

sweep:
  type: product
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.arm: ctrl
        - aux.arm: kv8_lr4
          backend.megatron.num_query_groups: 8
          backend.megatron.attention_lr_mult: 4.0
        - aux.arm: post4_lr4
          backend.megatron.ckda_branch: attention
          backend.megatron.ckda_branch_layers: [19, 35, 52, 68]
          backend.megatron.ckda_branch_num_query_groups: 2
          backend.megatron.attention_lr_mult: 4.0
        - aux.arm: kv8_post4_lr4
          backend.megatron.num_query_groups: 8
          backend.megatron.ckda_branch: attention
          backend.megatron.ckda_branch_layers: [19, 35, 52, 68]
          backend.megatron.ckda_branch_num_query_groups: 8
          backend.megatron.attention_lr_mult: 4.0
        - aux.arm: conv_lr4
          backend.megatron.ckda_branch: attention
          backend.megatron.ckda_branch_layers: [74, 90]
          backend.megatron.ckda_branch_num_query_groups: 2
          backend.megatron.ckda_branch_crossfade: true
          backend.megatron.ckda_branch_alpha_hold: 0
          backend.megatron.ckda_branch_alpha_ramp: ${aux.conv_ramp}
          backend.megatron.ckda_branch_alpha_end: 0.0
          backend.megatron.attention_lr_mult: 4.0
        - aux.arm: kv16_lr8
          backend.megatron.num_query_groups: 16
          backend.megatron.attention_lr_mult: 8.0
        - aux.arm: k6_L49
          aux.topk: 6
          backend.megatron.engram_output_scale: 0.0
          backend.megatron.engram_output_scale_layers: [49]
          backend.megatron.engram_output_scale_ramp: 50
