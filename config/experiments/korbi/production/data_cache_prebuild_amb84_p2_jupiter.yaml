# @package _global_
# Dataset-index prebuild for the JUPITER main-run continuation (hybrid_ambitious_v4_2ph_hd256_p2_jupiter, phase 2:
# 64k, gbs 1024, stage-2 datamix with JSC paths; docs/recall_surgery_ambitious.md §19.1), on ONE GPU, so the 256-node
# start does not spend 15-25 min building it on rank 0 (MN5: cold 14-25 min). The pattern of
# data_cache_prebuild_ambitious_mn5: the run's own config (the cache key is data / schedule only -- blend, split, seq,
# seed, tokenizer, train and eval samples), a 2-layer stand-in model (not part of the key), skip_train, cancelled at
# "[after dataloaders are built]". Writes ${aux.amb84}/data_cache, which the main run and the smoke test read.
# Never touches checkpoints (load / save null). PREPARED, NOT ENQUEUED; a 1-node slot of a small16 host is enough:
#   cd ~/work/Projects/oellm-autoexp-hybrid && PYTHONPATH=. .venv/bin/python scripts/run_autoexp.py --no-monitor \
#       --monitor-state-dir /e/scratch/e-sta-openeurollm/poeppel1/pool_state \
#       --pool /e/scratch/e-sta-openeurollm/poeppel1/pools/jupiter_pool_small16 \
#       --config-name experiments/korbi/production/data_cache_prebuild_amb84_p2_jupiter --yes
#   (afterwards: python scripts/check_data_cache.py /e/fscratch/e-sta-openeurollm/poeppel1/ambitious84/data_cache)
defaults:
  - hybrid_ambitious_v4_2ph_hd256_p2_jupiter
  - _self_

aux:
  ep: 1
  topk: 2
  expert_ffn: 256
  pattern: "*E"
  only: [prebuild_p2]

backend:
  torchrun_args:
    nproc_per_node: 1
  env:
    WANDB_MODE: disabled
  megatron:
    skip_train: true
    # the validation index as a training run sizes it (data_cache_prebuild_ambitious_mn5, 2026-10-31)
    eval_iters: ${oc.eval:'(int(${backend.megatron.train_iters}) // int(${backend.megatron.eval_interval}) + 1) * 10'}
    distributed_timeout_minutes: 180
    # --- stand-in model (not part of the cache key) ---
    hidden_size: 256
    ffn_hidden_size: 512
    kv_channels: 64
    num_attention_heads: 4
    num_query_groups: 2
    num_experts: 4
    moe_router_topk: 2
    expert_model_parallel_size: 1
    engram_table_size: 1024
    # --- never a checkpoint ---
    load: null
    save: null
    non_persistent_global_ckpt_dir: null
    non_persistent_save_interval: null
    async_save: false
    use_persistent_ckpt_worker: false

slurm:
  sbatch:
    nodes: 1
    time: "02:00:00"
    account: e-ext-2025e02-108

job:
  name: amb84_jsc_prebuild_p2
  base_output_dir: ${aux.amb84}/data_cache_prebuild/p2
  start_condition: null
  state_events: []
  est_steps: 1
  est_step_time_s: 1800
  log_events:
    - name: indices_built
      pattern: "[after dataloaders are built]"
      pattern_type: substring
      match_once: true
      action: {class_name: CancelAction, reason: "dataset indices built: the prebuild is done"}
  metadata:
    pool_singleton: null
    pool_priority: 60

sweep:
  type: product
  groups:
    - type: list
      configs:
        - aux.run: prebuild_p2
          aux.phase: 2
          aux.seq: 65536
          aux.gbs: 1024
          aux.nodes: 1
          backend.megatron.micro_batch_size: 1
