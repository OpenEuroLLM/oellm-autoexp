# @package _global_
# The vLLM port of oellm_ambitious (submodules/vllm) against its HF export, on one MN5 node:
# scripts/korbi/vllm/run_vllm_parity.sh (builds $R/pylibs_vllm_<sha> from $R/wheels_vllm032 first).
#
#   scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py --no-monitor --monitor-state-dir $R/pool_state \
#       --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/<pool> \
#       --config-name experiments/korbi/production/vllm_parity_mn5 aux.mode=tiny --yes
#   ... aux.mode=export aux.target="/gpfs/scratch/ehpc533/hybrid_nucleus/hf_exports/ambitious_ldm_e216_500 4"
#   or the dev queue: drop --pool ..., add aux.dev_queue=true
defaults:
  - ../hybrid_speed/kernel_tests_mn5
  - _self_

aux:
  mode: tiny          # tiny | export
  target: ""          # export: "<export dir> <tp>"
  name: vllm_parity_${aux.mode}
  bench: "bash scripts/korbi/vllm/run_vllm_parity.sh ${aux.mode} ${aux.target}"

job:
  base_output_dir: "${oc.env:OUTPUT_DIR,'./output'}/vllm_parity/${aux.name}"
  est_step_time_s: 2400
  array_group: null
  metadata:
    pool_priority: 30

slurm:
  sbatch:
    time: "01:30:00"
    qos: acc_xehpc
    account: ehpc533
