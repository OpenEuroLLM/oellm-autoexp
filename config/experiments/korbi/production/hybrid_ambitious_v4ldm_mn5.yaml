# @package _global_
# ambitious_v4_ldm (user 2026-11-02): one last LDM try at full scale, next to ambitious_v4 (mHC-4),
# watched closely and stopped on anything off. The v3 LDM recipe on the 8k -> 64k curriculum with:
#   embedding_norm            RMSNorm on the embedding output (learnable gain, init 1; Adam, no
#                             wd): the front stream at rms ~1 for the whole run, whatever the rows
#                             do (a multiplier would scale with them and multiply the embedding's
#                             Adam lr). v3's front stream stayed at rms ~0.02 (its pre-norm's
#                             backward gain ~1 / rms, the memory reads ~65 % of the front inputs)
#   no wd on the embedding / routers (inherited, as v4)
#   QB EMA 0 + global_aux_loss 1e-4 (user): quantile balancing with the fixed global loss (s3:
#                             0 ghost / near-dead slots, -0.003 vs the expert bias)
#   arch metrics every 50 steps (LDM per site, pab, gates): the run is meant to be read closely
defaults:
  - hybrid_ambitious_pab_128_mn5
  - curriculum_8k64k_opt81_mn5  # option8_1 mix since 2026-11-02 (user: continue, no restart)
  - _self_

aux:
  arm: ambitious_e360_eng80_v4_ldm

backend:
  megatron:
    embedding_norm: true
    moe_router_load_balancing_type: [quantile_balancing, global_aux_loss]
    moe_aux_loss_coeff: [0.0, 1.0e-4]
    moe_router_quantile_balancing_ema: 0.0
    moe_router_enable_expert_bias: false
    moe_router_fusion: false
    arch_metrics_interval: 50

job:
  name: ambitious_v4ldm_128n_p${aux.phase}
  metadata:
    # own singleton: runs next to ambitious_v4
    pool_singleton: ambitious_main_v4_ldm
