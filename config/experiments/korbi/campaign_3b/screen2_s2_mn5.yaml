# @package _global_
# GENERATED by scripts/korbi/campaign/gen_screen.py -- edit there.
# Parameter-matched feature screen 2 (AdamW, 1000-step warmup, stable), size s2: hidden 1024 x 20 blocks, 16 heads
# of 64, d_ffn 2816 (base), datamix4, lr 0.00125, gbs 128 x 4096, 1000-step warmup, then constant
# (stable only, no cooldown) to aux.tokens. Arms: one feature each; d_ffn matched per arm (19 arms counted).
defaults:
  - base_train_mn5
  - _self_

aux:
  suite: screen2_s2
  family: s2
  tokens: 4.0e9
  gbs: 128
  pattern: "*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-"

backend:
  megatron:
    hidden_size: 1024
    num_attention_heads: 16
    num_query_groups: 16
    kv_channels: 64
    ffn_hidden_size: 2816
    linear_num_key_heads: 16
    linear_num_value_heads: 16
    lr: 0.00125
    min_lr: 0.00125
    # stable only: no cooldown. Arms are compared on the stable-phase loss; at equal lr / gbs the
    # stable ranking is the cooled one (round 1: Spearman 0.98-1.00 over 4 screens of 9 arms).
    # Round-1 screens ran WSD (20 % linear cooldown to lr / 10).
    lr_decay_style: constant
    lr_wsd_decay_iters: null
    # 1000 warmup steps (the round-1 AdamW screen ran max(100, 1 %) = 100; angular MuOwn runs
    # override it to 0)
    lr_warmup_iters: 1000
    eval_interval: 500
    eval_iters: 20

job:
  array_group: ${aux.suite}
  est_step_time_s: 1.6

slurm:
  sbatch:
    time: "05:00:00"

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        # base: attention (qk-norm, RoPE) + SwiGLU (d_ffn 2816, non-emb 256.9M)
        - aux.arm: attn
          backend.megatron.ffn_hidden_size: 2816
        # exclusive self attention (d_ffn 2816, non-emb 256.9M)
        - aux.arm: attn_xsa
          backend.megatron.exclusive_self_attention: true
          aux.tokens: 2097152000
          backend.megatron.ffn_hidden_size: 2816
        # sigmoid attention output gate (d_ffn 2496, non-emb 258.3M)
        - aux.arm: attn_gate
          backend.megatron.attention_output_gate: true
          aux.tokens: 2097152000
          backend.megatron.ffn_hidden_size: 2496
        # 3:1 CKDA (reference: standard inits, low-rank gate) : attention hybrid (d_ffn 2752, non-emb 257.4M)
        - aux.arm: h_ckda_std
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.experimental_attention_variant: complex_kda
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_gate_activation: signed_sigmoid2
          backend.megatron.linear_gate_init_style: shipped
          backend.megatron.linear_output_gate: lowrank
          backend.megatron.linear_drop_qkv_silu: true
          aux.tokens: 2097152000
          backend.megatron.ffn_hidden_size: 2752
        # 3:1 CKDA (standard inits) hybrid, XSA in the attention layers (d_ffn 2752, non-emb 257.4M)
        - aux.arm: h_ckda_std_xsa
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.experimental_attention_variant: complex_kda
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_gate_activation: signed_sigmoid2
          backend.megatron.linear_gate_init_style: shipped
          backend.megatron.linear_output_gate: lowrank
          backend.megatron.linear_drop_qkv_silu: true
          backend.megatron.exclusive_self_attention: true
          backend.megatron.ffn_hidden_size: 2752
        # 3:1 triadic CKDA (E=4) : attention hybrid (d_ffn 2688, non-emb 256.4M)
        - aux.arm: h_tri_ckda
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.experimental_attention_variant: triadic
          backend.megatron.linear_triadic_base: ckda
          backend.megatron.linear_triadic_e: 4
          aux.tokens: 2097152000
          backend.megatron.micro_batch_size: 2
          backend.megatron.ffn_hidden_size: 2688
        # 3:1 triadic CKDA (E=4) hybrid, XSA in the attention layers (d_ffn 2688, non-emb 256.4M)
        - aux.arm: h_tri_ckda_xsa
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.experimental_attention_variant: triadic
          backend.megatron.linear_triadic_base: ckda
          backend.megatron.linear_triadic_e: 4
          backend.megatron.exclusive_self_attention: true
          aux.tokens: 2097152000
          backend.megatron.micro_batch_size: 2
          backend.megatron.ffn_hidden_size: 2688
        # 3:1 Gated DeltaNet : attention hybrid (d_ffn 2560, non-emb 257.6M)
        - aux.arm: h_gdn
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.experimental_attention_variant: gated_delta_net
          aux.tokens: 2097152000
          backend.megatron.ffn_hidden_size: 2560
        # 3:1 GDN (heads of 128) : NoPE attention hybrid (multilingual gdn3_nope) (d_ffn 1280, non-emb 257.8M)
        - aux.arm: h_gdn_nope
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.experimental_attention_variant: gated_delta_net
          backend.megatron.linear_key_head_dim: 128
          backend.megatron.linear_value_head_dim: 128
          backend.megatron.position_embedding_type: none
          aux.tokens: 2097152000
          backend.megatron.micro_batch_size: 4
          backend.megatron.ffn_hidden_size: 1280
        # 3:1 GDN : gated attention, partial RoPE, zero-centred norm (Qwen3.5-like) (d_ffn 1152, non-emb 255.2M)
        - aux.arm: h_gdn_qwen35
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.experimental_attention_variant: gated_delta_net
          backend.megatron.linear_key_head_dim: 128
          backend.megatron.linear_value_head_dim: 128
          backend.megatron.attention_output_gate: true
          backend.megatron.position_embedding_type: rope
          backend.megatron.rotary_percent: 0.25
          backend.megatron.layernorm_zero_centered_gamma: true
          backend.megatron.micro_batch_size: 4
          backend.megatron.ffn_hidden_size: 1152
