# @package _global_
# GENERATED by scripts/korbi/campaign/gen_screen.py -- edit there.
# Round 3B (docs §10.3): MoE design on the round-3 attention base (attn_ref: hidden 768 x
# 12 blocks, 6 q heads x 128, GQA 2), an MoE FFN in every block with the active FFN width
# matched to the dense twin's 2048; sparsity, granularity, shared expert, router balancing, and
# lr / gbs, each with AdamW (2e-3, 1000 warmup) and angular MuOwn (4e-3, no warmup). Stable
# only, 4000 steps at gbs 128 (equal tokens 2.1e+09 for every arm), every step logged.
defaults:
  - base_train_mn5
  - _self_

aux:
  suite: screen3b_s1
  family: s1
  tokens: 2097152000
  gbs: 128
  lr: 2.0e-3
  warmup_iters: 1000
  pattern: "*-*-*-*-*-*-*-*-*-*-*-*-"

backend:
  megatron:
    hidden_size: 768
    ffn_hidden_size: 2048
    lr: ${aux.lr}
    min_lr: ${aux.lr}
    lr_decay_style: constant
    lr_wsd_decay_iters: null
    lr_warmup_iters: ${aux.warmup_iters}
    log_interval: 1
    eval_interval: 500
    eval_iters: 20

job:
  array_group: ${aux.suite}
  est_step_time_s: 1.2

slurm:
  sbatch:
    time: "04:00:00"

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        # attn_ref, dense FFN 2048 (the dense twin) [adamw]
        - aux.arm: adamw_dense
          aux.lr: 0.002
          aux.warmup_iters: 1000
          backend.megatron.num_attention_heads: 6
          backend.megatron.num_query_groups: 2
          backend.megatron.kv_channels: 128
          backend.megatron.linear_key_head_dim: 128
          backend.megatron.linear_value_head_dim: 128
          backend.megatron.linear_num_key_heads: 6
          backend.megatron.linear_num_value_heads: 6
          backend.megatron.exclusive_self_attention: true
          backend.megatron.ffn_hidden_size: 2048
        # 16 x 512, top-4 (4x sparse) [adamw]
        - aux.arm: adamw_e16k4
          aux.lr: 0.002
          aux.warmup_iters: 1000
          backend.megatron.num_attention_heads: 6
          backend.megatron.num_query_groups: 2
          backend.megatron.kv_channels: 128
          backend.megatron.linear_key_head_dim: 128
          backend.megatron.linear_value_head_dim: 128
          backend.megatron.linear_num_key_heads: 6
          backend.megatron.linear_num_value_heads: 6
          backend.megatron.exclusive_self_attention: true
          aux.pattern: '*E*E*E*E*E*E*E*E*E*E*E*E'
          backend.megatron.num_experts: 16
          backend.megatron.moe_ffn_hidden_size: 512
          backend.megatron.moe_router_topk: 4
          backend.megatron.moe_shared_expert_intermediate_size: null
          backend.megatron.moe_grouped_gemm: true
          backend.megatron.moe_token_dispatcher_type: alltoall
          backend.megatron.moe_router_dtype: fp32
          backend.megatron.moe_permute_fusion: true
          backend.megatron.expert_model_parallel_size: 4
          backend.megatron.moe_router_load_balancing_type: aux_loss
          backend.megatron.moe_aux_loss_coeff: 0.001
          backend.megatron.moe_per_layer_logging: true
          backend.megatron.moe_expert_viability_metrics: true
          backend.megatron.cuda_graph_modules: [attn]
        # 32 x 512, top-4 (8x sparse) [adamw]
