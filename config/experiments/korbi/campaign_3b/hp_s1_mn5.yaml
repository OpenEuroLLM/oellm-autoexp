# @package _global_
# GENERATED by scripts/korbi/campaign/gen_hpsweep.py -- edit there.
# LR x batch-size sweep, size s1 base model (attention, hidden 768 x 12 blocks),
# flag data, STABLE trunks (constant LR after the optimizer's warmup) to aux.tokens; the cooled
# loss is predicted (losspred family fit). Per run: aux.lr, aux.gbs, aux.warmup_frac.
defaults:
  - screen_s1_mn5
  - _self_

aux:
  suite: hp_s1
  arm: hp
  tokens: 1.0e9
  lr: 1.0e-3
  gbs: 64
  warmup_frac: 0.01

backend:
  megatron:
    lr: ${aux.lr}
    min_lr: ${aux.lr}
    lr_decay_style: constant
    lr_wsd_decay_iters: null
    lr_warmup_iters: "${oc.eval:'int(${aux.warmup_frac} * ${backend.megatron.train_iters})'}"
    eval_interval: 250

sweep:
  type: list
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        # AdamW, 1 % warmup
        - aux.arm: adamw_lr0.00025_b32
          aux.lr: 0.00025
          aux.gbs: 32
        # AdamW, 1 % warmup
        - aux.arm: adamw_lr0.00025_b64
          aux.lr: 0.00025
          aux.gbs: 64
        # AdamW, 1 % warmup
        - aux.arm: adamw_lr0.00025_b128
          aux.lr: 0.00025
          aux.gbs: 128
        # AdamW, 1 % warmup
        - aux.arm: adamw_lr0.0005_b32
          aux.lr: 0.0005
          aux.gbs: 32
        # AdamW, 1 % warmup
        - aux.arm: adamw_lr0.0005_b64
          aux.lr: 0.0005
          aux.gbs: 64
        # AdamW, 1 % warmup
        - aux.arm: adamw_lr0.0005_b128
          aux.lr: 0.0005
          aux.gbs: 128
        # AdamW, 1 % warmup
        - aux.arm: adamw_lr0.001_b32
          aux.lr: 0.001
          aux.gbs: 32
        # AdamW, 1 % warmup
        - aux.arm: adamw_lr0.001_b64
          aux.lr: 0.001
          aux.gbs: 64
        # AdamW, 1 % warmup
        - aux.arm: adamw_lr0.001_b128
          aux.lr: 0.001
          aux.gbs: 128
        # AdamW, 1 % warmup
        - aux.arm: adamw_lr0.002_b32
          aux.lr: 0.002
          aux.gbs: 32
        # AdamW, 1 % warmup
        - aux.arm: adamw_lr0.002_b64
          aux.lr: 0.002
          aux.gbs: 64
        # AdamW, 1 % warmup
        - aux.arm: adamw_lr0.002_b128
          aux.lr: 0.002
          aux.gbs: 128
        # AdamW, 1 % warmup
        - aux.arm: adamw_lr0.004_b32
          aux.lr: 0.004
          aux.gbs: 32
        # AdamW, 1 % warmup
        - aux.arm: adamw_lr0.004_b64
          aux.lr: 0.004
          aux.gbs: 64
        # AdamW, 1 % warmup
        - aux.arm: adamw_lr0.004_b128
          aux.lr: 0.004
          aux.gbs: 128
        # MuOwn, no warmup
        - aux.arm: muown_lr0.00025_b32
          aux.lr: 0.00025
          aux.gbs: 32
          backend.megatron.optimizer: muown
          aux.warmup_frac: 0.0
        # MuOwn, no warmup
        - aux.arm: muown_lr0.00025_b64
          aux.lr: 0.00025
          aux.gbs: 64
          backend.megatron.optimizer: muown
          aux.warmup_frac: 0.0
        # MuOwn, no warmup
