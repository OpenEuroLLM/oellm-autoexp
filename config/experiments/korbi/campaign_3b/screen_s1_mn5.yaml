# @package _global_
# GENERATED by scripts/korbi/campaign/gen_screen.py -- edit there.
# Parameter-matched feature screen, size s1: hidden 768 x 12 blocks, 12 heads
# of 64, d_ffn 2048 (base), datamix4, lr 0.001, gbs 64 x 4096, WSD (1 % warmup, 20 % linear
# cooldown) to aux.tokens. Arms: one feature each; d_ffn matched per arm (9 arms counted).
defaults:
  - base_train_mn5
  - _self_

aux:
  suite: screen_s1
  family: s1
  tokens: 2.0e9
  gbs: 64
  pattern: "*-*-*-*-*-*-*-*-*-*-*-*-"

backend:
  megatron:
    hidden_size: 768
    num_attention_heads: 12
    num_query_groups: 12
    kv_channels: 64
    ffn_hidden_size: 2048
    linear_num_key_heads: 12
    linear_num_value_heads: 12
    lr: 0.001
    min_lr: 0.0001
    lr_decay_style: WSD
    lr_wsd_decay_style: linear
    lr_wsd_decay_iters: "${oc.eval:'int(0.2 * ${backend.megatron.train_iters})'}"
    lr_warmup_iters: "${oc.eval:'max(100, int(0.01 * ${backend.megatron.train_iters}))'}"
    eval_interval: 500
    eval_iters: 20

job:
  array_group: ${aux.suite}
  est_step_time_s: 0.6

slurm:
  sbatch:
    time: "02:00:00"

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        # base: attention (qk-norm, RoPE) + SwiGLU (d_ffn 2048, non-emb 85.0M)
        - aux.arm: attn
          backend.megatron.ffn_hidden_size: 2048
        # exclusive self attention (d_ffn 2048, non-emb 85.0M)
        - aux.arm: attn_xsa
          backend.megatron.exclusive_self_attention: true
          backend.megatron.ffn_hidden_size: 2048
        # sigmoid attention output gate (d_ffn 1792, non-emb 85.0M)
        - aux.arm: attn_gate
          backend.megatron.attention_output_gate: true
          backend.megatron.ffn_hidden_size: 1792
        # 3:1 CKDA : attention hybrid (d_ffn 1792, non-emb 84.3M)
        - aux.arm: h_ckda
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.experimental_attention_variant: complex_kda
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_output_gate: linear
          backend.megatron.linear_drop_qkv_silu: true
          backend.megatron.linear_gate_init_style: spread
          backend.megatron.ffn_hidden_size: 1792
        # 3:1 CKDA hybrid, XSA in the attention layers (d_ffn 1792, non-emb 84.3M)
        - aux.arm: h_ckda_xsa
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.experimental_attention_variant: complex_kda
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_output_gate: linear
          backend.megatron.linear_drop_qkv_silu: true
          backend.megatron.linear_gate_init_style: spread
          backend.megatron.exclusive_self_attention: true
          backend.megatron.ffn_hidden_size: 1792
        # 3:1 CKDA hybrid, gated attention (d_ffn 1728, non-emb 84.3M)
        - aux.arm: h_ckda_gate
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.experimental_attention_variant: complex_kda
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_output_gate: linear
          backend.megatron.linear_drop_qkv_silu: true
          backend.megatron.linear_gate_init_style: spread
          backend.megatron.attention_output_gate: true
          backend.megatron.ffn_hidden_size: 1728
        # 3:1 KDA : attention hybrid (d_ffn 1984, non-emb 85.1M)
        - aux.arm: h_kda
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.experimental_attention_variant: kda
          backend.megatron.ffn_hidden_size: 1984
        # 3:1 KDA hybrid, XSA (d_ffn 1984, non-emb 85.1M)
        - aux.arm: h_kda_xsa
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.experimental_attention_variant: kda
          backend.megatron.exclusive_self_attention: true
          backend.megatron.ffn_hidden_size: 1984
        # 3:1 Gated DeltaNet : attention hybrid (d_ffn 1856, non-emb 85.2M)
        - aux.arm: h_gdn
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.experimental_attention_variant: gated_delta_net
          backend.megatron.ffn_hidden_size: 1856
        # 3:1 mLSTM : attention hybrid (d_ffn not matched yet)
        - aux.arm: h_mlstm
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.experimental_attention_variant: mlstm
