# @package _global_
# GENERATED by scripts/korbi/campaign/gen_screen.py -- edit there.
# Round 5: the architecture decision on the production data setting (flag, 8k), size s3: hidden 1280 x 24 blocks, 10 heads
# of 64, d_ffn 3584 (base), datamix4, lr 0.0018, gbs 64 x 4096, 1000-step warmup, then constant
# (stable only, no cooldown) to aux.tokens. Arms: one feature each; d_ffn matched per arm (MoE: equal active and total by construction).
defaults:
  - base_train_mn5
  - _self_

aux:
  suite: screen5kronpfb_s3
  family: s3
  tokens: 4.0e9
  gbs: 64
  pattern: "*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-"

backend:
  megatron:
    hidden_size: 1280
    num_attention_heads: 10
    num_query_groups: 10
    kv_channels: 64
    ffn_hidden_size: 3584
    linear_num_key_heads: 10
    linear_num_value_heads: 10
    lr: 0.0018
    min_lr: 0.0018
    # stable only: no cooldown. Arms are compared on the stable-phase loss; at equal lr / gbs the
    # stable ranking is the cooled one (round 1: Spearman 0.98-1.00 over 4 screens of 9 arms).
    # Round-1 screens ran WSD (20 % linear cooldown to lr / 10).
    lr_decay_style: constant
    lr_wsd_decay_iters: null
    # 1000 warmup steps (the round-1 AdamW screen ran max(100, 1 %) = 100; angular MuOwn runs
    # override it to 0)
    lr_warmup_iters: 1000
    eval_interval: 500
    eval_iters: 20

job:
  array_group: ${aux.suite}
  est_step_time_s: 7.0

slurm:
  sbatch:
    time: "12:00:00"

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        # KronLSTM 5:1, polar forget and erase gates, low-rank output gate
        - aux.arm: h5_moe_kron_lr_pfb
          backend.megatron.num_attention_heads: 10
          backend.megatron.num_query_groups: 2
          backend.megatron.kv_channels: 128
          backend.megatron.linear_key_head_dim: 128
          backend.megatron.linear_value_head_dim: 128
          backend.megatron.linear_num_key_heads: 10
          backend.megatron.linear_num_value_heads: 10
          backend.megatron.position_embedding_type: none
          backend.megatron.attention_output_gate: true
          backend.megatron.exclusive_self_attention: true
          aux.pattern: LELELELELE*ELELELELELE*ELELELELELE*ELELELELELE*E
          backend.megatron.num_experts: 144
          backend.megatron.moe_ffn_hidden_size: 896
          backend.megatron.moe_router_topk: 3
          backend.megatron.moe_shared_expert_intermediate_size: 896
          backend.megatron.moe_grouped_gemm: true
          backend.megatron.moe_token_dispatcher_type: alltoall
          backend.megatron.moe_router_dtype: fp32
          backend.megatron.moe_permute_fusion: true
          backend.megatron.expert_model_parallel_size: 16
          backend.megatron.moe_router_load_balancing_type: aux_loss
          backend.megatron.moe_aux_loss_coeff: 0.0001
          backend.megatron.moe_per_layer_logging: true
          backend.megatron.moe_expert_viability_metrics: true
          backend.megatron.cuda_graph_modules: [moe_router, moe_preprocess]
          backend.megatron.moe_router_score_function: sigmoid
          backend.megatron.moe_router_enable_expert_bias: true
          backend.megatron.moe_router_bias_update_rate: 0.001
          backend.megatron.micro_batch_size: 1
          backend.megatron.optimizer: angular_muown
          backend.megatron.lr: 0.0018
          backend.megatron.min_lr: 0.0018
          backend.megatron.lr_warmup_iters: 0
          backend.megatron.exit_interval: 4000
          job.est_steps: 4000
          backend.megatron.per_split_data_args_path: null
          backend.megatron.data_args_path: /gpfs/projects/ehpc533/users/korbip/hybrid_v019/data/flag_datamix_mn5.txt
          backend.megatron.split: 998,2,0
          backend.megatron.seq_length: 8192
          backend.megatron.max_position_embeddings: 8192
          backend.megatron.dataloader_inter_document_masking: true
          backend.megatron.num_workers: 4
          backend.megatron.dataloader_prefetch_factor: 2
          backend.megatron.manual_gc: true
          backend.megatron.manual_gc_interval: 10
          backend.megatron.mmap_bin_files: false
          aux.seq: 8192
          backend.megatron.global_batch_size: 64
          aux.gbs: 64
          backend.megatron.train_iters: 7629
          backend.megatron.cuda_graph_impl: local
          backend.megatron.data_cache_path: /gpfs/scratch/ehpc533/users/korbip/hybrid_v019_runs/data_cache_flag8k_r5
          slurm.sbatch.nodes: 4
          backend.megatron.experimental_attention_variant: kronlstm
          backend.megatron.linear_fla_gate: softplus
          backend.megatron.linear_fla_allow_neg_eigval: false
          backend.megatron.linear_kronlstm_output_gate: lowrank
          backend.megatron.linear_kronlstm_forget_angle: true
          backend.megatron.linear_kronlstm_erase_angle: true
