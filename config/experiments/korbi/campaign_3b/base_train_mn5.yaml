# @package _global_
# Base of the 3B-active campaign's small-scale trainings (docs/hybrid_moe_3b_campaign.md) on
# MareNostrum 5: the speed suite's optimized stack and image (speed_base_mn5.yaml), trained on
# datamix4 (data_datamix4_mn5.yaml: exp_irene's multilingual mix, OELLM 256k tokenizer, separate
# validation mix) with TensorBoard and the architecture metrics; nothing saved unless a config asks
# for it. The "flag" mix (data_flag_mn5.yaml) replaces it once fully on the cluster (swap the
# data default below).
#
#   scripts/korbi/mn5_autoexp_bg.sh smoke scripts/run_autoexp.py \
#       --config-name experiments/korbi/campaign_3b/base_train_mn5
defaults:
  - ../hybrid_speed/speed_base_mn5
  - /backend/megatron: [data_datamix4_mn5]
  - _self_

aux:
  experiment_group: campaign_3b
  # the shared MN5 node exclusion list (one node per line), re-read before every resubmission
  mn5_exclude_file: /gpfs/projects/ehpc533/users/korbip/hybrid_v019/mn5_exclude_nodes.txt
  family: dm4
  arm: smoke
  suite: c0
  tokens: 0.1e9
  gbs: 64
  seq: 4096
  # wandb, as oellm_32b_dense: written OFFLINE next to each run (MN5 compute nodes have no
  # internet); upload later with scripts/korbi/campaign/wandb_sync_tb.sh (offline runs)
  wandb_project: hybrid_baby_arch_exp

backend:
  env:
    WANDB_MODE: offline
    WANDB_RUN_GROUP: ${aux.suite}
    # fewer fragmentation losses (with the 4 NCCL channels of slurm/marenostrum_ehpc533.yaml)
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  megatron:
    micro_batch_size: 8
    global_batch_size: ${aux.gbs}
    train_iters: "${oc.eval:'int(${aux.tokens}) // (${aux.gbs} * ${aux.seq})'}"
    lr_decay_style: constant
    lr_warmup_iters: 100
    eval_interval: 100
    eval_iters: 10
    log_interval: 10
    # architecture diagnostics (arch_metrics.py: residual-stream sizes and usage, routers, gates;
    # per layer with moe_per_layer_logging), every 100 steps -- round 4 ran without them
    arch_metrics_interval: 100
    wandb_project: ${aux.wandb_project}
    wandb_entity: openeurollm-project
    wandb_exp_name: ${job.name}
    wandb_save_dir: ${job.base_output_dir}/wandb
    # checkpoints, as oellm_32b_dense (b1_reborn_common.yaml): rolling non-persistent ones (only
    # the latest kept) and one persistent checkpoint at the end of the run; load = save, so a
    # restarted job resumes. (Never set non_persistent_ckpt_type: null on a training run with a
    # non_persistent_save_interval: Megatron raises at the first save boundary -> restart loop.)
    save: ${job.base_output_dir}/ckpt
    load: ${job.base_output_dir}/ckpt
    save_interval: ${backend.megatron.train_iters}
    non_persistent_ckpt_type: global
    non_persistent_global_ckpt_dir: ${job.base_output_dir}/ckpt_rolling
    # every 250 steps (s1 ~13 min, s2 ~25 min): restarts / config switches lose little (user
    # 2026-10-18). Two rolling checkpoints on disk per run (~90 GB at s1); scratch quota 146 TB.
    non_persistent_save_interval: 250
    # asynchronous saves, as the production runs (user 2026-10-28): a synchronous rolling save
    # blocked training 17-77 s per 250 steps at s1 (3-9 %); the persistent worker keeps the
    # writer process across saves, constant structure skips re-planning the save
    async_save: true
    use_persistent_ckpt_worker: true
    ckpt_assume_constant_structure: true
    # one index cache for every run (user 2026-10-27): its entries are addressed by the hash of
    # the data settings (blend, seed, length, samples, split), so each data recipe is built once
    # and every later run, arm or restart loads it (cold build 14-25 min, warm load 3-4 min).
    # Concurrent builders of one entry used to race (EOFError / mmap size errors); Megatron
    # >= 11bd4aab1 locks the entry and writes atomically. Per-run caches only for the prefetch
    # / mirror variants (data_staging/mirror_mn5.yaml), which discover their index hash there.
    data_cache_path: ${oc.env:OUTPUT_DIR,./output}/data_cache_shared
    # building the per-run index of the 156-prefix blend from GPFS can take > 10 min (one rank
    # builds, the others wait in a barrier): the default 10-min NCCL timeout killed a run
    distributed_timeout_minutes: 45

job:
  name: ${aux.suite}_${aux.arm}
  base_output_dir: "${oc.env:OUTPUT_DIR,'./output'}/${aux.experiment_group}/${aux.suite}/${aux.arm}"
  array_group: null
  est_step_time_s: 1.0
  # SLURM end states (replacing the speed base's "TIMEOUT -> finished", meant for short speed
  # tests): a training run that loses its node, runs out of host memory, fails or hits the wall
  # time is resubmitted and resumes from its rolling checkpoint -- with the shared MN5 exclusion
  # list re-read first (the in-job watchdog / by hand append bad nodes to it). Bounded per end
  # state; then given up. NODE_FAIL / OUT_OF_MEMORY / TIMEOUT are not end states the monitor
  # closes by itself: without these events such a run stays "active" and is never acted on
  # (2026-10-22/23: five s2 runs sat dead after NODE_FAIL / host OOM, see docs §12.13).
  state_events:
    - name: retry_node_fail
      transition: [null, NODE_FAIL]
      condition: {class_name: MaxActionFiresCondition, max_fires: 3}
      action: {class_name: RestartAction, reason: "lost its node -- resuming", exclude_file: "${aux.mn5_exclude_file}"}
    - name: retry_oom
      transition: [null, OUT_OF_MEMORY]
      condition: {class_name: MaxActionFiresCondition, max_fires: 1}
      action: {class_name: RestartAction, reason: "host out of memory -- resuming once", exclude_file: "${aux.mn5_exclude_file}"}
    - name: retry_failed
      transition: [null, FAILED]
      condition: {class_name: MaxActionFiresCondition, max_fires: 2}
      action: {class_name: RestartAction, reason: "failed -- resuming (transient GPFS / NCCL / node errors)", exclude_file: "${aux.mn5_exclude_file}"}
    - name: retry_timeout
      transition: [null, TIMEOUT]
      condition: {class_name: MaxActionFiresCondition, max_fires: 2}
      action: {class_name: RestartAction, reason: "hit the wall time -- resuming", exclude_file: "${aux.mn5_exclude_file}"}
    - name: give_up_node_fail
      transition: [null, NODE_FAIL]
      action: {class_name: CancelAction, reason: "lost its node again"}
    - name: give_up_oom
      transition: [null, OUT_OF_MEMORY]
      action: {class_name: CancelAction, reason: "out of host memory again"}
    - name: give_up_timeout
      transition: [null, TIMEOUT]
      action: {class_name: CancelAction, reason: "hit the wall time again"}
  # the backward CUDA-graph capture (cuda_graphs.py create_bwd_graph, default "global" capture
  # mode) is invalidated now and then at startup by another thread's CUDA call
  # (cudaErrorStreamCaptureInvalidated / "Invalid stream capture status"): 2 of 4 attn_ref runs
  # under angular MuOwn on 2026-10-17. One rank dies at step 0, SLURM says COMPLETED 0:0, the
  # monitor finished the job. Transient: a fresh start passes. Bounded restart.
  log_events:
    # checkpoint recovery (config/job/auto_restart_ckptreset.yaml, which see): a save cut off by
    # a lost node leaves a checkpoint with short shards -> quarantine it (renamed failed_iter_N,
    # tracker rolled back, at most 2) and resume from the last loadable one; a checkpoint written
    # at another world size, or one that cannot be opened at all, cancels instead (a restart would
    # loop on it, or silently start from scratch). The rolling directory is where our saves die.
    - name: ckpt_corrupt_quarantine
      pattern: "No such file or directory: '[^']*/iter_(\\d+)/__\\d+_\\d+\\.distcp'"
      pattern_type: regex
      extract_groups: {iteration: 1}
      match_once: true
      action:
        class_name: QuarantineCheckpointAction
        checkpoint_dir: ${backend.megatron.non_persistent_global_ckpt_dir}
        iteration: "{iteration}"
        quarantine_prefix: "failed_"
        max_rollbacks: 2
    - name: ckpt_corrupt_restart
      pattern: "No such file or directory: '[^']*/iter_(\\d+)/__\\d+_\\d+\\.distcp'"
      pattern_type: regex
      match_once: true
      condition: {class_name: MaxActionFiresCondition, max_fires: 5}
      action: {class_name: RestartAction, cancel_first: true, reason: "checkpoint quarantined; resuming from the last loadable one"}
    - name: err_ckpt_world_size_mismatch
      pattern: "Missing key in checkpoint state_dict: rerun_state_machine_state/shard_\\d+_(\\d+)"
      pattern_type: regex
      match_once: true
      action: {class_name: CancelAction, reason: "checkpoint written at a different world size"}
    - name: err_ckpt_unloadable
      pattern: "CheckpointingException: Checkpoint directory .* does not exist|CheckpointingException: .* is not a distributed checkpoint"
      pattern_type: regex
      match_once: true
      action: {class_name: CancelAction, reason: "checkpoint cannot be opened (interrupted save) -- needs a hand rollback"}
    - name: cuda_graph_capture_invalidated
      pattern: "cudaErrorStreamCaptureInvalidated|Invalid stream capture status|operation failed due to a previous error during capture"
      pattern_type: regex
      condition:
        class_name: MaxActionFiresCondition
        max_fires: 2
      action:
        class_name: RestartAction
        reason: "CUDA-graph capture invalidated at startup (transient) -- restarting"
    # A non-finite gradient norm: the run trains on garbage from there on (round 4's dense mHC
    # arms ran ~2.5k steps on NaN gradients, 2026-10-18: rerun_mode is disabled, so Megatron
    # neither skips nor stops). A restart would resume the same weights: cancel.
    - name: nonfinite_grad_norm
      pattern: "grad norm: (nan|inf)"
      pattern_type: regex
      match_once: true
      action:
        class_name: CancelAction
        reason: "non-finite grad norm -- the run diverged"
    # A diverged run need not go NaN: free routed 2-of-8 ran from step ~200 to 2500 at grad norms
    # 1e2 -> 1e8 (healthy runs: 0.2-1.3 before the 1.0 clip) with the loss stuck at 5.5-8.7.
    - name: exploding_grad_norm
      pattern: "grad norm: [0-9]{5,}\\."
      pattern_type: regex
      match_once: true
      action:
        class_name: CancelAction
        reason: "grad norm >= 1e4 -- the run diverged"

slurm:
  sbatch:
    time: "00:40:00"
