# @package _global_
# GENERATED by scripts/korbi/campaign/gen_screen.py -- edit there.
# Round 3C: nGPT lr sweep to 4BT with a cooldown, h3 references, size s1: hidden 768 x 12 blocks, 12 heads
# of 64, d_ffn 2048 (base), datamix4, lr 0.002, gbs 128 x 4096, 1000-step warmup, then constant
# (stable only, no cooldown) to aux.tokens. Arms: one feature each; d_ffn matched per arm (per arm (param_match.json)).
defaults:
  - base_train_mn5
  - _self_

aux:
  suite: screen3c_ngpt_s1
  family: s1
  tokens: 4.0e9
  gbs: 128
  pattern: "*-*-*-*-*-*-*-*-*-*-*-*-"

backend:
  megatron:
    hidden_size: 768
    num_attention_heads: 12
    num_query_groups: 12
    kv_channels: 64
    ffn_hidden_size: 2048
    linear_num_key_heads: 12
    linear_num_value_heads: 12
    lr: 0.002
    min_lr: 0.002
    # stable only: no cooldown. Arms are compared on the stable-phase loss; at equal lr / gbs the
    # stable ranking is the cooled one (round 1: Spearman 0.98-1.00 over 4 screens of 9 arms).
    # Round-1 screens ran WSD (20 % linear cooldown to lr / 10).
    lr_decay_style: constant
    lr_wsd_decay_iters: null
    # 1000 warmup steps (the round-1 AdamW screen ran max(100, 1 %) = 100; angular MuOwn runs
    # override it to 0)
    lr_warmup_iters: 1000
    eval_interval: 500
    eval_iters: 20

job:
  array_group: ${aux.suite}
  est_step_time_s: 0.6

slurm:
  sbatch:
    time: "10:00:00"

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        # h3 (no linear XSA) in nGPT form, AdamW lr 0.004, no warmup, WSD (d_ffn 1856, non-emb 85.1M)
        - aux.arm: ngpt_lr0.004
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.num_attention_heads: 6
          backend.megatron.num_query_groups: 2
          backend.megatron.kv_channels: 128
          backend.megatron.linear_key_head_dim: 128
          backend.megatron.linear_value_head_dim: 128
          backend.megatron.linear_num_key_heads: 6
          backend.megatron.linear_num_value_heads: 6
          backend.megatron.experimental_attention_variant: complex_kda
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_gate_activation: signed_sigmoid2
          backend.megatron.linear_gate_init_style: shipped
          backend.megatron.linear_output_gate: lowrank
          backend.megatron.linear_drop_qkv_silu: true
          backend.megatron.position_embedding_type: none
          backend.megatron.attention_output_gate: true
          backend.megatron.exclusive_self_attention: true
          backend.megatron.ngpt: true
          backend.megatron.weight_normalizer: true
          backend.megatron.fused_qk_norm_rope: false
          backend.megatron.optimizer: adam
          backend.megatron.lr: 0.004
          backend.megatron.min_lr: 0.0004
          backend.megatron.lr_warmup_iters: 0
          backend.megatron.lr_decay_style: WSD
          backend.megatron.lr_wsd_decay_style: linear
          backend.megatron.lr_wsd_decay_iters: 1525
          backend.megatron.ffn_hidden_size: 1856
        # h3 (no linear XSA) in nGPT form, AdamW lr 0.008, no warmup, WSD (d_ffn 1856, non-emb 85.1M)
        - aux.arm: ngpt_lr0.008
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-
