# @package _global_
# GENERATED by scripts/korbi/campaign/gen_screen.py -- edit there.
# Round 3C: N trend at s2 (exit_interval 4000 of 4BT), size s2: hidden 1024 x 20 blocks, 16 heads
# of 64, d_ffn 2816 (base), datamix4, lr 0.002, gbs 128 x 4096, 1000-step warmup, then constant
# (stable only, no cooldown) to aux.tokens. Arms: one feature each; d_ffn matched per arm (per arm (param_match.json)).
defaults:
  - base_train_mn5
  - _self_

aux:
  suite: screen3c_s2
  family: s2
  tokens: 4.0e9
  gbs: 128
  pattern: "*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-"

backend:
  megatron:
    hidden_size: 1024
    num_attention_heads: 16
    num_query_groups: 16
    kv_channels: 64
    ffn_hidden_size: 2816
    linear_num_key_heads: 16
    linear_num_value_heads: 16
    lr: 0.002
    min_lr: 0.002
    # stable only: no cooldown. Arms are compared on the stable-phase loss; at equal lr / gbs the
    # stable ranking is the cooled one (round 1: Spearman 0.98-1.00 over 4 screens of 9 arms).
    # Round-1 screens ran WSD (20 % linear cooldown to lr / 10).
    lr_decay_style: constant
    lr_wsd_decay_iters: null
    # 1000 warmup steps (the round-1 AdamW screen ran max(100, 1 %) = 100; angular MuOwn runs
    # override it to 0)
    lr_warmup_iters: 1000
    eval_interval: 500
    eval_iters: 20

job:
  array_group: ${aux.suite}
  est_step_time_s: 1.6

slurm:
  sbatch:
    time: "10:00:00"

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        # attention + qk-norm + XSA (RoPE) (d_ffn 2816, non-emb 256.9M)
        - aux.arm: attn_ref
          backend.megatron.num_attention_heads: 8
          backend.megatron.num_query_groups: 2
          backend.megatron.kv_channels: 128
          backend.megatron.linear_key_head_dim: 128
          backend.megatron.linear_value_head_dim: 128
          backend.megatron.linear_num_key_heads: 8
          backend.megatron.linear_num_value_heads: 8
          backend.megatron.exclusive_self_attention: true
          aux.pattern: '*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-*-'
          backend.megatron.optimizer: angular_muown
          backend.megatron.lr: 0.004
          backend.megatron.min_lr: 0.004
          backend.megatron.lr_warmup_iters: 0
          backend.megatron.exit_interval: 4000
          job.est_steps: 4000
          backend.megatron.ffn_hidden_size: 2816
        # CKDA 3:1, no linear XSA (d_ffn 2624, non-emb 258.6M)
        - aux.arm: h3
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.num_attention_heads: 8
          backend.megatron.num_query_groups: 2
          backend.megatron.kv_channels: 128
          backend.megatron.linear_key_head_dim: 128
          backend.megatron.linear_value_head_dim: 128
          backend.megatron.linear_num_key_heads: 8
          backend.megatron.linear_num_value_heads: 8
          backend.megatron.experimental_attention_variant: complex_kda
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_gate_activation: signed_sigmoid2
          backend.megatron.linear_gate_init_style: shipped
          backend.megatron.linear_output_gate: lowrank
          backend.megatron.linear_drop_qkv_silu: true
          backend.megatron.position_embedding_type: none
          backend.megatron.attention_output_gate: true
          backend.megatron.exclusive_self_attention: true
          backend.megatron.optimizer: angular_muown
          backend.megatron.lr: 0.004
          backend.megatron.min_lr: 0.004
          backend.megatron.lr_warmup_iters: 0
          backend.megatron.exit_interval: 4000
          job.est_steps: 4000
          backend.megatron.ffn_hidden_size: 2624
        # h3 + mHC-4 (d_ffn 2560, non-emb 258.6M)
        - aux.arm: h3_mhc4
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.num_attention_heads: 8
          backend.megatron.num_query_groups: 2
          backend.megatron.kv_channels: 128
          backend.megatron.linear_key_head_dim: 128
          backend.megatron.linear_value_head_dim: 128
          backend.megatron.linear_num_key_heads: 8
          backend.megatron.linear_num_value_heads: 8
          backend.megatron.experimental_attention_variant: complex_kda
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_gate_activation: signed_sigmoid2
          backend.megatron.linear_gate_init_style: shipped
          backend.megatron.linear_output_gate: lowrank
          backend.megatron.linear_drop_qkv_silu: true
          backend.megatron.position_embedding_type: none
          backend.megatron.attention_output_gate: true
          backend.megatron.exclusive_self_attention: true
          backend.megatron.mhc: true
          backend.megatron.mhc_expansion_rate: 4
          backend.megatron.optimizer: angular_muown
          backend.megatron.lr: 0.004
          backend.megatron.min_lr: 0.004
          backend.megatron.lr_warmup_iters: 0
          backend.megatron.exit_interval: 4000
          job.est_steps: 4000
          backend.megatron.micro_batch_size: 4
          backend.megatron.ffn_hidden_size: 2560
        # h3 + routed residual (2 of 4) (d_ffn 2560, non-emb 255.0M)
        - aux.arm: h3_routed
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.num_attention_heads: 8
          backend.megatron.num_query_groups: 2
          backend.megatron.kv_channels: 128
          backend.megatron.linear_key_head_dim: 128
          backend.megatron.linear_value_head_dim: 128
          backend.megatron.linear_num_key_heads: 8
          backend.megatron.linear_num_value_heads: 8
          backend.megatron.experimental_attention_variant: complex_kda
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_gate_activation: signed_sigmoid2
          backend.megatron.linear_gate_init_style: shipped
          backend.megatron.linear_output_gate: lowrank
          backend.megatron.linear_drop_qkv_silu: true
          backend.megatron.position_embedding_type: none
          backend.megatron.attention_output_gate: true
          backend.megatron.exclusive_self_attention: true
          backend.megatron.mhc: true
          backend.megatron.mhc_expansion_rate: 4
          backend.megatron.cuda_graph_impl: none
          backend.megatron.mhc_routed_topk: 2
          backend.megatron.optimizer: angular_muown
          backend.megatron.lr: 0.004
          backend.megatron.min_lr: 0.004
          backend.megatron.lr_warmup_iters: 0
          backend.megatron.exit_interval: 4000
          job.est_steps: 4000
          backend.megatron.micro_batch_size: 4
          backend.megatron.ffn_hidden_size: 2560
