# @package _global_
# Reproducer of the ambitious run's expert blow-up (user 2026-10-29): the production ambitious
# config (LDM, classical Muown, lr 8.5e-4 constant, no warmup, 216 experts top-5, MoonEP) on 16
# nodes at gbs 512 x 16k with micro-batch 2 (512 = 2 x 64 GPUs x 4 micro-batches, as
# ENGRAM_STEP_GROUP): one eighth of the tokens per step. 8 nodes at micro-batch 4 ran out of GPU
# memory in the first backward (the FSDP-sharded state per GPU grows 8x at DP 32 while the 64-node
# run already uses 90 %); micro-batch 2 halves the activations / MoonEP buffers. In the main
# run the routed-expert output RMS of layers 55-73 rose from ~0.05 to 1.5-7 (steps 400-870, the
# routed share of the MoE output 0.99, grad norm 12 at 869) while the expert row norms g stayed
# within 5 % (scripts/korbi/campaign/muown_g_stats.py). Arms: the unchanged config (must
# reproduce), the post-activation norm in the routed and shared experts, and that plus a warmup.
# Own experiment group / suite: never the main run's checkpoint dir or its pool singleton.
#   scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py --no-monitor --monitor-state-dir $R/pool_state \
#       --pool $HYBRID_OUTPUT_DIR/pools/mn5_pool_p129 --config-name experiments/korbi/campaign_3b/ambrepro_mn5 \
#       job.array_group=null --yes
defaults:
  - ../production/hybrid_ambitious_64_mn5
  - _self_

aux:
  experiment_group: campaign_3b
  suite: ambrepro
  arm: base
  nodes: 16
  gbs: 512
  only: []

backend:
  env:
    ENGRAM_STEP_GROUP: "4"
  megatron:
    # 900 steps (the main run's first episode began by step ~400, the second by ~750); the
    # schedule is constant, so train_iters only fixes the data order (equal in every arm)
    micro_batch_size: 2
    exit_interval: 900
    non_persistent_save_interval: 250
    save_interval: 900
    save_retain_interval: null

job:
  name: ambrepro_${aux.arm}
  metadata:
    pool_singleton: null
    pool_priority: 10
  est_step_time_s: 30.0

sweep:
  type: product
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.arm: base
        # A + B: SwiGLU output normalized per token before the router weight and fc2, routed and
        # shared experts (no scale vector)
        - aux.arm: pan
          backend.megatron.moe_expert_post_act_norm: true
          backend.megatron.mlp_post_act_norm: true
        # A + B bounded: h / max(rms(h), 1) -- leaves normal activations unchanged, caps runaway ones
        - aux.arm: pab
          backend.megatron.moe_expert_post_act_norm: true
          backend.megatron.mlp_post_act_norm: true
          backend.megatron.post_act_norm_floor: 1.0
        # peri-LN (pre + post-norm): every sublayer output normalized (learnable gain) before it
        # enters the residual -- bounds each layer's write, not the experts inside it
        - aux.arm: periln
          backend.megatron.post_sublayer_norm: true
        # + F: 200-step linear warmup to the constant lr
        - aux.arm: pan_wu
          backend.megatron.moe_expert_post_act_norm: true
          backend.megatron.mlp_post_act_norm: true
          backend.megatron.lr_warmup_iters: 200
