# @package _global_
# GENERATED by scripts/korbi/campaign/gen_screen.py -- edit there.
# Round 5: the architecture decision on the production data setting (flag, 8k), size s1: hidden 768 x 12 blocks, 6 heads
# of 64, d_ffn 2048 (base), datamix4, lr 0.004, gbs 64 x 4096, 1000-step warmup, then constant
# (stable only, no cooldown) to aux.tokens. Arms: one feature each; d_ffn matched per arm (MoE: equal active and total by construction).
defaults:
  - base_train_mn5
  - _self_

aux:
  suite: screen5e_s1
  family: s1
  tokens: 4.0e9
  gbs: 64
  pattern: "*-*-*-*-*-*-*-*-*-*-*-*-"

backend:
  megatron:
    hidden_size: 768
    num_attention_heads: 6
    num_query_groups: 6
    kv_channels: 64
    ffn_hidden_size: 2048
    linear_num_key_heads: 6
    linear_num_value_heads: 6
    lr: 0.004
    min_lr: 0.004
    # stable only: no cooldown. Arms are compared on the stable-phase loss; at equal lr / gbs the
    # stable ranking is the cooled one (round 1: Spearman 0.98-1.00 over 4 screens of 9 arms).
    # Round-1 screens ran WSD (20 % linear cooldown to lr / 10).
    lr_decay_style: constant
    lr_wsd_decay_iters: null
    # 1000 warmup steps (the round-1 AdamW screen ran max(100, 1 %) = 100; angular MuOwn runs
    # override it to 0)
    lr_warmup_iters: 1000
    eval_interval: 500
    eval_iters: 20

job:
  array_group: ${aux.suite}
  est_step_time_s: 3.0

slurm:
  sbatch:
    time: "08:00:00"

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        # 128 experts + Engram 226M (11% of the inactive expert parameters)
        - aux.arm: h5_moe_eng11
          backend.megatron.num_attention_heads: 6
          backend.megatron.num_query_groups: 2
          backend.megatron.kv_channels: 128
          backend.megatron.linear_key_head_dim: 128
          backend.megatron.linear_value_head_dim: 128
          backend.megatron.linear_num_key_heads: 6
          backend.megatron.linear_num_value_heads: 6
          backend.megatron.experimental_attention_variant: complex_kda
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_gate_activation: signed_sigmoid2
          backend.megatron.linear_gate_init_style: shipped
          backend.megatron.linear_output_gate: lowrank
          backend.megatron.linear_drop_qkv_silu: true
          backend.megatron.position_embedding_type: none
          backend.megatron.attention_output_gate: true
          backend.megatron.exclusive_self_attention: true
          aux.pattern: LENLELELELE*ENLELELELELE*E
          backend.megatron.num_experts: 128
          backend.megatron.moe_ffn_hidden_size: 512
          backend.megatron.moe_router_topk: 3
          backend.megatron.moe_shared_expert_intermediate_size: 512
          backend.megatron.moe_grouped_gemm: true
          backend.megatron.moe_token_dispatcher_type: alltoall
