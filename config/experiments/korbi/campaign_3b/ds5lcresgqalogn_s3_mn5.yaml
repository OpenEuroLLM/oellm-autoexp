          backend.megatron.moe_permute_fusion: true
          backend.megatron.expert_model_parallel_size: 16
          backend.megatron.moe_router_load_balancing_type: aux_loss
          backend.megatron.moe_aux_loss_coeff: 0.0001
          backend.megatron.moe_per_layer_logging: true
          backend.megatron.moe_expert_viability_metrics: true
          backend.megatron.cuda_graph_modules: []
          backend.megatron.moe_router_score_function: sigmoid
          backend.megatron.moe_router_enable_expert_bias: true
          backend.megatron.moe_router_bias_update_rate: 0.001
          backend.megatron.micro_batch_size: 1
