# @package _global_
# The ambitious v2 run's step-7 loss bump (user 2026-10-31: "can we prevent this"): at gbs 4096 x 16k
# the MoE router collapses within ~6 steps -- one expert per layer at 30-60x its share, thousands
# of near-dead slots, the loss up 0.5 at step 7, imbalance (ghost / dead experts) until step ~40.
# Every production-scale arm shows it (LDM and mHC-4, QB and aux loss + expert bias): the router
# is Adam at the full lr 8.5e-4 from step 1 (no warmup), its logits sharpen faster than the
# balancers react. Fixes (user: short warmups only, <= 100 steps, Adam parameters only; the
# Muown matrices keep the full lr):
#   base     the v2 recipe unchanged
#   rwu50    router-only lr warmup, 50 steps (Megatron moe_router_lr_warmup_iters, e455e9b01)
#   awu50    every Adam parameter (router, embedding, output layer, norms, gates, Engram tables)
#            warms up over 50 steps (adam_lr_warmup_iters)
# At the ambrepro scale, which reproduces the collapse (16 nodes, gbs 512 x 16k, micro-batch 2;
# ambrepro/pan: near-dead slots 0 -> 632 at step 6, max load 27-34x): the v2 recipe (LDM, QB EMA 0.9
# + global_aux_loss 1e-5, pab, Engram [2, 3, 4] + sign hash, fp8 expert gather) at 216 experts and
# 40B of Engram tables (12,986,923 rows per head, as v2's 2/3 per order). train_iters as v2's
# sample count (512 x 1,430,504 = 4096 x 178,813): the warm shared data index and the same sample
# order in every arm; exit at step 60, no saves, no eval.
#
#   scripts/korbi/mn5_autoexp_bg.sh ambwu scripts/run_autoexp.py \
#       --config-name experiments/korbi/campaign_3b/ambwarmup_mn5 --yes
defaults:
  - ../production/hybrid_ambitious_pab_128_mn5
  - _self_

aux:
  experiment_group: campaign_3b
  suite: ambwarmup
  arm: base
  nodes: 16
  gbs: 512
  only: []

backend:
  env:
    ENGRAM_STEP_GROUP: "4"
    PYTORCH_CUDA_ALLOC_CONF: "expandable_segments:True"
  megatron:
    micro_batch_size: 2
    num_experts: 216
    engram_table_size: 12986923
    train_iters: 1430504
    exit_interval: 60
    log_interval: 1
    arch_metrics_interval: 10
    save: null
    load: null
    save_interval: null
    non_persistent_save_interval: null
    non_persistent_ckpt_type: null
    non_persistent_global_ckpt_dir: null
    async_save: false
    use_persistent_ckpt_worker: false
    eval_interval: 100000
    eval_iters: 0
    wandb_project: null
    wandb_exp_name: null

job:
  name: ambwarmup_${aux.arm}
  array_group: null
  metadata:
    pool_singleton: null
  est_step_time_s: 33.0
  est_startup_min: 15.0
  state_events:
    - name: timeout
      transition: ["RUNNING", "TIMEOUT"]
      action: {class_name: FinishAction, reason: "Job timed out"}
    - name: give_up_failed
      transition: [null, FAILED]
      action: {class_name: CancelAction, reason: "failed (test: no retry)"}
    - name: give_up_node_fail
      transition: [null, NODE_FAIL]
      action: {class_name: CancelAction, reason: "lost its node (test: no retry)"}
    - name: give_up_oom
      transition: [null, OUT_OF_MEMORY]
      action: {class_name: CancelAction, reason: "out of host memory (test: no retry)"}
  log_events: []

slurm:
  sbatch:
    account: ehpc533
    qos: acc_ehpc
    time: "01:30:00"
  env:
    WAIT_FOR_JOB_NAME: ""

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.arm: base
        - aux.arm: rwu50
          backend.megatron.moe_router_lr_warmup_iters: 50
        - aux.arm: awu50
          backend.megatron.adam_lr_warmup_iters: 50
