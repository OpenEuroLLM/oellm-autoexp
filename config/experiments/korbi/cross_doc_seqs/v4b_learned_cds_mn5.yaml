# @package _global_
# LIVE since checkpoint 51,000 (user 2026-11-22: "Go ahead with the switch at 51k in group mode"; p264.2083).
#
# The v4b main run (recall_surgery/v4b_learned_mn5, unchanged: same job name, output tree, load, data, sampler)
# with cross-document packing plans from the next checkpoint on (docs/cross_doc_seqs/README.md):
#   - packing_plan_path: the plans of cds_pipeline_mn5 (one directory per window, all loaded)
#   - boundaries group: attention / CKDA state / Engram across related documents of a plan group only
#     (docs/cross_doc_seqs/adaptation.md); switch to none at a later restart
#   - at_end exit: refuse to start on an unplanned step, save + exit at the end of the planned range
# Megatron >= 88efc4279 (packing plan + guards). Rendered Megatron arguments == v4b_learned_mn5's at the same
# commit + these three flags (checked by dry run, 2026-11-21).
#
# Switching (done 2026-11-22, docs/cross_doc_seqs/README.md): the plan is ONE window from checkpoint 51,000 to 61,000 (user 2026-11-22), so
# the run must resume from EXACTLY checkpoint 51,000 -- steps after 51,000 already trained without the plan would
# otherwise lose their documents to it. After the 51,000 save: pool_ctl cancel the running v4b entry (graceful stop
# save at 51,000 + k), set that stop save aside and point ckpt/latest_checkpointed_iteration.txt at 51000 (as at the
# 25k restart), then from a fresh snapshot: ... --pool .../mn5_pool_p264 --config-name
# experiments/korbi/cross_doc_seqs/v4b_learned_cds_mn5 ... The run refuses to start on an unplanned step and saves +
# exits at 61,000 (plan end).
defaults:
  - ../recall_surgery/v4b_learned_mn5
  - _self_

aux:
  # single windows (build_plan_global.py), contiguous 51,000 -> 236,733 (all checkplan 0 failures, 2026-11-23):
  # 51,000-61,000 q3e256; 61,000-236,733 in 18 windows of 10,000 steps (q3e128mix / q3e128, 128 dims), every one linked
  # from plan/q3e128_all. A run loads only the next windows (each plan's sample index is copied into a lookup table in
  # every rank and dataloader worker, ~28 B per planned sample: all 19 plans would be ~4.5 GB per process); move the
  # horizon forward at a restart (the run exits at the end of the planned range).
  cds_plan_root: /gpfs/projects/ehpc533/users/korbip/data/cross_doc_seqs/v4b_p2/plan
  cds_plans: ${aux.cds_plan_root}/q3e256_g51000

backend:
  megatron:
    packing_plan_path:  # horizon 51,000 -> 91,000
      - ${aux.cds_plans}
      - ${aux.cds_plan_root}/q3e128_g61000
      - ${aux.cds_plan_root}/q3e128_g71000
      - ${aux.cds_plan_root}/q3e128_g81000
    packing_plan_boundaries: group
    packing_plan_at_end: exit
    # the run's cached dataset indices in one file (cds_index_bundle_mn5, checked 2026-11-22: 3,211 indices,
    # byte-identical, datasets from the bundle == from the cache files, blend 09a2a1c4): one file per rank
    # instead of ~3,200 at the start, no rank-0-alone pass. Same data order; a missing index loads from its
    # file. Needs Megatron >= f2f6b0835.
    dataloader_index_bundle: /gpfs/scratch/ehpc533/hybrid_nucleus/data_cache_bundles/v4b_p2_09a2a1c4
