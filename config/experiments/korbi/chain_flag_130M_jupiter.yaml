# @package _global_
#
# ============================================================================
# TRAIN -> CONVERT -> FLAG EVAL, AS ONE STAGE CHAIN (130M CHECK)
# ============================================================================
# A small end-to-end check of the evaluation pipeline the 32B anneals use, with
# the production tokenizer (OELLM 256k, SentencePiece) and production data.
# EVERY allocation is a job of this config: the plan prices it, the monitor
# submits, chains and restarts it -- nothing submits jobs behind its back.
#
#   train           1 node     niccolo 130M body, Qwen3-compatible (no QKV / linear
#                              bias, tied embeddings, qk-layernorm, SwiGLU), 200 steps
#                              at GBS 32 on one dclm shard of the production mix -- a
#                              pipeline check, not a model.
#   convert         1 node     scripts/downstream_eval/convert_export.sh -- the code
#                              that produced the published 32B exports (Megatron-Bridge
#                              image, our 262144-token tokenizer, production post-
#                              processing); architecture = the train stage's current.yaml.
#                              Writes <export>/.convert_done last.
#   prepare         login node eval_checkpoints.sh flag-prepare: the eval views and the
#                   (job.local) two FLAG launchers (oellm-eval, rendered, NOT submitted).
#   eval            1 node per ONE SLURM ARRAY (job.array_group), one task per eval
#                   eval       (config/eval_tasks/flag_evals.yaml: 365 vLLM + 73 lighteval
#                              items). Each task runs one row of the rendered launcher
#                              (jupiter_flag_evals.sh run-one) in its own allocation. A
#                              failed task is resubmitted once, alone (job/array_task.yaml);
#                              a row that already succeeded is skipped (finish_condition
#                              on its done marker), so relaunching this config only runs
#                              what is missing.
#   collect         login node when every eval task is finished or given up (monitor-side
#                   (job.local) JobsFinishedCondition): eval_checkpoints.sh flag-collect ->
#                              $FLAG_WORK/results/NAME.flag-evals-438.tasks.csv.
#
# THIS CHECK RUNS A SUBSET: aux.flag_select (a few generative and log-likelihood evals per
# half, by name). `aux.flag_select=null` runs all 438 (~60 node-hours for a 32B, far less
# at 130M).
#
# The task list is generated, per oellm-eval revision, by
#   submodules/oellm-eval/scripts/jupiter_flag_evals.sh tasks config/eval_tasks/flag_evals.yaml
# (run-one refuses a row whose task differs, so a stale list fails loudly).
#
# NOTHING TO INSTALL: the oellm tool runs from submodules/oellm-eval on the vLLM eval image's
# Python. ONCE PER USER: FLAG_WORK/hf_home must hold the eval datasets (see the oellm-eval
# flag-evals README; copy missing ones from production_training/downstream_eval_32b/hf_home_suite).
# The conversion reuses the prepared tokenizer/ and bridge/ under aux.downstream_work_root
# (`scripts/downstream_eval/eval_checkpoints.sh prepare` made them for the 32B exports).
#
#   PYTHONPATH=. python scripts/run_autoexp.py --config-name experiments/korbi/chain_flag_130M_jupiter --dry-run
#
# Afterwards (login node):
#   MODEL=32b_dense scripts/downstream_eval/eval_checkpoints.sh flag-status flagchain130M_200
# ============================================================================

defaults:
  - megatron_niccolo_130M_smoke_jupiter
  - /eval_tasks@aux.flag_suite: flag_evals
  - _self_

aux:
  experiment_group: "flag_chain_130M"
  train_iters: 200
  gbs: 32
  # Paths shared by the stages (each stage gets its own backend, so they live here).
  repo: ${oc.env:OELLM_AUTOEXP_ROOT,${oc.env:PWD}}
  train_dir: ${oc.env:OUTPUT_DIR,./output}/${aux.experiment_group}/flagchain130M_train
  export_name: "flagchain130M_${aux.train_iters}"
  export_root: ${oc.env:OUTPUT_DIR,./output}/${aux.experiment_group}/hf
  # Must share a filesystem with export_root: the eval views hard-link the weights.
  flag_work: /e/scratch/e-sta-openeurollm/${oc.env:USER}/flag-evals
  downstream_work_root: /e/scratch/e-sta-openeurollm/production_training/downstream_eval_32b
  bridge_sif: /e/project1/e-sta-openeurollm/container/MegatronTraining-JUPITER-bridge-bridge_aarch64_202605191331.sif
  flag_share: /e/project1/e-sta-openeurollm/vanosch1/v1-vs-v2/anneal
  # The evals to run, by name (config/eval_tasks/flag_evals.yaml: half/task/n_shot); null =
  # all 438. Names, not positions, so the subset survives a regenerated task list.
  #   vLLM: AMC23, bigbench dyck, ifeval, HumanEval, gsm8k, MATH500, mbpp, commonsense_qa,
  #   arc_easy; lighteval: five FLORES directions
  flag_select:
    - "vllm/AMC23/0"
    - "vllm/bigbench_dyck_languages_generate_until/10"
    - "vllm/ifeval/0"
    - "vllm/HumanEval/0"
    - "vllm/gsm8k/4"
    - "vllm/MATH500/0"
    - "vllm/mbpp/3"
    - "vllm/commonsense_qa/10"
    - "vllm/arc_easy/10"
    - "lighteval/flores200:eng_Latn-nld_Latn/4"
    - "lighteval/flores200:mkd_Cyrl-eng_Latn/4"
    - "lighteval/flores200:glg_Latn-eng_Latn/4"
    - "lighteval/flores200:eng_Latn-lit_Latn/4"
    - "lighteval/flores200:pol_Latn-eng_Latn/4"
  flag_indices: ${oc.select_indices:${aux.flag_suite.tasks},name,${aux.flag_select}}
  oellm_eval: ${aux.repo}/submodules/oellm-eval
  # One eval, for the eval-stage point that sets flag_i (a position in flag_suite.tasks).
  # Defined HERE, outside the sweep, because only the base config is re-resolved per point;
  # the stage references these escaped (\${...}).
  flag_i: 0
  flag_half: ${oc.index:${aux.flag_suite.tasks},${aux.flag_i},half}
  flag_row: ${oc.index:${aux.flag_suite.tasks},${aux.flag_i},row}
  flag_task: ${oc.index:${aux.flag_suite.tasks},${aux.flag_i},task}
  flag_done: ${aux.flag_work}/runs/${aux.export_name}/${aux.flag_half}/done/${aux.flag_row}.ok
  flag_run_one: "${aux.oellm_eval}/scripts/jupiter_flag_evals.sh run-one ${aux.export_name} ${aux.flag_half} ${aux.flag_row} \"${aux.flag_task}\""
  shard: /e/data1/datasets/playground/mmlaion/oellm/flag_training_complete/dclm-1.0/megatron-lm/01_0_0000_text_document

container:
  image: /e/project1/e-sta-openeurollm/container/nemo_26.04.sif

backend:
  megatron:
    # Production tokenizer and vocabulary (the 32B runs: HuggingFaceTokenizer on the
    # SentencePiece dir, padded to 262144 rows).
    tokenizer_type: HuggingFaceTokenizer
    tokenizer_model: /e/data1/datasets/playground/mmlaion/oellm/oellm_tokenizer_256k
    padded_vocab_size: 262144
    # The 262k vocabulary makes the logits the memory peak: niccolo's micro batch 16 needs
    # 16 * 4096 * 262144 * 4 B = 64 GiB for them alone (OOM, job 2161246). 2 -> 8 GiB;
    # the global batch stays 128 through gradient accumulation.
    micro_batch_size: 2
    # Qwen3 layout, so Megatron-Bridge's Qwen3 mapping covers every tensor.
    add_qkv_bias: false
    add_bias_linear: false
    train_data_path: ["${aux.shard}"]
    valid_data_path: ["${aux.shard}"]
    data_path: []
    split: null
    data_cache_path: ${oc.env:OUTPUT_DIR,./output}/${aux.experiment_group}/data_cache
    # Short schedule that stays valid: warmup < WSD decay (0.2 * train_iters = 40).
    train_iters: ${aux.train_iters}
    lr_warmup_iters: 10
    save_interval: ${aux.train_iters}
    eval_interval: ${aux.train_iters}
    eval_iters: 10
    wandb_project: flag_chain_130M

job:
  chain_repeat: 1
  est_step_time_s: 0.7
  est_startup_min: 8
  est_steps: ${aux.train_iters}

slurm:
  sbatch:
    # Pinned: the default ${oc.env:SLURM_ACCOUNT,...} follows whatever the login shell exports.
    account: e-sta-openeurollm
    nodes: 1
    time: "00:45:00"

sweep:
  type: list
  store_sweep_json: true
  groups:
    - type: list
      configs:
        # ====== train =========================================================
        - stage: train
          job.name: "flagchain130M_train"

        # ====== convert (Megatron -> HF, production export code) ==============
        # Bash stages: no single quotes, no shell ${VAR} (OmegaConf); $VAR is fine.
        - stage: convert
          backend: bash
          slurm: jupiter_driver
          job.name: "flagchain130M_convert"
          job.est_steps: 1
          job.est_step_time_s: 1200
          job.start_condition:
            class_name: FileExistsCondition
            path: "${aux.train_dir}/${oc.pad_iter:${aux.train_iters}}/.metadata"
          backend.env:
            WORK_ROOT: ${aux.downstream_work_root}
            EXPORT_ROOT: ${aux.export_root}
            BRIDGE_SIF: ${aux.bridge_sif}
            MEGATRON_REPO: ${aux.repo}
            HF_MODEL: "Qwen/Qwen3-0.6B"
            DERIVE_HF_ARCH: "qwen3"
            CONTAINER_BIND: "/e"
          backend.command: |
            set -eu
            mkdir -p ${aux.export_root}
            ${aux.repo}/scripts/downstream_eval/convert_export.sh ${aux.export_name} ${aux.train_dir}/${oc.pad_iter:${aux.train_iters}} ${aux.train_dir}/current.yaml
          slurm.sbatch.time: "00:45:00"

        # ====== FLAG launchers for the export (login node: views + render, no submission)
        - stage: prepare
          backend: bash
          job.local: true
          job.name: "flagchain130M_prepare"
          job.est_steps: 1
          job.est_step_time_s: 120
          job.start_condition:
            class_name: FileExistsCondition
            path: "${aux.export_root}/${aux.export_name}/.convert_done"
          backend.env:
            MODEL: "32b_dense"   # site/model profile of scripts/downstream_eval (paths, images)
            EXPORT_ROOT: ${aux.export_root}
            FLAG_WORK: ${aux.flag_work}
            FLAG_ACCOUNT: "e-sta-openeurollm"
            # recorded in the state file, so flag-collect reports a subset run as such
            FLAG_SUBSET: ${oc.if:${oc.eq:${oc.len:${aux.flag_indices}},${aux.flag_suite.count}},"","1"}
            # A checkout without git metadata (e.g. an rsynced test clone) cannot prove the
            # oellm-eval pin; launch with ALLOW_EVAL_REV_MISMATCH=1 there.
            ALLOW_EVAL_REV_MISMATCH: ${oc.env:ALLOW_EVAL_REV_MISMATCH,"0"}
          backend.command: |
            set -eu
            ${aux.repo}/scripts/downstream_eval/eval_checkpoints.sh flag-prepare ${aux.export_name}

        # ====== FLAG evals: ONE SLURM array, one task (and monitor record) per eval
        # A `params` leaf whose `defaults` carry the stage settings: one point per selected
        # eval. (A product of a configs group and a params group, nested in this list,
        # expands the same points but trips the sweep filter's group-path matching.)
        # Per-eval values are escaped (\${...}): they resolve per point, from aux.flag_*.
        - params:
            aux.flag_i: ${aux.flag_indices}
          defaults:
            stage: eval
            backend: bash
            slurm: jupiter_driver
            job: array_task
            job.name: "flagchain130M_eval"
            job.array_group: "flagchain130M_eval"
            job.est_steps: 1
            job.est_step_time_s: 300
            job.est_startup_min: 1
            job.start_condition:
              class_name: FileExistsCondition
              path: "${aux.flag_work}/state/${aux.export_name}.env"
            job.finish_condition:
              class_name: FileExistsCondition
              path: "\\${aux.flag_done}"
            backend.env:
              FLAG_WORK: ${aux.flag_work}
            backend.command: "\\${aux.flag_run_one}"
            slurm.array_concurrency: 40
            slurm.sbatch.time: "01:30:00"

        # ====== collect (login node), once every eval task has finished or been given up
        - stage: collect
          backend: bash
          job.local: true
          job.name: "flagchain130M_collect"
          job.est_steps: 1
          job.est_step_time_s: 120
          job.start_condition:
            class_name: JobsFinishedCondition
            array_groups: ["flagchain130M_eval"]
          backend.env:
            MODEL: "32b_dense"
            EXPORT_ROOT: ${aux.export_root}
            FLAG_WORK: ${aux.flag_work}
          backend.command: |
            set -eu
            ${aux.repo}/scripts/downstream_eval/eval_checkpoints.sh flag-collect ${aux.export_name}
