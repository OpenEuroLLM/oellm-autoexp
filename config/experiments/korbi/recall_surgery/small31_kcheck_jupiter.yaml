# @package _global_
# One-node check of the additive kvshare export ("ckda_kvshare", docs/recall_surgery_ambitious.md §14.8 arm K):
# scripts/korbi/recall_surgery/k_export_check.sh (K@38146 valid loss = b7@38146's; prefill = cached decode with a
# synthetic branch weight), in the readout image / environment.
defaults:
  - small31_readout_jupiter
  - _self_

aux:
  arm: K
  step: 38146

backend:
  command: bash scripts/korbi/recall_surgery/k_export_check.sh

job:
  name: s31check_${aux.arm}_${aux.step}
  base_output_dir: ${aux.root}/readout_logs/check_${aux.arm}_${aux.step}
  metadata:
    pool_priority: 50
  start_condition: null

sweep:
  type: product
  store_sweep_json: true
  groups:
    - type: list
      configs:
        - aux.arm: K
          aux.step: 38146
