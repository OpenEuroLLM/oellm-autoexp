# @package _global_
# K-style intervention on the latest ambitious main run, JUPITER (docs/recall_surgery_ambitious.md §14.8 K;
# user 2026-11-15: "prepare everything to then capture and run on the next one at 2 am").
#
# From the main run's 35900 rolling save, add ADDITIVE kvshare attention branches to the six 3:1 positions
# 9 / 25 / 41 / 58 / 74 / 90, reading keys / values from attention 0 / 17 / 33 / 50 / 66 / 82. q / gate / o /
# q-norm are copied from the source, the input-norm gain is folded, gamma starts at 0, complex_kda stays at full
# weight (alpha_end 1.0, no crossfade, no calibration). No extra KV cache at inference. This is the small31 K arm
# (the only strict loss-improving stitch; recall trending up at +5.5 BT) at 84B.
#
# Four paired 128-node arms on the captured 516-node host (512 nodes, 4 spare):
#   K      the intervention, no rest dropout
#   ctrl   the same continuation without branches (the paired control)
#   Kd01   K with ckda_branch_rest_dropout 0.1 (a light forcing signal)
#   DK03   K with rest dropout 0.3 (the small31 DK1 recipe that gave the largest dropout-trained recall gains)
# Same batches for every arm (the main run's reference-layout sampler; 128 nodes x mbs 2 = 256 nodes x mbs 1).
# 1000 steps = 67.1 BT, ~1.7 % of the main run's tokens; readouts at +500 (36400) and +1000 (36900).
#
# Saves go to e-ext scratch (31 TB free; fscratch is at 99 %). Loads stay on fscratch (main run root / surgery).
# First run on the existing small16 hosts: aux.only=[smoke_K] (16 nodes, 5 steps, save at 35905) to verify the
# container, memory, branch gradients and the gamma-0 exactness against the main run's 35901-35905 losses.
defaults:
  - ../production/hybrid_ambitious_v4_2ph_hd256_p2_jupiter
  - _self_

aux:
  suite: kvshare_main
  arm: K
  only: [K, ctrl, Kd01, DK03]
  start: 35900
  steps: 1000
  nodes: 128
  phase: 2
  seq: 65536
  gbs: 1024
  kv_root: /e/scratch/e-ext-2025e02-108/poeppel1/ambitious_kvshare
  surgery_root: ${aux.kv_root}/surgery
  run_root: ${aux.kv_root}/runs
  main_root: ${aux.run_root}
  load_main: /e/fscratch/e-sta-openeurollm/poeppel1/ambitious84/runs/main_v4_jsc/ckpt
  load_tracker: /e/fscratch/e-sta-openeurollm/poeppel1/ambitious84/runs/main_v4_jsc/ckpt_rolling/latest_checkpointed_iteration.txt
  load_surgery: ${aux.surgery_root}/DK1/ckpt
  load_surgery_tracker: ${aux.surgery_root}/DK1/ckpt/latest_checkpointed_iteration.txt
  layers: [9, 25, 41, 58, 74, 90]
  sources: [0, 17, 33, 50, 66, 82]

backend:
  megatron:
    load: ${aux.load_surgery}
    save: ${job.base_output_dir}/ckpt
    non_persistent_global_ckpt_dir: ${job.base_output_dir}/ckpt_rolling
    tensorboard_dir: ${job.base_output_dir}/tb
    wandb_save_dir: ${job.base_output_dir}/wandb
    micro_batch_size: 2
    exit_interval: 36900
    save_interval: 200
    non_persistent_save_interval: 200
    save_extra_steps: [36400, 36900]
    check_for_nan_in_loss_and_grad: true
    ckda_branch_calibrate: false

job:
  name: amb84_jsc_${aux.arm}
  base_output_dir: ${aux.run_root}/${aux.arm}
  est_steps: 1000
  est_step_time_s: 12.0
  start_condition:
    class_name: AndCondition
    conditions:
      - class_name: FileContentCondition
        path: ${aux.load_surgery_tracker}
        pattern: "^\\s*35900\\s*$"
        mode: regex
        persistent_pass: true
      - class_name: ShellCommandCondition
        command: bash scripts/korbi/recall_surgery/jsc_quota_check.sh ${job.base_output_dir} ${aux.save_free_tb}
  metadata:
    pool_singleton: null
    pool_priority: 80

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.arm: K
          job.base_output_dir: ${aux.run_root}/K
          backend.megatron.ckda_branch: kvshare
          backend.megatron.ckda_branch_layers: ${aux.layers}
          backend.megatron.ckda_branch_kv_source_layers: ${aux.sources}
          backend.megatron.ckda_branch_num_query_groups: 2
          backend.megatron.ckda_branch_start_iteration: ${aux.start}
          backend.megatron.ckda_branch_crossfade: false
          backend.megatron.ckda_branch_alpha_hold: 0
          backend.megatron.ckda_branch_alpha_ramp: 0
          backend.megatron.ckda_branch_alpha_end: 1.0
          backend.megatron.ckda_branch_m_start: 1.0
          backend.megatron.ckda_branch_m_ramp: 0
          backend.megatron.ckda_branch_gamma_scale: 1.0
          backend.megatron.ckda_branch_rest_dropout: 0.0
        - aux.arm: ctrl
          job.base_output_dir: ${aux.run_root}/ctrl
          job.start_condition:
            class_name: AndCondition
            conditions:
              - class_name: FileContentCondition
                path: ${aux.load_tracker}
                pattern: "^\\s*35900\\s*$"
                mode: regex
                persistent_pass: true
              - class_name: ShellCommandCondition
                command: bash scripts/korbi/recall_surgery/jsc_quota_check.sh ${job.base_output_dir} ${aux.save_free_tb}
          backend.megatron.load: ${aux.load_main}
          backend.megatron.ckda_branch: null
          backend.megatron.ckda_branch_layers: null
          backend.megatron.ckda_branch_kv_source_layers: null
          backend.megatron.ckda_branch_crossfade: false
          backend.megatron.ckda_branch_rest_dropout: 0.0
        - aux.arm: Kd01
          job.base_output_dir: ${aux.run_root}/Kd01
          backend.megatron.ckda_branch: kvshare
          backend.megatron.ckda_branch_layers: ${aux.layers}
          backend.megatron.ckda_branch_kv_source_layers: ${aux.sources}
          backend.megatron.ckda_branch_num_query_groups: 2
          backend.megatron.ckda_branch_start_iteration: ${aux.start}
          backend.megatron.ckda_branch_crossfade: false
          backend.megatron.ckda_branch_alpha_hold: 0
          backend.megatron.ckda_branch_alpha_ramp: 0
          backend.megatron.ckda_branch_alpha_end: 1.0
          backend.megatron.ckda_branch_m_start: 1.0
          backend.megatron.ckda_branch_m_ramp: 0
          backend.megatron.ckda_branch_gamma_scale: 1.0
          backend.megatron.ckda_branch_rest_dropout: 0.1
        - aux.arm: DK03
          job.base_output_dir: ${aux.run_root}/DK03
          backend.megatron.ckda_branch: kvshare
          backend.megatron.ckda_branch_layers: ${aux.layers}
          backend.megatron.ckda_branch_kv_source_layers: ${aux.sources}
          backend.megatron.ckda_branch_num_query_groups: 2
          backend.megatron.ckda_branch_start_iteration: ${aux.start}
          backend.megatron.ckda_branch_crossfade: false
          backend.megatron.ckda_branch_alpha_hold: 0
          backend.megatron.ckda_branch_alpha_ramp: 0
          backend.megatron.ckda_branch_alpha_end: 1.0
          backend.megatron.ckda_branch_m_start: 1.0
          backend.megatron.ckda_branch_m_ramp: 0
          backend.megatron.ckda_branch_gamma_scale: 1.0
          backend.megatron.ckda_branch_rest_dropout: 0.3
        - aux.arm: smoke_K
          aux.nodes: 16
          aux.steps: 5
          job.name: amb84_jsc_smoke_K
          job.base_output_dir: ${aux.run_root}/smoke_K
          job.est_steps: 5
          job.metadata.pool_priority: 5
          backend.megatron.micro_batch_size: 1
          backend.megatron.exit_interval: 35905
          backend.megatron.save_interval: 100
          backend.megatron.non_persistent_save_interval: null
          backend.megatron.save_extra_steps: [35905]
          backend.megatron.ckda_branch: kvshare
          backend.megatron.ckda_branch_layers: ${aux.layers}
          backend.megatron.ckda_branch_kv_source_layers: ${aux.sources}
          backend.megatron.ckda_branch_num_query_groups: 2
          backend.megatron.ckda_branch_start_iteration: ${aux.start}
          backend.megatron.ckda_branch_crossfade: false
          backend.megatron.ckda_branch_alpha_hold: 0
          backend.megatron.ckda_branch_alpha_ramp: 0
          backend.megatron.ckda_branch_alpha_end: 1.0
          backend.megatron.ckda_branch_m_start: 1.0
          backend.megatron.ckda_branch_m_ramp: 0
          backend.megatron.ckda_branch_gamma_scale: 1.0
          backend.megatron.ckda_branch_rest_dropout: 0.0
