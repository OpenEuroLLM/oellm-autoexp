# @package _global_
# v4c: v4b's copy-init V layers, but the branch is brought in by a SHORT schedule ramp instead of
# the two learnable gates.
#
# Why: measured on the v4b loss curve (docs/recall_surgery_ambitious.md §22.21), the learnable gates
# move at Adam's scalar step, lr = 8.5e-4, so g_v ~ 0.085 at 35999, ~0.42 at 36400 and ~0.85 at
# 36900 -- i.e. the branch is still a near-duplicate inside every window we can afford to observe.
# A 100-step ramp reaches full branch weight by 36000, and the copied matrices get gradient
# proportional to r while it opens, so they can differentiate from the copy instead of staying one.
#
# Identical to v4b_learned except the gate:
#   streams' = streams + r(t) * (mhc_write(...) - streams),  r = clamp((t - 35900) / 100, 0, 1)
# At 35900 r = 0 -> bit-exact parent (same as v4b). From 36000 r = 1 -> the branch writes whole.
#
# Checkpoint: the copy-init surgery of the same 35900 save (v4b_src), so q / gate / o / q-norm are
# copies of source attention 0/18/35/53/70/87 and the layer is a working attention, not noise.
#
# EVAL DISCIPLINE: do not export a checkpoint inside [35900, 36000) -- the export refuses the ramp
# window anyway (hf_export, commit 23f7e16c). Export at >= 36000.
defaults:
  - v4b_learned_mn5
  - _self_

backend:
  megatron:
    # Resume from this arm's OWN output tree, not from the surgery source. The source is only
    # needed for the very first step into the tree (it is already copied in at 35905). With
    # --load on the output tree, a requeue or preempt resumes at the newest checkpoint the arm
    # wrote (35990 with the extra step below) instead of replaying from 35900: Megatron loads
    # --load as given and does not prefer the save dir on its own, which is why a load on
    # v4c_src/ckpt restarted at 35901 even though 35905 existed here.
    load: ${aux.kv_root}/runs/v4c_ramp/main/ckpt
    # the learnable gates are mutually exclusive with the ramp; the copy-init checkpoint has no gate
    # parameters, which is exactly what this variant builds
    v_block_learnable_gate: false
    v_block_gate_ramp: 100
    v_block_gate_start_iteration: 35900
    # 35990 is the stop point: a save just before the 36000 boundary, so a preempt there costs
    # nothing and the restart resumes at 35990. 36000 and 36100: the first checkpoints with the
    # branch at full weight, and the first the exporter accepts (it refuses [35900, 36000)).
    #
    # NO 35999. Measured 2026-11-18: a save at 35999 followed one step later by a save at 36000
    # doubles the resident state-dict copy (reserved 10.3 -> 22.5 GB per rank, host RSS 70.7 GB
    # per rank, four ranks per node) and the node OOM-killer SIGKILLs a rank (`exitcode: -9`) at
    # 36000 -- that killed runs .1580, .1584 and .1592. v4b passes 36000 with a single save at
    # 35999; v4c keeps the one at 36000 because only that checkpoint is exportable.
    # 36992: the iteration `.1630` had reached when node as02r3b11 failed at 15:37 on 2026-11-18.
    # A node failure kills the ranks without a graceful shutdown, so no checkpoint was written
    # there and the restart would replay 36901..36992 (~30 min). Saving 36992 makes the replay
    # pay once instead of on every future restart.
    save_extra_steps: [35905, 35990, 36000, 36100, 36400, 36900, 36992]
    non_persistent_save_interval: 100
    # Arch metrics every 100 steps (user's choice; v4b samples at 500). Interval 1 was needed to
    # watch the ramp open,
    # but after 36000 the gate is dropped (`_v_block_gate` returns None) so `vgate/r` and
    # `vgate/delta` are no longer recorded at all -- measured 2026-11-18: 0 vgate lines after
    # 36000. What interval 1 still costs is the eager mHC path on every step: 21.25 s/step vs
    # 19.45 s/step with metrics off, +9.2 %. The ramp itself is already captured (vgate/r
    # 0.05 -> 0.99 across 35906..35999).
    arch_metrics_interval: 100

job:
  name: ambitious_v4c_ramp_256
  base_output_dir: ${aux.kv_root}/runs/v4c_ramp/main
  metadata:
    pool_priority: 100

aux:
  # No pre-training node bench for this arm (v4b runs with it off too). The allocation is 260 live
  # nodes and the hardware exclusions already leave exactly 256, so every "light" (slow matmul)
  # node the bench excludes makes the run impossible: 2026-11-18 the bench excluded as01r1b11,
  # then as04r3b26, and each time the next submission died with `insufficient_nodes`. Slow nodes
  # cost ~2.5 % of step time, which is cheaper than not running. Real hardware faults are still
  # excluded by hand and by the guard that follows Slurm's own node removals.
  node_check: "off"

# What this variant does NOT fix, and what it would cost (code, not config):
#   - it forces the branch open (no self-regulation): if the duplicate hurts, rho/g_v cannot close it;
#   - the copied q stays an exact duplicate unless the copied matrices are given their own LR
#     multiplier (v_branch_lr_mult) or the init gets noise -- both are small code changes:
#       * mark out_gate / res_gate and the V attention params with their own ParamKey attr, add
#         v_gate_lr_mult / v_branch_lr_mult to OptimizerConfig + get_param_groups (the engram tables
#         already use that mechanism);
#       * insert_v_layers.py --init copy --noise <rel> for the q rows.
# The cheap alternative that needs neither: keep this ramp and let the matrices differentiate at the
# base LR, accepting that the first ~1000 steps are the only budget we observe.
