# @package _global_
# v4c: v4b's copy-init V layers, but the branch is brought in by a SHORT schedule ramp instead of
# the two learnable gates.
#
# Why: measured on the v4b loss curve (docs/recall_surgery_ambitious.md §22.21), the learnable gates
# move at Adam's scalar step, lr = 8.5e-4, so g_v ~ 0.085 at 35999, ~0.42 at 36400 and ~0.85 at
# 36900 -- i.e. the branch is still a near-duplicate inside every window we can afford to observe.
# A 100-step ramp reaches full branch weight by 36000, and the copied matrices get gradient
# proportional to r while it opens, so they can differentiate from the copy instead of staying one.
#
# Identical to v4b_learned except the gate:
#   streams' = streams + r(t) * (mhc_write(...) - streams),  r = clamp((t - 35900) / 100, 0, 1)
# At 35900 r = 0 -> bit-exact parent (same as v4b). From 36000 r = 1 -> the branch writes whole.
#
# Checkpoint: the copy-init surgery of the same 35900 save (v4b_src), so q / gate / o / q-norm are
# copies of source attention 0/18/35/53/70/87 and the layer is a working attention, not noise.
#
# EVAL DISCIPLINE: do not export a checkpoint inside [35900, 36000) -- the export refuses the ramp
# window anyway (hf_export, commit 23f7e16c). Export at >= 36000.
defaults:
  - v4b_learned_mn5
  - _self_

backend:
  megatron:
    # the learnable gates are mutually exclusive with the ramp; the copy-init checkpoint has no gate
    # parameters, which is exactly what this variant builds
    v_block_learnable_gate: false
    v_block_gate_ramp: 100
    v_block_gate_start_iteration: 35900
    # 36000 and 36100 on top of v4b's steps: the first checkpoints with the branch at full weight
    save_extra_steps: [35905, 35999, 36000, 36100, 36400, 36900]
    non_persistent_save_interval: 100

job:
  name: ambitious_v4c_ramp_256
  base_output_dir: ${aux.kv_root}/runs/v4c_ramp/main
  metadata:
    pool_priority: 100

# What this variant does NOT fix, and what it would cost (code, not config):
#   - it forces the branch open (no self-regulation): if the duplicate hurts, rho/g_v cannot close it;
#   - the copied q stays an exact duplicate unless the copied matrices are given their own LR
#     multiplier (v_branch_lr_mult) or the init gets noise -- both are small code changes:
#       * mark out_gate / res_gate and the V attention params with their own ParamKey attr, add
#         v_gate_lr_mult / v_branch_lr_mult to OptimizerConfig + get_param_groups (the engram tables
#         already use that mechanism);
#       * insert_v_layers.py --init copy --noise <rel> for the q rows.
# The cheap alternative that needs neither: keep this ramp and let the matrices differentiate at the
# base LR, accepting that the first ~1000 steps are the only budget we observe.
