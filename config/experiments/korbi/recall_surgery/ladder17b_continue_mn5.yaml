# @package _global_
# Recall surgery, small-scale testbed (docs/recall_surgery_ambitious.md, section 8): continue a NATIVE 1.7B ladder
# checkpoint at the stable-phase end (signed_kda's megatron_ladder_medium/ckpt/<model>_1.7B_gbs128/iter_0076295,
# ~40 BT, WSD lr 5e-4 constant, gbs 128 x 4096) in the original codebase (experiment 018's copy: native Megatron +
# lm_scaling.megatron_ext.specs.arm_spec + fla), on MN5's NeoX-tokenized Nemotron 318BT sample (a different sample
# than JUPITER's; tokenizer identical). scripts/korbi/recall_surgery/ladder17b_train.sh does the work, one torchrun
# per node.
#
# Two controls (paired baselines):
#   ctrl_resume  optimizer + scheduler + iteration from the checkpoint: the stable continuation (loss continuity)
#   ctrl_fresh   weights only, fresh Adam, linear warmup 100 iters to 5e-4, then constant (iteration 0): the paired
#                baseline of every intervention arm (same data order, same batch layout as the arms)
# Intervention arms: aux.load_mode: model_only, aux.src: the surgery output (ladder17b_surgery_mn5: a model-only copy
# WITH the arm's new tensors, so the native strict loader needs no change), aux.intervention (SKDA_INTERVENTION, read
# by the patched megatron_ext) and aux.code_dir (native_patch/make_code_dir.sh: lm_scaling/ shadows the base; the
# native Megatron is the full bb5febb82 tree unless the dir has a complete one). Should a checkpoint lack keys the
# model has, the native torch-format loader retries non-strict when a strict load raises (prints load_return).
#
#   cd $R/autoexp_<snapshot> && scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py --no-monitor \
#       --monitor-state-dir $R/pool_state --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/mn5_pool_o134c \
#       --config-name experiments/korbi/recall_surgery/ladder17b_continue_mn5 --yes "aux.only=[ctrl_resume]" aux.steps=100
defaults:
  - ../hybrid_speed/kernel_tests_mn5
  - _self_

aux:
  name: ladder17b_${aux.model}_${aux.arm}
  arm: ctrl_resume
  only: []
  # the native model and its ffn size (hybrid 7936, pure CKDA 8064, attn 8192, as the ladder's param matching)
  model: skda-shipped-hybrid-lowrank
  ffn: 7936
  load_mode: resume
  intervention: ""
  base_code_dir: /gpfs/projects/ehpc533/users/korbip/ckda_retrieval_018/source
  code_dir: ${aux.base_code_dir}
  root: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery
  # the checkpoint the run starts from: the native stable end (controls) or a surgery output (intervention arms)
  src: ${aux.root}/ladder17b_native/${aux.model}
  steps: 1000
  gbs: 128
  # micro-batch 1 for the arms and their paired controls: six extra MHA branches at mbs 2 x 4096 OOM at the loss
  # (logits.float(), 61.9 of 63.3 GiB; smoke o134c 1630). Same global batch = same data order; ctrl_resume keeps the
  # original run's mbs 2 (the continuity check).
  mbs: 1
  lr: 0.0005
  warmup: 100
  save_interval: 500
  log_interval: 10
  extra_args: ""
  # decay probe (dec_* arms): anneal over the last `decay` steps; resume_warmup = the source run's warmup
  decay: 0
  resume_warmup: 2000
  nodes: 1
  tests: ""
  bench: ""

backend:
  command: bash scripts/korbi/recall_surgery/ladder17b_train.sh
  env:
    SKDA_ARM: ${aux.model}
    SKDA_INTERVENTION: ${aux.intervention}
    BASE_CODE_DIR: ${aux.base_code_dir}
    CODE_DIR: ${aux.code_dir}
    SRC_CKPT: ${aux.src}
    SAVE_DIR: ${aux.root}/ladder17b_runs/${aux.model}/${aux.arm}/ckpt
    LOAD_MODE: ${aux.load_mode}
    STEPS: ${aux.steps}
    GBS: ${aux.gbs}
    MBS: ${aux.mbs}
    LR: ${aux.lr}
    WARMUP: ${aux.warmup}
    FFN: ${aux.ffn}
    SAVE_INTERVAL: ${aux.save_interval}
    LOG_INTERVAL: ${aux.log_interval}
    EXTRA_ARGS: ${aux.extra_args}
    DECAY: ${aux.decay}
    RESUME_WARMUP: ${aux.resume_warmup}

job:
  name: ladder17b_${aux.model}_${aux.arm}
  base_output_dir: ${aux.root}/ladder17b_runs/${aux.model}/${aux.arm}
  est_steps: ${aux.steps}
  est_step_time_s: 6.0
  metadata:
    pool_priority: 70

slurm:
  sbatch:
    nodes: ${aux.nodes}
    time: "04:00:00"
    # the o134c host: account cns144, qos acc_xehpc
    account: cns144
    qos: acc_xehpc

sweep:
  type: product
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        # controls on the hybrid stable end, straight from the native checkpoint
        - aux.arm: ctrl_resume
          aux.load_mode: resume
          aux.mbs: 2
        - aux.arm: ctrl_fresh
          aux.load_mode: model_only
        # surgery arms (ladder17b_surgery_mn5 writes ladder17b_surgery/<arm>; literals: sweep entries resolve
        # interpolations against the base config). Pure CKDA stable end (skda-shipped-lowrank, ffn 8064):
        - aux.arm: pure_ctrl_fresh
          aux.model: skda-shipped-lowrank
          aux.ffn: 8064
          aux.load_mode: model_only
          aux.code_dir: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/code/v1
          aux.intervention: ""
          aux.src: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/ladder17b_surgery/pure_ctrl_fresh
        - aux.arm: pure_add_every4
          aux.model: skda-shipped-lowrank
          aux.ffn: 8064
          aux.load_mode: model_only
          aux.code_dir: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/code/v1
          aux.intervention: add_attn@every4
          aux.src: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/ladder17b_surgery/pure_add_every4
        - aux.arm: pure_add_every4_rope
          aux.model: skda-shipped-lowrank
          aux.ffn: 8064
          aux.load_mode: model_only
          aux.code_dir: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/code/v1
          aux.intervention: add_attn@every4+add_rope
          aux.src: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/ladder17b_surgery/pure_add_every4_rope
        # hybrid stable end (skda-shipped-hybrid-lowrank, ffn 7936)
        - aux.arm: hybrid_ctrl_fresh
          aux.load_mode: model_only
          aux.code_dir: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/code/v1
          aux.intervention: ""
          aux.src: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/ladder17b_surgery/hybrid_ctrl_fresh
        - aux.arm: hybrid_add_lin_late
          aux.load_mode: model_only
          aux.code_dir: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/code/v1
          aux.intervention: add_attn@lin_late
          aux.src: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/ladder17b_surgery/hybrid_add_lin_late
        - aux.arm: hybrid_attn_rope
          aux.load_mode: model_only
          aux.code_dir: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/code/v1
          aux.intervention: attn_rope
          aux.src: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/ladder17b_surgery/hybrid_attn_rope
        # decay probe (docs/recall_surgery_ambitious.md §3.4 / §8): each arm's step-2000 save resumed with optimizer and
        # data position, lr annealed linearly 5e-4 -> 1e-5 over 1000 steps (iteration 3000). Paired among themselves.
        - aux.arm: dec_pure_ctrl_fresh
          aux.model: skda-shipped-lowrank
          aux.ffn: 8064
          aux.load_mode: resume
          aux.resume_warmup: 100
          aux.decay: 1000
          aux.steps: 1000
          aux.code_dir: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/code/v1
          aux.intervention: ""
          aux.src: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/ladder17b_runs/skda-shipped-lowrank/pure_ctrl_fresh/ckpt
        - aux.arm: dec_pure_add_every4
          aux.model: skda-shipped-lowrank
          aux.ffn: 8064
          aux.load_mode: resume
          aux.resume_warmup: 100
          aux.decay: 1000
          aux.steps: 1000
          aux.code_dir: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/code/v1
          aux.intervention: "add_attn@every4"
          aux.src: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/ladder17b_runs/skda-shipped-lowrank/pure_add_every4/ckpt
        - aux.arm: dec_hybrid_ctrl_fresh
          aux.model: skda-shipped-hybrid-lowrank
          aux.ffn: 7936
          aux.load_mode: resume
          aux.resume_warmup: 100
          aux.decay: 1000
          aux.steps: 1000
          aux.code_dir: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/code/v1
          aux.intervention: ""
          aux.src: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/ladder17b_runs/skda-shipped-hybrid-lowrank/hybrid_ctrl_fresh/ckpt
        - aux.arm: dec_hybrid_add_lin_late
          aux.model: skda-shipped-hybrid-lowrank
          aux.ffn: 7936
          aux.load_mode: resume
          aux.resume_warmup: 100
          aux.decay: 1000
          aux.steps: 1000
          aux.code_dir: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/code/v1
          aux.intervention: "add_attn@lin_late"
          aux.src: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/ladder17b_runs/skda-shipped-hybrid-lowrank/hybrid_add_lin_late/ckpt
        # a second attention step right behind each attention layer (layers 5, 9, 13, 17, 21; branch q/k/v copied
        # from the preceding attention layer, o_proj zero): code/v2 (post_attn token)
        - aux.arm: hybrid_add_post_attn
          aux.load_mode: model_only
          aux.code_dir: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/code/v2
          aux.intervention: add_attn@post_attn
          aux.src: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/ladder17b_surgery/hybrid_add_post_attn
        - aux.arm: dec_hybrid_add_post_attn
          aux.model: skda-shipped-hybrid-lowrank
          aux.ffn: 7936
          aux.load_mode: resume
          aux.resume_warmup: 100
          aux.decay: 1000
          aux.steps: 1000
          aux.code_dir: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/code/v2
          aux.intervention: "add_attn@post_attn"
          aux.src: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/ladder17b_runs/skda-shipped-hybrid-lowrank/hybrid_add_post_attn/ckpt
        # KV-capacity reverse test (docs/recall_surgery_ambitious.md section 3.7): the six existing attention layers
        # rebuilt as GQA with 2 KV heads (32 query heads, 16 per group), k_proj / v_proj = per-group means of the
        # original heads (surgery attn_kv@2, code/v3). Paired with hybrid_ctrl_fresh / dec_hybrid_ctrl_fresh: same
        # model-only start, fresh Adam, warmup 100, lr 5e-4, seed, mbs 1, gbs 128, 2 nodes (aux.nodes=2 on the CLI, as
        # the controls), 2000 steps, saves every 500; the decay resumes the step-2000 save, 1000 steps to 1e-5.
        - aux.arm: hybrid_kv2
          aux.load_mode: model_only
          aux.code_dir: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/code/v3
          aux.intervention: attn_kv@2
          aux.src: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/ladder17b_surgery/hybrid_kv2
        - aux.arm: dec_hybrid_kv2
          aux.model: skda-shipped-hybrid-lowrank
          aux.ffn: 7936
          aux.load_mode: resume
          aux.resume_warmup: 100
          aux.decay: 1000
          aux.steps: 1000
          aux.code_dir: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/code/v3
          aux.intervention: "attn_kv@2"
          aux.src: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery/ladder17b_runs/skda-shipped-hybrid-lowrank/hybrid_kv2/ckpt
