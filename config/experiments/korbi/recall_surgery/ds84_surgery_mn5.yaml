# @package _global_
# Checkpoint steps of the 84B dropout-stitch session (docs/recall_surgery_ambitious.md §19; training config
# dropout_stitch84_mn5), one 1-node pool job each: scripts/korbi/recall_surgery/ds84_surgery.sh <step> in the training
# image, from a synced snapshot. Each writes an arm's own start checkpoint <root>/<arm>/ckpt/iter_N + its tracker (the
# training arm's start gate):
#   d6     D1    main ckpt_eval/iter_0023300 + additive attention copies (0/17/33/50/66/82 -> CKDA 9/25/41/58/74/90),
#                gamma 0 (add_ckda_branch.py --init attn + verify)        ~15-25 min (post4 at 23400: read 197 s + write 241 s)
#   dk6    DK1   the same with additive kvshare branches (--kvshare-init copy) + verify          ~15-25 min
#   ctrl2  ctrl2 the broad session's ctrl@24400 hard-linked (the stitch leg's paired control)   ~1 min
#   d2     D2    D1@24400's branches transplanted into ctrl@24400 (transplant_attention.py)       ~10-20 min
#                waits for D1's tracker = 24400 (D1's exit save)
#   dk2    DK2   DK1@24400's branches into ctrl@24400, the same; waits for DK1's tracker = 24400
#   d6h    D1h   (optional, aux.only=[d6h,d2h]) D1's start hard-linked, for rest dropout 0.5; waits for d6
#   d2h    D2h   (optional) D1h@24400's branches into ctrl@24400; waits for D1h's tracker = 24400
# Deterministic; an output whose tracker holds its iteration is skipped. Enqueue the default five at once (d2 / dk2
# wait; aux.only defaults to them, the optional D1h pair is enqueued with aux.only=[d6h,d2h]):
#   cd $R/autoexp_ds84 && scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py --no-monitor \
#       --monitor-state-dir $R/pool_state --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/<mn5_pool_p264|mn5_pool_c136> \
#       --config-name experiments/korbi/recall_surgery/ds84_surgery_mn5 --yes [slurm.sbatch.account=cns143]
# (one step: "aux.only=[d6]"; dry run: --dry-run --dry-run-root $D)
defaults:
  - ../production/v4_broad_surgery_mn5
  - _self_

aux:
  name: ds84_surgery
  it: 23300
  ctrl_it: 24400
  root: /gpfs/scratch/ehpc533/hybrid_nucleus/production/dropout_stitch84
  only: [d6, dk6, ctrl2, d2, dk2]

backend:
  command: bash scripts/korbi/recall_surgery/ds84_surgery.sh ${aux.surgery}
  env:
    CTRL_IT: ${aux.ctrl_it}

job:
  name: ds84_surgery_${aux.surgery}

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.surgery}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.surgery: d6
        - aux.surgery: dk6
        - aux.surgery: ctrl2
        - aux.surgery: d2
          job.start_condition:
            class_name: FileContentCondition
            path: /gpfs/scratch/ehpc533/hybrid_nucleus/production/dropout_stitch84/D1/ckpt/latest_checkpointed_iteration.txt
            pattern: "^\\s*24400\\s*$"
            mode: regex
            persistent_pass: true
        - aux.surgery: dk2
          job.start_condition:
            class_name: FileContentCondition
            path: /gpfs/scratch/ehpc533/hybrid_nucleus/production/dropout_stitch84/DK1/ckpt/latest_checkpointed_iteration.txt
            pattern: "^\\s*24400\\s*$"
            mode: regex
            persistent_pass: true
        - aux.surgery: d6h
          job.start_condition:
            class_name: FileExistsCondition
            path: /gpfs/scratch/ehpc533/hybrid_nucleus/production/dropout_stitch84/D1/ckpt/latest_checkpointed_iteration.txt
            persistent_pass: true
        - aux.surgery: d2h
          job.start_condition:
            class_name: FileContentCondition
            path: /gpfs/scratch/ehpc533/hybrid_nucleus/production/dropout_stitch84/D1h/ckpt/latest_checkpointed_iteration.txt
            pattern: "^\\s*24400\\s*$"
            mode: regex
            persistent_pass: true
