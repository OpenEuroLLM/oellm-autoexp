# @package _global_
# Start checkpoint of the K-style intervention on MN5 (docs/recall_surgery_ambitious.md §20): the main run's
# 35900 rolling save -> surgery/DK1/ckpt/iter_0035900, additive kvshare branches at 9/25/41/58/74/90 reading
# the keys/values of attention 0/17/33/50/66/82, q/gate/o/q-norm copied, input-norm folded, gamma 0, CKDA at
# full weight (no crossfade, no calibration). One 1-node pool job; the head-temperature job and DK1T wait for
# its tracker.
defaults:
  - ds84_surgery_mn5
  - _self_

aux:
  root: /gpfs/scratch/ehpc533/hybrid_nucleus/production/kvshare_main/surgery
  src: /gpfs/scratch/ehpc533/hybrid_nucleus/production/main_mhc4/ambitious_e360_eng80_v4_2ph_hd256/ckpt_rolling
  it: 35900
  only: [dk6]
  surgery: dk6

backend:
  command: bash scripts/korbi/recall_surgery/ds84_surgery.sh ${aux.surgery}
  env:
    ROOT: ${aux.root}
    SRC: ${aux.src}
    IT: ${aux.it}
    LAYERS: "9,25,41,58,74,90"
    SOURCES: "0,17,33,50,66,82"
    SIF: /gpfs/projects/ehpc533/users/korbip/hybrid_v019/container/MegatronTraining-hybrid-ep_x86_64_202610161948.sif

job:
  name: kvshare_main_surgery
  base_output_dir: ${aux.root}/logs
  est_step_time_s: 2400
  start_condition: null
  metadata:
    pool_priority: 90

slurm:
  sbatch:
    nodes: 1
    time: "02:00:00"
    account: cns144
    qos: acc_xehpc

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.surgery}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.surgery: dk6
