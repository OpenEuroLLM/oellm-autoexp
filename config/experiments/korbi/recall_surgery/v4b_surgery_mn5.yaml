# @package _global_
# The v4b copy-init checkpoint surgery as a 1-node job: scripts/korbi/production/v4b_surgery.sh
# (insert_v_layers.py --init copy -> add_v_mhc.py -> fix_v_args.py -> verify_v_surgery.py --init copy)
# in the training image, from a synced snapshot. Every output is hard links plus the new tensors, so
# the three stages cost no extra data. A stage whose tracker holds IT is skipped (a rerun continues).
#   cd $R/autoexp_v4b && scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py --no-monitor \
#       --monitor-state-dir $R/pool_state --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/mn5_pool_p264 \
#       --config-name experiments/korbi/recall_surgery/v4b_surgery_mn5 --yes
defaults:
  - ../hybrid_speed/kernel_tests_mn5
  - _self_

aux:
  name: v4b_surgery
  # the copy-init surgery's own root; the training arm loads ${aux.root}/ckpt
  root: /gpfs/scratch/ehpc533/hybrid_nucleus/production/kvshare_k_fresh35900_20261116/runs/v4b_src
  it: 35900
  # per V layer, its source attention layer (104-layer indices; the script maps them to the source's)
  sources: "0,18,35,53,70,87"

backend:
  command: bash scripts/korbi/production/v4b_surgery.sh
  env:
    ROOT: ${aux.root}
    IT: ${aux.it}
    SOURCES: ${aux.sources}

job:
  name: v4b_surgery
  base_output_dir: ${aux.root}/logs
  est_steps: 1
  est_step_time_s: 2400
  metadata:
    pool_priority: 60
    # not on excluded nodes: p264 hosts list their shrink-removed nodes there
    pool_use_excluded_nodes: false

slurm:
  sbatch:
    time: "02:00:00"
    # p264's hosts: account cns144, qos acc_xehpc
    account: cns144
    qos: acc_xehpc
