# @package _global_
# K-style intervention on the latest ambitious main run, MareNostrum 5 (same experiment as
# kvshare_main_jupiter.yaml; docs/recall_surgery_ambitious.md §20). The 264-node MN5 host fits a paired
# control (128 nodes) and DK1T (128 nodes) plus the 1-node K surgery and the 1-node head-temperature
# step, with 6 spare nodes.
#
# Control: the main run's 35900 rolling save, phase 2, 64k, gbs 1024, 128 nodes x mbs 2.
# DK1T: the K surgery (surgery/DK1/ckpt/iter_0035900) + add_head_temperature
#   (surgery/DK1T/ckpt/iter_0035900), additive kvshare branches at 9/25/41/58/74/90 reading K/V from
#   0/17/33/50/66/82, CKDA at full weight, rest dropout 0.3 and a learned per-head attention temperature.
# The 1000 steps = 67.1 BT; saves at 36400 / 36900.
defaults:
  - ../production/hybrid_ambitious_v4_2ph_hd256_p2r25k_rowcap_mn5
  - _self_

aux:
  suite: kvshare_main
  arm: ctrl
  only: [ctrl, DK1T]
  start: 35900
  steps: 1000
  nodes: 128
  phase: 2
  seq: 65536
  gbs: 1024
  stage_datamix: /gpfs/projects/ehpc533/users/korbip/hybrid_v019/data/datamix_v8ml_opt81_8k64k_stage2_mn5.txt
  kv_root: /gpfs/scratch/ehpc533/hybrid_nucleus/production/kvshare_main
  surgery_root: ${aux.kv_root}/surgery
  run_root: ${aux.kv_root}/runs
  main_root: ${aux.run_root}
  # the main run's 35900 save is in ckpt_rolling (ckpt holds 35603)
  load_main: /gpfs/scratch/ehpc533/hybrid_nucleus/production/main_mhc4/ambitious_e360_eng80_v4_2ph_hd256/ckpt_rolling
  load_tracker: /gpfs/scratch/ehpc533/hybrid_nucleus/production/main_mhc4/ambitious_e360_eng80_v4_2ph_hd256/ckpt_rolling/latest_checkpointed_iteration.txt
  load_surgery: ${aux.surgery_root}/DK1/ckpt
  load_surgery_tracker: ${aux.surgery_root}/DK1/ckpt/latest_checkpointed_iteration.txt
  load_surgery_t: ${aux.surgery_root}/DK1T/ckpt
  load_surgery_t_tracker: ${aux.surgery_root}/DK1T/ckpt/latest_checkpointed_iteration.txt
  layers: [9, 25, 41, 58, 74, 90]
  sources: [0, 17, 33, 50, 66, 82]

backend:
  megatron:
    load: ${aux.load_main}
    save: ${job.base_output_dir}/ckpt
    non_persistent_global_ckpt_dir: ${job.base_output_dir}/ckpt_rolling
    tensorboard_dir: ${job.base_output_dir}/tb
    wandb_save_dir: ${job.base_output_dir}/wandb
    micro_batch_size: 2
    exit_interval: 36900
    save_interval: 200
    non_persistent_save_interval: 200
    save_retain_interval: 10000
    save_extra_steps: [36400, 36900]
    check_for_nan_in_loss_and_grad: true
    ckda_branch_calibrate: false

job:
  name: kvshare_main_${aux.arm}
  est_steps: 1000
  est_step_time_s: 12.0
  start_condition: null
  metadata:
    pool_singleton: null
    pool_priority: 80

slurm:
  sbatch:
    nodes: ${aux.nodes}
    time: "12:00:00"
    account: cns144
    qos: acc_xehpc
    signal: "B:USR1@900"

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.arm: ctrl
          job.base_output_dir: ${aux.run_root}/ctrl
          job.start_condition:
            class_name: FileContentCondition
            path: ${aux.load_tracker}
            pattern: "^\\s*35900\\s*$"
            mode: regex
            persistent_pass: true
          backend.megatron.load: ${aux.load_main}
          backend.megatron.ckda_branch: null
          backend.megatron.ckda_branch_layers: null
          backend.megatron.ckda_branch_kv_source_layers: null
          backend.megatron.ckda_branch_crossfade: false
          backend.megatron.ckda_branch_rest_dropout: 0.0
        - aux.arm: DK1T
          job.base_output_dir: ${aux.run_root}/DK1T
          job.start_condition:
            class_name: FileContentCondition
            path: ${aux.load_surgery_t_tracker}
            pattern: "^\\s*35900\\s*$"
            mode: regex
            persistent_pass: true
          backend.megatron.load: ${aux.load_surgery_t}
          backend.megatron.ckda_branch: kvshare
          backend.megatron.ckda_branch_layers: ${aux.layers}
          backend.megatron.ckda_branch_kv_source_layers: ${aux.sources}
          backend.megatron.ckda_branch_num_query_groups: 2
          backend.megatron.ckda_branch_start_iteration: ${aux.start}
          backend.megatron.ckda_branch_crossfade: false
          backend.megatron.ckda_branch_alpha_hold: 0
          backend.megatron.ckda_branch_alpha_ramp: 0
          backend.megatron.ckda_branch_alpha_end: 1.0
          backend.megatron.ckda_branch_m_start: 1.0
          backend.megatron.ckda_branch_m_ramp: 0
          backend.megatron.ckda_branch_gamma_scale: 1.0
          backend.megatron.ckda_branch_rest_dropout: 0.3
          backend.megatron.attention_head_temperature: true
