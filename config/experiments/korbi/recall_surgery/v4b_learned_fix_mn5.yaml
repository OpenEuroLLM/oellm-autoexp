# @package _global_
# v4b main-run SUCCESSOR: the MoonEP illegal-access fix plus the corrected restart flags.
#
# Why this exists (2026-11-24): the live main run (ambitious_v4b_learned_256) restarts from a
# frozen submission definition that pins pylibs_moonep_ec3eb8b, i.e. the build with the crash
# path that produced cudaErrorIllegalAddress four times from ~54400. The fixed build
# (MoonEP e9e8238: per-thread fence.acq_rel.sys at the cross-rank barrier entry, plus guards that
# trap instead of doing an out-of-bounds store) is validated and prebuilt, but the pool can only
# pick it up through a new submission -- hence this successor.
#
# Start discipline (handover, not a race): the pool never has two of these lines live, because
#   1. the successor waits for <aux.kv_root>/v4b_fix_switch/armed, which only the handover script
#      writes AFTER it has cancelled the old line, and
#   2. it waits for no unfinished run whose name starts with ambitious_v4b_learned_256.
# Both writes go to the SAME training tree (runs/v4b_learned/main): the successor resumes from the
# old line's newest persistent/rolling save, so no step is recomputed beyond the crash loss.
#
# Restart flags: measured at 1024 ranks in p264.2152 (2026-11-24). Kept: lazy groups, the metadata
# broadcast (with hit/miss logging), Triton cache autotuning, node-check reuse, debug timings.
# Dropped: FSDP_DCP_SEQUENTIAL_READ and MEGATRON_DATASET_NODE_STAGGER (both slower at 1024 ranks:
# datasets 288-438 s with the stagger against 172 s before, the read 175-179 s against 155-158 s).
# Added: use_gloo_process_groups=false -- 11,279 group creations took 33.2-34.3 s there and
# DATA_PARALLEL_GROUP_GLOO alone 15.26 s; only the legacy distributed optimizer needs them.
defaults:
  - v4b_learned_mn5
  - _self_

aux:
  moonep_lib: pylibs_moonep_e9e8238

backend:
  env:
    # first entry replaces pylibs_moonep_ec3eb8b; the rest is the main run's own order
    PYTHONPATH: >-
      /gpfs/projects/ehpc533/users/korbip/hybrid_v019/pylibs_moonep_e9e8238:.:
      submodules/Megatron-LM:flash-linear-attention:submodules/cute_kernels:
      /gpfs/projects/ehpc533/users/korbip/hybrid_v019/retention:
      /gpfs/projects/ehpc533/users/korbip/hybrid_v019/pylibs_ep
    MEGATRON_LAZY_GROUPS: "1"
    FSDP_DCP_BCAST_METADATA: "1"
    TRITON_CACHE_AUTOTUNING: "1"
    MEGATRON_DEBUG_INIT_TIMING: "1"
    MEGATRON_DEBUG_LOAD_TIMING: "1"
    MEGATRON_DEBUG_SAVE_TIMING: "1"
  megatron:
    # no gloo process groups: 33 s of the 78 s Megatron init at 1024 ranks
    use_gloo_process_groups: false

slurm:
  env:
    NODE_CHECK_REUSE_S: "21600"

job:
  name: ambitious_v4b_learned_fix_256
  # same training tree as the old line: the successor resumes from its newest save
  base_output_dir: ${aux.kv_root}/runs/v4b_learned/main
  metadata:
    # same priority as the main run: it IS the main run from the handover on
    pool_priority: 150
  start_condition:
    class_name: AndCondition
    persistent_pass: true
    conditions:
      - class_name: FileExistsCondition
        path: ${aux.kv_root}/v4b_fix_switch/armed
      - class_name: ShellCommandCondition
        command: |
          python3 -c "import glob,json,os,sys; p='/gpfs/scratch/ehpc533/hybrid_nucleus/pools/mn5_pool_p264/runs'; live=[d for d in glob.glob(p+'/mn5-pool-p264.*') if not os.path.exists(d+'/rc')]; n=[json.load(open(d+'/run.json')).get('name','') for d in live if os.path.exists(d+'/run.json')]; sys.exit(1 if any(x.startswith('ambitious_v4b_learned_256') for x in n) else 0)"
