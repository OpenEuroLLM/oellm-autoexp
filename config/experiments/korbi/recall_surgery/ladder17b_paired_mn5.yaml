# @package _global_
# Paired loss check of the recall-surgery HF export (docs/recall_surgery_ambitious.md, section 8): native Megatron vs the
# HF export (export_native.py + hf_branch) on the same fixed validation tokens, one node per entry
# (scripts/korbi/recall_surgery/ladder17b_paired_check.sh). Exit 1 on |mean delta| > aux.tol or on any dropped tensor.
#
#   cd $R/autoexp_<snapshot> && scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py --no-monitor \
#       --monitor-state-dir $R/pool_state --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/mn5_pool_o134c \
#       --config-name experiments/korbi/recall_surgery/ladder17b_paired_mn5 --yes aux.step=500
defaults:
  - ../hybrid_speed/kernel_tests_mn5
  - _self_

aux:
  name: pure_add_every4
  only: []
  model: skda-shipped-lowrank
  intervention: ""
  root: /gpfs/scratch/ehpc533/hybrid_nucleus/recall_surgery
  code_dir: ${aux.root}/code/v1
  step: 500
  n: 8
  tol: 0.01
  tests: ""
  bench: ""

backend:
  command: bash scripts/korbi/recall_surgery/ladder17b_paired_check.sh
  env:
    SKDA_ARM: ${aux.model}
    SKDA_INTERVENTION: ${aux.intervention}
    CODE_DIR: ${aux.code_dir}
    CKPT: ${aux.root}/ladder17b_runs/${aux.model}/${aux.name}/ckpt
    CKPT_STEP: ${aux.step}
    OUT: ${aux.root}/ladder17b_paired/${aux.name}_${aux.step}
    N: ${aux.n}
    TOL: ${aux.tol}

job:
  name: ladder17b_paired_${aux.name}_${aux.step}
  base_output_dir: ${aux.root}/ladder17b_paired/${aux.name}_${aux.step}
  est_steps: 1
  est_step_time_s: 1500
  metadata:
    pool_priority: 60
    pool_use_excluded_nodes: true

slurm:
  sbatch:
    nodes: 1
    time: "01:30:00"
    account: cns144
    qos: acc_xehpc

sweep:
  type: product
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.name}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.name: pure_add_every4
          aux.model: skda-shipped-lowrank
          aux.intervention: add_attn@every4
        - aux.name: pure_ctrl_fresh
          aux.model: skda-shipped-lowrank
          aux.intervention: ""
        - aux.name: hybrid_attn_rope
          aux.model: skda-shipped-hybrid-lowrank
          aux.intervention: attn_rope
        - aux.name: hybrid_add_lin_late
          aux.model: skda-shipped-hybrid-lowrank
          aux.intervention: add_attn@lin_late
