# @package _global_
# The v4c copy-init checkpoint surgery: the same 35900 -> loadable-tree pipeline as v4b's
# (scripts/korbi/production/v4b_surgery.sh: insert_v_layers.py --init copy -> add_v_mhc.py ->
# fix_v_args.py -> verify_v_surgery.py --init copy), into v4c's own tree so the arm does not depend on
# v4b's source tree.
#
#   cd $R/autoexp && scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py --no-monitor \
#       --monitor-state-dir $R/pool_state --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/mn5_pool_p264 \
#       --config-name experiments/korbi/recall_surgery/v4c_surgery_mn5 --yes
#
# The result is ${aux.root}/ckpt/iter_0035900: q / gate / o / q-norm copied from source attention
# 0/18/35/53/70/87 (the source's input-norm gain folded into the linear_qkv columns), mHC attention
# mixer (phi 0, b_res 5 I), and no v_gate parameters -- both v4c variants are gate-free at load
# (v4c_ramp gates by schedule, so the checkpoint layout is exactly the model's).
defaults:
  - v4b_surgery_mn5
  - _self_

aux:
  name: v4c_surgery
  root: /gpfs/scratch/ehpc533/hybrid_nucleus/production/kvshare_k_fresh35900_20261116/runs/v4c_src

job:
  name: v4c_surgery
  base_output_dir: ${aux.root}/logs
