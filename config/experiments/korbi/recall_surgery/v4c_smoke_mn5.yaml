# @package _global_
# v4c smoke: 16 nodes, 6 steps from 35900, arch metrics and per-parameter norms on every step.
#
# ACCEPTANCE (from the measurements on v4a / v4b, docs/recall_surgery_ambitious.md §22.19):
#   35901  lm loss = 1.102695   the CONTROL's value on the same batch: at r = 0.01 the ramp is
#                              effectively closed (the residual mixing costs 0.00077 nats in total,
#                              so r = 0.01 adds ~1e-5). v4a read 1.103468 here, v4b 1.102696.
#   35902  lm loss ~= 1.102929  (control; v4a jumped to 1.5907, v4b read 1.102942)
#   35901  grad norm ~= 0.17-0.26  (control 0.167, v4b 0.256: the +0.19 of norm is the 12 learnable
#                              gate scalars; a schedule ramp has no gate parameters, so expect the
#                              control's ~0.17 and no branch gradient at all)
#   [arch] vgate/r     0.01, 0.02, ... 1/100 per step (the schedule, not a parameter)
#   [arch] vgate/delta ~0 at 35901, then r * 0.0229: ~0.0005 at 35905. The 0.0229 floor is the V
#                      layers' own h_res mixing at full r; a bare 1e-2 threshold means nothing here.
#   [params] the V layers' q / gate / o row norms: with the ramp the matrices get gradient
#                      proportional to r from step 1, so watch them in a longer run, not in 6 steps.
#
# A dropped flag shows up as a missing vgate/* metric; a wrong resume iteration as a loss that is not
# the control's. This smoke cannot see the branch after the ramp (r <= 0.06): the open readout is the
# 36100+ checkpoint, where r = 1 and the matrices have had gradient since 35901.
defaults:
  - v4c_ramp_mn5
  - _self_

aux:
  nodes: 16
  steps: 6

backend:
  megatron:
    exit_interval: 35906
    arch_metrics_interval: 1
    log_params_norm: true
    eval_interval: 100000000
    save_extra_steps: []
    save_interval: 1000000
    non_persistent_save_interval: null
    async_save: false

job:
  name: ambitious_v4c_ramp_smoke
  base_output_dir: ${aux.kv_root}/runs/v4c_ramp_smoke/main
  est_steps: 6
  metadata:
    pool_priority: 5
