# @package _global_
# Continuation of the late arms C / M / L (docs/recall_surgery_ambitious.md §14.7; user 2026-11-15): from their
# 39100 saves (+0.5 BT) to 41961 (+2 BT after the insertion at 38146), readouts at 40053 (+1 BT) / 41961 (+2 BT).
# On host108 of the 32B pool (18-node host the user gave us), priority -10 (the 32B run: 0), packed
# (max_runs_per_host raised, guarded by scripts/korbi/recall_surgery/late2_guard.sh: a run of ours landing on any
# other host is cancelled at once and re-enqueued in jupiter_pool_small16).
# train_iters 41961 (> 40053 of the first leg) is the same for all three arms, so their batches stay identical to each
# other; the order from 39101 on differs from the first leg's schedule (the sample index depends on train_iters).
#   cd ~/work/Projects/oellm-autoexp-hybrid && PYTHONPATH=. .venv/bin/python scripts/run_autoexp.py --no-monitor \
#     --monitor-state-dir /e/project1/e-sta-openeurollm/poeppel1/Projects/oellm-autoexp/monitor_state \
#     --pool /e/scratch/e-ext-2025e02-108/oellm_32b_dense_b1/pools/oellm32b_b1_relaxed_20261103 \
#     --config-name experiments/korbi/recall_surgery/small31_phase2late2_jupiter --yes
defaults:
  - small31_jupiter
  - _self_

aux:
  arm: C
  late_it: 38146

backend:
  megatron:
    train_iters: 41961
    exit_interval: 41961
    save_extra_steps: [40053, 41961]
    save_interval: 100000
    exit_on_missing_checkpoint: true
    override_opt_param_scheduler: true
    # 2026-11-15: C hit a sudden NaN gradient at 41062 (healthy losses before, grad norm 0.18); unchecked, the update
    # made every weight NaN (the cancel-time save 41081 was unusable; resumed from rolling 41000). With the check a NaN
    # step raises instead (the pool's retry resumes from the last clean save), as for a0 (§14.5). No effect on numerics.
    check_for_nan_in_loss_and_grad: true

job:
  metadata:
    pool_priority: -10
  start_condition:
    class_name: FileExistsCondition
    path: ${aux.out_root}/${aux.arm}/ckpt/latest_checkpointed_iteration.txt

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.arm: C
        - aux.arm: L
          backend.megatron.ckda_branch: attention
          backend.megatron.ckda_branch_layers: [9, 25, 42]
          backend.megatron.ckda_branch_num_query_groups: 2
          backend.megatron.ckda_branch_start_iteration: 38146
          backend.megatron.ckda_branch_crossfade: true
          backend.megatron.ckda_branch_alpha_hold: 0
          backend.megatron.ckda_branch_alpha_ramp: 200
          backend.megatron.ckda_branch_alpha_end: 0.0
          backend.megatron.ckda_branch_m_start: 1.0
          backend.megatron.ckda_branch_m_ramp: 0
          backend.megatron.ckda_branch_gamma_scale: 1.0
          backend.megatron.ckda_branch_calibrate: false
        - aux.arm: M
          backend.megatron.ckda_branch: attention
          backend.megatron.ckda_branch_layers: [9, 25, 42]
          backend.megatron.ckda_branch_num_query_groups: 2
          backend.megatron.ckda_branch_start_iteration: 38146
          backend.megatron.ckda_branch_crossfade: true
          backend.megatron.ckda_branch_alpha_hold: 0
          backend.megatron.ckda_branch_alpha_ramp: 200
          backend.megatron.ckda_branch_alpha_end: 0.0
          backend.megatron.ckda_branch_m_start: 1.0
          backend.megatron.ckda_branch_m_ramp: 0
          backend.megatron.ckda_branch_gamma_scale: 1.0
          backend.megatron.ckda_branch_calibrate: false
        # §14.8 arm K: ADDITIVE kvshare attention (CKDA at full weight, alpha 1, gamma 0 at insertion): new q / gate / o
        # at the E positions reading the keys / values of the nearest preceding attention layer of b7
        - aux.arm: K
          backend.megatron.ckda_branch: kvshare
          backend.megatron.ckda_branch_layers: [9, 25, 42]
          backend.megatron.ckda_branch_kv_source_layers: [0, 17, 34]
          backend.megatron.ckda_branch_num_query_groups: 2
          backend.megatron.ckda_branch_start_iteration: 38146
          backend.megatron.ckda_branch_crossfade: false
          backend.megatron.ckda_branch_alpha_hold: 0
          backend.megatron.ckda_branch_alpha_ramp: 0
          backend.megatron.ckda_branch_alpha_end: 1.0
          backend.megatron.ckda_branch_m_start: 1.0
          backend.megatron.ckda_branch_m_ramp: 0
          backend.megatron.ckda_branch_gamma_scale: 1.0
          backend.megatron.ckda_branch_calibrate: false
          backend.megatron.check_for_nan_in_loss_and_grad: true
        # §14.8 arm W: every dense MLP widened 3584 -> 4608, function-preserving (zero fc2 columns)
        - aux.arm: W
          backend.megatron.ffn_hidden_size: 4608
          backend.megatron.check_for_nan_in_loss_and_grad: true
        # §14.8 arm D2: D1's trained branches stitched into C@39100 (transplant_attention.py, input norm folded),
        # no dropout; adapted 39100 -> 41961 on C's batches (first leg to 40053, continued 2026-11-15)
        - aux.arm: D2
          backend.megatron.ckda_branch: attention
          backend.megatron.ckda_branch_layers: [9, 25, 42]
          backend.megatron.ckda_branch_num_query_groups: 2
          backend.megatron.ckda_branch_start_iteration: 38146
          backend.megatron.ckda_branch_crossfade: false
          backend.megatron.ckda_branch_alpha_hold: 0
          backend.megatron.ckda_branch_alpha_ramp: 0
          backend.megatron.ckda_branch_alpha_end: 1.0
          backend.megatron.ckda_branch_m_start: 1.0
          backend.megatron.ckda_branch_m_ramp: 0
          backend.megatron.ckda_branch_gamma_scale: 1.0
          backend.megatron.ckda_branch_calibrate: false
          backend.megatron.check_for_nan_in_loss_and_grad: true
        # §14.8 arm DK2: DK1's trained kvshare branches stitched into C@39100, no dropout; adapted 39100 -> 41961
        - aux.arm: DK2
          backend.megatron.ckda_branch: kvshare
          backend.megatron.ckda_branch_layers: [9, 25, 42]
          backend.megatron.ckda_branch_kv_source_layers: [0, 17, 34]
          backend.megatron.ckda_branch_num_query_groups: 2
          backend.megatron.ckda_branch_start_iteration: 38146
          backend.megatron.ckda_branch_crossfade: false
          backend.megatron.ckda_branch_alpha_hold: 0
          backend.megatron.ckda_branch_alpha_ramp: 0
          backend.megatron.ckda_branch_alpha_end: 1.0
          backend.megatron.ckda_branch_m_start: 1.0
          backend.megatron.ckda_branch_m_ramp: 0
          backend.megatron.ckda_branch_gamma_scale: 1.0
          backend.megatron.ckda_branch_calibrate: false
          backend.megatron.check_for_nan_in_loss_and_grad: true
        # §14.8 arm W': W with the MLP update scale of the 3584-wide model (muon_scale_reference_ffn_hidden_size): the
        # widening without the +13 % effective-lr confound of MuOwn's sqrt(max(m, n)) scale
        - aux.arm: Wp
          backend.megatron.ffn_hidden_size: 4608
          backend.megatron.muon_scale_reference_ffn_hidden_size: 3584
          backend.megatron.check_for_nan_in_loss_and_grad: true
        # §14.8 arm D2h: D1h's branches stitched into C@39100, no dropout; adapted 39100 -> 41961
        - aux.arm: D2h
          backend.megatron.ckda_branch: attention
          backend.megatron.ckda_branch_layers: [9, 25, 42]
          backend.megatron.ckda_branch_num_query_groups: 2
          backend.megatron.ckda_branch_start_iteration: 38146
          backend.megatron.ckda_branch_crossfade: false
          backend.megatron.ckda_branch_alpha_hold: 0
          backend.megatron.ckda_branch_alpha_ramp: 0
          backend.megatron.ckda_branch_alpha_end: 1.0
          backend.megatron.ckda_branch_m_start: 1.0
          backend.megatron.ckda_branch_m_ramp: 0
          backend.megatron.ckda_branch_gamma_scale: 1.0
          backend.megatron.ckda_branch_calibrate: false
          backend.megatron.check_for_nan_in_loss_and_grad: true
        # §14.8 arm T: a learned per-head temperature (logit scale on the normalized query, init 1) on the existing
        # attention layers; the parameter is not in b7's checkpoint (partial load keeps the 1s)
        - aux.arm: T
          backend.megatron.attention_head_temperature: true
          backend.megatron.check_for_nan_in_loss_and_grad: true
