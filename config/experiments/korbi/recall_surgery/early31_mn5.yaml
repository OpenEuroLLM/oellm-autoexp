# @package _global_
# Early 3:1 surgery (docs/recall_surgery_ambitious.md §13; user 2026-11-13): branch the ambitious v4_2ph main run at
# step 1000 (its ckpt_eval/iter_0001000, attention head dim 128, 7:1), while the model is "not settled yet":
#   ctrl  head dim 128 -> 256 on the 6 attention sublayers (widen_attention_head_dim.py apply + reseed-k), 7:1
#   a31   the same + complex_kda sublayers 9 / 25 / 41 / 58 / 74 / 90 -> plain softmax attention, RANDOM init
#         (replace_ckda_with_attention.py: hard insertion, scale of the existing attention rows): 12 attention of
#         48 mixers = 3:1; the first CKDA sublayers (3, 5, 7) keep their complex eigenvalues
# Both continue the main run's phase 1 exactly: same blend (opt81 stage 1), seed, train_iters, gbs 8192 x 8k, lr
# 8.5e-4 constant; the data position of iteration 1000 (sampler reference layout dp 512 x mbs 8 = the 128-node
# layout of the main run's iterations 1-2610, so any node count reads the same batches). The recipe of the main
# run at 1000-2000: no output z-loss (it came at 9789), Engram lr x5, no expert cap (ramp from 9200).
# Readouts against the main run's own checkpoints 2000 / 3000 (ckpt_eval) on the critical evals (CoQA, SQuAD v2,
# Winogrande, belebele), saves at 1250 / 1500 (extra) and 2000 (persistent), validation every 500.
# Sources (scripts/korbi/production/early31_surgery.sh, login node, from a synced snapshot), on /gpfs/projects
# (the main run's iter_0001000 was moved there; hard links need the same filesystem):
#   /gpfs/projects/ehpc533/hybrid_nucleus/production/early31/src/{w256,w256rk,a31}/ckpt/iter_0001000
# each arm seeded (hard links) into .../early31/<arm>/ckpt there (load = save; tracker 1000 = the gate); persistent
# saves (1250 / 1500 / 2000, ~1.1 TB each) land there too, the rolling ones and the logs on scratch.
#   cd $R/autoexp_<snapshot> && scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py --no-monitor \
#       --monitor-state-dir $R/pool_state --pool /gpfs/scratch/ehpc533/hybrid_nucleus/pools/mn5_pool_p264 \
#       --config-name experiments/korbi/recall_surgery/early31_mn5 --yes "aux.only=[a31]" [aux.nodes=256]
defaults:
  - ../production/hybrid_ambitious_v4_2ph_256_mn5
  - _self_

aux:
  suite: early31
  arm: a31
  only: []
  nodes: 128
  # experiments: no pre-training node bench (its exclusions are per run directory)
  node_check: "off"

backend:
  megatron:
    kv_channels: 256
    # the main run's recipe at iterations 1000-2000 (config-mn5-pool-p129.0301.yaml): no z-loss and no expert
    # spectral cap (both from 9118 / 9789 on); Engram lr x5 (Megatron's default, as then)
    output_z_loss_coeff: 0.0
    muown_expert_spectral_cap: 0.0
    muown_expert_spectral_cap_end: 0.0
    muown_expert_spectral_cap_ramp_start: 0
    muown_expert_spectral_cap_ramp_steps: 0
    exit_on_missing_checkpoint: true
    strict_fsdp_dtensor_load: true
    finetune: false
    no_load_optim: false
    no_load_rng: false
    save_interval: 1000
    non_persistent_save_interval: 100
    save_extra_steps: [1250, 1500]
    eval_interval: 500
    exit_interval: 2000
    save: /gpfs/projects/ehpc533/hybrid_nucleus/production/early31/${aux.arm}/ckpt
    load: /gpfs/projects/ehpc533/hybrid_nucleus/production/early31/${aux.arm}/ckpt

job:
  name: early31_${aux.arm}
  metadata:
    # NOT the main run's singleton (ambitious_main_v4): these run next to it
    pool_singleton: null
    pool_priority: 50

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.arm: ctrl
          aux.phase: 1
          aux.seq: 8192
          aux.gbs: 8192
          backend.megatron.micro_batch_size: 8
          aux.stage_datamix: /gpfs/projects/ehpc533/users/korbip/hybrid_v019/data/datamix_v8ml_opt81_8k64k_stage1_mn5.txt
          backend.megatron.hybrid_layer_pattern: "*ENLELELELELELELE*ELELELELELELELE*ELELELELELELELEN*ELELELELELELELE*ELELELELELELELE*ELELELELELELELE"
          job.start_condition:
            class_name: FileContentCondition
            path: /gpfs/projects/ehpc533/hybrid_nucleus/production/early31/ctrl/ckpt/latest_checkpointed_iteration.txt
            pattern: "^\\s*1000\\s*$"
            mode: regex
            persistent_pass: true
        - aux.arm: a31
          aux.phase: 1
          aux.seq: 8192
          aux.gbs: 8192
          backend.megatron.micro_batch_size: 8
          aux.stage_datamix: /gpfs/projects/ehpc533/users/korbip/hybrid_v019/data/datamix_v8ml_opt81_8k64k_stage1_mn5.txt
          backend.megatron.hybrid_layer_pattern: "*ENLELELE*ELELELE*ELELELE*ELELELE*ELELELE*ELELELEN*ELELELE*ELELELE*ELELELE*ELELELE*ELELELE*ELELELE"
          job.start_condition:
            class_name: FileContentCondition
            path: /gpfs/projects/ehpc533/hybrid_nucleus/production/early31/a31/ckpt/latest_checkpointed_iteration.txt
            pattern: "^\\s*1000\\s*$"
            mode: regex
            persistent_pass: true
