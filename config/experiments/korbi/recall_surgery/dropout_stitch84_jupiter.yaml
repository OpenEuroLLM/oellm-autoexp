# @package _global_
# The 84B dropout-stitch session (dropout_stitch84_mn5, docs/recall_surgery_ambitious.md §19) on a JUPITER host
# (§19.1; user 2026-11-15: "prepare everything so that when we potentially get the next host, we are ready").
# PREPARED, NOT ENQUEUED; gate as on MareNostrum (small-scale D2 / DK2 >= ~2 over C on F1-when-answering / HasAns /
# CoQA, and the user's go).
#
# Same arms, batches and schedule as the MN5 config (23300 broad-session geometry: phase 1, 8k, gbs 1024 x 8k,
# lr 3.005e-4 constant, the main run's batches through the reference-layout sampler); only the platform
# (jupiter_amb84_platform: te218-fa3 image, aarch64 MoonEP, JSC data = byte-identical to MN5, fscratch checkpoints)
# and the node layout change:
#   D1 / DK1 at 128 nodes each (micro batch 2 instead of 64 nodes x 4: gbs 1024 = 512 GPUs x 2, the same samples per
#   step via the sampler) -> both legs-1 side by side on a 256-node host (~1100 steps, MN5 64 nodes: 10.6-11.0 s/step)
#   D2 / DK2 at 128 nodes each after the stitch; ctrl2 (the code-drift control) at 128 when a host has room -- the MN5
#   broad ctrl's logged 24401-24800 losses and its 24800 readout are the paired control otherwise (lead 2026-11-15)
# Start checkpoints: ds84_surgery.sh as on MN5 with SRC / CTRL pointing at the fscratch copies (ckpt/main_eval/
# iter_0023300, ckpt/broad_ctrl_eval/iter_0024400); run it on a JUPITER node / the login node (CPU, DCP surgery).
#   cd ~/work/Projects/oellm-autoexp-hybrid && PYTHONPATH=. .venv/bin/python scripts/run_autoexp.py --no-monitor \
#       --monitor-state-dir /e/scratch/e-sta-openeurollm/poeppel1/pool_state \
#       --pool /e/scratch/e-sta-openeurollm/poeppel1/pools/jupiter_pool_amb84 \
#       --config-name experiments/korbi/recall_surgery/dropout_stitch84_jupiter --yes
# Saves on JUPITER are complete with TE 2.18 (DTensor Adam state; the smoke test smoke_a -> smoke_b of
# hybrid_ambitious_v4_2ph_hd256_p2_jupiter checks save -> load exactness before this session runs).
defaults:
  - dropout_stitch84_mn5
  - ../production/jupiter_amb84_platform
  - override /container: jupiter
  - override /slurm: jupiter
  - _self_

aux:
  stage_datamix: ${aux.amb84}/datamix/datamix_v8ml_opt81_8k64k_stage1_jsc.txt
  root: ${aux.amb84}/runs/dropout_stitch84
  main_ckpt: ${aux.amb84}/ckpt/main_eval
  nodes: 128

backend:
  megatron:
    # 128 nodes x 4 GPUs x 2 = gbs 1024 (MN5: 64 nodes x 4 x 4); the sampler keeps the samples per step
    micro_batch_size: 2
