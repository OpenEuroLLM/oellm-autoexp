# @package _global_
#
# WEAK SCALING, BATCH AXIS, in FP8. Fixed 32B model, fixed TP4/PP4/mbs2; GBS
# scales proportionally with nodes so work per GPU per iteration is constant and
# M stays pinned at 8. Ideal weak scaling = a FLAT per-GPU curve; the slope is
# the pure cost of a larger world (DP collective growth, stragglers, startup).
#
# Re-run in FP8 because the bf16 version measured a precision the flagship does
# not use — see fp8_strong_scaling.yaml for the 438.5 vs 336.1 comparison at
# matched geometry. FP8 settings are the flagship's best-measured combination
# (hybrid + delayed), fp8_param_gather deliberately false.
#
# 100 iterations per arm, up from the 50 of the bf16 sweep. Because M is constant
# here the iteration time is roughly constant too (~2-3 s), so 100 costs about
# 5 minutes on EVERY arm — unlike the strong sweep, a uniform count is the right
# design on this axis. The old 50-iteration arms had p10 far below their medians
# (n1024: 134.4 vs 275.9), which is a sampling artefact this fixes.
#
# The 4-node arm is dropped: DP=1 there, same unsharded-optimizer OOM as strong.
#
# COST: ~510 node-hours.
defaults:
  - weak_scaling_batch
  - override /slurm: jupiter_autoexclude
  # 5-MINUTE STALL DETECTION. The parent chain resolves /job: auto_cancel, whose
  # inactivity floor is 1200s — tuned for production runs that legitimately go
  # quiet during multi-hundred-GB checkpoint saves. These speed tests set
  # save: null, so 300s is safe and catches silent hangs like job 1397496
  # (512 nodes, 12 min of total log silence, no error text, ~75 node-hours lost).
  - override /job: auto_cancel_speedtest
  - _self_

backend:
  megatron:
    fp8: hybrid
    fp8_recipe: delayed
    fp8_param_gather: false
    first_last_layers_bf16: false
    fp8_amax_history_len: 1024
    fp8_amax_compute_algo: max
    cuda_graph_impl: none
    # === FP32 GRADIENT ACCUMULATION — matches the production flagship ========
    # ONE SWITCH ONLY. Do NOT also set accumulate_allreduce_grads_in_fp32:
    # Megatron DERIVES it (arguments.py:742-745) and setting both would make this
    # config lie about what ran:
    #     if args.grad_reduce_in_bf16:
    #         args.accumulate_allreduce_grads_in_fp32 = False
    #     elif not args.accumulate_allreduce_grads_in_fp32 \
    #          and args.main_grads_dtype == torch.float32:
    #         args.accumulate_allreduce_grads_in_fp32 = True
    # main_grads_dtype is fp32 here, so flipping this to false auto-enables fp32
    # accumulation. The earlier FP8 speed tests (437-438 TFLOP/s) ran WITHOUT it;
    # the production stability runs run WITH it, and it was measured to cost
    # 7.8% (315.5 vs 342.3 TFLOP/s at 1024 nodes). Including it here means this
    # sweep reports SUSTAINED production throughput rather than a speed-test
    # ceiling the flagship does not actually operate at.
    #
    # NEITHER flag appears on the rendered command line — --grad-reduce-in-bf16
    # is store_true so false omits it, and accumulate_allreduce_grads_in_fp32 is
    # set inside Megatron. Confirm from the argument dump in the job log, not
    # from the sbatch.
    grad_reduce_in_bf16: false

sweep:
  type: product
  store_sweep_json: true
  groups:
    - type: list
      configs:
        - {backend.aux.variant: "fp8weakbatch-n8",    backend.aux.active_nodes: 8,    backend.megatron.global_batch_size: 32,   backend.megatron.exit_interval: 100, slurm.sbatch.time: "00:25:00"}
        - {backend.aux.variant: "fp8weakbatch-n16",   backend.aux.active_nodes: 16,   backend.megatron.global_batch_size: 64,   backend.megatron.exit_interval: 100, slurm.sbatch.time: "00:25:00"}
        - {backend.aux.variant: "fp8weakbatch-n32",   backend.aux.active_nodes: 32,   backend.megatron.global_batch_size: 128,  backend.megatron.exit_interval: 100, slurm.sbatch.time: "00:25:00"}
        - {backend.aux.variant: "fp8weakbatch-n64",   backend.aux.active_nodes: 64,   backend.megatron.global_batch_size: 256,  backend.megatron.exit_interval: 100, slurm.sbatch.time: "00:25:00"}
        - {backend.aux.variant: "fp8weakbatch-n128",  backend.aux.active_nodes: 128,  backend.megatron.global_batch_size: 512,  backend.megatron.exit_interval: 100, slurm.sbatch.time: "00:30:00"}
        - {backend.aux.variant: "fp8weakbatch-n256",  backend.aux.active_nodes: 256,  backend.megatron.global_batch_size: 1024, backend.megatron.exit_interval: 100, slurm.sbatch.time: "00:30:00"}
        - {backend.aux.variant: "fp8weakbatch-n512",  backend.aux.active_nodes: 512,  backend.megatron.global_batch_size: 2048, backend.megatron.exit_interval: 100, slurm.sbatch.time: "00:45:00"}
        - {backend.aux.variant: "fp8weakbatch-n1024", backend.aux.active_nodes: 1024, backend.megatron.global_batch_size: 4096, backend.megatron.exit_interval: 100, slurm.sbatch.time: "00:40:00"}
