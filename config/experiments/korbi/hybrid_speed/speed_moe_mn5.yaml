# @package _global_
# GENERATED by scripts/korbi/hybrid_speed/gen_suites.py -- edit there.
# Speed of the MoE features on a 120M-active / 1.2B-total MoE (speed_base_mn5.yaml).
defaults:
  - speed_base_mn5
  - _self_

aux:
  family: moe120M1200M
  pattern: "*E*E*E*E*E*E*E*E*E*E*E*E"

backend:
  megatron:
    ffn_hidden_size: 1920
    num_experts: 128
    moe_ffn_hidden_size: 320
    moe_router_topk: 4
    moe_shared_expert_intermediate_size: 640
    moe_grouped_gemm: true
    moe_token_dispatcher_type: alltoall
    moe_router_load_balancing_type: aux_loss
    moe_aux_loss_coeff: 0.01
    moe_router_dtype: fp32
    moe_permute_fusion: true
    expert_model_parallel_size: 4
    cuda_graph_modules: [attn, moe_router, moe_preprocess]

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        # reference: 128 experts top-4 + shared, aux loss, EP 4
        - aux.arm: moe
        # reference without CUDA graphs
        - aux.arm: moe_nocg
          backend.megatron.cuda_graph_impl: none
        # experts replicated (EP 1)
        - aux.arm: moe_ep1
          backend.megatron.expert_model_parallel_size: 1
        # dense reference with the MoE's active width (SwiGLU 1920)
        - aux.arm: dense120M
          aux.pattern: '*-*-*-*-*-*-*-*-*-*-*-*-'
          backend.megatron.num_experts: null
          backend.megatron.moe_ffn_hidden_size: null
          backend.megatron.moe_shared_expert_intermediate_size: null
          backend.megatron.expert_model_parallel_size: 1
          backend.megatron.ffn_hidden_size: 1920
          backend.megatron.cuda_graph_modules: []
        # no shared expert, top-6
        - aux.arm: noshared
          backend.megatron.moe_shared_expert_intermediate_size: null
          backend.megatron.moe_router_topk: 6
        # no shared expert, top-6, CUTLASS grouped GEMM
        - aux.arm: noshared_cutlass
          backend.megatron.moe_shared_expert_intermediate_size: null
          backend.megatron.moe_router_topk: 6
          backend.env.NVTE_USE_CUTLASS_GROUPED_GEMM: '1'
          aux.array_tag: _cutlass
        # aux-loss-free balancing (sigmoid router + expert bias)
        - aux.arm: auxfree
          backend.megatron.moe_router_load_balancing_type: none
          backend.megatron.moe_aux_loss_coeff: 0.0
          backend.megatron.moe_router_enable_expert_bias: true
          backend.megatron.moe_router_score_function: sigmoid
        # LatentMoE (experts in a 384-dim latent)
        - aux.arm: latent
          backend.megatron.moe_latent_size: 384
        # 16 zero-computation experts, no CUDA graphs
        - aux.arm: zero16
          backend.megatron.moe_zero_expert_num: 16
          backend.megatron.cuda_graph_impl: none
        # MuOwn
        - aux.arm: muown
          backend.megatron.optimizer: muown
        # MuOwn with its momentum streamed from host memory
        - aux.arm: muown_offload
          backend.megatron.optimizer: muown
          backend.megatron.muown_cpu_offload: true
        # Adam with the optimizer state on the CPU, D2H/H2D overlapped
        - aux.arm: adam_offload
          backend.megatron.use_precision_aware_optimizer: true
          backend.megatron.optimizer_cpu_offload: true
          backend.megatron.optimizer_offload_fraction: 1.0
          backend.megatron.overlap_cpu_optimizer_d2h_h2d: true
        # 3:1 GDN hybrid on the MoE
        - aux.arm: gdn3
          aux.pattern: LELELE*ELELELE*ELELELE*E
          backend.megatron.experimental_attention_variant: gated_delta_net
        # TE fused router
        - aux.arm: router_fusion
          backend.megatron.moe_router_fusion: true
        # TE CUTLASS grouped GEMM
        - aux.arm: cutlass_gg
          backend.env.NVTE_USE_CUTLASS_GROUPED_GEMM: '1'
          aux.array_tag: _cutlass
        # EP all-to-all overlapped with compute (+ delayed wgrad), no CUDA graphs
        - aux.arm: a2a_overlap
          backend.megatron.overlap_moe_expert_parallel_comm: true
          backend.megatron.delay_wgrad_compute: true
          backend.megatron.cuda_graph_impl: none
        # CUDA_DEVICE_MAX_CONNECTIONS 8
        - aux.arm: conn8
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          aux.array_tag: _conn8
        # manual GC every 10 steps
        - aux.arm: gc10
          backend.megatron.manual_gc_interval: 10
        # reference on NeMo 26.08.01 (TE 2.18)
        - aux.arm: nemo
          container.image: /gpfs/projects/ehpc533/singularity_images/nemo_26.08.01.sif
          backend.env.PATH: /opt/venv/bin:/usr/local/bin:/usr/bin:/bin
          aux.array_tag: _nemo
        # NeMo 26.08.01, flex dispatcher with HybridEP (16 SMs)
        - aux.arm: nemo_flex
          container.image: /gpfs/projects/ehpc533/singularity_images/nemo_26.08.01.sif
          backend.env.PATH: /opt/venv/bin:/usr/local/bin:/usr/bin:/bin
          aux.array_tag: _nemo
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: hybridep
          backend.megatron.moe_hybridep_num_sms: 16
        # as nemo_flex, no CUDA graphs
        - aux.arm: nemo_flex_nocg
          container.image: /gpfs/projects/ehpc533/singularity_images/nemo_26.08.01.sif
          backend.env.PATH: /opt/venv/bin:/usr/local/bin:/usr/bin:/bin
          aux.array_tag: _nemo
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: hybridep
          backend.megatron.moe_hybridep_num_sms: 16
          backend.megatron.cuda_graph_impl: none
        # NeMo, HybridEP + router fusion
        - aux.arm: nemo_flex_rf
          container.image: /gpfs/projects/ehpc533/singularity_images/nemo_26.08.01.sif
          backend.env.PATH: /opt/venv/bin:/usr/local/bin:/usr/bin:/bin
          aux.array_tag: _nemo
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: hybridep
          backend.megatron.moe_hybridep_num_sms: 16
          backend.megatron.moe_router_fusion: true
        # NeMo, HybridEP + all-to-all overlap (+ delayed wgrad)
        - aux.arm: nemo_flex_a2a
          container.image: /gpfs/projects/ehpc533/singularity_images/nemo_26.08.01.sif
          backend.env.PATH: /opt/venv/bin:/usr/local/bin:/usr/bin:/bin
          aux.array_tag: _nemo
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: hybridep
          backend.megatron.moe_hybridep_num_sms: 16
          backend.megatron.overlap_moe_expert_parallel_comm: true
          backend.megatron.delay_wgrad_compute: true
        # NeMo, alltoall dispatcher + all-to-all overlap (+ delayed wgrad)
        - aux.arm: nemo_a2a
          container.image: /gpfs/projects/ehpc533/singularity_images/nemo_26.08.01.sif
          backend.env.PATH: /opt/venv/bin:/usr/local/bin:/usr/bin:/bin
          aux.array_tag: _nemo
          backend.megatron.overlap_moe_expert_parallel_comm: true
          backend.megatron.delay_wgrad_compute: true
        # NeMo (TE 2.18), CUTLASS grouped GEMM
        - aux.arm: nemo_cutlass
          container.image: /gpfs/projects/ehpc533/singularity_images/nemo_26.08.01.sif
          backend.env.PATH: /opt/venv/bin:/usr/local/bin:/usr/bin:/bin
          aux.array_tag: _nemo_cutlass
          backend.env.NVTE_USE_CUTLASS_GROUPED_GEMM: '1'
        # NeMo (TE 2.18), CUTLASS grouped GEMM, no shared expert, top-6
        - aux.arm: nemo_cutlass_noshared
          container.image: /gpfs/projects/ehpc533/singularity_images/nemo_26.08.01.sif
          backend.env.PATH: /opt/venv/bin:/usr/local/bin:/usr/bin:/bin
          aux.array_tag: _nemo_cutlass
          backend.env.NVTE_USE_CUTLASS_GROUPED_GEMM: '1'
          backend.megatron.moe_shared_expert_intermediate_size: null
          backend.megatron.moe_router_topk: 6
        # NeMo (TE 2.18), CUTLASS grouped GEMM, LatentMoE
        - aux.arm: nemo_cutlass_latent
          container.image: /gpfs/projects/ehpc533/singularity_images/nemo_26.08.01.sif
          backend.env.PATH: /opt/venv/bin:/usr/local/bin:/usr/bin:/bin
          aux.array_tag: _nemo_cutlass
          backend.env.NVTE_USE_CUTLASS_GROUPED_GEMM: '1'
          backend.megatron.moe_latent_size: 384
