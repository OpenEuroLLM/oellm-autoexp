# @package _global_
# GENERATED by scripts/korbi/hybrid_speed/gen_suites.py -- edit there.
# Round 4B: speed / memory feasibility of the best-bet MoE hybrid at production layouts, bf16 vs fp8 (docs/hybrid_moe_3b_campaign.md §11.1).
defaults:
  - speed_base_mn5
  - _self_

aux:
  family: r4b
  pattern: "LELELE*ELELELE*ELELELE*E|LELELE*ELELELE*ELELELE*E|LELELE*ELELELE*ELELELE*E|LELELE*ELELELE*ELELELE*E"
  nodes: 16
  ep: 4
  gbs: 1024
  topk: 7
  expert_ffn: 768

backend:
  megatron:
    hidden_size: 2048
    num_attention_heads: 16
    num_query_groups: 2
    kv_channels: 128
    ffn_hidden_size: 6144
    linear_key_head_dim: 128
    linear_value_head_dim: 128
    linear_num_key_heads: 16
    linear_num_value_heads: 16
    experimental_attention_variant: complex_kda
    linear_beta_max: 2.0
    linear_output_gate: linear
    linear_drop_qkv_silu: true
    linear_gate_init_style: spread
    untie_embeddings_and_output_weights: true
    vocab_size: 262143
    moe_grouped_gemm: true
    # exp_irene's best MN5 layout for Qwen3-30B-A3B / Qwen3.5-35B-A3B (185.8 TFLOP/s/GPU, 8 nodes):
    # TP1 / PP4 / EP4, flex dispatcher with HybridEP, full recompute, mbs 4
    moe_token_dispatcher_type: flex
    moe_flex_dispatcher_backend: hybridep
    moe_router_load_balancing_type: aux_loss
    moe_aux_loss_coeff: 0.001
    moe_router_dtype: fp32
    moe_permute_fusion: true
    expert_model_parallel_size: ${aux.ep}
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 4
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 1
    micro_batch_size: 4
    global_batch_size: ${aux.gbs}
    cuda_graph_impl: none
    cuda_graph_modules: []
    train_iters: 25
    log_interval: 1
    num_experts: 336
    moe_ffn_hidden_size: 768
    moe_router_topk: 7
    moe_shared_expert_intermediate_size: 768
job:
  est_step_time_s: 20.0
  est_startup_min: 10.0
slurm:
  sbatch:
    nodes: ${aux.nodes}
    time: "00:40:00"

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        # 48x at 3B active: 336 x 768, top-7 + shared (~79B total), bf16
        - aux.arm: m48a3_bf16
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_gate_activation: signed_sigmoid2
          backend.megatron.linear_gate_init_style: shipped
          backend.megatron.linear_output_gate: lowrank
          backend.megatron.linear_drop_qkv_silu: true
          backend.megatron.position_embedding_type: none
          backend.megatron.attention_output_gate: true
          backend.megatron.exclusive_self_attention: true
          backend.megatron.moe_router_score_function: sigmoid
          backend.megatron.moe_router_enable_expert_bias: true
          backend.megatron.moe_router_bias_update_rate: 0.001
          backend.megatron.moe_aux_loss_coeff: 0.0001
          backend.megatron.mhc: true
          backend.megatron.mhc_expansion_rate: 8
          backend.megatron.mhc_routed_topk: 2
          backend.megatron.mhc_routed_reversible: true
          backend.megatron.moe_router_fusion: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          aux.array_tag: _conn8_m48a3
          backend.megatron.micro_batch_size: 2
          backend.megatron.num_experts: 336
