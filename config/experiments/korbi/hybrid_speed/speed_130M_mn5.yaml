# @package _global_
# GENERATED by scripts/korbi/hybrid_speed/gen_suites.py -- edit there.
# Speed of every architecture feature on the 130M dense model (speed_base_mn5.yaml).
defaults:
  - speed_base_mn5
  - _self_

aux:
  family: dense130M

sweep:
  type: product
  store_sweep_json: true
  groups:
    - type: list
      configs:
        # reference: HybridModel, attention + SwiGLU MLP x 12
        - aux.arm: dense
        # the same model through GPTModel
        - aux.arm: dense_gpt
          backend.launcher_script: ./submodules/Megatron-LM/pretrain_gpt.py
          backend.megatron.is_hybrid_model: false
          backend.megatron.spec: null
          backend.megatron.hybrid_layer_pattern: null
          backend.megatron.num_layers: 12
        # reference without CUDA graphs (what the graphs are worth)
        - aux.arm: dense_nocg
          backend.megatron.cuda_graph_impl: none
        # no positional encoding
        - aux.arm: nope
          backend.megatron.position_embedding_type: none
        # grouped-query attention, 4 kv heads
        - aux.arm: gqa4
          backend.megatron.num_query_groups: 4
        # exclusive self attention
        - aux.arm: xsa
          backend.megatron.exclusive_self_attention: true
        # sigmoid output gate
        - aux.arm: gate
          backend.megatron.attention_output_gate: true
        # XSA + output gate
        - aux.arm: xsa_gate
          backend.megatron.exclusive_self_attention: true
          backend.megatron.attention_output_gate: true
        # 3:1 sliding-window (1024) : global
        - aux.arm: swa3
          aux.pattern: W-W-W-*-W-W-W-*-W-W-W-*-
          backend.megatron.window_size: '[1023,0]'
        # multi-latent attention, NoPE
        - aux.arm: mla
          backend.megatron.multi_latent_attention: true
          backend.megatron.q_lora_rank: 384
          backend.megatron.kv_lora_rank: 256
          backend.megatron.qk_head_dim: 64
          backend.megatron.v_head_dim: 64
          backend.megatron.qk_pos_emb_head_dim: 0
          backend.megatron.rope_type: rope
          aux.pattern: +-+-+-+-+-+-+-+-+-+-+-+-
        # MLA + 4 kv groups + XSA + output gate
        - aux.arm: mla_gqa_xsa_gate
          backend.megatron.multi_latent_attention: true
          backend.megatron.q_lora_rank: 384
          backend.megatron.kv_lora_rank: 256
          backend.megatron.qk_head_dim: 64
          backend.megatron.v_head_dim: 64
          backend.megatron.qk_pos_emb_head_dim: 0
          backend.megatron.rope_type: rope
          aux.pattern: +-+-+-+-+-+-+-+-+-+-+-+-
          backend.megatron.mla_num_query_groups: 4
          backend.megatron.exclusive_self_attention: true
          backend.megatron.attention_output_gate: true
        # Mamba2 (24 heads of 64, state 128)
        - aux.arm: mamba2
          aux.pattern: M-M-M-*-M-M-M-*-M-M-M-*-
          backend.megatron.mamba_num_heads: 24
          backend.megatron.mamba_head_dim: 64
          backend.megatron.mamba_num_groups: 8
          backend.megatron.mamba_state_dim: 128
        # Megatron's native Gated DeltaNet
        - aux.arm: gdn_native
          aux.pattern: G-G-G-*-G-G-G-*-G-G-G-*-
        # linear mixer gated_delta_net
        - aux.arm: gated_delta_net
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.experimental_attention_variant: gated_delta_net
        # linear mixer mlstm
        - aux.arm: mlstm
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.experimental_attention_variant: mlstm
        # linear mixer kda
        - aux.arm: kda
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.experimental_attention_variant: kda
        # linear mixer signed_kda
        - aux.arm: signed_kda
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.experimental_attention_variant: signed_kda
        # linear mixer complex_kda
        - aux.arm: complex_kda
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.experimental_attention_variant: complex_kda
        # KDA with exclusive self attention
        - aux.arm: kda_xsa
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.experimental_attention_variant: kda
          backend.megatron.linear_xsa: true
        # KDA, 6 heads of 128 (the triadic arms at E=1)
        - aux.arm: kda_hd128
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.experimental_attention_variant: kda
          backend.megatron.linear_key_head_dim: 128
          backend.megatron.linear_value_head_dim: 128
          backend.megatron.linear_num_key_heads: 6
          backend.megatron.linear_num_value_heads: 6
        # triadic GDN E=4, CuTe kernels (6 heads of 128)
        - aux.arm: tri_gdn_e4_cute
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.experimental_attention_variant: triadic
          backend.megatron.linear_key_head_dim: 128
          backend.megatron.linear_value_head_dim: 128
          backend.megatron.linear_num_key_heads: 6
          backend.megatron.linear_num_value_heads: 6
          backend.megatron.linear_triadic_base: gdn
          backend.megatron.linear_triadic_e: 4
          backend.megatron.linear_triadic_kernel: cute
        # triadic KDA E=4 (6 heads of 128)
        - aux.arm: tri_kda_e4
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.experimental_attention_variant: triadic
          backend.megatron.linear_key_head_dim: 128
          backend.megatron.linear_value_head_dim: 128
          backend.megatron.linear_num_key_heads: 6
          backend.megatron.linear_num_value_heads: 6
          backend.megatron.linear_triadic_base: kda
          backend.megatron.linear_triadic_e: 4
        # triadic CKDA E=4 (6 heads of 128)
        - aux.arm: tri_ckda_e4
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.experimental_attention_variant: triadic
          backend.megatron.linear_key_head_dim: 128
          backend.megatron.linear_value_head_dim: 128
          backend.megatron.linear_num_key_heads: 6
          backend.megatron.linear_num_value_heads: 6
          backend.megatron.linear_triadic_base: ckda
          backend.megatron.linear_triadic_e: 4
        # power retention deg 2 (Triton baseline)
        - aux.arm: power
          aux.pattern: L-L-L-*-L-L-L-*-L-L-L-*-
          backend.megatron.experimental_attention_variant: power
        # ShortConv before every attention
        - aux.arm: shortconv
          aux.pattern: C*-C*-C*-C*-C*-C*-C*-C*-C*-C*-C*-C*-
        # Canon layers ABCD
        - aux.arm: canon
          backend.megatron.canon_layers: ABCD
        # Engram n-gram memory before blocks 2 and 8 (data-parallel tables)
        - aux.arm: engram
          aux.pattern: '*-N*-*-*-*-*-*-N*-*-*-*-*-'
          backend.megatron.engram_ngram_orders: [2, 3]
          backend.megatron.engram_table_parallel: dp
        # product-key memory in place of 2 MLPs
        - aux.arm: pkm
          aux.pattern: '*-*-*-*P*-*-*-*-*P*-*-*-'
          backend.megatron.pkm_table_parallel: dp
        # mHC, 4 residual streams
        - aux.arm: mhc4
          backend.megatron.mhc: true
          backend.megatron.mhc_expansion_rate: 4
        # routed residual, 2 of 4 streams
        - aux.arm: routed_k2
          backend.megatron.mhc: true
          backend.megatron.mhc_expansion_rate: 4
          backend.megatron.mhc_routed_topk: 2
        # routed residual, 2 of 4, mixed, balanced
        - aux.arm: routed_k2_mix
          backend.megatron.mhc: true
          backend.megatron.mhc_expansion_rate: 4
          backend.megatron.mhc_routed_topk: 2
          backend.megatron.mhc_routed_mix: true
          backend.megatron.mhc_routed_balance_rate: 0.001
        # routed residual, 2 of 4, reversible
        - aux.arm: routed_k2_rev
          backend.megatron.mhc: true
          backend.megatron.mhc_expansion_rate: 4
          backend.megatron.mhc_routed_topk: 2
          backend.megatron.mhc_routed_reversible: true
        # block attention residuals (4 blocks)
        - aux.arm: attn_res
          backend.megatron.attn_res: true
          backend.megatron.attn_res_num_blocks: 4
        # sandwich norm
        - aux.arm: postnorm
          backend.megatron.post_sublayer_norm: true
        # nGPT
        - aux.arm: ngpt
          backend.megatron.ngpt: true
          backend.megatron.weight_normalizer: true
        # per-layer embeddings (128)
        - aux.arm: ple128
          backend.megatron.per_layer_embedding_dim: 128
        # value embeddings
        - aux.arm: value_emb
          backend.megatron.value_embedding: true
        # Muon
        - aux.arm: muon
          backend.megatron.optimizer: muon
        # MuOwn
        - aux.arm: muown
          backend.megatron.optimizer: muown
