# @package _global_
# GENERATED by scripts/korbi/ep_speed/gen_ep_suites.py -- edit there.
# Recompute checkpoint inputs on the host (docs/ep_fp8_speed.md).
defaults:
  - speed_base_mn5
  - _self_

aux:
  family: ckptoff
  suite: o1
  pattern: "*E"
  nodes: 8
  ep: 4
  gbs: 512
  topk: 8
  expert_ffn: 768

backend:
  megatron:
    hidden_size: 2048
    num_attention_heads: 32
    num_query_groups: 4
    kv_channels: 128
    ffn_hidden_size: 6144
    qk_layernorm: true
    position_embedding_type: rope
    rotary_base: 1000000
    untie_embeddings_and_output_weights: true
    vocab_size: 50303
    seq_length: 4096
    max_position_embeddings: 4096
    num_experts: 128
    moe_ffn_hidden_size: 768
    moe_router_topk: 8
    moe_grouped_gemm: true
    moe_token_dispatcher_type: flex
    moe_flex_dispatcher_backend: hybridep
    moe_router_load_balancing_type: aux_loss
    moe_aux_loss_coeff: 0.001
    moe_router_dtype: fp32
    moe_permute_fusion: true
    expert_model_parallel_size: ${aux.ep}
    tensor_model_parallel_size: 1
    micro_batch_size: 4
    global_batch_size: ${aux.gbs}
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 1
    cuda_graph_impl: none
    cuda_graph_modules: []
    log_interval: 1
    train_iters: 15
job:
  est_step_time_s: 20.0
  est_startup_min: 10.0
slurm:
  template_path: templates/marenostrum_watchdog.sbatch
  srun_opts: "--overlap "
  env:
    WATCHDOG_SCRIPT: scripts/korbi/hybrid_speed/job_watchdog.py
    WATCHDOG_PYSPY: ${aux.hybrid_env}/py-spy
    WATCHDOG_STARTUP_S: "1500"
    WATCHDOG_STALL_S: "600"
    WATCHDOG_INTERVAL_S: "15"
  sbatch:
    nodes: ${aux.nodes}
    time: "00:40:00"

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        # mHC-4, 8k mbs 1 (reference)
        - aux.arm: o_mhc4_8k
          aux.pattern: LELELELELE*ELE|LELELELE*ELELE|LELELE*ELELELE|LELE*ELELELE|LELE*ELELELE|LELE*ELELELE|LELE*ELELELE|LELE*E
          backend.megatron.pipeline_model_parallel_size: 4
          backend.megatron.overlap_p2p_comm: true
          backend.megatron.moe_router_fusion: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          backend.megatron.mock_data: false
          backend.megatron.tokenizer_type: HuggingFaceTokenizer
          backend.megatron.tokenizer_model: /gpfs/projects/ehpc533/tokenizers/tokenizer-256k
          backend.megatron.vocab_size: null
          backend.megatron.padded_vocab_size: 262144
          backend.megatron.data_path: [/gpfs/projects/ehpc533/preprocessed/openeurollm-tokenized-256k/nemotron-cc/nemotron-mha-10p-sample]
          backend.megatron.split: 100,0,0
          backend.megatron.num_workers: 8
          backend.megatron.manual_gc: true
          backend.megatron.manual_gc_interval: 10
          backend.megatron.mmap_bin_files: false
          backend.megatron.dataloader_prefetch_factor: 8
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_gate_activation: signed_sigmoid2
          backend.megatron.linear_gate_init_style: shipped
          backend.megatron.linear_output_gate: lowrank
          backend.megatron.linear_drop_qkv_silu: true
          backend.megatron.position_embedding_type: none
          backend.megatron.attention_output_gate: true
          backend.megatron.exclusive_self_attention: true
          backend.megatron.moe_router_score_function: sigmoid
          backend.megatron.moe_router_enable_expert_bias: true
          backend.megatron.moe_router_bias_update_rate: 0.001
          backend.megatron.moe_aux_loss_coeff: 0.0001
          backend.megatron.num_experts: 160
          backend.megatron.moe_ffn_hidden_size: 768
          backend.megatron.moe_router_topk: 5
          backend.megatron.moe_shared_expert_intermediate_size: 768
