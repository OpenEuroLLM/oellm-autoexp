# @package _global_
# GENERATED by scripts/korbi/ep_speed/gen_ep_suites.py -- edit there.
# Qwen3.5-35B-A3B one-node slice: which component is slow (docs/ep_fp8_speed.md, phase H).
defaults:
  - speed_base_mn5
  - _self_

aux:
  family: q35slice
  suite: s1
  pattern: "LELELE*ELELELE*E"
  nodes: 1
  ep: 4
  gbs: 32
  topk: 8
  expert_ffn: 512

backend:
  megatron:
    hidden_size: 2048
    num_attention_heads: 16
    num_query_groups: 2
    kv_channels: 128
    ffn_hidden_size: 6144
    linear_key_head_dim: 128
    linear_value_head_dim: 128
    linear_num_key_heads: 16
    linear_num_value_heads: 16
    experimental_attention_variant: complex_kda
    untie_embeddings_and_output_weights: true
    moe_grouped_gemm: true
    moe_token_dispatcher_type: flex
    moe_flex_dispatcher_backend: hybridep
    moe_router_load_balancing_type: aux_loss
    moe_router_dtype: fp32
    moe_permute_fusion: true
    expert_model_parallel_size: ${aux.ep}
    tensor_model_parallel_size: 1
    global_batch_size: ${aux.gbs}
    cuda_graph_impl: none
    cuda_graph_modules: []
    log_interval: 1
    train_iters: 12
    num_experts: 256
    moe_ffn_hidden_size: 512
    moe_router_topk: 8
    vocab_size: 32768
    seq_length: 4096
    max_position_embeddings: 4096
    micro_batch_size: 2
    pipeline_model_parallel_size: 1
    recompute_granularity: null
    recompute_method: null
    recompute_num_layers: null
    overlap_param_gather: false
    liger_fused_linear_cross_entropy_chunk_size: 4096
job:
  est_step_time_s: 3.0
  est_startup_min: 10.0
slurm:
  template_path: templates/marenostrum_watchdog.sbatch
  srun_opts: "--overlap "
  env:
    WATCHDOG_SCRIPT: scripts/korbi/hybrid_speed/job_watchdog.py
    WATCHDOG_PYSPY: ${aux.hybrid_env}/py-spy
    WATCHDOG_STARTUP_S: "1200"
    WATCHDOG_STALL_S: "300"
    WATCHDOG_INTERVAL_S: "15"
  sbatch:
    nodes: ${aux.nodes}
    time: "00:20:00"

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        # Qwen3.5 slice: FLA GDN (L) 3:1 + attention hd 256
        - aux.arm: s35_fla
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: hybridep
          backend.megatron.use_transformer_engine_op_fuser: true
          backend.env.NVTE_CUTEDSL_FUSED_GROUPED_MLP: '1'
          aux.array_tag: _opfx
          backend.megatron.experimental_attention_variant: gated_delta_net
          backend.megatron.linear_conv_kernel_dim: 4
          backend.megatron.linear_key_head_dim: 128
          backend.megatron.linear_value_head_dim: 128
          backend.megatron.linear_num_key_heads: 16
          backend.megatron.linear_num_value_heads: 32
          backend.megatron.num_attention_heads: 16
          backend.megatron.num_query_groups: 2
          backend.megatron.kv_channels: 256
          backend.megatron.attention_output_gate: true
          backend.megatron.rotary_base: 10000000
          backend.megatron.rotary_percent: 0.25
          backend.megatron.layernorm_zero_centered_gamma: true
          backend.megatron.num_experts: 256
          backend.megatron.moe_ffn_hidden_size: 512
          backend.megatron.moe_router_topk: 8
          backend.megatron.moe_shared_expert_intermediate_size: 512
          backend.megatron.moe_shared_expert_gate: true
          backend.megatron.moe_router_load_balancing_type: global_aux_loss
          aux.topk: 8
          backend.megatron.profile: true
          backend.megatron.use_pytorch_profiler: true
          backend.megatron.profile_ranks: [0]
          backend.megatron.profile_step_start: 6
          backend.megatron.profile_step_end: 8
          aux.pattern: LELELE*ELELELE*E
        # Qwen3.5 slice: native GDN (G) 3:1 + attention hd 256
        - aux.arm: s35_native
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: hybridep
          backend.megatron.use_transformer_engine_op_fuser: true
          backend.env.NVTE_CUTEDSL_FUSED_GROUPED_MLP: '1'
          aux.array_tag: _opfx
          backend.megatron.experimental_attention_variant: null
          backend.megatron.linear_conv_kernel_dim: 4
          backend.megatron.linear_key_head_dim: 128
          backend.megatron.linear_value_head_dim: 128
          backend.megatron.linear_num_key_heads: 16
          backend.megatron.linear_num_value_heads: 32
          backend.megatron.num_attention_heads: 16
          backend.megatron.num_query_groups: 2
          backend.megatron.kv_channels: 256
          backend.megatron.attention_output_gate: true
          backend.megatron.rotary_base: 10000000
          backend.megatron.rotary_percent: 0.25
          backend.megatron.layernorm_zero_centered_gamma: true
          backend.megatron.num_experts: 256
          backend.megatron.moe_ffn_hidden_size: 512
          backend.megatron.moe_router_topk: 8
          backend.megatron.moe_shared_expert_intermediate_size: 512
          backend.megatron.moe_shared_expert_gate: true
          backend.megatron.moe_router_load_balancing_type: global_aux_loss
          aux.topk: 8
          backend.megatron.profile: true
          backend.megatron.use_pytorch_profiler: true
          backend.megatron.profile_ranks: [0]
          backend.megatron.profile_step_start: 6
          backend.megatron.profile_step_end: 8
          aux.pattern: GEGEGE*EGEGEGE*E
        # attention-only, hd 256 (16 heads, 2 kv)
        - aux.arm: s35_attn256
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: hybridep
          backend.megatron.use_transformer_engine_op_fuser: true
          backend.env.NVTE_CUTEDSL_FUSED_GROUPED_MLP: '1'
          aux.array_tag: _opfx
          backend.megatron.experimental_attention_variant: gated_delta_net
          backend.megatron.linear_conv_kernel_dim: 4
          backend.megatron.linear_key_head_dim: 128
          backend.megatron.linear_value_head_dim: 128
          backend.megatron.linear_num_key_heads: 16
          backend.megatron.linear_num_value_heads: 32
          backend.megatron.num_attention_heads: 16
          backend.megatron.num_query_groups: 2
          backend.megatron.kv_channels: 256
          backend.megatron.attention_output_gate: true
          backend.megatron.rotary_base: 10000000
          backend.megatron.rotary_percent: 0.25
          backend.megatron.layernorm_zero_centered_gamma: true
          backend.megatron.num_experts: 256
          backend.megatron.moe_ffn_hidden_size: 512
          backend.megatron.moe_router_topk: 8
          backend.megatron.moe_shared_expert_intermediate_size: 512
          backend.megatron.moe_shared_expert_gate: true
          backend.megatron.moe_router_load_balancing_type: global_aux_loss
          aux.topk: 8
          backend.megatron.profile: true
          backend.megatron.use_pytorch_profiler: true
          backend.megatron.profile_ranks: [0]
          backend.megatron.profile_step_start: 6
          backend.megatron.profile_step_end: 8
          aux.pattern: '*E*E*E*E*E*E*E*E'
        # attention-only, hd 128 (16 heads, 2 kv)
        - aux.arm: s35_attn128
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: hybridep
          backend.megatron.use_transformer_engine_op_fuser: true
          backend.env.NVTE_CUTEDSL_FUSED_GROUPED_MLP: '1'
          aux.array_tag: _opfx
          backend.megatron.experimental_attention_variant: gated_delta_net
          backend.megatron.linear_conv_kernel_dim: 4
          backend.megatron.linear_key_head_dim: 128
          backend.megatron.linear_value_head_dim: 128
          backend.megatron.linear_num_key_heads: 16
          backend.megatron.linear_num_value_heads: 32
          backend.megatron.num_attention_heads: 16
          backend.megatron.num_query_groups: 2
          backend.megatron.kv_channels: 128
          backend.megatron.attention_output_gate: true
          backend.megatron.rotary_base: 10000000
          backend.megatron.rotary_percent: 0.25
          backend.megatron.layernorm_zero_centered_gamma: true
          backend.megatron.num_experts: 256
          backend.megatron.moe_ffn_hidden_size: 512
          backend.megatron.moe_router_topk: 8
          backend.megatron.moe_shared_expert_intermediate_size: 512
          backend.megatron.moe_shared_expert_gate: true
          backend.megatron.moe_router_load_balancing_type: global_aux_loss
          aux.topk: 8
          backend.megatron.profile: true
          backend.megatron.use_pytorch_profiler: true
          backend.megatron.profile_ranks: [0]
          backend.megatron.profile_step_start: 6
          backend.megatron.profile_step_end: 8
          aux.pattern: '*E*E*E*E*E*E*E*E'
        # FLA GDN only (no attention)
        - aux.arm: s35_gdn_only
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: hybridep
          backend.megatron.use_transformer_engine_op_fuser: true
          backend.env.NVTE_CUTEDSL_FUSED_GROUPED_MLP: '1'
          aux.array_tag: _opfx
          backend.megatron.experimental_attention_variant: gated_delta_net
          backend.megatron.linear_conv_kernel_dim: 4
          backend.megatron.linear_key_head_dim: 128
          backend.megatron.linear_value_head_dim: 128
          backend.megatron.linear_num_key_heads: 16
          backend.megatron.linear_num_value_heads: 32
          backend.megatron.num_attention_heads: 16
          backend.megatron.num_query_groups: 2
          backend.megatron.kv_channels: 256
          backend.megatron.attention_output_gate: true
          backend.megatron.rotary_base: 10000000
