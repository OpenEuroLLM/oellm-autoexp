          backend.megatron.linear_output_gate: lowrank
          backend.megatron.linear_drop_qkv_silu: true
          backend.megatron.position_embedding_type: none
          backend.megatron.attention_output_gate: true
          backend.megatron.exclusive_self_attention: true
          backend.megatron.moe_router_score_function: sigmoid
          backend.megatron.moe_router_enable_expert_bias: true
          backend.megatron.moe_router_bias_update_rate: 0.001
          backend.megatron.moe_aux_loss_coeff: 0.0001
          backend.megatron.moe_router_topk: ${oc.eval:'${aux.topk} - 1'}
          backend.megatron.moe_shared_expert_intermediate_size: ${aux.expert_ffn}
