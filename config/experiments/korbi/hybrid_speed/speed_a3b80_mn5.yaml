# @package _global_
# GENERATED by scripts/korbi/hybrid_speed/gen_suites.py -- edit there.
# Speed of the 3B-active / ~80B-total hybrid MoE (512 experts x 512, top-10 + shared) on 16 nodes, TP1 / PP4 / EP8.
defaults:
  - speed_base_mn5
  - _self_

aux:
  family: a3b80
  pattern: "LELELE*ELELELE*ELELELE*E|LELELE*ELELELE*ELELELE*E|LELELE*ELELELE*ELELELE*E|LELELE*ELELELE*ELELELE*E"
  nodes: 16
  ep: 8
  gbs: 1024
  topk: 10
  expert_ffn: 512

backend:
  megatron:
    hidden_size: 2048
    num_attention_heads: 16
    num_query_groups: 2
    kv_channels: 128
    ffn_hidden_size: 6144
    linear_key_head_dim: 128
    linear_value_head_dim: 128
    linear_num_key_heads: 16
    linear_num_value_heads: 16
    experimental_attention_variant: complex_kda
    linear_beta_max: 2.0
    linear_output_gate: linear
    linear_drop_qkv_silu: true
    linear_gate_init_style: spread
    untie_embeddings_and_output_weights: true
    vocab_size: 262143
    moe_grouped_gemm: true
    # exp_irene's best MN5 layout for Qwen3-30B-A3B / Qwen3.5-35B-A3B (185.8 TFLOP/s/GPU, 8 nodes):
    # TP1 / PP4 / EP4, flex dispatcher with HybridEP, full recompute, mbs 4
    moe_token_dispatcher_type: flex
    moe_flex_dispatcher_backend: hybridep
    moe_router_load_balancing_type: aux_loss
    moe_aux_loss_coeff: 0.001
    moe_router_dtype: fp32
    moe_permute_fusion: true
    expert_model_parallel_size: ${aux.ep}
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 4
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 1
    micro_batch_size: 4
    global_batch_size: ${aux.gbs}
    cuda_graph_impl: none
    cuda_graph_modules: []
    train_iters: 25
    log_interval: 1
    num_experts: 512
    moe_ffn_hidden_size: 512
    moe_router_topk: 10
    moe_shared_expert_intermediate_size: 512
job:
  est_step_time_s: 20.0
  est_startup_min: 10.0
slurm:
  sbatch:
    nodes: ${aux.nodes}
    time: "00:40:00"

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        # reference: 3:1 CKDA : attention hybrid MoE
        - aux.arm: ckda
        # KDA instead of CKDA
        - aux.arm: kda
          backend.megatron.experimental_attention_variant: kda
          backend.megatron.linear_beta_max: 1.0
          backend.megatron.linear_output_gate: lowrank
          backend.megatron.linear_drop_qkv_silu: false
          backend.megatron.linear_gate_init_style: shipped
        # Gated DeltaNet (FLA) instead of CKDA
        - aux.arm: gdn
          backend.megatron.experimental_attention_variant: gated_delta_net
          backend.megatron.linear_beta_max: 1.0
          backend.megatron.linear_output_gate: lowrank
          backend.megatron.linear_drop_qkv_silu: false
          backend.megatron.linear_gate_init_style: shipped
        # all-attention MoE (no linear mixer)
        - aux.arm: attn
          aux.pattern: '*E*E*E*E*E*E*E*E*E*E*E*E|*E*E*E*E*E*E*E*E*E*E*E*E|*E*E*E*E*E*E*E*E*E*E*E*E|*E*E*E*E*E*E*E*E*E*E*E*E'
        # exclusive self attention in the attention layers
        - aux.arm: ckda_xsa
          backend.megatron.exclusive_self_attention: true
        # sigmoid output gate in the attention layers (Qwen3-Next style)
        - aux.arm: ckda_gate
          backend.megatron.attention_output_gate: true
        # alltoall dispatcher instead of flex / HybridEP
        - aux.arm: ckda_alltoall
          backend.megatron.moe_token_dispatcher_type: alltoall
        # EP all-to-all overlap with the combined 1F1B schedule (8 connections)
        - aux.arm: ckda_ovl
          backend.megatron.overlap_moe_expert_parallel_comm: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          aux.array_tag: _conn8
        # micro batch 2
        - aux.arm: ckda_mbs2
          backend.megatron.micro_batch_size: 2
        # micro batch 8
        - aux.arm: ckda_mbs8
          backend.megatron.micro_batch_size: 8
        # selective recompute (MoE activations + norms) instead of full
        - aux.arm: ckda_sel_recompute
          backend.megatron.recompute_granularity: selective
          backend.megatron.recompute_method: null
          backend.megatron.recompute_num_layers: null
          backend.megatron.recompute_modules: [moe_act, layernorm]
        # half the expert parallelism
        - aux.arm: ckda_ep_half
          backend.megatron.expert_model_parallel_size: ${oc.eval:'${aux.ep} // 2'}
        # twice the expert parallelism
        - aux.arm: ckda_ep_double
          backend.megatron.expert_model_parallel_size: ${oc.eval:'2 * ${aux.ep}'}
        # pipeline parallel 2 (two stages)
        - aux.arm: ckda_pp2
          backend.megatron.pipeline_model_parallel_size: 2
          aux.pattern: LELELE*ELELELE*ELELELE*ELELELE*ELELELE*ELELELE*E|LELELE*ELELELE*ELELELE*ELELELE*ELELELE*ELELELE*E
        # balanced VPP2 pipeline layout (head + loss on their own segment)
        - aux.arm: ckda_vpp
          aux.pattern: LELELE*ELELELE|*ELELELE*ELELE|LE*ELELELE*ELE|LELE*ELELELE|*ELELELE*ELELE|LE*ELELELE*ELE|LELE*ELELELE|*E
        # VPP2 layout + router fusion, P2P overlap, 8 CUDA connections
        - aux.arm: ckda_tuned
          aux.pattern: LELELE*ELELELE|*ELELELE*ELELE|LE*ELELELE*ELE|LELE*ELELELE|*ELELELE*ELELE|LE*ELELELE*ELE|LELE*ELELELE|*E
          backend.megatron.moe_router_fusion: true
          backend.megatron.overlap_p2p_comm: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          aux.array_tag: _conn8
        # tuned + forced load balancing (benchmark only, as exp_irene's 185.8)
        - aux.arm: ckda_tuned_flb
          aux.pattern: LELELE*ELELELE|*ELELELE*ELELE|LE*ELELELE*ELE|LELE*ELELELE|*ELELELE*ELELE|LE*ELELELE*ELE|LELE*ELELELE|*E
          backend.megatron.moe_router_fusion: true
          backend.megatron.overlap_p2p_comm: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          aux.array_tag: _conn8
          backend.megatron.moe_router_force_load_balancing: true
        # all-attention, VPP2 layout + router fusion, P2P overlap, 8 connections (the torchtitan twin's reference)
        - aux.arm: attn_tuned
          aux.pattern: '*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E'
          backend.megatron.moe_router_fusion: true
          backend.megatron.overlap_p2p_comm: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          aux.array_tag: _conn8
        # all-attention, tuned + forced load balancing (exp_irene's setting)
        - aux.arm: attn_tuned_flb
          aux.pattern: '*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E'
          backend.megatron.moe_router_fusion: true
          backend.megatron.overlap_p2p_comm: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          aux.array_tag: _conn8
          backend.megatron.moe_router_force_load_balancing: true
        # PP8 x VPP2 (16 segments, head + loss on its own), tuned flags
        - aux.arm: ckda_pp8_vpp_tuned
          aux.pattern: LELELE*E|LELELE|*ELELE|LE*ELE|LELE*E|LELELE|*ELELE|LE*ELE|LELE*E|LELELE|*ELELE|LE*ELE|LELE*E|LELELE|*ELELELE|*E
          backend.megatron.pipeline_model_parallel_size: 8
          backend.megatron.moe_router_fusion: true
          backend.megatron.overlap_p2p_comm: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          aux.array_tag: _conn8
        # PP8 x VPP2 tuned, micro batch 2 (A3B-80B: OOM at mbs 4)
        - aux.arm: ckda_pp8_vpp_tuned_mbs2
          aux.pattern: LELELE*E|LELELE|*ELELE|LE*ELE|LELE*E|LELELE|*ELELE|LE*ELE|LELE*E|LELELE|*ELELE|LE*ELE|LELE*E|LELELE|*ELELELE|*E
          backend.megatron.pipeline_model_parallel_size: 8
          backend.megatron.micro_batch_size: 2
          backend.megatron.moe_router_fusion: true
          backend.megatron.overlap_p2p_comm: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          aux.array_tag: _conn8
        # tuned, global batch 4096 (exp_irene's; 4x fewer bubbles)
        - aux.arm: ckda_tuned_gbs4096
          aux.pattern: LELELE*ELELELE|*ELELELE*ELELE|LE*ELELELE*ELE|LELE*ELELELE|*ELELELE*ELELE|LE*ELELELE*ELE|LELE*ELELELE|*E
          backend.megatron.moe_router_fusion: true
          backend.megatron.overlap_p2p_comm: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          aux.array_tag: _conn8
          aux.gbs: 4096
          backend.megatron.train_iters: 10
        # round-3/3B recipe: CKDA 5:1 + attention NoPE/XSA/gate + MoE sigmoid/bias/shared, tuned VPP2
        - aux.arm: r3_ckda5
          aux.pattern: LELELELELE*ELE|LELELELE*ELELE|LELELE*ELELELE|LELE*ELELELE|LELE*ELELELELE|LE*ELELELELELE|*ELELELELELE|*E
          backend.megatron.moe_router_fusion: true
          backend.megatron.overlap_p2p_comm: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          aux.array_tag: _conn8
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_gate_activation: signed_sigmoid2
          backend.megatron.linear_gate_init_style: shipped
          backend.megatron.linear_output_gate: lowrank
          backend.megatron.linear_drop_qkv_silu: true
          backend.megatron.position_embedding_type: none
          backend.megatron.attention_output_gate: true
          backend.megatron.exclusive_self_attention: true
          backend.megatron.moe_router_score_function: sigmoid
          backend.megatron.moe_router_enable_expert_bias: true
          backend.megatron.moe_router_bias_update_rate: 0.001
          backend.megatron.moe_aux_loss_coeff: 0.0001
          backend.megatron.moe_router_topk: ${oc.eval:'${aux.topk} - 1'}
          backend.megatron.moe_shared_expert_intermediate_size: ${aux.expert_ffn}
        # r3_ckda5 + mHC, 4 residual streams
        - aux.arm: r3_ckda5_mhc4
          aux.pattern: LELELELELE*ELE|LELELELE*ELELE|LELELE*ELELELE|LELE*ELELELE|LELE*ELELELELE|LE*ELELELELELE|*ELELELELELE|*E
          backend.megatron.moe_router_fusion: true
          backend.megatron.overlap_p2p_comm: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          aux.array_tag: _conn8
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_gate_activation: signed_sigmoid2
          backend.megatron.linear_gate_init_style: shipped
          backend.megatron.linear_output_gate: lowrank
          backend.megatron.linear_drop_qkv_silu: true
          backend.megatron.position_embedding_type: none
          backend.megatron.attention_output_gate: true
          backend.megatron.exclusive_self_attention: true
          backend.megatron.moe_router_score_function: sigmoid
          backend.megatron.moe_router_enable_expert_bias: true
          backend.megatron.moe_router_bias_update_rate: 0.001
          backend.megatron.moe_aux_loss_coeff: 0.0001
          backend.megatron.moe_router_topk: ${oc.eval:'${aux.topk} - 1'}
          backend.megatron.moe_shared_expert_intermediate_size: ${aux.expert_ffn}
          backend.megatron.mhc: true
          backend.megatron.mhc_expansion_rate: 4
        # r3_ckda5 + mHC-4, micro batch 2 (4x residual activations)
        - aux.arm: r3_ckda5_mhc4_mbs2
          aux.pattern: LELELELELE*ELE|LELELELE*ELELE|LELELE*ELELELE|LELE*ELELELE|LELE*ELELELELE|LE*ELELELELELE|*ELELELELELE|*E
          backend.megatron.moe_router_fusion: true
          backend.megatron.overlap_p2p_comm: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          aux.array_tag: _conn8
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_gate_activation: signed_sigmoid2
          backend.megatron.linear_gate_init_style: shipped
          backend.megatron.linear_output_gate: lowrank
          backend.megatron.linear_drop_qkv_silu: true
          backend.megatron.position_embedding_type: none
          backend.megatron.attention_output_gate: true
          backend.megatron.exclusive_self_attention: true
          backend.megatron.moe_router_score_function: sigmoid
          backend.megatron.moe_router_enable_expert_bias: true
          backend.megatron.moe_router_bias_update_rate: 0.001
          backend.megatron.moe_aux_loss_coeff: 0.0001
          backend.megatron.moe_router_topk: ${oc.eval:'${aux.topk} - 1'}
          backend.megatron.moe_shared_expert_intermediate_size: ${aux.expert_ffn}
          backend.megatron.mhc: true
          backend.megatron.mhc_expansion_rate: 4
          backend.megatron.micro_batch_size: 2
        # r3_ckda5 + routed residual, 8 streams, 2 active
        - aux.arm: r3_ckda5_routed8
          aux.pattern: LELELELELE*ELE|LELELELE*ELELE|LELELE*ELELELE|LELE*ELELELE|LELE*ELELELELE|LE*ELELELELELE|*ELELELELELE|*E
          backend.megatron.moe_router_fusion: true
          backend.megatron.overlap_p2p_comm: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          aux.array_tag: _conn8
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_gate_activation: signed_sigmoid2
          backend.megatron.linear_gate_init_style: shipped
          backend.megatron.linear_output_gate: lowrank
          backend.megatron.linear_drop_qkv_silu: true
          backend.megatron.position_embedding_type: none
          backend.megatron.attention_output_gate: true
          backend.megatron.exclusive_self_attention: true
          backend.megatron.moe_router_score_function: sigmoid
          backend.megatron.moe_router_enable_expert_bias: true
          backend.megatron.moe_router_bias_update_rate: 0.001
          backend.megatron.moe_aux_loss_coeff: 0.0001
          backend.megatron.moe_router_topk: ${oc.eval:'${aux.topk} - 1'}
          backend.megatron.moe_shared_expert_intermediate_size: ${aux.expert_ffn}
          backend.megatron.mhc: true
          backend.megatron.mhc_expansion_rate: 8
          backend.megatron.mhc_routed_topk: 2
        # r3_ckda5, micro batch 2
        - aux.arm: r3_ckda5_mbs2
          aux.pattern: LELELELELE*ELE|LELELELE*ELELE|LELELE*ELELELE|LELE*ELELELE|LELE*ELELELELE|LE*ELELELELELE|*ELELELELELE|*E
          backend.megatron.moe_router_fusion: true
          backend.megatron.overlap_p2p_comm: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          aux.array_tag: _conn8
          backend.megatron.linear_beta_max: 2.0
