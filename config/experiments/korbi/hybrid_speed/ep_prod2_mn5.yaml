          backend.megatron.moe_router_topk: 5
          backend.megatron.moe_shared_expert_intermediate_size: 768
          backend.megatron.mhc: false
          backend.megatron.mhc_expansion_rate: 8
          backend.megatron.mhc_routed_topk: 0
          backend.megatron.mhc_routed_reversible: false
          backend.megatron.seq_length: 8192
          backend.megatron.max_position_embeddings: 8192
          backend.megatron.dataloader_inter_document_masking: true
          backend.megatron.moe_token_dispatcher_type: flex
