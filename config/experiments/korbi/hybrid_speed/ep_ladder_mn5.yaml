          aux.pattern: LELELELELE*ELE|LELELELE*ELELE|LELELE*ELELELE|LELE*ELELELE|LELE*ELELELELE|LE*ELELELELELE|*ELELELELELE|*E
          backend.megatron.pipeline_model_parallel_size: 4
          backend.megatron.overlap_p2p_comm: true
