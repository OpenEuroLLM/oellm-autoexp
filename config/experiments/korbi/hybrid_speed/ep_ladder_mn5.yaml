          slurm.env.NCCL_MIN_NCHANNELS: '4'
          slurm.env.NCCL_NCHANNELS_PER_PEER: '4'
          backend.env.PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
          backend.megatron.moe_flex_dispatcher_num_sms: 64
