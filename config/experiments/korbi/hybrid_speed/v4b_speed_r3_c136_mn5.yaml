# @package _global_
# v4b main-run step speed round 3 at 64 nodes (2026-11-24): bubbles, not math. The live sparse main
# config (cross_doc_seqs/v4b_learned_cds_sparse_mn5: 104 layers, page_maxpool per token, EP4 MoonEP,
# Megatron-FSDP, full recompute + RECOMPUTE_OFFLOAD) from the main run's trained weights (protected
# eval copy ckpt_eval/iter_0055000, read only: model only, iteration 0, nothing saved), one 64k
# sequence per GPU (gbs 256 on 64 nodes: one micro-batch per GPU, as in the main run). Same data /
# geometry as v4b_speed_ab64, so round 3 base stays comparable with it.
#
# The ab64 base step (18.0 s, 64 nodes), rank-0 torch profile:
#   compute stream (stream 7): 12.55 s busy, 5.44 s IDLE, 130 gaps > 5 ms = 4.47 s, spread over
#     every decile of the step (0.20 0.19 0.50 0.79 0.24 0.63 0.73 0.51 0.42 0.75 s) -- the GPU
#     drains its queue and waits for launches. The six > 100 ms gaps sit at t = 5.8 / 7.0 / 10.1 /
#     12.4 / 13.5 / 16.6 s and follow elementwise kernels.
#   aten::item 1,503 calls per two steps (750 / step): each one is a device synchronize, i.e. a
#     pipeline drain. The MoE health path is what does it: report_moe_health_metrics all-reduces
#     every tracked value over the PP / reduce / DP groups every step (blocking), and the profiler
#     shows ncclDevKernel_AllReduce_u64_TREE 0.92 s -- 5 % of the step for bookkeeping.
#   ReduceScatter_f32_RING 6.53 s and AllGather_RING 5.22 s run on their own streams and are
#     overlapped; 23.1 B params / 64 ranks is ~0.4 GB per rank per step, so their size is wait.
#
# So round 3 changes no math. It removes waits:
#   base     the main run's settings
#   nolog    the per-step MoE health logging off: --moe-per-layer-logging, --moe-expert-viability-
#            metrics, --moe-log-seq-aux-loss, --log-timers-to-tensorboard. Kills the per-step
#            blocking all-reduces and their .item() syncs. (Round 2 measured -3.3 % at 64 nodes;
#            the profiler says the ceiling is the 0.92 s u64 all-reduce plus the syncs.)
#   rc4      --recompute-num-layers 4: uniform recompute units of 4 layers instead of 2. Full
#            recompute keeps ONE input per unit and with mHC that input is the 4-stream state
#            (4 x 64k x 2048 bf16 ~ 1.07 GB), so 52 units put ~56 GB per step each way through
#            RECOMPUTE_OFFLOAD pinned host memory, on top of compute-side copies. 26 units halve
#            that traffic. The same layers are recomputed, so the math is unchanged -- only how
#            many chunk inputs are kept and copied.
#   sms      --moe-flex-dispatcher-num-sms 64 -> 128: the MoonEP dispatch and combine kernels
#            (0.33 + 0.32 s per step) get the whole SM array instead of half of it.
#   comb     nolog + rc4 + sms
#
# Not an arm, on purpose: --fsdp-fp8-param-gather all. It is already "experts", and the 48 expert
# buckets x 424,673,280 elements are 20.4 B of the model's 23.1 B params (88 %) -- those already
# all-gather as FP8 E4M3. Only the remaining ~2.7 B dense params move bf16, so "all" would touch
# 12 % of the wire and would quantize dense weights in the forward. Not worth it.
# Not an arm either: --megatron-fsdp-grad-comm-dtype bf16. The DP reduce-scatter reduces IN the
# wire dtype, so the 64-rank gradient sum itself would become bf16.
#
#   ... --pool .../mn5_pool_c136 -C /gpfs/scratch/ehpc533/hybrid_nucleus/speed/configs \
#       --config-name experiments/korbi/hybrid_speed/v4b_speed_r3_c136_mn5 \
#       slurm.sbatch.account=cns143 slurm.sbatch.qos=acc_xlarge --yes
defaults:
  - ../cross_doc_seqs/v4b_learned_cds_sparse_mn5
  - _self_

aux:
  suite: v4b_speed_r3
  variant: base
  arm: ${aux.variant}
  only: [base, nolog, rc4, sms, comb]
  nodes: 64
  node_check: "off"
  test_root: /gpfs/scratch/ehpc533/hybrid_nucleus/speed/v4b_speed_r3

backend:
  megatron:
    # ---- trained weights, read only ----
    load: /gpfs/scratch/ehpc533/hybrid_nucleus/production/kvshare_k_fresh35900_20261116/runs/v4b_learned/main/ckpt_eval
    ckpt_step: 55000
    finetune: true
    no_load_optim: true
    no_load_rng: true
    exit_on_missing_checkpoint: true
    save: null
    save_interval: null
    save_extra_steps: []
    non_persistent_save_interval: null
    non_persistent_ckpt_type: null
    async_save: false
    use_persistent_ckpt_worker: false
    exit_interval: 42
    # ---- one 64k phase, the stage-2 blend with document masking (t19j's data settings) ----
    phase_transition_iterations: null
    phase_transition_variable_batch: false
    global_batch_size: 256
    train_iters: 236733
    data_sampler_reference_dp_size: null
    data_sampler_reference_micro_batch_size: null
    packing_plan_path: null
    packing_plan_boundaries: doc
    packing_plan_at_end: exit
    dataloader_index_bundle: null
    eval_interval: 1000000
    eval_iters: 1
    wandb_project: null
    wandb_exp_name: null
    tensorboard_dir: ${job.base_output_dir}/tb
    # ---- profile: steps 30-31, four ranks (two nodes apart, rank 255 = last) ----
    profile: true
    use_pytorch_profiler: true
    profile_step_start: 30
    profile_step_end: 31
    profile_ranks: [0, 5, 130, 255]
    pytorch_profiler_collect_shapes: false

job:
  name: v4b_speed_r3_${aux.arm}
  base_output_dir: ${aux.test_root}/${aux.arm}
  start_condition: null
  est_steps: 42
  est_step_time_s: 20.0
  est_startup_min: 25.0
  metadata:
    pool_singleton: null
    # above the ab2 crash-hunt runs (130) queued in this pool: the speed arms go first
    pool_priority: 140
  log_events: []
  state_events:
    - name: give_up_node_fail
      transition: [null, NODE_FAIL]
      action: {class_name: CancelAction, reason: "speed test: lost a node"}
    - name: give_up_failed
      transition: [null, FAILED]
      action: {class_name: CancelAction, reason: "failed (speed test: no retry)"}

slurm:
  sbatch:
    nodes: ${aux.nodes}
    time: "01:30:00"

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.variant: base
        - aux.variant: nolog
          backend.megatron.moe_per_layer_logging: false
          backend.megatron.moe_expert_viability_metrics: false
          backend.megatron.moe_log_seq_aux_loss: false
          backend.megatron.log_timers_to_tensorboard: false
        - aux.variant: rc4
          backend.megatron.recompute_num_layers: 4
        - aux.variant: sms
          backend.megatron.moe_flex_dispatcher_num_sms: 128
        - aux.variant: comb
          backend.megatron.recompute_num_layers: 4
          backend.megatron.moe_flex_dispatcher_num_sms: 128
          backend.megatron.moe_per_layer_logging: false
          backend.megatron.moe_expert_viability_metrics: false
          backend.megatron.moe_log_seq_aux_loss: false
          backend.megatron.log_timers_to_tensorboard: false
