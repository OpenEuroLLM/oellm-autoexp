# @package _global_
# v4b main-run step speed round 3 at 64 nodes (2026-11-24): the live sparse main config
# (cross_doc_seqs/v4b_learned_cds_sparse_mn5: 104 layers, page_maxpool per token, EP4 MoonEP,
# Megatron-FSDP with fp8 expert gather, full recompute + RECOMPUTE_OFFLOAD) from the main run's
# trained weights (protected eval copy ckpt_eval/iter_0055000, read only: model only, iteration 0,
# nothing saved), one 64k sequence per GPU (gbs 256 on 64 nodes: one micro-batch per GPU, as in the
# main run). Same data / geometry as v4b_speed_ab64, so round 3 base is comparable with it.
#
# Why these arms (rank-0 torch profile of the ab64 base step, 18.0 s, 64 nodes):
#   ncclDevKernel_ReduceScatter_f32_RING   6.53 s   fp32 gradient reduce-scatter
#   ncclDevKernel_AllGather_RING           5.22 s   bf16 parameter all-gather (experts already fp8)
#   ncclDevKernel_AllReduce_u64_TREE       0.92 s   per-step MoE bookkeeping
# The two big ones are pure wire traffic, so round 3 attacks the wire format, not the layout:
#
#   base        the main run's settings (megatron_fsdp_grad_comm_dtype fp32, fp8 gather experts only)
#   gcommbf16   --megatron-fsdp-grad-comm-dtype bf16: the gradient reduce-scatter moves bf16 instead
#               of fp32 (~half the bytes). main_grads_dtype stays fp32, so the optimizer state and
#               the accumulation buffers do not change; only the reduction wire format does.
#   fp8all      --fsdp-fp8-param-gather all: every bf16 bucket is all-gathered as FP8 E4M3 with one
#               fp32 scale per 128 elements (~1.03 instead of 2 bytes per element); the GEMMs stay
#               bf16 on the dequantized weights. The main run already does this for the expert
#               buckets (experts); dense layers still move bf16.
#   comb        gcommbf16 + fp8all together (the two are independent: grads vs params).
#   nolog       the per-step MoE health logging off (round 2 measured -3.3 %; kept as the control
#               for whether it still holds with the wire changes on).
#
#   ... --pool .../mn5_pool_c136 -C /gpfs/scratch/ehpc533/hybrid_nucleus/speed/configs \
#       --config-name experiments/korbi/hybrid_speed/v4b_speed_r3_c136_mn5 \
#       slurm.sbatch.account=cns143 slurm.sbatch.qos=acc_xlarge --yes
defaults:
  - ../cross_doc_seqs/v4b_learned_cds_sparse_mn5
  - _self_

aux:
  suite: v4b_speed_r3
  variant: base
  arm: ${aux.variant}
  only: [base, gcommbf16, fp8all, comb, nolog]
  nodes: 64
  node_check: "off"
  test_root: /gpfs/scratch/ehpc533/hybrid_nucleus/speed/v4b_speed_r3

backend:
  megatron:
    # ---- trained weights, read only ----
    load: /gpfs/scratch/ehpc533/hybrid_nucleus/production/kvshare_k_fresh35900_20261116/runs/v4b_learned/main/ckpt_eval
    ckpt_step: 55000
    finetune: true
    no_load_optim: true
    no_load_rng: true
    exit_on_missing_checkpoint: true
    save: null
    save_interval: null
    save_extra_steps: []
    non_persistent_save_interval: null
    non_persistent_ckpt_type: null
    async_save: false
    use_persistent_ckpt_worker: false
    exit_interval: 42
    # ---- one 64k phase, the stage-2 blend with document masking (t19j's data settings) ----
    phase_transition_iterations: null
    phase_transition_variable_batch: false
    global_batch_size: 256
    train_iters: 236733
    data_sampler_reference_dp_size: null
    data_sampler_reference_micro_batch_size: null
    packing_plan_path: null
    packing_plan_boundaries: doc
    packing_plan_at_end: exit
    dataloader_index_bundle: null
    eval_interval: 1000000
    eval_iters: 1
    wandb_project: null
    wandb_exp_name: null
    tensorboard_dir: ${job.base_output_dir}/tb
    # ---- profile: steps 30-31, four ranks (two nodes apart, rank 255 = last) ----
    profile: true
    use_pytorch_profiler: true
    profile_step_start: 30
    profile_step_end: 31
    profile_ranks: [0, 5, 130, 255]
    pytorch_profiler_collect_shapes: false

job:
  name: v4b_speed_r3_${aux.arm}
  base_output_dir: ${aux.test_root}/${aux.arm}
  start_condition: null
  est_steps: 42
  est_step_time_s: 20.0
  est_startup_min: 25.0
  metadata:
    pool_singleton: null
    # above the ab2 crash-hunt runs (130) queued in this pool: the speed arms go first
    pool_priority: 140
  log_events: []
  state_events:
    - name: give_up_node_fail
      transition: [null, NODE_FAIL]
      action: {class_name: CancelAction, reason: "speed test: lost a node"}
    - name: give_up_failed
      transition: [null, FAILED]
      action: {class_name: CancelAction, reason: "failed (speed test: no retry)"}

slurm:
  sbatch:
    nodes: ${aux.nodes}
    time: "01:30:00"

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.variant: base
        - aux.variant: gcommbf16
          backend.megatron.megatron_fsdp_grad_comm_dtype: bf16
        - aux.variant: fp8all
          backend.megatron.fsdp_fp8_param_gather: all
        - aux.variant: comb
          backend.megatron.megatron_fsdp_grad_comm_dtype: bf16
          backend.megatron.fsdp_fp8_param_gather: all
        - aux.variant: nolog
          backend.megatron.moe_per_layer_logging: false
          backend.megatron.moe_expert_viability_metrics: false
          backend.megatron.moe_log_seq_aux_loss: false
          backend.megatron.log_timers_to_tensorboard: false
