# @package _global_
# GENERATED by scripts/korbi/ep_speed/gen_ep_suites.py -- edit there.
# Qwen3-30B-A3B TFLOP/s vs context length (docs/ep_fp8_speed.md, phase Q).
defaults:
  - speed_base_mn5
  - _self_

aux:
  family: q3a3b
  suite: q9
  pattern: "*E"
  nodes: 8
  ep: 4
  gbs: 1024
  topk: 8
  expert_ffn: 768

backend:
  megatron:
    hidden_size: 2048
    num_attention_heads: 32
    num_query_groups: 4
    kv_channels: 128
    ffn_hidden_size: 6144
    qk_layernorm: true
    position_embedding_type: rope
    rotary_base: 1000000
    untie_embeddings_and_output_weights: true
    vocab_size: 50303
    seq_length: 4096
    max_position_embeddings: 4096
    num_experts: 128
    moe_ffn_hidden_size: 768
    moe_router_topk: 8
    moe_grouped_gemm: true
    moe_token_dispatcher_type: flex
    moe_flex_dispatcher_backend: hybridep
    moe_router_load_balancing_type: aux_loss
    moe_aux_loss_coeff: 0.001
    moe_router_dtype: fp32
    moe_permute_fusion: true
    expert_model_parallel_size: ${aux.ep}
    tensor_model_parallel_size: 1
    micro_batch_size: 4
    global_batch_size: ${aux.gbs}
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 1
    cuda_graph_impl: none
    cuda_graph_modules: []
    log_interval: 1
    train_iters: 15
job:
  est_step_time_s: 20.0
  est_startup_min: 10.0
slurm:
  template_path: templates/marenostrum_watchdog.sbatch
  srun_opts: "--overlap "
  env:
    WATCHDOG_SCRIPT: scripts/korbi/hybrid_speed/job_watchdog.py
    WATCHDOG_PYSPY: ${aux.hybrid_env}/py-spy
    WATCHDOG_STARTUP_S: "1500"
    WATCHDOG_STALL_S: "600"
    WATCHDOG_INTERVAL_S: "15"
  sbatch:
    nodes: ${aux.nodes}
    time: "00:50:00"

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        # 8k, mbs 2, gbs 2048 (16M tokens)
        - aux.arm: c_8k_mbs2
          aux.pattern: '*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E'
          backend.megatron.pipeline_model_parallel_size: 4
          backend.megatron.overlap_p2p_comm: true
          backend.megatron.moe_router_fusion: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          backend.megatron.mock_data: false
          backend.megatron.tokenizer_type: HuggingFaceTokenizer
          backend.megatron.tokenizer_model: /gpfs/projects/ehpc533/tokenizers/tokenizer-256k
          backend.megatron.vocab_size: null
          backend.megatron.padded_vocab_size: 262144
          backend.megatron.data_path: [/gpfs/projects/ehpc533/preprocessed/openeurollm-tokenized-256k/nemotron-cc/nemotron-mha-10p-sample]
          backend.megatron.split: 100,0,0
          backend.megatron.num_workers: 8
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: moonep
          backend.env.PYTHONPATH: ${aux.hybrid_env}/pylibs_moonep:.:submodules/Megatron-LM:flash-linear-attention:submodules/cute_kernels:${aux.images.${aux.image}.libs}
          aux.array_tag: _moonmemfla
          slurm.env.NCCL_MIN_NCHANNELS: '4'
          slurm.env.NCCL_NCHANNELS_PER_PEER: '4'
          backend.env.PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
          backend.env.FLA_TENSOR_CACHE_SIZE: '64'
          backend.megatron.moe_flex_dispatcher_num_sms: 64
          backend.megatron.liger_fused_linear_cross_entropy_chunk_size: 2048
          backend.megatron.seq_length: 8192
          backend.megatron.max_position_embeddings: 8192
          backend.megatron.micro_batch_size: 2
          aux.gbs: 2048
          backend.megatron.train_iters: 8
        # 16k, mbs 1, gbs 1024 (16M tokens)
        - aux.arm: c_16k_mbs1
          aux.pattern: '*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E'
          backend.megatron.pipeline_model_parallel_size: 4
          backend.megatron.overlap_p2p_comm: true
          backend.megatron.moe_router_fusion: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          backend.megatron.mock_data: false
          backend.megatron.tokenizer_type: HuggingFaceTokenizer
          backend.megatron.tokenizer_model: /gpfs/projects/ehpc533/tokenizers/tokenizer-256k
          backend.megatron.vocab_size: null
          backend.megatron.padded_vocab_size: 262144
          backend.megatron.data_path: [/gpfs/projects/ehpc533/preprocessed/openeurollm-tokenized-256k/nemotron-cc/nemotron-mha-10p-sample]
          backend.megatron.split: 100,0,0
          backend.megatron.num_workers: 8
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: moonep
          backend.env.PYTHONPATH: ${aux.hybrid_env}/pylibs_moonep:.:submodules/Megatron-LM:flash-linear-attention:submodules/cute_kernels:${aux.images.${aux.image}.libs}
          aux.array_tag: _moonmemfla
          slurm.env.NCCL_MIN_NCHANNELS: '4'
          slurm.env.NCCL_NCHANNELS_PER_PEER: '4'
          backend.env.PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
          backend.env.FLA_TENSOR_CACHE_SIZE: '64'
          backend.megatron.moe_flex_dispatcher_num_sms: 64
          backend.megatron.liger_fused_linear_cross_entropy_chunk_size: 2048
          backend.megatron.seq_length: 16384
          backend.megatron.max_position_embeddings: 16384
          backend.megatron.micro_batch_size: 1
          aux.gbs: 1024
          backend.megatron.train_iters: 8
        # 32k, mbs 1, gbs 512 (16M tokens)
        - aux.arm: c_32k_mbs1
          aux.pattern: '*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E'
          backend.megatron.pipeline_model_parallel_size: 4
          backend.megatron.overlap_p2p_comm: true
          backend.megatron.moe_router_fusion: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          backend.megatron.mock_data: false
          backend.megatron.tokenizer_type: HuggingFaceTokenizer
          backend.megatron.tokenizer_model: /gpfs/projects/ehpc533/tokenizers/tokenizer-256k
          backend.megatron.vocab_size: null
          backend.megatron.padded_vocab_size: 262144
          backend.megatron.data_path: [/gpfs/projects/ehpc533/preprocessed/openeurollm-tokenized-256k/nemotron-cc/nemotron-mha-10p-sample]
          backend.megatron.split: 100,0,0
          backend.megatron.num_workers: 8
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: moonep
          backend.env.PYTHONPATH: ${aux.hybrid_env}/pylibs_moonep:.:submodules/Megatron-LM:flash-linear-attention:submodules/cute_kernels:${aux.images.${aux.image}.libs}
          aux.array_tag: _moonmemfla
          slurm.env.NCCL_MIN_NCHANNELS: '4'
          slurm.env.NCCL_NCHANNELS_PER_PEER: '4'
          backend.env.PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
          backend.env.FLA_TENSOR_CACHE_SIZE: '64'
          backend.megatron.moe_flex_dispatcher_num_sms: 64
          backend.megatron.liger_fused_linear_cross_entropy_chunk_size: 2048
          backend.megatron.seq_length: 32768
          backend.megatron.max_position_embeddings: 32768
          backend.megatron.micro_batch_size: 1
          aux.gbs: 512
          backend.megatron.train_iters: 8
