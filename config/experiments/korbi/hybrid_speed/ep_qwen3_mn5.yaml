# @package _global_
# GENERATED by scripts/korbi/ep_speed/gen_ep_suites.py -- edit there.
# Qwen3-30B-A3B on 8 nodes: exp_irene's layout on our stack, then the EP / fp8 levers (docs/ep_fp8_speed.md, phase Q).
defaults:
  - speed_base_mn5
  - _self_

aux:
  family: q3a3b
  suite: q1
  pattern: "*E"
  nodes: 8
  ep: 4
  gbs: 1024
  topk: 8
  expert_ffn: 768

backend:
  megatron:
    hidden_size: 2048
    num_attention_heads: 32
    num_query_groups: 4
    kv_channels: 128
    ffn_hidden_size: 6144
    qk_layernorm: true
    position_embedding_type: rope
    rotary_base: 1000000
    untie_embeddings_and_output_weights: true
    vocab_size: 50303
    seq_length: 4096
    max_position_embeddings: 4096
    num_experts: 128
    moe_ffn_hidden_size: 768
    moe_router_topk: 8
    moe_grouped_gemm: true
    moe_token_dispatcher_type: flex
    moe_flex_dispatcher_backend: hybridep
    moe_router_load_balancing_type: aux_loss
    moe_aux_loss_coeff: 0.001
    moe_router_dtype: fp32
    moe_permute_fusion: true
    expert_model_parallel_size: ${aux.ep}
    tensor_model_parallel_size: 1
    micro_batch_size: 4
    global_batch_size: ${aux.gbs}
    recompute_granularity: full
    recompute_method: uniform
    recompute_num_layers: 1
    cuda_graph_impl: none
    cuda_graph_modules: []
    log_interval: 1
    train_iters: 15
job:
  est_step_time_s: 20.0
  est_startup_min: 10.0
slurm:
  template_path: templates/marenostrum_watchdog.sbatch
  srun_opts: "--overlap "
  env:
    WATCHDOG_SCRIPT: scripts/korbi/hybrid_speed/job_watchdog.py
    WATCHDOG_PYSPY: ${aux.hybrid_env}/py-spy
    WATCHDOG_STARTUP_S: "1500"
    WATCHDOG_STALL_S: "600"
    WATCHDOG_INTERVAL_S: "15"
  sbatch:
    nodes: ${aux.nodes}
    time: "00:30:00"

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        # exp_irene's layout, HybridEP, bf16, real routing
        - aux.arm: q_ref
          aux.pattern: '*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E'
          backend.megatron.pipeline_model_parallel_size: 4
          backend.megatron.overlap_p2p_comm: true
          backend.megatron.moe_router_fusion: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: hybridep
        # + forced balanced routing (exp_irene's benchmark setting)
        - aux.arm: q_ref_force
          aux.pattern: '*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E'
          backend.megatron.pipeline_model_parallel_size: 4
          backend.megatron.overlap_p2p_comm: true
          backend.megatron.moe_router_fusion: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: hybridep
          backend.megatron.moe_router_force_load_balancing: true
        # grouped-tensor op-fuser experts
        - aux.arm: q_opfx
          aux.pattern: '*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E'
          backend.megatron.pipeline_model_parallel_size: 4
          backend.megatron.overlap_p2p_comm: true
          backend.megatron.moe_router_fusion: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: hybridep
          backend.megatron.use_transformer_engine_op_fuser: true
          backend.env.NVTE_CUTEDSL_FUSED_GROUPED_MLP: '1'
          aux.array_tag: _opfx
        # grouped path, forced balancing
        - aux.arm: q_opfx_force
          aux.pattern: '*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E'
          backend.megatron.pipeline_model_parallel_size: 4
          backend.megatron.overlap_p2p_comm: true
          backend.megatron.moe_router_fusion: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: hybridep
          backend.megatron.use_transformer_engine_op_fuser: true
          backend.env.NVTE_CUTEDSL_FUSED_GROUPED_MLP: '1'
          aux.array_tag: _opfx
          backend.megatron.moe_router_force_load_balancing: true
        # grouped path, sync-free (capacity 1.5)
        - aux.arm: q_opfx_cap
          aux.pattern: '*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E'
          backend.megatron.pipeline_model_parallel_size: 4
          backend.megatron.overlap_p2p_comm: true
          backend.megatron.moe_router_fusion: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: hybridep
          backend.megatron.use_transformer_engine_op_fuser: true
          backend.env.NVTE_CUTEDSL_FUSED_GROUPED_MLP: '1'
          aux.array_tag: _opfx
          backend.megatron.moe_expert_rank_capacity_factor: 1.5
        # grouped path, NCCL 4 channels + expandable segments
        - aux.arm: q_opfx_mem
          aux.pattern: '*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E'
          backend.megatron.pipeline_model_parallel_size: 4
          backend.megatron.overlap_p2p_comm: true
          backend.megatron.moe_router_fusion: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: hybridep
          backend.megatron.use_transformer_engine_op_fuser: true
          backend.env.NVTE_CUTEDSL_FUSED_GROUPED_MLP: '1'
          aux.array_tag: _mem
          slurm.env.NCCL_MIN_NCHANNELS: '4'
          slurm.env.NCCL_NCHANNELS_PER_PEER: '4'
          backend.env.PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
        # grouped path, gbs 4096 (exp_irene's; 4x fewer bubbles)
        - aux.arm: q_opfx_gbs4096
          aux.pattern: '*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E'
          backend.megatron.pipeline_model_parallel_size: 4
          backend.megatron.overlap_p2p_comm: true
          backend.megatron.moe_router_fusion: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: hybridep
          backend.megatron.use_transformer_engine_op_fuser: true
          backend.env.NVTE_CUTEDSL_FUSED_GROUPED_MLP: '1'
          aux.array_tag: _opfx
          aux.gbs: 4096
        # grouped path, fp8 blockwise in the experts only
        - aux.arm: q_opfx_fp8eb
          aux.pattern: '*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E'
          backend.megatron.pipeline_model_parallel_size: 4
          backend.megatron.overlap_p2p_comm: true
          backend.megatron.moe_router_fusion: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: hybridep
          backend.megatron.use_transformer_engine_op_fuser: true
          backend.env.NVTE_CUTEDSL_FUSED_GROUPED_MLP: '1'
          aux.array_tag: _opfx
          backend.megatron.fp8: hybrid
          backend.megatron.fp8_recipe: blockwise
          backend.megatron.fp8_param_gather: false
          backend.megatron.moe_router_padding_for_quantization: true
          backend.megatron.fp8_experts_only: true
        # grouped path, fp8 blockwise everywhere
        - aux.arm: q_opfx_fp8b
          aux.pattern: '*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E'
          backend.megatron.pipeline_model_parallel_size: 4
          backend.megatron.overlap_p2p_comm: true
          backend.megatron.moe_router_fusion: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: hybridep
          backend.megatron.use_transformer_engine_op_fuser: true
          backend.env.NVTE_CUTEDSL_FUSED_GROUPED_MLP: '1'
          aux.array_tag: _opfx
          backend.megatron.fp8: hybrid
          backend.megatron.fp8_recipe: blockwise
          backend.megatron.fp8_param_gather: false
          backend.megatron.moe_router_padding_for_quantization: true
        # grouped path, selective recompute (core_attn, moe_act, layernorm)
        - aux.arm: q_opfx_sel
          aux.pattern: '*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E'
          backend.megatron.pipeline_model_parallel_size: 4
          backend.megatron.overlap_p2p_comm: true
          backend.megatron.moe_router_fusion: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: hybridep
          backend.megatron.use_transformer_engine_op_fuser: true
          backend.env.NVTE_CUTEDSL_FUSED_GROUPED_MLP: '1'
          aux.array_tag: _mem
          slurm.env.NCCL_MIN_NCHANNELS: '4'
          slurm.env.NCCL_NCHANNELS_PER_PEER: '4'
          backend.env.PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
          backend.megatron.recompute_granularity: selective
          backend.megatron.recompute_method: null
          backend.megatron.recompute_num_layers: null
          backend.megatron.recompute_modules: [core_attn, moe_act, layernorm]
        # MoonEP: balanced dispatch with real routing
        - aux.arm: q_moon
          aux.pattern: '*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E*E|*E*E*E*E*E*E|*E'
          backend.megatron.pipeline_model_parallel_size: 4
          backend.megatron.overlap_p2p_comm: true
          backend.megatron.moe_router_fusion: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: moonep
          backend.env.PYTHONPATH: ${aux.hybrid_env}/pylibs_moonep:.:submodules/Megatron-LM:flash-linear-attention:submodules/cute_kernels:${aux.images.${aux.image}.libs}
          aux.array_tag: _moon
