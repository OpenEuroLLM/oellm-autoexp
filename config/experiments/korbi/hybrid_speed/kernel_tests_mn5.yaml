# @package _global_
# Megatron unit tests and kernel benchmarks on one MareNostrum 5 GPU node, through
# autoexp (provenance, the shared slurm/container setup):
#
#   scripts/korbi/mn5_autoexp_bg.sh tests scripts/run_autoexp.py \
#       --config-name experiments/korbi/hybrid_speed/kernel_tests_mn5 --yes \
#       aux.name=qknr 'aux.tests="tests/unit_tests/fusions/test_fused_qk_norm_rope.py"' \
#       'aux.bench="python scripts/korbi/hybrid_speed/bench_qknr.py"'   (from the repo root)
defaults:
  - ../../base
  - /backend: bash
  - /container: marenostrum_hybrid
  - /slurm: marenostrum_ehpc533
  - /sweep: none
  - _self_

aux:
  name: tests
  tests: ""
  bench: ""
  hybrid_env: ${oc.env:HYBRID_ENV,/gpfs/projects/ehpc533/users/korbip/hybrid_v019}
  # The training image and the libraries it needs from outside: ours first on PYTHONPATH
  # (Megatron, the FLA fork, cute_kernels -- they shadow the image's copies), then the
  # extras the image lacks. base: the 25.12 image + the old pylibs (built for its torch);
  # ep: MegatronTraining-hybrid-ep (NGC 26.09, torch 2.14 / TE 2.19, DeepEP/HybridEP,
  # mamba_ssm, TileLang, retention, MoonEP) + liger_kernel / mlstm_kernels only, and our
  # retention checkout ahead of the image's.
  image: ep
  images:
    base:
      sif: MegatronTraining_base2512_x86_64_202602200350.sif
      libs: "${aux.hybrid_env}/pylibs:${aux.hybrid_env}/pylibs_cute:${aux.hybrid_env}/pylibs_cute/nvidia_cutlass_dsl/dsl_packages:${aux.hybrid_env}/retention:${aux.hybrid_env}/pylibs_power"
    ep:
      sif: MegatronTraining-hybrid-ep_x86_64_202610161948.sif
      libs: "${aux.hybrid_env}/retention:${aux.hybrid_env}/pylibs_ep"
  # MareNostrum's dev queue (acc_debug: 1 job per user, 2 h), shared with every monitor
  dev_queue: false

backend:
  command: bash scripts/korbi/hybrid_speed/run_tests.sh "${aux.tests}" "${aux.bench}"
  env:
    PYTHONPATH: ".:submodules/Megatron-LM:flash-linear-attention:submodules/cute_kernels:${aux.images.${aux.image}.libs}"
    CUDA_DEVICE_MAX_CONNECTIONS: "1"
    NVIDIA_PYTORCH_VERSION: "25.12"

job:
  name: kernel_tests_${aux.name}
  base_output_dir: "${oc.env:OUTPUT_DIR,'./output'}/kernel_tests/${aux.name}"
  est_steps: 1
  est_step_time_s: 600
  concurrency_group: ${oc.if:${aux.dev_queue},acc_debug,null}
  max_active: ${oc.if:${aux.dev_queue},1,null}
  concurrency_qos: ${aux.dev_queue}
  # A run that hits the wall time (e.g. one that finishes and then hangs on exit, as the
  # full-iteration CUDA graph does) is finished, not monitored forever
  # (config/job/auto_cancel_speedtest.yaml's handlers, without its log rules).
  state_events:
    - name: timeout
      transition: ["RUNNING", "TIMEOUT"]
      action: {class_name: FinishAction, reason: "Job timed out"}
    - name: timeout
      transition: ["COMPLETING", "TIMEOUT"]
      action: {class_name: FinishAction, reason: "Job timed out"}

slurm:
  sbatch:
    time: "00:30:00"
    qos: ${oc.if:${aux.dev_queue},acc_debug,acc_ehpc}

stage: test

container:
  image: ${aux.hybrid_env}/container/${aux.images.${aux.image}.sif}
