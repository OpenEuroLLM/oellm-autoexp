# @package _global_
# GENERATED by scripts/korbi/ep_speed/gen_ep_suites.py -- edit there.
# EP8 across two nodes at the production layer shapes (docs/ep_fp8_speed.md, phase A2).
defaults:
  - speed_base_mn5
  - _self_

aux:
  family: epslice8
  suite: e3
  pattern: "LELELELELE*E"
  nodes: 2
  ep: 8
  gbs: 64
  topk: 5
  expert_ffn: 768

backend:
  megatron:
    hidden_size: 2048
    num_attention_heads: 16
    num_query_groups: 2
    kv_channels: 128
    ffn_hidden_size: 6144
    linear_key_head_dim: 128
    linear_value_head_dim: 128
    linear_num_key_heads: 16
    linear_num_value_heads: 16
    experimental_attention_variant: complex_kda
    untie_embeddings_and_output_weights: true
    moe_grouped_gemm: true
    moe_token_dispatcher_type: flex
    moe_flex_dispatcher_backend: hybridep
    moe_router_load_balancing_type: aux_loss
    moe_router_dtype: fp32
    moe_permute_fusion: true
    expert_model_parallel_size: ${aux.ep}
    tensor_model_parallel_size: 1
    global_batch_size: ${aux.gbs}
    cuda_graph_impl: none
    cuda_graph_modules: []
    log_interval: 1
    train_iters: 30
    num_experts: 160
    moe_ffn_hidden_size: 768
    moe_router_topk: 5
    moe_shared_expert_intermediate_size: 768
    vocab_size: 32768
    seq_length: 8192
    max_position_embeddings: 8192
    micro_batch_size: 1
    pipeline_model_parallel_size: 1
    recompute_granularity: null
    recompute_method: null
    recompute_num_layers: null
    # PP1 without recompute trips the overlapped param all-gather's ordering assert (a3bslice)
    overlap_param_gather: false
    liger_fused_linear_cross_entropy_chunk_size: 4096
job:
  est_step_time_s: 3.0
  est_startup_min: 10.0
slurm:
  template_path: templates/marenostrum_watchdog.sbatch
  srun_opts: "--overlap "
  env:
    WATCHDOG_SCRIPT: scripts/korbi/hybrid_speed/job_watchdog.py
    WATCHDOG_PYSPY: ${aux.hybrid_env}/py-spy
    WATCHDOG_STARTUP_S: "1200"
    WATCHDOG_STALL_S: "300"
    WATCHDOG_INTERVAL_S: "15"
  sbatch:
    nodes: ${aux.nodes}
    time: "00:20:00"

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        # alltoall, EP8 over 2 nodes
        - aux.arm: a2a
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_gate_activation: signed_sigmoid2
          backend.megatron.linear_gate_init_style: shipped
          backend.megatron.linear_output_gate: lowrank
          backend.megatron.linear_drop_qkv_silu: true
          backend.megatron.position_embedding_type: none
          backend.megatron.attention_output_gate: true
          backend.megatron.exclusive_self_attention: true
          backend.megatron.moe_router_score_function: sigmoid
          backend.megatron.moe_router_enable_expert_bias: true
          backend.megatron.moe_router_bias_update_rate: 0.001
          backend.megatron.moe_aux_loss_coeff: 0.0001
          backend.megatron.moe_router_fusion: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          backend.megatron.num_experts: 160
          backend.megatron.moe_ffn_hidden_size: 768
          backend.megatron.moe_router_topk: 5
          backend.megatron.moe_shared_expert_intermediate_size: 768
          backend.megatron.moe_token_dispatcher_type: alltoall
        # HybridEP, EP8 over 2 nodes (multinode RDMA path)
        - aux.arm: hep
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_gate_activation: signed_sigmoid2
          backend.megatron.linear_gate_init_style: shipped
          backend.megatron.linear_output_gate: lowrank
          backend.megatron.linear_drop_qkv_silu: true
          backend.megatron.position_embedding_type: none
          backend.megatron.attention_output_gate: true
          backend.megatron.exclusive_self_attention: true
          backend.megatron.moe_router_score_function: sigmoid
          backend.megatron.moe_router_enable_expert_bias: true
          backend.megatron.moe_router_bias_update_rate: 0.001
          backend.megatron.moe_aux_loss_coeff: 0.0001
          backend.megatron.moe_router_fusion: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          backend.megatron.num_experts: 160
          backend.megatron.moe_ffn_hidden_size: 768
          backend.megatron.moe_router_topk: 5
          backend.megatron.moe_shared_expert_intermediate_size: 768
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: hybridep
        # DeepEP, EP8 over 2 nodes (internode NVSHMEM kernels)
        - aux.arm: dep
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_gate_activation: signed_sigmoid2
          backend.megatron.linear_gate_init_style: shipped
          backend.megatron.linear_output_gate: lowrank
          backend.megatron.linear_drop_qkv_silu: true
          backend.megatron.position_embedding_type: none
          backend.megatron.attention_output_gate: true
          backend.megatron.exclusive_self_attention: true
          backend.megatron.moe_router_score_function: sigmoid
          backend.megatron.moe_router_enable_expert_bias: true
          backend.megatron.moe_router_bias_update_rate: 0.001
          backend.megatron.moe_aux_loss_coeff: 0.0001
          backend.megatron.moe_router_fusion: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          backend.megatron.num_experts: 160
          backend.megatron.moe_ffn_hidden_size: 768
          backend.megatron.moe_router_topk: 5
          backend.megatron.moe_shared_expert_intermediate_size: 768
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: deepep
        # ncclep (NCCL device API), EP8 over 2 nodes
        - aux.arm: nep
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_gate_activation: signed_sigmoid2
          backend.megatron.linear_gate_init_style: shipped
          backend.megatron.linear_output_gate: lowrank
          backend.megatron.linear_drop_qkv_silu: true
          backend.megatron.position_embedding_type: none
          backend.megatron.attention_output_gate: true
          backend.megatron.exclusive_self_attention: true
          backend.megatron.moe_router_score_function: sigmoid
          backend.megatron.moe_router_enable_expert_bias: true
          backend.megatron.moe_router_bias_update_rate: 0.001
          backend.megatron.moe_aux_loss_coeff: 0.0001
          backend.megatron.moe_router_fusion: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          backend.megatron.num_experts: 160
          backend.megatron.moe_ffn_hidden_size: 768
          backend.megatron.moe_router_topk: 5
          backend.megatron.moe_shared_expert_intermediate_size: 768
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: ncclep
          backend.megatron.moe_expert_rank_capacity_factor: 1.5
        # HybridEP + grouped-tensor path, EP8
        - aux.arm: hep_opfx
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_gate_activation: signed_sigmoid2
          backend.megatron.linear_gate_init_style: shipped
          backend.megatron.linear_output_gate: lowrank
          backend.megatron.linear_drop_qkv_silu: true
          backend.megatron.position_embedding_type: none
          backend.megatron.attention_output_gate: true
          backend.megatron.exclusive_self_attention: true
          backend.megatron.moe_router_score_function: sigmoid
          backend.megatron.moe_router_enable_expert_bias: true
          backend.megatron.moe_router_bias_update_rate: 0.001
          backend.megatron.moe_aux_loss_coeff: 0.0001
          backend.megatron.moe_router_fusion: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          backend.megatron.num_experts: 160
          backend.megatron.moe_ffn_hidden_size: 768
          backend.megatron.moe_router_topk: 5
          backend.megatron.moe_shared_expert_intermediate_size: 768
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: hybridep
          backend.megatron.use_transformer_engine_op_fuser: true
          backend.env.NVTE_CUTEDSL_FUSED_GROUPED_MLP: '1'
          aux.array_tag: _opfx
        # alltoall + grouped-tensor path, EP8
        - aux.arm: a2a_opfx
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_gate_activation: signed_sigmoid2
          backend.megatron.linear_gate_init_style: shipped
          backend.megatron.linear_output_gate: lowrank
          backend.megatron.linear_drop_qkv_silu: true
          backend.megatron.position_embedding_type: none
          backend.megatron.attention_output_gate: true
          backend.megatron.exclusive_self_attention: true
          backend.megatron.moe_router_score_function: sigmoid
          backend.megatron.moe_router_enable_expert_bias: true
          backend.megatron.moe_router_bias_update_rate: 0.001
          backend.megatron.moe_aux_loss_coeff: 0.0001
          backend.megatron.moe_router_fusion: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          backend.megatron.num_experts: 160
          backend.megatron.moe_ffn_hidden_size: 768
          backend.megatron.moe_router_topk: 5
          backend.megatron.moe_shared_expert_intermediate_size: 768
          backend.megatron.moe_token_dispatcher_type: alltoall
          backend.megatron.use_transformer_engine_op_fuser: true
          backend.env.NVTE_CUTEDSL_FUSED_GROUPED_MLP: '1'
          aux.array_tag: _opfx
        # control: HybridEP EP4 within the node (DP 8, expert DP 2)
        - aux.arm: hep_ep4
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_gate_activation: signed_sigmoid2
          backend.megatron.linear_gate_init_style: shipped
          backend.megatron.linear_output_gate: lowrank
          backend.megatron.linear_drop_qkv_silu: true
          backend.megatron.position_embedding_type: none
          backend.megatron.attention_output_gate: true
          backend.megatron.exclusive_self_attention: true
          backend.megatron.moe_router_score_function: sigmoid
          backend.megatron.moe_router_enable_expert_bias: true
          backend.megatron.moe_router_bias_update_rate: 0.001
          backend.megatron.moe_aux_loss_coeff: 0.0001
          backend.megatron.moe_router_fusion: true
          backend.env.CUDA_DEVICE_MAX_CONNECTIONS: '8'
          backend.megatron.num_experts: 160
          backend.megatron.moe_ffn_hidden_size: 768
          backend.megatron.moe_router_topk: 5
          backend.megatron.moe_shared_expert_intermediate_size: 768
          backend.megatron.moe_token_dispatcher_type: flex
          backend.megatron.moe_flex_dispatcher_backend: hybridep
          aux.ep: 4
