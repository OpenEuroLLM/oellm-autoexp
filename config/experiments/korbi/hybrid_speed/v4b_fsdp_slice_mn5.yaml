# @package _global_
# v4b main-run step speed (2026-11-23): the live sparse main config (cross_doc_seqs/v4b_learned_cds_sparse_mn5,
# 17.8 s/step) cut to its first 18-layer block ("*ENLELELELVELELELE": every layer type, 8 of 18 MoE like the
# 48 of 104 in the main run) on 8 nodes of MareNostrum's dev queue. Random init, mock data, one 64k
# sequence per GPU (mbs 1 x 32 GPUs), EP4 MoonEP, Megatron-FSDP with the main run's fp8 expert gather,
# full recompute (uniform 2) + RECOMPUTE_OFFLOAD: per-GPU shapes and collectives as in the main run
# (expert-DP 8 instead of 256, DP 32 instead of 1024). Engram table cut 32x (its rows are DP-sharded:
# the full table does not fit 32 GPUs; the lookup per token is unchanged).
#
# Why: the t19j 64-node trace of the same model (dense, trained weights) has the straggler rank's
# compute idle 5.9 s of 21.1 s, mostly behind FSDP collectives: in the backward every expert all-gather
# (fp8, 18 ms) waits for the previous layer's fp32 gradient reduce-scatter (70 ms) on the SAME
# communicator (EXPERT_DATA_PARALLEL_GROUP), then the recompute waits for it. Arms:
#   base   the main run's settings
#   agg    + --create-all-gather-group (separate all-gather communicators: AG overlaps RS; exact)
#   agg_nolog  agg + the per-step MoE health logging off (cost of the logging, not a proposal as is)
#   ... --config-name experiments/korbi/hybrid_speed/v4b_fsdp_slice_mn5 --no-monitor? (dev queue: one job in flight)
defaults:
  - ../cross_doc_seqs/v4b_learned_cds_sparse_mn5
  - _self_

aux:
  suite: v4b_fsdp_slice
  variant: base
  arm: ${aux.variant}
  only: []
  nodes: 8
  node_check: "off"
  test_root: /gpfs/scratch/ehpc533/hybrid_nucleus/speed/v4b_fsdp_slice
  profile: true

backend:
  megatron:
    # ---- the first block of the main run's stack ----
    num_layers: 18
    hybrid_layer_pattern: "*ENLELELELVELELELE"
    kv_share_layers: [10]
    kv_share_source_layers: [0]
    ckda_branch_kv_source_layers: [0]
    engram_table_size: 811687
    # ---- random init, nothing loaded or saved ----
    load: null
    ckpt_step: null
    exit_on_missing_checkpoint: false
    save: null
    save_interval: null
    save_extra_steps: []
    non_persistent_save_interval: null
    non_persistent_ckpt_type: null
    async_save: false
    use_persistent_ckpt_worker: false
    exit_interval: null
    train_iters: 60
    # ---- one phase at 64k on mock data ----
    phase_transition_iterations: null
    phase_transition_variable_batch: false
    global_batch_size: 32
    data_sampler_reference_dp_size: null
    data_sampler_reference_micro_batch_size: null
    packing_plan_path: null
    packing_plan_boundaries: doc
    packing_plan_at_end: exit
    dataloader_index_bundle: null
    data_args_path: null
    per_split_data_args_path: null
    fixed_valid_data_path: null
    fixed_valid_seq_lengths: null
    mock_data: true
    eval_interval: 1000000
    eval_iters: 0
    wandb_project: null
    wandb_exp_name: null
    # ---- profile (aux.profile): steps 40-41 on four ranks ----
    profile: ${aux.profile}
    use_pytorch_profiler: ${aux.profile}
    profile_step_start: 40
    profile_step_end: 41
    profile_ranks: [0, 5, 18, 31]
    pytorch_profiler_collect_shapes: false

job:
  name: v4b_fsdp_slice_${aux.arm}
  base_output_dir: ${aux.test_root}/${aux.arm}
  start_condition: null
  est_steps: 60
  est_step_time_s: 6.0
  est_startup_min: 8.0
  concurrency_group: acc_debug
  max_active: 1
  concurrency_qos: true
  metadata:
    pool_singleton: null
  log_events: []
  state_events:
    - name: timeout
      transition: ["RUNNING", "TIMEOUT"]
      action: {class_name: FinishAction, reason: "Job timed out"}
    - name: give_up_failed
      transition: [null, FAILED]
      action: {class_name: FinishAction, reason: "failed (speed test: no retry)"}

slurm:
  sbatch:
    nodes: ${aux.nodes}
    time: "00:40:00"
    qos: acc_debug
    account: ehpc533

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.variant: base
        - aux.variant: agg
          backend.megatron.create_all_gather_group: true
        # per-step MoE health logging off (per-layer aux losses, expert viability, sequence aux-loss
        # log, timers to tensorboard): its .item() loops and small all-reduces run at every step end
        - aux.variant: agg_nolog
          backend.megatron.create_all_gather_group: true
          backend.megatron.moe_per_layer_logging: false
          backend.megatron.moe_expert_viability_metrics: false
          backend.megatron.moe_log_seq_aux_loss: false
          backend.megatron.log_timers_to_tensorboard: false
