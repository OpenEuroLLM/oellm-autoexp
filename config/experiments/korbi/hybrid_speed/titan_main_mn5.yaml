# @package _global_
# Upstream torchtitan (main, submodules/torchtitan) twin of the hybrid speed suite's dense
# 130M reference, on one MareNostrum 5 node (4x H100): the recipes of
# oellm_autoexp/titan_recipes/hybrid_speed.py (same model -- 123.6M parameters --, same
# FineWeb-10BT gpt-neox tokens, 4 GPUs x 8 x 4096 tokens per step).
# (titan_dense_mn5.yaml is the older titan-oellm / torchtitan 0.2.1 stack.)
#
# torchtitan main needs a PyTorch nightly: the TitanTraining-main image (aux.image=sif), or
# the hybrid-ep image + a nightly environment on PYTHONPATH (aux.image=venv). The Megatron twin on the same
# data: speed_130M_mn5 arms dense_fineweb / dense_fineweb_mbs16.
#
#   scripts/korbi/mn5_autoexp_bg.sh titan scripts/run_autoexp.py \
#       --config-name experiments/korbi/hybrid_speed/titan_main_mn5
defaults:
  - ../../base
  - /backend: bash
  - /container: marenostrum_hybrid
  - /slurm: marenostrum_ehpc533
  - /sweep: none
  - _self_

aux:
  suite: t4
  arm: dense130m
  hybrid_env: ${oc.env:HYBRID_ENV,/gpfs/projects/ehpc533/users/korbip/hybrid_v019}
  steps: 100
  # sif: the torchtitan image (container/titan/TitanTraining-main.def.in: NGC 26.09 + torch
  # nightly venv, DeepEP/HybridEP, MoonEP, causal_conv1d, TileLang); venv: the hybrid-ep
  # image + the nightly environment copied to $HYBRID_ENV/pylibs_titan_main (interim)
  image: sif
  images:
    sif:
      sif: TitanTraining-main_x86_64_202610170146.sif
      pythonpath: ".:submodules/torchtitan"
    venv:
      sif: MegatronTraining-hybrid-ep_x86_64_202610161948.sif
      pythonpath: ".:submodules/torchtitan:${aux.hybrid_env}/pylibs_titan_main"

backend:
  command: >-
    python -m torch.distributed.run --standalone --nproc-per-node 4 --local-ranks-filter 0
    --role rank --tee 3 -m torchtitan.train --module oellm_autoexp.titan_recipes.hybrid_speed
    --config ${aux.arm} --output-dir ${job.base_output_dir}/out
  env:
    PYTHONPATH: ${aux.images.${aux.image}.pythonpath}
    # NGC puts its own torch's lib directory first on LD_LIBRARY_PATH, which would make a
    # nightly load the image's libtorch (LD_LIBRARY_PATH beats RUNPATH): driver paths only
    # (the nightly finds its CUDA libraries through its wheels' RUNPATH)
    LD_LIBRARY_PATH: "/usr/local/nvidia/lib:/usr/local/nvidia/lib64:/.singularity.d/libs"
    TITAN_STEPS: "${aux.steps}"
    PYTORCH_ALLOC_CONF: "expandable_segments:True"
    TOKENIZERS_PARALLELISM: "false"

job:
  name: ${aux.suite}_titan_${aux.arm}
  base_output_dir: "${oc.env:OUTPUT_DIR,'./output'}/hybrid_speed/${aux.suite}_titan/${aux.arm}"
  array_group: ${aux.suite}_titan
  est_steps: 1
  est_step_time_s: 900
  state_events:
    - name: timeout
      transition: ["RUNNING", "TIMEOUT"]
      action: {class_name: FinishAction, reason: "Job timed out"}

slurm:
  sbatch:
    nodes: 1
    time: "00:25:00"

stage: speed

container:
  image: ${aux.hybrid_env}/container/${aux.images.${aux.image}.sif}

# titan's speed defaults (FSDP2, CUDA graphs, compiled RoPE / SwiGLU / loss, varlen
# attention) and one knob each
sweep:
  type: list
  groups:
    - type: list
      configs:
        - {aux.arm: dense130m}
        - {aux.arm: dense130m_nocg}
        - {aux.arm: dense130m_nocompile}
        - {aux.arm: dense130m_ddp}
        - {aux.arm: dense130m_noreshard}
        - {aux.arm: dense130m_mbs16}
        - {aux.arm: dense130m_flex}
        - {aux.arm: dense130m_flex_flash}
