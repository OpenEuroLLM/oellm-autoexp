# @package _global_
# One selection per B queries on the rowmask head-packed kernel (Megatron 14772f454; H100 one v4b layer on real
# selections at 64k: B16 65 ms, B8 74, B4 84 vs block flex 104, dense 304; s3 quality: B16 +0.0089, B8 +0.0064,
# B4 +0.0049 vs block +0.015, per token +0.0019) end to end: t19j's setup (v4b weights ckpt_eval 46000, finetune,
# phase-2 data at 64k, 64 nodes, profiled on nine ranks); t19j's dense 18.35 / block 15.75 / tok40 17.0 s and t19l's
# per-token ~17.0-17.9 s are the references.
#   ... --pool .../mn5_pool_c136 --config-name experiments/korbi/campaign_3b_hybrid_midtraining/t19m_v4b_trained_sbrm_c136_mn5 \
#       slurm.sbatch.account=cns143 slurm.sbatch.qos=acc_xlarge --yes
defaults:
  - t19j_v4b_trained_speed64_c136_mn5
  - _self_

aux:
  suite: t19m_v4b_trained_sbrm_c136
  test_root: /gpfs/scratch/ehpc533/hybrid_nucleus/campaign_mid/t19m_v4b_trained_sbrm_c136

job:
  name: t19m_speed64_${aux.arm}

sweep:
  type: product
  store_sweep_json: true
  groups:
    - type: list
      configs:
        - aux.variant: pmp_sb16_rm
          aux.data: p2
          aux.ctx: c64k
          aux.seq: 65536
          aux.gbs: 256
          backend.megatron.context_parallel_size: 1
          backend.megatron.page_sparse_selector: page_maxpool
          backend.megatron.page_sparse_per_group: true
          backend.megatron.page_sparse_select_block: 16
          backend.megatron.page_sparse_block_candidates: 0
          backend.megatron.page_sparse_backend: rowmask
          backend.megatron.data_path: null
          backend.megatron.data_args_path: /gpfs/projects/ehpc533/users/korbip/hybrid_v019/data/datamix_v8ml_opt81_8k64k_stage2_mn5.txt
          backend.megatron.eval_iters: 1
        - aux.variant: pmp_sb8_rm
          aux.data: p2
          aux.ctx: c64k
          aux.seq: 65536
          aux.gbs: 256
          backend.megatron.context_parallel_size: 1
          backend.megatron.page_sparse_selector: page_maxpool
          backend.megatron.page_sparse_per_group: true
          backend.megatron.page_sparse_select_block: 8
          backend.megatron.page_sparse_block_candidates: 0
          backend.megatron.page_sparse_backend: rowmask
          backend.megatron.data_path: null
          backend.megatron.data_args_path: /gpfs/projects/ehpc533/users/korbip/hybrid_v019/data/datamix_v8ml_opt81_8k64k_stage2_mn5.txt
          backend.megatron.eval_iters: 1
        - aux.variant: pmp_sb4_rm
          aux.data: p2
          aux.ctx: c64k
          aux.seq: 65536
          aux.gbs: 256
          backend.megatron.context_parallel_size: 1
          backend.megatron.page_sparse_selector: page_maxpool
          backend.megatron.page_sparse_per_group: true
          backend.megatron.page_sparse_select_block: 4
          backend.megatron.page_sparse_block_candidates: 0
          backend.megatron.page_sparse_backend: rowmask
          backend.megatron.data_path: null
          backend.megatron.data_args_path: /gpfs/projects/ehpc533/users/korbip/hybrid_v019/data/datamix_v8ml_opt81_8k64k_stage2_mn5.txt
          backend.megatron.eval_iters: 1
