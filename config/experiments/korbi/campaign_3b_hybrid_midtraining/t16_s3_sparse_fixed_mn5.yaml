# @package _global_
# Sparse-attention audit, Phase B (docs/campaign_3b_hybrid_midtraining.md, 2026-11-18): each method retrained with
# the flaw the reference audit found fixed, on t11's schedule (ctxlen4n_s3 s64k step 1000 -> 3000, validation every
# 500 steps on the same samples; dense reference t8_s3_mtp_quality/base, old arms t11_s3_sparse_fair/*):
#   nsa_adam        -- NSA as in t11 with its own parameters on Adam (page_sparse_selector_adam): the matrix
#                      optimizer moved its zero-initialised gate rows to a fixed norm after one step;
#   csa2_fix        -- entry logits + log 4 and entry keys at their members' RMS (the softmax under-weighted the
#                      compressed context), indexer input detached (code default now), indexer 32 x 128 (V4.1),
#                      selector on Adam;
#   lsa_fix         -- cluster span = window (pool 4 x block 128 = 512) and the reference's visibility (~1000
#                      tokens before the window were unreachable), 8 buckets of 64 tokens, top 32 (2048 tokens);
#   page_maxpool_pg -- page selection per KV group with InfLLM-v2's overlapping max-pooled page scores;
#   dense / page_mean_pg -- the references, on the SAME data.
# Data: the v4b / main-run mix (datamix_v8ml_opt81_8k64k_stage2_mn5.txt, 531 prefixes, all .bin / .idx present
# 2026-11-18, tokenizer-256k-agent like the s3 testbed). The s3 testbed's own mix (flag_decon_v2_agenttok_without_ot)
# broke on 2026-11-16: training-data-collection moved its files into megatron-lm/openeurollm-256k/, 100 of 125
# links dangle. Validation comes from the mix (split 998,2,0), so t16 compares only within itself, not with t11 / t8.
#   ... --pool .../mn5_pool_p264 --config-name experiments/korbi/campaign_3b_hybrid_midtraining/t16_s3_sparse_fixed_mn5 \
#       slurm.sbatch.account=cns144 slurm.sbatch.qos=acc_xehpc --yes
defaults:
  - t11_s3_sparse_fair_mn5
  - _self_

aux:
  suite: t16_s3_sparse_fixed

backend:
  megatron:
    data_args_path: /gpfs/projects/ehpc533/users/korbip/hybrid_v019/data/datamix_v8ml_opt81_8k64k_stage2_mn5.txt

job:
  metadata:
    pool_priority: 60

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.arm: dense
          backend.megatron.page_sparse_selector: null
        - aux.arm: page_mean_pg
          backend.megatron.page_sparse_selector: page_mean
          backend.megatron.page_sparse_per_group: true
        - aux.arm: nsa_adam
          backend.megatron.page_sparse_selector: nsa
          backend.megatron.page_sparse_nsa_block: 32
          backend.megatron.page_sparse_nsa_stride: 16
          backend.megatron.page_sparse_nsa_select_window: 512
          backend.megatron.page_sparse_selector_adam: true
        - aux.arm: csa2_fix
          backend.megatron.page_sparse_selector: csa2
          backend.megatron.page_sparse_compress: 4
          backend.megatron.page_sparse_csa2_topk_entries: 512
          backend.megatron.page_sparse_indexer_heads: 32
          backend.megatron.page_sparse_indexer_dim: 128
          backend.megatron.page_sparse_indexer_loss_coeff: 0.01
          backend.megatron.page_sparse_csa2_entry_bias: 1.3862944
          backend.megatron.page_sparse_csa2_entry_rms: true
          backend.megatron.page_sparse_selector_adam: true
        - aux.arm: lsa_fix
          backend.megatron.page_sparse_selector: lsa
          backend.megatron.page_sparse_lsa_pool: 4
          backend.megatron.page_sparse_lsa_block: 128
          backend.megatron.page_sparse_lsa_buckets: 8
          backend.megatron.page_sparse_lsa_visibility: block
        - aux.arm: page_maxpool_pg
          backend.megatron.page_sparse_selector: page_maxpool
          backend.megatron.page_sparse_per_group: true
          # resumes from its own step-2000 save (host006 was released at step 2539 on 2026-11-18); the other arms
          # start from the shared step-1000 checkpoint
          backend.megatron.load: /gpfs/scratch/ehpc533/hybrid_nucleus/production/t16_s3_sparse_fixed/page_maxpool_pg/ckpt
          backend.megatron.ckpt_step: 2573  # its exit save on host006 (the base config pins step 1000)
          # the base pins the data position to the shared checkpoint's 16000 on every load; a resume must take its own
          # (the 21:24 resume re-trained samples 16000-32000 and its 2500 / 3000 validation is void)
          backend.megatron.diag_consumed_train_samples: 41168  # = 2573 x 16, the checkpoint's own
