# @package _global_
# T3: the trained-variant implementations on frozen v4 where they apply without training (step 3 of the variant
# plan, docs/campaign_3b_hybrid_midtraining.md): LSA zero-shot, NSA's selection branch (pages ranked by the
# mean-compressed blocks' attention mass), hierarchical page selection (coarse groups of 16 pages first), against
# dense / page_mean / quest at a matched ~2.7k-key budget (page 64, window 512, 1 sink page). One MN5 node:
#   scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py \
#       --config-name experiments/korbi/campaign_3b_hybrid_midtraining/t3_sparse_variants_mn5 aux.dev_queue=true --yes
# CSA2 (trained indexer): aux.name=t3_csa2_v4_2ph_8000 aux.policies=csa2:compress=4,topk_entries=512,window=512
#   "aux.args=--tasks nll,retrieval --n 6 --nll-docs 4 --chunk 16384 --train-csa2 96 --indexer-len 65536"
defaults:
  - ../hybrid_speed/kernel_tests_mn5
  - _self_

aux:
  name: t3_sparse_variants_v4_2ph_8000
  export: /gpfs/scratch/ehpc533/hybrid_nucleus/hf_exports/ambitious_v4_2ph_fp8_8000
  out: /gpfs/scratch/ehpc533/hybrid_nucleus/campaign_midtraining/${aux.name}
  docs: /gpfs/projects/ehpc533/users/korbip/data/v8ml-valid/long_64k_text_document
  raw: /gpfs/projects/ehpc533/users/korbip/hybrid_v019/data/downstream/raw.jsonl
  policies: "dense/page_mean:topk=32/quest:topk=32/page_mean:topk=32,hier_group=16,hier_topk=8/quest:topk=32,hier_group=16,hier_topk=8/lsa:topk=32/nsa:topk=32,select_window=512"
  lengths: "65536,131072"
  args: "--tasks nll,retrieval --n 6 --nll-docs 4 --chunk 16384 --parity 0"
  bench: "bash scripts/korbi/campaign_midtraining/run_hf_probe_mn5.sh long_attention_probe.py ${aux.export} ${aux.out} --docs ${aux.docs} --raw ${aux.raw} --policies ${aux.policies} --lengths ${aux.lengths} ${aux.args}"

job:
  name: campaign_mid_${aux.name}
  base_output_dir: "${oc.env:OUTPUT_DIR,'./output'}/campaign_midtraining/${aux.name}"
  est_step_time_s: 7000
  array_group: null
  metadata:
    pool_priority: 30

slurm:
  sbatch:
    time: "02:00:00"
    account: ehpc533
