# @package _global_
# HF exports of the t18_s3_sparse_adapt arms at step 7000 with their sparse attention in the model (config.sparse_attention
# + the trained selector weights: page indexer, D-LSA latent maps, CSA2 compression / indexer), for the parity check
# against Megatron (t22_megatron_fixedvalid / t22_hf_parity) and the long-context evals beyond the 64k training
# length (t22_eval_pack): does a learned selector beat training-free page_maxpool at 256k-1M? (2026-11-21)
#   ... --pool .../mn5_pool_c136 --config-name experiments/korbi/campaign_3b_hybrid_midtraining/t22_hf_export_mn5 \
#       slurm.sbatch.account=cns143 slurm.sbatch.qos=acc_xlarge --yes
defaults:
  - t16_hf_export_mn5
  - _self_

aux:
  name: t22_hf_export_${aux.arm}
  step: 7000
  bench: "bash scripts/korbi/campaign_midtraining/t16_hf_export_mn5.sh ${aux.arm} ${aux.step}"

backend:
  env:
    EXPORT_SUITE: t18_s3_sparse_adapt
    EXPORT_PREFIX: t18a_s3

slurm:
  sbatch:
    exclude: ${oc.exclude_nodes:${oc.env:MN5_EXCLUDE_NODES,/gpfs/projects/ehpc533/users/korbip/hybrid_v019/mn5_exclude_nodes.txt}}

job:
  metadata:
    pool_priority: 45

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.arm: dense
        - aux.arm: page_maxpool_pg
        - aux.arm: page_indexer
        - aux.arm: dlsa
        - aux.arm: csa2_cont
        - aux.arm: pmp_tok
        - aux.arm: dlsa_tok
