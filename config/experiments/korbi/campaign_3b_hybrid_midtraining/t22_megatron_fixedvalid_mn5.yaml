# @package _global_
# Megatron side of the t22 parity check: each t18_s3_sparse_adapt arm's step-7000 checkpoint evaluates the seeded
# 32-sample long_64k subset at 64k as a fixed validation set (load, evaluate, exit; nothing saved), for the HF exports'
# paired check (t22_hf_parity). The arms' sparse settings as trained in t18_s3_sparse_adapt_mn5.
#   ... --pool .../mn5_pool_c136 --config-name experiments/korbi/campaign_3b_hybrid_midtraining/t22_megatron_fixedvalid_mn5 \
#       slurm.sbatch.account=cns143 slurm.sbatch.qos=acc_xlarge --yes
defaults:
  - t16_megatron_fixedvalid_mn5
  - _self_

aux:
  suite: t22_megatron_fixedvalid

backend:
  megatron:
    load: /gpfs/scratch/ehpc533/hybrid_nucleus/production/t18_s3_sparse_adapt/${aux.arm}/ckpt
    ckpt_step: 7000
    train_iters: 7000

job:
  name: t22_megatron_fixedvalid_${aux.arm}
  metadata:
    pool_priority: 45

slurm:
  sbatch:
    exclude: ${oc.exclude_nodes:${oc.env:MN5_EXCLUDE_NODES,/gpfs/projects/ehpc533/users/korbip/hybrid_v019/mn5_exclude_nodes.txt}}

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.arm: dense
          backend.megatron.page_sparse_selector: null
        - aux.arm: page_maxpool_pg
          backend.megatron.page_sparse_selector: page_maxpool
          backend.megatron.page_sparse_per_group: true
        - aux.arm: page_indexer
          backend.megatron.page_sparse_selector: indexer
          backend.megatron.page_sparse_indexer_heads: 16
          backend.megatron.page_sparse_indexer_dim: 64
          backend.megatron.page_sparse_indexer_loss_coeff: 0.01
          backend.megatron.page_sparse_selector_adam: true
        - aux.arm: dlsa
          backend.megatron.page_sparse_selector: lsa
          backend.megatron.page_sparse_lsa_pool: 4
          backend.megatron.page_sparse_lsa_block: 128
          backend.megatron.page_sparse_lsa_buckets: 8
          backend.megatron.page_sparse_lsa_visibility: block
          backend.megatron.page_sparse_lsa_latent: true
          backend.megatron.page_sparse_indexer_loss_coeff: 0.01
          backend.megatron.page_sparse_selector_adam: true
        - aux.arm: csa2_cont
          backend.megatron.page_sparse_selector: csa2
          backend.megatron.page_sparse_compress: 4
          backend.megatron.page_sparse_csa2_topk_entries: 512
          backend.megatron.page_sparse_indexer_heads: 32
          backend.megatron.page_sparse_indexer_dim: 128
          backend.megatron.page_sparse_indexer_loss_coeff: 0.01
          backend.megatron.page_sparse_csa2_entry_bias: 1.3862944
          backend.megatron.page_sparse_csa2_entry_rms: true
          backend.megatron.page_sparse_selector_adam: true
        - aux.arm: pmp_tok
          backend.megatron.page_sparse_selector: page_maxpool
          backend.megatron.page_sparse_per_group: true
          backend.megatron.page_sparse_select_block: 1
          backend.megatron.page_sparse_block_candidates: 0
          backend.megatron.page_sparse_backend: rowmask
