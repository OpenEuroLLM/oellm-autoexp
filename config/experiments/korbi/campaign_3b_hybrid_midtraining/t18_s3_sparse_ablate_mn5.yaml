# @package _global_
# page_maxpool_pg ablations on t16's branch and schedule (step 1000 -> 3000, train_iters 3000: the SAME data as
# t16's dense / page_maxpool_pg arms, so their training and validation losses pair with these):
#   pmp_sb16    -- one selection per 16 queries instead of 64 (inference selects per token: the train / inference gap)
#   pmp_dense0  -- the first attention layer (layer 0, attention-first) dense, the other two sparse
#   pmp_k64     -- 64 selected pages instead of 32 (4.6k keys per query)
#   pmp_p32k64  -- 32-token pages, 64 of them (the same 2048 selected tokens at finer granularity)
#   pmp_w1024 / pmp_w4096 / pmp_w8192 -- local window 1k / 4k / 8k instead of 512 (with 8k every token of a
#                  document <= 8k attends densely as in the 8k phase; only long documents are capped)
#   pmp_tok     -- pure per-token selection in training (NSA kernel, exact; slow) -- the upper bound for tok40
#   pmp_tok40 / pm_tok40 -- per-token selection in training (as at inference): every query its own top 32 among
#                  its 64-query block's 40 most-voted pages (rowmask kernel, 2026-11-20)
#   pm_k64 / pm_sb16 -- page_mean_pg (the faster score) with 64 pages / one selection per 16 queries: does a
#                  cheap change close its long-context retrieval gap to page_maxpool?
#   ... --pool .../mn5_pool_p264 --config-name experiments/korbi/campaign_3b_hybrid_midtraining/t18_s3_sparse_ablate_mn5 \
#       slurm.sbatch.account=cns144 slurm.sbatch.qos=acc_xehpc --yes
defaults:
  - t16_s3_sparse_fixed_mn5
  - _self_

aux:
  suite: t18_s3_sparse_ablate

backend:
  megatron:
    branch_resume_from_save: true
    save_interval: 500
    page_sparse_selector: page_maxpool
    page_sparse_per_group: true

job:
  metadata:
    pool_priority: 40  # below every main-run job (v4b: 150)
  est_step_time_s: 6.0
  state_events:
    - name: retry_node_fail
      transition: [null, NODE_FAIL]
      condition: {class_name: MaxActionFiresCondition, max_fires: 3}
      action: {class_name: RestartAction, reason: "lost its node -- resume", exclude_file: "${slurm.exclude_file}"}
    - name: give_up_node_fail
      transition: [null, NODE_FAIL]
      action: {class_name: FinishAction, reason: "lost its node again"}
    - name: timeout
      transition: ["RUNNING", "TIMEOUT"]
      condition: {class_name: MaxActionFiresCondition, max_fires: 2}
      action: {class_name: RestartAction, reason: "pool run limit -- resume from the exit save"}
    - name: give_up_failed
      transition: [null, FAILED]
      action: {class_name: FinishAction, reason: "failed (no retry)"}

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.arm: pmp_sb16
          backend.megatron.page_sparse_select_block: 16
        # query aggregation (user 2026-11-21): one selection per 8 / 4 queries, between per 16 (+0.009) and per token
        # (+0.002); the LSA paper and DeepSeek V4.1 both select per query token (V4.1's "Reuse" is across layers)
        - aux.arm: pmp_sb8
          backend.megatron.page_sparse_select_block: 8
        - aux.arm: pmp_sb4
          backend.megatron.page_sparse_select_block: 4
        - aux.arm: pmp_dense0
          backend.megatron.page_sparse_dense_layers: [0]
        - aux.arm: pmp_k64
          backend.megatron.page_sparse_topk: 64
        - aux.arm: pmp_p32k64
          backend.megatron.page_sparse_page: 32
          backend.megatron.page_sparse_topk: 64
        - aux.arm: pmp_w1024
          backend.megatron.page_sparse_window: 1024
        - aux.arm: pmp_w4096  # dense up to 4k (most documents), pages beyond: the 64k straggler capped
          backend.megatron.page_sparse_window: 4096
        - aux.arm: pmp_w8192  # dense up to 8k as in the 8k phase, pages beyond
          backend.megatron.page_sparse_window: 8192
        - aux.arm: pm_k64
          backend.megatron.page_sparse_selector: page_mean
          backend.megatron.page_sparse_topk: 64
        - aux.arm: pm_sb16
          backend.megatron.page_sparse_selector: page_mean
          backend.megatron.page_sparse_select_block: 16
        - aux.arm: pmp_tok40  # per-token selection in training: each token its own top 32 of its block's 40
          backend.megatron.page_sparse_select_block: 1
          backend.megatron.page_sparse_block_candidates: 40
          backend.megatron.page_sparse_backend: rowmask
        # the candidate budget between tok40 (+0.013 at 3000, causal first-query candidates) and pure per-token
        # (+0.002): does a larger bounded union recover the per-token quality? (bounded = static list width, memory-safe;
        # 2026-11-21)
        - aux.arm: pmp_tok80
          backend.megatron.page_sparse_select_block: 1
          backend.megatron.page_sparse_block_candidates: 80
          backend.megatron.page_sparse_backend: rowmask
        - aux.arm: pmp_tok128
          backend.megatron.page_sparse_select_block: 1
          backend.megatron.page_sparse_block_candidates: 128
          backend.megatron.page_sparse_backend: rowmask
        - aux.arm: pmp_tok  # pure per-token selection (each query its own top 32 of all pages): tok40's upper bound
          backend.megatron.page_sparse_select_block: 1
          backend.megatron.page_sparse_backend: token
        - aux.arm: pm_tok40
          backend.megatron.page_sparse_selector: page_mean
          backend.megatron.page_sparse_select_block: 1
          backend.megatron.page_sparse_block_candidates: 40
          backend.megatron.page_sparse_backend: rowmask
