# @package _global_
# page_maxpool_pg ablations on t16's branch and schedule (step 1000 -> 3000, train_iters 3000: the SAME data as
# t16's dense / page_maxpool_pg arms, so their training and validation losses pair with these):
#   pmp_sb16    -- one selection per 16 queries instead of 64 (inference selects per token: the train / inference gap)
#   pmp_dense0  -- the first attention layer (layer 0, attention-first) dense, the other two sparse
#   pmp_k64     -- 64 selected pages instead of 32 (4.6k keys per query)
#   pmp_p32k64  -- 32-token pages, 64 of them (the same 2048 selected tokens at finer granularity)
#   ... --pool .../mn5_pool_p264 --config-name experiments/korbi/campaign_3b_hybrid_midtraining/t18_s3_sparse_ablate_mn5 \
#       slurm.sbatch.account=cns144 slurm.sbatch.qos=acc_xehpc --yes
defaults:
  - t16_s3_sparse_fixed_mn5
  - _self_

aux:
  suite: t18_s3_sparse_ablate

backend:
  megatron:
    branch_resume_from_save: true
    save_interval: 500
    page_sparse_selector: page_maxpool
    page_sparse_per_group: true

job:
  metadata:
    pool_priority: 40  # below every main-run job (v4b: 150)
  est_step_time_s: 6.0
  state_events:
    - name: retry_node_fail
      transition: [null, NODE_FAIL]
      condition: {class_name: MaxActionFiresCondition, max_fires: 3}
      action: {class_name: RestartAction, reason: "lost its node -- resume", exclude_file: "${slurm.exclude_file}"}
    - name: give_up_node_fail
      transition: [null, NODE_FAIL]
      action: {class_name: FinishAction, reason: "lost its node again"}
    - name: timeout
      transition: ["RUNNING", "TIMEOUT"]
      condition: {class_name: MaxActionFiresCondition, max_fires: 2}
      action: {class_name: RestartAction, reason: "pool run limit -- resume from the exit save"}
    - name: give_up_failed
      transition: [null, FAILED]
      action: {class_name: FinishAction, reason: "failed (no retry)"}

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.arm: pmp_sb16
          backend.megatron.page_sparse_select_block: 16
        - aux.arm: pmp_dense0
          backend.megatron.page_sparse_dense_layers: [0]
        - aux.arm: pmp_k64
          backend.megatron.page_sparse_topk: 64
        - aux.arm: pmp_p32k64
          backend.megatron.page_sparse_page: 32
          backend.megatron.page_sparse_topk: 64
