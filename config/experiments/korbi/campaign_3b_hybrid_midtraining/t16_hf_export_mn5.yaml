# @package _global_
# HF exports of the six t16 arms at step 3000 with their sparse attention in the model (config.sparse_attention, the
# trained selector weights; oellm_ambitious/sparse_attention.py), for the parity check against Megatron and the
# long-context evals (docs/campaign_3b_hybrid_midtraining.md). One MN5 node per arm
# (scripts/korbi/campaign_midtraining/t16_hf_export_mn5.sh):
#   ... --pool .../mn5_pool_p264 --config-name experiments/korbi/campaign_3b_hybrid_midtraining/t16_hf_export_mn5 \
#       slurm.sbatch.account=cns144 slurm.sbatch.qos=acc_xehpc --yes
defaults:
  - ../hybrid_speed/kernel_tests_mn5
  - _self_

aux:
  name: t16_hf_export_${aux.arm}
  arm: dense
  only: []
  bench: "bash scripts/korbi/campaign_midtraining/t16_hf_export_mn5.sh ${aux.arm} 3000"

job:
  name: campaign_mid_${aux.name}
  base_output_dir: "${oc.env:OUTPUT_DIR,'./output'}/campaign_midtraining/${aux.name}"
  est_step_time_s: 1800
  array_group: null

slurm:
  sbatch:
    time: "01:00:00"

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.arm: dense
        - aux.arm: page_mean_pg
        - aux.arm: page_maxpool_pg
        - aux.arm: lsa_fix
        - aux.arm: csa2_fix
        - aux.arm: nsa_adam
