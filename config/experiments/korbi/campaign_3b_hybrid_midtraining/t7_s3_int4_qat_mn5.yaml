# @package _global_
# INT4 quantization-aware training of the routed experts at s3: the step-5 dense arm (dense attention, the expert
# weights all-gathered through FP8) with the expert all-gather through INT4 instead (fsdp_param_gather_format int4:
# symmetric, one fp32 scale per 128 elements -- the forward runs on INT4 experts, the W4A16 deployment format),
# 500 steps from the dense ctxlen4n_s3 s64k checkpoint on the same data. Scored by t7_s3_int4_eval_mn5 against
# the dense arm with FP8 gather and the dense arm's weights rounded to INT4 without training.
#   ... --pool .../mn5_pool_p264 --config-name experiments/korbi/campaign_3b_hybrid_midtraining/t7_s3_int4_qat_mn5 --yes
defaults:
  - t5_s3_sparse_branch_mn5
  - _self_

aux:
  suite: t7_s3_int4
  arm: int4_qat

backend:
  megatron:
    page_sparse_selector: null
    fsdp_param_gather_format: int4

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.arm: int4_qat
