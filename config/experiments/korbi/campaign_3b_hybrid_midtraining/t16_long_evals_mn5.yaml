# @package _global_
# Long-context evals of the six t16 arms at step 3000 with their sparse attention active (HF exports,
# oellm_ambitious/sparse_attention.py): per-position NLL on long held-out documents and multi-document QA (a question
# on a passage far back / in the middle / near the end of 8k-64k contexts). One MN5 node per (arm, task), after the
# arm's export was checked (scripts/korbi/campaign_midtraining/t16_long_evals_mn5.sh):
#   ... --pool .../mn5_pool_p264 --config-name experiments/korbi/campaign_3b_hybrid_midtraining/t16_long_evals_mn5 \
#       slurm.sbatch.account=cns144 slurm.sbatch.qos=acc_xehpc --yes
defaults:
  - ../hybrid_speed/kernel_tests_mn5
  - _self_

aux:
  name: t16_${aux.task}_${aux.arm}
  arm: dense
  task: nll
  only: []
  bench: "bash scripts/korbi/campaign_midtraining/t16_long_evals_mn5.sh ${aux.arm} ${aux.task} 3000"

job:
  name: campaign_mid_${aux.name}
  base_output_dir: "${oc.env:OUTPUT_DIR,'./output'}/campaign_midtraining/${aux.name}"
  est_step_time_s: 7200
  array_group: null
  start_condition:  # the arm's HF parity score (t16_hf_parity_mn5: the export loads and scores 64k samples)
    class_name: FileExistsCondition
    path: /gpfs/scratch/ehpc533/hybrid_nucleus/campaign_midtraining/t16_parity/results/hf_${aux.arm}_3000.json
    persistent_pass: true

slurm:
  sbatch:
    time: "08:00:00"
    # the fleet's bad-node list (kernel_tests_mn5 jobs carry none; 2026-11-19 parity jobs died on as02r1b15)
    exclude: ${oc.exclude_nodes:${oc.env:MN5_EXCLUDE_NODES,/gpfs/projects/ehpc533/users/korbip/hybrid_v019/mn5_exclude_nodes.txt}}

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}_\\${aux.task}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.arm: dense
        - aux.arm: page_mean_pg
        - aux.arm: page_maxpool_pg
        - aux.arm: lsa_fix
        - aux.arm: csa2_fix
        - aux.arm: nsa_adam
    - type: list
      configs:
        - aux.task: nll
        - aux.task: mdqa
        - aux.task: mdqa3
        - aux.task: retr
        - aux.task: retr_tok
        - aux.task: mdqa3_tok
        - aux.task: nll_long
        - aux.task: nll_long_tok
        - aux.task: mdqa3_128k
        - aux.task: mdqa3_128k_tok
        - aux.task: mdqa3_256k
        - aux.task: mdqa3_256k_tok
        - aux.task: retr_long
        - aux.task: retr_long_tok
