  - r0_r2_router_probe_mn5
  - _self_

aux:
  name: r3_v4_2ph_hd256_21000
  export: /gpfs/scratch/ehpc533/hybrid_nucleus/hf_exports/ambitious_v4_2ph_hd256_fp8_21000
