# @package _global_
# Sparse attention speed / memory at v4's 64k phase shape on the production stack (hybrid_v4_hd256_test_mn5's
# s256_64k: Megatron-FSDP, EP 4, MoonEP, head dim 256, gated GQA + qk norm + XSA, real documents from the capspeed
# mix, fresh init; 2 nodes, 8 routed experts, Engram 1/16), 20 steps: TE's dense attention (the production path)
# against page_mean / quest / window with block-wise selection (64 queries) through one packed flex call
# (page 64, window 512, 1 sink page, 32 pages). Caveat: 8 of 360 experts make the MoE share small, so attention's
# share of the step -- and any sparse saving -- is larger here than in the main run.
#   ... --pool .../mn5_pool_p264 --config-name experiments/korbi/campaign_3b_hybrid_midtraining/t9_v4_sparse_speed_mn5 --yes
defaults:
  - ../production/hybrid_v4_hd256_test_mn5
  - _self_

aux:
  suite: t9_v4_sparse_speed
  arm: dense
  only: []
  seq: 65536
  gbs: 8
  test_root: /gpfs/scratch/ehpc533/users/korbip/tmp/t9_v4_sparse_speed

backend:
  megatron:
    micro_batch_size: 1
    kv_channels: 256
    phase_transition_iterations: null
    phase_transition_variable_batch: false
    save: null
    save_interval: null
    exit_interval: 20
    page_sparse_page: 64
    page_sparse_topk: 32
    page_sparse_window: 512
    page_sparse_sink_pages: 1
    page_sparse_select_block: 64
    page_sparse_flex_q_block: 64
    page_sparse_backend: flex  # one packed flex call per layer: Megatron's default since b99388935

job:
  name: t9_v4_sparse_speed_${aux.arm}
  est_step_time_s: 30.0

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.arm: dense
          backend.megatron.page_sparse_selector: null
        - aux.arm: page_mean
          backend.megatron.page_sparse_selector: page_mean
        - aux.arm: quest
          backend.megatron.page_sparse_selector: quest
        - aux.arm: window
          backend.megatron.page_sparse_selector: window
