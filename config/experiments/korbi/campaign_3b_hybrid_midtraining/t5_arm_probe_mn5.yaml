# @package _global_
# Step-5 retrieval / NLL of every trained arm with its own attention (t5_s3_sparse_branch_mn5, step 1500): HF export,
# the arm's trained NSA / CSA2 parameters, long_attention_probe.py at 64k with the arm's policy (block-wise selection
# as trained, per-token selection in decode and on the prompt's last 128 tokens), 16 questions per task, 4 long
# documents (scripts/korbi/campaign_midtraining/t5_arm_probe_mn5.sh). One MN5 node per arm, after the arm finished:
#   ... --config-name experiments/korbi/campaign_3b_hybrid_midtraining/t5_arm_probe_mn5 ["aux.only=[nsa,csa2]"] --yes
defaults:
  - ../hybrid_speed/kernel_tests_mn5
  - _self_

aux:
  name: t5_probe_${aux.arm}
  arm: dense
  policy: dense
  only: []
  bench: "bash scripts/korbi/campaign_midtraining/t5_arm_probe_mn5.sh ${aux.arm} '${aux.policy}'"

job:
  name: campaign_mid_${aux.name}
  base_output_dir: "${oc.env:OUTPUT_DIR,'./output'}/campaign_midtraining/${aux.name}"
  est_step_time_s: 3600
  array_group: null

slurm:
  sbatch:
    time: "01:30:00"
    account: ehpc533

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.arm: dense
          aux.policy: "dense"
        - aux.arm: window
          aux.policy: "window"
        - aux.arm: page_mean
          aux.policy: "page_mean:topk=32,select_block=64,decode=token,tail=128"
        - aux.arm: quest
          aux.policy: "quest:topk=32,select_block=64,decode=token,tail=128"
        - aux.arm: page_mean_pg
          aux.policy: "page_mean:topk=32,per_group=1,select_block=64,decode=token,tail=128"
        - aux.arm: page_mean_shared
          aux.policy: "page_mean:topk=32,share=1,select_block=64,decode=token,tail=128"
        - aux.arm: nsa
          aux.policy: "nsa:block=32,stride=16,page=64,topk=32,sink_pages=1,select_window=512,window=512,select_block=64,decode=token,tail=128"
        - aux.arm: csa2
          aux.policy: "csa2:compress=4,topk_entries=512,window=512,page=64,sink_pages=1,select_block=64,decode=token,tail=128"
        - aux.arm: lsa
          aux.policy: "lsa:pool=4,block=512,buckets=32,topk=32,window=512,page=64,sink_pages=1,select_block=64,decode=token,tail=128"
        - aux.arm: lsa_fine
          aux.policy: "lsa:pool=4,block=512,buckets=128,topk=128,window=512,page=64,sink_pages=1,select_block=64,decode=token,tail=128"
