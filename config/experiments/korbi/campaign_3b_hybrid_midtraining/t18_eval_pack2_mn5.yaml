    dense:real_inf256k page_maxpool_pg:real_inf256k_tok lsa_fix:real_inf256k_tok page_mean_pg:real_inf256k_tok
    dense_as_page_maxpool_pg:real_inf256k_tok
    dense:e2e page_maxpool_pg:e2e_tok lsa_fix:e2e_tok
    dense:real_inf128k page_maxpool_pg:real_inf128k_tok lsa_fix:real_inf128k_tok page_mean_pg:real_inf128k_tok
    dense_as_page_maxpool_pg:real_inf128k_tok
    dense:real64 page_maxpool_pg:real64_tok lsa_fix:real64_tok page_mean_pg:real64_tok dense_as_page_maxpool_pg:real64_tok
    dense:real_nqa64 page_maxpool_pg:real_nqa64_tok lsa_fix:real_nqa64_tok page_mean_pg:real_nqa64_tok
