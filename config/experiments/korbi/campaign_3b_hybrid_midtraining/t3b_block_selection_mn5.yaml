# @package _global_
# T3b: block-wise vs per-token page selection on frozen v4 (page_sparse select_block: one selection per block of
# 64 queries, made by its first query; the speed path, see T4 in docs/campaign_3b_hybrid_midtraining.md), page 64,
# window 512, 1 sink page, 32 pages. One MN5 node:
#   scripts/korbi/mn5_autoexp.sh scripts/run_autoexp.py \
#       --config-name experiments/korbi/campaign_3b_hybrid_midtraining/t3b_block_selection_mn5 aux.dev_queue=true --yes
defaults:
  - t3_sparse_variants_mn5
  - _self_

aux:
  name: t3b_block_selection_v4_2ph_8000
  policies: "page_mean:topk=32,select_block=64/quest:topk=32,select_block=64/page_mean:topk=32,hier_group=16,hier_topk=8,select_block=64/oracle:topk=32,select_block=64/oracle:topk=32"
