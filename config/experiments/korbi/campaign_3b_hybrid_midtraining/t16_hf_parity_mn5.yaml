# @package _global_
# HF side of the t16 parity check (scripts/korbi/campaign_midtraining/t16_hf_parity_mn5.sh): each arm's step-3000 HF
# export with its sparse attention scores a seeded 32-sample subset of v8ml-valid/long_64k at 64k (paired_valid_check),
# the samples t16_megatron_fixedvalid_mn5 scores in Megatron. One MN5 node per arm, after its export was checked:
#   ... --pool .../mn5_pool_p264 --config-name experiments/korbi/campaign_3b_hybrid_midtraining/t16_hf_parity_mn5 \
#       slurm.sbatch.account=cns144 slurm.sbatch.qos=acc_xehpc --yes
defaults:
  - ../hybrid_speed/kernel_tests_mn5
  - _self_

aux:
  name: t16_hf_parity_${aux.arm}
  arm: dense
  only: []
  bench: "bash scripts/korbi/campaign_midtraining/t16_hf_parity_mn5.sh ${aux.arm} 3000"

job:
  name: campaign_mid_${aux.name}
  base_output_dir: "${oc.env:OUTPUT_DIR,'./output'}/campaign_midtraining/${aux.name}"
  est_step_time_s: 3600
  array_group: null
  start_condition:  # the arm's checked export (t16_hf_export_mn5)
    class_name: FileExistsCondition
    path: /gpfs/scratch/ehpc533/hybrid_nucleus/hf_exports/t16_s3_${aux.arm}_3000/.check_done
    persistent_pass: true

slurm:
  sbatch:
    time: "02:00:00"
    # the fleet's bad-node list (kernel_tests_mn5 jobs carry none; 2026-11-19 parity jobs died on as02r1b15)
    exclude: ${oc.exclude_nodes:${oc.env:MN5_EXCLUDE_NODES,/gpfs/projects/ehpc533/users/korbip/hybrid_v019/mn5_exclude_nodes.txt}}

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.arm: dense
        - aux.arm: page_mean_pg
        - aux.arm: page_maxpool_pg
        - aux.arm: lsa_fix
        - aux.arm: csa2_fix
        - aux.arm: nsa_adam
