# @package _global_
# Pure per-token path's memory vs dense on one H100 (scripts/korbi/campaign_midtraining/token_memory_bench.py): one
# v4b attention layer (16 / 2 heads, head dim 256) fwd + bwd on a single 64k document and phase-2 layouts (median /
# most documents / most long documents), each in a fresh process: PyTorch peak above the inputs, non-PyTorch growth
# (local memory of spilled kernels), time; then the head-packed kernels' launch configs (regs / spills / time). First
# the sparse kernel tests (head-packed at head dim 256, packed selection exactness).
defaults:
  - ../hybrid_speed/kernel_tests_mn5
  - _self_

aux:
  name: t20_token_memory
  evals: /gpfs/scratch/ehpc533/hybrid_nucleus/campaign_midtraining/t18_evals
  out: /gpfs/scratch/ehpc533/hybrid_nucleus/campaign_midtraining/t20_token_memory
  probe: /gpfs/scratch/ehpc533/hybrid_nucleus/campaign_midtraining/t20_token_union_probe2
  configs: "--configs"
  tag: ""
  tests: "tests/unit_tests/transformer/test_rowmask_attention.py tests/unit_tests/transformer/test_page_sparse_attention.py"
  bench: >-
    mkdir -p ${aux.out} && cd submodules/Megatron-LM
    && python ../../scripts/korbi/campaign_midtraining/token_memory_bench.py --seqs ${aux.evals}/seqs_64k.json
    --layouts single,mid,long_tail,many ${aux.configs} --out ${aux.out}/memory${aux.tag}.json
    && python ../../scripts/korbi/campaign_midtraining/token_replay_bench.py --tiles 16 --steps 3
    --lists ${aux.probe}/v4b/lists_64k_doc0.pt --layers 4 --out ${aux.out}/replay${aux.tag}.json

job:
  name: campaign_mid_${aux.name}
  base_output_dir: "${oc.env:OUTPUT_DIR,'./output'}/campaign_midtraining/${aux.name}"
  est_step_time_s: 2400
  array_group: null
  metadata:
    pool_priority: 45

slurm:
  sbatch:
    time: "01:30:00"
    exclude: ${oc.exclude_nodes:${oc.env:MN5_EXCLUDE_NODES,/gpfs/projects/ehpc533/users/korbip/hybrid_v019/mn5_exclude_nodes.txt}}
