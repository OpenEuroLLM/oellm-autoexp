# @package _global_
# Does a learned selector catch up with training? (docs/campaign_3b_hybrid_midtraining.md, 2026-11-19): t16's
# branch (ctxlen4n_s3 s64k step 1000, v8ml mix, page 64 / top 32 / window 512 / select_block 64, flex) run to step
# 7000 instead of 3000 (constant lr: only more steps), all arms on the SAME data (train_iters 7000 orders it):
#   dense / page_maxpool_pg   -- the reference and the recommended parameter-free selector;
#   csa2_fix                  -- the learned lightning indexer on compressed entries (t16: gap -0.035 in 2000 steps);
#   page_indexer              -- a learned page selector (PageIndexer, KL to the dense attention's page mass): the
#                                page path with a learning signal for the pages it misses;
#   dlsa                      -- LSA in a learned latent space (D-LSA: per-KV-group key / query maps, KL per bucket).
# 4 nodes per arm, ~4-6 s per step; the pool's 8 h run limit is crossed with exit saves + RestartAction, and
# branch_resume_from_save makes a restart resume the arm's own save (not the branch point).
#   ... --pool .../mn5_pool_p264 --config-name experiments/korbi/campaign_3b_hybrid_midtraining/t18_s3_sparse_adapt_mn5 \
#       slurm.sbatch.account=cns144 slurm.sbatch.qos=acc_xehpc --yes
defaults:
  - t16_s3_sparse_fixed_mn5
  - _self_

aux:
  suite: t18_s3_sparse_adapt

backend:
  megatron:
    train_iters: 7000
    exit_interval: 7000
    eval_interval: 500
    save_interval: 500
    branch_resume_from_save: true

job:
  metadata:
    pool_priority: 40  # below every main-run job (v4b: 150)
  est_step_time_s: 6.0
  state_events:
    - name: retry_node_fail
      transition: [null, NODE_FAIL]
      condition: {class_name: MaxActionFiresCondition, max_fires: 3}
      action: {class_name: RestartAction, reason: "lost its node -- resume", exclude_file: "${slurm.exclude_file}"}
    - name: give_up_node_fail
      transition: [null, NODE_FAIL]
      action: {class_name: FinishAction, reason: "lost its node again"}
    - name: timeout
      transition: ["RUNNING", "TIMEOUT"]
      condition: {class_name: MaxActionFiresCondition, max_fires: 6}
      action: {class_name: RestartAction, reason: "pool run limit -- resume from the exit save"}
    - name: timeout_completing
      transition: ["COMPLETING", "TIMEOUT"]
      condition: {class_name: MaxActionFiresCondition, max_fires: 6}
      action: {class_name: RestartAction, reason: "pool run limit -- resume from the exit save"}
    - name: give_up_failed
      transition: [null, FAILED]
      action: {class_name: FinishAction, reason: "failed (no retry)"}

slurm:
  sbatch:
    time: "08:00:00"

sweep:
  type: product
  store_sweep_json: true
  filter: "\\${oc.eval:'len(\\${aux.only}) == 0 or \"\\${aux.arm}\" in \\${aux.only}'}"
  groups:
    - type: list
      configs:
        - aux.arm: dense
          backend.megatron.page_sparse_selector: null
        - aux.arm: page_maxpool_pg
          backend.megatron.page_sparse_selector: page_maxpool
          backend.megatron.page_sparse_per_group: true
        - aux.arm: csa2_fix
          backend.megatron.page_sparse_selector: csa2
          backend.megatron.page_sparse_compress: 4
          backend.megatron.page_sparse_csa2_topk_entries: 512
          backend.megatron.page_sparse_indexer_heads: 32
          backend.megatron.page_sparse_indexer_dim: 128
          backend.megatron.page_sparse_indexer_loss_coeff: 0.01
          backend.megatron.page_sparse_csa2_entry_bias: 1.3862944
          backend.megatron.page_sparse_csa2_entry_rms: true
          backend.megatron.page_sparse_selector_adam: true
        - aux.arm: page_indexer
          backend.megatron.page_sparse_selector: indexer
          backend.megatron.page_sparse_indexer_heads: 16
          backend.megatron.page_sparse_indexer_dim: 64
          backend.megatron.page_sparse_indexer_loss_coeff: 0.01
          backend.megatron.page_sparse_selector_adam: true
        - aux.arm: dlsa
          backend.megatron.page_sparse_selector: lsa
          backend.megatron.page_sparse_lsa_pool: 4
          backend.megatron.page_sparse_lsa_block: 128
          backend.megatron.page_sparse_lsa_buckets: 8
          backend.megatron.page_sparse_lsa_visibility: block
          backend.megatron.page_sparse_lsa_latent: true
          backend.megatron.page_sparse_indexer_loss_coeff: 0.01
          backend.megatron.page_sparse_selector_adam: true
