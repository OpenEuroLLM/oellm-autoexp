# @package _global_
# page_maxpool_pg after the batched selection (Megatron 8d470b7f9: every document's anchors scored against every page
# in one pass, no per-document / per-group loops; CPU launch per call 10 x 3.2k docs 18.1 -> 4.1 ms locally). t19f
# (per-document selection) as the reference: 64k long_64k dense 18.2 / pmp 17.8 s, phase-2 dense 18.25 / pmp 15.8 s,
# 128k dense 24.0 / pmp 19.85 s. The long_64k 64k arm is profiled on EVERY rank (no shapes) to name any straggler that
# is left (replaces t19h, which would have profiled the old code); the 128k arm unprofiled (t19f's OOM'd at the
# profiled step).
#   ... --pool .../mn5_pool_c136 --config-name experiments/korbi/campaign_3b_hybrid_midtraining/t19i_v4b_sparse_batchsel_c136_mn5 \
#       slurm.sbatch.account=cns143 slurm.sbatch.qos=acc_xlarge --yes
defaults:
  - t19f_v4b_sparse_speed64_syncfix_c136_mn5
  - _self_

aux:
  suite: t19i_v4b_sparse_batchsel_c136
  test_root: /gpfs/scratch/ehpc533/hybrid_nucleus/campaign_mid/t19i_v4b_sparse_batchsel_c136

backend:
  env:
    TORCH_LOGS: ""
  megatron:
    pytorch_profiler_collect_shapes: false

job:
  name: t19i_speed64_${aux.arm}

sweep:
  type: product
  store_sweep_json: true
  groups:
    - type: list
      configs:
        - aux.variant: page_maxpool_pg
          aux.data: long64k
          aux.ctx: c64k
          aux.seq: 65536
          aux.gbs: 256
          backend.megatron.context_parallel_size: 1
          backend.megatron.page_sparse_selector: page_maxpool
          backend.megatron.page_sparse_per_group: true
          backend.megatron.profile_ranks: []
        - aux.variant: page_maxpool_pg
          aux.data: p2
          aux.ctx: c64k
          aux.seq: 65536
          aux.gbs: 256
          backend.megatron.context_parallel_size: 1
          backend.megatron.page_sparse_selector: page_maxpool
          backend.megatron.page_sparse_per_group: true
          backend.megatron.data_path: null
          backend.megatron.data_args_path: /gpfs/projects/ehpc533/users/korbip/hybrid_v019/data/datamix_v8ml_opt81_8k64k_stage2_mn5.txt
          backend.megatron.eval_iters: 1
        - aux.variant: page_maxpool_pg
          aux.data: long64k
          aux.ctx: c128k
          aux.seq: 131072
          aux.gbs: 128
          backend.megatron.context_parallel_size: 2
          backend.megatron.page_sparse_selector: page_maxpool
          backend.megatron.page_sparse_per_group: true
          backend.megatron.profile: false
          backend.megatron.use_pytorch_profiler: false
