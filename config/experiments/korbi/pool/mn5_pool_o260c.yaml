# @package _global_
# MareNostrum 5 opportunistic pool host (user 2026-10-29): 260 nodes on cns144 / acc_xehpc, a 24-h limit
# (more chances to start in a backfill gap than a 3-day host; queue age builds while it waits). When
# it starts, a main run moves here (`pool_ctl cancel` in its pool + an enqueue of the same job.name;
# the singleton guard spans pools), or speed tests / packed experiments use it; released after 1 h
# idle. Cancel the queued host when it is no longer wanted.
#   python scripts/run_autoexp.py --no-monitor --monitor-state-dir $R/pool_state \
#       --config-name experiments/korbi/pool/mn5_pool_o260c
defaults:
  - /backend: pool_host
  - /slurm: marenostrum_autoexclude_pool_host
  - /job: pool_host
  - /sweep: none
  - _self_

job:
  name: mn5_pool_o260c
  base_output_dir: ${oc.env:HYBRID_OUTPUT_DIR,/gpfs/scratch/ehpc533/hybrid_nucleus}/pools/${job.name}
  pool_host:
    max_hosts_running: 1
    max_own_hosts: 1
    max_runs_per_host: 6
    keep_pending: 0
    min_hosts: 1
    handover: false
    idle_exit_s: 3600
    monitor_dead_exit_s: 3600
    min_remaining_s: 3600
    stop_grace_s: 1800
    preempt_grace_s: 2700
    max_attempts: 20
    host_stale_s: 1800
    poll_s: 30
    keep_monitor: true

slurm:
  sbatch:
    nodes: 260
    time: "1-00:00:00"
    qos: acc_xehpc
    account: cns144
    signal: "B:USR1@2700"
    no_kill: true

index: 0
stage: ""
