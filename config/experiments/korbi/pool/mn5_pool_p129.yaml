# @package _global_
# MareNostrum 5 production pool, 129-node hosts on ehpc533 / acc_xehpc (docs/sub_slurm_jobs_operations.md;
# user 2026-10-27): always one host submitted (min_hosts 1) and, with work, one successor
# aging in the queue without a dependency (keep_pending 1); runs move to a newer allocation
# (handover, not before the old one is 6 h old). One spare node (--no-kill): a node failure
# restarts the run inside the allocation. For the full-size speed tests (LDM vs mHC-4) first,
# then the main runs (128 nodes); queued cns144 jobs can be adopted (pool_ctl adopt, 128
# nodes, no spare). B:USR1 45 min before the 3-day wall: the run saves (its own exit signal).
#   python scripts/run_autoexp.py --no-monitor --monitor-state-dir $R/pool_state \
#       --config-name experiments/korbi/pool/mn5_pool_p129
defaults:
  - /backend: pool_host
  - /slurm: marenostrum_autoexclude_pool_host
  - /job: pool_host
  - /sweep: none
  - _self_

job:
  name: mn5_pool_p129
  base_output_dir: ${oc.env:HYBRID_OUTPUT_DIR,/gpfs/scratch/ehpc533/hybrid_nucleus}/pools/${job.name}
  pool_host:
    # CAPTURE (user 2026-10-31): a host that starts is never released by the pool -- not idle,
    # not without fitting work, not when its monitor is away; a main run's copy queued here takes it
    hold_hosts: true
    # main runs move to cns144 hosts at the same node count (singleton preference)
    singleton_prefer_accounts: cns144
    # node check of every new host before it takes work (user 2026-10-30): GPU count, then the
    # node-health benchmark (oellm_autoexp/node_health); bad nodes excluded, a failing host released
    preflight: true
    preflight_gpus_per_node: 4
    preflight_check: experiments/korbi/pool/node_health_mn5
    # with handover: the old host stays until the moved run logged 20 iterations on the new one
    handover_verify: true
    handover_healthy_steps: 20
    handover_verify_timeout_s: 5400
    max_hosts_running: 1
    keep_pending: 1
    min_hosts: 1
    handover: true
    handover_min_age_s: 21600
    successor_delay_s: 0
    idle_exit_s: 600
    # 3 days with hold_hosts: hosts queued before the hold fix run a supervisor whose dead-man
    # switch ignores the hold
    monitor_dead_exit_s: 259200
    min_remaining_s: 3600
    stop_grace_s: 1800
    preempt_grace_s: 2700
    max_attempts: 20
    host_stale_s: 1800
    poll_s: 30
    adopt_stop_margin_s: 2700
    adopt_hook_timeout_s: 90

slurm:
  sbatch:
    nodes: 129
    time: "3-00:00:00"
    qos: acc_xehpc
    signal: "B:USR1@2700"
    no_kill: true

index: 0
stage: ""
