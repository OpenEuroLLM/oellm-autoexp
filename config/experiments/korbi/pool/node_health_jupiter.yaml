# @package _global_
# Node-health check of a JUPITER allocation (oellm_autoexp/node_health: GPU matmul, FSDP-like collectives per GPU
# index, node ring), the JUPITER twin of node_health_mn5. Preflight check of jupiter_pool_amb84
# (job.pool_host.preflight_check: experiments/korbi/pool/node_health_jupiter); account / partition are set to the pool
# host's when the pool enqueues it. On its own (login node, a 1-node allocation):
#   cd ~/work/Projects/oellm-autoexp-hybrid && PYTHONPATH=. .venv/bin/python scripts/run_autoexp.py --yes \
#       --config-name experiments/korbi/pool/node_health_jupiter slurm.sbatch.nodes=1
defaults:
  - ../../base
  - /backend: node_health
  - /container: jupiter
  - /slurm: jupiter
  - /sweep: none
  - _self_

backend:
  nproc_per_node: ${slurm.sbatch.gpus_per_node}
  env:
    PYTHONPATH: "."
    TRITON_LIBCUDA_PATH: /.singularity.d/libs

job:
  name: node_health
  base_output_dir: /e/fscratch/e-sta-openeurollm/poeppel1/ambitious84/node_health
  est_steps: 1
  est_step_time_s: 120

slurm:
  sbatch:
    nodes: 1
    time: "00:15:00"
    account: e-sta-openeurollm
    partition: booster

stage: test

container:
  # the 84B stack's image (TE 2.18: DTensor-aware FusedAdam state)
  image: /e/project1/e-sta-openeurollm/container/MegatronTraining-JUPITER-te218-fa3_aarch64_202608280932.sif
