# @package _global_
# MareNostrum 5 production pool, 132-node hosts on ehpc533 / acc_xehpc (user 2026-10-28): one host
# submitted at once so it ages in the queue (min_hosts 1, no successor of its own), 4 spare nodes for
# the 128-node main runs (cns144 47998967 started with exactly 128 and one dead-GPU node, so no
# 128-node run fit). The monitor stays up without work (keep_monitor); when the host starts, a main
# run moves here by `pool_ctl cancel` in its pool and an enqueue of the same job.name here (the
# singleton guard spans pools).
#   python scripts/run_autoexp.py --no-monitor --monitor-state-dir $R/pool_state \
#       --config-name experiments/korbi/pool/mn5_pool_p132
defaults:
  - /backend: pool_host
  - /slurm: marenostrum_autoexclude_pool_host
  - /job: pool_host
  - /sweep: none
  - _self_

job:
  name: mn5_pool_p132
  base_output_dir: ${oc.env:HYBRID_OUTPUT_DIR,/gpfs/scratch/ehpc533/hybrid_nucleus}/pools/${job.name}
  pool_host:
    # CAPTURE (user 2026-10-31): a host that starts is never released by the pool -- not idle,
    # not without fitting work, not when its monitor is away; a main run's copy queued here takes it
    hold_hosts: true
    # main runs move to cns144 hosts at the same node count (singleton preference)
    singleton_prefer_accounts: cns144
    # node check of every new host before it takes work (user 2026-10-30): GPU count, then the
    # node-health benchmark (oellm_autoexp/node_health); bad nodes excluded, a failing host released
    preflight: true
    preflight_gpus_per_node: 4
    preflight_check: experiments/korbi/pool/node_health_mn5
    # with handover: the old host stays until the moved run logged 20 iterations on the new one
    handover_verify: true
    handover_healthy_steps: 20
    handover_verify_timeout_s: 5400
    max_hosts_running: 1
    max_own_hosts: 2
    max_runs_per_host: 6
    # one successor, queued a day after the host starts (a staggered ladder of 128+ node hosts)
    keep_pending: 1
    successor_delay_s: 86400
    min_hosts: 1
    handover: false
    idle_exit_s: 3600
    # 3 days (the host's wall time), 2026-10-30: host001 (48161468) is held (pool_ctl hold) but
    # runs a supervisor from before the hold fix, whose dead-man switch would still release it
    # when idle with the monitor away; back to 3600 once 48161468 has ended
    monitor_dead_exit_s: 259200
    min_remaining_s: 3600
    stop_grace_s: 1800
    preempt_grace_s: 2700
    max_attempts: 20
    host_stale_s: 1800
    poll_s: 30
    keep_monitor: true

slurm:
  sbatch:
    nodes: 132
    time: "3-00:00:00"
    qos: acc_xehpc
    signal: "B:USR1@2700"
    no_kill: true

index: 0
stage: ""
