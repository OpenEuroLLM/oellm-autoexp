# @package _global_
# MareNostrum 5 handover smoke pool (docs/sub_slurm_jobs_operations.md): 2-node hosts on acc_ehpc,
# a successor always queued (keep_pending 1) and a handover once the running host is 15 min old.
# Exercises the successor queue, the handover (SIGUSR2 save, resume on the new host, the old host
# released) and the resume of a job from another pool's checkpoint.
#   python scripts/run_autoexp.py --config-name experiments/korbi/pool/mn5_pool_n2h --no-monitor
defaults:
  - /backend: pool_host
  - /slurm: marenostrum_autoexclude_pool_host
  - /job: pool_host
  - /sweep: none
  - _self_

job:
  name: mn5_pool_n2h
  base_output_dir: ${oc.env:HYBRID_OUTPUT_DIR,/gpfs/scratch/ehpc533/hybrid_nucleus}/pools/${job.name}
  pool_host:
    max_hosts_running: 1
    keep_pending: 1
    min_hosts: 0
    handover: true
    handover_min_age_s: 900
    successor_delay_s: 0
    idle_exit_s: 900
    monitor_dead_exit_s: 1200
    min_remaining_s: 900
    stop_grace_s: 300
    preempt_grace_s: 900
    poll_s: 10

slurm:
  sbatch:
    nodes: 2
    time: "01:30:00"
    qos: acc_ehpc
    signal: "B:USR1@600"

index: 0
stage: ""
