# @package _global_
# A 2-node sub-SLURM-job pool on JUPITER (docs/sub_slurm_jobs.md): one allocation at a time
# that works through whatever is enqueued, for validation and small speed ablations.
#
#   python scripts/run_autoexp.py --config-name experiments/korbi/pool/jupiter_pool_n2
#   python scripts/run_autoexp.py --pool <pool dir> --config-name experiments/korbi/pool/megatron_130M_pool_smoke
#   python scripts/pool_ctl.py <pool dir> status
#
# For continuous training add `job.pool_host.keep_pending=1 job.pool_host.handover=true`
# (or `pool_ctl.py <pool dir> set keep_pending=1 handover=true` on a live pool).
defaults:
  - /backend: pool_host
  - /slurm: jupiter_pool_host
  - /job: pool_host
  - /sweep: none
  - _self_

job:
  name: jupiter_pool_n2
  base_output_dir: ${oc.env:OUTPUT_DIR,./output}/pools/${job.name}
  pool_host:
    max_hosts_running: 1
    keep_pending: 0
    min_hosts: 0
    handover: false
    idle_exit_s: 600
    monitor_dead_exit_s: 1200
    min_remaining_s: 600
    stop_grace_s: 120
    preempt_grace_s: 600
    poll_s: 10

slurm:
  sbatch:
    nodes: 2
    time: "01:00:00"
    # the supervisor stops the current run gracefully (checkpoint) 5 min before the wall
    signal: "B:USR1@300"

index: 0
stage: ""
