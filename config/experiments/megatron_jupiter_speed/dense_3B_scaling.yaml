# @package _global_
# Node-scaling sweep (fixed model; GBS grows to the optimal-batch cap, fixed above) for dense_3B: GBS = 32·nodes keeps per-GPU work fixed
# (mbs=2, DP=4·nodes, 4 microbatches). Flat tok/s/GPU = perfect weak scaling.
# Baseline (1 node): 16,807 tok/s/GPU, 354.7 TFLOPS (job 1051947).
defaults:
  - dense_3B
  - _self_

backend:
  megatron:
    global_batch_size: ${oc.eval:32*${slurm.sbatch.nodes}}  # mbs2 × DP(4·nodes) × 4 µbatches

job:
  name: jspeed_dense_3B_scaling_n${slurm.sbatch.nodes}

sweep:
  type: list
  store_sweep_json: true
  groups:
    - type: list
      params:
        slurm.sbatch.nodes: [1, 2, 4, 8, 16, 32, 64, 128, 256]
