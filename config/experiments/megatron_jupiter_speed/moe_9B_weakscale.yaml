# @package _global_
# Weak-scaling sweep for moe_9B: EP=4 (intra-node) fixed, DP = 4·nodes.
# GBS = 32·nodes keeps 1 microbatch at mbs=8 → fixed per-GPU work.
# Inherits HybridEP dispatcher + full recompute + hybridep container from base.
# Baseline (1 node): 18,397 tok/s/GPU, 165.9 TFLOPS (job 1052298).
# Flat tok/s/GPU = perfect weak scaling.
defaults:
  - moe_9B
  - _self_

backend:
  megatron:
    global_batch_size: ${oc.eval:32*${slurm.sbatch.nodes}}  # mbs8 × DP(4·nodes)

job:
  name: jspeed_moe_9B_ws_n${slurm.sbatch.nodes}

sweep:
  type: list
  store_sweep_json: true
  groups:
    - type: list
      params:
        slurm.sbatch.nodes: [1, 2, 4, 8, 16, 32, 64, 128, 256]
