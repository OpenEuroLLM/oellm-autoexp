# @package _global_
# Weak-scaling sweep for moe_3B: EP=4 (intra-node) fixed, DP = 4·nodes.
# GBS = 16·nodes keeps 1 microbatch at mbs=4 → fixed per-GPU work.
# Inherits HybridEP dispatcher + hybridep container from the base config.
# Baseline (1 node): 32,770 tok/s/GPU, 194.5 TFLOPS (job 1052295).
# Flat tok/s/GPU = perfect weak scaling.
defaults:
  - moe_3B
  - _self_

backend:
  megatron:
    global_batch_size: ${oc.eval:16*${slurm.sbatch.nodes}}  # mbs4 × DP(4·nodes)

job:
  name: jspeed_moe_3B_ws_n${slurm.sbatch.nodes}

sweep:
  type: list
  store_sweep_json: true
  groups:
    - type: list
      params:
        slurm.sbatch.nodes: [1, 2, 4, 8, 16, 32, 64, 128, 256]
