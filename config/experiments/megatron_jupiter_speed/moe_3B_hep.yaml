# @package _global_
# HybridEP dispatcher check for moe_3B (allgather optimum: 28,953 tok/s,
# mbs4 norc, 62% mem). PP=1 → no VPP; dispatcher A/B plus the mbs8 retry
# (OOMed at 98.6% with allgather).
#   0. hybridep_mbs4 — direct dispatcher A/B at the validated settings
#   1. hybridep_mbs8 — the allgather-OOM point retried
defaults:
  - moe_3B
  - _self_

aux:
  tag: "hybridep_mbs4"

backend:
  megatron:
    moe_token_dispatcher_type: flex
    moe_flex_dispatcher_backend: hybridep
    moe_hybridep_num_sms: 16
  env:
    TRITON_LIBCUDA_PATH: "/opt/nvidia/lib"

container:
  image: ${oc.env:CONTAINER_CACHE_DIR,.}/MegatronTraining-JUPITER-deep-hybridep_aarch64.sif
  bind:
    - /e
    - /dev/shm
    - /usr/lib64/libcuda.so.1:/opt/nvidia/lib/libcuda.so.1:ro
    - /usr/lib64/libcuda.so:/opt/nvidia/lib/libcuda.so:ro
    - /usr/lib64/libnvidia-ml.so.1:/opt/nvidia/lib/libnvidia-ml.so.1:ro
    - /usr/lib64/libnvidia-ptxjitcompiler.so.1:/opt/nvidia/lib/libnvidia-ptxjitcompiler.so.1:ro

job:
  name: jspeed_moe_3B_hep_${aux.tag}

sweep:
  type: list
  store_sweep_json: true
  groups:
    - type: list
      configs:
        - aux.tag: hybridep_mbs4
        - aux.tag: hybridep_mbs8
          backend.megatron.micro_batch_size: 8
          backend.megatron.global_batch_size: 32
