# @package _global_
# MoE ~3B total / ~0.8B active (PROPOSED arch) — 1 node. Qwen3-MoE style,
# same expert granularity as 30B-A3B (moe_ffn 768, topk 8):
#   24 layers, hidden 1280, 40 experts
#   params (neox vocab): experts 24×118M=2.83B + attn 0.16B + emb 0.13B ≈ 3.1B
#   active ≈ 0.85B (topk 8/40)
#
# VALIDATED optimum (tune sweeps + HybridEP check 2026-07-27, job 1052295):
#   mbs4/GBS16, no recompute, HybridEP dispatcher
#   → 194.5 TFLOPS / 19.7% MFU, 32,770 tok/s/GPU, 0.50 s/iter, 63% mem
# (allgather same settings: 28,953 — HybridEP +13%. mbs8 OOMs with either
# dispatcher. Requires the hybridep container + libcuda binds, see below.)
defaults:
  - ../base
  - /backend: megatron_torchrun_localaddr
  - /container: jupiter
  - /slurm: jupiter
  - /backend/megatron: [base, qwen3_moe, data_nemonicco_split_jupiter]
  - common
  - /sweep: none
  - _self_

backend:
  megatron:
    # ── size ─────────────────────────────────────────────────────────────
    num_layers: 24
    hidden_size: 1280
    ffn_hidden_size: 3840           # unused with moe_layer_freq=1, kept consistent (3×h)
    num_attention_heads: 16         # head_dim 128 → q-proj 1280→2048
    num_query_groups: 4
    kv_channels: 128
    num_experts: 40                 # divisible by EP=4 → 10 experts/GPU
    moe_ffn_hidden_size: 768
    moe_router_topk: 8
    # ── parallelism / speed ──────────────────────────────────────────────
    expert_model_parallel_size: 4
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    sequence_parallel: false
    micro_batch_size: 4
    global_batch_size: ${oc.muli:4,${.micro_batch_size},${slurm.sbatch.nodes}}           # mbs × DP(4)
    recompute_granularity: null
    recompute_method: null
    recompute_num_layers: null
    moe_router_dtype: "fp32"
    moe_token_dispatcher_type: flex
    moe_flex_dispatcher_backend: hybridep
    moe_hybridep_num_sms: 16
  env:
    TRITON_LIBCUDA_PATH: "/opt/nvidia/lib"

container:
  image: ${oc.env:CONTAINER_CACHE_DIR,.}/MegatronTraining-JUPITER-deep-hybridep_aarch64.sif
  bind:
    - /e
    - /dev/shm
    - /usr/lib64/libcuda.so.1:/opt/nvidia/lib/libcuda.so.1:ro
    - /usr/lib64/libcuda.so:/opt/nvidia/lib/libcuda.so:ro
    - /usr/lib64/libnvidia-ml.so.1:/opt/nvidia/lib/libnvidia-ml.so.1:ro
    - /usr/lib64/libnvidia-ptxjitcompiler.so.1:/opt/nvidia/lib/libnvidia-ptxjitcompiler.so.1:ro

slurm:
  sbatch:
    nodes: 1

job:
  name: jspeed_moe_3B
