# @package _global_
# Node-scaling sweep (fixed model; GBS grows to the optimal-batch cap, fixed above) for dense_32B: TP4+PP2+VPP fixed (one replica = 2 nodes),
# DP = nodes/2. GBS = 32·nodes keeps GA=32 at mbs=2 → fixed per-GPU work.
# Flat tok/s/GPU = perfect weak scaling. Starts at the 4-node minimum.
# Baseline (4 nodes, tune3 recipe): 1,880 tok/s/GPU, 379.1 TFLOPS (job 1079963).
# NOTE: old-recipe curve (mbs1/PP1/selective) measured n4-n256: 1,625…1,437 —
# re-run under this recipe for the final curve.
defaults:
  - dense_32B
  - _self_

backend:
  megatron:
    global_batch_size: ${oc.eval:32*${slurm.sbatch.nodes}}  # mbs2 × DP(nodes/2) × GA32

job:
  name: jspeed_dense_32B_scaling_n${slurm.sbatch.nodes}

sweep:
  type: list
  store_sweep_json: true
  groups:
    - type: list
      params:
        slurm.sbatch.nodes: [4, 8, 16, 32, 64, 128, 256]
