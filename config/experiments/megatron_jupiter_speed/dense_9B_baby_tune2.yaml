# @package _global_
# Round 2 of dense_9B_baby tuning. Round 1: no-recompute is free (60% mem was
# real headroom, unlike the MoEs) and LESS tensor parallelism wins:
#   TP4 sel-recompute 287 TF → TP4 norc 316 → TP2 norc mbs2 327.6 ← round-1 winner
# Following the gradient to its end:
#   0. tp1_norc_mbs1 — TP=1/DP=4: no TP comm at all. Mem/GPU ≈ weights 18 +
#                      grads 18 + optim 108/4 = 63 GiB + norc activations
#                      (~6 GiB/µbatch sample at h4096) → mbs1 should fit (~75%)
#   1. tp1_full_mbs2 — TP=1 fallback if norc doesn't fit: full recompute, mbs2
#   2. tp2_norc_mbs4 — round-1 winner's µbatch raised 2→4 (70% mem had room)
# ── Results (jobs 1052010-12, 2026-07-27) ────────────────────────────────
#   tp1_norc_mbs1 → 390.1 TFLOPS, 39.4% MFU, 8,383 tok/s/GPU, 92% mem ← WINNER
#                   (+36% over the original TP4+sel-recompute baseline)
#   tp2_norc_mbs4 → 330.1 TFLOPS (mbs 2→4 at TP2: +0.8%, mem 70→93%)
#   tp1_full_mbs2 → FAILED at startup (recompute_activations+granularity=full
#                   flag conflict) — moot, TP1 fits without recompute.
# Winner folded into dense_9B_baby.yaml. TP ladder on 1 node:
# TP4 287 → TP2 328 → TP1 390 TF — TP comm is pure overhead when memory fits.
defaults:
  - dense_9B_baby
  - _self_

aux:
  tag: "tp1_norc_mbs1"

backend:
  megatron:
    recompute_activations: false
    recompute_granularity: null
    tensor_model_parallel_size: 1
    sequence_parallel: false        # no-op at TP=1
    micro_batch_size: 1
    global_batch_size: 16           # mbs1 × DP4 × 4 µbatches

job:
  name: jspeed_dense_9B_baby_tune_${aux.tag}

sweep:
  type: list
  store_sweep_json: true
  groups:
    - type: list
      configs:
        - aux.tag: tp1_norc_mbs1
        - aux.tag: tp1_full_mbs2
          backend.megatron.recompute_activations: true
          backend.megatron.recompute_granularity: full
          backend.megatron.recompute_method: uniform
          backend.megatron.recompute_num_layers: 1
          backend.megatron.micro_batch_size: 2
        - aux.tag: tp2_norc_mbs4
          backend.megatron.tensor_model_parallel_size: 2
          backend.megatron.sequence_parallel: true
          backend.megatron.micro_batch_size: 4
