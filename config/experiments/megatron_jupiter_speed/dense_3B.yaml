# @package _global_
# Dense ~3B (Qwen3-style, PROPOSED arch — no 3B config existed in the repo) — 1 node.
#
# Arch: Qwen3-4B shape scaled down (32 layers instead of 36, ffn 8192 instead
# of 9728). Params with neox vocab (~50k, tied): 32 × (attn 26.2M + mlp 62.9M)
# + emb 0.13B ≈ 3.0B. Adjust here if the OELLM 3B lineup fixes a different shape.
#
# VALIDATED optimum (tune sweep 2026-07-27, jobs 1051946-48):
#   TP=1, mbs2, GBS32 (4 µbatches), no recompute, CUDA graphs
#   → 354.7 TFLOPS / 35.9% MFU, 16,807 tok/s/GPU, 1.95 s/iter, 73% mem
# mbs4/GBS16 ran 349 TF at a knife-edge 97% mem; mbs2+accumulation is both
# faster and far safer. GBS64 at mbs4 OOMs (grad buffer not free at 97%).
defaults:
  - ../base
  - /backend: megatron_torchrun_localaddr
  - /container: jupiter
  - /slurm: jupiter
  - /backend/megatron: [base, qwen3_base, data_nemonicco_split_jupiter]
  - common
  - /sweep: none
  - _self_

backend:
  megatron:
    # ── size (Qwen3-style ~3B) ───────────────────────────────────────────
    num_layers: 32
    hidden_size: 2560
    ffn_hidden_size: 8192
    num_attention_heads: 32         # head_dim 128 → q-proj 2560→4096 (Qwen3-4B style)
    num_query_groups: 8
    kv_channels: 128
    untie_embeddings_and_output_weights: false
    # ── parallelism / speed ──────────────────────────────────────────────
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    sequence_parallel: false
    micro_batch_size: 2
    global_batch_size: 32           # mbs × DP(4) × 4 µbatches
    recompute_activations: false
    recompute_granularity: null
    cross_entropy_loss_fusion: true
    cuda_graph_impl: "local"
    cuda_graph_scope: "full"
    cuda_graph_warmup_steps: 3
    check_for_nan_in_loss_and_grad: false
  env:
    PYTORCH_CUDA_ALLOC_CONF: "garbage_collection_threshold:0.8"
    PYTORCH_ALLOC_CONF: "garbage_collection_threshold:0.8"

slurm:
  sbatch:
    nodes: 1

job:
  name: jspeed_dense_3B
