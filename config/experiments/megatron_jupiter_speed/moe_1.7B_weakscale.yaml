# @package _global_
# Weak-scaling sweep for moe_1.7B: EP=4 (intra-node) fixed, DP = 4·nodes.
# GBS = 32·nodes keeps 1 microbatch at mbs=8 → fixed per-GPU work.
# Stays on allgather + default pt2512 container (HybridEP is −11% at this size).
# Baseline (1 node): 43,099 tok/s/GPU, 181.4 TFLOPS.
# Flat tok/s/GPU = perfect weak scaling.
defaults:
  - moe_1.7B
  - _self_

backend:
  megatron:
    global_batch_size: ${oc.eval:32*${slurm.sbatch.nodes}}  # mbs8 × DP(4·nodes)

job:
  name: jspeed_moe_1.7B_ws_n${slurm.sbatch.nodes}

sweep:
  type: list
  store_sweep_json: true
  groups:
    - type: list
      params:
        slurm.sbatch.nodes: [1, 2, 4, 8, 16, 32, 64, 128, 256]
