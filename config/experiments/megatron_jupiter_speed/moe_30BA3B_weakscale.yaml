# @package _global_
# Weak-scaling sweep for the MoE 30B-A3B speed test: nodes 2→256, GBS ∝ nodes.
# EP=4 (intra-node), PP=2, VPP (VP=6) and HybridEP stay fixed; DP = 2·nodes.
# GBS = 32·nodes keeps GA = GBS/(mbs·DP) = 4 → constant 4% bubble with VP=6,
# so per-GPU work is truly fixed across the sweep.
# Baseline (2 nodes, GBS 64): 7,515 tok/s/GPU, 163.5 TFLOPS (job 1052257).
# Perfect weak scaling ⇔ flat tok/s/GPU across the sweep.
# Extract with: python scripts/extract_speed_results.py $OUTPUT_DIR/megatron_jupiter_speed
defaults:
  - moe_30BA3B
  - _self_

backend:
  megatron:
    global_batch_size: ${oc.eval:32*${slurm.sbatch.nodes}}  # mbs4 × DP(2·nodes) × GA 4

job:
  name: jspeed_moe_30BA3B_ws_n${slurm.sbatch.nodes}

sweep:
  type: list
  store_sweep_json: true
  groups:
    - type: list
      params:
        slurm.sbatch.nodes: [2, 4, 8, 16, 32, 64, 128, 256]
