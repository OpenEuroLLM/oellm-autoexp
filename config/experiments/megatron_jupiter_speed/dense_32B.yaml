# @package _global_
# Dense ~32B (Qwen3-32B arch: 64L, hidden 5120, ffn 25600, 64 heads / 8 KV
# groups, head_dim 128, untied) — 4 nodes, 16× GH200.
#
# VALIDATED optimum (tune3 port 2026-07-28, job 1079963 — recipe from branch
# jupiter_qwen32B_throughput, ville/qwen3_32b_jupiter_sweep5):
#   TP4 + PP2 + VPP(lpvs2 → VP16), mbs2, GBS128, NO recompute,
#   tp_comm_overlap + overlap grad/param, attention_softmax_in_fp32 false
#   → 379.1 TFLOPS / 38.3% MFU, 1,880 tok/s/GPU, 17.4 s/iter, 88% mem
# Progression: GBS8/mbs1/sel-recompute 150 TF → +accumulation/overlap 317
# (tune{,2}) → +PP2/VPP/mbs2/norc 354 → +softmax-bf16 367 → +tpco 379 (tune3).
# tp_comm_overlap requires UB_SKIPMC=1 and only pays in the PP2/VPP/mbs2
# regime (no-op in the old PP1/mbs1 layout). PP2 P2P needs NCCL_NET_GDR_LEVEL=0.
#
# Minimal-node reasoning (96 GiB GH200): TP=4 (intra-node NVLink), DP=4 across
# nodes. Per GPU: bf16 weights 16.4 + bf16 grads 16.4 (fp32 accum off) +
# dist-optim states 393.6/(TP4·DP4)=24.6 ≈ 57 GiB + activations (mbs=1,
# selective recompute) → fits at 93%. If OOM: recompute_granularity=full.
# No CUDA graphs here — unvalidated at this scale and memory is tight.
defaults:
  - ../base
  - /backend: megatron_torchrun_localaddr
  - /container: jupiter
  - /slurm: jupiter
  - /backend/megatron: [base, qwen3_base, data_nemonicco_split_jupiter]
  - common
  - /sweep: none
  - _self_

backend:
  megatron:
    # ── size (Qwen3-32B) ─────────────────────────────────────────────────
    num_layers: 64
    hidden_size: 5120
    ffn_hidden_size: 25600
    num_attention_heads: 64         # head_dim 128 → q-proj 5120→8192
    num_query_groups: 8
    kv_channels: 128
    untie_embeddings_and_output_weights: true
    # ── parallelism / speed ──────────────────────────────────────────────
    tensor_model_parallel_size: 4   # intra-node
    pipeline_model_parallel_size: 2
    num_layers_per_virtual_pipeline_stage: 2   # VP = 64/(2·2) = 16
    sequence_parallel: true
    train_iters: 20                 # ~17.5 s/iter at GBS=128
    micro_batch_size: 2
    global_batch_size: 128          # mbs2 × DP(2) × GA32
    overlap_grad_reduce: true       # hide DP allreduce behind backward
    overlap_param_gather: true
    tp_comm_overlap: true           # +3.4% in this regime (needs UB_SKIPMC)
    recompute_activations: false    # fits at 88% with mbs2/PP2
    recompute_granularity: null
    attention_softmax_in_fp32: false  # +3.6%
    dataloader_type: single
    accumulate_allreduce_grads_in_fp32: false  # halves grad memory; fine for a speed test
    cross_entropy_loss_fusion: true
  env:
    CUDA_DEVICE_MAX_CONNECTIONS: "1"  # required for TP≥2 comm overlap on JUPITER
    UB_SKIPMC: "1"                    # userbuffers without multicast (tp_comm_overlap)
    NCCL_NET_GDR_LEVEL: "0"           # PP2 inter-node P2P hangs with GDRDMA

slurm:
  sbatch:
    nodes: 4
    time: "00:30:00"

job:
  name: jspeed_dense_32B
