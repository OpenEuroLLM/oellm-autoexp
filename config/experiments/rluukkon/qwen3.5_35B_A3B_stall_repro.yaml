# @package _global_
# Minimal repro for the MoE throughput-stall investigation.
# The stall onset is driven by iterations-since-process-start (~400-500), not by
# memory or absolute training iteration, so a short cold start reproduces it.
# Faithful to the real run (bilingual_150BT_midsommar): same MoE/router/dispatcher
# settings, global_aux_loss, moe_permute_fusion, and moe_per_layer_logging (a prime
# host-side per-iteration suspect). Checkpoint/eval disabled to remove confounds.
defaults:
  - ../base
  - /backend: megatron
  - /container: mi325x
  - /slurm: mi325x
  - /sweep: none
  - /backend/megatron: [qwen3_5_moe_35BA3B]
  - _self_

slurm:
  sbatch:
    partition: amd-tw-verification
    nodes: 2
    time: 0-01:30:00

  launcher_cmd: "${oc.join:' ',${oc.maptmpl:'export %=\\'$%\\' ; \\\n',${oc.dict.keys:.env}}} \
    export LOCAL_ADDR=$(nslookup $(hostname) | grep \"Address: \" | sed \"s/Address: //\" | tail) ; \\\n\
    export RANK=$SLURM_PROCID ; export LOCAL_RANK=$SLURM_LOCALID ; export AITER_JIT_DIR=/tmp/$USER/aiter_jit_dir ; \\\n\
    ${oc.select:container.runtime,apptainer} exec --rocm --overlay /shared_silo/scratch/containers/fla-overla-for-primus-v26.1.img:ro ${oc.join:' ',${oc.maptmpl:'--bind % \\\n',${container.bind}}} \
    ${oc.select:container.image,container.sif}"

  env:
    USE_ROCM_AITER_ROPE_BACKEND: "0"
    WANDB_MODE: "offline"
    OUTPUT_DIR: "${oc.env:OUTPUT_DIR,./output}"
    APPTAINER_BIND: '"/usr/local/lib/libbnxt_re-rdmav34.so:/usr/lib/x86_64-linux-gnu/libibverbs/libbnxt_re-rdmav34.so,${oc.env:SCRATCH},${oc.env:PWD}"'
    SINGULARITY_BIND: '"/usr/local/lib/libbnxt_re-rdmav34.so:/usr/lib/x86_64-linux-gnu/libibverbs/libbnxt_re-rdmav34.so,${oc.env:SCRATCH},${oc.env:PWD}"'

container:
  image: /shared_silo/scratch/containers/primus_v26.1.sif

backend:
  megatron:
    log_throughput: true
    log_interval: 1
    log_progress: true
    log_memory_to_tensorboard: true
    # Per-phase timing every iter (forward-backward, optimizer sub-phases,
    # batch-generator, forward/backward-compute) -> stdout + tensorboard/wandb.
    # Pins the stall to a phase at per-iter resolution without code edits.
    timing_log_level: 2
    log_timers_to_tensorboard: true
    data_path:
      - 0.5
      - /shared_silo/scratch/datasets/tokenized/qwen3.5/megatron/hplt2.0_cleaned_fin/train
      - 0.5
      - /shared_silo/scratch/datasets/CC-MAIN-2020-high-actual/Qwen3.5-35B-A3B-Base/merged/all
    data_cache_path: /shared_silo/scratch/rluukkon/data/.cache
    split: "989,10,1"

    # 2 nodes -> world 16, TP=1, PP=1 -> DP=16 (EP is orthogonal, shards experts
    # within the DP group). gbs 96 = DP16 * mbs2 * 3 microbatches (matches the
    # real run's grad-accum depth of 3).
    global_batch_size: 96
    micro_batch_size: 2
    expert_model_parallel_size: 8
    pipeline_model_parallel_size: 1
    use_distributed_optimizer: true
    create_attention_mask_in_dataloader: false

    # MoE config faithful to the real run.
    moe_grouped_gemm: false
    moe_token_dispatcher_type: "alltoall"
    moe_permute_fusion: true
    moe_shared_expert_overlap: true
    moe_router_load_balancing_type: global_aux_loss
    moe_aux_loss_coeff: 0.0001
    moe_per_layer_logging: true
    overlap_moe_expert_parallel_comm: false
    overlap_param_gather: true
    overlap_grad_reduce: true

    adam_beta2: 0.95
    weight_decay: 0.01

    train_iters: 800
    lr: 3e-5
    min_lr: 3e-6
    lr_warmup_iters: 10
    lr_decay_style: WSD
    lr_wsd_decay_style: linear
    lr_wsd_decay_iters: 160
    lr_decay_iters: 800
    router_lr_spec: "1e-5"

    # Disable checkpoint saves and eval to remove confounds.
    ckpt_format: torch_dist
    save_interval: 100000
    eval_interval: 100000
    save: ${job.base_output_dir}/checkpoints

    tensorboard_dir: ${job.base_output_dir}/tensorboard
    wandb_project: "moe-exploration"
    wandb_exp_name: "stall_repro_${oc.env:SLURM_JOB_ID,local}"

    load: /shared_silo/scratch/rluukkon/oellm/Megatron-Bridge/megatron_ckpt/Qwen3.5-35B-A3B-Base
    finetune: true
    no_load_optim: true
    no_load_rng: true

job:
  name: qwen3_5_35B_A3B_stall_repro
