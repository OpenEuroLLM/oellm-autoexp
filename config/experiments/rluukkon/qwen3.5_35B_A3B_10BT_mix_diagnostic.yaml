          backend.megatron.data_path:
            # Finnish (55.742262%) — wd0.01 sources
            - 0.269265645200258
            - /shared_silo/scratch/ttoivone/tokenized/fin/MT-Nemotron-CC-fin_Latn-max-500Btok_text_document
            - 0.0176945995417312
