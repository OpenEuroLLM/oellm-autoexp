# @package _global_
#
# Smoke test 05: the 6 jobs of 04_v8ml_single_node, identical model / data / optimizer settings,
# but on the team's Megatron branch and container:
#   Megatron : OpenEuroLLM/NVIDIA-Megatron-LM oellm/v0.19-hybrid, PINNED at 013763961
#              (checked out in NVIDIA-Megatron-LM-hybrid, next to the old fork, which stays as is)
#   Container: MegatronTraining-JUPITER-te218-fa3 (TE 2.18 -> no single_grouped_weight patch needed)
# Everything else is unchanged, so 04 vs 05 differ only in Megatron + container.
# Sweep: {gdn, full_attn} x {adam, muon, angular_muown} = 6 jobs, 100 iters each, 1 node each.
#
# Compare against the 04 table in README.md: val loss at 50/100 (same data, same split, same seed
# -> should be close, not bit-identical), median / p90 step time, TFLOP/s/GPU.
#
# BEFORE SUBMITTING: check out the Megatron commit and run 05_hybrid_env_check.sh (see README).
#
# The dataset-index cache from 04 may or may not be reused (newer dataset builder). Submit job 0
# alone with a 1 h limit first, the rest after it has started training:
#   python scripts/run_autoexp.py \
#     --config-name experiments/laingsam1/opt_scale/smoke_test/05_v8ml_hybrid_megatron \
#     --array-subset 0 --submit-and-exit slurm.sbatch.time=01:00:00
#   python scripts/run_autoexp.py \
#     --config-name experiments/laingsam1/opt_scale/smoke_test/05_v8ml_hybrid_megatron \
#     --array-subset 1-5 --submit-and-exit
# Cost: job 0 <= 4 GPU-h (1 h cap), jobs 1-5 <= 10 GPU-h (30 min cap each); ~6 GPU-h expected.

defaults:
  - /backend: megatron_torchrun_localaddr
  - /container: jupiter
  - /slurm: jupiter
  - /job: default
  - /sweep: none
  - /backend/megatron: base
  - /backend/megatron/multilingual_scaling/sparse_models: qwen3_sparse_0.1B_ne_experts_8
  - /backend/megatron/opt_scale: qwen35_gdn_attention
  - _self_

index: 0
stage: smoke

container:
  # TE 2.18 + flash-attn 3 build on nemo_26.04 (group e-sta-openeurollm). Python MUST be
  # /opt/venv/bin/python: /usr/bin/python in this image has TE 2.12 and no wandb.
  image: /e/project1/e-sta-openeurollm/container/MegatronTraining-JUPITER-te218-fa3_aarch64_202608280932.sif
  python: /opt/venv/bin/python
  env:
    PYTHONPATH: "${backend.aux.pyext_dir}:${backend.aux.megatron_dir}:."
    WANDB_MODE: offline

job:
  name: "smoke_v8ml_hyb_0.1B_${backend.aux.arch}_${backend.aux.opt}_N${slurm.sbatch.nodes}"
  base_output_dir: "${backend.aux.base}/experiments/opt_scale/smoke_test/${job.name}"
  log_path: ${slurm.sbatch.error}

backend:
  aux:
    # Per-user root for Megatron checkout, pyext, logs, outputs, index cache (default = Sam's).
    # Others: export OPT_SCALE_BASE=/e/scratch/<project>/users/<you>  (see opt_scale/README.md)
    base: ${oc.env:OPT_SCALE_BASE,/e/scratch/e-aif-2026sc04-211/users/slaing}
    arch: gdn          # overridden by sweep
    opt: adam          # overridden by sweep
    # oellm/v0.19-hybrid @ 013763961 (see README "05" for the checkout commands)
    megatron_dir: ${backend.aux.base}/NVIDIA-Megatron-LM-hybrid
    pyext_dir: ${backend.aux.base}/pyext
    repo_dir: ${oc.env:OPT_SCALE_REPO,${backend.aux.base}/oellm-autoexp}

  launcher_script: "${backend.aux.megatron_dir}/pretrain_gpt.py"

  # MUST stay off (see 01_single_node.yaml).
  data_integrity_check: false

  env:
    PYTHONPATH: "${backend.aux.pyext_dir}:${backend.aux.megatron_dir}:."
    TOKENIZERS_PARALLELISM: "false"
    HF_HUB_OFFLINE: "1"
    TRITON_CACHE_DIR: /tmp/triton_cache

  megatron:
    data_path: null
    data_args_path: "${backend.aux.repo_dir}/config/experiments/laingsam1/opt_scale/data/datamix_v8ml_flagfull_jsc.txt"
    split: "99,1,0"
    data_cache_path: ${backend.aux.base}/cache/megatron_index
    tokenizer_type: HuggingFaceTokenizer
    tokenizer_model: /e/data1/datasets/playground/mmlaion/oellm_testing/tokenizers/tokenizer-256k-agent
    num_workers: 4

    seq_length: 4096
    max_position_embeddings: 4096
    micro_batch_size: 2
    global_batch_size: 64
    train_iters: 100
    exit_interval: 100

    lr: 2.e-3                  # overridden per optimizer by the sweep
    lr_warmup_iters: 10
    lr_decay_style: WSD
    lr_wsd_decay_style: linear
    lr_wsd_decay_iters: 20

    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    expert_model_parallel_size: 2
    sequence_parallel: false
    use_distributed_optimizer: true
    distributed_timeout_minutes: 120   # index build on rank 0 (see 04)

    eval_interval: 50
    eval_iters: 2
    log_interval: 1
    log_throughput: true

    save: null
    load: null
    save_interval: null
    save_extra_steps: []
    tensorboard_dir: "${job.base_output_dir}/tensorboard"

slurm:
  env:
    CUDA_DEVICE_MAX_CONNECTIONS: "1"
  sbatch:
    nodes: 1
    account: ${oc.env:OPT_SCALE_ACCOUNT,e-aif-2026sc04-211}   # override: see opt_scale/README.md
    partition: booster
    time: "00:30:00"           # job 0: override to 01:00:00 on the command line (see header)
    output: "${backend.aux.base}/logs/${job.name}-%j.out"
    error: "${backend.aux.base}/logs/${job.name}-%j.err"

sweep:
  type: product
  groups:
    # Architecture (identical to 04)
    - type: list
      configs:
        - {backend.aux.arch: gdn}
        - backend.aux.arch: full_attn
          backend.megatron.experimental_attention_variant: null
          backend.megatron.linear_attention_freq: null
          backend.megatron.attention_output_gate: false
          backend.megatron.layernorm_zero_centered_gamma: false
          backend.megatron.rotary_percent: 1.0
    # Optimizer (identical to 04)
    - type: list
      configs:
        - {backend.aux.opt: adam, backend.megatron.optimizer: adam, backend.megatron.lr: 2.e-3}
        - backend.aux.opt: muon
          backend.megatron.optimizer: muon
          backend.megatron.lr: 5.e-3
          backend.megatron.muon_momentum: 0.95
          backend.megatron.muon_nesterov: true
          backend.megatron.muon_scale_mode: spectral
          backend.megatron.muon_coefficient_type: polar_express
          backend.megatron.muon_fp32_matmul_prec: medium
          backend.megatron.muon_num_ns_steps: 5
          backend.megatron.muon_tp_mode: blockwise
          backend.megatron.muon_split_qkv: true
          backend.megatron.muon_extra_scale_factor: 0.2
          backend.megatron.muon_scalar_optimizer: adam
        - backend.aux.opt: angular_muown
          backend.megatron.lr: 5.e-3
          backend.launcher_script: >-
            ${backend.aux.megatron_dir}/pretrain_gpt.py
            --optimizer angular_muown
            --angular-muown-scale-mode spectral
            --angular-muown-extra-scale-factor 0.2
            --angular-muown-momentum 0.95
            --angular-muown-coefficient-type simple
            --angular-muown-num-ns-steps 5
            --angular-muown-fp32-matmul-prec medium
            --angular-muown-u-decay-scale 0.001
            --angular-muown-u-decay-p 0.0
