# @package _global_
#
# Smoke test 04: same 6 jobs as 01_single_node, but on the full OpenEuroLLM v8ml mix
# instead of Nemotron-CC only. 1 node (4x GH200) per job.
# Sweep: {gdn, full_attn} x {adam, muon, angular_muown} = 6 jobs, 100 iters each.
#
# Data: ../data/datamix_v8ml_flagfull_jsc.txt (generated by ../data/make_datamix_v8ml_flagfull.py)
#   = official v8ml weights (80 % v8 English + 20 % flag-ml), flag sources pointed at the
#   complete flag collection (e-sta-openeurollm), v8-only sources from oellm_testing;
#   522/531 entries, 9 missing instruct sets (1.95 %) dropped and weights rescaled.
#   NOT decontaminated (original flag, not flag-decon-v2-agenttok). Validation uses the
#   per-dataset `split`; do NOT use oellm_testing/v8ml-valid with this mix (leakage).
# Reading the data needs group e-sta-openeurollm (log in fresh after joining).
#
# FIRST RUN: Megatron indexes every dataset in the mix (~16.8T tokens) once, which may take
# well over 30 min. Submit job 0 alone with a 2 h limit, the rest afterwards (cache reused):
#   python scripts/run_autoexp.py \
#     --config-name experiments/laingsam1/opt_scale/smoke_test/04_v8ml_single_node \
#     --array-subset 0 --submit-and-exit slurm.sbatch.time=02:00:00
#   python scripts/run_autoexp.py \
#     --config-name experiments/laingsam1/opt_scale/smoke_test/04_v8ml_single_node \
#     --array-subset 1-5 --submit-and-exit
# Cost: job 0 <= 8 GPU-h (2 h cap), jobs 1-5 <= 10 GPU-h (30 min cap each).

defaults:
  - /backend: megatron_torchrun_localaddr
  - /container: jupiter
  - /slurm: jupiter
  - /job: default
  - /sweep: none
  - /backend/megatron: base
  - /backend/megatron/multilingual_scaling/sparse_models: qwen3_sparse_0.1B_ne_experts_8
  - /backend/megatron/opt_scale: qwen35_gdn_attention
  - _self_

index: 0
stage: smoke

container:
  image: /e/project1/e-ext-2025e02-108/container/nemo_26.04.sif
  python: /opt/venv/bin/python
  env:
    PYTHONPATH: "${backend.aux.pyext_dir}:${backend.aux.megatron_dir}:."
    WANDB_MODE: offline

job:
  name: "smoke_v8ml_0.1B_${backend.aux.arch}_${backend.aux.opt}_N${slurm.sbatch.nodes}"
  base_output_dir: "/e/scratch/e-aif-2026sc04-211/users/slaing/experiments/opt_scale/smoke_test/${job.name}"
  log_path: ${slurm.sbatch.error}

backend:
  aux:
    arch: gdn          # overridden by sweep
    opt: adam          # overridden by sweep
    megatron_dir: /e/scratch/e-aif-2026sc04-211/users/slaing/NVIDIA-Megatron-LM-angular
    pyext_dir: /e/scratch/e-aif-2026sc04-211/users/slaing/pyext
    repo_dir: /e/scratch/e-aif-2026sc04-211/users/slaing/oellm-autoexp

  launcher_script: "${backend.aux.megatron_dir}/pretrain_gpt.py"

  # MUST stay off: it would hash all data files on the login node and write a checksum file
  # next to the data (read-only dirs). See 01_single_node.yaml.
  data_integrity_check: false

  env:
    PYTHONPATH: "${backend.aux.pyext_dir}:${backend.aux.megatron_dir}:."
    TOKENIZERS_PARALLELISM: "false"
    HF_HUB_OFFLINE: "1"
    TRITON_CACHE_DIR: /tmp/triton_cache

  megatron:
    # Full v8ml mix via a weight/prefix file (replaces data_path).
    data_path: null
    data_args_path: "${backend.aux.repo_dir}/config/experiments/laingsam1/opt_scale/data/datamix_v8ml_flagfull_jsc.txt"
    split: "99,1,0"
    # Index cache in our own scratch; never next to the data.
    data_cache_path: /e/scratch/e-aif-2026sc04-211/users/slaing/cache/megatron_index
    tokenizer_type: HuggingFaceTokenizer
    tokenizer_model: /e/data1/datasets/playground/mmlaion/oellm_testing/tokenizers/tokenizer-256k-agent
    num_workers: 4

    seq_length: 4096
    max_position_embeddings: 4096
    micro_batch_size: 2
    global_batch_size: 64      # 4 GPUs x mbs 2 -> 8 grad-accumulation steps
    train_iters: 100
    exit_interval: 100

    lr: 2.e-3                  # overridden per optimizer by the sweep
    lr_warmup_iters: 10
    lr_decay_style: WSD
    lr_wsd_decay_style: linear
    lr_wsd_decay_iters: 20

    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    expert_model_parallel_size: 2
    sequence_parallel: false
    use_distributed_optimizer: true
    # Rank 0 builds the dataset indices for the whole mix (522 datasets) on the first run
    # while the other ranks wait at a barrier; the 0.1B rung's 10-min default made them time
    # out (job 2840915). Built indices are cached, so later runs start in minutes.
    distributed_timeout_minutes: 120

    eval_interval: 50
    eval_iters: 2
    log_interval: 1
    log_throughput: true

    save: null
    load: null
    save_interval: null
    save_extra_steps: []       # schema type list[int]; null is rejected
    tensorboard_dir: "${job.base_output_dir}/tensorboard"

slurm:
  env:
    CUDA_DEVICE_MAX_CONNECTIONS: "1"
  sbatch:
    nodes: 1
    account: e-aif-2026sc04-211
    partition: booster
    time: "00:30:00"           # job 0: override to 02:00:00 on the command line (see header)
    output: "/e/scratch/e-aif-2026sc04-211/users/slaing/logs/${job.name}-%j.out"
    error: "/e/scratch/e-aif-2026sc04-211/users/slaing/logs/${job.name}-%j.err"

sweep:
  type: product
  groups:
    # Architecture
    - type: list
      configs:
        - {backend.aux.arch: gdn}
        - backend.aux.arch: full_attn
          backend.megatron.experimental_attention_variant: null
          backend.megatron.linear_attention_freq: null
          backend.megatron.attention_output_gate: false
          backend.megatron.layernorm_zero_centered_gamma: false
          backend.megatron.rotary_percent: 1.0
    # Optimizer (identical to 01_single_node.yaml)
    - type: list
      configs:
        - {backend.aux.opt: adam, backend.megatron.optimizer: adam, backend.megatron.lr: 2.e-3}
        - backend.aux.opt: muon
          backend.megatron.optimizer: muon
          backend.megatron.lr: 5.e-3
          backend.megatron.muon_momentum: 0.95
          backend.megatron.muon_nesterov: true
          backend.megatron.muon_scale_mode: spectral
          backend.megatron.muon_coefficient_type: polar_express
          backend.megatron.muon_fp32_matmul_prec: medium
          backend.megatron.muon_num_ns_steps: 5
          backend.megatron.muon_tp_mode: blockwise
          backend.megatron.muon_split_qkv: true
          backend.megatron.muon_extra_scale_factor: 0.2
          backend.megatron.muon_scalar_optimizer: adam
        - backend.aux.opt: angular_muown
          backend.megatron.lr: 5.e-3
          backend.launcher_script: >-
            ${backend.aux.megatron_dir}/pretrain_gpt.py
            --optimizer angular_muown
            --angular-muown-scale-mode spectral
            --angular-muown-extra-scale-factor 0.2
            --angular-muown-momentum 0.95
            --angular-muown-coefficient-type simple
            --angular-muown-num-ns-steps 5
            --angular-muown-fp32-matmul-prec medium
            --angular-muown-u-decay-scale 0.001
            --angular-muown-u-decay-p 0.0
