# @package _global_
#
# Smoke test 01: single node (4x GH200) on JUPITER.
# Sweep: {gdn, full_attn} x {adam, muon, angular_muown} = 6 jobs.
#   gdn       = Qwen3.5-style hybrid attention (3 Gated DeltaNet : 1 gated full attention)
#   full_attn = the plain qwen3_sparse rung (baseline)
# Model: 0.1B_ne sparse MoE (16 layers, hidden 512, 8 experts top-4).
# 100 iters, gbsz 64 x seq 4096, evals at 50/100, NO checkpoints.
# Data: OpenEuroLLM Nemotron-CC (Flagship One copy), only the 8 shards whose .bin size
# matches their info.json (others there are truncated / 0-byte) -- see README.md.
# Cost: ~5.5 GPU-h expected for all 6 (hard cap 6 x 4 GPU x 0.5 h = 12 GPU-h).
#
# Dry run (renders, submits nothing):
#   source /e/scratch/e-aif-2026sc04-211/users/slaing/venvs/autoexp/bin/activate
#   python scripts/run_autoexp.py \
#     --config-name experiments/laingsam1/opt_scale/smoke_test/01_single_node --dry-run
# First job only (gdn + adam; builds the data-index cache once):
#   python scripts/run_autoexp.py \
#     --config-name experiments/laingsam1/opt_scale/smoke_test/01_single_node --array-subset 0

defaults:
  - /backend: megatron_torchrun_localaddr
  - /container: jupiter
  - /slurm: jupiter
  - /job: default
  - /sweep: none
  - /backend/megatron: base
  - /backend/megatron/multilingual_scaling/sparse_models: qwen3_sparse_0.1B_ne_experts_8
  - /backend/megatron/opt_scale: qwen35_gdn_attention
  - _self_

index: 0
stage: smoke

container:
  # Flagship One NeMo 26.04 image: torch 2.11, TE 2.14, fla 0.4.2 preinstalled.
  # Its emerging_optimizers (0.1.0) is too old for the fork -> 0.2.0 from pyext (PYTHONPATH).
  image: /e/project1/e-ext-2025e02-108/container/nemo_26.04.sif
  # /usr/bin/python in this image has no fla; the venv python has everything.
  python: /opt/venv/bin/python
  env:
    PYTHONPATH: "${backend.aux.pyext_dir}:${backend.aux.megatron_dir}:."
    WANDB_MODE: offline

job:
  name: "smoke_0.1B_${backend.aux.arch}_${backend.aux.opt}_N${slurm.sbatch.nodes}"
  base_output_dir: "/e/scratch/e-aif-2026sc04-211/users/slaing/experiments/opt_scale/smoke_test/${job.name}"
  # autoexp's monitor reads this for finish/restart detection -> same file as slurm stderr.
  log_path: ${slurm.sbatch.error}

backend:
  aux:
    arch: gdn          # overridden by sweep
    opt: adam          # overridden by sweep
    # Fork oellm/v0.19-moe-lumi-angular-muown @ 1f88af5d (GDN + AngularMuown).
    megatron_dir: /e/scratch/e-aif-2026sc04-211/users/slaing/NVIDIA-Megatron-LM-angular
    # emerging_optimizers 0.2.0 (same version as the LUMI Muon/AngularMuown runs).
    pyext_dir: /e/scratch/e-aif-2026sc04-211/users/slaing/pyext
    data_root: /e/fscratch/e-ext-2025e02-108/training/collection/flag/nemotron-cc-1.0/megatron-lm

  launcher_script: "${backend.aux.megatron_dir}/pretrain_gpt.py"

  # MUST stay off: when on, autoexp hashes every data file on the login node before
  # submitting (3.3 TB -> hours) and writes checksums.hash next to the data, which is a
  # read-only directory for us (PermissionError). See
  # oellm_autoexp/backends/megatron_backend.py (validate) and data_integrity_check/checker.py.
  data_integrity_check: false

  env:
    PYTHONPATH: "${backend.aux.pyext_dir}:${backend.aux.megatron_dir}:."
    TOKENIZERS_PARALLELISM: "false"
    HF_HUB_OFFLINE: "1"
    TRITON_CACHE_DIR: /tmp/triton_cache

  megatron:
    # Data: the 8 size-verified Nemotron-CC shards. Weights inferred from shard sizes.
    data_path:
      - ${backend.aux.data_root}/high/actual/shard_0000_text_document
      - ${backend.aux.data_root}/high/actual/shard_0003_text_document
      - ${backend.aux.data_root}/high/actual/shard_0005_text_document
      - ${backend.aux.data_root}/medium-high/actual/shard_0000_text_document
      - ${backend.aux.data_root}/medium-high/actual/shard_0001_text_document
      - ${backend.aux.data_root}/medium-high/actual/shard_0002_text_document
      - ${backend.aux.data_root}/medium-high/actual/shard_0003_text_document
      - ${backend.aux.data_root}/medium-high/actual/shard_0004_text_document
    split: "99,1,0"
    # Shared across jobs so the (slow, first-time) index build happens once.
    data_cache_path: /e/scratch/e-aif-2026sc04-211/users/slaing/cache/megatron_index
    # OpenEuroLLM 256k tokenizer, local copy (compute nodes are offline).
    tokenizer_type: HuggingFaceTokenizer
    tokenizer_model: /e/data1/datasets/playground/mmlaion/oellm_testing/tokenizers/tokenizer-256k-agent
    num_workers: 4

    seq_length: 4096
    max_position_embeddings: 4096
    micro_batch_size: 2
    global_batch_size: 64      # 4 GPUs x mbs 2 -> 8 grad-accumulation steps
    train_iters: 100
    exit_interval: 100

    lr: 2.e-3                  # overridden per optimizer by the sweep
    lr_warmup_iters: 10
    lr_decay_style: WSD
    lr_wsd_decay_style: linear
    lr_wsd_decay_iters: 20

    # 0.1B fits on one GPU: no TP/PP; experts split over 2 GPUs (stays on NVLink).
    tensor_model_parallel_size: 1
    pipeline_model_parallel_size: 1
    expert_model_parallel_size: 2
    sequence_parallel: false   # only meaningful with TP > 1
    use_distributed_optimizer: true

    eval_interval: 50
    eval_iters: 2
    log_interval: 1
    log_throughput: true

    # No checkpoints for smoke tests.
    save: null
    load: null
    save_interval: null
    save_extra_steps: []       # schema type list[int]; null is rejected
    tensorboard_dir: "${job.base_output_dir}/tensorboard"

slurm:
  env:
    CUDA_DEVICE_MAX_CONNECTIONS: "1"
  sbatch:
    nodes: 1
    account: e-aif-2026sc04-211
    partition: booster
    time: "00:30:00"
    # Flat in the existing logs dir: Slurm does not create missing log directories.
    output: "/e/scratch/e-aif-2026sc04-211/users/slaing/logs/${job.name}-%j.out"
    error: "/e/scratch/e-aif-2026sc04-211/users/slaing/logs/${job.name}-%j.err"

sweep:
  type: product
  groups:
    # Architecture
    - type: list
      configs:
        - {backend.aux.arch: gdn}
        # Plain qwen3_sparse attention: undo everything qwen35_gdn_attention sets.
        - backend.aux.arch: full_attn
          backend.megatron.experimental_attention_variant: null
          backend.megatron.linear_attention_freq: null
          backend.megatron.attention_output_gate: false
          backend.megatron.layernorm_zero_centered_gamma: false
          backend.megatron.rotary_percent: 1.0
    # Optimizer
    - type: list
      configs:
        - {backend.aux.opt: adam, backend.megatron.optimizer: adam, backend.megatron.lr: 2.e-3}
        # Muon: settings of the LUMI muon_gbsz4096_qwen3_sparse_0.4B_ne_experts_32 run.
        - backend.aux.opt: muon
          backend.megatron.optimizer: muon
          backend.megatron.lr: 5.e-3
          backend.megatron.muon_momentum: 0.95
          backend.megatron.muon_nesterov: true
          backend.megatron.muon_scale_mode: spectral
          backend.megatron.muon_coefficient_type: polar_express
          backend.megatron.muon_fp32_matmul_prec: medium
          backend.megatron.muon_num_ns_steps: 5
          backend.megatron.muon_tp_mode: blockwise
          backend.megatron.muon_split_qkv: true
          backend.megatron.muon_extra_scale_factor: 0.2
          backend.megatron.muon_scalar_optimizer: adam
        # AngularMuown: settings of the LUMI angular_muown_gbsz4096 run (no u-decay).
        # `angular_muown` is not in the schema's optimizer choices, so it is passed via the
        # launcher script; `optimizer: adam` is the Megatron default and is not emitted.
        - backend.aux.opt: angular_muown
          backend.megatron.lr: 5.e-3
          backend.launcher_script: >-
            ${backend.aux.megatron_dir}/pretrain_gpt.py
            --optimizer angular_muown
            --angular-muown-scale-mode spectral
            --angular-muown-extra-scale-factor 0.2
            --angular-muown-momentum 0.95
            --angular-muown-coefficient-type simple
            --angular-muown-num-ns-steps 5
            --angular-muown-fp32-matmul-prec medium
            --angular-muown-u-decay-scale 0.001
            --angular-muown-u-decay-p 0.0
