# @package _global_
# 125M Qwen3-style continuous diffusion LM (Plaid): twin of the masked diffusion
# experiments/dllm/qwen3_125M_dlm on feat/megadlm.
# python scripts/run_autoexp.py --config-name experiments/cdlm/qwen3_125M_cdlm

defaults:
  - /backend: cdlm_torchrun
  - /container: snellius
  - /slurm: snellius
  - /job: default
  - /sweep: none
  - override /backend/megatron: cdlm/qwen3_125M_cdlm
  - _self_

job:
  name: "qwen3_125M_cdlm_baseline"
  base_output_dir: "${oc.env:OUTPUT_DIR,'./output'}/${job.name}"
  log_path: ${.base_output_dir}/logs/slurm-%j.log
  log_path_current: ${.base_output_dir}/logs/current.log
  config_path: ${.base_output_dir}/logs/config-%j.yaml
  config_path_current: ${.base_output_dir}/logs/current.yaml

backend:
  # Plaid flags of pretrain_cdlm.py (see add_cdlm_args there). The output-prior warm-up is ~5% of
  # training, as in Plaid (5000 of 92000 steps).
  aux:
    cdlm_args: "--cdlm-embed-dim 16 --cdlm-gamma-0 -3 --cdlm-gamma-1 6 --cdlm-selfcond --cdlm-bias-warmup-steps 500 --cdlm-reconst-bs-ema 0.997 --cdlm-aux-lr 1e-2 --cdlm-varilen-prob 0.01"
  megatron:
    global_batch_size: 512
    wandb_project: "hplt-megadlm-baseline"
    wandb_exp_name: ${job.name}
    data_cache_path: "${job.base_output_dir}/data_cache"

slurm:
  env:
    # Megatron's checkpoint loaders call torch.load() without weights_only=False; since torch 2.6
    # that rejects Megatron's own checkpoints when resuming.
    TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD: "1"
  sbatch:
    _non_strict: true
    nodes: 1
    partition: gpu_h100
    time: "15:00:00"
