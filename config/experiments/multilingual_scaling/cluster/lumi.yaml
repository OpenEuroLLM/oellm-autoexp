# @package _global_
# LUMI-specific infra + policy shared by every multilingual_scaling experiment on this cluster.

defaults:
  - /backend: megatron
  - /container: lumi
  - /slurm: lumi

container:
  env:
    WANDB_TAGS: "lumi"

backend:
  megatron:
    data_cache_path: /scratch/project_465002530/users/dianaonutu/cache/MEGATRON_262k # Adjust it to your own directory

    masked_softmax_fusion: False
    gradient_accumulation_fusion: False

    num_workers: 6 # Ville's suggestion since otherwise all of the 7 available CPUs per tasks would have a dataloader
    num_dataset_builder_threads: 6

    trust_remote_code: True

  env:
    TOKENIZERS_PARALLELISM: "false"
    HF_HUB_OFFLINE: "1"
    TRITON_HOME: /tmp/triton_cache

job:
  log_path: ${.base_output_dir}/logs/slurm-%j.log

slurm:
  env:
    MASTER_PORT: "9999"
  srun_opts: "--label --cpu-bind=mask_cpu:0xfe000000000000,0xfe00000000000000,0xfe0000,0xfe000000,0xfe,0xfe00,0xfe00000000,0xfe0000000000 "
  sbatch:
    # Maximum number of nodes is 16 to maximize throughput on LUMI.
    nodes: "${oc.eval:'min(16, max(1, int(${backend.megatron.global_batch_size}//(${backend.megatron.micro_batch_size}*${slurm.sbatch.gpus_per_node}))))'}"
    partition: standard-g
    time: "48:00:00"
