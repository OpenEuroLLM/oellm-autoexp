# @package _global_

# 0.9B NE dense Qwen3-like model training with pull-based multi-stage cooldown on Lumi
# Configuration from: https://docs.google.com/spreadsheets/d/17LXPs6O9_6cL7P2KVEJF8LTy5zhy0qLNXEVGRCYOzhY/edit?gid=0#gid=0
#
# Uses the v2 val sweep (matches the v2 training grid used by
# experiments/multilingual_scaling/training/lumi/0.9B_ne.yaml), which adds
# branchNBT/endNBT eval stages on top of v1's stable/decayNBT: for every
# decayNBT checkpoint, also evaluate the pre-decay 80%-of-budget branch
# checkpoint and the un-decayed 100%-of-budget end checkpoint the stable run
# saved along the way.

defaults:
  - /sweep/multilingual_scaling/validation/v2@sweep: qwen3_dense_0.9B_ne # val-specific sweep (waits on training checkpoints via FileExistsCondition; loads from training stable/decay checkpoints)
  - /experiments/multilingual_scaling/cluster: lumi
  - /backend/megatron/multilingual_scaling: qwen3_dense_0.9B_ne # model configs
  - /experiments/multilingual_scaling/common: base
  - /experiments/multilingual_scaling/validation/common
  - _self_

job:
  base_output_dir: "/scratch/project_465002530/multilingual_scaling/0.9B_ne/validation/${job.name}"

backend:
  megatron:
    # Data-related configs (LUMI)
    split: '99,1,0' #####????
    data_args_path: /scratch/project_462000963/users/vitiugin/datamix-tools/datamix4-val.txt
    tokenizer_model: openeurollm/tokenizer-256k

    data_cache_path: /scratch/project_465002530/users/dianaonutu/MEGATRON_262k_val # Adjust it to your own directory

    load: "/scratch/project_465002530/multilingual_scaling/0.9B_ne/training/${job.name}/checkpoints"

    num_dataset_builder_threads: 1
