# @package _global_

# 0.1B NE dense Qwen3-like model training with pull-based multi-stage cooldown on Leonardo
# Configuration from: https://docs.google.com/spreadsheets/d/17LXPs6O9_6cL7P2KVEJF8LTy5zhy0qLNXEVGRCYOzhY/edit?gid=0#gid=0

defaults:
  - /experiments/multilingual_scaling/common: base
  - /experiments/multilingual_scaling/cluster: leo
  - /experiments/multilingual_scaling/stage: validation
  - /sweep/multilingual_scaling/validation/v1@sweep: qwen3_dense_0.1B_ne # val-specific sweep (waits on training checkpoints via FileExistsCondition; loads from training decay checkpoints)
  - /backend/megatron: base
  - /backend/megatron/multilingual_scaling/models: qwen3_dense_0.1B_ne # model configs
  - /backend/megatron/multilingual_scaling/data: oellm_256k_leo_val # data configs
  - _self_

job:
  base_output_dir: "/leonardo_work/OELLM_prod2026/users/donutu00/multilingual_scaling/0.1B_ne/validation/${job.name}"

backend:
  megatron:
    data_cache_path: /leonardo_work/OELLM_prod2026/users/donutu00/cache/MEGATRON_262k_val # Adjust it to your own directory

    load: "/leonardo_work/OELLM_prod2026/slaing00/multilingual_scaling/0.1B_ne/training/${job.name}/checkpoints"
