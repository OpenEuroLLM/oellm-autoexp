# @package _global_

# 0.4B NE dense Qwen3-like model training with pull-based multi-stage cooldown on Leonardo
# Configuration from: https://docs.google.com/spreadsheets/d/17LXPs6O9_6cL7P2KVEJF8LTy5zhy0qLNXEVGRCYOzhY/edit?gid=0#gid=0

defaults:
  - /experiments/multilingual_scaling/common: base
  - /experiments/multilingual_scaling/cluster: leo
  - /sweep/multilingual_scaling/training@sweep: qwen3_dense_0.4B_ne_v1 # sweep configs
  - /backend/megatron: base
  - /backend/megatron/multilingual_scaling/models: qwen3_dense_0.4B_ne # model configs
  - /backend/megatron/multilingual_scaling/data: oellm_256k_leo_train # data configs
  - _self_

job:
  base_output_dir: "/leonardo_work/OELLM_prod2026/users/donutu00/multilingual_scaling/0.4B_ne/training/${job.name}"

backend:
  megatron:
    # Evals off (0.4B-specific: also drops the held-out split entirely, unlike the other Leo sizes)
    eval_iters: 0
    split: "100,0,0"
