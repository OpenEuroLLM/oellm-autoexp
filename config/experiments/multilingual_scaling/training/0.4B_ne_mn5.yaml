# @package _global_

# 0.4B NE dense Qwen3-like model training with pull-based multi-stage cooldown on Marenostrum
# Configuration from: https://docs.google.com/spreadsheets/d/17LXPs6O9_6cL7P2KVEJF8LTy5zhy0qLNXEVGRCYOzhY/edit?gid=0#gid=0

defaults:
  - /experiments/multilingual_scaling/common: base
  - /experiments/multilingual_scaling/cluster: mn5
  - /sweep/multilingual_scaling/training/mn5@sweep: qwen3_dense_0.4B_ne # sweep configs
  - /backend/megatron: base
  - /backend/megatron/multilingual_scaling/models: qwen3_dense_0.4B_ne # model configs
  - /backend/megatron/multilingual_scaling/data: oellm_256k_mn5_train # data configs
  - _self_

job:
  base_output_dir: "/gpfs/projects/ehpc533/multilingual_scaling/0.4B_ne/training/${job.name}"
