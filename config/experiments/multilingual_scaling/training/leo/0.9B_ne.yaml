# @package _global_

# 0.9B NE dense Qwen3-like model training with pull-based multi-stage cooldown on Leonardo
# Configuration from: https://docs.google.com/spreadsheets/d/17LXPs6O9_6cL7P2KVEJF8LTy5zhy0qLNXEVGRCYOzhY/edit?gid=0#gid=0

defaults:
  - /sweep/multilingual_scaling/training@sweep: qwen3_dense_0.9B_ne_v1 # sweep configs
  - /experiments/multilingual_scaling/cluster: leo
  - /backend/megatron/multilingual_scaling: qwen3_dense_0.9B_ne # model configs
  - /experiments/multilingual_scaling/common: base
  - _self_

job:
  base_output_dir: "/leonardo_work/OELLM_prod2026/slaing00/multilingual_scaling/0.9B_ne/training/${job.name}"

backend:
  megatron:
    # No periodic eval during training on Leonardo (keep data stream identical to MN5's 99,1,0)
    eval_interval: 1_000_000_000

    # Data-related configs (Leonardo)
    split: '99,1,0' ##### ?????
    data_args_path: /leonardo_work/OELLM_prod2026/users/shaldar0/datamix_tools_from_fedor/datamix-tools/output/1TT-option-4.sh
    tokenizer_model: /leonardo_work/OELLM_prod2026/users/shaldar0/tokenizers/openeurollm-tokenizer-256k