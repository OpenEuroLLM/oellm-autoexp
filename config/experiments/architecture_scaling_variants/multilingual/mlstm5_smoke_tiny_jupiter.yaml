# @package _global_
# Tiny 2-node JUPITER smoke for mLSTM hybrid wiring. Uses mock data and
# NullTokenizer to isolate Slurm/container/distributed/kernel behavior.
defaults:
  - size_0.1B
  - mlstm_base
  - _self_

aux:
  size: tiny
  hidden: 128
  ffn: 320
  layers: 4
  heads: 4
  qgroups: 4
  gqa: false
  mbs: 1
  gbs: 8
  tokens: 0
  seq_len: 512
  extra_steps: []
  mlstm_key_head_dim: 16
  mlstm_value_head_dim: 32

backend:
  data_integrity_check: false
  env:
    TRITON_LIBCUDA_PATH: /opt/nvidia/lib
  megatron:
    lr: 0.002
    train_iters: 10
    lr_warmup_iters: 2
    lr_wsd_decay_iters: 0
    mock_data: true
    data_path: null
    split: null
    tokenizer_type: NullTokenizer
    tokenizer_model: null
    vocab_size: 4096
    make_vocab_size_divisible_by: 1
    save: null
    save_extra_steps: []
    eval_interval: 1000
    eval_iters: 0
    num_workers: 0
    num_dataset_builder_threads: 1
    use_flash_attn: false
    attention_backend: unfused
    gradient_accumulation_fusion: false
    masked_softmax_fusion: false
    use_distributed_optimizer: false

slurm:
  sbatch:
    nodes: 2
    time: "00:20:00"

stage: smoke

job:
  name: jupiter_smoke_mlstm5_tiny_2n
