# @package _global_
# EVAL sweep — mirrors matcheddown_0p1B.yaml (6 matched-down hybrids, 0.1B-low ladder), but
# every point is an eval-only (skip_train) job that LOADS a trained checkpoint
# and computes val loss / PPL on the held-out multilingual validation blend
# (data_multilingual_1tt_val_jupiter). Two eval points per (variant,size,gbs,lr,budget):
#   - evalcd_decay<B>BT      : the fully-decayed COOLDOWN final
#                              (loads .../firstcd_decay<B>BT, latest checkpoint)
#   - evalstable_branch<B>BT : the STABLE pre-decay branch checkpoint
#                              (loads .../stable @ --ckpt-step 0.8*D)
# 6 variants x 3 budgets x 2 = 36 eval jobs, each 1 NODE (torch_dist is
# dp_reshardable, so an 8-node 0.9B checkpoint reshards onto 1 node) and
# AUTO-GATED (FileExistsCondition) on the training checkpoint appearing. Launch
# with its own monitor alongside training; it reads the training output tree,
# never writes to it.
defaults:
  - ml_base
  # Validation blend as valid_data_path (repackaged under aux.val_dataset); the
  # backend.megatron.aux.val_datamix_prefix below resolves its path interpolations.
  - /backend/megatron/data_multilingual_1tt_val_jupiter@aux.val_dataset
  - override /container: jupiter_liger_mamba
  - _self_

aux:
  # eval jobs write here; checkpoints are LOADED from train_group.
  experiment_group: architecture_scaling_variants_multilingual_matcheddown_0p1B_short_eval
  train_group: architecture_scaling_variants_multilingual_matcheddown_0p1B_short
  # ~200M val tokens per checkpoint, held ~constant across gbs (eval_iters below)
  # for a fair, low-variance PPL. Tunable.
  eval_tokens: 200_000_000
  # Placeholder defaults so the BASE config composes (aux.* are ??? in ml_base
  # and referenced by top-level data_cache_path/eval_iters). Every sweep point
  # overrides all of these per (variant, ladder, budget).
  size: 0.1B
  hidden: 512
  ffn: 1536
  layers: 16
  heads: 8
  qgroups: 8
  gqa: false
  mbs: 16
  gbs: 128
  tokens: 20_000_000_000

backend:
  # kda / signed_kda / panini live only in the repo's flash-linear-attention
  # checkout; the image ships FLA 0.3.2, which lacks them. apptainer takes
  # PYTHONPATH from THIS backend.env block (an explicit --env), so a host export
  # or a container-level setting is silently overridden. Without this the FLA
  # arms' evals die at model construction with
  #   ImportError: signed_kda needs a flash-linear-attention build carrying
  #   fla.layers.signed_kda_layer / fla.layers.panini_delta_attention (>= 0.5.x)
  # The train sweep already carries the identical line.
  env:
    PYTHONPATH: "flash-linear-attention:.:submodules/Megatron-LM"
  megatron:
    # Placeholder (overridden per ladder by the sweep); base compose needs it set.
    lr: 0.002
    # Liger fused linear cross-entropy — REQUIRED: the val-loss computation
    # otherwise materializes the full 262k-vocab logits and OOMs at ~64 GiB
    # (same as the training runs, which set this). Chunked so it fits 1 node.
    liger_fused_linear_cross_entropy: true
    liger_fused_linear_cross_entropy_chunk_size: 8192
    # ---- eval-only: no training, no save; load model weights only ----
    skip_train: true
    train_iters: 1
    lr_warmup_iters: 0            # avoid warmup>train_iters with train_iters=1
    eval_interval: 1
    eval_iters: "${oc.eval:'max(50, int(${aux.eval_tokens}/(${aux.seq_len}*${aux.gbs})))'}"
    data_path: []
    train_data_path: null
    test_data_path: null
    valid_data_path: ${aux.val_dataset.valid_data_path}
    split: null
    save: null
    save_extra_steps: []
    no_load_optim: true
    no_load_rng: true
    no_save_optim: true
    no_save_rng: true
    exit_on_missing_checkpoint: true
    # --ckpt-step is SILENTLY OVERRIDDEN when a non-persistent checkpoint with
    # iteration >= the requested step exists (checkpointing.py:1325). The stable
    # dirs carry non_persistent/iter_00680000-ish rotations, so evalstable_branch20BT
    # (ask 30517) and branch30BT (ask 45776) both loaded 68000 and returned
    # byte-identical losses; branch50BT (ask 76294) was correct only because
    # 76294 > 68000. Disabling the non-persistent type makes --ckpt-step
    # authoritative. EVAL-ONLY: on a TRAIN config this silently prevents restart
    # progress and produces a zero-progress restart loop.
    non_persistent_ckpt_type: null
    lr_wsd_decay_iters: 0
    # Per-eval-job val blend index dir (avoids concurrent-build races).
    data_cache_path: "${oc.env:OELLM_CACHE_DIR,'.cache'}/multiling_val_262k/${aux.variant}_${aux.size}_${stage}"
    wandb_project: dense_multilingual_scaling_matcheddown_0p1B_short_eval
    aux:
      # Resolves the ${backend.megatron.aux.val_datamix_prefix} refs inside the
      # included validation blend.
      val_datamix_prefix: /e/data1/datasets/products/openeurollm/pretokenized/openeurollm-tokenized-256k-val

slurm:
  sbatch:
    nodes: 1
    time: "3:00:00"
    exclude: jpbo-001-48

stage: eval

sweep:
  type: product
  store_sweep_json: true
  groups:
    # ===================== GROUP 0 — ARCHITECTURE =====================
    # PARAMETER-MATCHED **DOWN** to the existing fullattn/swa7 baseline
    # (188,809,216 params at ffn 1536), which is NOT re-run here -- it already
    # exists in the main_7to1 sweep at exactly this geometry and ladder.
    #
    # Matching has two parts:
    #   1. Every mixer is re-dimensioned to the SAME inner dim as dense
    #      attention: 8 heads x 64 = 512 = 1.0x hidden. The sweep's original
    #      hybrids ran head_dim 128 x 8 = 1024 = 2x hidden, which is the single
    #      largest source of the 10-30% parameter inflation. mamba2 uses
    #      mamba_num_heads 8 x mamba_head_dim 64 -> d_inner 512 (expand 1
    #      instead of 2). This also matches the flash-linear-attention LM
    #      configs, which run head_dim 64 with heads = hidden/64.
    #   2. The small residual is absorbed in aux.ffn, rounded to multiples of
    #      128. Residuals: gdn7 +0.38%, gdn3 +0.09%, mlstm7 +0.34%,
    #      mamba2 -0.73%, skda7 -0.61%, pda7 -0.12%.
    #
    # mamba2 is the worst fit because its B/C projections are ngroups(8) x
    # d_state(128) = 1024 each regardless of d_inner, so it cannot be shrunk to
    # the dense attention footprint by width alone; ffn 1024 (2.00x) is the
    # closest multiple of 128.
    #
    # Per-layer mixer at inner 512: dense attn 1,048,576 | gdn 1,325,056 (+26%)
    # | mlstm 1,318,912 (+26%) | mamba2 1,849,360 (+76%) | skda 1,190,984 (+14%)
    # | pda 1,257,040 (+20%).
    - type: list
      configs:
        - aux.variant: gdn7_nope
          aux.ffn: 1408
          backend.megatron.position_embedding_type: none
          backend.megatron.window_size: null
          backend.megatron.window_attn_skip_freq: null
          backend.megatron.experimental_attention_variant: gated_delta_net
          backend.megatron.linear_attention_freq: 8
          backend.megatron.linear_conv_kernel_dim: 4
          backend.megatron.linear_key_head_dim: 64
          backend.megatron.linear_value_head_dim: 64
          backend.megatron.linear_num_key_heads: 8
          backend.megatron.linear_num_value_heads: 8

        - aux.variant: gdn3_nope
          aux.ffn: 1408
          backend.megatron.position_embedding_type: none
          backend.megatron.window_size: null
          backend.megatron.window_attn_skip_freq: null
          backend.megatron.experimental_attention_variant: gated_delta_net
          backend.megatron.linear_attention_freq: 4
          backend.megatron.linear_conv_kernel_dim: 4
          backend.megatron.linear_key_head_dim: 64
          backend.megatron.linear_value_head_dim: 64
          backend.megatron.linear_num_key_heads: 8
          backend.megatron.linear_num_value_heads: 8

        - aux.variant: mlstm7_nope
          aux.ffn: 1408
          backend.megatron.position_embedding_type: none
          backend.megatron.window_size: null
          backend.megatron.window_attn_skip_freq: null
          backend.megatron.experimental_attention_variant: mlstm
          backend.megatron.linear_attention_freq: 8
          backend.megatron.mlstm_conv1d: false
          backend.megatron.linear_key_head_dim: 64
          backend.megatron.linear_value_head_dim: 64
          backend.megatron.linear_num_key_heads: 8
          backend.megatron.linear_num_value_heads: 8
          backend.megatron.mlstm_chunk_size: 128
          backend.megatron.mlstm_igate_bias_init: -8.0

        - aux.variant: mamba2_nope
          aux.ffn: 1024
          backend.megatron.position_embedding_type: none
          backend.megatron.window_size: null
          backend.megatron.window_attn_skip_freq: null
          backend.megatron.experimental_attention_variant: mamba
          backend.megatron.linear_attention_freq: 8
          backend.megatron.mamba_head_dim: 64
          backend.megatron.mamba_num_heads: 8      # -> d_inner 512 (expand 1)

        - aux.variant: skda7_nope
          aux.ffn: 1408
          backend.megatron.experimental_attention_variant: signed_kda
          backend.megatron.linear_attention_freq: 8
          backend.megatron.position_embedding_type: none
          backend.megatron.window_size: null
          backend.megatron.window_attn_skip_freq: null
          backend.megatron.linear_conv_kernel_dim: 4
          backend.megatron.linear_key_head_dim: 64
          backend.megatron.linear_num_key_heads: 8
          backend.megatron.linear_fla_gate: signed_sigmoid2
          backend.megatron.linear_fla_output_gate: lowrank
          backend.megatron.linear_fla_lower_bound: -5.0
          backend.megatron.linear_fla_allow_neg_eigval: true

        - aux.variant: pda7_nope
          aux.ffn: 1408
          backend.megatron.experimental_attention_variant: panini
          backend.megatron.linear_attention_freq: 8
          backend.megatron.linear_fla_v_gate: signed_sigmoid2
          backend.megatron.linear_fla_lower_bound_v: -2.0
          backend.megatron.position_embedding_type: none
          backend.megatron.window_size: null
          backend.megatron.window_attn_skip_freq: null
          backend.megatron.linear_conv_kernel_dim: 4
          backend.megatron.linear_key_head_dim: 64
          backend.megatron.linear_num_key_heads: 8
          backend.megatron.linear_fla_gate: signed_sigmoid2
          backend.megatron.linear_fla_output_gate: lowrank
          backend.megatron.linear_fla_lower_bound: -5.0
          backend.megatron.linear_fla_allow_neg_eigval: true

        - aux.variant: kda7_nope
          aux.ffn: 1408
          backend.megatron.experimental_attention_variant: kda
          backend.megatron.linear_attention_freq: 8
          backend.megatron.position_embedding_type: none
          backend.megatron.window_size: null
          backend.megatron.window_attn_skip_freq: null
          backend.megatron.linear_conv_kernel_dim: 4
          backend.megatron.linear_key_head_dim: 64
          backend.megatron.linear_num_key_heads: 8
          backend.megatron.linear_fla_lower_bound: -5.0
          backend.megatron.linear_fla_allow_neg_eigval: true

        - aux.variant: fullattn
          aux.ffn: 1536
          backend.megatron.position_embedding_type: rope
          backend.megatron.rotary_base: 10000
          backend.megatron.window_size: null
          backend.megatron.window_attn_skip_freq: null
          backend.megatron.experimental_attention_variant: null
          backend.megatron.linear_attention_freq: null

        - aux.variant: swa7_rope100k
          aux.ffn: 1536
          backend.megatron.position_embedding_type: rope
          backend.megatron.rotary_base: 100000
          backend.megatron.window_size: "1024,0"
          backend.megatron.window_attn_skip_freq: 8
          backend.megatron.experimental_attention_variant: null
          backend.megatron.linear_attention_freq: null

        - aux.variant: gdn3_qwen35
          aux.ffn: 1344
          backend.megatron.attention_output_gate: true
          backend.megatron.layernorm_zero_centered_gamma: true
          backend.megatron.position_embedding_type: rope
          backend.megatron.rotary_percent: 0.25
          backend.megatron.rotary_base: 10000
          backend.megatron.window_size: null
          backend.megatron.window_attn_skip_freq: null
          backend.megatron.experimental_attention_variant: gated_delta_net
          backend.megatron.linear_attention_freq: 4
          backend.megatron.linear_conv_kernel_dim: 4
          backend.megatron.linear_key_head_dim: 64
          backend.megatron.linear_value_head_dim: 64
          backend.megatron.linear_num_key_heads: 8
          backend.megatron.linear_num_value_heads: 8

        - aux.variant: skda7_shipped
          aux.ffn: 1408
          backend.megatron.experimental_attention_variant: signed_kda
          backend.megatron.linear_attention_freq: 8
          backend.megatron.position_embedding_type: none
          backend.megatron.window_size: null
          backend.megatron.window_attn_skip_freq: null
          backend.megatron.linear_conv_kernel_dim: 4
          backend.megatron.linear_key_head_dim: 64
          backend.megatron.linear_num_key_heads: 8
          backend.megatron.linear_fla_gate: signed_sigmoid2
          backend.megatron.linear_fla_output_gate: lowrank
          backend.megatron.linear_fla_lower_bound: -5.0
          backend.megatron.linear_fla_allow_neg_eigval: true
          # THE ABLATION: every channel starts at alpha = +(1 - dt), i.e. the
          # unsigned KDA baseline, instead of FLA's "spread" default which flips
          # the sign on a random half and scales f_proj[-1] by 0.1.
          backend.megatron.linear_fla_gate_init_style: shipped

        - aux.variant: pda7_shipped
          aux.ffn: 1408
          backend.megatron.experimental_attention_variant: panini
          backend.megatron.linear_attention_freq: 8
          backend.megatron.position_embedding_type: none
          backend.megatron.window_size: null
          backend.megatron.window_attn_skip_freq: null
          backend.megatron.linear_conv_kernel_dim: 4
          backend.megatron.linear_key_head_dim: 64
          backend.megatron.linear_num_key_heads: 8
          backend.megatron.linear_fla_gate: signed_sigmoid2
          backend.megatron.linear_fla_output_gate: lowrank
          backend.megatron.linear_fla_lower_bound: -5.0
          backend.megatron.linear_fla_allow_neg_eigval: true
          # THE ABLATION: every channel starts at alpha = +(1 - dt), i.e. the
          # unsigned KDA baseline, instead of FLA's "spread" default which flips
          # the sign on a random half and scales f_proj[-1] by 0.1.
          backend.megatron.linear_fla_gate_init_style: shipped
          backend.megatron.linear_fla_v_gate: signed_sigmoid2
          backend.megatron.linear_fla_lower_bound_v: -2.0

        - aux.variant: kda7_qwen35
          aux.ffn: 1408
          backend.megatron.experimental_attention_variant: kda
          backend.megatron.linear_attention_freq: 8
          # --- the three Qwen3.5 attention-side deltas ---
          backend.megatron.attention_output_gate: true
          backend.megatron.layernorm_zero_centered_gamma: true
          backend.megatron.position_embedding_type: rope
          backend.megatron.rotary_percent: 0.25
          backend.megatron.rotary_base: 10000
          backend.megatron.window_size: null
          backend.megatron.window_attn_skip_freq: null
          backend.megatron.linear_conv_kernel_dim: 4
          backend.megatron.linear_key_head_dim: 64
          backend.megatron.linear_num_key_heads: 8
          backend.megatron.linear_fla_lower_bound: -5.0
          backend.megatron.linear_fla_allow_neg_eigval: true

        - aux.variant: kda3_qwen35
          aux.ffn: 1408
          backend.megatron.experimental_attention_variant: kda
          backend.megatron.linear_attention_freq: 4
          # --- the three Qwen3.5 attention-side deltas ---
          backend.megatron.attention_output_gate: true
          backend.megatron.layernorm_zero_centered_gamma: true
          backend.megatron.position_embedding_type: rope
          backend.megatron.rotary_percent: 0.25
          backend.megatron.rotary_base: 10000
          backend.megatron.window_size: null
          backend.megatron.window_attn_skip_freq: null
          backend.megatron.linear_conv_kernel_dim: 4
          backend.megatron.linear_key_head_dim: 64
          backend.megatron.linear_num_key_heads: 8
          backend.megatron.linear_fla_lower_bound: -5.0
          backend.megatron.linear_fla_allow_neg_eigval: true

        - aux.variant: pda7_qwen35
          aux.ffn: 1408
          backend.megatron.experimental_attention_variant: panini
          backend.megatron.linear_attention_freq: 8
          # --- the three Qwen3.5 attention-side deltas ---
          backend.megatron.attention_output_gate: true
          backend.megatron.layernorm_zero_centered_gamma: true
          backend.megatron.position_embedding_type: rope
          backend.megatron.rotary_percent: 0.25
          backend.megatron.rotary_base: 10000
          backend.megatron.window_size: null
          backend.megatron.window_attn_skip_freq: null
          backend.megatron.linear_conv_kernel_dim: 4
          backend.megatron.linear_key_head_dim: 64
          backend.megatron.linear_num_key_heads: 8
          backend.megatron.linear_fla_lower_bound: -5.0
          backend.megatron.linear_fla_allow_neg_eigval: true
          backend.megatron.linear_fla_gate: signed_sigmoid2
          backend.megatron.linear_fla_output_gate: lowrank
          backend.megatron.linear_fla_v_gate: signed_sigmoid2
          backend.megatron.linear_fla_lower_bound_v: -2.0

        - aux.variant: skda3_qwen35
          aux.ffn: 1408
          backend.megatron.experimental_attention_variant: signed_kda
          backend.megatron.linear_attention_freq: 4
          backend.megatron.attention_output_gate: true
          backend.megatron.layernorm_zero_centered_gamma: true
          backend.megatron.position_embedding_type: rope
          backend.megatron.rotary_percent: 0.25
          backend.megatron.rotary_base: 10000
          backend.megatron.window_size: null
          backend.megatron.window_attn_skip_freq: null
          backend.megatron.linear_conv_kernel_dim: 4
          backend.megatron.linear_key_head_dim: 64
          backend.megatron.linear_num_key_heads: 8
          backend.megatron.linear_fla_lower_bound: -5.0
          backend.megatron.linear_fla_allow_neg_eigval: true
          backend.megatron.linear_fla_gate: signed_sigmoid2
          backend.megatron.linear_fla_output_gate: lowrank

        - aux.variant: skda7_qwen35
          aux.ffn: 1408
          backend.megatron.experimental_attention_variant: signed_kda
          backend.megatron.linear_attention_freq: 8
          backend.megatron.attention_output_gate: true
          backend.megatron.layernorm_zero_centered_gamma: true
          backend.megatron.position_embedding_type: rope
          backend.megatron.rotary_percent: 0.25
          backend.megatron.rotary_base: 10000
          backend.megatron.window_size: null
          backend.megatron.window_attn_skip_freq: null
          backend.megatron.linear_conv_kernel_dim: 4
          backend.megatron.linear_key_head_dim: 64
          backend.megatron.linear_num_key_heads: 8
          backend.megatron.linear_fla_lower_bound: -5.0
          backend.megatron.linear_fla_allow_neg_eigval: true
