    # ================= GROUP 1 — 0.1B-low ladder only =================
    # Two eval points per budget: the fully-decayed cooldown final, and the
    # stable pre-decay branch checkpoint it was seeded from.
    - type: list
      configs:
        # ---- 0.1B low: gbs128 lr2e-3 -> 20/30/50 BT ----
        - type: list
          defaults:
            aux.size: 0.1B
            aux.hidden: 512
            # aux.ffn set per variant in group 0 (matched-down, differs per arch)
            aux.layers: 16
            aux.heads: 8
            aux.qgroups: 8
            aux.gqa: false
            aux.mbs: 16
            aux.gbs: 128
            backend.megatron.lr: 0.002
          configs:
            - type: list
