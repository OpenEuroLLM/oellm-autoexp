# @package _global_
# Gated DeltaNet (GDN) variant overlay for the multilingual architecture-variant
# scaling rerun. Compose AFTER a size file, e.g.:
#   defaults: [size_0.1B, gdn_base, _self_]
#
# Replaces the SWA knobs from ml_base with Megatron 0.18.2's linear-attention
# variant (--experimental-attention-variant gated_delta_net, fla kernels).
# Layer pattern matches the swa5 hybrid exactly: with linear_attention_freq 6,
# layers 6,12,... (1-based) keep full softmax attention, all others are GDN
# (0.1B/16L: 14 GDN + 2 full; 0.9B/28L: 24 GDN + 4 full).
#
# Head geometry mirrors each size's attention projections:
#   linear_num_value_heads = num_attention_heads, linear_num_key_heads =
#   num_query_groups (GQA analog; v%k==0 holds), head dims = kv_channels (128).
# For 0.1B (hidden 512) this gives v_dim = 8*128 = 1024 = 2*hidden — the
# canonical GDN expand_v=2. Params are NOT identical to the baseline (GDN adds
# conv1d + per-head gate/decay params and drops the KV cache entirely); that is
# inherent to the variant.
#
# Requires the linattn container (fla + mlstm_kernels) and the
# v0.18.2-openeurollm Megatron submodule branch.

aux:
  variant: gdn5              # 5:1 GDN:full — mirrors swa5w1024 naming
  gdn_full_attn_freq: 6      # full softmax attention on every Nth layer (1-based)
  gdn_num_key_heads: ${aux.qgroups}
  gdn_num_value_heads: ${aux.heads}
  gdn_head_dim: 128          # = kv_channels of the baseline

backend:
  env:
    # Expose the JUPITER host driver library to Triton's runtime launcher.
    # See the matching explicit binds below.
    TRITON_LIBCUDA_PATH: /opt/nvidia/lib
  megatron:
    # ---- disable the SWA variant knobs from ml_base ----
    window_size: null
    window_attn_skip_freq: null

    # ---- GDN (Megatron 0.18.2 experimental attention variant) ----
    experimental_attention_variant: gated_delta_net
    linear_attention_freq: ${aux.gdn_full_attn_freq}
    linear_conv_kernel_dim: 4
    linear_key_head_dim: ${aux.gdn_head_dim}
    linear_value_head_dim: ${aux.gdn_head_dim}
    linear_num_key_heads: ${aux.gdn_num_key_heads}
    linear_num_value_heads: ${aux.gdn_num_value_heads}

    wandb_project: dense_multilingual_scaling_gdn

container:
  # Linear-attention image with NVRx 0.6.0, flash-linear-attention, and mLSTM kernels.
  image: ${oc.env:CONTAINER_CACHE_DIR,.}/MegatronTraining-JUPITER-linattn-nvrx_aarch64_202607291158.sif
  bind:
    - /e
    - /dev/shm
    - /usr/lib64/libcuda.so.1:/opt/nvidia/lib/libcuda.so.1:ro
    - /usr/lib64/libcuda.so:/opt/nvidia/lib/libcuda.so:ro
    - /usr/lib64/libnvidia-ml.so.1:/opt/nvidia/lib/libnvidia-ml.so.1:ro
    - /usr/lib64/libnvidia-ptxjitcompiler.so.1:/opt/nvidia/lib/libnvidia-ptxjitcompiler.so.1:ro
