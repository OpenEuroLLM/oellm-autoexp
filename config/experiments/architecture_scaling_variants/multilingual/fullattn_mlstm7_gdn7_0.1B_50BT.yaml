# @package _global_
# Initial multilingual architecture comparison at the smallest completed
# baseline cell: full attention, mLSTM, GDN, and sliding-window attention.
#
# Every point trains the 0.1B Qwen3-style model from scratch for 6B tokens
# with the completed 6B baseline setting: gbs=128, lr=5e-4, 2k warmup steps,
# and a linear WSD cooldown over the final 20% (2,289 of 11,445 iterations).
# The reference full-attention cell's end-of-decay 1%-split validation loss is
# 2.979. This rerun trains with the full training mix (100/0/0) and performs
# a common, separate `datamix4-val` evaluation after annealing. The full
# attention control keeps the baseline's RoPE; mLSTM and GDN use NoPE
# (`position_embedding_type: none`) to test their native recurrence without
# rotary positional embeddings. SWA uses RoPE with theta=100k: Megatron applies
# RoPE model-wide, so it cannot be limited to the local-attention layers.
#
# `linear_attention_freq: 8` and `window_attn_skip_freq: 8` each mean seven
# respective hybrid layers followed by one full-attention layer. With the
# 16-layer 0.1B model this is 14 hybrid layers and two full-attention layers.
defaults:
  - size_0.1B
  # Import the validation blend under aux so it is available to the final
  # eval-only stage without applying valid_data_path to the training jobs.
  - /backend/megatron/data_multilingual_1tt_val_jupiter@aux.val_dataset
  # Validated FLA/mLSTM + TP=1 Liger container, plus mamba-ssm for the Mamba2
  # variant (superset of jupiter_liger; the other four variants are unaffected).
  - override /container: jupiter_liger_mamba
  # Keep external monitoring, but do not auto-resubmit runtime failures: a
  # configuration/kernel error must be investigated before consuming another
  # 16-GPU allocation.
  - override /job: default
  - _self_

aux:
  # Fresh namespace: the old group contains stale current.log symlinks to the
  # retired projectnucleus scratch mount, which prevents DAG-condition checks.
  experiment_group: architecture_scaling_variants_multilingual_7to1_liger_mbs32
  variant: fullattn
  # Preserve the established optimization recipe: GBS=128, LR=5e-4.
  gbs: 128
  # One node / DP=4 / MBS=32 gives exactly GBS=128 in one microbatch and is
  # the measured high-throughput geometry for all four architecture variants.
  mbs: 32
  tokens: 6_000_000_000
  final_train_iters: "${oc.eval:'(${aux.tokens}+${aux.seq_len}*${aux.gbs}-1)//(${aux.seq_len}*${aux.gbs})'}"
  # This direct three-run comparison does not branch cooldowns from a stable
  # run, so disable the ladder-specific checkpoint list inherited from ml_base.
  extra_steps: []

backend:
  megatron:
    # The four independent jobs must not construct/cache the same blend index
    # concurrently: a partial shuffle-index file makes the other jobs fail
    # with EOFError.  The seed, blend, and sample counts remain identical.
    data_cache_path: "${oc.env:OELLM_CACHE_DIR,'.cache'}/multiling_1tt_262k/four_model_liger_6B/${aux.variant}"

    # The separately imported validation blend expands its paths through this
    # prefix; it is inert for the training stage.
    aux:
      val_datamix_prefix: /e/data1/datasets/products/openeurollm/pretokenized/openeurollm-tokenized-256k-val

    # Same direct WSD schedule as the completed 0.1B / gbs128 baseline cell.
    lr: 0.0005
    lr_decay_iters: null
    lr_wsd_decay_iters: 2289

    # Explicit chunks avoid Liger's automatic 256-token head loop. This is
    # the validated MBS=32 high-throughput path (317.2 TFLOP/s/GPU for full
    # attention; four-model Tok/s results are documented in the gate config).
    liger_fused_linear_cross_entropy: true
    liger_fused_linear_cross_entropy_chunk_size: 8192

    # Full attention with baseline RoPE is the root control. RNN hybrid points
    # below switch to NoPE; SWA overrides only the RoPE base.
    window_size: null
    window_attn_skip_freq: null
    experimental_attention_variant: null
    linear_attention_freq: null

    # Shared hybrid geometry. These have no effect in the full-attention point.
    linear_conv_kernel_dim: 4
    linear_key_head_dim: 128
    linear_value_head_dim: 128
    linear_num_key_heads: ${aux.qgroups}
    linear_num_value_heads: ${aux.heads}
    mlstm_chunk_size: 128

    wandb_project: dense_multilingual_scaling_7to1_comparison

slurm:
  env:
    # Gloo's automatic interface selection resolved to an unsupported address
    # family on the 2026-07-30 JUPITER allocation.  Use the same IPv4 IB
    # interface already selected for NCCL.
    GLOO_SOCKET_IFNAME: ib0
  sbatch:
    nodes: 1  # DP=4, MBS=32, GBS=128; matches the validated benchmark.
    # booster partition QOS permits at most 12 hours per job.
    time: "12:00:00"
    # Known node where the validated image exposed zero CUDA devices.
    exclude: jpbo-001-48

stage: final6BT

sweep:
  type: product
  store_sweep_json: true
  groups:
    - type: list
      configs:
        # Baseline-compatible full-attention control: retains RoPE.
        - aux.variant: fullattn

        # RNN hybrids use NoPE; their recurrent state provides the positional
        # signal under test, rather than an additional RoPE signal.
        - aux.variant: mlstm7_nope
          backend.megatron.position_embedding_type: none
          backend.megatron.experimental_attention_variant: mlstm
          backend.megatron.linear_attention_freq: 8

        - aux.variant: gdn7_nope
          backend.megatron.position_embedding_type: none
          backend.megatron.experimental_attention_variant: gated_delta_net
          backend.megatron.linear_attention_freq: 8

        # Megatron supplies RoPE globally, not only to SWA layers. Use a longer
        # theta (100k) for the entire SWA 7:1 model as the available fallback.
        - aux.variant: swa7_rope100k
          backend.megatron.position_embedding_type: rope
          backend.megatron.rotary_base: 100000
          backend.megatron.window_size: "1024,0"
          backend.megatron.window_attn_skip_freq: 8

        # 7:1 Mamba2 + NoPE. Mamba2 slots into the same linear-attention dispatch
        # as mLSTM/GDN (experimental_attention_variant=mamba, freq 8). It uses its
        # own state/head/group dims (mamba_state_dim 128, mamba_head_dim 64,
        # mamba_num_groups 8, expand 2 -> 16 heads at 0.1B); the shared
        # linear_* head knobs above are inert for it. Requires the mamba container.
        - aux.variant: mamba2_nope
          backend.megatron.position_embedding_type: none
          backend.megatron.experimental_attention_variant: mamba
          backend.megatron.linear_attention_freq: 8

    # Train once, then run the common external validation blend from the final
    # checkpoint. Keeping this as a stage sibling makes each eval wait only for
    # its corresponding architecture, rather than for the entire sweep.
    - type: list
      configs:
        - stage: final6BT
          backend.megatron.split: '100,0,0'
          # No validation split at train time (100,0,0), so disable the
          # in-loop periodic evaluation. Megatron forces do_valid=True whenever
          # eval_iters > 0 (even with an empty valid dataloader), which made all
          # four runs crash at iter 1600 with "'NoneType' object is not an
          # iterator". Validation happens in the separate eval6BT stage.
          backend.megatron.eval_iters: 0

        - stage: eval6BT
          backend.megatron.skip_train: true
          backend.megatron.train_iters: 1
          backend.megatron.eval_interval: 1
          backend.megatron.eval_iters: "${oc.eval:'int(204800 // ${aux.gbs})'}"
          backend.megatron.data_path: []
          backend.megatron.train_data_path: null
          backend.megatron.valid_data_path: ${aux.val_dataset.valid_data_path}
          backend.megatron.test_data_path: null
          backend.megatron.split: null
          backend.megatron.load: "\\${sibling.final6BT.job.base_output_dir}/"
          backend.megatron.exit_on_missing_checkpoint: true
          backend.megatron.save_interval: 1
          backend.megatron.no_save_optim: true
          backend.megatron.no_save_rng: true
          backend.megatron.no_load_optim: true
          backend.megatron.no_load_rng: true
          container.env.WANDB_MODE: offline
          slurm.sbatch.nodes: 1
          slurm.sbatch.time: "4:00:00"
          job.start_condition:
            class_name: FileExistsCondition
            path: "\\${sibling.final6BT.job.base_output_dir}/iter_\\${oc.eval:'str(\\${aux.final_train_iters}).zfill(7)'}"
          job.cancel_condition:
            class_name: LogPatternCondition
            log_path: "\\${sibling.final6BT.job.log_path_current}"
            pattern: "FATAL ERROR|OutOfMemoryError|Traceback"
