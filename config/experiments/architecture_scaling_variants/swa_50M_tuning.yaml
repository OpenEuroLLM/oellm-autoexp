# @package _global_
# Phase 1 — 50M tuning-transfer check (recommended_runs.csv): 3 gbs x 3 lr
# grid centered on the baseline optimum (gbs 32, lr 1e-3), half/double
# spacing, budgets 6/12/20B (stable to 16B per combo). Est ~78 GPU-hrs.
# Purpose: verify baseline (bs, lr) optima transfer to the SWA architecture —
# otherwise "scaling changed" and "wrong lr" are indistinguishable.
defaults:
  - size_50M
  - _self_

aux:
  gbs: 32     # overridden by sweep
  mbs: 4      # divides gbs/dp for all grid points on 1 node
  tokens: 16_000_000_000
  # stage group is groups.1 here (groups.0 is the hyperparameter grid)
  extra_steps: ${oc.mapeval:${oc.maptmpl:'int((((% + ${aux.seq_len}*${aux.gbs})-1)//(${aux.seq_len}*${aux.gbs}))*(1-${aux.decay_fraction}))',${oc.mapextractkey:aux.tokens,${sweep.groups.1.configs.1.configs}}}}

backend:
  megatron:
    lr: 0.001   # overridden by sweep

slurm:
  sbatch:
    nodes: 1

sweep:
  type: product
  store_sweep_json: true
  groups:
    # hyperparameter grid: 9 combos
    - type: list
      configs:
        - type: product
          params:
            aux.gbs: [16, 32, 64]
            backend.megatron.lr: [0.0005, 0.001, 0.002]

    # stages: stable + cooldowns per combo
    - type: list
      configs:
        - stage: stable
          aux.tokens: 16_000_000_000
          backend.megatron.train_iters: "\\${oc.eval:'max(\\${aux.extra_steps})'}"
          backend.megatron.lr_wsd_decay_iters: 0

        - type: list
          defaults:
            aux.start_iter: "\\${oc.eval:'int(((\\${aux.tokens}+\\${aux.seq_len}*\\${aux.gbs}-1)//(\\${aux.seq_len}*\\${aux.gbs}))*(1-\\${aux.decay_fraction}))'}"
            backend.megatron.lr_wsd_decay_iters: "\\${oc.eval:'\\${backend.megatron.train_iters}-\\${aux.start_iter}'}"
            backend.megatron.load: "\\${sibling.stable.job.base_output_dir}/"
            backend.megatron.ckpt_step: "\\${aux.start_iter}"
            backend.megatron.override_opt_param_scheduler: true
            stage: "decay\\${oc.eval:'int(\\${aux.tokens}//10**9)'}B"
            job.start_condition:
              class_name: FileExistsCondition
              path: "\\${sibling.stable.job.base_output_dir}/iter_\\${oc.eval:'str(\\${aux.start_iter}).zfill(7)'}"
            job.cancel_condition:
              class_name: LogPatternCondition
              log_path: "\\${sibling.stable.job.log_path_current}"
              pattern: "FATAL ERROR|OutOfMemoryError|Traceback"
          configs:
            - aux.tokens: 6_000_000_000
            - aux.tokens: 12_000_000_000
            - aux.tokens: 20_000_000_000
