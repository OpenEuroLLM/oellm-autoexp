# @package _global_
# GDN delta-rule beta-activation probe at the 130M / 6BT basis.
#
# Basis: swa_130M_low.yaml (130M = 124.5M params, gbs 32, lr 5e-4, 1 node),
# trimmed to the SINGLE 6BT cooldown. NOT a scale sweep.
#
# Question: does letting the delta-rule step size beta exceed 1 -- so the state
# transition (I - beta k k^T) gains NEGATIVE eigenvalues -- help, and does a
# flat "stable regime" around the pure-erase point help further?
#
#   beta = linear_beta_max * g(x);  transition eigenvalue = 1 - beta.
#
#   gdn_beta1      max 1.0, g = sigmoid(x)
#                  beta in (0,1)  -> eigenvalues (0,1]   [BASELINE, standard GDN]
#   gdn_beta2      max 2.0, g = sigmoid(x)
#                  beta in (0,2)  -> eigenvalues (-1,1), slope 0.50 at x=0
#   gdn_beta2_plat max 2.0, g = (sigmoid(4(x-1)) + sigmoid(4(x+1)))/2
#                  beta in (0,2)  -> eigenvalues (-1,1), beta(0)=1 EXACTLY,
#                  slope 0.071 at x=0 (3.5x flatter): a stable plateau at
#                  eigenvalue 0 (pure delta-rule erase), with contraction and
#                  reflection still reachable in the tails.
#
# The gdn_beta1 arm is included because this experiment family has no existing
# GDN result at this cell (swa_base defaults to swa6w1024), so the beta variants
# would otherwise have nothing to be compared against. All three share the
# identical geometry/ladder, so they are exactly matched-pair comparable.
#
# 3 variants x (1 stable + 1 cooldown@6BT) = 6 jobs, 1 node each.
defaults:
  - size_130M
  - _self_

aux:
  gbs: 32
  mbs: 8
  tokens: 24_000_000_000

  # swa_base derives extra_steps by CITING a sweep path
  # (sweep.groups.0.configs.1.configs), which assumes the stage group is group
  # 0. This file prepends a variant group, so that citation would resolve to
  # the wrong node (InterpolationKeyError). Derive from an explicit budget list
  # instead -- same approach main_scaling_all.yaml uses, and it stays correct
  # regardless of how the sweep groups are ordered.
  budgets: [6_000_000_000]
  extra_steps: "${oc.mapeval:${oc.maptmpl:'int((((% + ${aux.seq_len}*${aux.gbs})-1)//(${aux.seq_len}*${aux.gbs}))*(1-${aux.decay_fraction}))',${aux.budgets}}}"

backend:
  megatron:
    lr: 0.0005

slurm:
  sbatch:
    nodes: 1   # dp=4, mbs 8 -> GA 1

sweep:
  type: product
  store_sweep_json: true
  groups:
    # ===================== GROUP 0 — BETA VARIANT =====================
    # GDN with NoPE, 7:1 linear:attention (linear_attention_freq 8), matching
    # the gdn7_nope arm of the multilingual sweep. SWA knobs from swa_base are
    # cleared so these are pure GDN hybrids, not windowed attention.
    - type: list
      configs:
        - aux.variant: gdn_beta1
          backend.megatron.position_embedding_type: none
          backend.megatron.window_size: null
          backend.megatron.window_attn_skip_freq: null
          backend.megatron.experimental_attention_variant: gated_delta_net
          backend.megatron.linear_attention_freq: 8
          backend.megatron.linear_conv_kernel_dim: 4
          backend.megatron.linear_key_head_dim: 128
          backend.megatron.linear_value_head_dim: 128
          backend.megatron.linear_num_key_heads: "\\${aux.heads}"
          backend.megatron.linear_num_value_heads: "\\${aux.heads}"
          backend.megatron.linear_beta_max: 1.0
          backend.megatron.linear_beta_activation: sigmoid

        - aux.variant: gdn_beta2
          backend.megatron.position_embedding_type: none
          backend.megatron.window_size: null
          backend.megatron.window_attn_skip_freq: null
          backend.megatron.experimental_attention_variant: gated_delta_net
          backend.megatron.linear_attention_freq: 8
          backend.megatron.linear_conv_kernel_dim: 4
          backend.megatron.linear_key_head_dim: 128
          backend.megatron.linear_value_head_dim: 128
          backend.megatron.linear_num_key_heads: "\\${aux.heads}"
          backend.megatron.linear_num_value_heads: "\\${aux.heads}"
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_beta_activation: sigmoid

        - aux.variant: gdn_beta2_plat
          backend.megatron.position_embedding_type: none
          backend.megatron.window_size: null
          backend.megatron.window_attn_skip_freq: null
          backend.megatron.experimental_attention_variant: gated_delta_net
          backend.megatron.linear_attention_freq: 8
          backend.megatron.linear_conv_kernel_dim: 4
          backend.megatron.linear_key_head_dim: 128
          backend.megatron.linear_value_head_dim: 128
          backend.megatron.linear_num_key_heads: "\\${aux.heads}"
          backend.megatron.linear_num_value_heads: "\\${aux.heads}"
          backend.megatron.linear_beta_max: 2.0
          backend.megatron.linear_beta_activation: double_sigmoid

    # ===================== GROUP 1 — STAGES =====================
    # Identical to swa_130M_low.yaml, with the cooldown list trimmed to 6BT.
    # The stable therefore runs only to 0.8 x 6BT (max of extra_steps), not to
    # 24BT -- the trunk is exactly as long as the single branch point needs.
    - type: list
      configs:
        # STABLE: constant lr up to the last branch point (0.8 x max budget)
        - stage: stable
          aux.tokens: 24_000_000_000
          backend.megatron.train_iters: "\\${oc.eval:'max(\\${aux.extra_steps})'}"
          backend.megatron.lr_wsd_decay_iters: 0

        # COOLDOWN: branch from stable at 0.8xD, linear decay over the final
        # 20% of iters down to min_lr (baseline WSD recipe).
        - type: list
          defaults:
            aux.start_iter: "\\${oc.eval:'int(((\\${aux.tokens}+\\${aux.seq_len}*\\${aux.gbs}-1)//(\\${aux.seq_len}*\\${aux.gbs}))*(1-\\${aux.decay_fraction}))'}"
            backend.megatron.lr_wsd_decay_iters: "\\${oc.eval:'\\${backend.megatron.train_iters}-\\${aux.start_iter}'}"
            backend.megatron.load: "\\${sibling.stable.job.base_output_dir}/"
            backend.megatron.ckpt_step: "\\${aux.start_iter}"
            backend.megatron.override_opt_param_scheduler: true
            stage: "decay\\${oc.eval:'int(\\${aux.tokens}//10**9)'}B"
            job.start_condition:
              class_name: FileExistsCondition
              path: "\\${sibling.stable.job.base_output_dir}/iter_\\${oc.eval:'str(\\${aux.start_iter}).zfill(7)'}"
            job.cancel_condition:
              class_name: LogPatternCondition
              log_path: "\\${sibling.stable.job.log_path_current}"
              pattern: "FATAL ERROR|OutOfMemoryError|Traceback"
          configs:
            - aux.tokens: 6_000_000_000
