defaults:
 - default

# Mark the job finished without (re)submitting if it already reached its
# target iteration in a past attempt's log (e.g. it crashed on distributed
# teardown right after its final save, before printing "[after training is
# done]"). Checked before start_condition/log_events every poll, so this
# alone is enough to stop the restart loop for already-completed jobs.
finish_condition:
  class_name: ShellCommandCondition
  command: "grep -qE 'successfully saved checkpoint from iteration[[:space:]]+${backend.megatron.train_iters}[[:space:]]' ${job.base_output_dir}/logs/*.log 2>/dev/null"

log_events:
  - name: finished_training
    pattern: "[after training is done]"
    pattern_type: substring
    action:
      class_name: FinishAction
      reason: "Training finished"
  - name: finish
    pattern: ".*validation loss.*on (validation|test) set.*"
    pattern_type: regex
    action:
      class_name: FinishAction
      reason: "Validation Evaluation Finished"
  - name: error
    pattern: "Exited with exit code 1"
    pattern_type: substring
    action:
      class_name: RestartAction
      reason: ""
  # TIME LIMIT IS ALREADY HANDLED IN DEPENDENCY CHAIN
  # - name: time_limit
  #   pattern: "DUE TO TIME LIMIT"
  #   pattern_type: substring
  #   action:
  #     class_name: RestartAction
  #     reason: ""
  - name: inactive
    pattern_type: inactivity
    # Restart only after the log has been silent for >=5 consecutive polls AND
    # >=300s of real elapsed time (both must hold). At the default 60s poll
    # interval these coincide (~5 min); the time floor keeps it correct if the
    # poll interval changes or a poll is skipped.
    inactivity_polls: 5
    inactivity_timeout_s: 300
    action:
      class_name: RestartAction
      reason: ""
  - name: connection_failure
    pattern: "Application launch failed: Communication connection failure"
    pattern_type: substring
    action:
      class_name: RestartAction
      reason: ""
  - name: segmentation_fault
    pattern: "Fatal Python error: Segmentation fault"
    pattern_type: substring
    action:
      class_name: RestartAction
      reason: ""
  - name: node_failure
    pattern: "CANCELLED AT .* DUE TO NODE FAILURE"
    pattern_type: regex
    action:
      class_name: RestartAction
      reason: "Node failure"

state_events:
  - name: "failed"
    transition: ["RUNNING", "FAILED"]
    action:
      class_name: RestartAction
      reason: "Job failed"
  - name: "cancelled"
    transition: ["RUNNING", "CANCELLED"]
    action:
      class_name: RestartAction
      reason: "Job cancelled"
