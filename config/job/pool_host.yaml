defaults:
  - default

# A pool HOST config: run_autoexp creates/updates the pool at job.base_output_dir (its pool dir)
# and becomes its monitor; the host jobs themselves are created by the monitor on demand.
# Pair with `/backend: pool_host` and a `*_pool_host` slurm group. Jobs go INTO the pool with
# `run_autoexp.py --pool <pool dir> ...` or `job.pool_dir: <pool dir>` in their own config.
#
# The host needs no log policy: its runs carry their own, and every end of a host is final
# (its runs are requeued by the pool).
log_events: []
state_events: []

pool_host:
  name: ${job.name}
  # hosts running at once; with handover the oldest beyond this is retired when a newer is up
  max_hosts_running: 1
  # successor hosts kept waiting in the queue while there is work (no dependency: they age)
  keep_pending: 0
  # hosts kept submitted even without work, until `pool_ctl close`
  min_hosts: 0
  handover: false
  # do not retire a host younger than this (no ping-pong between fresh allocations)
  handover_min_age_s: 1800
  # queue successors only once the running host is this old (0 = at once; short queues: raise)
  successor_delay_s: 0
  idle_exit_s: 1200
  monitor_dead_exit_s: 1800
  min_remaining_s: 900
  # a host that cannot run any queued job is released only once that lasted this long, and
  # never while min_hosts holds it (a step's nodes can look unusable for a poll after it ends)
  insufficient_grace_s: 900
  # false: never cancel a queued host automatically (its queue age is the point); close still does
  cancel_surplus_queued: true
  # true: a host starting while the run's host is younger than handover_min_age_s (block time)
  # never takes the run then; it idles as a standby and idle_exit_s releases it
  handover_release_newer: false
  # seconds such a block-time standby is kept before release; < 0 = after idle_exit_s, 0 = at once
  block_standby_s: -1
  # successor gate: during the block, submit a successor only if `sbatch --test-only` predicts
  # a start no earlier than successor_lead_s before the block ends (re-tested every interval);
  # from then on submit regardless. Off by default.
  successor_test_start: false
  successor_test_interval_s: 600
  successor_lead_s: 900
  stop_grace_s: 120
  preempt_grace_s: 900
  max_attempts: 20
  host_stale_s: 900
  poll_s: 10
  # SLURM accounts in order of preference ("cns144,ehpc533"; "" = the host config's own): the
  # first queues the usual hosts, every other one insurance host while nothing runs or once
  # the running host has less than fallback_lead_s left (0 = always); first to start wins
  host_accounts: ""
  fallback_lead_s: 0
  # queued insurance hosts per non-first account (they age in that account's queue)
  fallback_hosts: 1
  # adopted hosts (pool_ctl adopt): stop the runs this long before the job's own end; cancel
  # the job if it runs but the adoption hook has not engaged within adopt_hook_timeout_s
  adopt_stop_margin_s: 1800
  adopt_hook_timeout_s: 90
  # hosts the pool submits itself (-1: unlimited; 0: only adopted jobs)
  max_own_hosts: -1
  # runs packed side by side on one host (disjoint nodes); 1 = one run at a time
  max_runs_per_host: 1
  # monitor stays up while the pool is open, also without work (pools used in bursts)
  keep_monitor: false
  # job.metadata.pool_singleton across pools: a higher priority pool supersedes a lower one's
  # run whatever the sizes (equal: more nodes wins), e.g. the budget to use first
  singleton_priority: 0
  # pre-run node check, off when empty (see PoolHostConfig): e.g.
  #   "bash scripts/nodecheck.sh; apptainer exec --nv <sif> python3 scripts/pool/gpu_gemm_probe.py"
  precheck_command: ""
  precheck_timeout_s: 600
  precheck_slow_tolerance: 0.10
  # after a failed run: wait for its leftovers to free the GPUs (see PoolHostConfig)
  settle_timeout_s: 600
  settle_gpu_mib: 2048
  # more busy nodes than this after settle_timeout_s: exclude none (systemic, not bad nodes)
  settle_max_exclude: 8
