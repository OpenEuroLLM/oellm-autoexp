defaults:
  - default

# A pool HOST config: run_autoexp creates/updates the pool at job.base_output_dir (its pool dir)
# and becomes its monitor; the host jobs themselves are created by the monitor on demand.
# Pair with `/backend: pool_host` and a `*_pool_host` slurm group. Jobs go INTO the pool with
# `run_autoexp.py --pool <pool dir> ...` or `job.pool_dir: <pool dir>` in their own config.
#
# The host needs no log policy: its runs carry their own, and every end of a host is final
# (its runs are requeued by the pool).
log_events: []
state_events: []

pool_host:
  name: ${job.name}
  # hosts running at once; with handover the oldest beyond this is retired when a newer is up
  max_hosts_running: 1
  # successor hosts kept waiting in the queue while there is work (no dependency: they age)
  keep_pending: 0
  # hosts kept submitted even without work, until `pool_ctl close`
  min_hosts: 0
  handover: false
  # do not retire a host younger than this (no ping-pong between fresh allocations)
  handover_min_age_s: 1800
  # queue successors only once the running host is this old (0 = at once; short queues: raise)
  successor_delay_s: 0
  idle_exit_s: 1200
  monitor_dead_exit_s: 1800
  min_remaining_s: 900
  stop_grace_s: 120
  preempt_grace_s: 900
  max_attempts: 20
  host_stale_s: 900
  poll_s: 10
  # SLURM accounts in order of preference ("cns144,ehpc533"; "" = the host config's own): the
  # first queues the usual hosts, every other one insurance host while nothing runs or once
  # the running host has less than fallback_lead_s left (0 = always); first to start wins
  host_accounts: ""
  fallback_lead_s: 0
  # adopted hosts (pool_ctl adopt): stop the runs this long before the job's own end; cancel
  # the job if it runs but the adoption hook has not engaged within adopt_hook_timeout_s
  adopt_stop_margin_s: 1800
  adopt_hook_timeout_s: 90
  # hosts the pool submits itself (-1: unlimited; 0: only adopted jobs)
  max_own_hosts: -1
  # runs packed side by side on one host (disjoint nodes); 1 = one run at a time
  max_runs_per_host: 1
  # monitor stays up while the pool is open, also without work (pools used in bursts)
  keep_monitor: false
  # node check of every new host before it takes work: GPU count per node (srun probe in the
  # supervisor, 0 = off) and the node-health benchmark (oellm_autoexp/node_health) on all free
  # nodes, from the job of the config preflight_check names (+ preflight_check_overrides; it
  # gets the host's account / partition / qos; run_autoexp enqueues it with the pool). A node
  # with a GPU or GPU group below preflight_ratio x median is excluded and the benchmark
  # repeated (up to preflight_max_rounds); a host that fails is released
  preflight: false
  preflight_gpus_per_node: 0
  preflight_gpu_cmd: 'nvidia-smi -L 2>/dev/null | grep -c "^GPU"'
  preflight_ratio: 0.75
  preflight_max_rounds: 3
  preflight_check: ""
  preflight_check_overrides: []
  # verified handover: the old host's runs are stopped, the old host is KEPT until the moved
  # runs logged handover_healthy_steps lines matching handover_healthy_pattern on the new one;
  # if they fail or time out the NEW host is released and the runs go back to the old one
  handover_verify: false
  handover_healthy_steps: 3
  handover_healthy_pattern: 'iteration\s+\d+/'
  handover_verify_timeout_s: 3600
  # hosts stay allocated without work (no idle exit, no retirement); per host: pool_ctl hold
  hold_hosts: false
