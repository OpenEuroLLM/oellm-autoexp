defaults:
  - megatron: base
  - _self_

# Block-diffusion (BD3/SDAR-style) training with MegaDLMs. Same as megadlm_torchrun.yaml, but the
# launcher is oellm_autoexp/dllm/pretrain_block_difflm.py and the --bd-* flags of the launcher are
# appended from aux.bd_args. See docs/dllm_block_diffusion.md.
class_name: MegatronBackend

python_cmd: "python"  # not used anyways
full_schema_validation: false
launcher_script: "./oellm_autoexp/dllm/pretrain_block_difflm.py"
dist_cmd: "torchrun ${oc.join:'',${oc.mapcondtmpl:'\\-\\-.*','\\\n  %',' %',\
 ${oc.cliargs:${.torchrun_args}}}}\\\n   ${.launcher_script}"
torchrun_args:
  nproc_per_node: ${slurm.sbatch.gpus_per_node}
  nnodes: ${slurm.sbatch.nodes}
  max_restarts: 0
  tee: 3
  rdzv_endpoint: "$MASTER_ADDR:$MASTER_PORT"
  rdzv_backend: "static"
  node_rank: "$SLURM_NODEID"
  master_addr: "$MASTER_ADDR"
  master_port: "$MASTER_PORT"
env:
  PYTHONPATH: ".:submodules/MegaDLMs"
  RUN_DIR: ${.PROJECT_DIR}/submodules/MegaDLMs
  PROJECT_DIR: ${oc.env:PROJECT_DIR,.}
  HF_HOME: ${oc.env:HF_HOME,"/scratch-shared/${oc.env:USER}/hf"}
  # Converted checkpoints are torch-format pickles (spec section 13), and jobs run offline.
  TORCH_FORCE_NO_WEIGHTS_ONLY_LOAD: "1"
  HF_HUB_OFFLINE: "1"
  # W&B runs are written to megatron.wandb_save_dir; upload them with `wandb sync <dir>`. Jobs do
  # not depend on W&B credentials on the compute nodes.
  WANDB_MODE: offline

# MegaDLMs flags (difflm_args) and launcher flags (bd_args) are appended verbatim to full_cmd,
# because build_cmdline_args only emits keys of the stock Megatron schema.
# Override per experiment: backend: {aux: {difflm_args: "...", bd_args: "..."}}
aux:
  difflm_args: ""
  bd_args: ""

full_cmd: "${.dist_cmd} ${oc.join:'',${oc.mapcondtmpl:'\\-\\-.*','\\\n   %',' %',${oc.argsmegatron:${backend.megatron}}}} ${.aux.difflm_args} ${.aux.bd_args}"
