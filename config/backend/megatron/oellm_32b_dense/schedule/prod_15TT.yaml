# @package backend.megatron
#
# Production schedule for the 32B dense flagship run — SAMPLE-BASED.
#
# WHY SAMPLES AND NOT ITERATIONS
# ------------------------------
# Megatron refuses `--rampup-batch-size` for iteration-based training
# (arguments.py:791) and, once `train_samples` is set, asserts that train_iters
# is None, lr_decay_iters is None and lr_warmup_iters == 0 (arguments.py:796).
# Keeping the whole family of runs in samples means the GBS-rampup variant
# differs from the no-rampup variant by exactly ONE added key, and every variant
# sees the same LR at the same *token* count.
#
# WHY THIS IS ITS OWN CONFIG GROUP
# --------------------------------
# The Megatron dataset cache key includes `num_samples` per split
# (megatron_dataset.py:61) — so the index/shuffle caches are only shared between
# two runs if `train_samples`, `global_batch_size`, `eval_interval` and
# `eval_iters` all match. The data-cache PREBUILD job must therefore use exactly
# these numbers, which is why they live here instead of inline in the experiment.
# Changing anything in this file invalidates the (expensive) 15 T train index.
#
# 1 sample = seq_length = 4096 tokens.

global_batch_size: 4096            # 16.78 M tokens/iter
train_samples: 3661824000          # 15.00 T tokens = 894,000 iters at GBS 4096
lr_warmup_samples: 16384000        #   67 B tokens =   4,000 iters at GBS 4096
lr_wsd_decay_samples: 366182400    # 10% tail      =  89,400 iters at GBS 4096

# sample-based mode requires the iteration-based twins to stay off
train_iters: null
lr_warmup_iters: 0
lr_decay_iters: null
lr_wsd_decay_iters: null

# Shared across ALL variants on purpose (NOT keyed on job.name): the index files
# are content-hashed internally, so one directory serves the prebuild job and
# every training variant. Keying it on the run name would make each variant
# rebuild the 15 T train index from scratch.
#
# MOVED TO /e/fscratch Sep 2026, together with the shards. The index key includes
# `dataset_path` (megatron_dataset.py `_key_config_attributes`), so the switch of
# data_args_path to flagship_datamix_option5_fscratch.txt -- whose shards live
# under /e/fscratch/.../training_v2/ -- invalidated EVERY entry in the old
# directory. Leaving this on /e/scratch therefore did not merely read a stale
# cache, it turned every run into a clean miss, and Megatron answers a miss by
# building the 15 T train index inline, inside the training allocation.
#
# The directory below is the one that matches: 452 train descriptions, all at
# random_seed 1234 and all with dataset_path under
# /e/fscratch/e-sta-openeurollm/training_v2/. Verified by reading the cache's own
# *-GPTDataset-train-description.txt files, which record the exact config each
# index was built from. It is also the cache oellm_32b_dense_revival_1 has been
# running against since Sep 2.
#
# The old /e/scratch directory (875 GB) and
# /e/fscratch/.../pre_production_training/.../data_cache (340 GB, seeds 1234 AND
# 4321) are both keyed on the OLD /e/scratch/.../training/ paths and are dead
# weight for anything using the fscratch mix. Do not point new runs at either.
data_cache_path: /e/fscratch/e-sta-openeurollm/production_training/oellm_32b_dense/cache
