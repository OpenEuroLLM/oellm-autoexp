# @package backend.megatron
# Dataset related settings for the 32B dense run
max_position_embeddings: ${.seq_length}
split: '998,2,0'
create_attention_mask_in_dataloader: false

# Data paths
# data_args_path: /e/data1/datasets/playground/mmlaion/oellm/flagship_datamix.txt  # superseeded
# data_args_path: /e/data1/datasets/playground/mmlaion/oellm/flagship_datamix_option9.txt
data_args_path: /e/data1/datasets/playground/mmlaion/oellm/flagship_datamix_option5.txt # switch Aug 24 2026

# Tokenizer
tokenizer_type: HuggingFaceTokenizer
tokenizer_model: /e/data1/datasets/playground/mmlaion/oellm/oellm_tokenizer_256k


seq_length: 4096
dataloader_type: "cyclic"
num_workers: 16
num_dataset_builder_threads: 64
