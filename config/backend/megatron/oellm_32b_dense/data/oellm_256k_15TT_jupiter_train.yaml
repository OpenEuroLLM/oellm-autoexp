# @package backend.megatron
# Dataset related settings for the 32B dense run
max_position_embeddings: ${.seq_length}
split: '99,1,0'
create_attention_mask_in_dataloader: false

# Data paths
data_args_path: #.../15T_datamix.txt

# Tokenizer
tokenizer_type: HuggingFaceTokenizer
tokenizer_model: /e/project1/e-ext-2025e02-108/production_training/oellm_32b_dense/tokenizer_256k/


seq_length: 4096
dataloader_type: "cyclic"
num_workers: 4
num_dataset_builder_threads: 64
