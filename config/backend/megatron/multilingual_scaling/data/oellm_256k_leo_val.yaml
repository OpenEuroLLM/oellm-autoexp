# @package backend.megatron
# Dataset related settings for multilingual scaling experiments (Leonardo)
# Uses Swagatam's tokenizer and data paths on Leonardo.
max_position_embeddings: ${.seq_length}
split: '99,1,0'
create_attention_mask_in_dataloader: False

# Data paths
data_args_path: /leonardo_work/OELLM_prod2026/users/donutu00/datamix-tools/output/1TT-option-4-val-fixed_no_high_actual_merged.sh

# Tokenizer
tokenizer_type: HuggingFaceTokenizer
tokenizer_model: /leonardo_work/OELLM_prod2026/users/shaldar0/tokenizers/openeurollm-tokenizer-256k

seq_length: 4096
dataloader_type: "cyclic"
num_workers: 8 # Will be overridden by sweep
