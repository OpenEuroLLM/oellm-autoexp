# @package backend.megatron
# Dataset related settings for multilingual scaling experiments (LUMI)
max_position_embeddings: ${.seq_length}
split: '99,1,0'
create_attention_mask_in_dataloader: False

# Data paths
data_path:
      - /flash/project_465002530/users/niccolo/copy_nemotron_downsampled_15p/high-all

# Tokenizer
tokenizer_type: HuggingFaceTokenizer
tokenizer_model: openeurollm/tokenizer-256k

seq_length: 4096
dataloader_type: "cyclic"
num_workers: 7 # Will be overridden by sweep. Value taken from Ville 1.7B run

# need to be set on lumi for ROCm based models to work
add_bias_linear: false
gradient_accumulation_fusion: false
masked_softmax_fusion: false