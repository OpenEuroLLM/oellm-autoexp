# @package backend.megatron
# Dataset settings for multilingual scaling on LUMI, using the READABLE
# long-ctx-sample data in project_465002530.
#
# WHY THIS EXISTS (and when NOT to use it)
# ----------------------------------------
# The real config (exp_diana: oellm_256k_lumi_train.yaml) points at
#   /scratch/project_462000963/.../catalogue/...
# which requires membership of project_462000963. This config points instead at
#   /scratch/project_465002530/preprocessed/oellm-v1-256k/long-ctx-sample/
# which is readable, uses the SAME openeurollm 256k tokenizer, and was sampled
# from that very data (see the .stats.txt files next to the .bin files).
#
# *** long-ctx-sample is a LONG-DOCUMENT-BIASED SAMPLE, not the pretraining
# *** distribution. For hplt3-fra: 3.5% of source tokens are in long docs vs
# *** 71% in the sample (~20x oversampling); ~32B tokens total across 153 files.
#
# USE FOR:     pipeline validation; a controlled Muon-vs-Adam comparison where
#              YOU run both arms (identical data => internally valid contrast).
# DO NOT USE:  to compare against the existing 0.1B_ne Adam baselines in
#              /scratch/project_465002530/multilingual_scaling/0.1B_ne/training/.
#              Those ran on the real mix. The numbers are NOT comparable.
#
# Once project_462000963 access lands, switch to oellm_256k_lumi_train (from
# exp_diana) -- only data_args_path changes, nothing else in the pipeline.

max_position_embeddings: ${.seq_length}
split: '99,1,0'
create_attention_mask_in_dataloader: False

# Generated by muon_smoke/build_longctx_datamix.py (run it with --write first).
# Official "option 4" blend weights, remapped onto long-ctx-sample filenames,
# with unavailable entries (e.g. kat_Geor) dropped and the rest renormalized.
data_args_path: /scratch/project_465002530/users/laingsam/oellm-muon/muon_smoke/datamix4-longctx-lumi.txt

# Tokenizer: HF repo id, served from the shared cache
# (/scratch/project_465002530/cache/huggingface). Same as the real runs.
tokenizer_type: HuggingFaceTokenizer
tokenizer_model: openeurollm/tokenizer-256k

seq_length: 4096
dataloader_type: "cyclic"
num_workers: 7
num_dataset_builder_threads: 7
trust_remote_code: True
