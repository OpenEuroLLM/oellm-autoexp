# @package backend.megatron
defaults:
  - decay_phase_base

# 0.9B non-embedding (ne) dense Qwen3-like model
# Configuration from: https://docs.google.com/spreadsheets/d/17LXPs6O9_6cL7P2KVEJF8LTy5zhy0qLNXEVGRCYOzhY/edit?gid=0#gid=0

# MODEL
num_layers: 28
hidden_size: 1536
ffn_hidden_size: 4608
kv_channels: 128
swiglu: True
add_bias_linear: False
init_method_std: 0.02

# Attention
num_attention_heads: 16
num_query_groups: 8
group_query_attention: True
attention_softmax_in_fp32: False # OpenSci style
use_flash_attn: True

# Position Embedding
position_embedding_type: "rope"
rotary_base: 10000
rotary_percent: 1.0
untie_embeddings_and_output_weights: False

# Sequence / Dataloader
max_position_embeddings: ${.seq_length}
seq_length: 4096
create_attention_mask_in_dataloader: False
dataloader_type: "cyclic"
tokenizer_type: HuggingFaceTokenizer

# Normalization
normalization: RMSNorm
norm_epsilon: 1.e-5 # rmsnorm epsilon
qk_layernorm: True # enable qk-norm
bf16: True

# Disable dropout
attention_dropout: 0.0
hidden_dropout: 0.0

# OPTIMIZER
optimizer: adam
adam_beta1: 0.9
adam_beta2: 0.95
adam_eps: 1.e-8
clip_grad: 1.0
weight_decay: 0.1

# SCHEDULER
min_lr: 0.0
lr_decay_style: WSD
lr_wsd_decay_style: linear
lr_warmup_iters: 2000 # Fixed for all.

# TRAINING, PARALLELISM
recompute_activations: False
use_torch_fsdp2: False # it's either this or the next 4 args
tensor_model_parallel_size: 1
pipeline_model_parallel_size: 1
context_parallel_size: 1
sequence_parallel: True

# DISTRIBUTED OPTIM
use_distributed_optimizer: True

# COMM OPTIONS
distributed_backend: nccl
distributed_timeout_minutes: 60

# PROFILE
profile: False
use_pytorch_profiler: False
profile_ranks: [0]
profile_step_start: 5
profile_step_end: 12

# EVALS
# Eval interval scales inversely with global batch size,
# calibrated so that gbsz=1024 evals every 200 iterations.
eval_interval: "${oc.eval:'int(204800 // ${backend.megatron.global_batch_size})'}"
eval_iters: 100

# LOGGING
log_interval: 1
log_progress: True
log_throughput: True
tensorboard_queue_size: 5
log_timers_to_tensorboard: True

# CHECKPOINT FORMAT
ckpt_format: "torch_dist"
# Checkpoint interval scales inversely with global batch size,
# calibrated so that gbsz=1024 saves every 500 iterations.
save_interval: "${oc.eval:'int(512000 // ${backend.megatron.global_batch_size})'}"
save: ${job.base_output_dir}/checkpoints
load: ${.save}

# Base training configuration (overridden by sweep)
micro_batch_size: 16    # overridden by sweep
global_batch_size: 128  # overridden by sweep
lr: 2.e-3               # overridden by sweep
seed: 1234