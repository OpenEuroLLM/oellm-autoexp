type: product

groups:
  # GROUP 0: dynamic job name + wandb name (from the sweep point's own params).
  # Identical formula to the training sweep, so a "stable"/"decayNBT" eval
  # point's job.name matches its training counterpart's job.name exactly --
  # that's what lets the base val config's default
  #   load: ".../training/${job.name}/checkpoints"
  # find the right training checkpoint dir without any sibling reference.
  # "branchNBT"/"endNBT" points (GROUP 2 below) don't have a training-side
  # counterpart with that name, so they override `load` explicitly instead.
  - type: list
    configs:
      - job.name: "qwen3_dense_0.1B_ne_lr\\${backend.megatron.lr}_gbsz\\${backend.megatron.global_batch_size}_\\${stage}\\${backend.megatron.aux.job_horizon_suffix}"
        backend.megatron.wandb_exp_name: "\\${job.name}"

  # GROUP 1: Hyperparameter configurations -- mirrors GROUP 1 of
  # /sweep/multilingual_scaling/training/qwen3_dense_0.1B_ne_v2.yaml exactly
  # (same 16 combos, same aux.tokens / center / cross / diagonal_tokens_set /
  # stable_launch_tier per combo). This must stay in sync with that file:
  # the *_tokens_set fields are what gate which decay/branch/end checkpoints
  # get evaluated (see GROUP 2 + filter below), and aux.tokens must match the
  # training combo's max_decay_tokens for stable job-name resolution to find
  # the right checkpoint dir.
  #
  # backend.megatron.aux.skip_stable_launch is intentionally NOT carried over
  # from the training sweep: it only controls whether the TRAINING stable job
  # gets (re)submitted. On the eval side we always want to evaluate the
  # stable checkpoint regardless of whether this training sweep invocation
  # submitted it or it was reused from an earlier run -- job-name resolution
  # finds the right checkpoint dir either way (see checkpoint_reuse_run
  # comments below, copied from the training grid for context).
  #
  # aux.max_tokens is a second, never-overridden copy of aux.tokens (which
  # GROUP 2's decay/branch/end stages DO override, per-stage, to their own
  # budget). It's read by the filter below to drop an endNBT point whenever
  # N equals the combo's own max/stable budget -- in that case endNBT and
  # stable would otherwise evaluate the exact same checkpoint file twice
  # (this happens for 7 of 16 combos below, wherever one of the
  # *_tokens_set values equals aux.tokens).
  - type: list
    configs:
      # ---- gbsz 64 ----
      # aux.tokens pinned to 12_000_000_000 (an existing training checkpoint at that
      # budget is reused) rather than the max of this combo's remaining decay set below.
      - backend.megatron.lr: 5.e-4
        backend.megatron.global_batch_size: 64
        backend.megatron.micro_batch_size: 4
        backend.megatron.aux.tokens: 12_000_000_000
        backend.megatron.aux.max_tokens: 12_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "{6_000_000_000}"
        backend.megatron.aux.diagonal_tokens_set: "set()"
        backend.megatron.aux.stable_launch_tier:  cross

      # aux.tokens pinned to 50_000_000_000 (an existing training checkpoint at that
      # budget is reused) rather than the max of this combo's remaining decay set below.
      - backend.megatron.lr: 2.e-3
        backend.megatron.global_batch_size: 64
        backend.megatron.micro_batch_size: 4
        backend.megatron.aux.tokens: 50_000_000_000
        backend.megatron.aux.max_tokens: 50_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "{6_000_000_000}"
        backend.megatron.aux.diagonal_tokens_set: "set()"
        backend.megatron.aux.stable_launch_tier:  cross


      # ---- gbsz 128 ----
      - backend.megatron.lr: 5.e-4
        backend.megatron.global_batch_size: 128
        backend.megatron.micro_batch_size: 4
        backend.megatron.aux.tokens: 12_000_000_000
        backend.megatron.aux.max_tokens: 12_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "{12_000_000_000}"
        backend.megatron.aux.diagonal_tokens_set: "{6_000_000_000}"
        backend.megatron.aux.stable_launch_tier:  cross

      # aux.tokens pinned to 300_000_000_000 (an existing training checkpoint at that
      # budget is reused) rather than the max of this combo's remaining decay set below.
      - backend.megatron.lr: 1.e-3
        backend.megatron.global_batch_size: 128
        backend.megatron.micro_batch_size: 4
        backend.megatron.aux.tokens: 300_000_000_000
        backend.megatron.aux.max_tokens: 300_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "{6_000_000_000}"
        backend.megatron.aux.diagonal_tokens_set: "{80_000_000_000}"
        backend.megatron.aux.stable_launch_tier:  cross

      # aux.tokens pinned to 120_000_000_000 (an existing training checkpoint at that
      # budget is reused) rather than the max of this combo's remaining decay set below.
      - backend.megatron.lr: 2.e-3
        backend.megatron.global_batch_size: 128
        backend.megatron.micro_batch_size: 4
        backend.megatron.aux.tokens: 120_000_000_000
        backend.megatron.aux.max_tokens: 120_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "{12_000_000_000}"
        backend.megatron.aux.diagonal_tokens_set: "{6_000_000_000}"
        backend.megatron.aux.stable_launch_tier:  cross

      # aux.tokens pinned to 300_000_000_000 (an existing training checkpoint at that
      # budget is reused) rather than the max of this combo's remaining decay set below.
      - backend.megatron.lr: 4.e-3
        backend.megatron.global_batch_size: 128
        backend.megatron.micro_batch_size: 4
        backend.megatron.aux.tokens: 300_000_000_000
        backend.megatron.aux.max_tokens: 300_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "set()"
        backend.megatron.aux.diagonal_tokens_set: "{80_000_000_000}"
        backend.megatron.aux.stable_launch_tier:  diagonal


      # ---- gbsz 256 ----
      - backend.megatron.lr: 5.e-4
        backend.megatron.global_batch_size: 256
        backend.megatron.micro_batch_size: 4
        backend.megatron.aux.tokens: 12_000_000_000
        backend.megatron.aux.max_tokens: 12_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "set()"
        backend.megatron.aux.diagonal_tokens_set: "{12_000_000_000}"
        backend.megatron.aux.stable_launch_tier:  diagonal

      # aux.tokens pinned to 300_000_000_000 (an existing training checkpoint at that
      # budget is reused) rather than the max of this combo's remaining decay set below.
      - backend.megatron.lr: 1.e-3
        backend.megatron.global_batch_size: 256
        backend.megatron.micro_batch_size: 4
        backend.megatron.aux.tokens: 300_000_000_000
        backend.megatron.aux.max_tokens: 300_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "{12_000_000_000, 20_000_000_000, 30_000_000_000, 50_000_000_000}"
        backend.megatron.aux.diagonal_tokens_set: "set()"
        backend.megatron.aux.stable_launch_tier:  cross

      # aux.tokens pinned to 300_000_000_000 (an existing training checkpoint at that
      # budget is reused) rather than the max of this combo's remaining decay set below.
      - backend.megatron.lr: 2.e-3
        backend.megatron.global_batch_size: 256
        backend.megatron.micro_batch_size: 4
        backend.megatron.aux.tokens: 300_000_000_000
        backend.megatron.aux.max_tokens: 300_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "{120_000_000_000}"
        backend.megatron.aux.diagonal_tokens_set: "{12_000_000_000}"
        backend.megatron.aux.stable_launch_tier:  cross

      # aux.tokens pinned to 300_000_000_000 (an existing training checkpoint at that
      # budget is reused) rather than the max of this combo's remaining decay set below.
      - backend.megatron.lr: 4.e-3
        backend.megatron.global_batch_size: 256
        backend.megatron.micro_batch_size: 4
        backend.megatron.aux.tokens: 300_000_000_000
        backend.megatron.aux.max_tokens: 300_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "{20_000_000_000, 30_000_000_000, 50_000_000_000}"
        backend.megatron.aux.diagonal_tokens_set: "set()"
        backend.megatron.aux.stable_launch_tier:  cross


      # ---- gbsz 512 ----
      - backend.megatron.lr: 1.e-3
        backend.megatron.global_batch_size: 512
        backend.megatron.micro_batch_size: 4
        backend.megatron.aux.tokens: 300_000_000_000
        backend.megatron.aux.max_tokens: 300_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "{120_000_000_000, 200_000_000_000, 300_000_000_000}"
        backend.megatron.aux.diagonal_tokens_set: "{20_000_000_000, 30_000_000_000, 50_000_000_000, 80_000_000_000}"
        backend.megatron.aux.stable_launch_tier:  cross

      # aux.tokens pinned to 300_000_000_000 (an existing training checkpoint at that
      # budget is reused) rather than the max of this combo's remaining decay set below.
      - backend.megatron.lr: 2.e-3
        backend.megatron.global_batch_size: 512
        backend.megatron.micro_batch_size: 4
        backend.megatron.aux.tokens: 300_000_000_000
        backend.megatron.aux.max_tokens: 300_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "{20_000_000_000, 30_000_000_000, 50_000_000_000}"
        backend.megatron.aux.diagonal_tokens_set: "set()"
        backend.megatron.aux.stable_launch_tier:  cross

      - backend.megatron.lr: 4.e-3
        backend.megatron.global_batch_size: 512
        backend.megatron.micro_batch_size: 4
        backend.megatron.aux.tokens: 300_000_000_000
        backend.megatron.aux.max_tokens: 300_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "{120_000_000_000, 200_000_000_000, 300_000_000_000}"
        backend.megatron.aux.diagonal_tokens_set: "{20_000_000_000, 30_000_000_000, 50_000_000_000, 80_000_000_000}"
        backend.megatron.aux.stable_launch_tier:  cross


      # ---- gbsz 1024 ----
      - backend.megatron.lr: 1.e-3
        backend.megatron.global_batch_size: 1024
        backend.megatron.micro_batch_size: 4
        backend.megatron.aux.tokens: 300_000_000_000
        backend.megatron.aux.max_tokens: 300_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "set()"
        backend.megatron.aux.diagonal_tokens_set: "{120_000_000_000, 200_000_000_000, 300_000_000_000}"
        backend.megatron.aux.stable_launch_tier:  diagonal

      - backend.megatron.lr: 2.e-3
        backend.megatron.global_batch_size: 1024
        backend.megatron.micro_batch_size: 4
        backend.megatron.aux.tokens: 300_000_000_000
        backend.megatron.aux.max_tokens: 300_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "{120_000_000_000, 200_000_000_000, 300_000_000_000}"
        backend.megatron.aux.diagonal_tokens_set: "set()"
        backend.megatron.aux.stable_launch_tier:  cross

      - backend.megatron.lr: 4.e-3
        backend.megatron.global_batch_size: 1024
        backend.megatron.micro_batch_size: 4
        backend.megatron.aux.tokens: 300_000_000_000
        backend.megatron.aux.max_tokens: 300_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "set()"
        backend.megatron.aux.diagonal_tokens_set: "{120_000_000_000, 200_000_000_000, 300_000_000_000}"
        backend.megatron.aux.stable_launch_tier:  diagonal

  # GROUP 2: Multi-stage evaluation -- 1 stable + 9 decay + 9 branch + 9 end.
  - type: list
    configs:
      # STABLE PHASE: loads the stable training run's own final checkpoint
      # (iter == train_iters, always written at end of training) and
      # evaluates it. Unchanged from validation/v1.
      - stage: stable
        backend.megatron.train_iters: "\\${oc.eval:'(\\${backend.megatron.aux.tokens}+\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size}-1)//(\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size})'}"
        backend.megatron.lr_wsd_decay_iters: 0
        backend.megatron.aux.start_iter: "\\${oc.eval:'int(((\\${backend.megatron.aux.tokens}+\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size}-1)//(\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size}))*(1-\\${backend.megatron.aux.decay_fraction}))'}"
        backend.megatron.aux.job_horizon_suffix: "\\${oc.eval:'str(\\${backend.megatron.aux.tokens}//1_000_000_000)+\"BT\"'}"
        job.start_condition:
          class_name: FileExistsCondition
          path: "\\${backend.megatron.load}/iter_\\${oc.eval:'str(\\${backend.megatron.train_iters}).zfill(7)'}"

      # DECAY PHASES: evaluate each decay training checkpoint (its own final,
      # post-cooldown checkpoint). Unchanged from validation/v1.
      - type: list
        defaults:
          backend.megatron.aux.decay_fraction: "\\${backend.megatron.aux.cooldown_decay_fraction}"
          backend.megatron.train_iters: "\\${oc.eval:'(\\${backend.megatron.aux.tokens}+\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size}-1)//(\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size})'}"
          backend.megatron.lr_wsd_decay_iters: "\\${oc.eval:'int(((\\${backend.megatron.aux.tokens}+\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size}-1)//(\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size}))*\\${backend.megatron.aux.decay_fraction})'}"
          backend.megatron.aux.start_iter: "\\${oc.eval:'int(((\\${backend.megatron.aux.tokens}+\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size}-1)//(\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size}))*(1-\\${backend.megatron.aux.decay_fraction}))'}"
          job.start_condition:
            class_name: FileExistsCondition
            path: "\\${backend.megatron.load}/iter_\\${oc.eval:'str(\\${backend.megatron.train_iters}).zfill(7)'}"
          job.cancel_condition: null
        configs:
          - stage: decay6BT
            backend.megatron.aux.tokens: 6_000_000_000
          - stage: decay12BT
            backend.megatron.aux.tokens: 12_000_000_000
          - stage: decay20BT
            backend.megatron.aux.tokens: 20_000_000_000
          - stage: decay30BT
            backend.megatron.aux.tokens: 30_000_000_000
          - stage: decay50BT
            backend.megatron.aux.tokens: 50_000_000_000
          - stage: decay80BT
            backend.megatron.aux.tokens: 80_000_000_000
          - stage: decay120BT
            backend.megatron.aux.tokens: 120_000_000_000
          - stage: decay200BT
            backend.megatron.aux.tokens: 200_000_000_000
          - stage: decay300BT
            backend.megatron.aux.tokens: 300_000_000_000

      # BRANCH PHASES (NEW): evaluate the stable run's save_step_br_N
      # checkpoint -- the checkpoint at 80% of budget N that a decayNBT run
      # would fork its cooldown from. Measures model quality right before
      # decay starts.
      #
      # These points have no training-side directory of their own (training
      # only writes "stable" and "decayNBT" dirs), so `load` can't be found
      # via job-name matching like the decay phases above. Instead it's
      # pulled from the "stable" sibling POINT DEFINED IN THIS SAME FILE
      # (GROUP 2 above): that point's own `load` already resolves to the
      # training stable job's checkpoint dir via the base val config's
      # default `load: ".../training/${job.name}/checkpoints"` template.
      # (Sibling refs only resolve within one sweep file's DAG -- there is
      # no way to sibling-reference the training sweep directly from here --
      # so this indirection through the local "stable" point is required.)
      #
      # ckpt_step (rather than a `load` path with the iter baked in) is what
      # selects the specific checkpoint within that directory; the formula
      # is the 80%-of-budget-N one from the training sweep's save_step_br_N
      # slots, duplicated here for the same cross-file reason.
      - type: list
        defaults:
          backend.megatron.load: "\\${sibling.stable.backend.megatron.load}"
          backend.megatron.train_iters: "\\${oc.eval:'(\\${backend.megatron.aux.tokens}+\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size}-1)//(\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size})'}"
          backend.megatron.lr_wsd_decay_iters: 0
          backend.megatron.ckpt_step: "\\${oc.eval:'int(((\\${backend.megatron.aux.tokens}+\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size}-1)//(\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size}))*(1-\\${backend.megatron.aux.cooldown_decay_fraction}))'}"
          job.start_condition:
            class_name: FileExistsCondition
            path: "\\${backend.megatron.load}/iter_\\${oc.eval:'str(\\${backend.megatron.ckpt_step}).zfill(7)'}"
          job.cancel_condition: null
        configs:
          - stage: branch6BT
            backend.megatron.aux.tokens: 6_000_000_000
          - stage: branch12BT
            backend.megatron.aux.tokens: 12_000_000_000
          - stage: branch20BT
            backend.megatron.aux.tokens: 20_000_000_000
          - stage: branch30BT
            backend.megatron.aux.tokens: 30_000_000_000
          - stage: branch50BT
            backend.megatron.aux.tokens: 50_000_000_000
          - stage: branch80BT
            backend.megatron.aux.tokens: 80_000_000_000
          - stage: branch120BT
            backend.megatron.aux.tokens: 120_000_000_000
          - stage: branch200BT
            backend.megatron.aux.tokens: 200_000_000_000
          - stage: branch300BT
            backend.megatron.aux.tokens: 300_000_000_000

      # END PHASES (NEW): evaluate the stable run's save_step_end_N
      # checkpoint -- the un-decayed model at exactly 100% of budget N
      # tokens (as opposed to decayNBT, which is the *decayed* model at
      # budget N). Same `load`-via-sibling indirection as BRANCH above.
      #
      # ckpt_step at 100% of budget N is exactly the same ceil-division
      # formula as train_iters above (both equal ceil(aux.tokens/(seq*gbsz))),
      # so it's just aliased to train_iters rather than duplicating the
      # formula a second time.
      - type: list
        defaults:
          backend.megatron.load: "\\${sibling.stable.backend.megatron.load}"
          backend.megatron.train_iters: "\\${oc.eval:'(\\${backend.megatron.aux.tokens}+\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size}-1)//(\\${backend.megatron.seq_length}*\\${backend.megatron.global_batch_size})'}"
          backend.megatron.lr_wsd_decay_iters: 0
          backend.megatron.ckpt_step: "\\${backend.megatron.train_iters}"
          job.start_condition:
            class_name: FileExistsCondition
            path: "\\${backend.megatron.load}/iter_\\${oc.eval:'str(\\${backend.megatron.ckpt_step}).zfill(7)'}"
          job.cancel_condition: null
        configs:
          - stage: end6BT
            backend.megatron.aux.tokens: 6_000_000_000
          - stage: end12BT
            backend.megatron.aux.tokens: 12_000_000_000
          - stage: end20BT
            backend.megatron.aux.tokens: 20_000_000_000
          - stage: end30BT
            backend.megatron.aux.tokens: 30_000_000_000
          - stage: end50BT
            backend.megatron.aux.tokens: 50_000_000_000
          - stage: end80BT
            backend.megatron.aux.tokens: 80_000_000_000
          - stage: end120BT
            backend.megatron.aux.tokens: 120_000_000_000
          - stage: end200BT
            backend.megatron.aux.tokens: 200_000_000_000
          - stage: end300BT
            backend.megatron.aux.tokens: 300_000_000_000

# Same filter shape as validation/v1 and the training sweep (tier routing +
# warmup-ratio guard), plus one addition: the "\\${stage}\".startswith(\"end\")
# and aux.tokens == aux.max_tokens" clause drops an endNBT point whenever N
# equals the combo's own stable/max budget, since that checkpoint is already
# evaluated by the "stable" point itself (see aux.max_tokens comment in
# GROUP 1 above). Deliberately compares against aux.max_tokens (a plain
# per-combo field) rather than sibling.stable's resolved values: the
# "stable" point would otherwise have to resolve itself as its own sibling
# to evaluate this same filter expression, which is unsupported. branchNBT
# is never affected -- 80% of budget N never equals 100% of the same or any
# other budget.
#
# Everything else is unchanged: the "not stable" clause still gates any
# non-stable stage purely by `aux.tokens in <tier>_tokens_set`, and
# branch/end points set aux.tokens=N exactly like decay points do -- so a
# surviving branchNBT/endNBT point exists iff the same-budget decayNBT
# point does, i.e. only for (combo, N) pairs that actually have a decay.
filter: "\\${oc.eval:'(((\"\\${stage}\" == \"stable\" and (\"\\${backend.megatron.aux.priority_tier}\" == \"all\" or \"\\${backend.megatron.aux.priority_tier}\" == \"\\${backend.megatron.aux.stable_launch_tier}\")) or (\"\\${stage}\" != \"stable\" and (not (\"\\${stage}\".startswith(\"end\") and \\${backend.megatron.aux.tokens} == \\${backend.megatron.aux.max_tokens})) and ((\"\\${backend.megatron.aux.priority_tier}\" == \"all\" and \\${backend.megatron.aux.tokens} in \\${backend.megatron.aux.center_tokens_set} | \\${backend.megatron.aux.cross_tokens_set} | \\${backend.megatron.aux.diagonal_tokens_set}) or (\"\\${backend.megatron.aux.priority_tier}\" == \"center\" and \\${backend.megatron.aux.tokens} in \\${backend.megatron.aux.center_tokens_set}) or (\"\\${backend.megatron.aux.priority_tier}\" == \"cross\" and \\${backend.megatron.aux.tokens} in \\${backend.megatron.aux.cross_tokens_set}) or (\"\\${backend.megatron.aux.priority_tier}\" == \"diagonal\" and \\${backend.megatron.aux.tokens} in \\${backend.megatron.aux.diagonal_tokens_set})))) and (\\${backend.megatron.lr_warmup_iters} / \\${backend.megatron.train_iters} < 0.3))'}"


### Job counts (per `backend.megatron.aux.priority_tier`, priority_tier=all)
# Group 1 (hyperparameter combos): 16 (same as training v2)
# Group 2 (stages): 1 stable + 9 decay + 9 branch + 9 end = 28
# Pre-filter product: 16 x 28 = 448 sweep points
#
# Unlike the training sweep, aux.skip_stable_launch doesn't apply here, so
# all 16 stables are evaluated regardless of whether their training run was
# (re)submitted by this grid or reused from an earlier one.
#
# Every remaining combo's decay-token sets union to 2.8 tokens on average
# (45 decay points total).
# Branch shares the exact same gating as decay (aux.tokens in the same
# per-combo tier sets), so it also produces 45 points. End uses that same
# gating minus the dedupe clause above, which drops it for the 7 combos
# where a decay sits exactly at the combo's own max budget:
#   16 stable + 45 decay + 45 branch + 38 end = 144 jobs (priority_tier=all)
#
# i.e. for every decayNBT checkpoint you'd have evaluated before this
# change, you now also get its branchNBT (pre-decay, 80% of budget N)
