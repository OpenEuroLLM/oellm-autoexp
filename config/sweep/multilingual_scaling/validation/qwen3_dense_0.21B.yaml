# Validation sweep for the 0.21B (Porian) / 0.1B_ne multilingual_scaling grid.
# GROUP 1 must mirror training/qwen3_dense_0.21B.yaml entry-for-entry (same order, aux.tokens
# and *_tokens_set), since sibling lookups and checkpoint paths depend on it. Provenance
# comments live in the training file only.
type: product

groups:
  # GROUP 0: job naming, mirrors the training sweep exactly.
  - type: list
    configs:
      - job.name: "qwen3_dense_0.1B_ne_lr\\${backend.megatron.lr}_gbsz\\${backend.megatron.global_batch_size}_\\${stage}\\${backend.megatron.aux.job_horizon_suffix}"
        backend.megatron.wandb_exp_name: "\\${job.name}"

  # GROUP 1: HP grid, mirrors training/qwen3_dense_0.21B.yaml.
