        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "{120_000_000_000, 200_000_000_000, 300_000_000_000}"
        backend.megatron.aux.diagonal_tokens_set: "{12_000_000_000, 20_000_000_000, 30_000_000_000, 50_000_000_000, 80_000_000_000}"
        backend.megatron.aux.stable_launch_tier:  cross

      # stable300BT
      - backend.megatron.lr: 2.e-3
        backend.megatron.global_batch_size: 512
        backend.megatron.micro_batch_size: 4
        backend.megatron.aux.tokens: 300_000_000_000
        backend.megatron.aux.max_tokens: 300_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "{12_000_000_000, 20_000_000_000, 30_000_000_000, 50_000_000_000, 80_000_000_000, 120_000_000_000, 200_000_000_000, 300_000_000_000}"
        backend.megatron.aux.diagonal_tokens_set: "set()"
        backend.megatron.aux.stable_launch_tier:  cross

      # stable300BT
      - backend.megatron.lr: 4.e-3
        backend.megatron.global_batch_size: 512
        backend.megatron.micro_batch_size: 4
        backend.megatron.aux.tokens: 300_000_000_000
        backend.megatron.aux.max_tokens: 300_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "{120_000_000_000, 200_000_000_000, 300_000_000_000}"
        backend.megatron.aux.diagonal_tokens_set: "{12_000_000_000, 20_000_000_000, 30_000_000_000, 50_000_000_000, 80_000_000_000}"
        backend.megatron.aux.stable_launch_tier:  cross

      # stable300BT
      - backend.megatron.lr: 8.e-3
        backend.megatron.global_batch_size: 512
        backend.megatron.micro_batch_size: 4
        backend.megatron.aux.tokens: 300_000_000_000
        backend.megatron.aux.max_tokens: 300_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "{30_000_000_000, 50_000_000_000, 80_000_000_000, 120_000_000_000}"
        backend.megatron.aux.diagonal_tokens_set: "{20_000_000_000, 200_000_000_000, 300_000_000_000}"
        backend.megatron.aux.stable_launch_tier:  cross

      # ---- gbsz 1024 ----
      # stable300BT
      - backend.megatron.lr: 1.e-3
        backend.megatron.global_batch_size: 1024
        backend.megatron.micro_batch_size: 4
        backend.megatron.aux.tokens: 300_000_000_000
        backend.megatron.aux.max_tokens: 300_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "set()"
        backend.megatron.aux.diagonal_tokens_set: "{120_000_000_000, 200_000_000_000, 300_000_000_000}"
        backend.megatron.aux.stable_launch_tier:  diagonal

      # stable300BT
      - backend.megatron.lr: 2.e-3
        backend.megatron.global_batch_size: 1024
        backend.megatron.micro_batch_size: 4
        backend.megatron.aux.tokens: 300_000_000_000
        backend.megatron.aux.max_tokens: 300_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "{120_000_000_000, 200_000_000_000, 300_000_000_000}"
        backend.megatron.aux.diagonal_tokens_set: "{30_000_000_000, 50_000_000_000, 80_000_000_000}"
        backend.megatron.aux.stable_launch_tier:  cross

      # stable300BT
      - backend.megatron.lr: 4.e-3
        backend.megatron.global_batch_size: 1024
        backend.megatron.micro_batch_size: 4
        backend.megatron.aux.tokens: 300_000_000_000
        backend.megatron.aux.max_tokens: 300_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "{30_000_000_000, 50_000_000_000, 80_000_000_000}"
        backend.megatron.aux.diagonal_tokens_set: "{120_000_000_000, 200_000_000_000, 300_000_000_000}"
        backend.megatron.aux.stable_launch_tier:  cross

      # stable300BT
      - backend.megatron.lr: 8.e-3
        backend.megatron.global_batch_size: 1024
        backend.megatron.micro_batch_size: 4
        backend.megatron.aux.tokens: 300_000_000_000
        backend.megatron.aux.max_tokens: 300_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "{200_000_000_000, 300_000_000_000}"
        backend.megatron.aux.diagonal_tokens_set: "{30_000_000_000, 50_000_000_000, 80_000_000_000, 120_000_000_000}"
        backend.megatron.aux.stable_launch_tier:  cross

      # ---- gbsz 2048 ----
      # stable300BT
      - backend.megatron.lr: 2.e-3
        backend.megatron.global_batch_size: 2048
        backend.megatron.micro_batch_size: 4
        backend.megatron.aux.tokens: 300_000_000_000
        backend.megatron.aux.max_tokens: 300_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "set()"
        backend.megatron.aux.diagonal_tokens_set: "{200_000_000_000, 300_000_000_000}"
        backend.megatron.aux.stable_launch_tier:  diagonal

      # stable300BT
      - backend.megatron.lr: 4.e-3
        backend.megatron.global_batch_size: 2048
        backend.megatron.micro_batch_size: 4
        backend.megatron.aux.tokens: 300_000_000_000
        backend.megatron.aux.max_tokens: 300_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "{200_000_000_000, 300_000_000_000}"
        backend.megatron.aux.diagonal_tokens_set: "set()"
        backend.megatron.aux.stable_launch_tier:  cross

