# Training sweep for the 0.71B (Porian) / 0.4B_ne multilingual_scaling grid.
#
# Single source of truth for this model size: the union of every (lr, gbsz) combo ever
# planned (formerly split across training/v1 [Leonardo/MN5], v2 and v3 [LUMI]), merged on
# 2026-11-03 against what actually exists on disk and in the loss records. See README.md
# ("The merged grid") for the merge rules; the per-entry comments record provenance.
#
# Launching this file only submits what is still missing:
#   * aux.done_tokens_set   -- decay budgets already trained on any cluster (filtered out).
#   * aux.skip_stable_launch -- true when no pending decay needs this stable to train further.
type: product

groups:
  # GROUP 0: job naming.
  - type: list
    configs:
      - job.name: "qwen3_dense_0.4B_ne_lr\\${backend.megatron.lr}_gbsz\\${backend.megatron.global_batch_size}_\\${stage}\\${backend.megatron.aux.job_horizon_suffix}"
        backend.megatron.wandb_exp_name: "\\${job.name}"

  # GROUP 1: HP grid, one entry per stable trajectory (lr, gbsz, stable horizon). The same
  # (lr, gbsz) can appear more than once when it has several real stable runs; siblings are
  # matched by entry index, so each decay branches off its own entry's stable.
  - type: list
    defaults:
      backend.megatron.aux.skip_stable_launch: false
      backend.megatron.aux.done_tokens_set: "set()"
      backend.megatron.aux.extend_stable_source: ""
    configs:
      # ---- gbsz 32 ----
      # stable6BT -- versions v1; LUMI stable dir, latest_checkpointed_iteration=None.
      # done: 6BT
      - backend.megatron.lr: 1.e-3
        backend.megatron.global_batch_size: 32
        backend.megatron.micro_batch_size: 2
        backend.megatron.aux.tokens: 6_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "{6_000_000_000}"
        backend.megatron.aux.diagonal_tokens_set: "set()"
        backend.megatron.aux.stable_launch_tier:  cross
        backend.megatron.aux.done_tokens_set:     "{6_000_000_000}"
        backend.megatron.aux.skip_stable_launch:  true
        backend.megatron.split:                   "99,1,0"

      # ---- gbsz 64 ----
      # stable50BT -- versions v1,v2; LUMI stable dir, latest_checkpointed_iteration=None.
      # done: 6, 12BT
      # dropped (planned in v1/v2, never trained, not re-selected by v3): 20, 30, 50BT
      - backend.megatron.lr: 5.e-4
        backend.megatron.global_batch_size: 64
        backend.megatron.micro_batch_size: 2
        backend.megatron.aux.tokens: 50_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "{6_000_000_000}"
        backend.megatron.aux.diagonal_tokens_set: "{12_000_000_000}"
        backend.megatron.aux.stable_launch_tier:  cross
        backend.megatron.aux.done_tokens_set:     "{6_000_000_000, 12_000_000_000}"
        backend.megatron.aux.skip_stable_launch:  true
        backend.megatron.split:                   "100,0,0"

      # stable50BT -- versions v1; LUMI stable dir, latest_checkpointed_iteration=None.
      # done: 6, 12, 20, 30, 50BT
      - backend.megatron.lr: 1.e-3
        backend.megatron.global_batch_size: 64
        backend.megatron.micro_batch_size: 2
        backend.megatron.aux.tokens: 50_000_000_000
        backend.megatron.aux.center_tokens_set:   "{6_000_000_000}"
        backend.megatron.aux.cross_tokens_set:    "{12_000_000_000, 20_000_000_000, 30_000_000_000, 50_000_000_000}"
        backend.megatron.aux.diagonal_tokens_set: "set()"
        backend.megatron.aux.stable_launch_tier:  center
        backend.megatron.aux.done_tokens_set:     "{6_000_000_000, 12_000_000_000, 20_000_000_000, 30_000_000_000, 50_000_000_000}"
        backend.megatron.aux.skip_stable_launch:  true
        backend.megatron.split:                   "99,1,0"

      # stable50BT -- versions v1,v2; LUMI stable dir, latest_checkpointed_iteration=None.
      # done: 6, 12BT
      # dropped (planned in v1/v2, never trained, not re-selected by v3): 20, 30, 50BT
      - backend.megatron.lr: 2.e-3
        backend.megatron.global_batch_size: 64
        backend.megatron.micro_batch_size: 2
        backend.megatron.aux.tokens: 50_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "{6_000_000_000}"
        backend.megatron.aux.diagonal_tokens_set: "{12_000_000_000}"
        backend.megatron.aux.stable_launch_tier:  cross
        backend.megatron.aux.done_tokens_set:     "{6_000_000_000, 12_000_000_000}"
        backend.megatron.aux.skip_stable_launch:  true
        backend.megatron.split:                   "100,0,0"

      # stable6BT -- versions v3; LUMI stable dir, latest_checkpointed_iteration=22889.
      # done: 6BT
      - backend.megatron.lr: 4.e-3
        backend.megatron.global_batch_size: 64
        backend.megatron.micro_batch_size: 2
        backend.megatron.aux.tokens: 6_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "set()"
        backend.megatron.aux.diagonal_tokens_set: "{6_000_000_000}"
        backend.megatron.aux.stable_launch_tier:  diagonal
        backend.megatron.aux.done_tokens_set:     "{6_000_000_000}"
        backend.megatron.aux.skip_stable_launch:  true
        backend.megatron.split:                   "99,1,0"

      # ---- gbsz 128 ----
      # stable50BT -- versions v1,v2; LUMI stable dir, latest_checkpointed_iteration=None.
      # done: 6, 12, 20, 30, 50BT
      - backend.megatron.lr: 5.e-4
        backend.megatron.global_batch_size: 128
        backend.megatron.micro_batch_size: 2
        backend.megatron.aux.tokens: 50_000_000_000
        backend.megatron.aux.center_tokens_set:   "set()"
        backend.megatron.aux.cross_tokens_set:    "{6_000_000_000, 12_000_000_000, 20_000_000_000, 30_000_000_000, 50_000_000_000}"
        backend.megatron.aux.diagonal_tokens_set: "set()"
        backend.megatron.aux.stable_launch_tier:  cross
        backend.megatron.aux.done_tokens_set:     "{6_000_000_000, 12_000_000_000, 20_000_000_000, 30_000_000_000, 50_000_000_000}"
        backend.megatron.aux.skip_stable_launch:  true
        backend.megatron.split:                   "100,0,0"

      # stable120BT -- versions v1; LUMI stable dir, latest_checkpointed_iteration=None.
      # done: 6, 12, 20, 30, 50BT
      # dropped (planned in v1/v2, never trained, not re-selected by v3): 80, 120BT
      - backend.megatron.lr: 1.e-3
        backend.megatron.global_batch_size: 128
        backend.megatron.micro_batch_size: 2
