        backend.megatron.aux.skip_stable_launch:  true
        backend.megatron.split:                   "99,1,0"

      # stable300BT -- versions v1,v3; LUMI stable dir, latest_checkpointed_iteration=None.
      # done: 12, 20, 30, 50, 80, 120BT | to train: 6BT
