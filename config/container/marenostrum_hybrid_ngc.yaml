class_name: Container
image: ${oc.env:HYBRID_ENV,/gpfs/projects/ehpc533/users/korbip/hybrid_v019}/container/MegatronTraining-hybrid_x86_64_202610161937.sif
runtime: singularity
bind: ["/gpfs"]
env:
  MACHINE_NAME: MARENOSTRUM
python: "python"
