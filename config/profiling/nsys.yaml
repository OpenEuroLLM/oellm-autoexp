# @package profiling
provider: nsys
mode: timeline
ranks: [0]
output_dir: ${job.base_output_dir}/profiling
capture:
  kernel: true
  runtime: true
  communication: true
  memory: true
  markers: true
analysis:
  enabled: true
  steady_start_iteration: 5
  steady_end_iteration: null
  canvas: true
provider_options:
  force_overwrite: true
  export: sqlite
  sample: none
