defaults:
  - base
  - _self_

template_path: templates/snellius.sbatch
env:
  MACHINE_NAME: SNELLIUS
  HF_HOME: /scratch-shared/${oc.env:USER}/hf
  WANDB_MODE: online
  # Megatron requires this for deterministic ordering of overlapped
  # communication and compute streams.
  CUDA_DEVICE_MAX_CONNECTIONS: "1"
  # Snellius nodes expose no NVLink SHARP multicast, so skip Userbuffers
  # multicast setup (it otherwise fails during TE/UB initialisation).
  UB_SKIPMC: "1"
  # Point Triton at the driver stubs that `--nv` injects; Apptainer forwards the
  # host environment into the container, so exporting it here is enough.
  TRITON_LIBCUDA_PATH: "/.singularity.d/libs"
  # Read WANDB_API_KEY from the submitting shell; falls back to "" if unset.
  WANDB_API_KEY: ${oc.env:WANDB_API_KEY,""}
  NUM_NODES: "$SLURM_JOB_NUM_NODES"
  GPUS_PER_NODE: "1"
  NUM_GPUS_PER_NODE: "1"
  NUM_GPUS: "$((NUM_GPUS_PER_NODE*SLURM_NNODES))"
  PYTHONUNBUFFERED: "1"
  OMP_NUM_THREADS: "16"
  NCCL_SOCKET_IFNAME: "eno2np0"
  MASTER_ADDR: '$(scontrol show hostnames "$SLURM_JOB_NODELIST" | head -n 1)'
  MASTER_PORT: "20074"
launcher_cmd: "${oc.join:' ',${oc.maptmpl:'export %=\\'$%\\' ; \\\n',${oc.dict.keys:.env}}} \
  export LOCAL_ADDR=$(nslookup $(hostname) | grep \"Address: \" | sed \"s/Address: //\" | tail) ; \\\n\
  export RANK=$SLURM_PROCID ; export LOCAL_RANK=$SLURM_LOCALID ; \\\n\
  ${oc.select:container.runtime,singularity} exec \
  ${oc.join:' ',${oc.mapkeyvaltmpl:'--env %k=%v \\\n',${backend.env}}} \
  --nv \
  ${oc.join:' ',${oc.maptmpl:'--bind % \\\n',${container.bind}}} \
  ${oc.select:container.image,container.sif}"
srun:
  exclusive: true
  wait: 60
sbatch:
  nodes: 8
  ntasks_per_node: 1
  ntasks: ${.nodes}
  gpus_per_node: 4
  gres: null
  cpus_per_task: 64
  time: "1:00:00"
  exclusive: true
  account: null
