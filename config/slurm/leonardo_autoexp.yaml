defaults:
  - base
  - _self_

# Run jobs directly inside the `autoexp` conda env (no singularity).
# Used by the HF MoE metrics jobs, which need `accelerate` / current HF
# stack — easier to maintain via conda than rebuilding the container.
launcher_cmd: "export LOCAL_ADDR=$(nslookup $(hostname) | grep \"Address: \" | sed \"s/Address: //\" | tail) ; source /leonardo_work/OELLM_prod2026/users/ajha0001/miniforge3/etc/profile.d/conda.sh ; conda activate autoexp ; "
srun:
  exclusive: true
  wait: 60
  cpus_per_task: 8
  threads_per_core: 1
  gpu_bind: "none"
launcher_env_passthrough: true
env:
  MACHINE_NAME: LEONARDO
  HF_ALLOW_CODE_EVAL: "1"
  HF_DATASETS_OFFLINE: "1"
  TRANSFORMERS_OFFLINE: "1"
  MASTER_ADDR: "$(nslookup $(scontrol show hostnames \"$SLURM_JOB_NODELIST\" | head -n 1) | grep \"Address: \" | sed \"s/Address: //\" | tail) "
  MASTER_PORT: "20074"
  NUM_NODES: "$SLURM_JOB_NUM_NODES"
  GPUS_PER_NODE: "4"
  NUM_GPUS_PER_NODE: "4"
  NUM_GPUS: "$((NUM_GPUS_PER_NODE*SLURM_NNODES))"
  ARCH: "$(uname -m)"
  SLURM_CPUS_PER_TASK: "8"
  SLURM_ARRAY_TASK_ID: "$SLURM_ARRAY_TASK_ID"
sbatch:
  nodes: 1
  ntasks_per_node: 1
  ntasks: ${.nodes}
  gpus_per_node: 4
  cpus_per_task: 8
  gres: "gpu:4"
  gpu_bind: "none"
  time: "12:00:00"
  qos: ${oc.env:SLURM_QOS,null}
