defaults:
  - jupiter_autoexclude
  - _self_

# JUPITER pool host that avoids the fleet-wide node exclusion list ($JUPITER_EXCLUDE_NODES /
# production_training/jupiter_exclude_nodes.txt), re-read whenever the pool creates a host.
# Opt-in: use it for large or long pools; small eval pools are fine with plain
# jupiter_pool_host (every pool still avoids the nodes in its own <pool>/exclude_nodes).
template_path: "templates/pool_host.sbatch"
launcher_cmd: ""
sbatch:
  signal: "B:USR1@600"
